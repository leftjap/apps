<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"/>
<title>book</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
:root{
 --bg:#ffffff;--paper:#f6f4ee;--paper-2:#efece4;
 --line:#ececea;--line-2:#f0eee8;--hover:#f4f2ec;
 --ink-1:#15140f;--ink-2:#4a473f;--ink-3:#8a877d;--ink-4:#b8b5aa;
 --warm:#c2553a;--warm-soft:#d97757;
 --sans:"Pretendard",system-ui,sans-serif;
 --serif:"Noto Serif KR","Pretendard",serif;
 --mono:"JetBrains Mono",ui-monospace,monospace;
 --sh-pop:0 4px 12px -2px rgba(20,18,14,.10),0 24px 60px -16px rgba(20,18,14,.24);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#fff;font-family:var(--sans);color:var(--ink-1);-webkit-font-smoothing:antialiased;letter-spacing:-.012em}
#root{height:100%}
.bk{font-family:var(--sans);font-size:15px;color:var(--ink-1);background:var(--bg);letter-spacing:-.012em}
.bk button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:0}
.upper{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.i{stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
::selection{background:#f0eadf}
.vbtn:hover{filter:brightness(.97)}
.book-row{transition:background .12s}
.book-row:hover{background:var(--hover)}
.quote-row{transition:background .12s}
.quote-row:hover{background:rgba(244,242,236,0.5)}
.hov-actions{opacity:0;transition:opacity .12s}
.quote-row:hover .hov-actions, .hov-actions.force{opacity:1}
.ico-btn:hover{background:var(--hover) !important;color:var(--ink-1) !important}
.cal-cell-active:hover{background:var(--hover) !important}
input::placeholder{color:var(--ink-3)}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

/* ── app shell: fill viewport (replaces fixed 1440x900 artboards) ── */
.app-root{width:100%;height:100vh;height:100dvh;overflow:hidden;background:var(--bg)}
.app-root>.bk{width:100% !important;height:100% !important}
.app-root>.bk>main{overflow-x:hidden}
/* hide scrollbars everywhere (scroll still works) */
html,body,#root,.app-root,.app-root *{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,#root::-webkit-scrollbar,.app-root::-webkit-scrollbar,.app-root *::-webkit-scrollbar{width:0;height:0;display:none}

/* ── tablet/mobile: stack the main multi-column grids ── */
@media (max-width:1040px){
 .feed-grid{grid-template-columns:minmax(0,1fr) !important;gap:40px !important}
 .feed-grid aside{padding-top:0 !important}
 .day-grid{grid-template-columns:minmax(0,1fr) !important;gap:36px !important}
 .stats-row-1,.stats-row-2,.stats-row-3{grid-template-columns:minmax(0,1fr) !important}
}
@media (max-width:760px){
 .topbar{padding:12px 16px !important;gap:10px !important}
 .topbar-search{display:none !important}
 .topbar>.vbtn{margin-left:auto !important}
 .q-indent{margin-left:0 !important}
 .app-root>.bk>main>div{padding-left:20px !important;padding-right:20px !important}
 .word-hero{flex-direction:column !important;gap:20px !important}
 .word-hero>h1{font-size:96px !important}
 .word-cols{grid-template-columns:minmax(0,1fr) !important;gap:32px !important}
 .allbooks-grid{grid-template-columns:repeat(3,1fr) !important}
 .page-title-wrap{flex-direction:column !important;align-items:flex-start !important;gap:16px !important}
}
@media (max-width:480px){
 .allbooks-grid{grid-template-columns:repeat(2,1fr) !important}
}
</style>
</head><body>
<div id="root"></div>
<script type="text/babel" data-presets="react" src="data.jsx"></script>
<script type="text/babel" data-presets="react" src="core.jsx"></script>
<script type="text/babel" data-presets="react" src="wordcloud.jsx"></script>
<script type="text/babel" data-presets="react" src="core-v9.jsx"></script>
<script type="text/babel" data-presets="react" src="core-v10.jsx"></script>
<script type="text/babel" data-presets="react" src="core-v12.jsx"></script>
<script type="text/babel" data-presets="react" src="details-v12.jsx"></script>
<script type="text/babel" data-presets="react" src="core-v14.jsx"></script>
<script type="text/babel" data-presets="react" src="feed-v14.jsx"></script>
<script type="text/babel" data-presets="react" src="stats-v14.jsx?v=2"></script>
<script type="text/babel" data-presets="react" src="details-v14.jsx"></script>
<script type="text/babel" data-presets="react" src="actions-v14.jsx"></script>
<script type="text/babel" data-presets="react" src="list-v14.jsx"></script>
<script type="text/babel" data-presets="react" src="feed-v15.jsx"></script>
<script type="text/babel" data-presets="react" src="details-v15.jsx"></script>
<script type="text/babel" data-presets="react" src="app.jsx"></script>
</body></html>
