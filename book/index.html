<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="book" />
    <link
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="/src/main.js"></script>
    <title>book</title>
    <style>
      /* 초기 로딩 화면 — JS bundle 로드 전부터 즉시 표시 (today 패턴 답습, book 브랜드 마크). */
      #loadingScreen {
        position: fixed;
        inset: 0;
        background: #ffffff;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        transition: opacity 0.3s ease;
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #loadingScreen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .loading-mark {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #15140f;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 30px;
        letter-spacing: -0.04em;
        box-shadow: 0 6px 20px rgba(20, 18, 14, 0.16);
        animation: book-bounce 0.5s ease-in infinite alternate;
      }
      .loading-text {
        font-size: 13px;
        color: rgba(20, 18, 14, 0.5);
        letter-spacing: 0.02em;
        margin-top: 18px;
        font-weight: 600;
        animation: book-fade 1.4s ease-in-out infinite;
      }
      @keyframes book-bounce {
        0% { transform: translateY(0); }
        100% { transform: translateY(-10px); }
      }
      @keyframes book-fade {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.9; }
      }
    </style>
  </head>
  <body>
    <!-- 초기 로딩 화면 — src/app.js 의 showLogin/showAuthenticated 완료 시 .hidden 추가 -->
    <div id="loadingScreen">
      <div class="loading-mark">b</div>
      <div class="loading-text">불러오는 중</div>
    </div>
    <div id="app"></div>
  </body>
</html>
