<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Study · 프로토타입 프리뷰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#e8e4dc; --surface:#fff; --text:#3d3929; --text-muted:#8a8475; --text-faint:#b5ad9e;
    --accent:#d97757; --border:#e8e4dc;
    --ease:cubic-bezier(0.4,0,0.2,1);
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg); margin:0; padding:16px;
    font-family:'Poppins',system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; gap:12px;
    min-height:100vh; color:var(--text);
  }
  .dev-toolbar{
    display:flex; flex-wrap:wrap; gap:6px; align-items:center;
    padding:8px 12px;
    background:var(--surface);
    border-radius:999px;
    box-shadow:0 1px 3px rgba(20,20,19,0.04),0 8px 32px rgba(20,20,19,0.06);
    max-width:100%;
  }
  .dev-label{
    font-size:10px; font-weight:500; color:var(--text-muted);
    text-transform:uppercase; letter-spacing:0.06em;
    margin-right:2px;
  }
  .dev-btn{
    font-family:'Poppins',system-ui,sans-serif;
    font-size:11px; font-weight:500;
    color:var(--text-muted); background:transparent;
    border:1px solid var(--border);
    padding:5px 12px; border-radius:999px;
    cursor:pointer; transition:all 150ms var(--ease);
  }
  .dev-btn:hover,.dev-btn.active{color:var(--accent); border-color:var(--accent)}
  .dev-sep{width:1px; height:18px; background:var(--border); margin:0 4px}

  .dev-frame{
    background:var(--surface);
    border-radius:20px;
    box-shadow:0 4px 24px rgba(20,20,19,0.08),0 1px 4px rgba(20,20,19,0.04);
    overflow:hidden;
    transition:width 400ms var(--ease), height 400ms var(--ease);
    position:relative;
  }
  .dev-frame.iphone{width:390px; height:844px; border-radius:44px}
  .dev-frame.ipad{width:820px; height:700px; border-radius:20px}
  .dev-frame.mac{width:1080px; height:700px; border-radius:12px}
  .dev-frame iframe{
    width:100%; height:100%; border:none; display:block; background:#faf9f5;
  }

  .dev-note{
    font-size:10px; color:var(--text-faint); text-align:center;
    max-width:720px; line-height:1.6; margin-top:4px;
  }
  .dev-note strong{color:var(--text-muted); font-weight:500}

  /* 작은 화면 대응: 프레임이 뷰포트 초과 시 스케일링 대신 width 제한 */
  @media (max-width: 1140px){
    .dev-frame.mac{width:94vw; max-width:1080px; height:min(700px, 72vh)}
  }
  @media (max-width: 860px){
    .dev-frame.ipad{width:94vw; max-width:820px; height:min(700px, 80vh)}
  }
  @media (max-width: 440px){
    body{padding:8px; gap:8px}
    .dev-frame.iphone{width:100vw; height:calc(100vh - 92px); border-radius:0; margin:0 -8px}
    .dev-frame{box-shadow:none}
    .dev-toolbar{font-size:10px; padding:6px 8px}
  }
</style>
</head>
<body>

<div class="dev-toolbar">
  <span class="dev-label">Device</span>
  <button class="dev-btn active" data-dev="iphone">iPhone</button>
  <button class="dev-btn" data-dev="ipad">iPad</button>
  <button class="dev-btn" data-dev="mac">Mac</button>
  <span class="dev-sep"></span>
  <span class="dev-label">Nav</span>
  <button class="dev-btn nav-btn" data-src="login.html">Login</button>
  <button class="dev-btn nav-btn" data-src="home.html">Home</button>
  <button class="dev-btn nav-btn" data-src="session.html?mode=combined">공부시작</button>
  <button class="dev-btn nav-btn" data-src="session.html?mode=review">복습만</button>
  <button class="dev-btn nav-btn" data-src="session.html?mode=new">신규만</button>
  <button class="dev-btn nav-btn" data-src="summary.html">Summary</button>
  <button class="dev-btn nav-btn" data-src="stats.html">Stats</button>
  <button class="dev-btn nav-btn" data-src="settings.html">Settings</button>
</div>

<div class="dev-frame iphone" id="frame">
  <iframe id="app" src="login.html" title="Study preview"></iframe>
</div>

<div class="dev-note">
  Study 프로토타입 — <strong>iPhone 390×844 · iPad 820×700 · Mac 1080×700</strong>.<br>
  Nav 버튼은 iframe 직접 전환. 세션은 <strong>mode=combined</strong>(공부 시작 · 복습→신규), <strong>mode=review</strong>(복습만), <strong>mode=new</strong>(신규 학습만). 실기 테스트는 이 파일(<code>index.html</code>) 이 아닌 각 페이지(<code>login.html</code> 등) 에 직접 접속.
</div>

<script>
  const frame = document.getElementById('frame');
  const appFrame = document.getElementById('app');

  function setDev(dev){
    frame.className = 'dev-frame ' + dev;
    document.querySelectorAll('[data-dev]').forEach(b => b.classList.toggle('active', b.dataset.dev === dev));
    sessionStorage.setItem('studyDevice', dev);
  }
  function navTo(src){
    appFrame.src = src;
  }

  document.querySelectorAll('[data-dev]').forEach(b => b.addEventListener('click', () => setDev(b.dataset.dev)));
  document.querySelectorAll('.nav-btn').forEach(b => b.addEventListener('click', () => navTo(b.dataset.src)));

  // 기본: 저장된 device 복원
  const saved = sessionStorage.getItem('studyDevice') || 'iphone';
  setDev(saved);
</script>
</body>
</html>
