<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#faf9f5">
<title>Study · 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#faf9f5; --surface:#fff; --bg-warm:#f5f0ea;
  --text:#3d3929; --text-strong:#141413; --text-muted:#8a8475; --text-faint:#b5ad9e;
  --accent:#d97757; --accent-hover:#c4623f;
  --sage:#788c5d; --blue:#6a9bcc; --amber:#c4973b; --danger:#b44d3b;
  --border:#e8e4dc; --border-light:#f0ece4;
  --font-display:'Poppins',system-ui,sans-serif;
  --font-body:'Noto Sans KR',system-ui,sans-serif;
  --s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-5:20px;--s-6:24px;--s-8:32px;--s-10:40px;--s-12:48px;--s-16:64px;
  --r-sm:6px;--r-md:10px;--r-lg:16px;--r-pill:999px;
  --shadow-xs:0 1px 2px rgba(20,20,19,0.04);
  --shadow-sm:0 1px 3px rgba(20,20,19,0.04),0 8px 32px rgba(20,20,19,0.06);
  --ease:cubic-bezier(0.4,0,0.2,1);
  --app-padding:var(--s-5);
  --section-gap:var(--s-12);
  --header-size:22px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.015'/%3E%3C/svg%3E");background-size:256px 256px;font-family:var(--font-body);color:var(--text);line-height:1.65;min-height:100dvh;display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
.app{width:100%;max-width:430px;min-height:100dvh;padding:env(safe-area-inset-top, 0px) var(--app-padding) calc(env(safe-area-inset-bottom, 0px) + var(--s-12));display:flex;flex-direction:column;margin:0 auto}
@media(min-width:600px){:root{--app-padding:var(--s-8);--section-gap:var(--s-16);--header-size:24px}.app{max-width:560px}}
@media(min-width:1024px){:root{--header-size:26px}.app{max-width:640px}}

/* Page Header — grid 3-col (back · title 가운데 · lang-pair 우측). title 중앙 정렬 안정 보존. */
.page-hdr{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:var(--s-2);padding:var(--s-4) 0 var(--s-8)}
.page-title{font-family:var(--font-display);font-size:var(--header-size);font-weight:600;color:var(--text-strong);line-height:1.25;text-align:center}
.btn-back{font-family:var(--font-display);font-size:13px;font-weight:500;color:var(--text-muted);background:none;border:none;cursor:pointer;padding:var(--s-2);border-radius:var(--r-sm);display:flex;align-items:center;gap:var(--s-1);transition:color 150ms var(--ease)}
@media(hover:hover){.btn-back:hover{color:var(--text)}}
.btn-back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Wave 11.34 v3 — Language Pair (우측 상단, mono UPPER + slash separator) — home phone 헤더 langPair 시각 차용.
 * ID(tab-en/tab-ja) + class(.lang-tab) 보존 → 기존 sessionStorage 'studyLang' 동기화 핸들러 그대로 사용. */
.lang-pair{display:inline-flex;align-items:baseline;gap:var(--s-2);font-family:var(--font-display);font-size:12px;letter-spacing:0.14em;text-transform:uppercase}
.lang-tab{background:none;border:none;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit;padding:0;font-weight:400;color:var(--text-faint);transition:color 150ms var(--ease)}
.lang-tab.active{font-weight:700;color:var(--text-strong)}
.lang-pair-sep{color:var(--border);font-weight:300}
@media(hover:hover){.lang-tab:hover:not(.active){color:var(--text-muted)}}

/* Tab Toggle */
.view-tabs{display:flex;gap:var(--s-1);margin-bottom:var(--section-gap)}
.view-tab{font-family:var(--font-display);font-size:13px;font-weight:500;color:var(--text-faint);background:none;border:none;cursor:pointer;padding:var(--s-2) var(--s-4);border-radius:var(--r-pill);transition:all 150ms var(--ease)}
.view-tab.active{color:var(--text-strong);background:var(--bg-warm)}
@media(hover:hover){.view-tab:hover:not(.active){color:var(--text-muted)}}

/* Month Nav */
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s-6)}
.month-label{font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--text-strong)}
.month-btn{font-family:var(--font-display);font-size:13px;font-weight:500;color:var(--text-muted);background:none;border:none;cursor:pointer;padding:var(--s-2) var(--s-3);border-radius:var(--r-sm);transition:color 150ms var(--ease)}
.month-btn.disabled{color:var(--text-faint);pointer-events:none}
@media(hover:hover){.month-btn:not(.disabled):hover{color:var(--text)}}

/* Monthly Calendar — Wave 11.34 v3 — Today 가계부 캘린더 톤 차용 (셀 모양 r-12 + 둥둥 떠 있는 today 카드 shadow 3-stack).
 * 숫자 위계 i1/i2/i3 (회색 4단 + size/weight) 는 학습 강도 시각화 핵심이라 보존 (DESIGN.md §1 typography-driven hierarchy).
 * 데스크톱 aspect-ratio 1.4 (Today 의 1.7 절충) — i3 max 32-34px 가 1.7 셀 높이에 안 들어가 1.4 로 완화. */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:var(--section-gap)}
@media(min-width:600px){.cal-grid{gap:var(--s-2)}}
.cal-dow{font-family:var(--font-display);font-size:11px;font-weight:500;color:var(--text-muted);text-align:center;padding:var(--s-2) 0 var(--s-3);letter-spacing:0.04em}
@media(min-width:1024px){.cal-dow{font-size:12px}}
.cal-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;cursor:pointer;transition:transform 150ms var(--ease),box-shadow 150ms var(--ease),background 150ms var(--ease);position:relative;background:transparent;aspect-ratio:1}
@media(min-width:600px){.cal-cell{aspect-ratio:1.4}}
.cal-cell.empty{cursor:default;pointer-events:none}
@media(hover:hover){.cal-cell:not(.empty):not(.today):hover{background:var(--bg-warm)}}
.cal-cell.today{background:var(--surface);border-radius:14px;box-shadow:2px 6px 10px rgba(20,20,19,0.08),4px 12px 28px rgba(20,20,19,0.10),6px 20px 40px rgba(20,20,19,0.06);transform:translate(-1px,-3px);z-index:2}
.cal-cell.selected:not(.today){background:var(--surface);box-shadow:0 2px 8px rgba(20,20,19,0.06),0 4px 16px rgba(20,20,19,0.04);z-index:1}
.cal-date{font-family:var(--font-display);font-size:11px;font-weight:400;color:var(--text-faint);line-height:1;margin-bottom:var(--s-1)}
.cal-val{font-family:var(--font-display);line-height:1}
.cal-val.i0{font-size:0;visibility:hidden}
.cal-val.i1{font-size:16px;font-weight:500;color:var(--text-muted)}
.cal-val.i2{font-size:22px;font-weight:600;color:var(--text)}
.cal-val.i3{font-size:28px;font-weight:700;color:var(--text-strong)}
@media(min-width:600px){.cal-val.i1{font-size:18px}.cal-val.i2{font-size:25px}.cal-val.i3{font-size:32px}}
@media(min-width:1024px){.cal-val.i1{font-size:19px}.cal-val.i2{font-size:27px}.cal-val.i3{font-size:34px}}
.cal-cell.today .cal-date{color:var(--accent);font-weight:600}

/* Monthly Summary */
.month-summary{display:flex;align-items:flex-end;gap:var(--s-8);margin-bottom:var(--section-gap);flex-wrap:wrap}
.ms-primary .ms-val{font-family:var(--font-display);font-size:36px;font-weight:600;color:var(--text-strong);line-height:1;position:relative}
@media(min-width:600px){.ms-primary .ms-val{font-size:40px}}
@media(min-width:1024px){.ms-primary .ms-val{font-size:44px}}
.ms-primary .ms-val::after{content:'';position:absolute;inset:-12px;background:radial-gradient(circle,rgba(217,119,87,0.15) 0%,transparent 70%);border-radius:50%;z-index:-1}
.ms-primary .ms-unit{font-family:var(--font-display);font-size:14px;font-weight:400;color:var(--text-muted);margin-left:4px}
.ms-primary .ms-label{font-size:12px;color:var(--text-faint);margin-top:var(--s-2)}
.ms-secondary{display:flex;gap:var(--s-6)}
.ms-sub .ms-val{font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--text-muted);line-height:1}
.ms-sub.pass .ms-val{color:var(--sage)}
.ms-sub .ms-label{font-family:var(--font-display);font-size:11px;font-weight:500;color:var(--text-faint);margin-top:var(--s-1)}

/* Chart */
.chart-section{margin-bottom:var(--s-6)}
.chart-title{font-family:var(--font-display);font-size:12px;font-weight:500;color:var(--text-faint);letter-spacing:0.02em;margin-bottom:var(--s-4)}
.chart-wrap{position:relative;height:100px;display:flex;align-items:flex-end;gap:2px;padding-bottom:var(--s-5)}
.chart-bar{flex:1;background:var(--accent);border-radius:2px 2px 0 0;opacity:0.3;min-width:2px;transition:opacity 150ms var(--ease),height 300ms var(--ease)}
.chart-bar.has-data{opacity:0.55}
.chart-bar.high{opacity:0.8}
.chart-bar.today-bar{opacity:1}
@media(hover:hover){.chart-bar:hover{opacity:1}}
.chart-x{display:flex;justify-content:space-between;padding-top:var(--s-1)}
.chart-x span{font-family:var(--font-display);font-size:10px;color:var(--text-faint)}

/* Sentence list */
.sentence-list-view{display:none}
.sentence-list-view.on{display:block}
.calendar-view{display:block}
.calendar-view.off{display:none}
.sort-modes{display:flex;gap:var(--s-1);margin-bottom:var(--s-6)}
.sort-pill{font-family:var(--font-display);font-size:12px;font-weight:500;color:var(--text-faint);background:none;border:1px solid transparent;padding:var(--s-1) var(--s-3);border-radius:var(--r-pill);cursor:pointer;transition:all 150ms var(--ease)}
.sort-pill.active{color:var(--text-strong);background:var(--bg-warm);border-color:var(--border)}
@media(hover:hover){.sort-pill:hover:not(.active){color:var(--text-muted)}}
.sl-date-hdr{font-family:var(--font-display);font-size:12px;font-weight:500;color:var(--text-faint);margin-bottom:var(--s-2);margin-top:var(--s-6)}
.sl-date-hdr:first-child{margin-top:0}
.sl-item{display:flex;align-items:center;justify-content:space-between;padding:var(--s-3) var(--s-2);margin:0 calc(var(--s-2) * -1);border-radius:var(--r-sm);cursor:pointer;transition:background 150ms var(--ease)}
@media(hover:hover){.sl-item:hover{background:var(--bg-warm)}}
.sl-content{flex:1;min-width:0}
.sl-sentence{font-family:var(--font-display);font-size:15px;font-weight:500;color:var(--text-strong);line-height:1.35}
.sl-meaning{font-size:13px;color:var(--text-muted);margin-top:2px}
.sl-meta{display:flex;gap:var(--s-3);margin-top:var(--s-1);font-family:var(--font-display);font-size:11px;color:var(--text-faint)}
.sl-meta .score{font-weight:600}
.sl-meta .score.good{color:var(--sage)}
.sl-meta .score.mid{color:var(--amber)}
.sl-meta .score.low{color:var(--danger)}
.sl-meta .interval{color:var(--text-faint)}
.sl-chevron{flex-shrink:0;width:16px;height:16px;color:var(--text-faint);margin-left:var(--s-3);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* Wave 11.34 — 듣기 버튼 (sentence list item). 카드 진입 클릭과 분리. */
.sl-listen{flex-shrink:0;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:rgba(217,119,87,0.08);border:none;color:var(--accent);cursor:pointer;border-radius:50%;margin-left:var(--s-3);transition:background 150ms var(--ease)}
.sl-listen svg{width:14px;height:14px}
@media(hover:hover){.sl-listen:hover{background:rgba(217,119,87,0.18)}}

/* Bottom Sheet — home 주간 캘린더와 공용. 정본: src/styles/bs-sheet.css.
 * SPA 모드(app.js 경유)에선 <style id="bs-sheet-shared">가 먼저 주입되어 중복되지만 동일 CSS 라 무해.
 * mocks 허브(iframe 직접 로드) 모드에선 app.js 를 거치지 않으므로 이 인라인 블록이 유일한 스타일 소스. */
.bs-overlay{position:fixed;inset:0;background:rgba(20,20,19,0.25);z-index:100;display:none;opacity:0;transition:opacity 200ms var(--ease)}
.bs-overlay.open{display:block;opacity:1}
.bs-sheet{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:var(--s-5) var(--s-5) calc(env(safe-area-inset-bottom, 0px) + var(--s-12));z-index:101;transform:translateY(100%);transition:transform 300ms var(--ease);max-height:65vh;overflow-y:auto;box-shadow:0 -4px 32px rgba(20,20,19,0.08);display:none}
.bs-sheet.open{transform:translateY(0)}
@media(min-width:600px){
  .bs-sheet{left:50%;right:auto;transform:translate(-50%,100%);width:calc(100% - var(--s-12) * 2);max-width:560px}
  .bs-sheet.open{transform:translate(-50%,0)}
}
@media(min-width:1024px){
  .bs-sheet{max-width:640px}
}
.bs-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto var(--s-5)}
.bs-date{font-family:var(--font-display);font-size:16px;font-weight:600;color:var(--text-strong);margin-bottom:var(--s-5)}
.bs-stats{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3) var(--s-6);margin-bottom:var(--s-5)}
.bs-stat-label{font-size:12px;font-weight:500;color:var(--text-faint)}
.bs-stat-val{font-family:var(--font-display);font-feature-settings:'tnum' 1;font-size:15px;font-weight:600;color:var(--text-strong);margin-top:2px}
.bs-stat-val .got{color:var(--sage)}
.bs-stat-val .hmm{color:var(--amber)}
.bs-stat-val .no{color:var(--danger)}
.bs-section-label{font-family:var(--font-display);font-size:12px;font-weight:500;color:var(--text-faint);letter-spacing:0.02em;margin-bottom:var(--s-3)}
.bs-sentences{display:flex;flex-direction:column;gap:var(--s-2)}
.bs-sent{display:flex;align-items:flex-start;padding:var(--s-3);margin:0 calc(var(--s-2) * -1);border-radius:var(--r-md);cursor:pointer;transition:background 150ms var(--ease)}
@media(hover:hover){.bs-sent:hover{background:rgba(20,20,19,0.025)}}
.bs-sent-content{flex:1;min-width:0}
.bs-sent-text{font-family:var(--font-display);font-size:14px;font-weight:400;color:var(--text-strong);line-height:1.35}
.bs-sent-meaning{font-family:var(--font-body);font-size:13px;color:var(--text-muted);line-height:1.5;margin-top:3px}
.bs-sent-score{font-family:var(--font-display);font-size:12px;font-weight:600;margin-top:var(--s-1)}
.bs-sent-score.good{color:var(--sage)}
.bs-sent-score.mid{color:var(--amber)}
.bs-sent-score.low{color:var(--danger)}
.bs-sent-chevron{flex-shrink:0;width:16px;height:16px;color:var(--text-faint);margin-left:var(--s-3);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Reveal */
.reveal{opacity:0;transform:translateY(12px);animation:revealUp .5s var(--ease) forwards}
.r1{animation-delay:0ms}.r2{animation-delay:50ms}.r3{animation-delay:100ms}.r4{animation-delay:150ms}.r5{animation-delay:200ms}.r6{animation-delay:250ms}
@keyframes revealUp{to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div class="app">

  <!-- Wave 11.34 v3 — lang 토글 우측 상단 이동 (home phone 헤더 langPair 패턴). 좌측 lang-tabs 영역 삭제 → 캘린더가 자연 압축으로 위로 올라감. -->
  <div class="page-hdr reveal r1">
    <button class="btn-back" id="btnBack">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="page-title" id="page-title">기록</div>
    <div class="lang-pair">
      <button class="lang-tab" id="tab-en" data-lang="en">EN</button>
      <span class="lang-pair-sep" aria-hidden="true">/</span>
      <button class="lang-tab" id="tab-ja" data-lang="ja">JP</button>
    </div>
  </div>

  <div class="view-tabs reveal r2">
    <button class="view-tab active" id="tab-cal">캘린더</button>
    <button class="view-tab" id="tab-sent">문장 목록</button>
  </div>

  <!-- Calendar View -->
  <div class="calendar-view" id="cal-view">
    <div class="month-nav reveal r3">
      <button class="month-btn" id="btnPrevMonth">&larr; 3월</button>
      <div class="month-label" id="monthLabel">2026년 4월</div>
      <button class="month-btn disabled" id="btnNextMonth">5월 &rarr;</button>
    </div>
    <div class="cal-grid reveal r4" id="cal-grid"></div>
    <div class="month-summary reveal r5">
      <div class="ms-primary">
        <span class="ms-val">13</span><span class="ms-unit">days</span>
        <div class="ms-label">활동 일수</div>
      </div>
      <div class="ms-secondary">
        <div class="ms-sub"><div class="ms-val">187</div><div class="ms-label">총 발화</div></div>
        <div class="ms-sub pass"><div class="ms-val">142</div><div class="ms-label">통과</div></div>
      </div>
    </div>
    <div class="chart-section reveal r6">
      <div class="chart-title">일별 발화</div>
      <div class="chart-wrap" id="chart-wrap"></div>
      <div class="chart-x" id="chart-x"></div>
    </div>
  </div>

  <!-- Sentence list view -->
  <div class="sentence-list-view" id="sent-view">
    <div class="sort-modes" id="sort-modes">
      <button class="sort-pill active" data-mode="recent">최신순</button>
      <button class="sort-pill" data-mode="weak">약한 문장</button>
      <button class="sort-pill" data-mode="graduating">졸업 임박</button>
    </div>
    <div id="sent-list"></div>
  </div>

</div>

<!-- Bottom Sheet (day detail) · 문장 탭 시 → #/session-review 진입 -->
<div class="bs-overlay" id="bs-overlay"></div>

<div class="bs-sheet" id="bs-sheet">
  <div class="bs-handle"></div>
  <div class="bs-date" id="bs-date">4월 10일 목요일</div>
  <div class="bs-stats" id="bs-stats"></div>
  <div class="bs-section-label">학습 문장</div>
  <div class="bs-sentences" id="bs-sentences"></div>
</div>

<script>
const APRIL_DATA = {
  1:[12,'i2'], 2:[0,'i0'], 3:[8,'i2'], 4:[18,'i3'], 5:[3,'i1'], 6:[0,'i0'], 7:[15,'i2'],
  8:[22,'i3'], 9:[0,'i0'], 10:[18,'i3'], 11:[14,'i2'], 12:[5,'i1'], 13:[0,'i0'], 14:[20,'i3'],
  15:[9,'i2']
};
// Wave 11.6A: window.studyDay(main.js) 경유 단일 소스. iframe 허브에선 window.studyDay 없음 → 15 fallback.
const TODAY = window.studyDay?.todayDayNumber?.() ?? 15;

// Wave 11.25: 월간 캘린더 cursor — prev/next 월 이동 (spec §11-1-1).
const TODAY_ISO = window.studyDay?.TODAY_ISO ?? '2026-04-15';
const CURRENT_YEAR = parseInt(TODAY_ISO.slice(0, 4), 10);
const CURRENT_MONTH = parseInt(TODAY_ISO.slice(5, 7), 10);
let cursor = { year: CURRENT_YEAR, month: CURRENT_MONTH };
function getCursorPrefix() { return `${cursor.year}-${String(cursor.month).padStart(2, '0')}`; }
function getCursorISO(day) { return `${getCursorPrefix()}-${String(day).padStart(2, '0')}`; }
function getCursorDaysInMonth() { return new Date(cursor.year, cursor.month, 0).getDate(); }
function getCursorFirstDOW() {
  // JS getDay: 0=Sun..6=Sat → 월요일=0 기준 변환
  const dow = new Date(cursor.year, cursor.month - 1, 1).getDay();
  return (dow + 6) % 7;
}
function isCurrentMonth() { return cursor.year === CURRENT_YEAR && cursor.month === CURRENT_MONTH; }
function isFutureFromCursor(deltaMonths = 0) {
  const y = cursor.year + Math.floor((cursor.month - 1 + deltaMonths) / 12);
  const m = ((cursor.month - 1 + deltaMonths) % 12 + 12) % 12 + 1;
  return y > CURRENT_YEAR || (y === CURRENT_YEAR && m > CURRENT_MONTH);
}

// 문장 클릭 → 복습 세션 진입.
// from='stats'    → 그 날짜에 학습한 모든 문장을 순차 복습 큐로, × 시 stats 로 복귀
// from='sentList' → 해당 문장 하나만 복습 큐로, × 시 stats 문장목록 탭으로 복귀
// queue/returnTo 는 sessionStorage 전달 (URL 쿼리로 JSON 직렬화 회피).
function goReview(s, from) {
  const queue = (from === 'stats')
    ? SENTENCES.filter(x => x.date === s.date)
    : [s];
  sessionStorage.setItem('studyReviewQueue', JSON.stringify(queue));
  sessionStorage.setItem('studyReturnTo', from);
  // Wave 11.34 — SPA 라우터로 직접 hash 변경 (rewriteMockLinks 의 정규식이 template literal 백틱 미매칭 → P-1 회귀 원인).
  // window.location.hash = '#/...' 패턴은 매번 SPA 라우터가 hashchange 이벤트로 mount() 호출 → 라우팅 정확.
  const lang = (typeof getStatsLang === 'function') ? getStatsLang() : 'en';
  window.location.hash = `#/session-review?lang=${lang}`;
}

// Dexie helpers (Wave 11.4). SPA: window.studyDB 로 실 데이터, iframe: null → mock fallback.
// home.html 과 구조 유사하지만 stats 는 문장에 interval/result/date 필드가 추가로 필요하므로 전용 variant.
function intensityFromCount(v) {
  if (!v) return 'i0';
  if (v < 10) return 'i1';
  if (v < 18) return 'i2';
  return 'i3';
}

async function fetchSessionLogDayMap(lang = 'en') {
  const db = window.studyDB;
  if (!db) return null;
  try {
    const logs = await db.sessionLogs.where('lang').equals(lang).toArray();
    const map = {};
    const prefix = getCursorPrefix(); // Wave 11.25: cursor month 만 필터
    for (const l of logs) {
      if (!l.date?.startsWith(prefix)) continue;
      const d = parseInt(l.date.split('-')[2], 10);
      if (!Number.isNaN(d)) map[d] = l.utteranceCount;
    }
    return map;
  } catch (e) { console.error('[fetchSessionLogDayMap]', e); return null; }
}
async function fetchStatsDayDetailFromDB(day, lang = 'en') {
  const db = window.studyDB;
  if (!db) return null;
  try {
    const dateStr = getCursorISO(day); // Wave 11.25: cursor 기반
    // Wave 11.34 — 같은 lang+date 의 모든 sessionLogs 합산 (이전 .first() 만 → 같은 날 여러 세션 시 누적 안 되는 버그).
    const dayLogs = await db.sessionLogs.where('date').equals(dateStr).and(l => l.lang === lang).toArray();
    if (!dayLogs.length) return null;
    const log = {
      date: dateStr, lang,
      durationSec: dayLogs.reduce((s, l) => s + (l.durationSec || 0), 0),
      utteranceCount: dayLogs.reduce((s, l) => s + (l.utteranceCount || 0), 0),
      passCount: dayLogs.reduce((s, l) => s + (l.passCount || 0), 0),
      newCount: dayLogs.reduce((s, l) => s + (l.newCount || 0), 0),
      reviewResults: dayLogs.reduce((acc, l) => {
        const r = l.reviewResults || {};
        return { O:(acc.O||0)+(r.O||0), '△':(acc['△']||0)+(r['△']||0), X:(acc.X||0)+(r.X||0) };
      }, { O:0, '△':0, X:0 }),
      sentenceIds: [...new Set(dayLogs.flatMap(l => l.sentenceIds || []))],
    };
    const ids = log.sentenceIds;
    const cards = ids.length ? await db.reviewQueue.where('id').anyOf(ids).toArray() : [];
    const byId = {}; for (const c of cards) byId[c.id] = c;
    const ordered = ids.map(id => byId[id]).filter(Boolean);
    const resultToScore = { O:85, '△':65, X:45 };
    const resultToCls = { O:'good', '△':'mid', X:'low' };
    return {
      log,
      sents: ordered.map(c => ({
        id: c.id, en: c.sentence, ko: c.meaning,
        score: resultToScore[c.lastResult] || 80,
        cls: resultToCls[c.lastResult] || 'good',
        interval: c.interval,
        result: c.lastResult,
        date: `${cursor.month}/${day}`, // Wave 11.25: cursor month
      })),
    };
  } catch (e) { console.error('[fetchStatsDayDetailFromDB]', e); return null; }
}
async function fetchSentencesWithLastLearned(lang = 'en') {
  const db = window.studyDB;
  if (!db) return null;
  try {
    const logs = await db.sessionLogs.where('lang').equals(lang).toArray();
    // sentenceId 별 최근 학습일 계산 (spec §11-3 "학습 날짜순(최신순)")
    const lastBy = {};
    for (const l of logs) {
      for (const id of (l.sentenceIds || [])) {
        if (!lastBy[id] || l.date > lastBy[id]) lastBy[id] = l.date;
      }
    }
    const cards = await db.reviewQueue.where('lang').equals(lang).toArray();
    const resultToScore = { O:85, '△':65, X:45 };
    const resultToCls = { O:'good', '△':'mid', X:'low' };
    // 이슈 fix — sessionLog.sentenceIds 누락(이전 finish() 에서 신규 카드 미포함) 카드는 createdAt fallback.
    // reviewQueue 에 이관된 카드는 모두 학습 완료 → 문장목록에 노출되어야 함.
    return cards
      .map(c => {
        const iso = lastBy[c.id] || (c.createdAt ? c.createdAt.slice(0, 10) : null);
        if (!iso) return null;
        // Wave 11.25: 문장 목록은 cursor 무관 (모든 month 의 학습 기록 표시). iso 의 month 사용.
        const m = parseInt(iso.split('-')[1], 10);
        const day = parseInt(iso.split('-')[2], 10);
        return {
          id: c.id,
          date: `${m}/${day}`,
          en: c.sentence,
          ko: c.meaning,
          score: resultToScore[c.lastResult] || 80,
          cls: resultToCls[c.lastResult] || 'good',
          interval: c.interval,
          result: c.lastResult,
          _iso: iso,
        };
      })
      .filter(Boolean);
  } catch (e) { console.error('[fetchSentencesWithLastLearned]', e); return null; }
}

// Wave 11.34 — month-summary 의 활동일/총발화/통과 를 lang 별 sessionLogs 기반으로 갱신.
// 이전에는 HTML mock 고정값 (13/187/142) 그대로 표시 → 사용자 학습 데이터 반영 안 됨.
async function updateMonthSummary() {
  const db = window.studyDB;
  if (!db) return;
  try {
    const lang = getStatsLang();
    const prefix = getCursorPrefix();
    const logs = await db.sessionLogs.where('lang').equals(lang).toArray();
    const monthLogs = logs.filter(l => (l.date || '').startsWith(prefix));
    const daysSet = new Set(monthLogs.map(l => l.date));
    const totalUtter = monthLogs.reduce((s, l) => s + (l.utteranceCount || 0), 0);
    const totalPass = monthLogs.reduce((s, l) => s + (l.passCount || 0), 0);
    const primary = document.querySelector('.ms-primary .ms-val');
    const subs = document.querySelectorAll('.ms-secondary .ms-val');
    if (primary) primary.textContent = daysSet.size;
    if (subs[0]) subs[0].textContent = totalUtter;
    if (subs[1]) subs[1].textContent = totalPass;
  } catch (e) { console.error('[updateMonthSummary]', e); }
}

    grid.appendChild(el);
  });
  // Wave 11.25: cursor 기반 첫 요일 + 마지막 날.
  const offset = getCursorFirstDOW();
  const lastDay = getCursorDaysInMonth();
  // mocks fallback (APRIL_DATA) 은 4월에만 유효 — 다른 month 는 빈 캘린더 (시안 의도).
  const useFallback = !dayMap && isCurrentMonth() && cursor.month === 4;
  for (let i = 0; i < offset; i++) {
    const e = document.createElement('div');
    e.className = 'cal-cell empty';
    grid.appendChild(e);
  }
  for (let d = 1; d <= lastDay; d++) {
    const cell = document.createElement('div');
    const val = dayMap ? (dayMap[d] || 0) : (useFallback && APRIL_DATA[d] ? APRIL_DATA[d][0] : 0);
    const intensity = dayMap ? intensityFromCount(val) : (useFallback && APRIL_DATA[d] ? APRIL_DATA[d][1] : 'i0');
    cell.className = 'cal-cell';
    if (isCurrentMonth() && d === TODAY) cell.classList.add('today');
    cell.addEventListener('click', () => openBS(d));
    cell.innerHTML = `
      <div class="cal-date">${d}</div>
      <div class="cal-val ${intensity}">${val > 0 ? val : ''}</div>
    `;
    grid.appendChild(cell);
  }
}

/* ============ Chart ============ */
async function renderChart() {
  const dayMap = await fetchSessionLogDayMap(getStatsLang()); // null → mock fallback
  // Wave 11.25: cursor === 현재 month 면 1~TODAY, 아니면 1~lastDay (과거 전체).
  const useFallback = !dayMap && isCurrentMonth() && cursor.month === 4;
  const getV = (d) => dayMap ? (dayMap[d] || 0) : (useFallback && APRIL_DATA[d] ? APRIL_DATA[d][0] : 0);
  const wrap = document.getElementById('chart-wrap');
  const xAxis = document.getElementById('chart-x');
  wrap.innerHTML = ''; xAxis.innerHTML = '';
  // Wave 11.34 — 차트는 월 전체 (1~lastDay) 표시. 빈 날도 자리 차지 → 1건 학습 시에도 비례 정상.
  // 이전: chartLast=TODAY → 5월 1일에 차트가 막대 1개로 100% 차지하는 시각 어색 사용자 보고 fix.
  const chartLast = getCursorDaysInMonth();
  let maxVal = 0;
  for (let d = 1; d <= chartLast; d++) {
    const v = getV(d);
    if (v > maxVal) maxVal = v;
  }
  for (let d = 1; d <= chartLast; d++) {
    const v = getV(d);
    const bar = document.createElement('div');
    bar.className = 'chart-bar';
    if (v > 0) bar.classList.add('has-data');
    if (v >= 15) bar.classList.add('high');
    if (isCurrentMonth() && d === TODAY) bar.classList.add('today-bar');
    bar.style.height = (maxVal > 0 ? Math.max((v / maxVal) * 100, v > 0 ? 6 : 0) : 0) + '%';
    if (v === 0) bar.style.opacity = '0.08'; // 빈 날 — 자리 차지하되 매우 옅게
    bar.addEventListener('click', () => openBS(d));
    wrap.appendChild(bar);
  }
  // x축 라벨 — 월 길이에 따라 조정
  const xLabels = chartLast >= 28 ? [1, 8, 15, 22, 28] : [1, 5, 10, 15];
  xLabels.forEach(d => {
    const s = document.createElement('span');
    s.textContent = d;
    xAxis.appendChild(s);
  });
}

/* ============ Sentence List ============ */
let currentSort = 'recent';

async function renderSentences(mode) {
  const list = document.getElementById('sent-list');
  list.innerHTML = '';
  // Dexie 우선 — fetchSentencesWithLastLearned 가 각 문장의 최근 학습일을 역매핑해 SENTENCES 포맷으로 반환.
  // 실패/부재 시 SENTENCES mock fallback (iframe 허브 호환).
  const source = (await fetchSentencesWithLastLearned(getStatsLang())) || SENTENCES;
  let sorted = source.slice();
  // 최신순 정렬: Dexie 경로는 _iso 사용, mock 은 date '4/15' 문자열 비교로는 순서 보장 X 라 기존 동작 유지
  if (source !== SENTENCES) {
    sorted.sort((a, b) => (b._iso || '').localeCompare(a._iso || ''));
  }
  if (mode === 'weak') {
    const rOrder = { 'X':0, '△':1, 'O':2 };
    sorted.sort((a,b) => {
      const ra = rOrder[a.result] !== undefined ? rOrder[a.result] : 2;
      const rb = rOrder[b.result] !== undefined ? rOrder[b.result] : 2;
      if (ra !== rb) return ra - rb;
      return a.score - b.score;
    });
  } else if (mode === 'graduating') {
    sorted.sort((a,b) => b.interval - a.interval);
  }

  let lastDate = '';
  sorted.forEach(s => {
    if (mode === 'recent' && s.date !== lastDate) {
      const dh = document.createElement('div');
      dh.className = 'sl-date-hdr'; dh.textContent = s.date;
      list.appendChild(dh);
      lastDate = s.date;
    }
    const item = document.createElement('div');
    item.className = 'sl-item';
    const intervalLbl = s.interval >= 60 ? '졸업 임박' : s.interval + 'd';
    const resultLbl = s.result === 'O' ? '' : s.result === 'X' ? ' · No' : ' · Hmm';
    const resultCls = s.result === 'X' ? 'color:var(--danger)' : s.result === '△' ? 'color:var(--amber)' : '';
    const resultText = resultLbl ? resultLbl.replace(/^ · /, '') : '';
    item.innerHTML = `
      <div class="sl-content">
        <div class="sl-sentence">${s.en}</div>
        <div class="sl-meaning">${s.ko}</div>
        <div class="sl-meta">
          <span class="score ${s.cls}">${s.score}</span>
          <span class="interval">${intervalLbl}</span>
          ${resultText ? `<span style="${resultCls}">${resultText}</span>` : ''}
        </div>
      </div>
      <button class="sl-listen" aria-label="듣기" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </button>
    `;
    // Wave 11.34 — 듣기 버튼 (lang 별 speak). 클릭 시 카드 진입 안 함 (stopPropagation).
    item.querySelector('.sl-listen')?.addEventListener('click', (e) => {
      e.stopPropagation();
      const speakLang = getStatsLang() === 'ja' ? 'ja-JP' : 'en-US';
      if (window.studySpeech?.speak) {
        window.studySpeech.speak(s.en, { lang: speakLang, rate: 0.85 });
      }
    });
    item.addEventListener('click', () => goReview(s, 'sentList'));
    list.appendChild(item);
  });
}

// home 의 주간 캘린더 바텀시트와 통일 — stat 2개 (학습 시간 / 통과·발화) +
// 그날 학습한 문장 목록 + 클릭 시 그날 큐 + 선택 인덱스로 review 진입.
async function openBS(day) {
  const dowMap = ['월','화','수','목','금','토','일'];
  const dowIdx = (getCursorFirstDOW() + day - 1) % 7;
  document.getElementById('bs-date').textContent = `${cursor.month}월 ${day}일 ${dowMap[dowIdx]}요일`;

  const lang = getStatsLang();
  const dateISO = getCursorISO(day);
  const dbDetail = await fetchStatsDayDetailFromDB(day, lang);
  const mockVal = APRIL_DATA[day] ? APRIL_DATA[day][0] : 0;

  const statsEl = document.getElementById('bs-stats');
  const sentsEl = document.getElementById('bs-sentences');

  if (dbDetail) {
    const log = dbDetail.log;
    const mins = Math.max(1, Math.round(log.durationSec / 60));
    statsEl.innerHTML = `
      <div><div class="bs-stat-label">학습 시간</div><div class="bs-stat-val">${mins}분</div></div>
      <div><div class="bs-stat-label">통과 / 발화</div><div class="bs-stat-val"><span class="got">${log.passCount || 0}</span> / ${log.utteranceCount || 0}</div></div>
    `;
    const sents = (window.studyDay?.fetchDayLessonsForDay && window.studyDB)
      ? await window.studyDay.fetchDayLessonsForDay(window.studyDB, lang, dateISO)
      : [];
    renderBSSentencesFromCards(sents, lang);
  } else if (mockVal) {
    const v = mockVal;
    const mins = Math.round(v * 1.5);
    const pass = Math.floor(v * 0.75);
    statsEl.innerHTML = `
      <div><div class="bs-stat-label">학습 시간</div><div class="bs-stat-val">${mins}분</div></div>
      <div><div class="bs-stat-label">통과 / 발화</div><div class="bs-stat-val"><span class="got">${pass}</span> / ${v}</div></div>
    `;
    renderBSSentences(day);
  } else {
    statsEl.innerHTML = '';
    sentsEl.innerHTML = `<p style="text-align:center;padding:var(--s-8) 0;color:var(--text-muted);font-size:13px">학습 기록이 없습니다</p>`;
  }

  const sh = document.getElementById('bs-sheet');
  sh.style.display = 'block';
  document.getElementById('bs-overlay').classList.add('open');
  // 일부 브라우저(headless 포함)에서 rAF 타이밍이 사라진 뒤 실행되는 케이스가 있어
  // setTimeout 20ms 로 "display 반영 → class 'open' 추가(transform transition 발동)" 를 분리.
  setTimeout(() => sh.classList.add('open'), 20);
  document.querySelectorAll('.cal-cell').forEach(c => c.classList.remove('selected'));
  const cells = document.querySelectorAll('.cal-cell:not(.empty)');
  if (cells[day - 1]) cells[day - 1].classList.add('selected');
}
function closeBS() {
  document.getElementById('bs-overlay').classList.remove('open');
  const sh = document.getElementById('bs-sheet');
  sh.classList.remove('open');
  setTimeout(() => { sh.style.display = 'none'; }, 300);
  document.querySelectorAll('.cal-cell').forEach(c => c.classList.remove('selected'));
}
document.getElementById('bs-overlay').addEventListener('click', closeBS);

// Dexie 카드 배열 (sentence/meaning/reading 등 raw card) 을 받아 그날 학습 목록 렌더.
// 클릭 시 해당 일자 학습 카드 전체를 큐로, 선택 인덱스부터 시작.
function renderBSSentencesFromCards(cards, lang) {
  const el = document.getElementById('bs-sentences');
  el.innerHTML = '';
  if (!cards.length) {
    el.innerHTML = `<p style="text-align:center;padding:var(--s-6) 0;color:var(--text-muted);font-size:13px">신규 학습 없음</p>`;
    return;
  }
  const queue = cards.map((c) => ({
    id: c.id, en: c.sentence, ko: c.meaning,
    score: c.lastResult === 'X' ? 45 : c.lastResult === '△' ? 65 : 80,
    cls: c.lastResult === 'X' ? 'low' : c.lastResult === '△' ? 'mid' : 'good',
  }));
  queue.forEach((s, idx) => {
    const item = document.createElement('div');
    item.className = 'bs-sent';
    item.innerHTML = `
      <div class="bs-sent-content">
        <div class="bs-sent-text">${s.en}</div>
        ${s.ko ? `<div class="bs-sent-meaning">${s.ko}</div>` : ''}
      </div>
    `;
    item.addEventListener('click', () => {
      // Wave 11.74 — 큐를 idx 앞부분 잘라서 저장 → session.html 0번부터 시작해도 클릭 카드부터.
      sessionStorage.setItem('studyReviewQueue', JSON.stringify(queue.slice(idx)));
      sessionStorage.setItem('studyReturnTo', 'stats');
      window.location.hash = `#/session-review?lang=${lang}`;
    });
    el.appendChild(item);
  });
}

// (deprecated · APRIL fixture 용 fallback. SPA 경로는 renderBSSentencesFromCards 사용)
function renderBSSentencesFromList(sents) {
  const el = document.getElementById('bs-sentences');
  el.innerHTML = '';
  sents.forEach(s => {
    const item = document.createElement('div');
    item.className = 'bs-sent';
    item.innerHTML = `
      <div class="bs-sent-content">
        <div class="bs-sent-text">${s.en}</div>
        ${s.ko ? `<div class="bs-sent-meaning">${s.ko}</div>` : ''}
      </div>
    `;
    item.addEventListener('click', () => { closeBS(); goReview(s, 'stats'); });
    el.appendChild(item);
  });
}

function renderBSSentences(day) {
  const el = document.getElementById('bs-sentences');
  const dayLabel = `4/${day}`;
  const matched = SENTENCES.filter(s => s.date === dayLabel);
  const sents = matched.length ? matched.slice(0, 4) : SENTENCES.slice(0, 3);
  el.innerHTML = '';
  sents.forEach(s => {
    const item = document.createElement('div');
    item.className = 'bs-sent';
    item.innerHTML = `
      <div class="bs-sent-content">
        <div class="bs-sent-text">${s.en}</div>
        ${s.ko ? `<div class="bs-sent-meaning">${s.ko}</div>` : ''}
      </div>
    `;
    item.addEventListener('click', () => { closeBS(); goReview(s, 'stats'); });
    el.appendChild(item);
  });
}

/* ============ Back nav ============ */
document.getElementById('btnBack').addEventListener('click', () => { window.location.href = 'home.html'; });

// Wave 11.25: 월 이동 cursor (spec §11-1-1)
function renderMonthNav() {
  const prevMonth = cursor.month === 1 ? 12 : cursor.month - 1;
  const nextMonth = cursor.month === 12 ? 1 : cursor.month + 1;
  document.getElementById('btnPrevMonth').innerHTML = `&larr; ${prevMonth}월`;
  document.getElementById('monthLabel').textContent = `${cursor.year}년 ${cursor.month}월`;
  const nextBtn = document.getElementById('btnNextMonth');
  nextBtn.innerHTML = `${nextMonth}월 &rarr;`;
  nextBtn.classList.toggle('disabled', isFutureFromCursor(1));
}
async function rerenderMonth() {
  renderMonthNav();
  await renderCal();
  await renderChart();
}
document.getElementById('btnPrevMonth').addEventListener('click', () => {
  if (cursor.month === 1) { cursor.year -= 1; cursor.month = 12; }
  else cursor.month -= 1;
  rerenderMonth().catch((e) => console.error('[rerenderMonth prev]', e));
});
document.getElementById('btnNextMonth').addEventListener('click', () => {
  if (document.getElementById('btnNextMonth').classList.contains('disabled')) return;
  if (cursor.month === 12) { cursor.year += 1; cursor.month = 1; }
  else cursor.month += 1;
  rerenderMonth().catch((e) => console.error('[rerenderMonth next]', e));
});
renderMonthNav();

/* init — async render 들은 fire-and-forget. 실패해도 콘솔 에러만 남기고 나머지 UI 정상 진행. */
renderCal().catch((e) => console.error('[renderCal]', e));
renderChart().catch((e) => console.error('[renderChart]', e));
renderSentences('recent').catch((e) => console.error('[renderSentences]', e));

// 세션 종료 후 from=sentList 경로로 돌아온 경우 문장 목록 탭 자동 활성.
// iframe 모드: URLSearchParams(location.search). SPA 모드: window.studyRoute.params.tab.
const urlTab = new URLSearchParams(location.search).get('tab');
const routeTab = window.studyRoute?.params?.tab;
if (urlTab === 'sent' || routeTab === 'sent') switchTab('sentences');
