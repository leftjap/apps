<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#faf9f5">
<title>Study · 설정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#faf9f5; --surface:#fff; --bg-warm:#f5f0ea;
  --text:#3d3929; --text-strong:#141413; --text-muted:#8a8475; --text-faint:#b5ad9e;
  --accent:#d97757; --accent-hover:#c4623f;
  --sage:#788c5d; --blue:#6a9bcc; --amber:#c4973b; --danger:#b44d3b;
  --border:#e8e4dc; --border-light:#f0ece4;
  --font-display:'Poppins',system-ui,sans-serif;
  --font-body:'Noto Sans KR',system-ui,sans-serif;
  --s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-5:20px;--s-6:24px;--s-8:32px;--s-10:40px;--s-12:48px;--s-16:64px;
  --r-sm:6px;--r-md:10px;--r-lg:16px;--r-pill:999px;
  --shadow-xs:0 1px 2px rgba(20,20,19,0.04);
  --shadow-sm:0 1px 3px rgba(20,20,19,0.04),0 8px 32px rgba(20,20,19,0.06);
  --ease:cubic-bezier(0.4,0,0.2,1);
  --app-padding:var(--s-5);
  --section-gap:var(--s-12);
  --header-size:22px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.015'/%3E%3C/svg%3E");background-size:256px 256px;font-family:var(--font-body);color:var(--text);line-height:1.65;min-height:100dvh;display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
.app{width:100%;max-width:430px;min-height:100dvh;padding:env(safe-area-inset-top, 0px) var(--app-padding) calc(env(safe-area-inset-bottom, 0px) + var(--s-12));display:flex;flex-direction:column;margin:0 auto}
@media(min-width:600px){:root{--app-padding:var(--s-8);--section-gap:var(--s-16);--header-size:24px}.app{max-width:560px}}
@media(min-width:1024px){:root{--header-size:26px}.app{max-width:640px}}

/* Page Header */
.page-hdr{display:flex;align-items:center;justify-content:space-between;padding:var(--s-4) 0 var(--s-8)}
.page-title{font-family:var(--font-display);font-size:var(--header-size);font-weight:600;color:var(--text-strong);line-height:1.25}
.btn-back{font-family:var(--font-display);font-size:13px;font-weight:500;color:var(--text-muted);background:none;border:none;cursor:pointer;padding:var(--s-2);border-radius:var(--r-sm);display:flex;align-items:center;gap:var(--s-1);transition:color 150ms var(--ease)}
@media(hover:hover){.btn-back:hover{color:var(--text)}}
.btn-back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Section */
.settings-section{margin-bottom:var(--section-gap)}
.section-label{font-family:var(--font-display);font-size:11px;font-weight:600;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:var(--s-4)}

/* Profile */
.profile-card{display:flex;align-items:center;gap:var(--s-4);margin-bottom:var(--s-6)}
.profile-avatar{width:48px;height:48px;border-radius:50%;background:var(--bg-warm);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--accent);flex-shrink:0}
.profile-name{font-family:var(--font-display);font-size:16px;font-weight:600;color:var(--text-strong);line-height:1.3}
.profile-email{font-size:13px;color:var(--text-muted);margin-top:1px}

/* Setting Row */
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:var(--s-3) 0;min-height:44px;gap:var(--s-4)}
.setting-row+.setting-row{border-top:1px solid var(--border-light)}
.setting-label{font-size:14px;color:var(--text)}
.setting-desc{font-size:12px;color:var(--text-faint);margin-top:2px}
.setting-val{font-family:var(--font-display);font-size:14px;font-weight:500;color:var(--text-muted);display:flex;align-items:center;gap:var(--s-2);flex-shrink:0}

/* Stepper */
.stepper{display:flex;align-items:center;gap:var(--s-2)}
.stepper-btn{width:44px;height:44px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);font-family:var(--font-display);font-size:18px;font-weight:500;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 150ms var(--ease)}
@media(hover:hover){.stepper-btn:hover{border-color:var(--accent);color:var(--accent)}}
.stepper-btn:active{transform:scale(0.96)}
.stepper-val{font-family:var(--font-display);font-size:16px;font-weight:600;color:var(--text-strong);min-width:28px;text-align:center}

/* Toggle */
.toggle-track{width:44px;height:24px;border-radius:12px;background:var(--border);cursor:pointer;position:relative;transition:background 150ms var(--ease);flex-shrink:0}
.toggle-track.on{background:var(--sage)}
.toggle-thumb{width:20px;height:20px;border-radius:50%;background:var(--surface);position:absolute;top:2px;left:2px;box-shadow:var(--shadow-xs);transition:transform 150ms var(--ease)}
.toggle-track.on .toggle-thumb{transform:translateX(20px)}

/* Lang pill (학습 언어 기본값 설정) */
.lang-pill-row{display:flex;gap:var(--s-1);padding:3px;background:var(--bg-warm);border-radius:var(--r-pill)}
.lang-pill{padding:4px var(--s-3);font-family:var(--font-display);font-size:11px;font-weight:500;color:var(--text-muted);background:transparent;border:none;border-radius:var(--r-pill);cursor:pointer;transition:all 150ms var(--ease)}
.lang-pill.active{background:var(--surface);color:var(--text-strong);box-shadow:var(--shadow-xs)}

/* Sync Status */
.sync-status{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-4);background:var(--bg-warm);border-radius:var(--r-md);margin-bottom:var(--s-4)}
.sync-info{flex:1}
.sync-label{font-family:var(--font-display);font-size:13px;font-weight:600;line-height:1.3}
.sync-label.ok{color:var(--sage)}
.sync-label.pending{color:var(--amber)}
.sync-label.error{color:var(--danger)}
.sync-time{font-size:12px;color:var(--text-faint);margin-top:1px}
.btn-sync{font-family:var(--font-display);font-size:13px;font-weight:500;color:var(--accent);background:none;border:1px solid rgba(217,119,87,0.2);border-radius:var(--r-sm);padding:var(--s-2) var(--s-4);cursor:pointer;transition:all 150ms var(--ease)}
@media(hover:hover){.btn-sync:hover{border-color:rgba(217,119,87,0.4);background:rgba(217,119,87,0.04)}}
.btn-sync:active{transform:scale(0.97)}
.btn-sync[disabled]{opacity:0.5;cursor:wait}

/* Storage bar */
.storage-row{padding:var(--s-3) 0}
.storage-label{font-size:13px;color:var(--text-muted);margin-bottom:var(--s-2)}
.storage-bar{height:4px;background:var(--border-light);border-radius:2px;overflow:hidden}
.storage-fill{height:100%;background:var(--sage);border-radius:2px;transition:width 300ms var(--ease)}
.storage-meta{display:flex;justify-content:space-between;margin-top:var(--s-1);font-family:var(--font-display);font-size:11px;color:var(--text-faint)}

/* Danger zone */
.btn-logout{font-family:var(--font-display);font-size:14px;font-weight:500;color:var(--danger);background:none;border:1px solid rgba(180,77,59,0.2);border-radius:var(--r-sm);padding:var(--s-3) var(--s-5);cursor:pointer;transition:all 150ms var(--ease)}
@media(hover:hover){.btn-logout:hover{border-color:var(--danger);background:rgba(180,77,59,0.04)}}

/* App info */
.app-info{margin-top:auto;padding-top:var(--s-8);text-align:center}
.app-info-name{font-family:var(--font-display);font-size:14px;font-weight:600;color:var(--text-faint)}
.app-info-ver{font-family:var(--font-display);font-size:11px;color:var(--text-faint);margin-top:var(--s-1)}

/* Modal */
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:80;padding:var(--s-6)}
.modal.on{display:flex}
.modal-bg{position:absolute;inset:0;background:rgba(20,20,19,0.45)}
.modal-panel{position:relative;background:var(--surface);border-radius:var(--r-md);box-shadow:0 24px 64px rgba(20,20,19,0.12);padding:var(--s-5);max-width:320px;width:100%}
.modal-title{font-family:var(--font-display);font-size:17px;font-weight:600;color:var(--text-strong);letter-spacing:-0.01em;margin-bottom:var(--s-2)}
.modal-body{font-family:var(--font-body);font-size:13px;color:var(--text-muted);line-height:1.6;margin-bottom:var(--s-5);letter-spacing:-0.01em}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-2)}
.btn-modal-cancel{height:44px;background:transparent;color:var(--text-muted);border:1px solid var(--border);border-radius:var(--r-sm);font-family:var(--font-display);font-size:13px;font-weight:500;cursor:pointer;transition:all 150ms var(--ease)}
.btn-modal-cancel:hover{color:var(--text);background:var(--bg-warm)}
.btn-modal-confirm{height:44px;background:var(--accent);color:#fff;border:none;border-radius:var(--r-sm);font-family:var(--font-display);font-size:13px;font-weight:500;cursor:pointer;transition:opacity 150ms var(--ease)}
.btn-modal-confirm:hover{opacity:0.9}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + var(--s-12));transform:translate(-50%,20px);background:rgba(20,20,19,0.9);color:#fff;padding:var(--s-3) var(--s-5);border-radius:var(--r-pill);font-family:var(--font-body);font-size:12px;opacity:0;pointer-events:none;transition:opacity 200ms var(--ease),transform 200ms var(--ease);z-index:90;box-shadow:var(--shadow-sm);white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Reveal */
.reveal{opacity:0;transform:translateY(12px);animation:revealUp .5s var(--ease) forwards}
.r1{animation-delay:0ms}.r2{animation-delay:50ms}.r3{animation-delay:100ms}.r4{animation-delay:150ms}.r5{animation-delay:200ms}.r6{animation-delay:250ms}
@keyframes revealUp{to{opacity:1;transform:translateY(0)}}
</style>
</head>

// Dexie settings (Wave 11.9B · spec §9-7) — 언어/일일 신규/통과 기준/자동 TTS 저장·복원.
// iframe 허브는 window.studyDB 없음 → no-op, 기존 mock UI 그대로.
async function loadSettings() {
  const db = window.studyDB;
  if (!db) return;
  try {
    const row = await db.meta.get('studySettings');
    if (!row?.value) return;
    const s = row.value;
    if (s.lang) {
      document.querySelectorAll('#defaultLang .lang-pill').forEach(p => p.classList.toggle('active', p.dataset.lang === s.lang));
    }
    if (typeof s.dailyNewCount === 'number') document.getElementById('daily-val').textContent = s.dailyNewCount;
    if (typeof s.passThreshold === 'number') document.getElementById('threshold-val').textContent = s.passThreshold;
    if (typeof s.autoTTS === 'boolean') {
      const t = document.querySelector('[data-toggle]');
      if (t) t.classList.toggle('on', s.autoTTS);
    }
  } catch (e) { console.error('[loadSettings]', e); }
}
async function saveSettings() {
  const db = window.studyDB;
  if (!db) return;
  try {
    const lang = document.querySelector('#defaultLang .lang-pill.active')?.dataset.lang || 'en';
    const dailyNewCount = parseInt(document.getElementById('daily-val')?.textContent || '10', 10);
    const passThreshold = parseInt(document.getElementById('threshold-val')?.textContent || '70', 10);
    const autoTTS = document.querySelector('[data-toggle]')?.classList.contains('on') ?? false;
    await db.meta.put({ key: 'studySettings', value: { lang, dailyNewCount, passThreshold, autoTTS }, at: Date.now() });
  } catch (e) { console.error('[saveSettings]', e); }
}
loadSettings();

function adj(id, delta) {
  const el = document.getElementById(id + '-val');
  let v = parseInt(el.textContent) + delta;
  if (id === 'daily') v = Math.max(5, Math.min(20, v));
  if (id === 'threshold') v = Math.max(50, Math.min(90, v));
  el.textContent = v;
  toast(`${id === 'daily' ? '일일 신규' : '통과 기준'} · ${v}${id === 'daily' ? '문장' : '점'}`);
  saveSettings(); // Wave 11.9B
}
// SPA 에선 app.js 가 script 를 IIFE 로 감싸 adj 가 로컬 스코프 — inline onclick="adj(...)" 에서
// 참조 가능하도록 window 에 명시 노출 (iframe 허브는 이미 global).
window.adj = adj;

// toggle
document.querySelectorAll('[data-toggle]').forEach(t => {
  t.addEventListener('click', () => {
    t.classList.toggle('on');
    toast(t.classList.contains('on') ? '자동 시작 ON' : '자동 시작 OFF');
    saveSettings(); // Wave 11.9B
  });
});

// lang pill
document.querySelectorAll('#defaultLang .lang-pill').forEach(p => {
  p.addEventListener('click', () => {
    document.querySelectorAll('#defaultLang .lang-pill').forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    sessionStorage.setItem('studyLang', p.dataset.lang);
    toast('기본 언어 · ' + (p.dataset.lang === 'ja' ? '日本語' : 'English'));
    saveSettings(); // Wave 11.9B
  });
});

// sync (Wave 11.34 — 실 sync 연결. SPA + Supabase 인증 시 startSync 호출, 그 외는 mock 폴백)
document.getElementById('btnSync').addEventListener('click', async () => {
  const btn = document.getElementById('btnSync');
  btn.setAttribute('disabled', 'true');
  btn.textContent = '동기화 중...';
  let success = true;
  try {
    if (window.studySync?.startSync && window.studyAuth?.isSupabaseConfigured) {
      const user = await window.studyAuth.getCurrentUser();
      if (user) {
        const result = await window.studySync.startSync(user);
        if (!result?.ok) {
          success = false;
          console.warn('[settings sync] 부분 실패', result);
        }
      } else {
        success = false;
      }
    }
  } catch (e) {
    console.error('[settings sync]', e);
    success = false;
  } finally {
    btn.textContent = '동기화';
    btn.removeAttribute('disabled');
  }
  document.getElementById('syncTime').textContent = success ? '방금 전' : '실패';
  toast(success ? '동기화 완료' : '동기화 실패');
});

// back
document.getElementById('btnBack').addEventListener('click', () => { window.location.href = 'home.html'; });

// logout modal
document.getElementById('btnLogout').addEventListener('click', () => {
  document.getElementById('logoutModal').classList.add('on');
});
document.getElementById('logoutCancel').addEventListener('click', () => {
  document.getElementById('logoutModal').classList.remove('on');
});
document.getElementById('logoutConfirm').addEventListener('click', async () => {
  // SPA 모드: 실 Supabase signOut (auth.js 가 Dexie close + supabase.auth.signOut 처리,
  //                                  app.js onAuthStateChange 가 #/login 라우팅).
  if (window.studyAuth && window.studyAuth.isSupabaseConfigured) {
    try { await window.studyAuth.signOut(); }
    catch (e) { console.error('[settings] signOut 실패', e); }
    return;
  }
  // mocks 허브(iframe) 또는 env 미설정: 기존 mock 흐름.
  window.location.href = 'login.html';
});

// Wave 11.12: SPA 모드면 실 user 정보로 프로필 hydrate.
// mocks 허브에선 window.studyAuth 없음 → 기본 하드코딩값 (Gio · leftjap@gmail.com) 유지.
(async function hydrateProfile() {
  if (!window.studyAuth || !window.studyAuth.isSupabaseConfigured) return;
  try {
    const user = await window.studyAuth.getCurrentUser();
    if (!user) return;
    const meta = user.user_metadata || {};
    const name = meta.full_name || meta.name || (user.email || '').split('@')[0] || '사용자';
    const email = user.email || '';
    const initial = (name[0] || email[0] || '?').toUpperCase();
    const $name = document.getElementById('profileName');
    const $email = document.getElementById('profileEmail');
    const $avatar = document.getElementById('profileAvatar');
    if ($name) $name.textContent = name;
    if ($email) $email.textContent = email;
    if ($avatar) $avatar.textContent = initial;
  } catch (e) { console.error('[settings] hydrateProfile 실패', e); }
})();

// toast
let toastTimer;
function toast(m) {
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 1500);
}
</script>
