<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#faf9f5">
<title>Study · 로그인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#faf9f5; --surface:#fff; --bg-warm:#f5f0ea;
  --text:#3d3929; --text-strong:#141413; --text-muted:#8a8475; --text-faint:#b5ad9e;
  --accent:#d97757; --accent-hover:#c4623f;
  --sage:#788c5d; --blue:#6a9bcc; --amber:#c4973b; --danger:#b44d3b;
  --border:#e8e4dc; --border-light:#f0ece4;
  --font-display:'Poppins',system-ui,sans-serif;
  --font-body:'Noto Sans KR',system-ui,sans-serif;
  --s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-5:20px;--s-6:24px;--s-8:32px;--s-10:40px;--s-12:48px;--s-16:64px;
  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-pill:999px;
  --shadow-xs:0 1px 2px rgba(20,20,19,0.04);
  --shadow-sm:0 1px 3px rgba(20,20,19,0.04),0 8px 32px rgba(20,20,19,0.06);
  --ease:cubic-bezier(0.4,0,0.2,1);
  --app-padding:var(--s-5);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg);
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.015'/%3E%3C/svg%3E");
  background-size:256px 256px;
  font-family:var(--font-body); color:var(--text); line-height:1.65;
  min-height:100vh; min-height:100dvh;
  display:flex; justify-content:center;
  -webkit-font-smoothing:antialiased;
}
.app{
  width:100%; max-width:430px; min-height:100vh; min-height:100dvh;
  /* iPhone frame border-radius:44px 로 하단 모서리가 content 를 마스킹 → padding-bottom 을 s-12(48px) 로 확보해 본문이 둥근 영역 밖에 배치되도록 */
  padding:env(safe-area-inset-top, 0px) var(--app-padding) calc(env(safe-area-inset-bottom, 0px) + var(--s-12));
  display:flex; flex-direction:column; margin:0 auto;
}
@media(min-width:600px){:root{--app-padding:var(--s-8)}.app{max-width:560px}}
@media(min-width:1024px){.app{max-width:640px}}

/* Preview Switcher */
.pv-bar{
  position:fixed; top:0; left:0; right:0; z-index:200;
  display:flex; gap:var(--s-1); justify-content:center; flex-wrap:wrap;
  padding:var(--s-2) var(--s-3);
  background:rgba(232,228,220,0.95); backdrop-filter:blur(8px);
}
.pv-btn{
  font-family:var(--font-display); font-size:10px; font-weight:500;
  color:var(--text-muted); background:var(--surface);
  border:1px solid var(--border); padding:3px 10px;
  border-radius:var(--r-pill); cursor:pointer;
  transition:all 150ms var(--ease);
}
.pv-btn:hover,.pv-btn.active{color:var(--accent);border-color:var(--accent)}
.pv-spacer{height:36px}

/* 화면 영역
   - top-pad 작게(flex:0.3) + hero flex:1 + foot natural → Study 타이틀이 화면 상단 1/3 지점에 자리잡음
   - hero 는 상단 정렬(flex-start) 로 타이틀·서브가 붙어 나타나고, 남은 공간은 하단 foot 전까지의 여백 */
.top-pad{flex:0.3; min-height:var(--s-8)}
.hero{
  flex:1;
  display:flex; flex-direction:column; justify-content:flex-start;
  padding:var(--s-8) 0 0;
}
.eyebrow{
  font-family:var(--font-display); font-size:11px; font-weight:500;
  color:var(--accent);
  text-transform:uppercase; letter-spacing:0.08em;
  margin-bottom:var(--s-4);
}
.brand{
  font-family:var(--font-display);
  font-size:48px; font-weight:600;
  color:var(--text-strong);
  line-height:1; letter-spacing:-0.03em;
}
@media(min-width:600px){.brand{font-size:56px}}
@media(min-width:1024px){.brand{font-size:64px}}
.brand-sub{
  font-family:var(--font-body);
  font-size:15px; color:var(--text-muted);
  margin-top:var(--s-3); line-height:1.6;
  letter-spacing:-0.01em; max-width:320px;
}

/* 하단 */
.foot{
  display:flex; flex-direction:column; gap:var(--s-3);
}
.error-banner{
  display:none;
  padding:var(--s-3) var(--s-4);
  background:rgba(180,77,59,0.06);
  border:1px solid rgba(180,77,59,0.2);
  border-radius:var(--r-md);
  font-family:var(--font-body);
  font-size:12px; color:var(--danger);
  line-height:1.5; letter-spacing:-0.01em;
}
.error-banner strong{font-family:var(--font-display); font-weight:500; color:var(--text-muted);}
.app[data-state="error"] .error-banner{display:block}

.btn-google{
  display:flex; align-items:center; justify-content:center;
  gap:var(--s-3);
  width:100%; min-height:52px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-sm);
  font-family:var(--font-display);
  font-size:15px; font-weight:500;
  color:var(--text-strong);
  letter-spacing:0.01em; cursor:pointer;
  box-shadow:var(--shadow-xs);
  transition:border-color 150ms var(--ease), background 150ms var(--ease), transform 100ms var(--ease);
  padding:0 var(--s-5);
}
@media(hover:hover){.btn-google:hover{border-color:var(--text-muted); background:var(--bg-warm)}}
.btn-google:active{transform:scale(0.99)}
.btn-google[disabled]{cursor:wait; color:var(--text-muted)}
.btn-google .g-logo{width:20px; height:20px; flex-shrink:0}
.spinner{
  width:18px; height:18px; display:none;
  border:2px solid var(--border); border-top-color:var(--accent);
  border-radius:50%; animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.app[data-state="loading"] .btn-google .g-logo{display:none}
.app[data-state="loading"] .btn-google .spinner{display:block}
.app[data-state="loading"] .btn-google .btn-label{color:var(--text-muted)}

.perm-note{
  font-family:var(--font-body);
  font-size:11px; color:var(--text-faint);
  line-height:1.5; letter-spacing:-0.005em;
  text-align:center; padding:0 var(--s-2);
}

/* reveal */
.rv{opacity:0; transform:translateY(12px); animation:rvUp 0.5s var(--ease) forwards}
.rv1{animation-delay:60ms}.rv2{animation-delay:120ms}.rv3{animation-delay:180ms}.rv4{animation-delay:240ms}
@keyframes rvUp{to{opacity:1;transform:translateY(0)}}

/* toast */
.toast{
  position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + var(--s-12));
  transform:translate(-50%, 20px);
  background:rgba(20,20,19,0.9); color:#fff;
  padding:var(--s-3) var(--s-5); border-radius:var(--r-pill);
  font-family:var(--font-body); font-size:12px;
  opacity:0; pointer-events:none;
  transition:opacity 200ms var(--ease), transform 200ms var(--ease);
  z-index:90; box-shadow:var(--shadow-sm); white-space:nowrap;
}
.toast.on{opacity:1; transform:translate(-50%, 0)}
</style>
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none;" aria-hidden="true">
  <symbol id="g-logo" viewBox="0 0 48 48">
    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
  </symbol>
</svg>

<div class="pv-bar">
  <button class="pv-btn active" onclick="ss('default')">Default</button>
  <button class="pv-btn" onclick="ss('loading')">Loading</button>
  <button class="pv-btn" onclick="ss('error')">Error</button>
</div>

<div class="app" id="app" data-state="default">
  <div class="pv-spacer"></div>
  <div class="top-pad"></div>

  <section class="hero rv rv1">
    <div class="eyebrow">Language learning</div>
    <h1 class="brand">Study</h1>
    <p class="brand-sub">음소 단위 발음 분석과 학습 이력 기반 맞춤 문장. 매일 10분.</p>
  </section>

  <section class="foot rv rv2">
    <div class="error-banner" id="errBanner">
      허용되지 않은 계정입니다.<br>
      <strong>leftjap@gmail.com</strong> 또는 <strong>soyoun312@gmail.com</strong> 으로 로그인하세요.
    </div>

    <button class="btn-google" id="btnGoogle">
      <svg class="g-logo" viewBox="0 0 48 48"><use href="#g-logo"/></svg>
      <span class="spinner"></span>
      <span class="btn-label" id="btnLabel">Google로 계속하기</span>
    </button>

    <p class="perm-note">허용된 계정만 접근할 수 있습니다.</p>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
const STATES = {
  default:{label:'Google로 계속하기', disabled:false},
  loading:{label:'인증 중...',        disabled:true},
  error:  {label:'Google로 다시 시도', disabled:false}
};
function ss(name){
  const s = STATES[name]; if(!s) return;
  const app = document.getElementById('app');
  app.dataset.state = name;
  document.getElementById('btnLabel').textContent = s.label;
  document.getElementById('btnGoogle').toggleAttribute('disabled', s.disabled);
  document.querySelectorAll('.pv-btn').forEach(b=>b.classList.remove('active'));
  const target = [...document.querySelectorAll('.pv-btn')].find(b => b.textContent.toLowerCase().includes(name));
  if (target) target.classList.add('active');
  // re-trigger reveal
  document.querySelectorAll('.rv').forEach(el=>{el.style.animation='none'; void el.offsetWidth; el.style.animation=''});
}

let toastTimer;
function toast(m){
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('on'), 1500);
}

// Wave 11.12: 페이지 진입 시 직전 인증 시도의 에러 마커가 있으면 error state 자동 표시.
//   - 'not_allowed': 비허용 이메일로 로그인 시도 (auth.js / app.js 가 set)
//   - 그 외: 일반 OAuth 실패 메시지
(function checkAuthError() {
  try {
    const key = window.studyAuth ? window.studyAuth.AUTH_ERROR_KEY : 'studyAuthError';
    const flag = localStorage.getItem(key);
    if (flag) {
      ss('error');
      localStorage.removeItem(key);
    }
  } catch (e) { /* localStorage 차단 환경 무시 */ }
})();

document.getElementById('btnGoogle').addEventListener('click', async () => {
  if (document.getElementById('app').dataset.state === 'loading') return;
  ss('loading');
  // SPA 모드 (window.studyAuth 존재): 실 Supabase OAuth.
  // env 미설정이면 isSupabaseConfigured=false → 친절한 에러 표시 (mock 흐름 금지 — 라우트 가드 핑퐁 방지).
  if (window.studyAuth) {
    if (!window.studyAuth.isSupabaseConfigured) {
      console.error('[login] Supabase 미설정 — docs/oauth-setup.md 1단계 참고');
      ss('error');
      return;
    }
    try {
      const { error } = await window.studyAuth.signInWithGoogle();
      if (error) {
        console.error('[login] OAuth 실패', error);
        ss('error');
      }
    } catch (e) {
      console.error('[login] signInWithGoogle 예외', e);
      ss('error');
    }
    return;
  }
  // mocks 허브(iframe — main.js 미경유): 기존 mock 흐름 유지.
  setTimeout(() => { window.location.href = 'home.html'; }, 700);
});
</script>
</body>
</html>
