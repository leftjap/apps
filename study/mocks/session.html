  } else {
    modalTitleEl.textContent = '학습을 종료할까요?';
    modalBodyEl.textContent = '지금까지 진행한 내용은 저장되고 요약 화면으로 이동합니다.';
    modalConfirmEl.textContent = '종료';
  }
  document.getElementById('endModal').classList.add('on');
});
document.getElementById('btnClose').addEventListener('click', () => {
  closeIntent = 'home';
  const ret = sessionStorage.getItem('studyReturnTo') || 'home';
  if (ret === 'stats' || ret === 'sentList') {
    modalTitleEl.textContent = `${getReturnLabel()}으로 돌아갈까요?`;
    modalBodyEl.textContent = '복습을 중단하고 이전 화면으로 돌아갑니다. 다시 진입하면 처음부터 시작합니다.';
    modalConfirmEl.textContent = '돌아가기';
    document.getElementById('endModal').classList.add('on');
  } else {
    // 홈 이동은 confirm 팝업 skip + 즉시 이동. activeSession 은 자동 보존되어 있어
    // home 의 '이어하기' CTA 로 복귀 가능 (Wave 11.34 정책 그대로).
    sessionStorage.removeItem('studyReviewQueue');
    sessionStorage.removeItem('studyReturnTo');
    window.location.href = 'home.html';
  }
});
document.getElementById('endCancel').addEventListener('click', () => {
  document.getElementById('endModal').classList.remove('on');
});
document.getElementById('endConfirm').addEventListener('click', async () => {
  if (closeIntent === 'home') {
    document.getElementById('endModal').classList.remove('on');
    // studyReturnTo 에 따라 분기: home · stats · stats 문장목록 탭.
    // 세션 중단이므로 큐/returnTo 는 여기서 정리 (summary 경로는 finish() 에서 별도 처리).
    const ret = sessionStorage.getItem('studyReturnTo') || 'home';
    sessionStorage.removeItem('studyReviewQueue');
    sessionStorage.removeItem('studyReturnTo');
    // Wave 11.34: 홈 이동 시 activeSession 보존 → home 의 'resume' CTA 가 이어하기 가능.
    // (이전 Wave 11.6B 정책 = clearActiveSession 으로 재개 불가 → 사용자 요구로 반전)
    // stats/sentList 복귀 시는 보존 의미 약함 (해당 화면엔 resume CTA 없음) but 손해 없음 → 일률 보존.
    if (ret === 'stats') window.location.href = 'stats.html';
    else if (ret === 'sentList') window.location.href = 'stats.html?tab=sent';
    else window.location.href = 'home.html';
  } else {
    finish();
  }
});

/* ============ Finish ============ */
// SPA: sessionLogs.add + dailyStats upsert + reviewQueue SRS 갱신 (spec §6·§8-7).
// iframe 허브(window.studyDB 없음): DB 쓰기 skip, summary 이동만.
async function finish() {
  const durationSec = Math.floor((Date.now() - state.startMs) / 1000);
  const db = window.studyDB;
  if (db) {
    try {
      const sessionLogId = 'sl-' + Date.now();
      // 이슈 fix — review 카드(judgments) + 신규 카드(newCompleted) 둘 다 sentenceIds 에.
      // 이전엔 judgments 만 → 신규만 학습한 세션은 sentenceIds=[] → stats 문장목록 (lastBy 매칭) 에서 누락.
      const reviewIds = Object.keys(state.judgments);
      const newIds = state.newCompleted.map(c => c.id).filter(id => !state.judgments[id]);
      const sentenceIds = [...reviewIds, ...newIds];
      await db.transaction('rw', db.sessionLogs, db.dailyStats, db.reviewQueue, db.todayLessons, async () => {
        await db.sessionLogs.add({
          id: sessionLogId, lang: state.lang, date: TODAY_ISO,
          category: state.mode === 'free' ? 'free_review' : 'session',
          durationSec, newCount: state.newCount,
          reviewResults: { O: state.judged.got, '△': state.judged.hmm, X: state.judged.no },
          utteranceCount: state.tryCount, passCount: state.passCount,
          sessionType: state.mode === 'free' ? 'free_review' : 'normal',
          sentenceIds, newSentenceIds: newIds, createdAt: new Date().toISOString(),
        });
        const reviewCount = state.judged.got + state.judged.hmm + state.judged.no;
        const existing = await db.dailyStats.get(TODAY_ISO);
        if (existing) {
          await db.dailyStats.put({
            ...existing,
            utteranceCount: (existing.utteranceCount || 0) + state.tryCount,
            studyTimeSec: (existing.studyTimeSec || 0) + durationSec,
            newSentences: (existing.newSentences || 0) + state.newCount,
            reviewCount: (existing.reviewCount || 0) + reviewCount,
          });
        } else {
          await db.dailyStats.put({
            date: TODAY_ISO, lang: state.lang,
            utteranceCount: state.tryCount, studyTimeSec: durationSec,
            newSentences: state.newCount, reviewCount,
          });
        }
        // SRS: 각 판정 카드의 interval/nextReview/consecutivePass/lastResult 갱신
        for (const [id, kind] of Object.entries(state.judgments)) {
          const card = await db.reviewQueue.get(id);
          if (!card) continue;
          const interval = nextInterval(card.interval || 1, kind);
          const nextReview = nextReviewISO(interval);
          const consecutivePass = kind === 'got' ? (card.consecutivePass || 0) + 1 : 0;
          const lastResult = kind === 'got' ? 'O' : kind === 'hmm' ? '△' : 'X';
          await db.reviewQueue.update(id, { interval, nextReview, consecutivePass, lastResult, updatedAt: new Date().toISOString() });
        }
        // 신규 레슨 → reviewQueue 자동 이관 (spec §6). 같은 id 이미 있으면 skip (drift 방지).
        // todayLessons 는 completed=true 로 마킹 → 오늘 재진입 시 제외할 근거.
        const emptyExp = { key:'', situation:'', grammar:[], chunks:[], phonemes:[], mistake:'', similar:'' };
        for (const nc of state.newCompleted) {
          const already = await db.reviewQueue.get(nc.id);
          if (!already) {
            await db.reviewQueue.add({
              id: nc.id, lang: state.lang,
              sentence: nc.sentence, meaning: nc.meaning, reading: null,
              explanation: nc.explanation || emptyExp,
              interval: 1, nextReview: nextReviewISO(1),
              consecutivePass: 0, lastResult: null,
              category: 'new_from_session', createdAt: new Date().toISOString(),
            });
          }
          await db.todayLessons.update(nc.id, { completed: true, completedAt: new Date().toISOString() });
        }
      });
      // spec §9-7 — 일 발화 PR 갱신 (오늘 누적 > 기존 PR 시 meta.prDailyUtterance put).
      // 오늘 누적 = todayBaseCount (이번 세션 진입 전 합) + state.tryCount (이번 세션). dailyStats upsert
      // 후라 sessionLogs 에 이번 세션도 박혀있지만 meta 직접 put 이 더 단순/저렴.
      try {
        const ss = window.studySessionStats;
        if (ss?.saveDailyPRIfRecord) {
          const todayTotal = (state.todayBaseCount || 0) + (state.tryCount || 0);
          await ss.saveDailyPRIfRecord(db, todayTotal, TODAY_ISO);
        }
      } catch (e) { console.error('[saveDailyPRIfRecord]', e); }
      // Wave 11.10: 약점 음소 누적 (spec §9-5) — pronunciationLog 전체 집계 후 meta.weakPhonemes_<lang> put.
      // Wave 11.34: lang 별 분리 (이전 'en' 하드코딩 → ja 학습 시 weakPhonemes_en 에 ja 데이터 섞임).
      try {
        const logs = await db.pronunciationLog.where('lang').equals(state.lang).toArray();
        const tally = {};
        for (const log of logs) {
          for (const sym of (log.weakPhonemes || [])) {
            tally[sym] = (tally[sym] || 0) + 1;
          }
        }
        await db.meta.put({ key: `weakPhonemes_${state.lang}`, value: tally, at: Date.now() });
      } catch (e) { console.error('[weakPhonemesAggregate]', e); }
      // Wave 11.67-impl: lang_<lang>.userKnown push + Stage 진급 검사 (spec §4 LANG_META + §5-0 단계 5)
      // consecutivePass ≥ 2 도달 카드의 sentence + newElements/knownElements 누적.
      // recentStats 단순화: 이번 세션 reviewResults 비율만 사용. categoryCount / weakPhonemeAccuracy / variationsAccuracy
      // 정확 산출은 별 wave — 미충족 시 진급 안 됨 (일방향 보수). studyUserMeta 미존재 시 noop (mocks 허브).
      try {
        const judgedTotal = state.judged.got + state.judged.hmm + state.judged.no;
        const accuracy = judgedTotal > 0 ? state.judged.got / judgedTotal : 0;
        const cardIds = Object.keys(state.judgments);
        const cardsArr = await db.reviewQueue.bulkGet(cardIds);
        const cardsLookup = new Map();
        for (let i = 0; i < cardIds.length; i++) {
          if (cardsArr[i]) cardsLookup.set(cardIds[i], cardsArr[i]);
        }
        await window.studyUserMeta?.applySessionResults?.(
          db, state.lang, state.judgments, cardsLookup,
          { accuracy, weakPhonemeAccuracy: accuracy, categoryCount: 0, variationsAccuracy: 0 },
        );
      } catch (e) { console.error('[userMeta.applySessionResults]', e); }
      // Wave 11.68-b: PR 4종 검사 + history push (spec §11-5)
      // sessionLogs INSERT 직후 (transaction 안에서 add 했으므로 commit 후 toArray() 에 포함됨).
      // Dexie meta 변경 → sync.js attachHooks 가 'prRecords' 큐로 자동 라우팅 (Wave 11.68-a).
      // studyPR 미존재 (mocks 허브) 시 noop.
      try {
        await window.studyPR?.applyPRUpdate?.(db, state.lang);
      } catch (e) { console.error('[pr.applyPRUpdate]', e); }
    } catch (e) { console.error('[finish][db]', e); }
    // Wave 11.16 — 세션 완료 즉시 sync (spec §4 line 187). 디바운스 3초 안 기다림.
    // fire-and-forget — summary 이동 차단 안 함. window.studySync 미존재 (iframe 허브) 시 noop.
    window.studySync?.flushPendingUploads?.()?.catch?.((e) =>
      console.error('[finish][sync]', e),
    );
  }

  // Wave 11.28 — 이번 세션 발음 집계 (spec §10-1).
  // pronunciationLog 의 today 분 중 createdAt ≥ session.startMs 만 필터 (이번 세션 분만).
  // 평균 overallScore + weakPhonemes 빈도 Top 3.
  // pronunciationLog 인덱스 'date' 활용 (createdAt 미인덱스 — in-memory filter).
  let pronAvg = null;
  let weakTop3 = [];
  if (db) {
    try {
      const startISO = new Date(state.startMs).toISOString();
      const todayLogs = await db.pronunciationLog.where('date').equals(TODAY_ISO).toArray();
      const sessionLogs = todayLogs.filter(l => (l.createdAt || '') >= startISO);
      if (sessionLogs.length > 0) {
        const sum = sessionLogs.reduce((a, l) => a + (l.overallScore || 0), 0);
        pronAvg = Math.round(sum / sessionLogs.length);
        const tally = {};
        for (const log of sessionLogs) {
          for (const sym of (log.weakPhonemes || [])) {
            tally[sym] = (tally[sym] || 0) + 1;
          }
        }
        weakTop3 = Object.entries(tally)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 3)
          .map(([sym]) => sym);
      }
    } catch (e) { console.error('[finish][pronAggregate]', e); }
  }

  const data = {
    lang: state.lang, mode: state.mode,
    durationSec, newCount: state.newCount,
    judged: state.judged,
    tryCount: state.tryCount, passCount: state.passCount,
    reviewTotal: state.reviewCards.length, newTotal: state.newCards.length,
    pronAvg, weakTop3,
    returnTo: sessionStorage.getItem('studyReturnTo') || 'home',
  };
  const ret = sessionStorage.getItem('studyReturnTo') || 'home';
  sessionStorage.removeItem('studyReviewQueue');
  await clearActiveSession(); // Wave 11.6B: 정상 종료 — 재개 엔트리 제거

  // Wave 11.34 — stats/sentList 진입 시 summary skip → 이전 화면으로 즉시 복귀.
  // 데이터(sessionLogs/dailyStats/reviewQueue SRS) 는 위 transaction 에서 이미 저장 완료.
  // 'home' 진입 (홈→공부/자유복습) 만 summary 페이지 의미 있음.
  if (ret === 'stats' || ret === 'sentList') {
    sessionStorage.removeItem('studyReturnTo');
    window.location.href = ret === 'sentList' ? 'stats.html?tab=sent' : 'stats.html';
    return;
  }

  sessionStorage.setItem('studySummary', JSON.stringify(data));
  window.location.href = 'summary.html';
}

/* ============ pv-spacer 동적 높이 ============ */
function syncPvSpacer() {
  const bar = document.querySelector('.pv-bar');
  const spacer = document.querySelector('.pv-spacer');
  if (bar && spacer) spacer.style.height = bar.offsetHeight + 'px';
}
window.addEventListener('resize', syncPvSpacer);

/* ============ 스와이프 제스처 (Wave 11.9C · spec §8-2) ============ */
// 좌=No, 상=Hmm, 우=Got it. review answer phase 에서만 활성. 최소 거리 50px.
let _swipeStart = null;
function attachSwipeGestures() {
  const stage = document.getElementById('stage');
  if (!stage || stage.dataset.swipeAttached === '1') return;
  stage.dataset.swipeAttached = '1';
  stage.addEventListener('pointerdown', (e) => {
    if (state.phase !== 'review' || state.reviewSub !== 'answer') return;
    _swipeStart = { x: e.clientX, y: e.clientY, t: Date.now() };
  });
  stage.addEventListener('pointerup', (e) => {
    if (!_swipeStart) return;
    const dx = e.clientX - _swipeStart.x;
    const dy = e.clientY - _swipeStart.y;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    _swipeStart = null;
    const MIN = 50;
    if (state.phase !== 'review' || state.reviewSub !== 'answer') return;
    if (adx < MIN && ady < MIN) return; // 탭 취급 — 버튼 click 에 위임
    // 상단 (y 감소) 이 더 우세하고 임계 초과 → hmm
    if (ady > adx && dy < -MIN) judge('hmm');
    else if (dx < -MIN) judge('no');
    else if (dx > MIN) judge('got');
  });
  stage.addEventListener('pointercancel', () => { _swipeStart = null; });
}

/* ============ init ============ */
async function init() {
  // Wave 11.22 후속 b: SPA 모드(window.studyDB 존재)면 mocks 디버그 chip(.pv-bar) 숨김.
  // mocks 모드(iframe 허브 — main.js 미경유 → window.studyDB 없음)는 그대로 노출 → 디버그 도구 보존.
  if (window.studyDB) {
    document.querySelector('.pv-bar')?.style.setProperty('display', 'none', 'important');
    document.querySelector('.pv-spacer')?.style.setProperty('display', 'none', 'important');
  }
  // SPA: Dexie 로 CARDS hydrate (iframe 허브는 no-op → mock 유지)
  // Wave 11.33 — state.lang 분기 (en/ja).
  await hydrateCardsFromDB(state.lang);

  // Wave 11.23: settings.autoTTS load (mocks 모드 = window.studyDB false → default true 유지)
  if (window.studyDB) {
    try {
      const settings = await window.studyDB.meta.get('studySettings');
      if (settings?.value && typeof settings.value.autoTTS === 'boolean') {
        state.autoTTS = settings.value.autoTTS;
      }
    } catch (e) { console.warn('[init] autoTTS load 실패', e); }
  }

  // Wave 11.35/11.36: TTS preload — token+SDK + synthesizer (현재 lang) 미리 warmup.
  // 첫 재생 클릭 지연 제거. 실패는 silent — 실 호출 시 web 폴백 path.
  if (typeof window.studySpeech?.preload === 'function') {
    const preloadLang = state.lang === 'ja' ? 'ja-JP' : 'en-US';
    void window.studySpeech.preload({ langs: [preloadLang] });
  }

  // Wave 11.68-d (spec §9-7) — 세션 내 발화 카운터 비교 기준 1회 로드.
  // studyDB / studySessionStats 미존재 (mocks 허브) 시 skip → 카운터는 hidden.
  if (window.studyDB && window.studySessionStats) {
    try {
      const ss = window.studySessionStats;
      state.prevSession = await ss.fetchPrevSession(window.studyDB, state.lang, state.mode);
      state.dailyPR = await ss.fetchDailyPR(window.studyDB);
      state.todayBaseCount = await ss.fetchTodayCount(window.studyDB, state.lang, TODAY_ISO);
    } catch (e) { console.warn('[init] sessionStats load 실패', e); }
  }
  renderSessionStats();

  // Wave 11.6B: mode='resume' 이면 meta.activeSession 에서 state 복원. 실패 시 combined 로 폴백.
  // Wave 11.34: URL/route 의 state.lang 이 saved.lang 과 다르면 — 사용자가 다른 lang 으로 새 학습 의도.
  // 예: 영어 세션 × → home → ja 탭 클릭 → cta 누름 (cta 가 'resume' 으로 박혀있는 상태).
  // saved 폐기 + combined 폴백 = 새 학습 시작. 같은 lang 이면 정상 resume.
  if (state.mode === 'resume') {
    const saved = await loadActiveSession();
    if (saved && saved.lang && saved.lang !== state.lang) {
      await clearActiveSession();
      state.mode = 'combined';
      setupByMode();
    } else if (saved) {
      state.mode = saved.mode; state.phase = saved.phase;
      // saved.lang 동일 또는 부재 시 — saved 그대로 복원 (lang 변동 없음)
      state.reviewCards = saved.reviewCards || []; state.newCards = saved.newCards || [];
      state.reviewIdx = saved.reviewIdx || 0; state.newIdx = saved.newIdx || 0;
      state.reviewSub = saved.reviewSub || 'prompt';
      // elapsedMs 보존: timer 연속성
      state.startMs = Date.now() - (saved.elapsedMs || 0);
      state.judged = saved.judged || { no:0, hmm:0, got:0 };
      state.judgments = saved.judgments || {};
      state.newCompleted = saved.newCompleted || [];
      state.newCount = saved.newCount || 0;
      state.tryCount = saved.tryCount || 0;
      state.passCount = saved.passCount || 0;
      if (saved.returnTo) sessionStorage.setItem('studyReturnTo', saved.returnTo);
    } else {
      // 만료/부재 — 기본 combined 모드로 폴백
      state.mode = 'combined';
      setupByMode();
    }
  } else {
    setupByMode();
  }

  // Wave 11.22 후속 b: setupByMode 자유복습 폴백도 0장 → summary redirect 진행 중. 후속 렌더 skip.
  if (state.reviewCards.length === 0 && state.newCards.length === 0) return;

  // Wave 11.6C: combined 모드에 신규 콘텐츠 0 → 복습만 진행 안내 (spec §5 폴백).
  // free·review·new 모드는 사용자 명시 선택이므로 안내 불필요.
  if (state.mode === 'combined' && state.newCards.length === 0 && state.reviewCards.length > 0) {
    // 토스트 메시지는 초기 렌더 직후 한 번 — toast DOM 은 모든 mocks 에 공통 존재
    setTimeout(() => {
      const t = document.getElementById('toast');
      if (t) { t.textContent = '오늘 새 표현이 아직 없어요 · 복습만 진행합니다'; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 2400); }
    }, 400);
  }

  // Mode pv-btn active 반영
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === state.mode));
  renderHeader();
  renderProgress();
  renderStage();
  attachSwipeGestures(); // Wave 11.9C
  // pv-bar 실측 높이로 spacer 조정 (font 로드 후 한 번 더)
  syncPvSpacer();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncPvSpacer);
  setTimeout(syncPvSpacer, 500);
}
init().catch((e) => console.error('[init]', e));
</script>
