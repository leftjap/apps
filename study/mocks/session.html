<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#faf9f5">
<title>Study · 학습 세션</title>
<!-- Azure Speech SDK 동기 로드 (TTS 용. STT 는 Wave 11.61 부터 REST 직호출). -->
<script src="https://aka.ms/csspeech/jsbrowserpackageraw"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#faf9f5; --surface:#fff; --bg-warm:#f5f0ea;
  --text:#3d3929; --text-strong:#141413; --text-muted:#8a8475; --text-faint:#b5ad9e;
  --accent:#d97757; --accent-hover:#c4623f;
  --sage:#788c5d; --blue:#6a9bcc; --amber:#c4973b; --danger:#b44d3b;
  --border:#e8e4dc; --border-light:#f0ece4;
  --font-display:'Poppins',system-ui,sans-serif;
  --font-body:'Noto Sans KR',system-ui,sans-serif;
  --s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-5:20px;--s-6:24px;--s-8:32px;--s-10:40px;--s-12:48px;--s-16:64px;
  --r-sm:6px;--r-md:10px;--r-lg:16px;--r-pill:999px;
  --shadow-xs:0 1px 2px rgba(20,20,19,0.04);
  --shadow-sm:0 1px 3px rgba(20,20,19,0.04),0 8px 32px rgba(20,20,19,0.06);
  --ease:cubic-bezier(0.4,0,0.2,1);
  --app-padding:var(--s-5);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.015'/%3E%3C/svg%3E");background-size:256px 256px;font-family:var(--font-body);color:var(--text);line-height:1.65;min-height:100dvh;display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
.app{width:100%;max-width:430px;min-height:100dvh;padding:env(safe-area-inset-top, 0px) var(--app-padding) calc(env(safe-area-inset-bottom, 0px) + var(--s-12));display:flex;flex-direction:column;margin:0 auto}
@media(min-width:600px){:root{--app-padding:var(--s-8)}.app{max-width:560px}}
@media(min-width:1024px){.app{max-width:640px}}

/* Preview bar — Mode + Phase jump + State sim */
.pv-bar{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;flex-direction:column;gap:4px;padding:6px 10px;background:rgba(232,228,220,0.95);backdrop-filter:blur(8px)}
.pv-row{display:flex;gap:var(--s-1);justify-content:center;flex-wrap:wrap;align-items:center}
.pv-label{font-family:var(--font-display);font-size:9px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-right:4px}
.pv-btn{font-family:var(--font-display);font-size:10px;font-weight:500;color:var(--text-muted);background:var(--surface);border:1px solid var(--border);padding:3px 9px;border-radius:var(--r-pill);cursor:pointer;transition:all 150ms var(--ease)}
.pv-btn:hover,.pv-btn.active{color:var(--accent);border-color:var(--accent)}
.pv-spacer{height:62px}
/* pv-spacer 는 JS 초기화 시 실측값으로 재설정됨 — pv-bar 가 wrap 되어 3줄이 되면 116px+ 가 될 수 있어 고정값으로는 부족 */

/* Session Header */
.session-hdr{display:flex;justify-content:space-between;align-items:center;padding:var(--s-4) 0 var(--s-3)}
.session-timer{font-family:var(--font-display);font-size:13px;font-weight:500;color:var(--text-faint);letter-spacing:0.02em;font-feature-settings:'tnum'}
.session-counter{font-family:var(--font-display);font-size:12px;color:var(--text-faint)}
.session-counter strong{color:var(--text-muted);font-weight:600}
.session-counter .tag{display:inline-block;padding:1px 6px;border-radius:var(--r-pill);font-size:10px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;margin-right:var(--s-2)}
.session-counter .tag.review{background:rgba(120,140,93,0.12);color:var(--sage)}
.session-counter .tag.new{background:rgba(217,119,87,0.12);color:var(--accent)}
.session-counter .tag.interlude{background:var(--bg-warm);color:var(--text-muted)}
.session-end{font-family:var(--font-display);font-size:12px;font-weight:500;color:var(--text-faint);background:none;border:none;cursor:pointer;padding:var(--s-2);border-radius:var(--r-sm);transition:color 150ms var(--ease)}
@media(hover:hover){.session-end:hover{color:var(--danger)}}
.session-close{display:flex;align-items:center;gap:var(--s-2);background:none;border:none;color:var(--text-muted);cursor:pointer;border-radius:var(--r-sm);transition:color 150ms var(--ease),background 150ms var(--ease);padding:var(--s-2) var(--s-3);margin-left:calc(var(--s-3) * -1);font-family:var(--font-display);font-size:13px;font-weight:500;min-height:36px}
.session-close svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
@media(hover:hover){.session-close:hover{color:var(--text);background:var(--bg-warm)}}

/* Progress bar (segments for combined mode) */
/* Wave 11.68-d — 세션 내 발화 카운터 (spec §9-7).
 * 헤더 직하단. 마스코트 격려 메시지 X — 숫자 + 라벨만.
 * 0 케이스 (직전 세션 없음 / 미시작) → display:none. */
/* spec §9-7 — audio-row 안 녹음 버튼 우측 세로 stack. typography-driven 큰 숫자 + 보조 라벨. */
.session-stats{display:none;flex-direction:column;align-items:flex-end;margin-left:auto;gap:2px;font-family:var(--font-display);line-height:1.1}
.session-stats.is-visible{display:flex}
.session-stats-main{display:flex;align-items:baseline;gap:var(--s-2)}
.session-stats-num{font-size:24px;font-weight:700;color:var(--text-strong);line-height:1;letter-spacing:-0.02em;font-feature-settings:'tnum'}
.session-stats-pass{font-size:12px;color:var(--text-muted);font-weight:500}
.session-stats-side{display:flex;align-items:baseline;gap:var(--s-2);font-size:11px;color:var(--text-muted)}
.session-stats-side span:empty{display:none}
.session-stats-pr{color:var(--accent)}
.session-stats-pr.is-achieved{font-weight:700;animation:prGlow 1.6s ease 1}
@keyframes prGlow{0%,100%{text-shadow:none}50%{text-shadow:0 0 8px rgba(217,119,87,0.6)}}

.progress{display:flex;gap:2px;height:3px;margin:0 calc(var(--app-padding) * -1);margin-bottom:var(--s-2);background:transparent}
.prog-seg{flex:1;background:var(--border-light);border-radius:0;overflow:hidden;position:relative}
.prog-seg.fill{background:var(--accent)}
.prog-seg.partial{background:linear-gradient(to right, var(--accent) 50%, var(--border-light) 50%)}
.prog-seg.boundary{position:relative}
.prog-seg.boundary::after{content:'';position:absolute;right:-2px;top:-3px;bottom:-3px;width:2px;background:var(--bg)}

/* Review Prompt (의미만) */
.prompt-area{padding:var(--s-16) 0 var(--s-8);flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.prompt-kind{font-family:var(--font-display);font-size:11px;font-weight:500;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:var(--s-6)}
.prompt-meaning{font-family:var(--font-body);font-size:20px;font-weight:500;color:var(--text-strong);line-height:1.5;margin-bottom:var(--s-12);max-width:320px}
.prompt-hint{font-size:13px;color:var(--text-faint);margin-bottom:var(--s-6)}
.btn-reveal{font-family:var(--font-display);font-size:15px;font-weight:500;color:var(--text-muted);background:none;border:none;cursor:pointer;padding:var(--s-3) var(--s-6);border-radius:var(--r-sm);transition:color 150ms var(--ease)}
@media(hover:hover){.btn-reveal:hover{color:var(--text);background:var(--bg-warm)}}

/* Answer / New card area */
.answer-area{}
.card-kind{font-family:var(--font-display);font-size:11px;font-weight:500;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.08em;padding-top:var(--s-2);margin-bottom:var(--s-4)}
.card-kind.new{color:var(--accent)}
.card-kind.review{color:var(--sage)}

.sentence-area{padding:var(--s-4) 0 var(--s-6)}
.sentence-main{font-family:var(--font-display);font-size:24px;font-weight:600;color:var(--text-strong);line-height:1.35;letter-spacing:-0.01em;margin-bottom:var(--s-4)}
@media(min-width:600px){.sentence-main{font-size:28px}}
@media(min-width:1024px){.sentence-main{font-size:30px}}
.sentence-main.ja{font-family:var(--font-body)}
.sentence-phonetic{font-size:14px;color:var(--text-faint);margin-bottom:var(--s-2)}
.sentence-meaning{font-size:15px;color:var(--text-muted)}
/* .sentence-area.rec-active — 녹음 중 카드 강조 효과 제거 (사용자 요청). 녹음 상태는 .btn-speak.recording 의 빨간 배경 + pulse 로 충분히 인지 가능. */

.word{transition:color 300ms var(--ease)}
.word.good{color:var(--sage)}
.word.ok{color:var(--amber)}
.word.bad{color:var(--danger);cursor:pointer;text-decoration:underline wavy var(--danger);text-underline-offset:4px}

/* Audio */
.audio-row{display:flex;gap:var(--s-3);margin-bottom:var(--s-6);flex-wrap:wrap}
.btn-listen{display:flex;align-items:center;gap:var(--s-2);font-family:var(--font-display);font-size:14px;font-weight:500;color:var(--accent);background:transparent;border:1px solid rgba(217,119,87,0.2);border-radius:var(--r-sm);padding:var(--s-3) var(--s-4);cursor:pointer;min-height:44px;transition:all 150ms var(--ease)}
@media(hover:hover){.btn-listen:hover{border-color:rgba(217,119,87,0.4);background:rgba(217,119,87,0.04)}}
.btn-listen svg{width:18px;height:18px;flex-shrink:0;fill:currentColor}
.btn-speak{display:flex;align-items:center;gap:var(--s-2);font-family:var(--font-display);font-size:14px;font-weight:600;color:#fff;background:var(--accent);border:none;border-radius:var(--r-sm);padding:var(--s-3) var(--s-4);cursor:pointer;min-height:44px;box-shadow:0 2px 8px rgba(217,119,87,0.25);transition:background 150ms var(--ease),box-shadow 150ms var(--ease)}
@media(hover:hover){.btn-speak:hover{background:var(--accent-hover)}}
.btn-speak svg{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* state 별 아이콘 swap — SVG/dot/spinner 중 하나만 표시, 라벨은 항상 유지 */
.btn-speak .btn-dot{display:none;width:10px;height:10px;border-radius:50%;background:#fff;animation:btnDot .8s ease infinite}
.btn-speak .btn-spin{display:none;width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes btnDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.7)}}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-speak.recording{background:var(--danger);box-shadow:0 0 0 0 rgba(180,77,59,0.4);animation:btnPulse 1.5s ease infinite}
.btn-speak.recording svg{display:none}
.btn-speak.recording .btn-dot{display:inline-block}
.btn-speak.analyzing{background:var(--text-muted);pointer-events:none;box-shadow:none;animation:none}
.btn-speak.analyzing svg{display:none}
.btn-speak.analyzing .btn-spin{display:inline-block}
@keyframes btnPulse{0%{box-shadow:0 0 0 0 rgba(180,77,59,0.4)}70%{box-shadow:0 0 0 12px rgba(180,77,59,0)}100%{box-shadow:0 0 0 0 rgba(180,77,59,0)}}

.wave{display:none;align-items:center;gap:2px;height:18px}
.wave.on{display:flex}
.wave span{width:3px;border-radius:2px;background:var(--accent)}
@keyframes wv{0%,100%{height:4px}50%{height:14px}}
.wave span:nth-child(1){animation:wv .8s ease infinite 0ms;height:7px}
.wave span:nth-child(2){animation:wv .8s ease infinite 150ms;height:11px}
.wave span:nth-child(3){animation:wv .8s ease infinite 300ms;height:5px}
.wave span:nth-child(4){animation:wv .8s ease infinite 450ms;height:13px}

.rec-bar{display:none;align-items:center;justify-content:center;gap:var(--s-3);padding:var(--s-3) 0;margin-bottom:var(--s-6)}
.rec-bar.on{display:flex}
.rec-dot{width:10px;height:10px;background:var(--danger);border-radius:50%;animation:pulse 1.2s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.rec-time{font-family:var(--font-display);font-size:14px;font-weight:500;color:var(--danger);font-feature-settings:'tnum'}
.rec-hint{font-size:12px;color:var(--text-faint)}
.rec-bar.analyzing .rec-dot{background:var(--text-muted);animation:none}
.rec-bar.analyzing .rec-time{color:var(--text-muted)}

/* Score overlay — 숫자 + 메시지만 */
.score-overlay{display:none;position:fixed;inset:0;z-index:100;align-items:center;justify-content:center;pointer-events:none}
.score-overlay.on{display:flex}
.score-inner{display:flex;flex-direction:column;align-items:center;gap:var(--s-3);animation:scoreAnim 2.2s var(--ease) forwards}
.score-val{font-family:var(--font-display);font-weight:700;line-height:1;letter-spacing:-0.03em}
.score-val.s{font-size:64px;color:var(--sage)}
.score-val.a{font-size:48px;color:var(--accent)}
.score-val.b{font-size:36px;color:var(--amber)}
.score-val.c{font-size:28px;color:var(--danger)}
.score-val.glow{position:relative}
.score-val.glow::after{content:'';position:absolute;inset:-20px;background:radial-gradient(circle,rgba(217,119,87,0.18) 0%,transparent 70%);border-radius:50%;z-index:-1}
.score-msg{font-family:var(--font-display);font-size:15px;font-weight:500;color:var(--text-muted);letter-spacing:-0.01em}
@keyframes scoreAnim{0%{opacity:0;transform:translateY(20px) scale(.8)}15%{opacity:1;transform:translateY(-10px) scale(1.05)}30%{transform:translateY(0) scale(1)}70%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}

/* Explain */
.explain-toggle{font-family:var(--font-display);font-size:14px;font-weight:500;color:var(--text-muted);background:none;border:none;cursor:pointer;padding:var(--s-3) 0;display:flex;align-items:center;gap:var(--s-2);transition:color 150ms var(--ease)}
@media(hover:hover){.explain-toggle:hover{color:var(--text)}}
.explain-toggle svg{width:16px;height:16px;transition:transform 150ms var(--ease);stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.explain-toggle.open svg{transform:rotate(180deg)}
.explain-panel{display:none;padding-top:var(--s-4)}
.explain-panel.open{display:block}
.ex-section{margin-bottom:var(--s-6)}
.ex-section:last-child{margin-bottom:0}
.ex-label{font-family:var(--font-display);font-size:11px;font-weight:600;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:var(--s-2)}
.ex-text{font-size:14px;color:var(--text);line-height:1.65}
.ex-text .hl{color:var(--accent);font-weight:500}
.chunk-row{display:flex;flex-wrap:wrap;gap:var(--s-3);margin-top:var(--s-3)}
.chunk{display:flex;flex-direction:column;align-items:center;gap:2px;padding:var(--s-2) var(--s-3);background:var(--bg-warm);border-radius:var(--r-sm)}
.chunk-en{font-family:var(--font-display);font-size:13px;font-weight:600;color:var(--text-strong)}
.chunk-kr{font-size:12px;color:var(--text-muted)}
.phoneme-tags{display:flex;flex-wrap:wrap;gap:var(--s-2);margin-top:var(--s-3)}
.phoneme-tag{font-family:var(--font-display);font-size:13px;font-weight:600;color:var(--accent);padding:var(--s-1) var(--s-3);border:1px solid rgba(217,119,87,0.25);border-radius:var(--r-pill)}
.grammar-block{padding:var(--s-3) var(--s-4);background:var(--bg-warm);border-radius:var(--r-md);margin-top:var(--s-3);font-size:14px;line-height:1.65}
.grammar-block+.grammar-block{margin-top:var(--s-2)}
.grammar-block .struct{font-family:var(--font-display);font-size:13px;font-weight:500;color:var(--text-muted);margin-bottom:var(--s-2)}

/* 변형 연습 */
.var-exercise{margin-top:var(--s-6)}
.var-type{font-family:var(--font-display);font-size:10px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:var(--s-1)}
.var-prompt{font-size:13px;color:var(--text-muted);line-height:1.6;margin-bottom:var(--s-3)}
.var-prompt strong{color:var(--text);font-weight:500}
.var-original{font-family:var(--font-display);font-size:12px;color:var(--text-faint);margin-bottom:var(--s-3)}
.var-input{font-family:var(--font-body);font-size:15px;color:var(--text-strong);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:var(--s-3) var(--s-4);width:100%;min-height:44px;resize:none;outline:none;line-height:1.5;transition:border-color 150ms var(--ease)}
.var-input::placeholder{color:var(--text-faint)}
.var-input:focus{border-color:var(--accent)}
.var-input.ok{border-color:var(--sage)}
.var-input.info{border-color:var(--blue)}
.var-input.err{border-color:var(--danger)}
.var-check{font-family:var(--font-display);font-size:13px;font-weight:500;color:var(--text-muted);background:none;border:none;cursor:pointer;padding:var(--s-2) var(--s-3);border-radius:var(--r-sm);transition:color 150ms var(--ease);margin-top:var(--s-2)}
@media(hover:hover){.var-check:hover{color:var(--text);background:var(--bg-warm)}}
.var-check.checking{color:var(--text-faint);pointer-events:none}
.var-fb{display:none;font-size:13px;line-height:1.6;margin-top:var(--s-3)}
.var-fb.show{display:block}
.var-fb.match{color:var(--sage)}
.var-fb.grammar-ok{color:var(--text-muted)}
.var-fb.grammar-err{color:var(--danger)}
.var-fb .examples{display:flex;flex-wrap:wrap;gap:var(--s-2);margin-top:var(--s-2)}
.var-fb .examples span{font-size:12px;color:var(--text-faint);padding:var(--s-1) var(--s-2);border:1px solid var(--border-light);border-radius:var(--r-sm)}

/* 판정 버튼 */
.judge-row{display:flex;gap:var(--s-3);padding:var(--s-8) 0 var(--s-4)}
.judge-btn{flex:1;font-family:var(--font-display);font-size:15px;font-weight:600;background:transparent;cursor:pointer;padding:var(--s-4) var(--s-3);border-radius:var(--r-sm);text-align:center;min-height:52px;transition:all 150ms var(--ease)}
.judge-no{color:var(--danger);border:1px solid rgba(180,77,59,0.25)}
.judge-hmm{color:var(--amber);border:1px solid rgba(196,151,59,0.25)}
.judge-got{color:var(--sage);border:1px solid rgba(120,140,93,0.25)}
@media(hover:hover){
  .judge-no:hover{border-color:var(--danger);background:rgba(180,77,59,0.04)}
  .judge-hmm:hover{border-color:var(--amber);background:rgba(196,151,59,0.04)}
  .judge-got:hover{border-color:var(--sage);background:rgba(120,140,93,0.04)}
}
.judge-btn.selected{border-width:2px}
.judge-no.selected{background:rgba(180,77,59,0.08);border-color:var(--danger)}
.judge-hmm.selected{background:rgba(196,151,59,0.08);border-color:var(--amber)}
.judge-got.selected{background:rgba(120,140,93,0.08);border-color:var(--sage)}

/* 신규 "다음" CTA
   - 기존: Primary (accent 배경 + 흰 텍스트, full-width) → 카드 내 "따라 말하기" Primary 와 시각 위계 충돌 (디자인 가이드 §1 One bold element)
   - 변경: Secondary 스타일 (투명 + accent 보더 + accent 텍스트) + max-width 제한 (Mac/iPad 에서 과도한 너비 방지).
           마지막 카드(학습 완료) 만 Primary accent 배경으로 강조 */
.next-row{padding:var(--s-6) 0 var(--s-4);display:flex;justify-content:flex-start}
.btn-next{display:block;width:100%;max-width:340px;padding:var(--s-4) var(--s-6);font-family:var(--font-display);font-size:15px;font-weight:500;color:var(--accent);background:transparent;border:1px solid rgba(217,119,87,0.3);border-radius:var(--r-sm);cursor:pointer;min-height:52px;text-align:center;transition:background 150ms var(--ease),border-color 150ms var(--ease),color 150ms var(--ease)}
@media(hover:hover){.btn-next:hover{background:rgba(217,119,87,0.06);border-color:var(--accent)}}
.btn-next.last{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;box-shadow:0 2px 8px rgba(217,119,87,0.25)}
@media(hover:hover){.btn-next.last:hover{background:var(--accent-hover)}}

/* ===== Interstitial (복습 → 신규 전환) ===== */
.interstitial{padding:var(--s-16) 0 var(--s-6);flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left}
.inter-eyebrow{font-family:var(--font-display);font-size:11px;font-weight:500;color:var(--sage);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:var(--s-3)}
.inter-title{font-family:var(--font-display);font-size:32px;font-weight:600;color:var(--text-strong);line-height:1.2;letter-spacing:-0.02em;margin-bottom:var(--s-3)}
@media(min-width:600px){.inter-title{font-size:38px}}
.inter-sub{font-size:14px;color:var(--text-muted);line-height:1.6;margin-bottom:var(--s-10);max-width:360px}
.inter-summary{display:flex;gap:var(--s-6);margin-bottom:var(--s-10);flex-wrap:wrap}
.inter-cell{}
.inter-cell-val{font-family:var(--font-display);font-size:28px;font-weight:600;line-height:1}
.inter-cell-val.got{color:var(--sage)}
.inter-cell-val.hmm{color:var(--amber)}
.inter-cell-val.no{color:var(--danger)}
.inter-cell-val.neutral{color:var(--text-strong)}
.inter-cell-label{font-family:var(--font-display);font-size:11px;font-weight:500;color:var(--text-faint);margin-top:var(--s-1)}
.inter-next-preview{padding:var(--s-5);background:var(--bg-warm);border-radius:var(--r-md);margin-bottom:var(--s-8);max-width:480px}
.inter-next-label{font-family:var(--font-display);font-size:10px;font-weight:600;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:var(--s-2)}
.inter-next-title{font-family:var(--font-display);font-size:14px;font-weight:600;color:var(--text-strong);margin-bottom:var(--s-1)}
.inter-next-desc{font-size:13px;color:var(--text-muted);line-height:1.6}
.inter-ctas{display:flex;flex-direction:column;gap:var(--s-2);max-width:420px}
@media(min-width:1024px){.inter-ctas{max-width:320px}}
.btn-inter-primary{display:block;width:100%;padding:var(--s-4) var(--s-6);font-family:var(--font-display);font-size:15px;font-weight:600;color:#fff;background:var(--accent);border:none;border-radius:var(--r-sm);cursor:pointer;min-height:52px;text-align:center;box-shadow:0 2px 8px rgba(217,119,87,0.25);transition:background 150ms var(--ease)}
@media(hover:hover){.btn-inter-primary:hover{background:var(--accent-hover)}}
.btn-inter-ghost{display:block;width:100%;padding:var(--s-3) var(--s-6);font-family:var(--font-display);font-size:14px;font-weight:500;color:var(--text-muted);background:transparent;border:none;cursor:pointer;min-height:44px;text-align:center;transition:color 150ms var(--ease)}
@media(hover:hover){.btn-inter-ghost:hover{color:var(--text)}}

/* End modal */
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:180;padding:var(--s-6)}
.modal.on{display:flex}
.modal-bg{position:absolute;inset:0;background:rgba(20,20,19,0.45)}
.modal-panel{position:relative;background:var(--surface);border-radius:var(--r-md);box-shadow:0 24px 64px rgba(20,20,19,0.12);padding:var(--s-5);max-width:320px;width:100%}
.modal-title{font-family:var(--font-display);font-size:17px;font-weight:600;color:var(--text-strong);letter-spacing:-0.01em;margin-bottom:var(--s-2)}
.modal-body{font-family:var(--font-body);font-size:13px;color:var(--text-muted);line-height:1.6;margin-bottom:var(--s-5);letter-spacing:-0.01em}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-2)}
.btn-modal-cancel{height:44px;background:transparent;color:var(--text-muted);border:1px solid var(--border);border-radius:var(--r-sm);font-family:var(--font-display);font-size:13px;font-weight:500;cursor:pointer;transition:color 150ms var(--ease),background 150ms var(--ease)}
.btn-modal-cancel:hover{color:var(--text);background:var(--bg-warm)}
.btn-modal-confirm{height:44px;background:var(--danger);color:#fff;border:none;border-radius:var(--r-sm);font-family:var(--font-display);font-size:13px;font-weight:500;cursor:pointer;transition:opacity 150ms var(--ease)}
.btn-modal-confirm:hover{opacity:0.9}

/* Word detail sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(20,20,19,0.25);opacity:0;pointer-events:none;transition:opacity 200ms var(--ease);z-index:150}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:0 -4px 32px rgba(20,20,19,0.08);padding:var(--s-5) var(--s-5) calc(env(safe-area-inset-bottom,0px) + var(--s-12));max-height:65vh;overflow-y:auto;z-index:151;transform:translateY(100%);transition:transform 300ms var(--ease);display:none}
.sheet.on{transform:translateY(0)}
/* iPad/Mac: sheet 중앙 고정 + 명시적 width (position:fixed + left:50% 만으로는 content 크기로 줄어듦) */
@media(min-width:600px){
  .sheet{left:50%;right:auto;transform:translate(-50%,100%);width:calc(100% - var(--s-12) * 2);max-width:560px}
  .sheet.on{transform:translate(-50%,0)}
}
@media(min-width:1024px){
  .sheet{max-width:640px}
}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto var(--s-4)}
.sheet h3{font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--text-strong);margin-bottom:var(--s-1)}
.sheet .sub{font-family:var(--font-body);font-size:12px;color:var(--text-muted);margin-bottom:var(--s-4)}

/* Reveal — animation-fill-mode: both 로 0ms 전 from 상태 유지, 끝난 뒤엔 to 상태 유지.
   (이전 opacity:0 초기값 방식은 일부 렌더 경로에서 끝난 뒤에도 투명 상태로 남는 이슈 있었음) */
.rv{animation:rvUp .5s var(--ease) both}
.r1{animation-delay:0ms}.r2{animation-delay:60ms}.r3{animation-delay:120ms}.r4{animation-delay:180ms}.r5{animation-delay:240ms}
@keyframes rvUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.spacer{height:var(--s-12)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + var(--s-12));transform:translate(-50%,20px);background:rgba(20,20,19,0.9);color:#fff;padding:var(--s-3) var(--s-5);border-radius:var(--r-pill);font-family:var(--font-body);font-size:12px;opacity:0;pointer-events:none;transition:opacity 200ms var(--ease),transform 200ms var(--ease);z-index:190;box-shadow:var(--shadow-sm);white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<!-- Preview bar: Mode + Phase jump + State sim -->
<div class="pv-bar">
  <div class="pv-row">
    <span class="pv-label">Mode</span>
    <button class="pv-btn mode-btn active" data-mode="combined">공부시작</button>
    <button class="pv-btn mode-btn" data-mode="review">복습만</button>
    <button class="pv-btn mode-btn" data-mode="new">신규만</button>
    <span class="pv-label" style="margin-left:8px">Phase</span>
    <button class="pv-btn phase-btn" data-phase="review-first">복습 1</button>
    <button class="pv-btn phase-btn" data-phase="review-last">복습 끝</button>
    <button class="pv-btn phase-btn" data-phase="interstitial">전환</button>
    <button class="pv-btn phase-btn" data-phase="new-first">신규 1</button>
    <button class="pv-btn phase-btn" data-phase="new-last">신규 끝</button>
  </div>
  <div class="pv-row">
    <span class="pv-label">State</span>
    <button class="pv-btn state-btn" data-state="answer">Answer</button>
    <button class="pv-btn state-btn" data-state="explain">Explain</button>
    <button class="pv-btn state-btn" data-state="playing">Playing</button>
    <button class="pv-btn state-btn" data-state="recording">Recording</button>
    <button class="pv-btn state-btn" data-state="score90">Score 90</button>
    <button class="pv-btn state-btn" data-state="score40">Score 40</button>
    <button class="pv-btn state-btn" data-state="words">Words</button>
  </div>
</div>

<div class="app">
  <div class="pv-spacer"></div>

  <!-- Session Header -->
  <div class="session-hdr rv r1">
    <button class="session-close" id="btnClose" aria-label="홈으로 이동">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      <span>홈</span>
    </button>
    <span class="session-timer" id="timer">00:00</span>
    <span class="session-counter" id="counter"></span>
    <button class="session-end" id="btnEnd">학습 종료</button>
  </div>

  <div class="progress" id="progress"></div>

  <!-- Card / Interstitial container -->
  <div id="stage"></div>

  <div class="spacer"></div>
</div>

<!-- Score overlay -->
<div class="score-overlay" id="scoreOverlay">
  <div class="score-inner">
    <div class="score-val" id="scoreVal"></div>
    <div class="score-msg" id="scoreMsg"></div>
  </div>
</div>

<!-- Word detail sheet -->
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="wordSheet" role="dialog" aria-modal="true">
  <div class="sheet-handle"></div>
  <h3 id="wordTitle">"pretty"</h3>
  <p class="sub" id="wordSub">음소 점수 · 52 / 100</p>
  <div id="wordBody">
    <div class="ex-section">
      <div class="ex-label">약한 음소</div>
      <div class="ex-text">t flap (/ɾ/) 이 딱딱한 t 로 발음됨. 한국어 "ㄹ" 에 가까운 탭음으로.</div>
    </div>
    <div class="ex-section">
      <div class="ex-label">Tip</div>
      <div class="ex-text">"프리티" 보다 <span class="hl">프리리</span> 에 가까운 빠른 플랩.</div>
    </div>
  </div>
</div>

<!-- End modal -->
<div class="modal" id="endModal">
  <div class="modal-bg"></div>
  <div class="modal-panel">
    <div class="modal-title">학습을 종료할까요?</div>
    <div class="modal-body">지금까지 진행한 내용은 저장되고 요약 화면으로 이동합니다.</div>
    <div class="modal-actions">
      <button class="btn-modal-cancel" id="endCancel">계속 학습</button>
      <button class="btn-modal-confirm" id="endConfirm">종료</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

/* ============ Mode read ============ */
// 두 환경 지원: (1) SPA(app.js 경유) — #/session?mode=xxx → window.studyRoute.params.mode (정본)
//                (2) mocks 허브(iframe) — iframe URL ?mode=xxx → URLSearchParams (fallback, app.js 미경유)
// Wave 11.34 fix: SPA route params 를 먼저. mocks 허브 + SPA 혼용 path 시 path query 가 hash query 를 덮어쓰지 않도록.
function getMode() {
  // 'resume' 은 Wave 11.6B 의 이어서 하기 — setupByMode 대신 loadActiveSession 복원 경로 사용.
  const allowed = ['combined','review','new','free','resume'];
  const routeMode = window.studyRoute?.params?.mode;
  if (allowed.includes(routeMode)) return routeMode;
  const params = new URLSearchParams(location.search);
  const urlMode = params.get('mode');
  if (allowed.includes(urlMode)) return urlMode;
  const ss = sessionStorage.getItem('studyMode');
  if (allowed.includes(ss)) return ss;
  return 'combined';
}

// Wave 11.33 + Wave 11.34 — lang 분기 (en | ja). 우선순위:
// 1) SPA route params (hash query) — SPA 모드 정본
// 2) URL ?lang= (location.search) — mocks 직접 진입 fallback
// 3) sessionStorage fallback
// 4) default 'en'
//
// Wave 11.33 버그 fix: URLSearchParams 를 SPA route params 보다 먼저 보면, path query (예: /session.html?lang=en)
// 가 hash query (#/session?lang=ja) 를 덮어씀 → ja 탭 클릭해도 영어 카드 진입. mocks 허브 + SPA 혼용 시 발견.
function getLang() {
  const allowed = ['en', 'ja'];
  const routeLang = window.studyRoute?.params?.lang;
  if (allowed.includes(routeLang)) return routeLang;
  const params = new URLSearchParams(location.search);
  const urlLang = params.get('lang');
  if (allowed.includes(urlLang)) return urlLang;
  const ss = sessionStorage.getItem('studyLang');
  if (allowed.includes(ss)) return ss;
  return 'en';
}

/* ============ Dexie hydration (Wave 11.5A) ============ */
// SPA 모드에선 CARDS.en.review/new 를 Dexie reviewQueue/todayLessons 로 덮어쓴다.
// CARDS 는 const 지만 내부 필드(en.review, en.new)는 mutable 이므로 재할당 가능.
// iframe 허브에선 window.studyDB 없음 → no-op, 기존 CARDS mock 유지.
// 목적: seed 가 정본이 되어 session.html 내 r1~r5 해설 중복(11.2 drift 위험) 해소 + stats/home 과 문장 세트 일관.
async function hydrateCardsFromDB(lang = 'en') {
  const db = window.studyDB;
  if (!db) return;
  try {
    const reviews = await db.reviewQueue.where('lang').equals(lang).toArray();
    const lessons = await db.todayLessons.where('lang').equals(lang).toArray();
    const emptyExp = { key:'', situation:'', grammar:[], chunks:[], phonemes:[], mistake:'', similar:'' };
    const toCard = (c, phoneticKey) => ({
      id: c.id,
      sentence: c.sentence,
      phonetic: c[phoneticKey] || '',
      meaning: c.meaning,
      explanation: c.explanation || emptyExp,
      // SRS fields (Wave 11.5B): setupByMode today 필터 + finish() reviewQueue.update 소스
      interval: c.interval,
      nextReview: c.nextReview,
      consecutivePass: c.consecutivePass || 0,
      lastResult: c.lastResult || null,
    });
    // Wave 11.33 — lang 별 CARDS 슬롯 (en/ja). lang 미존재 시 ja 슬롯 lazy 생성.
    if (!CARDS[lang]) CARDS[lang] = { review: [], new: [] };
    // 빈 reviews 도 명시 할당 (이전엔 if(reviews.length) 만 갱신 → 빈 결과 시 stale fixture 유지)
    // Wave 11.65 — review/new 모두 phoneticKr 매핑 통일. 일본어 review (jr1-jr5) 가 한자 병기 sentence
    // 라 한글 표기 없으면 학습자 (한자 미독) 가독성 0. phonetic 매핑 drift 폐기.
    CARDS[lang].review = reviews.map(c => toCard(c, 'phoneticKr'));
    // Wave 11.6C: 오늘 날짜 + 미완료 lessons 만 신규 대상. 전부 소진 시 빈 배열 명시 →
    // setupByMode('combined') 에서 review-only 로 자동 폴백 (nextReview 의 newCards.length 체크가 이미 처리).
    const lessonsToday = lessons.filter(l => l.date === TODAY_ISO && !l.completed);
    lessonsToday.sort((a, b) => (a.orderIndex || 0) - (b.orderIndex || 0));
    CARDS[lang].new = lessonsToday.map(c => toCard(c, 'phoneticKr'));
  } catch (e) { console.error('[hydrateCardsFromDB]', e); }
}

/* ============ Active Session 지속성 (Wave 11.6B · spec §8-6) ============ */
// 1시간 TTL. state 주요 변경 훅에서 save, finish/홈복귀에서 clear.
// iframe 허브(window.studyDB 없음)에선 전부 no-op.
const ACTIVE_SESSION_TTL_MS = 60 * 60 * 1000;
const ACTIVE_SESSION_KEY = 'activeSession';

async function saveActiveSession() {
  const db = window.studyDB;
  if (!db) return;
  try {
    const snapshot = {
      mode: state.mode, phase: state.phase,
      lang: state.lang, // Wave 11.34: resume 시 ja 학습이 en 으로 잡히는 버그 fix
      reviewCards: state.reviewCards, newCards: state.newCards,
      reviewIdx: state.reviewIdx, newIdx: state.newIdx, reviewSub: state.reviewSub,
      // elapsedMs 로 저장 → 재개 시 startMs = Date.now() - elapsedMs 로 타이머 연속성 유지
      elapsedMs: Date.now() - state.startMs,
      judged: state.judged, judgments: state.judgments,
      newCompleted: state.newCompleted,
      newCount: state.newCount, tryCount: state.tryCount, passCount: state.passCount,
      returnTo: sessionStorage.getItem('studyReturnTo') || 'home',
    };
    await db.meta.put({ key: ACTIVE_SESSION_KEY, value: snapshot, at: Date.now() });
  } catch (e) { console.error('[saveActiveSession]', e); }
}

async function loadActiveSession() {
  const db = window.studyDB;
  if (!db) return null;
  try {
    const row = await db.meta.get(ACTIVE_SESSION_KEY);
    if (!row || !row.value) return null;
    if (Date.now() - (row.at || 0) > ACTIVE_SESSION_TTL_MS) {
      await db.meta.delete(ACTIVE_SESSION_KEY);
      return null;
    }
    return row.value;
  } catch (e) { console.error('[loadActiveSession]', e); return null; }
}

async function clearActiveSession() {
  const db = window.studyDB;
  if (!db) return;
  try { await db.meta.delete(ACTIVE_SESSION_KEY); } catch (e) { console.error('[clearActiveSession]', e); }
}

// 데모 단계 하드코딩 (home.TODAY=15 · stats.TODAY=15 · seed TODAY_ISO 와 일치). 실 앱은 new Date().
// Wave 11.6A: window.studyDay(main.js) 경유. iframe 허브 fallback '2026-04-15'.
const TODAY_ISO = window.studyDay?.TODAY_ISO ?? '2026-04-15';
const SRS_INTERVALS = [1, 3, 7, 21, 60]; // spec §6
function nextInterval(current, kind) {
  if (kind === 'no') return 1;
  let idx = SRS_INTERVALS.indexOf(current);
  if (idx === -1) {
    // 표준 배열 밖 값이면 가장 가까운 상위 값 기준
    idx = SRS_INTERVALS.findIndex(v => v >= current);
    if (idx === -1) idx = SRS_INTERVALS.length - 1;
  }
  if (kind === 'got') return SRS_INTERVALS[Math.min(idx + 1, SRS_INTERVALS.length - 1)];
  if (kind === 'hmm') {
    const next = SRS_INTERVALS[Math.min(idx + 1, SRS_INTERVALS.length - 1)];
    return Math.ceil((current + next) / 2);
  }
  return current;
}
function nextReviewISO(interval, baseISO = TODAY_ISO) {
  const base = new Date(baseISO + 'T00:00:00Z');
  base.setUTCDate(base.getUTCDate() + interval);
  return base.toISOString().slice(0, 10);
}

/* ============ Setup by mode ============ */
// home·stats 에서 넘어온 문장 객체({id, en, ko, ...})를 session 카드 포맷으로 변환.
// 1순위: queue item 의 id 로 CARDS.en.review 에서 full card 매칭 → 해설·음소·청크 자동 포함.
// 2순위: queue item 자체에 explanation 이 있으면 그걸 사용.
// 3순위: mock 한계로 해설이 없으면 빈 구조 기본값 (렌더 안 깨지게).
function adaptQueueToCards(list) {
  const reviewById = {};
  for (const c of CARDS.en.review) reviewById[c.id] = c;
  return list.map(s => {
    const full = reviewById[s.id];
    if (full) return full;
    return {
      id: s.id,
      sentence: s.en || s.sentence || '',
      phonetic: s.phonetic || '',
      meaning: s.ko || s.meaning || '',
      explanation: s.explanation || { key:'', situation:'', chunks:[], phonemes:[], mistake:'', similar:'' }
    };
  });
}
function getReviewQueueFromStorage() {
  try {
    const raw = sessionStorage.getItem('studyReviewQueue');
    if (!raw) return null;
    const list = JSON.parse(raw);
    if (!Array.isArray(list) || list.length === 0) return null;
    return adaptQueueToCards(list);
  } catch { return null; }
}

// Dexie hydrate 된 카드에서 today 까지 due 인 것만 (spec §6 "next_review ≤ 오늘")
// storedQueue(home·stats 경로)는 사용자가 명시 선택한 문장이므로 필터 미적용.
function dueToday(cards) {
  return cards.filter(c => !c.nextReview || c.nextReview <= TODAY_ISO);
}

// spec §8-4: 자유 복습 — 복습 큐에서 최대 N장, 기한 초과(overdue) 우선 정렬.
// today 당일 due 는 그 다음, 미래(future) 는 그 다음 순으로 최대 limit 까지.
function pickFreeReview(cards, limit = 20) {
  const overdue = [], dueOn = [], future = [];
  for (const c of cards) {
    if (!c.nextReview) { future.push(c); continue; }
    if (c.nextReview < TODAY_ISO) overdue.push(c);
    else if (c.nextReview === TODAY_ISO) dueOn.push(c);
    else future.push(c);
  }
  overdue.sort((a, b) => (a.nextReview || '').localeCompare(b.nextReview || ''));
  dueOn.sort((a, b) => (a.nextReview || '').localeCompare(b.nextReview || ''));
  return [...overdue, ...dueOn, ...future].slice(0, limit);
}

function setupByMode() {
  // Wave 11.33 — state.lang 분기. CARDS[lang] 없으면 빈 슬롯 lazy 생성 (mocks 단독 ja 진입 cover).
  if (!CARDS[state.lang]) CARDS[state.lang] = { review: [], new: [] };
  const all = CARDS[state.lang];
  // review/free 모드: sessionStorage 에 home·stats 가 저장한 큐가 있으면 우선 사용.
  const storedQueue = (state.mode === 'review' || state.mode === 'free') ? getReviewQueueFromStorage() : null;
  if (state.mode === 'combined') {
    state.reviewCards = dueToday(all.review);
    state.newCards = all.new.slice();
    state.phase = 'review';
    // 첫 학습 / 복습 큐 비어있는 신규 사용자 — review=0 + new>0 → 신규 phase 직진.
    // 미처리 시 빈 phase='review' 진입 → reviewCards 0건이라 stage 빈 채로 stuck.
    if (state.reviewCards.length === 0 && state.newCards.length > 0) {
      state.phase = 'new';
    }
    // Wave 11.22 후속 b: due 0 + new 0 (정규 완료) → 자동 free 폴백 (spec §8-4-1).
    // 미처리 시 빈 phase='review' 진입 → curReviewCard() undefined → wrapWords TypeError → 화면 stuck.
    if (state.reviewCards.length === 0 && state.newCards.length === 0) {
      state.mode = 'free';
      state.reviewCards = pickFreeReview(all.review, 20);
      if (state.reviewCards.length === 0) {
        // 자유복습도 0 (카드 자체 부재) → summary 즉시 이동
        window.location.replace('#/summary?source=empty');
        return;
      }
      // toast 안내는 init 의 Wave 11.6C 분기와 동일 패턴
      setTimeout(() => {
        const t = document.getElementById('toast');
        if (t) {
          t.textContent = '오늘 정규 학습 완료 · 자유복습으로 진행합니다';
          t.classList.add('on');
          setTimeout(() => t.classList.remove('on'), 2400);
        }
      }, 400);
    }
  } else if (state.mode === 'review') {
    state.reviewCards = storedQueue || dueToday(all.review);
    state.newCards = [];
    state.phase = 'review';
  } else if (state.mode === 'free') {
    // spec §8-4: 자유 복습 — 큐에서 최대 20장 (기한 초과 우선)
    state.reviewCards = storedQueue || pickFreeReview(all.review, 20);
    state.newCards = [];
    state.phase = 'review';
  } else if (state.mode === 'new') {
    state.reviewCards = [];
    state.newCards = all.new.slice();
    state.phase = 'new';
  }
}

/* ============ Timer ============ */
// Wave 11.34 — SPA 라우트 변경 시 IIFE 재실행으로 setInterval 누적 (이전 IIFE 의 setInterval 이 cleanup 없이 leak)
// → 이전 closure 의 stale state.startMs 참조 + 새 IIFE 의 setInterval 과 동일 timer element 동시 갱신
// → 1초 간격 다른 값 번갈아 씀 → 사용자 체감 "타이머 정상 기록 안 됨".
// fix: window 전역 handle 로 single instance 보장. 매 IIFE 진입 시 이전 handle clearInterval.
if (window.__studyTimerInterval) clearInterval(window.__studyTimerInterval);
window.__studyTimerInterval = setInterval(() => {
  const timerEl = document.getElementById('timer');
  if (!timerEl) return;
  const sec = Math.floor((Date.now() - state.startMs) / 1000);
  const mm = String(Math.floor(sec/60)).padStart(2,'0');
  const ss = String(sec%60).padStart(2,'0');
  timerEl.textContent = `${mm}:${ss}`;
}, 1000);

/* ============ Header / Progress ============ */
function renderHeader() {
  const c = document.getElementById('counter');
  if (state.phase === 'review') {
    c.innerHTML = `<span class="tag review">복습</span><strong>${state.reviewIdx + 1}</strong> / ${state.reviewCards.length}`;
  } else if (state.phase === 'interstitial') {
    c.innerHTML = `<span class="tag interlude">전환</span>다음: 신규 학습 ${state.newCards.length}문장`;
  } else if (state.phase === 'new') {
    c.innerHTML = `<span class="tag new">신규</span><strong>${state.newIdx + 1}</strong> / ${state.newCards.length}`;
  }
}

function renderProgress() {
  const p = document.getElementById('progress');
  p.innerHTML = '';
  const R = state.reviewCards.length;
  const N = state.newCards.length;

  // 복습 세그먼트
  for (let i = 0; i < R; i++) {
    const seg = document.createElement('div');
    seg.className = 'prog-seg';
    if (state.phase === 'review') {
      if (i < state.reviewIdx) seg.classList.add('fill');
      else if (i === state.reviewIdx) seg.classList.add(state.reviewSub === 'answer' ? 'fill' : 'partial');
    } else {
      // interstitial / new 면 모든 복습 완료
      seg.classList.add('fill');
    }
    // 복습 → 신규 경계선
    if (i === R - 1 && N > 0) seg.classList.add('boundary');
    p.appendChild(seg);
  }

  // 신규 세그먼트
  for (let i = 0; i < N; i++) {
    const seg = document.createElement('div');
    seg.className = 'prog-seg';
    if (state.phase === 'new') {
      if (i < state.newIdx) seg.classList.add('fill');
      else if (i === state.newIdx) seg.classList.add('partial');
    }
    p.appendChild(seg);
  }
}

/* ============ Stage render ============ */
function renderStage() {
  const stage = document.getElementById('stage');
  if (state.phase === 'review') {
    renderReviewCard(stage);
  } else if (state.phase === 'interstitial') {
    renderInterstitial(stage);
  } else if (state.phase === 'new') {
    renderNewCard(stage);
  }
  // spec §9-7 — audio-row 를 매 카드 렌더 시 새로 inject 하므로 session-stats element 도 새로 생성 →
  // 카운터 텍스트 (utter/pass/delta/pr) 갱신 호출. 0 케이스는 renderSessionStats 가 hidden 처리.
  renderSessionStats();
}

function curReviewCard() { return state.reviewCards[state.reviewIdx]; }
function curNewCard() { return state.newCards[state.newIdx]; }

/* ------ Review ------ */
function renderReviewCard(stage) {
  const c = curReviewCard();
  if (!c) return;
  if (state.reviewSub === 'prompt') {
    // Wave 11.34 — prompt hint lang 별 분기 (이전 영어 하드코딩 → ja 카드도 "영어로 떠올려" 표시 버그)
    const promptLangLabel = state.lang === 'ja' ? '일본어' : '영어';
    stage.innerHTML = `
      <div class="prompt-area rv r2">
        <div class="prompt-kind">복습 · ${state.reviewIdx + 1}번째</div>
        <div class="prompt-meaning">${c.meaning}</div>
        <div class="prompt-hint">${promptLangLabel}로 떠올려보세요</div>
        <button class="btn-reveal" id="btnReveal">정답 보기</button>
      </div>
    `;
    document.getElementById('btnReveal').addEventListener('click', reveal);
    return;
  }
  // answer
  stage.innerHTML = `
    <div class="answer-area">
      <div class="card-kind review">복습 · ANSWER</div>
      <div class="sentence-area rv r1" id="sentArea">
        <div class="sentence-main" id="sentMain">${wrapWords(c.sentence)}</div>
        ${c.phonetic ? `<div class="sentence-phonetic">${c.phonetic}</div>` : ''}
        <div class="sentence-meaning">${c.meaning}</div>
      </div>
      ${renderAudioRow()}
      ${renderRecBar()}
      ${renderExplainSection(c.explanation, false)}
      <div class="judge-row rv r4">
        <button class="judge-btn judge-no" data-j="no">No</button>
        <button class="judge-btn judge-hmm" data-j="hmm">Hmm</button>
        <button class="judge-btn judge-got" data-j="got">Got it</button>
      </div>
    </div>
  `;
  wireCardCommon();
  document.querySelectorAll('.judge-btn').forEach(b => {
    b.addEventListener('click', () => judge(b.dataset.j));
  });
}

function reveal() {
  state.reviewSub = 'answer';
  renderHeader(); renderProgress(); renderStage();
  saveActiveSession(); // Wave 11.6B
  // Wave 11.23: autoTTS=true 면 answer stage 진입 시 자동 재생 (spec §8-2-1)
  if (state.autoTTS) {
    setTimeout(() => document.getElementById('btnListen')?.click(), 300);
  }
}

function judge(kind) {
  // 현재 카드의 판정을 기록 (Wave 11.5B) — finish() 에서 reviewQueue 업데이트에 사용
  const curCard = curReviewCard();
  if (curCard) state.judgments[curCard.id] = kind;
  state.judged[kind]++;
  saveActiveSession(); // Wave 11.6B — 판정 직후 즉시 저장
  document.querySelectorAll('.judge-btn').forEach(b => b.classList.remove('selected'));
  const sel = { no:'.judge-no', hmm:'.judge-hmm', got:'.judge-got' }[kind];
  document.querySelector(sel)?.classList.add('selected');
  setTimeout(nextReview, 400);
}

function nextReview() {
  state.reviewIdx++;
  state.reviewSub = 'prompt';
  state.lastScore = null;
  saveActiveSession(); // Wave 11.6B
  if (state.reviewIdx >= state.reviewCards.length) {
    // 복습 완료
    if (state.newCards.length > 0) {
      state.phase = 'interstitial';
    } else {
      finish();
      return;
    }
  }
  renderHeader(); renderProgress(); renderStage();
}

/* ------ Interstitial ------ */
function renderInterstitial(stage) {
  const { got, hmm, no } = state.judged;
  stage.innerHTML = `
    <div class="interstitial">
      <div class="inter-eyebrow rv r1">복습 완료</div>
      <h1 class="inter-title rv r2">잘 했어요.</h1>
      <p class="inter-sub rv r2">복습 ${state.reviewCards.length}문장을 끝냈어요. 이어서 <strong style="color:var(--accent)">새 표현 ${state.newCards.length}문장</strong>을 배울 차례입니다.</p>

      <div class="inter-summary rv r3">
        <div class="inter-cell"><div class="inter-cell-val got">${got}</div><div class="inter-cell-label">Got it</div></div>
        <div class="inter-cell"><div class="inter-cell-val hmm">${hmm}</div><div class="inter-cell-label">Hmm</div></div>
        <div class="inter-cell"><div class="inter-cell-val no">${no}</div><div class="inter-cell-label">No</div></div>
      </div>

      <div class="inter-next-preview rv r4">
        <div class="inter-next-label">다음 단계</div>
        <div class="inter-next-title">신규 학습 · 오늘의 새 표현</div>
        <div class="inter-next-desc">문장 듣기 → 따라 말하기 → 해설 읽기 → 변형 연습. 한 문장당 약 2~3분.</div>
      </div>

      <div class="inter-ctas rv r5">
        <button class="btn-inter-primary" id="interGo">신규 학습 ${state.newCards.length}문장 시작</button>
        <button class="btn-inter-ghost" id="interEnd">여기서 끝내기 · 요약 보기</button>
      </div>
    </div>
  `;
  document.getElementById('interGo').addEventListener('click', () => {
    state.phase = 'new'; state.newIdx = 0;
    renderHeader(); renderProgress(); renderStage();
  });
  document.getElementById('interEnd').addEventListener('click', finish);
}

/* ------ New ------ */
function renderNewCard(stage) {
  const c = curNewCard();
  if (!c) return;
  const isLast = state.newIdx === state.newCards.length - 1;
  stage.innerHTML = `
    <div class="answer-area">
      <div class="card-kind new">신규 · NEW (${state.newIdx + 1}/${state.newCards.length})</div>
      <div class="sentence-area rv r1" id="sentArea">
        <div class="sentence-main" id="sentMain">${wrapWords(c.sentence)}</div>
        ${c.phonetic ? `<div class="sentence-phonetic">${c.phonetic}</div>` : ''}
        <div class="sentence-meaning">${c.meaning}</div>
      </div>
      ${renderAudioRow()}
      ${renderRecBar()}
      ${renderExplainSection(c.explanation, true)}
      <div class="next-row rv r4">
        <button class="btn-next${isLast ? ' last' : ''}" id="btnNext">${isLast ? '학습 완료 · 요약 보기' : '다음 문장 →'}</button>
      </div>
    </div>
  `;
  wireCardCommon();
  document.getElementById('btnNext').addEventListener('click', nextNew);
  // 변형 연습 wire
  document.querySelectorAll('.var-check').forEach(btn => {
    btn.addEventListener('click', () => checkVariation(btn));
  });
  // Wave 11.23: autoTTS=true 면 신규 카드 진입 시 자동 재생 (spec §8-2-1)
  if (state.autoTTS) {
    setTimeout(() => document.getElementById('btnListen')?.click(), 300);
  }
}

function nextNew() {
  // 현재 카드 완료 — reviewQueue 자동 이관 대상 기록 (spec §6 "카드 자동 이관")
  const cur = curNewCard();
  if (cur && !state.newCompleted.some(c => c.id === cur.id)) {
    state.newCompleted.push(cur);
  }
  state.newCount++;
  state.newIdx++;
  state.lastScore = null;
  if (state.newIdx >= state.newCards.length) { finish(); return; }
  renderHeader(); renderProgress(); renderStage();
  saveActiveSession(); // Wave 11.6B
}

function wrapWords(sentence) {
  return sentence.split(/(\s+|[.,!?;:])/).map(tok => {
    if (!tok || /^\s+$/.test(tok) || /^[.,!?;:]+$/.test(tok)) return tok;
    return `<span class="word">${tok}</span>`;
  }).join('');
}

function renderExplain(ex, includeVar) {
  if (!ex) return '';
  let html = '';
  // Wave 11.70 — ja 4필드 우선 (whenToUse). 영어 8필드 (key) 와 동시 존재 시 ja 우선 (drift 방어).
  // spec lesson-explanation-guide-ja.md §3 정합.
  if (ex.whenToUse) html += `<div class="ex-section"><div class="ex-label">이런 상황에서 써요</div><div class="ex-text">${ex.whenToUse}</div></div>`;
  if (ex.key) html += `<div class="ex-section"><div class="ex-label">핵심 포인트</div><div class="ex-text">${ex.key}</div></div>`;
  if (ex.situation) html += `<div class="ex-section"><div class="ex-label">이런 상황에서 써요</div><div class="ex-text">${ex.situation}</div></div>`;
  // Wave 11.64 — empty 배열·빈 문자열 grammar 시 section 자체 생략 (label-only 표시 방지).
  const grammarHasContent = ex.grammar && (
    Array.isArray(ex.grammar) ? ex.grammar.length > 0 : String(ex.grammar).trim() !== ''
  );
  if (grammarHasContent) {
    html += `<div class="ex-section"><div class="ex-label">문법 뜯어보기</div>`;
    if (Array.isArray(ex.grammar)) {
      ex.grammar.forEach(g => {
        // Wave 11.34 — 두 형식 지원: (a) {struct, body} 객체 (영어 fixture), (b) 단순 문자열 (ja seed). drift 방어.
        if (typeof g === 'string') {
          html += `<div class="grammar-block"><div class="struct">${g}</div></div>`;
        } else if (g && typeof g === 'object') {
          html += `<div class="grammar-block"><div class="struct">${g.struct || ''}</div>${g.body || ''}</div>`;
        }
      });
    } else {
      html += `<div class="ex-text">${ex.grammar}</div>`;
    }
    html += `</div>`;
  }
  if (ex.chunks && ex.chunks.length) {
    html += `<div class="ex-section"><div class="ex-label">발음 — 청크 단위</div><div class="ex-text">덩어리로 연결해서 말하세요.</div><div class="chunk-row">`;
    ex.chunks.forEach(c => {
      // Wave 11.34 — 두 형식 지원: (a) [text, phonetic] 튜플 (영어), (b) 단순 문자열 (ja seed)
      if (typeof c === 'string') {
        html += `<div class="chunk"><span class="chunk-en">${c}</span></div>`;
      } else if (Array.isArray(c)) {
        html += `<div class="chunk"><span class="chunk-en">${c[0] || ''}</span><span class="chunk-kr">${c[1] || ''}</span></div>`;
      }
    });
    html += `</div></div>`;
  }
  if (ex.phonemes && ex.phonemes.length) {
    html += `<div class="ex-section"><div class="ex-label">주의 음소</div><div class="phoneme-tags">`;
    ex.phonemes.forEach(p => {
      // Wave 11.34 — 두 형식 지원: (a) [symbol, word] 튜플 (영어), (b) 단순 문자열 (ja seed)
      if (typeof p === 'string') {
        html += `<span class="phoneme-tag">${p}</span>`;
      } else if (Array.isArray(p)) {
        html += `<span class="phoneme-tag">${p[0] || ''} ${p[1] || ''}</span>`;
      }
    });
    html += `</div></div>`;
  }
  // Wave 11.70 — ja 4필드 pronPoints (장음/촉음/묵음/조사 4패턴 핵심).
  if (ex.pronPoints) html += `<div class="ex-section"><div class="ex-label">발음 포인트</div><div class="ex-text">${ex.pronPoints}</div></div>`;
  if (ex.mistake) html += `<div class="ex-section"><div class="ex-label">한국인 실수</div><div class="ex-text">${ex.mistake}</div></div>`;
  if (ex.similar) html += `<div class="ex-section"><div class="ex-label">비슷한 표현</div><div class="ex-text">${ex.similar}</div></div>`;

  // 변형 연습 — 신규 카드에서만
  if (includeVar && ex.varData) {
    html += `<div class="ex-section"><div class="ex-label">변형 연습</div><div class="ex-text" style="margin-bottom:var(--s-4)">과제대로 문장 전체를 다시 써보세요.</div>`;
    ex.varData.exercises.forEach((ex2, i) => {
      html += `
        <div class="var-exercise">
          <div class="var-type">${ex2.type}</div>
          <div class="var-prompt">${ex2.prompt}</div>
          <div class="var-original">원문: ${ex.varData.original}</div>
          <textarea class="var-input" id="vi${i}" rows="2" placeholder="문장 전체를 입력하세요"></textarea>
          <button class="var-check" data-idx="${i}">확인</button>
          <div class="var-fb" id="vf${i}"></div>
        </div>
      `;
    });
    html += `</div>`;
  }
  return html;
}

/* ============ Audio / Rec ============ */
function togglePlay() {
  const w = document.getElementById('wave');
  const l = document.getElementById('listenLbl');
  if (!w || !l) return;
  if (w.classList.contains('on')) {
    w.classList.remove('on'); l.textContent = '듣기';
    // Wave 11.31 — dead code 제거 (window.studySpeech 객체에 speechSynthesis 속성 없음).
    if (typeof window !== 'undefined' && window.speechSynthesis) window.speechSynthesis.cancel();
  }
  else {
    w.classList.add('on'); l.textContent = '재생 중';
    // Wave 11.11: Web Speech Synthesis 로 실 재생 (없으면 mock 애니만).
    // Azure TTS 로 교체는 src/services/speech.js 의 speak() 구현 교체만으로 완료.
    const cur = state.phase === 'review' ? curReviewCard() : curNewCard();
    const text = cur?.sentence || '';
    const done = () => { w.classList.remove('on'); l.textContent = '듣기'; };
    if (text && window.studySpeech?.speak) {
      // Wave 11.34: state.lang 기반 동적 (en→en-US, ja→ja-JP).
      // Wave 11.39: speakAzure 가 audioDuration 기반 정확한 onEnd 호출 (재생 종료 시점). fallback 은 super-edge 안전망 (30s).
      const speakLang = state.lang === 'ja' ? 'ja-JP' : 'en-US';
      window.studySpeech.speak(text, { lang: speakLang, rate: 0.85, onEnd: done });
      setTimeout(done, 30000); // novelty voice / iframe 등 onEnd 미발화 super-edge 안전망
    } else {
      setTimeout(done, 1800);
    }
  }
}

async function toggleRec() {
  const b = document.getElementById('btnSpeak');
  const bar = document.getElementById('recBar');
  const sa = document.getElementById('sentArea');
  const lbl = document.getElementById('speakLbl');
  if (!b) return;
  if (b.classList.contains('recording')) {
    // recording → analyzing
    // Wave 11.62 — recordWav.stop() + analyzeWavRest (REST API). SDK streaming 폐기 (Wave 11.59 차단 우회).
    if (state.recT) { clearInterval(state.recT); state.recT = null; }
    b.classList.remove('recording'); b.classList.add('analyzing');
    lbl.textContent = '분석 중...';
    bar.classList.add('analyzing');
    sa.classList.remove('rec-active');
    const cur = state.phase === 'review' ? curReviewCard() : curNewCard();
    const expected = cur?.sentence || '';
    const analyzeLang = state.lang === 'ja' ? 'ja-JP' : 'en-US';
    let result;
    try {
      const rec = state.recHandle;
      state.recHandle = null;
      if (rec && typeof window.studySpeech?.analyzeWavRest === 'function') {
        rec.stop();
        const blob = await rec.blobPromise;
        result = await window.studySpeech.analyzeWavRest(blob, expected, { lang: analyzeLang });
      } else {
        // mocks 단독 (studySpeech 부재) 또는 recordWav 실패 → 임시 점수
        await new Promise(r => setTimeout(r, 800));
        const reason = rec ? null : 'no_microphone';
        result = { score: Math.floor(Math.random() * 40) + 55, wordScores: [], phonemeScores: [], weakPhonemes: [] };
        if (reason) { result.mockFallback = true; result.fallbackReason = reason; }
      }
    } catch (e) {
      console.warn('[session] analyze 실패, mock 폴백', e);
      result = { score: Math.floor(Math.random() * 40) + 55, wordScores: [], phonemeScores: [], weakPhonemes: [], mockFallback: true, fallbackReason: 'session_catch' };
    }
    b.classList.remove('analyzing');
    lbl.textContent = '따라 말하기';
    bar.classList.remove('on', 'analyzing');
    state.lastAnalyze = result;
    if (result.mockFallback) {
      let msg;
      if (result.fallbackReason === 'no_microphone') {
        msg = '마이크를 찾을 수 없어 분석을 건너뜁니다 (점수는 임시값).';
      } else if (result.fallbackReason === 'no_match') {
        msg = '발화 인식 실패 — 더 또렷이 다시 시도해보세요 (점수는 임시값).';
      } else if (result.fallbackReason === 'azure_init_fail') {
        msg = 'Azure 인증 만료 — 재로그인 후 재시도 (점수는 임시값).';
      } else {
        msg = 'Azure 분석 실패 — 임시 점수만 표시됩니다.';
      }
      const toast = document.getElementById('toast');
      if (toast) {
        toast.textContent = msg;
        toast.classList.add('on');
        setTimeout(() => toast.classList.remove('on'), 3500);
      }
    }
    showScore(result.score);
  } else {
    // idle → recording
    // Wave 11.62 — recordWav 시작. mic 권한 대기 동안 UI 먼저 활성화 (시각적 피드백 유지).
    state.tryCount++;
    renderSessionStats(); // Wave 11.68-d — 발화 시작 즉시 카운터 +1 (점수 팝업 전 시각적 피드백)
    b.classList.add('recording');
    lbl.textContent = '녹음 중 · 탭해서 종료';
    sa.classList.add('rec-active');
    bar.classList.add('on');
    state.recS = 0; document.getElementById('recTime').textContent = '0:00';
    state.recT = setInterval(() => {
      state.recS++;
      document.getElementById('recTime').textContent = Math.floor(state.recS/60) + ':' + String(state.recS%60).padStart(2,'0');
    }, 1000);
    state.recHandle = null;
    if (typeof window.studySpeech?.recordWav === 'function') {
      try {
        state.recHandle = await window.studySpeech.recordWav({ maxSeconds: 15 });
      } catch (e) {
        console.warn('[session] recordWav 실패 (mic 권한 거부 등) — analyzing 단계 폴백', e);
        // recHandle null 유지 → 사용자 stop 시 mock 폴백 + 토스트 안내
      }
    }
  }
}

// Wave 11.10: 발음 로그 저장 (spec §4 study_pronunciation_log + §9-5 약점 음소 추적)
// mock 단계 — 현재 카드의 explanation.phonemes 기반으로 음소별 점수·약점 난수 생성.
// 11.11 에서 Azure Speech SDK 결과로 교체 예정 (adapter 자리).
async function logPronunciation(score) {
  const db = window.studyDB;
  if (!db) return;
  try {
    const cur = state.phase === 'review' ? curReviewCard() : curNewCard();
    // Wave 11.62 fix — REST analyzeWavRest 결과 (state.lastAnalyze) 우선 사용.
    // 부재 시 (mocks 단독 / mock 폴백) 만 cur.explanation.phonemes 기반 random 생성.
    const azure = state.lastAnalyze;
    const useAzure = azure && !azure.mockFallback && Array.isArray(azure.phonemeScores) && azure.phonemeScores.length > 0;
    let phonemeScores, weakPhonemes, recognizedText;
    if (useAzure) {
      phonemeScores = azure.phonemeScores;
      weakPhonemes = azure.weakPhonemes || [];
      recognizedText = azure.recognizedText || cur?.sentence || '';
    } else {
      const phonemes = cur?.explanation?.phonemes || [];
      phonemeScores = phonemes.map(([sym, word]) => ({
        symbol: sym, word,
        score: Math.max(0, Math.min(100, score + Math.floor((Math.random() - 0.5) * 20))),
      }));
      weakPhonemes = phonemeScores.filter(p => p.score < 70).map(p => p.symbol);
      recognizedText = cur?.sentence || '';
    }
    await db.pronunciationLog.add({
      id: 'pl-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
      lang: state.lang,
      sentenceId: cur?.id || null,
      date: TODAY_ISO,
      overallScore: score,
      phonemeScores, weakPhonemes,
      recognizedText,
      createdAt: new Date().toISOString(),
    });
  } catch (e) { console.error('[logPronunciation]', e); }
}

// Wave 11.68-d (spec §9-7) — 세션 내 발화 카운터 + vs 직전 세션 + PR 까지 잔여.
// state.tryCount / passCount 변동 시 호출. 0 케이스 (직전 세션 없음 / studyDB 부재) hidden.
function renderSessionStats() {
  const wrap = document.getElementById('session-stats');
  if (!wrap) return;
  const ss = window.studySessionStats;
  if (!window.studyDB || !ss) {
    wrap.classList.remove('is-visible');
    return;
  }
  const utterEl = document.getElementById('ss-utter');
  const passEl = document.getElementById('ss-pass');
  const deltaEl = document.getElementById('ss-delta');
  const prEl = document.getElementById('ss-pr');
  if (utterEl) utterEl.textContent = state.tryCount;
  if (passEl) passEl.textContent = state.tryCount > 0 ? `통과 ${state.passCount}` : '';

  // vs 직전 세션 — 분당 평균 × 경과 분 baseline
  let deltaText = '';
  if (state.prevSession) {
    const elapsedSec = Math.floor((Date.now() - state.startMs) / 1000);
    const { delta } = ss.computeDeltaVsPrevSession(state.prevSession, elapsedSec, state.tryCount);
    if (delta !== null) deltaText = `vs 직전 ${ss.formatSign(delta)}`;
  }
  if (deltaEl) deltaEl.textContent = deltaText;

  // PR 까지 잔여
  let prText = '';
  let achieved = false;
  const remaining = ss.computePRRemaining(state.dailyPR, state.todayBaseCount, state.tryCount);
  if (remaining !== null) {
    if (remaining === 0) { prText = 'PR 달성!'; achieved = true; }
    else prText = `PR 까지 ${remaining}회`;
  }
  if (prEl) {
    prEl.textContent = prText;
    prEl.classList.toggle('is-achieved', achieved);
  }

  // 표시 조건 — 발화 시작했거나 비교 라벨 하나라도 있으면 표시
  const hasContent = state.tryCount > 0 || deltaText || prText;
  wrap.classList.toggle('is-visible', hasContent);
  wrap.setAttribute('aria-hidden', hasContent ? 'false' : 'true');
}

function showScore(s) {
  if (s >= 70) state.passCount++;
  logPronunciation(s); // Wave 11.10 fire-and-forget Dexie 기록
  renderSessionStats(); // Wave 11.68-d — 발화 후 카운터 갱신 (utteranceCount/passCount 변동 반영)
  const o = document.getElementById('scoreOverlay');
  const v = document.getElementById('scoreVal');
  const m = document.getElementById('scoreMsg');
  v.textContent = s; v.className = 'score-val';
  if (s >= 90) { v.classList.add('s','glow'); m.textContent = 'Perfect!'; }
  else if (s >= 70) { v.classList.add('a','glow'); m.textContent = 'Nice!'; }
  else if (s >= 50) { v.classList.add('b'); m.textContent = 'Almost!'; }
  else { v.classList.add('c'); m.textContent = 'Try again!'; }
  o.classList.add('on');
  setTimeout(() => {
    o.classList.remove('on');
    applyWordHighlight(s);
  }, 2200);
}

function applyWordHighlight(score) {
  // Wave 11.24: state.lastAnalyze.wordScores 우선 (Azure 실 데이터). 부재 시 random 폴백 (mocks 모드).
  const wordScores = state.lastAnalyze?.wordScores || [];
  const words = document.querySelectorAll('.word');
  if (!words.length) return;
  words.forEach(w => w.classList.remove('good','ok','bad'));
  words.forEach((w, i) => {
    let s;
    if (wordScores.length > 0 && wordScores[i]) {
      s = wordScores[i].score;
    } else {
      // mocks 모드 또는 wordScores 부재 → random fallback (이전 동작 그대로)
      s = score + Math.floor((Math.random() - 0.5) * 30);
    }
    let cls = 'good';
    if (s < 50) cls = 'bad';
    else if (s < 70) cls = 'ok';
    w.classList.add(cls);
    if (cls === 'bad') w.addEventListener('click', () => openWordSheet(w.textContent));
  });
}

/* ============ Word sheet ============ */
function openWordSheet(word) {
  const clean = word.replace(/[.,!?;:]/g, '');
  // Wave 11.24: state.lastAnalyze.phonemeScores 우선 — 해당 단어의 음소 평균 + 약점 음소.
  const phonemeScores = state.lastAnalyze?.phonemeScores || [];
  const wordPhonemes = phonemeScores.filter(p => p.word === clean || p.word?.toLowerCase() === clean.toLowerCase());
  let sub;
  if (wordPhonemes.length > 0) {
    const avg = Math.floor(wordPhonemes.reduce((s, p) => s + p.score, 0) / wordPhonemes.length);
    const weak = wordPhonemes.filter(p => p.score < 70).map(p => p.symbol);
    sub = weak.length
      ? `평균 ${avg} / 100 · 약점 음소 ${weak.join(', ')}`
      : `평균 ${avg} / 100`;
  } else {
    // mocks 모드 또는 phonemeScores 부재 → random fallback
    sub = `음소 점수 · ${Math.floor(Math.random()*30+30)} / 100`;
  }
  document.getElementById('wordTitle').textContent = `"${clean}"`;
  document.getElementById('wordSub').textContent = sub;
  document.getElementById('sheetBg').classList.add('on');
  const sh = document.getElementById('wordSheet');
  sh.style.display = 'block';
  setTimeout(() => sh.classList.add('on'), 20);
}
function closeWordSheet() {
  document.getElementById('sheetBg').classList.remove('on');
  const sh = document.getElementById('wordSheet');
  sh.classList.remove('on');
  setTimeout(() => { sh.style.display = 'none'; }, 300);
}
document.getElementById('sheetBg').addEventListener('click', closeWordSheet);

/* ============ Variation check ============ */
function norm(s) { return s.trim().toLowerCase().replace(/[.,!?;:'"]/g, '').replace(/\s+/g, ' '); }

async function checkVariation(btn) {
  const i = btn.dataset.idx;
  const inp = document.getElementById('vi' + i);
  const fb = document.getElementById('vf' + i);
  const c = curNewCard();
  const ex = c.explanation.varData.exercises[i];
  const val = inp.value.trim();
  if (!val) { inp.focus(); return; }

  inp.classList.remove('ok','info','err');
  fb.classList.remove('show','match','grammar-ok','grammar-err');
  fb.innerHTML = '';

  if (ex.expected && ex.expected.includes(norm(val))) {
    inp.classList.add('ok'); fb.classList.add('show','match');
    fb.textContent = '정확합니다.'; return;
  }

  btn.textContent = '확인 중...'; btn.classList.add('checking');
  try {
    const r = await fetch('https://api.languagetool.org/v2/check', {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'text=' + encodeURIComponent(val) + '&language=en-US'
    });
    const j = await r.json();
    const errs = (j.matches || []).filter(m =>
      m.rule && m.rule.id !== 'WHITESPACE_RULE' &&
      m.rule.id !== 'COMMA_PARENTHESIS_WHITESPACE' &&
      m.rule.id !== 'UPPERCASE_SENTENCE_START'
    );
    if (errs.length === 0) {
      inp.classList.add('info'); fb.classList.add('show','grammar-ok');
      let h = '문법적으로 맞는 문장입니다.';
      h += '<div class="examples">' + ex.examples.map(e => '<span>'+e+'</span>').join('') + '</div>';
      fb.innerHTML = h;
    } else {
      inp.classList.add('err'); fb.classList.add('show','grammar-err');
      let h = '문법 오류: ';
      errs.forEach(e => {
        h += (e.message || '');
        if (e.replacements && e.replacements.length) h += ' → ' + e.replacements.slice(0,2).map(r => r.value).join(' / ');
        h += '. ';
      });
      h += '<div class="examples">' + ex.examples.map(e => '<span>'+e+'</span>').join('') + '</div>';
      fb.innerHTML = h;
    }
  } catch(e) {
    fb.classList.add('show','grammar-ok');
    fb.innerHTML = '오프라인 상태입니다.' + '<div class="examples">' + ex.examples.map(e => '<span>'+e+'</span>').join('') + '</div>';
  } finally {
    btn.textContent = '확인'; btn.classList.remove('checking');
  }
}
