<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<title>전체 보기 시안 — 실제 프레임</title>
<style>
:root {
  --tone-255: rgb(255, 255, 255);
  --tone-253: rgb(253, 253, 253);
  --tone-243: rgb(243, 243, 243);
  --shell:    var(--tone-253);
  --sidebar:  var(--tone-255);
  --hover-bg: var(--tone-243);

  --line:      oklch(92.0% 0.006 60);
  --line-soft: oklch(94.5% 0.006 60);

  --ink-1: oklch(22% 0.008 60);
  --ink-2: oklch(38% 0.008 60);
  --ink-3: oklch(56% 0.008 60);
  --ink-4: oklch(72% 0.006 60);

  --crail-soft: oklch(85% 0.05 50);
  --crail-base: #d97757;
  --crail-deep: oklch(48% 0.14 50);

  --r-sm: 8px; --r-md: 12px; --r-lg: 18px;

  --shadow-float:
    0 1px 0 rgba(20, 18, 14, 0.02),
    0 6px 14px -8px rgba(20, 18, 14, 0.08),
    0 24px 48px -24px rgba(20, 18, 14, 0.18);

  --font-sans: -apple-system, BlinkMacSystemFont, "Pretendard", "SF Pro Text", "Apple SD Gothic Neo", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  font-family: var(--font-sans);
  color: var(--ink-1);
  background: var(--shell);
  font-feature-settings: "ss01","tnum";
  -webkit-font-smoothing: antialiased;
}
.mono { font-family: var(--font-mono); }

.app { height: 100vh; display: flex; background: var(--shell); }

.sidebar {
  width: 252px;
  margin: 16px 0 16px 16px;
  background: var(--sidebar);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-float);
  padding: 14px 12px 12px;
  display: flex; flex-direction: column;
  font-size: 14px;
  flex-shrink: 0;
}
.sb__top { display: flex; align-items: center; gap: 4px; padding: 4px 6px 14px 6px; margin-bottom: 4px; }
.sb__brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.sb__name { font-weight: 600; letter-spacing: -0.01em; font-size: 18px; }
.sb__icon-btn {
  width: 28px; height: 28px; border-radius: 7px; border: 0; background: transparent;
  display: grid; place-items: center; cursor: pointer; color: var(--ink-1); flex-shrink: 0; position: relative;
}
.sb__icon-btn:hover { background: var(--hover-bg); }
.sb__icon-btn .ico { width: 18px; height: 18px; opacity: 0.75; }
.sb__icon-btn--has-alert .ico { opacity: 1; }
.sb__icon-btn--has-alert .alert-dot {
  position: absolute; top: 4px; right: 4px; width: 6px; height: 6px;
  border-radius: 50%; background: var(--crail-base); border: 1.5px solid var(--sidebar);
}

.sb__group { margin-bottom: 24px; }
.sb__group--recents { flex: 1; min-height: 0; margin-bottom: 0; overflow-y: auto; padding-top: 16px; scrollbar-width: none; }
.sb__group--recents::-webkit-scrollbar { display: none; }
.sb__label {
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--ink-3); padding: 4px 8px 8px;
}
.sb__item {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 8px; border-radius: 8px; line-height: 1.3;
  color: var(--ink-1); cursor: pointer;
}
.sb__item .ico { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.75; }
.sb__item:hover { background: var(--hover-bg); }
.sb__item--active { background: var(--hover-bg); font-weight: 500; }
.sb__item--active .ico { opacity: 1; color: var(--crail-base); }
.sb__item .meta { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); letter-spacing: -0.01em; }
.sb__item--recent { padding: 12px 8px; color: var(--ink-3); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.sb__item--recent:hover { color: var(--ink-1); }
.sb__recents-more {
  display: block; width: 100%; margin-top: 8px;
  background: transparent; border: 0; cursor: pointer;
  text-align: right; padding: 8px;
  font-family: var(--font-mono); font-size: 11px; color: var(--crail-base);
  letter-spacing: -0.01em;
}
.sb__recents-more:hover { color: var(--crail-deep); }

.sb__footer { padding: 8px 0 0; border-top: 1px solid var(--line-soft); margin-top: 6px; }
.sb__user { display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 6px; border-radius: 8px; cursor: pointer; }
.sb__user:hover { background: var(--hover-bg); }
.sb__avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--crail-base); color: #fff;
  font-family: var(--font-mono); font-weight: 600; font-size: 13px;
  display: grid; place-items: center; flex-shrink: 0;
}
.sb__user-name { font-size: 13px; font-weight: 500; color: var(--ink-1); }

.main { flex: 1; padding: 22px 32px 24px; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.main__view { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
.main__top {
  display: flex; align-items: center; justify-content: space-between;
  padding-bottom: 14px; border-bottom: 1px solid var(--line);
  font-size: 14px; gap: 12px; min-width: 0;
}
.crumb { display: inline-flex; align-items: baseline; gap: 8px; font-size: 14px; color: var(--ink-3); white-space: nowrap; }
.crumb__cat { font-weight: 500; color: var(--ink-2); letter-spacing: -0.01em; cursor: pointer; }
.crumb__cat--active { color: var(--ink-1); cursor: default; }
.crumb__sep { color: var(--ink-4); font-weight: 300; }
.crumb__num {
  display: inline-flex; align-items: baseline;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.02em; margin-left: 2px;
}
.crumb__num-hash { color: var(--ink-3); }
.crumb__num-val  { color: var(--ink-2); }

.col { width: 100%; max-width: 720px; margin: 0 auto; }

.stats { display: flex; gap: 24px; padding: 28px 0 22px; flex-wrap: wrap; justify-content: space-between; }
.stat-lab {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--ink-4);
}
.stat-val { margin-top: 8px; color: var(--ink-1); font-size: 26px; font-weight: 500; letter-spacing: -0.4px; white-space: nowrap; }
.stat-suf { font-size: 13px; color: var(--ink-3); font-weight: 400; margin-left: 3px; }

.chips { display: flex; gap: 6px; padding: 0 0 18px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px; border-radius: 999px; font-size: 12px;
  color: var(--ink-3); border: 1px solid transparent; cursor: pointer; background: transparent;
  font-family: inherit;
}
.chip:hover { background: var(--hover-bg); }
.chip.active { color: var(--ink-1); background: var(--hover-bg); border-color: var(--line); }
.chip .dot { width: 6px; height: 6px; border-radius: 3px; }
.chip .count { color: var(--ink-4); font-size: 11px; font-family: var(--font-mono); }

.list-wrap { padding-bottom: 32px; }
.list-head {
  display: flex; align-items: baseline; gap: 12px;
  padding: 10px 12px 8px; margin-bottom: 4px;
  border-bottom: 1px solid var(--line);
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--ink-4);
}
.list-head .col-no { width: 56px; }
.list-head .col-title { flex: 1; min-width: 0; }
.list-head .col-meta { width: 200px; text-align: right; }

.row {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 10px 12px; border-radius: 8px; cursor: pointer;
  transition: background .1s;
}
.row:hover { background: var(--hover-bg); }
.row__no {
  width: 56px; flex-shrink: 0;
  font-family: var(--font-mono); font-size: 12px; color: var(--ink-4);
  letter-spacing: 0.02em; padding-top: 1px;
}
.row__main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.row__line1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
.row__title {
  font-size: 14px; font-weight: 500; color: var(--ink-1);
  letter-spacing: -0.01em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
}
.row__share {
  font-family: var(--font-mono); font-size: 11px; color: var(--crail-base);
  flex-shrink: 0;
}
.row__excerpt {
  font-size: 12px; color: var(--ink-3); line-height: 1.55;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.row__meta {
  width: 200px; flex-shrink: 0; text-align: right;
  font-family: var(--font-mono); font-size: 11px; color: var(--ink-3);
  letter-spacing: 0.02em; padding-top: 2px;
}
.row__meta .sep { color: var(--ink-4); }
</style>
</head>

<div class="app">

  <main class="main">

  const months=[[2026,4,8],[2026,3,9],[2026,2,7],[2026,1,6],[2025,12,5],[2025,11,4],[2025,10,5],[2025,9,6],[2025,8,4],[2025,7,3],[2025,6,5]];
  let ti=0;
  for(const [y,m,n] of months){
    const days=[]; for(let i=0;i<n;i++) days.push(Math.floor(pseudo(id+i)*27)+1);
    days.sort((a,b)=>b-a);
    for(let i=0;i<n;i++){
      const day=days[i];
      const wc=Math.floor(pseudo(id)*320)+80;
      const wgj=+(wc*0.0175).toFixed(1);
      const shared=pseudo(id+1)>0.5;
      const sharedWithSoyeon=shared&&pseudo(id+7)>0.55;
      out.push({id,num:id,title:TITLES[ti%TITLES.length],excerpt:EXCERPTS[ti%EXCERPTS.length],
        year:y,month:m,day,date:`${y}.${pad(m,2)}.${pad(day,2)}`,
        words:wc,wonGoJi:wgj,shared,sharedWithSoyeon});
      id--; ti++;
    }
  }
  return out;
}
const ENTRIES=buildEntries();
const D={
  entries:ENTRIES, total:ENTRIES.length,
  thisYear:ENTRIES.filter(e=>e.year===2026).length,
  thisMonth:ENTRIES.filter(e=>e.year===2026&&e.month===4).length,
  shared:ENTRIES.filter(e=>e.shared).length,
  sharedSoyeon:ENTRIES.filter(e=>e.sharedWithSoyeon).length,
  totalWords:ENTRIES.reduce((s,e)=>s+e.words,0),
  totalWonGoJi:+(ENTRIES.reduce((s,e)=>s+e.wonGoJi,0)).toFixed(1),
};

document.getElementById('hdr-total').textContent = D.total;
document.getElementById('s-total').textContent = D.total;
document.getElementById('s-year').textContent  = D.thisYear;
document.getElementById('s-month').textContent = D.thisMonth;
document.getElementById('s-words').textContent = D.totalWords.toLocaleString();
document.getElementById('s-sheets').textContent= D.totalWonGoJi;

const chipsEl = document.getElementById('chips');
const chipDefs = [
  {id:'all',    label:'전체',           count:D.total,         dot:null},
  {id:'shared', label:'공유된 글',      count:D.shared,        dot:'var(--crail-base)'},
  {id:'soyeon', label:'소연이 공유한 글', count:D.sharedSoyeon, dot:'var(--ink-2)'},
];
let activeFilter = 'all';
function renderChips(){
  chipsEl.innerHTML = chipDefs.map(c=>`
    <button class="chip ${c.id===activeFilter?'active':''}" data-id="${c.id}">
      ${c.dot?`<span class="dot" style="background:${c.dot}"></span>`:''}
      ${c.label}
      <span class="count mono">${c.count}</span>
    </button>`).join('');
  chipsEl.querySelectorAll('.chip').forEach(el=>{
    el.addEventListener('click',()=>{ activeFilter = el.dataset.id; renderChips(); renderList(); });
  });
}
function filtered(){
  if(activeFilter==='shared') return D.entries.filter(e=>e.shared);
  if(activeFilter==='soyeon') return D.entries.filter(e=>e.sharedWithSoyeon);
  return D.entries;
}
function renderList(){
  const rows = filtered().map(r=>`
    <div class="row">
      <span class="row__no">#${pad(r.num,4)}</span>
      <div class="row__main">
        <div class="row__line1">
          <span class="row__title">${r.title}</span>
          ${r.sharedWithSoyeon?`<span class="row__share">소연</span>`:''}
        </div>
        <div class="row__excerpt">${r.excerpt}</div>
      </div>
      <span class="row__meta">${r.date} <span class="sep">·</span> ${r.words}단어 <span class="sep">·</span> ${r.wonGoJi}매</span>
    </div>`).join('');
  document.getElementById('list').innerHTML = rows;
}
renderChips();
renderList();
</script>
</body>
</html>
