  .aa-h-icon sub {
    font-size: 10px;
    font-weight: 500;
    vertical-align: baseline;
    position: relative;
    top: 1px;
  }

  /* ============ 가계부 — 월별 추이 막대 차트 (typography-driven) ============ */
  .exp-bar-chart-section {
    margin-top: 38px;
  }
  .exp-bar-chart {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 12px;
    align-items: end;
    margin-top: 18px;
    min-height: 110px;
  }
  .exp-bar {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .exp-bar__col {
    width: 100%;
    height: 80px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .exp-bar__fill {
    width: 100%;
    max-width: 36px;
    background: var(--ink-3);
    opacity: 0.18;
    border-radius: 3px;
    transition: opacity .15s ease, background .15s ease;
  }
  .exp-bar.is-current .exp-bar__fill {
    background: var(--crail-base);
    opacity: 1;
  }
  .exp-bar__amount {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-3);
    margin-top: 6px;
    letter-spacing: -0.01em;
  }
  .exp-bar.is-current .exp-bar__amount {
    color: var(--crail-base);
    font-weight: 500;
  }
  .exp-bar__label {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-4);
    letter-spacing: 0.02em;
  }
  .exp-bar.is-current .exp-bar__label {
    color: var(--ink-3);
    font-weight: 500;
  }

  /* ============ 카테고리 가로 막대 (트리맵 → 막대 차트 교체) ============ */
  .exp-treemap-section { margin-top: 24px; }

  .exp-cat-list { display: flex; flex-direction: column; }
  .exp-cat-row {
    display: grid;
    grid-template-columns: 88px 1fr 64px;
    gap: 16px;
    align-items: center;
    padding: 10px 4px;
    cursor: pointer;
    border-radius: 6px;
    transition: background .12s ease;
  }
  .exp-cat-row:hover { background: var(--hover-bg); }
  .exp-cat-row__label {
    font-family: var(--font-sans);
    font-size: 14px; font-weight: 500;
    color: var(--ink-2);
    letter-spacing: -0.01em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .exp-cat-row.is-top .exp-cat-row__label { color: var(--ink-1); font-weight: 600; }
  .exp-cat-row__track { width: 100%; height: 6px; background: transparent; position: relative; }
  .exp-cat-row__fill {
    height: 100%;
    background: var(--ink-3);
    opacity: 0.18;
    border-radius: 3px;
    transition: opacity .15s ease, background .15s ease;
  }
  .exp-cat-row.is-top .exp-cat-row__fill { background: var(--crail-base); opacity: 1; }
  .exp-cat-row__amt {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 14px; font-weight: 500;
    color: var(--ink-2);
    letter-spacing: -0.01em;
    text-align: right;
  }
  .exp-cat-row.is-top .exp-cat-row__amt { color: var(--ink-1); font-weight: 600; }

  .exp-cat-more {
    margin-top: 8px;
    padding: 10px 4px;
    background: transparent;
    border: 0;
    width: 100%;
    text-align: left;
    font-family: var(--font-sans);
    font-size: 12px; font-weight: 500;
    color: var(--ink-3);
    letter-spacing: -0.01em;
    cursor: pointer;
    border-radius: 6px;
    transition: background .12s ease, color .12s ease;
  }
  .exp-cat-more:hover { background: var(--hover-bg); color: var(--ink-2); }

  @media (max-width: 600px) {
    .exp-cat-row { grid-template-columns: 72px 1fr 56px; gap: 12px; }
  }

  /* ============ 연간 가맹점 버블 (keep _packCircles — accent-crail rank tier) ============ */
  .exp-yearly-bubble-section {
    margin-top: 28px;
  }
  .exp-yearly-bubble-wrap {
    position: relative;
    width: 100%;
    margin: 0 auto;
    overflow: hidden;
  }
  .exp-yearly-bubble {
    position: absolute;
    border-radius: 50%;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease;
    /* 사용자 피드백 #9: 정적 배경·선·그림자 제거 (hover 시각만 유지) */
  }
  .exp-yearly-bubble:hover {
    transform: scale(1.08);
    box-shadow: 0 4px 16px rgba(20,18,14,0.16);
    z-index: 2;
  }
  .exp-yearly-bubble:active {
    transform: scale(0.96);
  }
  .exp-yearly-bubble__inner {
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .exp-yearly-bubble__name {
    color: #fff;
    font-weight: 400;
    font-family: var(--font-sans);
    letter-spacing: -0.02em;
    text-align: center;
    line-height: 1.1;
  }
  .exp-yearly-bubble--tier-1 .exp-yearly-bubble__inner,
  .exp-yearly-bubble--tier-2 .exp-yearly-bubble__inner,
  .exp-yearly-bubble--tier-3 .exp-yearly-bubble__inner,
  .exp-yearly-bubble--tier-4 .exp-yearly-bubble__inner,
  .exp-yearly-bubble--tier-5 .exp-yearly-bubble__inner {
    background: transparent;
    border: 1px solid var(--line);
  }
  .exp-yearly-bubble__name { color: var(--ink-2); }

  /* ============ 가맹점 모달 (keep openExpenseFloatingPopup — composer 톤) ============ */
  .exp-fp-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    z-index: 9800;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  .exp-fp-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }
  .exp-fp-card {
    position: fixed;
    background: var(--sidebar);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-pop);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    max-width: 420px;
    width: calc(100vw - 48px);
    max-height: 70vh;
    transform: scale(0.96) translateY(6px);
    opacity: 0;
    transition: transform .22s cubic-bezier(.2,.7,.2,1.04), opacity .18s ease;
    z-index: 9801;
  }
  .exp-fp-overlay.open .exp-fp-card {
    transform: scale(1) translateY(0);
    opacity: 1;
  }
  .exp-fp-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--line-soft);
    flex-shrink: 0;
  }
  .exp-fp-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--ink-1);
    letter-spacing: -0.01em;
  }
  .exp-fp-close {
    width: 28px;
    height: 28px;
    border: 0;
    background: var(--hover-bg);
    border-radius: 50%;
    cursor: pointer;
    display: grid;
    place-items: center;
    color: var(--ink-3);
    transition: background .12s ease, color .12s ease;
    flex-shrink: 0;
  }
  .exp-fp-close:hover {
    background: var(--line);
    color: var(--ink-1);
  }
  .exp-fp-body {
    overflow-y: auto;
    padding: 4px 0;
    flex: 1;
    min-height: 0;
  }
  .exp-fp-body .expense-row {
    padding: 12px 16px;
    border-bottom: 1px solid var(--line-soft);
  }
  .exp-fp-body .expense-row:last-child {
    border-bottom: 0;
  }
  .exp-fp-empty {
    padding: 32px 16px;
    text-align: center;
    font-size: 14px;
    color: var(--ink-4);
  }
  .exp-fp-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    /* Wave 11.6.9 — 합계 위 구분선 제거 (사용자 요구: 모달 컴팩트) */
    flex-shrink: 0;
    background: var(--shell);
  }
  .exp-fp-footer-label {
    font-size: 14px;
    color: var(--ink-3);
    letter-spacing: -0.01em;
  }
  .exp-fp-footer-amount {
    font-size: 16px;
    font-weight: 600;
    color: var(--ink-1);
    font-family: var(--font-mono);
    letter-spacing: -0.01em;
  }

  /* ============ 카테고리 상세 모달 (.exp-cat-modal-*) — 신규 전용 트리 (2026-05-12) ============
     기존 .exp-fp-* (가맹점 anchor popup) 와 무관. viewport 중앙 + 좌우 균등 여백 +
     고정 폭 (acc-modal 패턴 답습). row 는 .exp-popover-row CSS grid 슬롯 활용. */
  .exp-cat-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    z-index: 9810;
    opacity: 0;
    transition: opacity .15s ease;
    display: grid;
    place-items: center;
    padding: clamp(32px, 8vw, 96px);
  }
  .exp-cat-modal-overlay.open { opacity: 1; }
  .exp-cat-modal-card {
    background: var(--sidebar);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-pop);
    width: 100%;
    max-width: 360px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform: translateY(8px);
    transition: transform .15s ease;
  }
  .exp-cat-modal-overlay.open .exp-cat-modal-card { transform: translateY(0); }
  .exp-cat-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--line-soft);
    flex-shrink: 0;
  }
  .exp-cat-modal-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--ink-1);
  }
  .exp-cat-modal-close {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: none;
    background: var(--hover-bg);
    color: var(--ink-3);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .exp-cat-modal-close:hover {
    background: var(--sunken);
    color: var(--ink-1);
  }
  .exp-cat-modal-body {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 4px 16px;
    scrollbar-width: none;          /* Firefox */
    -ms-overflow-style: none;       /* IE/Edge legacy */
  }
  .exp-cat-modal-body::-webkit-scrollbar {
    display: none;                  /* WebKit (Chrome/Safari) */
  }
  .exp-cat-modal-footer {
    flex: 0 0 auto;
    padding: 12px 16px;
    border-top: 1px solid var(--line-soft);
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-1);
  }
  .exp-cat-modal-empty {
    padding: 32px 16px;
    text-align: center;
    color: var(--ink-3);
    font-size: 14px;
  }

  /* ============ 계정 모달 (.acc-modal-*) — 프로필/통계/휴지통/로그아웃 공통 ============ */
  .acc-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    z-index: 9810;
    opacity: 0;
    transition: opacity .15s ease;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .acc-modal-overlay.open { opacity: 1; }
  .acc-modal-card {
    background: var(--sidebar);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-pop);
    width: 100%;
    max-width: 420px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    transform: translateY(8px);
    transition: transform .15s ease;
  }
  .acc-modal-overlay.open .acc-modal-card { transform: translateY(0); }
  .acc-modal-card.is-wide { max-width: 480px; }

  .acc-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 18px 18px 8px;
  }
  .acc-modal-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--ink-1);
    letter-spacing: -0.01em;
  }
  .acc-modal-close {
    background: transparent;
    border: 0;
    padding: 4px;
    border-radius: 6px;
    color: var(--ink-3);
    cursor: pointer;
    transition: background .12s ease, color .12s ease;
    display: grid;
    place-items: center;
  }
  .acc-modal-close:hover { background: var(--hover-bg); color: var(--ink-1); }
  .acc-modal-body {
    padding: 18px;
    overflow-y: auto;
    flex: 1;
  }
  .acc-modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 16px 18px 18px;
  }

  /* 공통 버튼 */
  .acc-btn {
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-2);
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: -0.01em;
    cursor: pointer;
    transition: background .12s ease, color .12s ease, border-color .12s ease;
  }
  .acc-btn:hover { background: var(--hover-bg); color: var(--ink-1); }
  .acc-btn--primary {
    background: var(--ink-1);
    color: var(--tone-255);
    border-color: var(--ink-1);
  }
  .acc-btn--primary:hover { background: var(--ink-2); border-color: var(--ink-2); color: var(--tone-255); }
  .acc-btn--danger { color: var(--crail-base); }
  .acc-btn--danger:hover {
    background: var(--hover-bg);
    color: var(--crail-base);
    border-color: var(--crail-base);
  }

  /* 프로필 폼 */
  .acc-profile-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
  }
  .acc-profile-avatar {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--crail-base);
    color: #fff;
    display: grid; place-items: center;
    font-family: var(--font-mono);
    font-size: 23px;
    font-weight: 600;
    letter-spacing: -0.02em;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }
  .acc-profile-avatar-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: inherit;
  }
  .acc-profile-upload {
    font-size: 12px;
    color: var(--ink-3);
    letter-spacing: -0.01em;
    line-height: 1.5;
  }
  .acc-profile-upload-link {
    color: var(--ink-1);
    text-decoration: underline;
    cursor: pointer;
  }
  .acc-field-label {
    display: block;
    font-size: 12px;
    color: var(--ink-3);
    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }
  .acc-field-input {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--tone-255);
    font-family: var(--font-sans);
    font-size: 14px;
    color: var(--ink-1);
    letter-spacing: -0.01em;
    transition: border-color .12s ease;
  }
  .acc-field-input:focus {
    outline: none;
    border-color: var(--ink-3);
  }

  /* 휴지통 리스트 */
  .acc-trash-empty {
    padding: 24px 12px;
    text-align: center;
    font-size: 14px;
    color: var(--ink-3);
    letter-spacing: -0.01em;
  }
  .acc-trash-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: center;
    padding: 10px 4px;
    border-bottom: 1px solid var(--line-soft);
  }
  .acc-trash-row:last-child { border-bottom: 0; }
  .acc-trash-row__main {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .acc-trash-row__title {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-1);
    letter-spacing: -0.01em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .acc-trash-row__meta {
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: -0.01em;
  }
  .acc-trash-row__action {
    background: transparent;
    border: 0;
    color: var(--ink-3);
    font-size: 12px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    transition: background .12s ease, color .12s ease;
  }
  .acc-trash-row__action:hover { background: var(--hover-bg); color: var(--ink-1); }

  /* 로그아웃 confirm */
  .acc-confirm-text {
    font-size: 14px;
    color: var(--ink-2);
    letter-spacing: -0.01em;
    line-height: 1.6;
  }

  /* 에디터 ⋯ 메뉴 — 고스트 아이콘 버튼 36×36 (작업지시서 §2) */
  .doc-more-wrap { position: relative; }
  .doc-more-btn {
    display: grid;
    place-items: center;
    width: 36px; height: 36px;
    background: transparent;
    border: 0;
    border-radius: 10px;
    color: var(--ink-3);
    cursor: pointer;
    transition: background .12s ease, color .12s ease;
  }
  .doc-more-btn:hover { background: var(--hover-bg); color: var(--ink-1); }
  .doc-more-btn .ico { width: 16px; height: 16px; opacity: 0.85; }
  .doc-more-menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    min-width: 160px;
    background: var(--tone-255);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow-pop);
    padding: 8px;
    display: none;
    z-index: 30;
  }
  .doc-more-menu.is-open { display: block; }
  .doc-more-menu__item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 15px;
    color: var(--ink-1);
    cursor: pointer;
    line-height: 1.3;
    user-select: none;
  }
  .doc-more-menu__item:hover { background: var(--hover-bg); }
  .doc-more-menu__item .ico { width: 16px; height: 16px; opacity: 0.7; flex-shrink: 0; }
  .doc-more-menu__item--danger { color: var(--crail-base); }
  .doc-more-menu__item--danger:hover { background: var(--hover-bg); }
  /* 파트너 공유 글 — ⋯ 메뉴 (현재 항목: 글 삭제 단일) 통째 hide */
  .doc-more-wrap[data-read-only="1"] { display: none; }

  /* ============ "더 보기" 버튼 ============ */
  .exp-cat-more-btn {
    margin: 14px auto 0;
    display: block;
    padding: 8px 18px;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
    color: var(--ink-2);
    font-size: 14px;
    font-weight: 500;
    font-family: var(--font-sans);
    letter-spacing: -0.01em;
    transition: background .12s ease, color .12s ease;
  }
  .exp-cat-more-btn:hover {
    background: var(--hover-bg);
    color: var(--ink-1);
  }

  /* 가맹점 클릭 가능 표시 */
  .exp-rank-1, .exp-cumulative-rank__row {
    cursor: pointer;
    transition: background .12s ease;
  }
  .exp-cumulative-rank__row {
    border-radius: 6px;
  }
  .exp-cumulative-rank__row:hover {
    background: var(--hover-bg);
  }
  .exp-rank-1:hover {
    background: var(--hover-bg);
  }

  /* ============ 라우트별 영역 hide (사용자 피드백 #1, #5) ============ */
  /* Wave 11.6.10 — 가계부 view 에서 edit-toolbar 자체도 hide (이전 카테고리에서 켜놨던 toolbar 잔존 차단) */
  body.is-expense .edit-toolbar { display: none; }

  /* "소연에게 공유" 토글 — navi 카테고리 한정 (가계부·단편·블로그·메모 모두 hide) */
  body:not(.is-navi) .share { display: none; }
  /* Aa (편집 툴바 trigger) — 가계부만 hide (모든 글쓰기 카테고리에서 표시, Wave 11.6.7) */
  body.is-expense .edit-trigger { display: none; }

  /* Phase D — 거래 row highlight (사이드바 리센츠 클릭 → 일자 점프 + 1.5s fade) */
  /* Wave 11.6.9 — SPA timeline 의 .exp-tl-row 도 적용 (회귀 fix) */
  .expense-row.is-highlighted,
  .exp-tl-row.is-highlighted {
    animation: expRowHighlight 1.5s ease;
  }
  @keyframes expRowHighlight {
    0%   { background: rgba(217, 119, 87, 0.30); }
    60%  { background: rgba(217, 119, 87, 0.18); }
    100% { background: rgba(217, 119, 87, 0); }
  }

  /* 거래 없는 일자 클릭 비활성 (사용자 피드백 #7) */
  .exp-month-day.is-zero {
    cursor: default;
    pointer-events: none;
  }
  .exp-month-day.is-zero:hover {
    background: transparent;
    transform: none;
    box-shadow: none;
  }

  /* 다음 달 버튼 disabled (사용자 피드백 #6 — 미래 월 차단) */
  .exp-month-nav-btn:disabled,
  .exp-month-nav-btn.is-disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }
  .exp-month-nav-btn:disabled:hover,
  .exp-month-nav-btn.is-disabled:hover {
    background: transparent;
    color: var(--ink-3);
  }

  /* ============ Admin (.admin-*) — Wave 11.8 사용자별 매핑 편집 ============ */
  /* 사이드바 진입점 hide — admin 은 가계부 우상단 더보기 메뉴에서만 진입 (Wave 11.8 후속) */
  .sb__item[data-category="admin"] { display: none; }
  body.is-admin .top-actions__navi { display: none; }
  body.is-admin .top-actions__expense { display: none; }
  body.is-admin #mainView { display: none; }
  body.is-admin .edit-toolbar { display: none; }
  body.is-admin .edit-trigger { display: none; }
  body.is-admin .share { display: none; }

  #adminView { display: none; padding: 24px 28px 80px; max-width: 720px; }
  body.is-admin #adminView { display: block; }

  .top-actions__admin { display: none; align-items: center; gap: 10px; }
  body.is-admin .top-actions__admin { display: inline-flex; }

  .admin-tabs {
    display: inline-flex;
    background: var(--hover-bg);
    border-radius: var(--r-md);
    padding: 3px;
    gap: 2px;
  }
  .admin-tab {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--ink-3);
    font-size: 14px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 9px;
    cursor: pointer;
    transition: background .12s ease, color .12s ease;
  }
  .admin-tab:hover { color: var(--ink-1); }
  .admin-tab--active {
    background: var(--sidebar);
    color: var(--ink-1);
    box-shadow: var(--shadow-inset-soft);
  }

  .admin-list {
    list-style: none;
    padding: 0;
    margin: 16px 0 0;
    border-top: 1px solid var(--line-soft);
  }
  .admin-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line-soft);
  }
  .admin-row-main {
    display: inline-flex;
    align-items: baseline;
    gap: 8px;
    min-width: 0;
  }
  .admin-row-id {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-2);
    letter-spacing: 0.02em;
  }
  .admin-row-arrow { color: var(--ink-4); font-size: 11px; }
  .admin-row-name {
    font-size: 15px;
    color: var(--ink-1);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .admin-row-meta {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-4);
  }
  .admin-row-actions { display: inline-flex; gap: 6px; }
  .admin-row-btn {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--sidebar);
    color: var(--ink-2);
    font-size: 12px;
    padding: 4px 10px;
    border-radius: var(--r-sm);
    cursor: pointer;
    transition: background .12s ease, color .12s ease, border-color .12s ease;
  }
  .admin-row-btn:hover { background: var(--hover-bg); color: var(--ink-1); }
  .admin-row-btn--danger:hover { color: var(--danger); border-color: var(--danger); }

  .admin-empty, .admin-loading, .admin-error {
    padding: 32px 16px; text-align: center; color: var(--ink-3); font-size: 14px;
  }
  .admin-error { color: var(--danger); }

  .admin-field { display: block; margin-bottom: 12px; }
  .admin-field-label {
    display: block; font-size: 12px; font-weight: 500;
    color: var(--ink-3); margin-bottom: 4px;
  }
  .admin-field input {
    width: 100%; box-sizing: border-box;
    padding: 8px 12px;
    background: var(--sidebar);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    font-size: 15px; color: var(--ink-1);
    box-shadow: var(--shadow-inset-soft);
  }
  .admin-field input:focus {
    outline: none; border-color: var(--crail-base);
    box-shadow: 0 0 0 3px oklch(67% 0.12 50 / 0.16);
  }
  .admin-field input[readonly] {
    background: var(--sunken); color: var(--ink-3);
  }
  .admin-form-error {
    color: var(--danger); font-size: 12px;
    margin-top: 4px; min-height: 18px;
  }

  /* ============ Phase C — 옵션 L: 탭 구조 [피드][통계] + 검색 + FAB ============ */
  /* 상단 sticky toolbar */
  .exp-toolbar {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--shell);
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 0 12px;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--line-soft);
  }

  /* segmented [피드][통계] */
  .exp-tabs {
    display: inline-flex;
    background: var(--hover-bg);
    border-radius: 8px;
    padding: 2px;
    flex-shrink: 0;
  }
  .exp-tab {
    padding: 6px 14px;
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-3);
    letter-spacing: -0.01em;
    border: 0;
    background: transparent;
    border-radius: 6px;
    cursor: pointer;
    transition: background .12s ease, color .12s ease;
  }
  .exp-tab:hover { color: var(--ink-1); }
  .exp-tab.is-active {
    background: var(--sidebar);
    color: var(--ink-1);
    box-shadow: 0 1px 2px rgba(20,18,14,0.06);
  }

  /* 검색 input bar */
  .exp-search-bar {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    background: var(--hover-bg);
    border: 1px solid transparent;
    border-radius: 8px;
    transition: border-color .15s ease, background .15s ease;
  }
  .exp-search-bar:focus-within {
    background: var(--sidebar);
    border-color: var(--crail-base);
  }
  .exp-search-bar > .ico {
    width: 14px;
    height: 14px;
    color: var(--ink-3);
    flex-shrink: 0;
  }
  .exp-search-bar input {
    flex: 1;
    border: 0;
    outline: 0;
    background: transparent;
    font-family: var(--font-sans);
    font-size: 14px;
    color: var(--ink-1);
    letter-spacing: -0.01em;
    padding: 1px 0;
    min-width: 0;
  }
  .exp-search-bar input::placeholder { color: var(--ink-4); }
  .exp-search-clear {
    display: none;
    width: 18px;
    height: 18px;
    border: 0;
    background: transparent;
    cursor: pointer;
    color: var(--ink-3);
    padding: 0;
    flex-shrink: 0;
  }
  .exp-search-clear:hover { color: var(--ink-1); }
  .exp-search-clear svg { width: 12px; height: 12px; }
  .exp-search-bar.has-value .exp-search-clear { display: grid; place-items: center; }

  /* 탭 panel */
  .exp-tab-panel { display: none; }
  .exp-tab-panel.is-active { display: block; }

  /* 통계 sub-segmented [월간][연간] */
  .exp-stats-tabs {
    display: inline-flex;
    background: var(--hover-bg);
    border-radius: 7px;
    padding: 2px;
    margin: 18px 0 6px;
  }
  .exp-stats-tab {
    padding: 5px 12px;
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-3);
    letter-spacing: -0.01em;
    border: 0;
    background: transparent;
    border-radius: 5px;
    cursor: pointer;
    transition: background .12s ease, color .12s ease;
  }
  .exp-stats-tab:hover { color: var(--ink-1); }
  .exp-stats-tab.is-active {
    background: var(--sidebar);
    color: var(--ink-1);
    box-shadow: 0 1px 2px rgba(20,18,14,0.06);
  }
  .exp-stats-panel { display: none; }
  .exp-stats-panel.is-active { display: block; }

  /* 검색 결과 panel */
  .exp-tab-panel--search { padding-top: 14px; }
  .exp-search-result-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 6px 4px 12px;
    border-bottom: 1px solid var(--line-soft);
    margin-bottom: 6px;
  }
  .exp-search-result-count {
    font-size: 14px;
    color: var(--ink-3);
    font-family: var(--font-mono);
    letter-spacing: -0.01em;
  }
  .exp-search-result-sum {
    font-size: 15px;
    font-weight: 600;
    color: var(--ink-1);
    font-family: var(--font-mono);
    letter-spacing: -0.01em;
  }
  .exp-search-empty {
    padding: 32px 16px;
    text-align: center;
    font-size: 14px;
    color: var(--ink-4);
  }
  .exp-tab-panel--search mark {
    background: rgba(217, 119, 87, 0.18);
    color: var(--ink-1);
    padding: 0 2px;
    border-radius: 2px;
  }

  /* keep 흡수 — 일자 그룹 헤더 (피드 timeline 용, 검색 결과 등) */
  .exp-tl-date-group {
    margin-top: 24px;
  }
  .exp-tl-date-group:first-child { margin-top: 8px; }
  .exp-tl-date-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 14px;
    font-weight: 400;
    color: var(--ink-2);
    letter-spacing: -0.01em;
    padding: 8px 4px;
    border-bottom: 1px solid var(--line-soft);
    margin-bottom: 2px;
  }
  .exp-tl-date-header__sum {
    font-family: var(--font-sans);
    font-size: 12px;
    color: var(--ink-3);
    font-weight: 400;
    font-feature-settings: 'tnum' 1;
  }
  .exp-tl-date-group .expense-row {
    border-bottom: 0;
  }
  .exp-tl-date-group .expense-row:last-child {
    border-bottom: 0;
  }

  /* === 월 타임라인 행 — 좌측 42px 날짜 블록 / 거래 / 금액 (작업지시서 §5.3) === */
  .exp-tl-row {
    display: grid;
    grid-template-columns: 42px 1fr auto;
    gap: 10px;
    align-items: start;
    padding: 13px 4px;
    cursor: pointer;
    transition: background .12s;
  }
  .exp-tl-row + .exp-tl-row { border-top: 1px solid var(--line-soft); }
  .exp-tl-row:hover { background: var(--hover-bg); border-radius: 8px; }
  .exp-tl-row.is-cont { padding-top: 0; border-top: 0; }

  /* 날짜 블록 — 일 15px 모노 + 요일 9.5px (§5.3) */
  .exp-tl-row__date {
    display: flex;
    flex-direction: column;
    gap: 4px;
    line-height: 1;
  }
  .exp-tl-row__date-d {
    font-family: var(--font-mono);
    font-size: 15px;
    font-weight: 600;
    color: var(--ink-1);
    line-height: 1;
  }
  .exp-tl-row__date-dow {
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 0.08em;
    color: var(--ink-4);
    line-height: 1;
  }
  .exp-tl-row.today .exp-tl-row__date-d { color: var(--crail-deep); }

  /* 거래 — 지출처 13.5px/600 + 메타 "카테고리 · 카드명" 10.5px (§5.3, 칩 금지) */
  .exp-tl-row__body {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }
  .exp-tl-row__merchant {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink-1);
    line-height: 1.25;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .exp-tl-row__meta {
    font-size: 10.5px;
    color: var(--ink-4);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .exp-tl-row__recur { width: 11px; height: 11px; color: var(--ink-4); flex-shrink: 0; vertical-align: -1px; margin-left: 3px; }

  /* 금액 — 모노 13px 우정렬 (§5.3) */
  .exp-tl-row__amount {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-1);
    letter-spacing: -0.01em;
    text-align: right;
    white-space: nowrap;
    line-height: 1.25;
  }
  .exp-tl-row__amount .amt-num { color: var(--ink-1); }
  .exp-tl-row__amount .amt-unit { color: var(--ink-3); font-weight: 400; margin-left: 2px; }

  /* ============ Responsive — DESIGN.md §4 ============
     1025↑  데스크톱   244-252 expanded (기본)
     769–1024 태블릿   60px collapse (기존 .is-sidebar-collapsed 자동 적용)
     ↓768  모바일     사이드바 drawer (좌상/좌하 r-lg, 마진 X) + 본문 풀폭 overlay */

  /* drawer backdrop — 모바일 한정 노출 */
  .drawer-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(20, 18, 14, 0.32);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
    z-index: 40;
  }

  /* 햄버거 — 본문 좌상단 (모바일 한정 노출). 데스크톱은 사이드바 안의 #sidebarToggle 사용 */
  .main__hamburger {
    display: none;
    width: 36px; height: 36px;
    border: 0; padding: 0;
    background: transparent;
    border-radius: 7px;
    color: var(--ink-2);
    cursor: pointer;
    place-items: center;
    flex-shrink: 0;
  }
  .main__hamburger:hover { background: var(--hover-bg); color: var(--ink-1); }
  .main__hamburger svg { width: 18px; height: 18px; }

  /* 태블릿 collapse 는 .app.is-sidebar-collapsed 풀 룰셋 (위 §App shell) 을 JS 가 viewport 동기화로 강제 적용 */

  @media (max-width: 768px) {
    /* 모바일 drawer — keep 패턴: width calc(100% - 72px), max 340. 본문 우측 72px 비침 (≈20%) */
    .sidebar {
      position: fixed;
      left: 0; top: 0;
      /* 100dvh — iOS dynamic toolbar/home-indicator 영역 포함 정확 viewport (100vh 는 미포함) */
      height: 100dvh;
      width: calc(100% - 72px);
      max-width: 340px;
      margin: 0;
      border-radius: 0 var(--r-lg) var(--r-lg) 0;
      transform: translateX(-100%);
      transition: transform .22s ease;
      z-index: 70;   /* 바텀 시트(60) 위 — 드로어 드래그/열림 시 시트에 가리지 않게 */
      padding: calc(14px + env(safe-area-inset-top)) 12px max(8px, env(safe-area-inset-bottom));
    }
    body[data-drawer-open] .sidebar { transform: translateX(0); }
    body[data-drawer-open] .drawer-backdrop { opacity: 1; pointer-events: auto; }
    /* 드로어 열림 — 바텀 시트는 backdrop 아래로 (본문과 함께 dim).
       시트 자체 z:60 규칙(동률 specificity, 후행 선언)에 밀리지 않게 한 단계 높임 */
    body[data-convo="1"][data-drawer-open] .convo,
    body.is-expense[data-drawer-open] .exp-rail { z-index: 30; }

    /* 본문 고정 — drawer 는 본문 위로 슬라이드 (오버레이). 본문을 밀면 사이드바·본문 사이
       빈 면이 노출돼 3단처럼 보이는 문제 (아이폰 PWA 피드백 1, 2026-06-12). dim 은 backdrop 담당. */
    .main {
      /* status-bar-style: black-translucent → main 컨텐츠가 status bar 영역 잠식 차단 (safe-area-inset-top) */
      padding: calc(16px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
      min-width: 0;
    }
    body[data-drawer-open] .main {
      pointer-events: none;
    }
    .main__top {
      gap: 8px;
      flex-wrap: nowrap;
      /* 가로 overflow 만 잘라냄 — 세로는 visible 유지해서 doc-more-menu 등 dropdown
         이 main__top 영역 아래로 펼쳐질 때 잘림 회피 (사용자 요청 2026-05-12 스샷5). */
      overflow-x: clip;
    }
    .main__hamburger { display: inline-grid; }

    /* 본문 가독성 — 모바일에선 max-width 자동, 좌우 padding 최소 */
    .doc { max-width: 100%; }

    /* 댓글 패널 → 바텀 시트: 기본 얇은 탭(핸들+"댓글 N"+∧), 탭·스와이프로 64dvh 펼침 (작업지시서 §1.1).
       peek 196 → 얇은 탭. 강한 상단 그림자로 구분선 많은 화면에서도 콘텐츠 위에 부상. */
    .main__body { flex-direction: column; gap: 0; }
    body[data-convo="1"] .convo {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      width: auto;
      margin: 0;
      z-index: 60;
      --convo-peek: 56px;
      border-radius: 22px 22px 0 0;
      box-shadow: 0 -0.5px 0 rgba(20, 18, 14, 0.08), 0 -15px 34px -10px rgba(20, 18, 14, 0.22), 0 -4px 12px -7px rgba(20, 18, 14, 0.13);
      padding: 0 16px calc(10px + env(safe-area-inset-bottom));
      height: 64dvh;
      transform: translateY(calc(100% - var(--convo-peek) - env(safe-area-inset-bottom)));
      transition: transform .26s ease;
    }
    body[data-convo="1"] .convo.is-open { transform: translateY(0); }
    /* 그래버 — 접힘: crail-soft 42×5 r3 / 펼침: line 44×4.5 (시안) */
    .convo__handle {
      display: grid; place-items: center;
      height: auto; width: 100%;
      background: transparent; border: 0; padding: 11px 0 0;
      cursor: grab; flex: none;
      touch-action: none;
    }
    .convo__handle i {
      width: 42px; height: 5px;
      border-radius: 3px;
      background: var(--crail-soft);
      display: block;
    }
    body[data-convo="1"] .convo.is-open .convo__handle { padding-top: 10px; }
    body[data-convo="1"] .convo.is-open .convo__handle i {
      width: 44px; height: 4.5px; border-radius: 999px; background: var(--line);
    }
    /* 헤더 = 얇은 탭 행(접힘): 말풍선 아이콘 + "댓글" + 크레일 카운트 배지 + ∧(미세 바운스) */
    .convo__head {
      display: flex; align-items: center; gap: 8px;
      padding: 11px 4px calc(11px + env(safe-area-inset-bottom));
      font-size: 14px; font-weight: 600;
    }
    .convo__head-ico { display: block; width: 15px; height: 15px; color: var(--ink-3); flex-shrink: 0; }
    .convo__head-label { font-size: 14px; font-weight: 600; color: var(--ink-1); }
    body[data-convo="1"] .convo__count {
      min-width: 18px; height: 18px; padding: 0 5px; margin-left: 0;
      border-radius: 9px; background: var(--crail-base); color: #fff;
      font-family: var(--font-mono); font-size: 11px; font-weight: 600;
      display: inline-grid; place-items: center;
    }
    .convo__head-chev {
      display: inline-flex; margin-left: auto; color: var(--crail-base);
      animation: convoNudge 1.8s ease-in-out infinite;
    }
    .convo__head-chev svg { width: 18px; height: 18px; display: block; }
    @keyframes convoNudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
    /* 펼침 상태 — 탭 행 → 시트 헤더("댓글" 15/600 + mono 카운트 + 하단 구분선) */
    body[data-convo="1"] .convo.is-open .convo__head {
      align-items: baseline;
      padding: 2px 4px 10px;
      border-bottom: 1px solid var(--line-soft);
    }
    body[data-convo="1"] .convo.is-open .convo__head-ico,
    body[data-convo="1"] .convo.is-open .convo__head-chev { display: none; }
    body[data-convo="1"] .convo.is-open .convo__head-label { font-size: 15px; font-weight: 600; }
    body[data-convo="1"] .convo.is-open .convo__count {
      min-width: 0; height: auto; padding: 0; border-radius: 0; background: transparent;
      color: var(--ink-4); font-size: 11.5px; font-weight: 500;
    }
    /* peek(닫힘): 리스트는 폴드 아래(숨김). 펼침 시 최신 정렬 여지 확보 (아이폰 피드백 3) */
    body[data-convo="1"] .convo:not(.is-open) .convo__list { padding-bottom: 60dvh; }
    /* 얇은 탭 높이만큼 본문 하단 여백 — 탭이 본문 마지막 줄을 가리지 않게 */
    body[data-convo="1"] #mainView { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
    /* 읽기 전용 필 — 모바일은 "읽기 전용" 만 (시안 02) */
    .share__ro-long { display: none; }

    /* ── 가계부 모바일 (시안 05) ── */
    /* 탑바: 통계 버튼·구분선 숨김, 지출 입력 → + 아이콘 압축 */
    body.is-expense .exp-stats-btn { display: none; }
    .top-actions__expense .ta-sep { display: none; }
    .top-actions__expense .new-doc-btn { font-size: 0; gap: 0; width: 36px; padding: 0; justify-content: center; }
    /* 피드 패널 재배치: 모바일 월 헤더 → 캘린더 → 간이 통계. 범례는 모바일 불필요 — 삭제 (아이폰 피드백 6) */
    .exp-tab-panel--feed.is-active { display: flex; flex-direction: column; }
    .exp-headline { display: none; }
    .exp-mhead { display: block; order: 1; padding: 8px 0 14px; }
    .exp-mhead-nav { display: flex; align-items: center; justify-content: center; gap: 12px; }
    .exp-mhead-title { font-size: 18px; font-weight: 700; min-width: 0; }
    .exp-mhead-sub {
      margin-top: 6px;
      text-align: center;
      font-size: 12.5px;
      color: var(--ink-3);
      font-feature-settings: 'tnum' 1;
    }
    .exp-mhead-sub strong { color: var(--crail-deep); font-weight: 600; }
    .exp-month-cal { order: 2; }
    .exp-mini-stats { order: 3; }
    /* 우측 레일 → 타임라인 바텀 시트: 기본 얇은 탭(핸들+"타임라인 N건"+∧), 탭·스와이프로 64dvh 펼침.
       댓글 시트와 동일 패턴 — peek 156 → 얇은 탭·강한 상단 그림자 (작업지시서 §2). */
    body.is-expense:not(.is-exp-stats) .exp-rail {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      width: auto;
      margin: 0;
      z-index: 60;
      gap: 0;
      --exp-peek: 56px;
      background: var(--sidebar);
      border-radius: 22px 22px 0 0;
      box-shadow: 0 -0.5px 0 rgba(20, 18, 14, 0.08), 0 -15px 34px -10px rgba(20, 18, 14, 0.22), 0 -4px 12px -7px rgba(20, 18, 14, 0.13);
      padding: 0 16px calc(10px + env(safe-area-inset-bottom));
      height: 64dvh;
      transform: translateY(calc(100% - var(--exp-peek) - env(safe-area-inset-bottom)));
      transition: transform .26s ease;
    }
    body.is-expense:not(.is-exp-stats) .exp-rail.is-open { transform: translateY(0); }
    /* 그래버 — 접힘: crail-soft 42×5 r3 / 펼침: line 44×4.5 (시안) */
    .exp-rail-handle {
      display: grid; place-items: center;
      height: auto; width: 100%;
      background: transparent; border: 0; padding: 11px 0 0;
      cursor: grab; flex: none;
      touch-action: none;
    }
    .exp-rail-handle i {
      width: 42px; height: 5px;
      border-radius: 3px;
      background: var(--crail-soft);
      display: block;
    }
    body.is-expense .exp-rail.is-open .exp-rail-handle { padding-top: 10px; }
    body.is-expense .exp-rail.is-open .exp-rail-handle i {
      width: 44px; height: 4.5px; border-radius: 999px; background: var(--line);
    }
    .exp-rail-summary { display: none; }
    .exp-rail-card { box-shadow: none; border-radius: 0; background: transparent; padding: 0 2px; }
    .exp-rail-tlwrap::after { display: none; }
    /* 헤더 = 얇은 탭 행(접힘): 리스트 아이콘 + "타임라인" + 크레일 카운트 배지 + ∧(미세 바운스) */
    .exp-rail-tl-head {
      display: flex; align-items: center; justify-content: flex-start; gap: 8px;
      padding: 11px 2px calc(11px + env(safe-area-inset-bottom));
      font-size: 14px; font-weight: 600;
    }
    .exp-rail-tl-ico { display: block; width: 15px; height: 15px; color: var(--ink-3); flex-shrink: 0; }
    #expRailTlLabel { font-size: 14px; font-weight: 600; color: var(--ink-1); }
    body.is-expense .exp-rail-tl-count {
      display: inline-grid; place-items: center;
      min-width: 18px; height: 18px; padding: 0 6px;
      border-radius: 9px; background: var(--crail-base); color: #fff;
      font-family: var(--font-mono); font-size: 11px; font-weight: 600;
    }
    .exp-rail-tl-detail { display: none; }
    .exp-rail-tl-chev {
      display: inline-flex; margin-left: auto; color: var(--crail-base);
      animation: convoNudge 1.8s ease-in-out infinite;
    }
    .exp-rail-tl-chev svg { width: 18px; height: 18px; display: block; }
    /* 펼침 상태 — 탭 행 → 시트 헤더("타임라인" 15/600 + "N월 · N건" mono + 하단 구분선) */
    body.is-expense .exp-rail.is-open .exp-rail-tl-head {
      align-items: baseline;
      padding: 2px 2px 10px;
      border-bottom: 1px solid var(--line-soft);
    }
    body.is-expense .exp-rail.is-open .exp-rail-tl-ico,
    body.is-expense .exp-rail.is-open .exp-rail-tl-chev,
    body.is-expense .exp-rail.is-open .exp-rail-tl-count { display: none; }
    body.is-expense .exp-rail.is-open #expRailTlLabel { font-size: 15px; font-weight: 600; }
    body.is-expense .exp-rail.is-open .exp-rail-tl-detail {
      display: inline; font-family: var(--font-mono); font-size: 11.5px; font-weight: 500; color: var(--ink-4);
    }
    .exp-rail .exp-tl-list { padding-bottom: 8px; }
    /* 얇은 탭 높이만큼 본문 하단 여백 — 탭이 캘린더/통계를 가리지 않게 */
    body.is-expense #mainView { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }

    /* 폰트 — 사용자 의도 "한 사이즈씩" +1 일괄. 메타(≤12px) 보존.
       모바일에서 .doc__body 직접 텍스트 노드와 <div> 래퍼 단락이 다른 폰트로 보이는
       데스크탑 .doc__body div { ... !important } 잔존 버그 → div/p/li/h1-h6 wildcard !important 로 통일. */
    .doc__h1 { font-size: 27px; }
    .doc__p, .doc__body { font-size: 18px; line-height: 1.7; }
    .doc__body,
    .doc__body h1, .doc__body h2, .doc__body h3,
    .doc__body h4, .doc__body h5, .doc__body h6,
    .doc__body p, .doc__body div, .doc__body li,
    .doc__body blockquote, .doc__body span {
      font-size: 18px !important;
      line-height: 1.7 !important;
    }
    .doc__meta { font-size: 12px; }
    .sb__item { font-size: 16px; height: 44px; }   /* 터치 타겟 44px (DESIGN.md §4) */
    .sb__item--recent { font-size: 16px; height: auto; }
    .sb__user-name { font-size: 15px; }

    /* doc-list — 모바일 단일 칼럼 카드 스택 (RECENTS "전체 보기" 진입 후) */
    .doc-list {
      padding: 16px 0 24px;
      max-width: 100%;
    }
    .doc-list__stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px 12px;
      padding: 0 0 20px;
    }
    .doc-list__stat-val { font-size: 23px; }
    .doc-list__chips { gap: 8px; padding: 0 0 16px; }
    .doc-list__head { display: none; }
    .doc-list__no { display: none; }
    .doc-list__row {
      flex-direction: column;
      align-items: stretch;
      gap: 4px;
      padding: 12px;
      min-height: 56px;
    }
    .doc-list__main { gap: 4px; }
    .doc-list__title { font-size: 17px; }
    .doc-list__excerpt {
      font-size: 15px;
      white-space: normal;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .doc-list__meta {
      width: auto;
      text-align: left;
      font-size: 12px;
      padding-top: 2px;
    }

    /* 데스크톱 collapse 토글은 모바일에선 무의미 — 숨김 */
    #sidebarToggle { display: none; }

    /* drawer 활성 시 body scroll lock */
    body[data-drawer-open] { overflow: hidden; }
  }

  /* FAB — 우하단 새 글/거래 입력 (터치 디바이스 한정, 모든 라우트 노출).
     라우트별 액션 분기는 newDoc() 안에서 activeCat 으로 처리. */
  .t-fab {
    position: fixed;
    right: 16px;
    bottom: calc(16px + env(safe-area-inset-bottom));
    width: 56px;
    height: 56px;
    padding: 0;
    border-radius: 50%;
    background: var(--crail-base);
    color: var(--tone-255);
    border: 0;
    cursor: pointer;
    box-shadow: var(--shadow-float);
    display: none;
    place-items: center;
    z-index: 100;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .t-fab svg {
    width: 24px;
    height: 24px;
    stroke-width: 2;
  }
  .t-fab:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-pop);
  }
  .t-fab:active {
    transform: translateY(0);
    box-shadow: var(--shadow-inset-soft);
  }
  /* 터치 디바이스 + 사이드바 drawer 열림 상태일 때만 노출 (사용자 요청 2026-05-12).
     메인 화면(drawer 닫힘) 에선 우상단 "새 글" 버튼이 동일 기능 → FAB 중복 회피.
     데스크톱은 hover-none 미디어 미스로 항상 숨김. */
  @media (hover: none) and (pointer: coarse) {
    body[data-drawer-open] .t-fab { display: grid; }
  }

  /* — main__top action wrapper 토글 (글쓰기/가계부) — */
  .top-actions__navi { display: flex; align-items: center; gap: 6px; }
  .top-actions__expense { display: flex; align-items: center; gap: 10px; }
  body.is-expense .top-actions__navi { display: none; }
  body:not(.is-expense) .top-actions__expense { display: none; }

  /* — 가계부 mini tabs (피드/통계, main__top 우상단) — */
  /* "통계" — Secondary 버튼 (H36, 1px line 보더, 작업지시서 §2·§5.2). 활성 시 잉크 반전 */
  .exp-stats-btn {
    display: inline-flex; align-items: center; justify-content: center;
    height: 36px; padding: 0 14px;
    border-radius: 10px;
    background: var(--sidebar);
    color: var(--ink-1);
    font-size: 13.5px; font-weight: 600;
    border: 1px solid var(--line);
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s ease;
  }
  .exp-stats-btn:hover { background: var(--hover-bg); }
  .exp-stats-btn.is-active { background: var(--ink-1); color: #fff; border-color: var(--ink-1); }
  /* 가계부 화면 — FAB 없음, 지출 입력은 탑바 Primary 하나 (작업지시서 §5.3) */
  body.is-expense .t-fab { display: none !important; }

  /* — 가계부 검색 모달 (popover 동일 토큰) — */
  .exp-search-overlay {
    position: fixed; inset: 0; z-index: 49;
    background: rgba(20, 18, 14, 0.34);
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease;
  }
  .exp-search-overlay.is-open { opacity: 1; pointer-events: auto; }
  .exp-search-modal {
    position: fixed; z-index: 50;
    top: 16%; left: 50%;
    width: min(560px, calc(100vw - 64px));
    max-height: 64vh;
    display: flex;
    flex-direction: column;
    background: var(--sidebar);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-pop);
    opacity: 0; pointer-events: none;
    transform: translate(-50%, -8px);
    transition: opacity .18s ease, transform .18s ease;
    overflow: hidden;
  }
  .exp-search-modal.is-open {
    opacity: 1;
    transform: translate(-50%, 0);
    pointer-events: auto;
  }
  .exp-search-modal__head {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px;
  }
  .exp-search-modal__head .ico { width: 16px; height: 16px; color: var(--ink-3); flex-shrink: 0; }
  .exp-search-modal__head input {
    flex: 1; border: 0; outline: 0; background: transparent;
    font-family: var(--font-sans); font-size: 15px;
    color: var(--ink-1);
  }
  .exp-search-modal__head input::placeholder { color: var(--ink-4); }
  .exp-search-modal__body {
    overflow-y: auto;
    padding: 4px 18px 18px;
  }
  .exp-search-modal__empty {
    padding: 32px 4px;
    text-align: center;
    font-size: 14px;
    color: var(--ink-4);
  }
  .exp-search-modal__count {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-3);
    padding: 4px 0 8px;
    letter-spacing: -0.01em;
  }

  /* ═══ Spotlight (⌘K) 검색 모달 ═══ */
  .spotlight-overlay {
    position: fixed; inset: 0;
    background: rgba(20, 18, 14, 0.32);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 1100;
    display: flex; justify-content: center;
    padding-top: 14vh;
    opacity: 0; pointer-events: none;
    transition: opacity .14s ease;
  }
  .spotlight-overlay.is-open { opacity: 1; pointer-events: auto; }
  .spotlight {
    width: min(520px, calc(100vw - 48px));
    max-height: 64vh;
    background: var(--sidebar);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-pop);
    display: flex; flex-direction: column;
    overflow: hidden;
    transform: translateY(-6px) scale(0.985);
    transition: transform .18s cubic-bezier(.2,.8,.2,1);
  }
  .spotlight-overlay.is-open .spotlight { transform: translateY(0) scale(1); }
  .spotlight__head {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line-soft);
  }
  .spotlight__ico {
    width: 16px; height: 16px;
    color: var(--ink-3);
    flex-shrink: 0;
  }
  .spotlight__head input {
    flex: 1;
    border: 0; outline: 0;
    background: transparent;
    padding: 0;
    font-family: var(--font-sans);
    font-size: 17px;
    font-weight: 400;
    color: var(--ink-1);
    letter-spacing: -0.01em;
  }
  .spotlight__head input::placeholder { color: var(--ink-4); }
  .spotlight__esc {
    flex-shrink: 0;
    height: 22px;
    padding: 0 7px;
    border: 1px solid var(--line);
    background: var(--sunken);
    border-radius: 6px;
    color: var(--ink-3);
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 500;
    line-height: 22px;
    cursor: pointer;
    transition: background .12s, color .12s;
  }
  .spotlight__esc:hover { background: var(--hover-bg); color: var(--ink-1); }
  .spotlight__body {
    flex: 1;
    overflow-y: auto;
    padding: 6px 6px 8px;
    min-height: 80px;
  }
  .spotlight-group {
    padding: 6px 0 4px;
  }
  .spotlight-group__label {
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-4);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 4px 12px 6px;
  }
  .spotlight-item {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: background .1s;
  }
  .spotlight-item:hover,
  .spotlight-item.is-active {
    background: var(--hover-bg);
  }
  .spotlight-item__ico {
    width: 14px; height: 14px;
    color: var(--ink-3);
    flex-shrink: 0;
  }
  .spotlight-item.is-active .spotlight-item__ico { color: var(--crail-base); }
  .spotlight-item__main {
    flex: 1;
    min-width: 0;
    display: flex; flex-direction: column;
    gap: 2px;
  }
  .spotlight-item__title {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-1);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .spotlight-item__meta {
    font-size: 11px;
    color: var(--ink-4);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .spotlight-item__amount {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 12px;
    color: var(--ink-2);
    flex-shrink: 0;
  }
  .spotlight-item__amount .amt-unit { color: var(--ink-4); margin-left: 2px; }
  /* 검색 키워드 형광 highlight (사용자 요청 2026-05-13). */
  .spotlight-item mark {
    background: oklch(94% 0.16 100);
    color: var(--ink-1);
    border-radius: 2px;
    padding: 0 2px;
    font-weight: 600;
  }
  /* doc meta 안의 본문 발췌 — 카테고리 라벨과 시각 분리 */
  .spotlight-item__excerpt {
    color: var(--ink-3);
    font-size: 11px;
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 100%;
  }
  .spotlight-empty {
    padding: 36px 16px;
    text-align: center;
    color: var(--ink-3);
    font-size: 14px;
  }
  .spotlight-empty__sub {
    margin-top: 6px;
    font-size: 11px;
    color: var(--ink-4);
  }
  .spotlight__foot {
    display: flex; gap: 14px;
    padding: 8px 16px;
    border-top: 1px solid var(--line-soft);
    background: var(--sunken);
  }
  .spotlight__hint {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px;
    color: var(--ink-4);
  }
  .spotlight__hint kbd,
  .spotlight__esc {
    font-family: var(--font-sans);
  }
  .spotlight__hint kbd {
    height: 18px;
    min-width: 18px;
    padding: 0 4px;
    background: var(--sidebar);
    border: 1px solid var(--line);
    border-radius: 4px;
    font-size: 10px;
    color: var(--ink-3);
    line-height: 18px;
    text-align: center;
  }

  /* ═══ Phase D — 가계부 거래 입력/수정 모달 (Wave 11.1.5+) ═══ */
  .exp-modal-overlay {
    position: fixed; inset: 0;
    background: oklch(22% 0.008 60 / 0.32);   /* DESIGN.md §6 모달 backdrop */
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease;
  }
  .exp-modal-overlay.is-open { opacity: 1; pointer-events: auto; }
  .exp-modal {
    width: min(480px, calc(100vw - 48px));
    max-height: calc(100vh - 64px);
    background: var(--sidebar);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-pop);
    display: flex; flex-direction: column;
    overflow: hidden;
    transform: translateY(8px) scale(0.98);
    transition: transform .22s cubic-bezier(.2,.8,.2,1);
  }
  .exp-modal-overlay.is-open .exp-modal {
    transform: translateY(0) scale(1);
  }
  .exp-modal { position: relative; }
  .exp-modal__head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 22px 6px;
    gap: 12px;
  }
  .exp-modal__title {
    font-size: 17px; font-weight: 600;
    color: var(--ink-1);
    letter-spacing: -0.01em;
  }
  .exp-modal__head-actions {
    display: flex; gap: 4px; align-items: center;
  }
  .exp-modal__icon-btn {
    width: 28px; height: 28px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 0; background: transparent; cursor: pointer;
    border-radius: 8px;
    color: var(--ink-3);
    transition: background .12s, color .12s;
  }
  .exp-modal__icon-btn:hover {
    background: var(--hover-bg);
    color: var(--ink-1);
  }
  .exp-modal__icon-btn--danger:hover {
    color: var(--danger);
    background: oklch(70% 0.13 25 / 0.08);
  }
  .exp-modal__icon-btn .ico { width: 16px; height: 16px; }

  .exp-modal__body {
    padding: 4px 22px 16px;
    overflow-y: auto;
    flex: 1;
    display: flex; flex-direction: column;
    gap: 0;
  }
  .exp-field { display: flex; flex-direction: column; }
  .exp-field__inline-label {
    flex-shrink: 0;
    font-size: 14px; font-weight: 500;
    color: var(--ink-3);
    font-family: var(--font-sans);
  }

  /* paste CTA — crail-soft 박스 + 아이콘 + 2줄 설명 (신규만, 작업지시서 §7) */
  .exp-paste-cta {
    display: flex; align-items: center; gap: 12px;
    width: 100%;
    margin: 6px 0 14px;
    padding: 13px 15px;
    border: 0;
    background: var(--crail-soft);
    border-radius: var(--r-md);
    color: var(--crail-deep);
    font-family: var(--font-sans);
    cursor: pointer;
    text-align: left;
    transition: filter .12s;
  }
  .exp-paste-cta:hover { filter: brightness(0.97); }
  .exp-paste-cta__ico {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--crail-base); color: #fff;
    display: grid; place-items: center; flex-shrink: 0;
  }
  .exp-paste-cta__ico .ico { width: 19px; height: 19px; }
  .exp-paste-cta__text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .exp-paste-cta__text b { font-size: 14px; font-weight: 600; }
  .exp-paste-cta__text span { font-size: 12px; opacity: 0.8; }
  /* "또는 직접 입력" 구분선 */
  .exp-modal__or { display: flex; align-items: center; gap: 12px; margin: 0 0 4px; color: var(--ink-4); font-size: 11px; white-space: nowrap; }
  .exp-modal__or::before, .exp-modal__or::after { content: ""; height: 1px; background: var(--line-soft); flex: 1; }
  /* 수정 모달 — 붙여넣기 CTA·구분선 숨김 (작업지시서 §7) */
  .exp-modal[data-mode="edit"] .exp-paste-cta,
  .exp-modal[data-mode="edit"] .exp-modal__or { display: none; }

  /* 금액 — 큰 숫자 + 우측 "원" + 1px underline (유일한 시각 분기점) */
  .exp-field--amount {
    flex-direction: row;
    align-items: baseline;
    gap: 6px;
    padding: 10px 2px 8px;
    margin-bottom: 4px;
    border-bottom: 1px solid var(--line);
  }
  .exp-field--amount input {
    flex: 1;
    border: 0; outline: 0;
    background: transparent;
    box-shadow: none;
    padding: 0;
    font-family: var(--font-sans);
    font-size: 21px;          /* 1순위 위계 — 지출처(18)보다 큼 (작업지시서 §7) */
    font-weight: 400;
    color: var(--ink-1);
    letter-spacing: -0.03em;
    font-feature-settings: 'tnum' 1;
  }
  /* 포커스 시 밑줄 크레일 (작업지시서 §7) */
  .exp-field--amount,
  .exp-field--row[data-field="merchant"],
  .exp-field--row[data-field="memo"],
  .exp-field--row[data-field="url"] { transition: border-color .14s; }
  .exp-field--amount:focus-within,
  .exp-field--row[data-field="merchant"]:focus-within,
  .exp-field--row[data-field="memo"]:focus-within,
  .exp-field--row[data-field="url"]:focus-within { border-bottom-color: var(--crail-base); }
  .exp-field--amount input::placeholder {
    color: var(--ink-4);
    font-weight: 300;
  }
  .exp-field--amount__suffix {
    font-size: 15px;
    color: var(--ink-3);
    font-family: var(--font-sans);
  }

  /* row (지출처/카테고리/지출일시/신용카드/메모/URL) — 라벨 좌 + 입력 우, 구분선 없이 padding 만 */
  .exp-field--row {
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 11px 2px;
  }
  .exp-field--row input[type="text"],
  .exp-field--row input[type="url"] {
    flex: 1;
    border: 0; outline: 0;
    background: transparent;
    box-shadow: none;
    padding: 0;
    font-family: var(--font-sans);
    font-size: 15px;
    color: var(--ink-1);
    text-align: right;
  }
  .exp-field--row input::placeholder {
    color: var(--ink-4);
    text-align: right;
  }

  /* 라벨 없는 row (지출처/메모/URL) — 금액 필드와 일관된 구분선 + 좌측 정렬 */
  .exp-field--row[data-field="merchant"] {
    padding: 10px 2px;
    border-bottom: 1px solid var(--line);
  }
  .exp-field--row[data-field="memo"],
  .exp-field--row[data-field="url"] {
    padding: 14px 2px;
    border-bottom: 1px solid var(--line);
  }
  .exp-field--row[data-field="merchant"] input,
  .exp-field--row[data-field="memo"] input,
  .exp-field--row[data-field="url"] input {
    text-align: left;
  }
  .exp-field--row[data-field="memo"] input::placeholder,
  .exp-field--row[data-field="url"] input::placeholder {
    text-align: left;
    color: var(--ink-3);
  }

  /* 지출처 — 금액 필드와 동일 톤 */
  .exp-field--row[data-field="merchant"] input {
    font-size: 18px;
    font-weight: 300;
    color: var(--ink-1);
    letter-spacing: -0.02em;
  }
  .exp-field--row[data-field="merchant"] input::placeholder {
    text-align: left;
    color: var(--ink-4);
    font-weight: 300;
  }

  /* 카테고리 — 라벨 위 + 그리드 항상 노출 */
  .exp-field--cat {
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    padding: 14px 2px 8px;
  }
  .exp-cat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    width: 100%;
  }
  .exp-cat-cell {
    display: inline-flex; align-items: center; justify-content: center;
    height: 34px;
    padding: 0 10px;
    background: var(--sidebar);
    border: 1px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
    font-family: var(--font-sans);
    font-size: 14px;
    color: var(--ink-2);
    font-weight: 500;
    transition: all .12s;
  }
  .exp-cat-cell:hover {
    background: var(--hover-bg);
    color: var(--ink-1);
    border-color: var(--ink-4);
  }
  .exp-cat-cell.is-active {
    /* 선택 — 절제된 회색 + 굵게 (작업지시서 §7) */
    background: var(--hover-bg);
    border-color: var(--ink-3);
    color: var(--ink-1);
    font-weight: 600;
  }

  /* 카테고리 "더 보기" 토글 — 그리드 아래 우측 텍스트 링크 */
  .exp-cat-toggle {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    align-self: flex-end;
    margin-top: 8px;
    border: 0;
    background: transparent;
    padding: 4px 2px;
    cursor: pointer;
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-3);
    transition: color .12s;
  }
  .exp-cat-toggle:hover { color: var(--ink-1); }
  .exp-cat-toggle .ico {
    width: 10px; height: 10px;
    transition: transform .15s;
  }
  .exp-cat-toggle[aria-expanded="true"] .ico { transform: rotate(180deg); }

  /* collapsed 상태 — 자주 쓰는 4개만 노출 */
  .exp-cat-grid[data-expanded="false"] .exp-cat-cell:not(.exp-cat-cell--rank-top) {
    display: none;
  }

  /* 지출일시 trigger — 점선 underline */
  .exp-dt-trigger {
    display: inline-flex; align-items: center;
    border: 0; background: transparent; cursor: pointer;
    padding: 2px 0;
    font-family: var(--font-sans);
    font-size: 15px;
    color: var(--ink-2);
    border-bottom: 1px dashed var(--ink-4);
    transition: color .12s, border-color .12s;
  }
  .exp-dt-trigger:hover {
    color: var(--ink-1);
    border-bottom-color: var(--ink-2);
  }

  /* 신용카드 trigger — iOS HIG disclosure 스타일 (라벨 좌 + 값 plain text + chevron) */
  .exp-card-trigger {
    display: inline-flex; align-items: center; gap: 4px;
    border: 0;
    background: transparent;
    padding: 0;
    color: var(--ink-1);
    font-family: var(--font-sans);
    font-size: 15px;
    font-weight: 400;
    cursor: pointer;
    max-width: 220px;
    overflow: hidden;
    transition: color .12s;
  }
  .exp-card-trigger:hover { color: var(--crail-base); }
  .exp-card-trigger > span:first-child {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .exp-card-trigger .ico {
    width: 11px; height: 11px; flex-shrink: 0;
    color: var(--ink-3);
    transition: transform .15s;
  }
  .exp-modal[data-card-open="true"] .exp-card-trigger .ico { transform: rotate(180deg); }

  /* 신용카드 popover */
  .exp-card-popover {
    position: absolute;
    right: 22px;
    z-index: 10;
    min-width: 220px;
    padding: 4px;
    background: var(--sidebar);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-pop);
    display: none;
    flex-direction: column;
  }
  .exp-modal[data-card-open="true"] .exp-card-popover { display: flex; }
  .exp-card-option {
    display: flex; align-items: center;
    height: 32px;
    padding: 0 10px;
    background: transparent;
    border: 0;
    border-radius: var(--r-sm);
    color: var(--ink-2);
    font-family: var(--font-sans);
    font-size: 14px;
    cursor: pointer;
    text-align: left;
    transition: background .12s;
  }
  .exp-card-option:hover { background: var(--hover-bg); color: var(--ink-1); }
  .exp-card-option.is-active {
    background: var(--hover-bg);
    color: var(--ink-1);
    font-weight: 600;
  }

  /* 지출일시 popover — 캘린더 + 시간 stepper */
  .exp-date-popover {
    position: absolute;
    right: 22px;
    z-index: 10;
    width: 280px;
    padding: 12px;
    background: var(--sidebar);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-pop);
    display: none;
    font-family: var(--font-sans);
  }
  .exp-modal[data-date-open="true"] .exp-date-popover { display: block; }
  .exp-date-popover__head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  .exp-date-popover__title {
    font-size: 14px; font-weight: 600;
    color: var(--ink-1);
  }
  .exp-date-nav {
    width: 24px; height: 24px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 0; background: transparent; cursor: pointer;
    border-radius: 6px;
    color: var(--ink-3);
    transition: background .12s, color .12s;
  }
  .exp-date-nav:hover { background: var(--hover-bg); color: var(--ink-1); }
  .exp-date-nav svg { width: 12px; height: 12px; }
  .exp-date-popover__weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    margin-bottom: 4px;
  }
  .exp-date-popover__weekdays span {
    text-align: center;
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-4);
    padding: 4px 0;
  }
  .exp-date-popover__grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }
  .exp-date-cell {
    height: 30px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent;
    border: 0;
    border-radius: 6px;
    color: var(--ink-1);
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 400;
    cursor: pointer;
    transition: all .12s;
  }
  .exp-date-cell:hover { background: var(--hover-bg); }
  .exp-date-cell.is-other { color: var(--ink-4); }
  .exp-date-cell.is-today {
    color: var(--crail-base);
    font-weight: 600;
  }
  .exp-date-cell.is-selected {
    background: var(--ink-1);
    color: var(--tone-255);
    font-weight: 600;
  }
  .exp-date-cell.is-selected:hover { background: var(--ink-1); }
  .exp-date-popover__time {
    display: flex; align-items: center; gap: 4px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--line-soft);
  }
  .exp-date-popover__time input[type="number"] {
    width: 38px;
    text-align: center;
    border: 1px solid var(--line);
    background: var(--sidebar);
    border-radius: var(--r-sm);
    padding: 5px 0;
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--ink-1);
    -moz-appearance: textfield;
  }
  .exp-date-popover__time input[type="number"]::-webkit-outer-spin-button,
  .exp-date-popover__time input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none; margin: 0;
  }
  .exp-date-popover__time input:focus {
    outline: 0;
    border-color: var(--crail-base);
    box-shadow: 0 0 0 2px oklch(67% 0.12 50 / 0.16);
  }
  .exp-date-popover__colon { color: var(--ink-3); font-weight: 500; }
  .exp-date-popover__today {
    margin-left: auto;
    height: 26px;
    padding: 0 10px;
    border: 1px solid var(--line);
    background: var(--sidebar);
    border-radius: 999px;
    font-family: var(--font-sans);
    font-size: 12px;
    color: var(--ink-2);
    cursor: pointer;
    transition: all .12s;
  }
  .exp-date-popover__today:hover { background: var(--hover-bg); color: var(--ink-1); }
  .exp-field.is-readonly input,
  .exp-field.is-readonly .exp-dt-trigger,
  .exp-field.is-readonly .exp-card-trigger {
    pointer-events: none;
    color: var(--ink-2);
  }
  .exp-field.is-readonly .exp-cat-cell { pointer-events: none; }
  .exp-modal__foot {
    display: flex; gap: 8px; justify-content: flex-end;
    padding: 14px 22px 18px;
    background: var(--sidebar);
    border-top: 1px solid var(--line-soft);
  }
  .exp-modal__btn {
    padding: 8px 16px;
    border-radius: 10px;
    border: 0;
    font-size: 14px; font-weight: 500;
    cursor: pointer;
    font-family: var(--font-sans);
    transition: all .12s;
  }
  .exp-modal__btn--ghost {
    background: transparent;
    color: var(--ink-2);
  }
  .exp-modal__btn--ghost:hover { background: var(--hover-bg); }
  .exp-modal__btn--primary {
    background: var(--ink-1);
    color: var(--tone-255);
  }
  .exp-modal__btn--primary:hover {
    background: var(--black);
    box-shadow: var(--shadow-float);
  }
  .exp-confirm-overlay {
    position: fixed; inset: 0;
    background: rgba(20, 18, 14, 0.5);
    z-index: 1100;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .14s;
  }
  .exp-confirm-overlay.is-open { opacity: 1; pointer-events: auto; }
  .exp-confirm {
    width: min(320px, calc(100vw - 64px));
    background: var(--sidebar);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-pop);
    padding: 18px 20px 14px;
    text-align: center;
  }
  .exp-confirm__msg {
    font-size: 15px;
    color: var(--ink-1);
    line-height: 1.5;
    padding: 4px 0 14px;
  }
  .exp-confirm__actions {
    display: flex; gap: 6px; justify-content: center;
  }
  .exp-confirm__btn {
    flex: 1;
    padding: 8px 0;
    border-radius: 8px;
    border: 0;
    font-size: 14px; font-weight: 500;
    cursor: pointer;
    font-family: var(--font-sans);
    transition: background .12s;
  }
  .exp-confirm__btn--ghost {
    background: var(--hover-bg);
    color: var(--ink-2);
  }
  .exp-confirm__btn--ghost:hover { background: var(--line-soft); }
  .exp-confirm__btn--danger {
    background: rgba(193, 74, 58, 0.1);
    color: #c14a3a;
  }
  .exp-confirm__btn--danger:hover { background: rgba(193, 74, 58, 0.16); }
  .expense-row[data-tx-id], .exp-popover-row[data-tx-id] {
    cursor: pointer;
  }

</style>
</head>
<body>

<!-- ─── Aa 팝업 (모바일/태블릿) — Keep editor 포팅 ─── -->
<div class="lp-popup-overlay" id="lpPopupOverlay"></div>
<div class="lp-popup-card" id="lpPopupCard">
  <div class="lp-popup-menu" id="lpPopupMenu"></div>
</div>

<!-- ─── 플로팅 인라인 툴바 (선택 시 버블) — Keep editor 포팅 ─── -->
<div id="floatingToolbar">
  <button class="ft-btn" title="굵게"  data-cmd="bold"><b>B</b></button>
  <button class="ft-btn" title="기울임" data-cmd="italic"><i style="font-style:italic">I</i></button>
  <button class="ft-btn highlight-btn" title="형광펜" data-cmd="hiliteColor" data-val="#fde68a"><span class="hl-inner">A</span></button>
  <button class="ft-btn" title="취소선" data-cmd="strikeThrough"><s>S</s></button>
  <button class="ft-btn" title="밑줄"  data-cmd="underline"><u>U</u></button>
</div>

<div class="app">

  <!-- ================= Sidebar ================= -->
  <aside class="sidebar">

    <!-- Brand + 검색 + 알림 -->
    <div class="sb__top">
      <div class="sb__brand">
        <div class="sb__name">Today</div>
      </div>
      <!-- 아이콘 — 16그리드 · 1.5px 스트로크 · 라운드 캡 통일 (작업지시서 §3.1) -->
      <button class="sb__icon-btn" title="검색 (⌘K)" onclick="openSpotlight()">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="7.2" cy="7.2" r="4.3"/>
          <path d="M10.5 10.5L13.4 13.4"/>
        </svg>
      </button>
      <button class="sb__icon-btn sb__icon-btn--has-alert" title="새 알림 2개">

    </div>
