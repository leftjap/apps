<script>
  // 탑바 날짜 크럼 — 현재 날짜 동적 표시 (fixture 하드코딩 04·27 stale 방지)
  (function(){
    const md = document.querySelector('.crumb__date-md');
    const day = document.querySelector('.crumb__date-day');
    const now = new Date();
    const p2 = (n) => String(n).padStart(2, '0');
    if (md) md.textContent = `${p2(now.getMonth() + 1)} · ${p2(now.getDate())}`;
    if (day) day.textContent = ` · ${['SUN','MON','TUE','WED','THU','FRI','SAT'][now.getDay()]}`;
  })();

  // 바텀 시트 공용 컨트롤러 (모바일 ≤768) — 사이드바 드로어처럼 손가락 1:1 추적 + 관성 snap:
  //  * 시트 어디서든 위로 스와이프 → 손가락 따라 열림 / 떼면 속도·거리로 snap
  //  * 핸들·헤더(스크롤 불가)를 잡고 아래로 → 리스트 위치 무관 항상 닫힘 (사이드바 닫기와 동일)
  //  * 리스트 위에서 아래로 → 리스트 최상단 도달 후부터 닫힘 (그 전엔 리스트 스크롤 우선)
  //  * 핸들·헤더 탭 = 토글 / 열린 시트 바깥(본문 등) 탭 → 닫기
  //  순수 결정 로직은 src/features/sheetGesture.js (window.__todaySheetGesture, vitest 검증).
  (function(){
    function initMobileSheet(panelId, handleId, headSel, listId, peekPx, onChange) {
      const panel = document.getElementById(panelId);
      const handle = document.getElementById(handleId);
      if (!panel || !handle) return;
      const mq = window.matchMedia('(max-width: 768px)');
      const isOpen = () => panel.classList.contains('is-open');
      const setOpen = (open) => {
        if (isOpen() === open) return;
        panel.classList.toggle('is-open', open);
        if (typeof onChange === 'function') onChange(open);
      };
      const toggle = () => { if (mq.matches) setOpen(!isOpen()); };
      handle.addEventListener('click', toggle);
      // 헤더 탭 = 토글 (열림 상태에서 다시 탭하면 닫힘)
      panel.querySelector(headSel)?.addEventListener('click', (e) => {
        if (!mq.matches) return;
        if (e.target.closest && e.target.closest('button') && !e.target.closest('#' + handleId)) return;
        toggle();
      });

      // ── 손가락 1:1 추적 + 관성 snap (사이드바 드로어 L7872~ 의 세로축 포팅) ──
      //  range = sheetH - peek. setTrack 이 매 프레임 손가락 따라 transform, touchend 에서 snap.
      //  순수 로직(window.__todaySheetGesture) 부재 시(standalone mock) 스와이프만 비활성 — 탭은 유지.
      const G = window.__todaySheetGesture;
      if (G) {
      const C = G.SHEET_GESTURE;
      let sx = 0, sy = 0, t0 = 0, decided = false, swiping = false;
      let startOpen = false, range = 0, startScrollTop = 0, startFromList = false, moveBound = false;
      const listEl = () => (listId ? document.getElementById(listId) : null);

      const setTrack = (p) => {
        panel.style.transition = 'none';
        panel.style.transform = 'translateY(' + (range * (1 - p)) + 'px)';
      };
      const snapTo = (open, velocity) => {
        const dur = velocity > C.VEL_TH ? 0.24 : 0.30;
        panel.style.transition = 'transform ' + dur + 's ' + C.CURVE;
        setOpen(open); // 클래스 토글 → CSS transform 목표 변경 + onChange(정렬) 호출
        const clean = () => { panel.style.transform = ''; };
        requestAnimationFrame(clean);
        setTimeout(clean, 32); // raf 누락 환경 fallback
        setTimeout(() => { panel.style.transition = ''; }, dur * 1000 + 60);
      };

      const onMove = (e) => {
        if (!mq.matches || e.touches.length !== 1 || !range) return;
        const dx = e.touches[0].clientX - sx;
        const dy = e.touches[0].clientY - sy;
        if (!decided) {
          const cls = G.classifySheetGesture({ dx, dy, startOpen, listScrollTop: startScrollTop, fromList: startFromList });
          if (cls === 'pending') return;
          decided = true;
          if (cls === 'none') { range = 0; return; } // 리스트 스크롤 등에 양보 (preventDefault 안 함)
          swiping = true;
        }
        if (!swiping) return;
        if (e.cancelable) e.preventDefault();
        setTrack(G.sheetProgress(dy, range, startOpen));
      };
      // 리스트 fast-path 보존: drag 후보일 때만 non-passive touchmove 동적 등록 (드로어 패턴).
      const bindMove = () => { if (moveBound) return; panel.addEventListener('touchmove', onMove, { passive: false }); moveBound = true; };
      const unbindMove = () => { if (!moveBound) return; panel.removeEventListener('touchmove', onMove, { passive: false }); moveBound = false; };

      panel.addEventListener('touchstart', (e) => {
        if (!mq.matches || e.touches.length !== 1) return;
        sx = e.touches[0].clientX; sy = e.touches[0].clientY; t0 = Date.now();
        decided = false; swiping = false;
        startOpen = isOpen();
        range = Math.max(0, panel.getBoundingClientRect().height - peekPx);
        const list = listEl();
        startScrollTop = list ? list.scrollTop : 0;
        // 핸들·헤더(스크롤 불가)에서 시작하면 사이드바 닫기처럼 어디서든 닫힘 — 리스트 위에서만 스크롤 조율.
        const tgt = e.target;
        startFromList = !!(tgt && tgt.closest && listId && tgt.closest('#' + listId));
        bindMove();
      }, { passive: true });
      panel.addEventListener('touchend', (e) => {
        unbindMove();
        if (!swiping || !range) { swiping = false; decided = false; return; }
        const dy = e.changedTouches[0].clientY - sy;
        const snap = G.sheetSnap({ dy, range, elapsedMs: Date.now() - t0, startOpen });
        snapTo(snap.targetOpen, snap.velocity);
        swiping = false; decided = false;
      }, { passive: true });
      panel.addEventListener('touchcancel', () => {
        unbindMove();
        if (swiping) snapTo(startOpen, 0);
        swiping = false; decided = false;
      }, { passive: true });
      } // if (G)

      // 열린 시트 바깥 탭 → 닫기
      document.addEventListener('click', (e) => {
        if (!mq.matches || !isOpen()) return;
        if (panel.contains(e.target)) return;
        if (document.body.dataset.drawerOpen) return;
        setOpen(false);
      });
      // 데스크톱 전환 시 is-open 잔존 제거
      mq.addEventListener?.('change', (e) => { if (!e.matches) setOpen(false); });
    }

    // 댓글 시트 — 열림: 타임라인 맨 아래 / 닫힘(peek): 최신 댓글 첫 줄부터 (피드백 3)
    // 닫힘 정렬은 더블 rAF — peek 패딩(60dvh) 적용 후 scrollTop 설정 (클램프 방지)
    initMobileSheet('convoPanel', 'convoHandle', '.convo__head', 'convoList', 56, (open) => {
      const list = document.getElementById('convoList');
      if (!list) return;
      if (open) { list.scrollTop = list.scrollHeight; return; }
      // rect 기반 상대 정렬 — offsetParent/트랜지션 영향 없이 현재 보이는 위치에서 보정 (자기수렴)
      const align = () => {
        const msgs = list.querySelectorAll('.cv-msg');
        const last = msgs[msgs.length - 1];
        if (!last) return;
        const delta = last.getBoundingClientRect().top - list.getBoundingClientRect().top;
        list.scrollTop = Math.max(0, list.scrollTop + delta - 2);
      };
      requestAnimationFrame(() => requestAnimationFrame(align));
      setTimeout(align, 180);   // 늦은 높이 변화(클램프 재측정 등) 정착 후 재정렬
      setTimeout(align, 450);   // 닫힘 트랜지션(260ms) 후 최종 정렬
    });
    // 가계부 타임라인 시트 — 닫힘(peek): 최신 거래(목록 상단)부터 (피드백 5)
    initMobileSheet('expRail', 'expRailHandle', '.exp-rail-tl-head', 'expRailTlList', 56, (open) => {
      const list = document.getElementById('expRailTlList');
      if (list && !open) list.scrollTop = 0;
    });
  })();

  // 편집 도구 토글 — 클릭시 상단 툴바 슬라이드 다운 / 올라감
  (function(){
    const trig = document.getElementById('editTrigger');
    const tb = document.getElementById('editToolbar');
    if (!trig || !tb) return;
    trig.addEventListener('click', () => {
      const open = tb.classList.toggle('is-open');
      trig.classList.toggle('is-open', open);
      trig.setAttribute('aria-pressed', open ? 'true' : 'false');
      tb.setAttribute('aria-hidden', open ? 'false' : 'true');
    });
  })();

  // 사용자 카드 popover — 좌하단 카드 클릭시 위로 메뉴 펼침 / 바깥 클릭·ESC 닫힘
  (function(){
    const btn = document.getElementById('userCardBtn');
    const menu = document.getElementById('settingsMenu');
    if (!btn || !menu) return;
    const setOpen = (open) => {
      menu.classList.toggle('is-open', open);
      btn.classList.toggle('is-open', open);
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      menu.setAttribute('aria-hidden', open ? 'false' : 'true');
    };
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      setOpen(!menu.classList.contains('is-open'));
    });
    document.addEventListener('click', (e) => {
      if (!menu.contains(e.target) && e.target !== btn && !btn.contains(e.target)) {
        setOpen(false);
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && menu.classList.contains('is-open')) setOpen(false);
    });
    // 메뉴 항목 클릭 → 액션 디스패치
    menu.querySelectorAll('.sb__menu-item[data-action]').forEach(item => {
      item.addEventListener('click', (e) => {
        e.stopPropagation();
        const action = item.dataset.action;
        setOpen(false);
        if (typeof window.openAccModal === 'function') window.openAccModal(action);
      });
    });
  })();

  // 계정 모달 시스템 — 프로필 / 휴지통 / 로그아웃
  (function(){
    const PROFILE = { name: '지오', email: 'gio@example.com', initial: 'G' };
    const TRASH = [
      { title: '여름의 잔상', meta: '단편 · 4월 18일 삭제' },
      { title: '서울 1995', meta: '블로그 · 4월 11일 삭제' },
      { title: '오후 3시의 메모', meta: '메모 · 4월 3일 삭제' }
    ];

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function profileBody() {
      return `
        <div class="acc-profile-row">
          <span class="acc-profile-avatar"><img class="acc-profile-avatar-img" alt="" hidden>${escapeHtml(PROFILE.initial)}</span>
          <div class="acc-profile-upload">
            아바타 이미지<br>
            <span class="acc-profile-upload-link" role="button" tabindex="0">이미지 업로드</span>
          </div>
        </div>
        <div style="margin-bottom:14px;">
          <label class="acc-field-label" for="accProfileName">표시 이름</label>
          <input class="acc-field-input" id="accProfileName" type="text" value="${escapeHtml(PROFILE.name)}">
        </div>
        <div>
          <label class="acc-field-label">이메일</label>
          <div style="font-size:14px;color:var(--ink-2);letter-spacing:-0.01em;">${escapeHtml(PROFILE.email)}</div>
        </div>
      `;
    }

    function trashBody() {
      if (!TRASH.length) {
        return `<div class="acc-trash-empty">휴지통이 비어 있습니다</div>`;
      }
      return TRASH.map((t, i) => `
        <div class="acc-trash-row">
          <div class="acc-trash-row__main">
            <span class="acc-trash-row__title">${escapeHtml(t.title)}</span>
            <span class="acc-trash-row__meta">${escapeHtml(t.meta)}</span>
          </div>
          <button class="acc-trash-row__action" data-trash-idx="${i}">복구</button>
        </div>
      `).join('');
    }

    function logoutBody() {
      return `<p class="acc-confirm-text">로그아웃하면 로컬에 캐시된 글은 유지되지만 동기화는 중단됩니다.<br>다시 로그인할 때까지 알림도 받지 못합니다.</p>`;
    }

    function buildHtml(action) {
      const map = {
        profile: { title: '프로필',         body: profileBody(), wide: false, footer: `<button class="acc-btn" data-acc-close>닫기</button><button class="acc-btn acc-btn--primary" data-acc-save>저장</button>` },
        trash:   { title: '휴지통',          body: trashBody(),   wide: true,  footer: `<button class="acc-btn" data-acc-close>닫기</button>` },
        logout:  { title: '로그아웃하시겠어요?', body: logoutBody(),  wide: false, footer: `<button class="acc-btn" data-acc-close>취소</button><button class="acc-btn acc-btn--danger" data-acc-confirm-logout>로그아웃</button>` }
      };
      return map[action] || null;
    }

    function close() {
      const overlay = document.getElementById('accModalOverlay');
      if (!overlay) return;
      overlay.classList.remove('open');
      setTimeout(() => overlay.remove(), 150);
    }

    function open(action) {
      close();
      const cfg = buildHtml(action);
      if (!cfg) return;
      const overlay = document.createElement('div');
      overlay.id = 'accModalOverlay';
      overlay.className = 'acc-modal-overlay';
      overlay.innerHTML = `
        <div class="acc-modal-card${cfg.wide ? ' is-wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="accModalTitle">
          <div class="acc-modal-header">
            <span class="acc-modal-title" id="accModalTitle">${cfg.title}</span>
            <button class="acc-modal-close" aria-label="닫기" data-acc-close>
              <svg width="14" height="14" viewBox="0 0 16 16">
                <line x1="2" y1="2" x2="14" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="14" y1="2" x2="2" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <div class="acc-modal-body">${cfg.body}</div>
          <div class="acc-modal-footer">${cfg.footer}</div>
        </div>
      `;
      document.body.appendChild(overlay);
      requestAnimationFrame(() => overlay.classList.add('open'));

      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) close();
        const t = e.target.closest('[data-acc-close]');
        if (t) close();
      });

      const saveBtn = overlay.querySelector('[data-acc-save]');
      if (saveBtn) saveBtn.addEventListener('click', () => {
        const input = overlay.querySelector('#accProfileName');
        if (input) {
          const newName = input.value.trim();
          if (newName) {
            PROFILE.name = newName;
            const sbName = document.querySelector('.sb__user-name');
            if (sbName) sbName.textContent = newName;
          }
        }
        close();
      });

      const logoutBtn = overlay.querySelector('[data-acc-confirm-logout]');
      if (logoutBtn) logoutBtn.addEventListener('click', () => {
        close();
        alert('로그아웃 — 구현 예정 (Wave 11.4 Auth)');
      });

      overlay.addEventListener('click', (e) => {
        const recover = e.target.closest('[data-trash-idx]');
        if (recover) {
          recover.textContent = '복구됨';
          recover.disabled = true;
          recover.style.color = 'var(--ink-3)';
          recover.style.cursor = 'default';
        }
      });

      const onKey = (e) => {
        if (e.key === 'Escape') {
          close();
          document.removeEventListener('keydown', onKey);
        }
      };
      document.addEventListener('keydown', onKey);
    }

    window.openAccModal = open;
    window.closeAccModal = close;
  })();

  // 에디터 ⋯ 메뉴 — 사본/내보내기/글 삭제
  (function(){
    const btn = document.getElementById('docMoreBtn');
    const menu = document.getElementById('docMoreMenu');
    if (!btn || !menu) return;
    const setOpen = (open) => {
      menu.classList.toggle('is-open', open);
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      menu.setAttribute('aria-hidden', open ? 'false' : 'true');
    };
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      setOpen(!menu.classList.contains('is-open'));
    });
    document.addEventListener('click', (e) => {
      if (!menu.contains(e.target) && e.target !== btn && !btn.contains(e.target)) {
        setOpen(false);
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && menu.classList.contains('is-open')) setOpen(false);
    });
    menu.querySelectorAll('.doc-more-menu__item[data-doc-action]').forEach(item => {
      item.addEventListener('click', (e) => {
        e.stopPropagation();

          alert('내보내기 — 구현 예정');

      });
    });
  })();

  // 가계부 ⋮ 메뉴 — 매핑 관리 진입점 (Wave 11.8 후속)
  (function(){

      if (!menu.contains(e.target) && e.target !== btn && !btn.contains(e.target)) {
        setOpen(false);

  // 사이드바 접힘 토글 — 클릭 시 사이드바 60px 레일 / 펼침 252px
  (function(){

  // 카테고리 라우팅 — 사이드바 클릭 / 새 글 / Recents / empty CTA
  (function(){
    const FIXTURE = {
      navi: {
        label: '오늘의 네비',
        totalCount: 1336,
        oneYearAgo: { id: 'navi-1y-ago', title: '시작과 끝 사이의 날들', number: 974 },
        docs: [
          {
            id: 'navi-1',
            number: 1336,
            title: '멈췄던 시간을 다시 시작하기',
            meta: '127단어<span class="sep">·</span>원고지 2.4매<span class="sep">·</span><span class="save">14:22 자동 저장됨</span>',
            share: '소연',
            date: '3일 전', comments: 1, unread: true,
            body: [

    // ═══ keep 흡수 — squarified treemap (renderCategoryTreemap + _squarify + _worstAspect) ═══
    function _worstAspectTreemap(row, rowTotal, totalArea, shortSide) {
      if (shortSide <= 0 || rowTotal <= 0 || totalArea <= 0) return Infinity;
      const rowFrac = rowTotal / totalArea;
      const rowLen = shortSide;
      const rowThickness = rowLen * rowFrac;
      let worst = 0;
      row.forEach(val => {
        const frac = val / rowTotal;
        const cellW = rowThickness;
        const cellH = rowLen * frac;
        if (cellW <= 0 || cellH <= 0) return;
        const aspect = Math.max(cellW / cellH, cellH / cellW);
        if (aspect > worst) worst = aspect;
      });
      return worst;
    }

    function _squarifyTreemap(values, x, y, w, h) {
      const total = values.reduce((s, v) => s + v, 0);
      if (total <= 0 || values.length === 0) return [];
      if (values.length === 1) return [{ x, y, w, h }];

      const rects = [];
      let remaining = values.slice();
      let remainingTotal = total;
      let cx = x, cy = y, cw = w, ch = h;

      while (remaining.length > 0) {
        const isHorizontal = cw >= ch;
        const shortSide = isHorizontal ? ch : cw;
        let row = [remaining[0]];
        let rowTotal = remaining[0];
        let bestAspect = _worstAspectTreemap(row, rowTotal, remainingTotal, shortSide);

        for (let i = 1; i < remaining.length; i++) {
          const testRow = row.concat([remaining[i]]);
          const testTotal = rowTotal + remaining[i];
          const testAspect = _worstAspectTreemap(testRow, testTotal, remainingTotal, shortSide);
          if (testAspect <= bestAspect) {
            row = testRow;
            rowTotal = testTotal;
            bestAspect = testAspect;
          } else break;
        }

        const rowFraction = rowTotal / remainingTotal;
        const rowSize = isHorizontal ? cw * rowFraction : ch * rowFraction;
        let offset = 0;
        row.forEach(val => {
          const frac = val / rowTotal;
          const cellSize = shortSide * frac;
          if (isHorizontal) rects.push({ x: cx, y: cy + offset, w: rowSize, h: cellSize });
          else rects.push({ x: cx + offset, y: cy, w: cellSize, h: rowSize });
          offset += cellSize;
        });

        remaining = remaining.slice(row.length);
        remainingTotal -= rowTotal;
        if (isHorizontal) { cx += rowSize; cw -= rowSize; }
        else { cy += rowSize; ch -= rowSize; }
      }
      return rects;
    }

      const visible = sorted.slice(0, visibleCount);

    // ═══ keep 흡수 — _packCircles + renderYearlyBubbles ═══
    function _packCirclesBubble(items, containerW, containerH) {
      if (!items || items.length === 0) return [];

      const maxAmount = items[0].amount;
      const minR = 14;
      const maxR = Math.min(containerW * 0.32, containerH * 0.40);
      const cx = containerW / 2;
      const cy = containerH / 2;

      const circles = items.map((item, i) => {
        const ratio = Math.sqrt(item.amount / maxAmount);
        const r = Math.max(minR, ratio * maxR);
        return { x: cx, y: cy, r, item, index: i };
      });
      const maxR_actual = circles[0].r;

      // 첫 원 중앙
      circles[0].x = cx;
      circles[0].y = cy;

      // 나머지 — golden angle 시작점
      for (let i = 1; i < circles.length; i++) {
        const angle = i * 2.4;
        const dist = circles[0].r + circles[i].r + 4;
        circles[i].x = cx + Math.cos(angle) * dist * 0.5;
        circles[i].y = cy + Math.sin(angle) * dist * 0.5;
      }

      // Force simulation
      for (let iter = 0; iter < 200; iter++) {
        for (let i = 0; i < circles.length; i++) {
          for (let j = i + 1; j < circles.length; j++) {
            const dx = circles[j].x - circles[i].x;
            const dy = circles[j].y - circles[i].y;
            const dist = Math.sqrt(dx * dx + dy * dy) || 1;
            const minDist = circles[i].r + circles[j].r + 3;
            if (dist < minDist) {
              const overlap = (minDist - dist) / 2;
              const nx = dx / dist;
              const ny = dy / dist;
              const totalR = circles[i].r + circles[j].r;
              const ratioI = circles[j].r / totalR;
              const ratioJ = circles[i].r / totalR;
              circles[i].x -= nx * overlap * ratioI;
              circles[i].y -= ny * overlap * ratioI;
              circles[j].x += nx * overlap * ratioJ;
              circles[j].y += ny * overlap * ratioJ;
            }
          }
        }
        for (let i = 0; i < circles.length; i++) {
          const strength = 0.02 + 0.08 * (circles[i].r / maxR_actual);
          circles[i].x += (cx - circles[i].x) * strength;
          circles[i].y += (cy - circles[i].y) * strength;
        }
        for (let i = 0; i < circles.length; i++) {
          const c = circles[i];
          if (c.x - c.r < 0) c.x = c.r;
          if (c.x + c.r > containerW) c.x = containerW - c.r;
          if (c.y - c.r < 0) c.y = c.r;
          if (c.y + c.r > containerH) c.y = containerH - c.r;
        }
      }
      return circles;
    }

    function renderYearlyBubbles(merchants) {
      if (!merchants || merchants.length === 0) return '';
      const items = merchants.slice(0, 20).map(m => ({
        type: 'brand',
        merchant: m.name,
        amount: m.amount,
        rank: m.rank
      }));
      const containerW = Math.min(680, window.innerWidth - 360);
      const containerH = window.innerWidth <= 768 ? 200 : 280;
      const circles = _packCirclesBubble(items, containerW, containerH);

      // tier 결정 — rank 기준 (1=tier-1, 2-3=tier-2, 4-5=tier-3, 6-8=tier-4, 9+=tier-5)
      const tierFor = (rank) => {
        if (rank === 1) return 1;
        if (rank <= 3) return 2;
        if (rank <= 5) return 3;
        if (rank <= 8) return 4;
        return 5;
      };

      let html = `<div class="exp-yearly-bubble-wrap" style="width:${containerW}px;height:${containerH}px;">`;
      circles.forEach(c => {
        const size = Math.round(c.r * 2);
        const left = Math.round(c.x - c.r);
        const top = Math.round(c.y - c.r);
        const innerSize = Math.max(0, size - 6);
        const fontSize = Math.max(10, Math.round(innerSize * 0.20));
        const item = c.item;
        const initial = item.merchant.length <= 3 ? item.merchant : item.merchant.slice(0, 2);
        const tier = tierFor(item.rank);

        html += `<div class="exp-yearly-bubble exp-yearly-bubble--tier-${tier}" data-merchant="${item.merchant}" onclick="openMerchantDetail('${item.merchant.replace(/'/g, "\\'")}', event)" `;
        html += `style="left:${left}px;top:${top}px;width:${size}px;height:${size}px;">`;
        html += `<div class="exp-yearly-bubble__inner" style="width:${innerSize}px;height:${innerSize}px;">`;
        html += `<span class="exp-yearly-bubble__name" style="font-size:${fontSize}px;">${initial}</span>`;
        html += `</div></div>`;
      });
      html += '</div>';
      return html;
    }

    function openExpenseFloatingPopup(title, contentHtml, anchorX, anchorY) {
      closeExpenseFloatingPopup();

      const overlay = document.createElement('div');
      overlay.id = 'expFloatingPopupOverlay';
      overlay.className = 'exp-fp-overlay';

      const popup = document.createElement('div');
      popup.className = 'exp-fp-card';

      const header = `<div class="exp-fp-header">
        <span class="exp-fp-title">${title}</span>
        <button class="exp-fp-close" onclick="closeExpenseFloatingPopup()" aria-label="닫기">
          <svg width="14" height="14" viewBox="0 0 16 16">
            <line x1="2" y1="2" x2="14" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="14" y1="2" x2="2" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>`;
      const body = `<div class="exp-fp-body">${contentHtml}</div>`;

      popup.innerHTML = header + body;
      overlay.appendChild(popup);

      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeExpenseFloatingPopup();
      });
      document.body.appendChild(overlay);

      // 위치 계산 (sync)
      const popupRect = popup.getBoundingClientRect();
      const popupW = popupRect.width || 380;
      const popupH = popupRect.height || 400;
      const winW = window.innerWidth;
      const winH = window.innerHeight;

      let left = (anchorX || winW / 2) - popupW / 2;
      let top = (anchorY || winH / 2 - 100) + 12;
      if (left < 16) left = 16;
      if (left + popupW > winW - 16) left = winW - popupW - 16;
      if (top + popupH > winH - 16) top = (anchorY || winH / 2) - popupH - 12;
      if (top < 16) top = 16;

      popup.style.left = left + 'px';
      popup.style.top = top + 'px';

      // 다음 tick 에 open class 추가 (CSS transition trigger)
      requestAnimationFrame(() => overlay.classList.add('open'));

      const escHandler = (e) => {
        if (e.key === 'Escape') {
          closeExpenseFloatingPopup();
          document.removeEventListener('keydown', escHandler);
        }
      };
      document.addEventListener('keydown', escHandler);
    }

    function closeExpenseFloatingPopup() {
      const overlay = document.getElementById('expFloatingPopupOverlay');
      if (!overlay) return;
      overlay.classList.remove('open');
      setTimeout(() => {
        if (overlay.parentNode) overlay.remove();
      }, 250);
    }

      if (!q) return text;

    function renderExpense() {
      const data = FIXTURE.expense;
      const view = document.getElementById('mainView');
      const mm = String(data.month).padStart(2, '0');
      const todayStr = `${mm}-${String(data.today).padStart(2, '0')}`;
      if (!_selectedDate) _selectedDate = todayStr;

      // 일별 합계 (캘린더용)
      const dailyTotals = {};
      data.txns.forEach(t => {
        dailyTotals[t.date] = (dailyTotals[t.date] || 0) + t.amount;
      });
      const dailyAvg = data.monthTotal / data.today;
      // 농도 5단계 — 지출 있는 날 분포 분위수 기반 (작업지시서 §5.1)
      const sortedDayTotals = Object.values(dailyTotals).filter(v => v > 0).sort((a, b) => a - b);
      const calTier = (amount) => {
        const n = sortedDayTotals.length;
        if (!n || amount <= 0) return 0;
        let rank = 0;
        for (const v of sortedDayTotals) if (v <= amount) rank++;
        return Math.min(5, Math.max(1, Math.ceil(((rank - 0.5) / n) * 5)));
      };

      // 월간 캘린더 (7열 + 주합 열)
      const firstDow = new Date(data.year, data.month - 1, 1).getDay();
      const daysInMonth = new Date(data.year, data.month, 0).getDate();
      const cells = [];
      for (let i = 0; i < firstDow; i++) cells.push(null);

    function addExpenseInputRow() {
      const list = document.getElementById('expenseList');
      if (!list) return;
      const existing = list.querySelector('.expense-row--input');
      if (existing) {
        existing.querySelector('.expense-row__cat input')?.focus();
        return;
      }
      const today = new Date();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      const inputRow = document.createElement('div');
      inputRow.className = 'expense-row expense-row--input';
      inputRow.innerHTML = `
        <span class="expense-row__date"><input type="text" value="${mm}-${dd}" maxlength="5" /></span>
        <span class="expense-row__cat"><input type="text" placeholder="카테고리" /></span>
        <span class="expense-row__memo"><input type="text" placeholder="메모" /></span>
        <span class="expense-row__amount"><input type="text" placeholder="금액 (원)" inputmode="numeric" /></span>
      `;
      list.prepend(inputRow);
      inputRow.querySelector('.expense-row__cat input')?.focus();
      inputRow.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const date = inputRow.querySelector('.expense-row__date input').value.trim();
          const cat = inputRow.querySelector('.expense-row__cat input').value.trim();
          const memo = inputRow.querySelector('.expense-row__memo input').value.trim();
          const amountStr = inputRow.querySelector('.expense-row__amount input').value;
          const amount = parseInt(amountStr.replace(/[^\d]/g, ''), 10) || 0;
          if (!cat || !memo || !amount) return;
          FIXTURE.expense.txns.unshift({
            id: 'tx-' + Date.now(),
            date: date || (mm + '-' + dd),
            category: cat,
            memo: memo,
            amount: amount
          });
          FIXTURE.expense.monthTotal += amount;
          FIXTURE.expense.budgetUsed += amount;
          renderExpense();
        } else if (e.key === 'Escape') {
          e.preventDefault();
          inputRow.remove();
        }
      });
    }

    function setCategory(key) {
      // Wave 11.8 — admin 은 FIXTURE 없이 SPA admin.js wire (mocks fixture 미사용).
      if (key !== 'admin' && !FIXTURE[key]) return;
      activeCat = key;
      // admin 은 가계부의 sub-view — 사이드바 active 는 가계부 유지 (Wave 11.8 후속).
      const activeNavKey = key === 'admin' ? 'expense' : key;
      document.querySelectorAll('.sb__item[data-category]').forEach(el => {
        el.classList.toggle('sb__item--active', el.dataset.category === activeNavKey);
      });
      // body class 갱신 (라우트별 영역 hide/show 위해)
      ['navi', 'fiction', 'blog', 'memo', 'expense', 'admin'].forEach(k => {
        document.body.classList.toggle('is-' + k, k === key);
      });
      // admin 은 SPA admin.js 가 #adminView 렌더 — 여기선 body class 토글만.
      if (key === 'admin') {
        document.getElementById('crumbCat').textContent = '매핑 관리';
        return;
      }
      // Wave 11.6.10 — 카테고리 전환 시 edit-toolbar 자동 close (이전 카테고리에서 켜놨던 잔존 차단)
      const __tb = document.getElementById('editToolbar');
      const __trig = document.getElementById('editTrigger');
      if (__tb) { __tb.classList.remove('is-open'); __tb.setAttribute('aria-hidden', 'true'); }
      if (__trig) { __trig.classList.remove('is-open'); __trig.setAttribute('aria-pressed', 'false'); }
      document.getElementById('crumbCat').textContent = FIXTURE[key].label;
      renderRecents(key);
      if (key === 'expense') {
        const m = String(FIXTURE.expense.month).padStart(2, '0');
        const d = String(FIXTURE.expense.today).padStart(2, '0');
        _selectedDate = `${m}-${d}`;
        renderExpense();
      } else if ((FIXTURE[key].docs || []).length === 0) {
        renderEmpty(FIXTURE[key].label);
      } else {
        renderDoc(FIXTURE[key].docs[0]);
      }
    }

        if (doc) renderDoc(doc);
        return;
      }
      const day = e.target.closest('.exp-month-day[data-date]:not(.empty)');
      if (day && activeCat === 'expense') {
        if (day.classList.contains('is-zero') && !day.classList.contains('today')) return;

        if (_selectedDate === day.dataset.date && popoverEl?.classList.contains('is-open')) {
          (window.closeExpDayPopover || closeExpDayPopover)();
        } else {
          _selectedDate = day.dataset.date;
          (window.openExpDayPopover || openExpDayPopover)(day);
        }
      }
    });

    // ═══ Phase D — 가계부 거래 입력/수정 모달 (Wave 11.1.5+) ═══
    // 카테고리 마스터 — Keep GAS 포팅 자산 (expense-classifier.js, 16 categories) 우선,
    // SPA 모듈 미로드 fallback 으로 inline 11개 유지.
    const EXP_CATEGORIES_FALLBACK = [
      { key: '외식',     label: '외식' },
      { key: '배달',     label: '배달' },
      { key: '온라인쇼핑', label: '온라인쇼핑' },

      { key: '패션',     label: '패션' },
      { key: '구독',     label: '구독' },
      { key: '교통',     label: '교통' },
      { key: '기타',     label: '기타' }
    ];
    function _getExpenseCategoryMaster() {
      const cls = (typeof window !== 'undefined' && window.todayClassifier) || null;
      if (cls && Array.isArray(cls.EXPENSE_CATEGORIES) && cls.EXPENSE_CATEGORIES.length > 0) {
        // 한글 name 을 key 로 사용 (fixture txns 의 한글 category 와 호환).
        // 영문 id 마이그레이션은 더미/fixture 정리 wave (1번) 에서 일괄 진행.
        return cls.EXPENSE_CATEGORIES.map((c) => ({ key: c.name, label: c.name, id: c.id }));
      }
      return EXP_CATEGORIES_FALLBACK;
    }
    // 호환 유지 — 기존 코드는 EXP_CATEGORIES 를 직접 참조. getter property 로 매 접근 시 master 호출.
    const EXP_CATEGORIES = new Proxy([], {
      get(_target, prop) {
        const arr = _getExpenseCategoryMaster();
        return prop === 'length' ? arr.length : arr[prop];
      },
    });
    const EXP_CAT_TOP_N = 4;
    let _expModalMode = 'new';
    let _expModalEditId = null;
    let _expModalDirty = false;
    let _expModalSelectedCat = null;

    // 실제 구현 시: 사용자별 거래 저장소에서 최근 3개월 집계 권장 (오래된 패턴 흐려지도록)
    function _getSortedCategories() {
      try {
        const txns = (FIXTURE && FIXTURE.expense && FIXTURE.expense.txns) || [];
        const counts = {};
        txns.forEach(t => {
          if (t.category) counts[t.category] = (counts[t.category] || 0) + 1;
        });
        return [...EXP_CATEGORIES].sort((a, b) => {
          const ca = counts[a.key] || 0;
          const cb = counts[b.key] || 0;
          return cb - ca;
        });
      } catch (e) {
        return EXP_CATEGORIES;
      }
    }

    function buildExpModalCatGrid() {

        return `<button type="button" class="exp-cat-cell${rankClass}" data-cat="${c.key}" onclick="selectExpModalCat('${c.key}', this)">${c.label}</button>`;

    function selectExpModalCat(key, btn) {

    // 마지막으로 사용한 카드 — 거래 저장소에서 카드 정보가 있는 가장 최근 거래의 카드
    // fixture 사용 중에는 FIXTURE.expense.txns 기반. 실제 구현 시 사용자별 거래 저장소로 전환.
    function _getLastUsedCard() {
      try {
        const txns = (FIXTURE && FIXTURE.expense && FIXTURE.expense.txns) || [];
        const sorted = txns.filter(t => t.card).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
        return sorted.length ? sorted[0].card : '';
      } catch (e) {
        return '';
      }
    }

    function _formatExpDt(d) {
      if (!d || isNaN(d.getTime())) return '—';
      const pad = n => String(n).padStart(2, '0');
      return `${d.getMonth()+1}월 ${d.getDate()}일 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    // 날짜 모달 → "이 날에 거래 추가" — 신규 지출 입력 모달 + 그 날짜 프리셋 (작업지시서 §5.1)
    // 주의: closeExpDayPopover/openExpenseModal 은 별 IIFE — window 노출분 호출 (SPA monkey-patch 경유)
    function addExpenseOnPopoverDate() {
      const popover = document.getElementById('expDayPopover');
      const ds = popover?.dataset?.date || '';   // 'MM-DD'
      window.closeExpDayPopover?.();
      window.openExpenseModal?.('new');
      const m = ds.match(/^(\d{2})-(\d{2})$/);
      if (!m) return;
      // 연도는 현재 보고 있는 월 네비 라벨 기준 (과거 월에서도 정확)
      const label = document.querySelector('.exp-month-nav-label')?.textContent || '';
      const ym = label.match(/(\d{4})년/);
      const year = ym ? Number(ym[1]) : new Date().getFullYear();
      const now = new Date();
      _setExpModalDt(new Date(year, Number(m[1]) - 1, Number(m[2]), now.getHours(), now.getMinutes()));
    }
    window.addExpenseOnPopoverDate = addExpenseOnPopoverDate;
    function _setExpModalDt(d) {
      const pad = n => String(n).padStart(2, '0');
      const value = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
      const input = document.getElementById('expModalDatetime');
      const text = document.getElementById('expModalDtText');
      if (input) input.value = value;
      if (text) text.textContent = _formatExpDt(d);
    }

    /* 커스텀 날짜 popover (월 캘린더 + 시간 stepper) */
    let _expDatePopMonth = null;
    function _isSameDay(a, b) {
      return a && b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
    }
    function _getExpModalDateValue() {
      const v = document.getElementById('expModalDatetime')?.value;
      if (!v) return null;
      const d = new Date(v);
      return isNaN(d.getTime()) ? null : d;
    }
    function _renderExpDatePopover() {
      if (!_expDatePopMonth) _expDatePopMonth = new Date();
      const ym = _expDatePopMonth;
      const title = document.getElementById('expDatePopoverTitle');
      if (title) title.textContent = `${ym.getFullYear()}년 ${ym.getMonth()+1}월`;
      const grid = document.getElementById('expDatePopoverGrid');
      if (!grid) return;
      const year = ym.getFullYear(), month = ym.getMonth();
      const first = new Date(year, month, 1);
      const startDay = first.getDay();
      const daysInMonth = new Date(year, month+1, 0).getDate();
      const prevMonthDays = new Date(year, month, 0).getDate();
      const today = new Date();
      const selected = _getExpModalDateValue();
      const cells = [];
      for (let i = startDay - 1; i >= 0; i--) {
        const d = new Date(year, month-1, prevMonthDays - i);
        cells.push({ d, other: true });
      }
      for (let day = 1; day <= daysInMonth; day++) {
        cells.push({ d: new Date(year, month, day), other: false });
      }
      const need = 42 - cells.length;
      for (let day = 1; day <= need; day++) {
        cells.push({ d: new Date(year, month+1, day), other: true });
      }
      grid.innerHTML = cells.map(c => {
        const cls = ['exp-date-cell'];
        if (c.other) cls.push('is-other');
        if (_isSameDay(c.d, today)) cls.push('is-today');
        if (selected && _isSameDay(c.d, selected)) cls.push('is-selected');
        const iso = `${c.d.getFullYear()}-${String(c.d.getMonth()+1).padStart(2,'0')}-${String(c.d.getDate()).padStart(2,'0')}`;
        return `<button type="button" class="${cls.join(' ')}" data-date="${iso}" onclick="pickExpDate('${iso}')">${c.d.getDate()}</button>`;
      }).join('');
    }
    function openExpDatePopover() {
      const m = document.querySelector('#expModalOverlay .exp-modal');
      if (!m) return;
      const cur = _getExpModalDateValue() || new Date();
      _expDatePopMonth = new Date(cur.getFullYear(), cur.getMonth(), 1);
      const hour = document.getElementById('expDateHour');
      const min = document.getElementById('expDateMin');
      if (hour) hour.value = String(cur.getHours()).padStart(2, '0');
      if (min) min.value = String(cur.getMinutes()).padStart(2, '0');
      _renderExpDatePopover();
      _positionExpDatePopover();
      m.setAttribute('data-date-open', 'true');
    }
    function closeExpDatePopover() {
      const m = document.querySelector('#expModalOverlay .exp-modal');
      if (m) m.setAttribute('data-date-open', 'false');
    }
    function _positionExpDatePopover() {
      const trigger = document.getElementById('expModalDtTrigger');
      const pop = document.getElementById('expDatePopover');
      if (!trigger || !pop) return;
      const modal = document.querySelector('#expModalOverlay .exp-modal');
      const tRect = trigger.getBoundingClientRect();
      const mRect = modal.getBoundingClientRect();
      pop.style.top = `${tRect.bottom - mRect.top + 6}px`;
    }
    function shiftExpDateMonth(delta) {
      if (!_expDatePopMonth) _expDatePopMonth = new Date();
      _expDatePopMonth = new Date(_expDatePopMonth.getFullYear(), _expDatePopMonth.getMonth()+delta, 1);
      _renderExpDatePopover();
    }
    function pickExpDate(iso) {
      const [y, mo, da] = iso.split('-').map(Number);
      const hour = parseInt(document.getElementById('expDateHour')?.value || '0', 10) || 0;
      const min = parseInt(document.getElementById('expDateMin')?.value || '0', 10) || 0;
      const d = new Date(y, mo-1, da, Math.min(23, Math.max(0, hour)), Math.min(59, Math.max(0, min)));

      _expModalDirty = true;
      _renderExpDatePopover();
      closeExpDatePopover();
    }
    function setExpDatePopoverToday() {
      const now = new Date();
      _expDatePopMonth = new Date(now.getFullYear(), now.getMonth(), 1);

      _expModalDirty = true;

    /* 카드사 SMS 파싱 — 금액/일시/지출처/카드사 추출 (best-effort) */
    async function pasteExpenseSMS() {
      let raw = '';
      try {
        if (navigator.clipboard && navigator.clipboard.readText) {
          raw = await navigator.clipboard.readText();
        }
      } catch (_) {}
      if (!raw) {
        raw = window.prompt('카드사 문자를 붙여넣으세요', '') || '';
      }
      if (!raw.trim()) return;
      const parsed = _parseExpenseSMS(raw);
      if (parsed.amount != null) {
        const a = document.getElementById('expModalAmount');
        if (a) a.value = parsed.amount.toLocaleString();
      }
      if (parsed.date) _setExpModalDt(parsed.date);
      if (parsed.merchant) {
        const m = document.getElementById('expModalMerchant');
        if (m) m.value = parsed.merchant;
      }
      if (parsed.card) {
        const opt = Array.from(document.querySelectorAll('#expCardPopover .exp-card-option')).find(o => o.textContent.includes(parsed.card));
        if (opt) pickExpCard(opt.getAttribute('data-card') || opt.textContent.trim());
      }
      _expModalDirty = true;
    }
    function _parseExpenseSMS(s) {
      const out = { amount: null, date: null, merchant: '', card: '' };
      const amt = s.match(/([\d,]{2,})\s*원/);
      if (amt) {
        const n = parseInt(amt[1].replace(/,/g, ''), 10);
        if (!isNaN(n)) out.amount = n;
      }
      const dt = s.match(/(\d{1,2})\/(\d{1,2})[^\d]+(\d{1,2}):(\d{2})/);
      const now = new Date();
      if (dt) {
        const d = new Date(now.getFullYear(), parseInt(dt[1],10)-1, parseInt(dt[2],10), parseInt(dt[3],10), parseInt(dt[4],10));
        if (d > now) d.setFullYear(d.getFullYear() - 1);
        out.date = d;
      } else {
        const tm = s.match(/(\d{1,2}):(\d{2})/);
        if (tm) {
          const d = new Date(now);
          d.setHours(parseInt(tm[1],10), parseInt(tm[2],10), 0, 0);
          out.date = d;
        }
      }
      const cardKw = s.match(/(KB국민|국민|삼성|현대|신한|롯데|하나|우리|BC|NH농협|농협)/);
      if (cardKw) out.card = cardKw[1];
      const tail = s.split(/[\r\n]+/).map(x=>x.trim()).filter(Boolean);
      const lastLine = tail[tail.length-1] || '';
      const tokens = lastLine.split(/\s+/);
      const last = tokens[tokens.length-1] || '';
      if (last && !/원$|일시불|할부|승인|취소|\d{1,2}:\d{2}|\d{1,2}\/\d{1,2}/.test(last)) {
        out.merchant = last;
      } else if (tokens.length >= 2) {
        const second = tokens[tokens.length-2];
        if (second && !/원$|승인|일시불|할부/.test(second)) out.merchant = second;
      }
      return out;
    }

    function _resetExpModal() {
      _expModalMode = 'new';
      _expModalEditId = null;
      _expModalDirty = false;
      _expModalSelectedCat = null;
      ['expModalAmount','expModalDatetime','expModalMerchant','expModalCard','expModalMemo','expModalUrl'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
      });
      document.querySelectorAll('#expModalCatGrid .exp-cat-cell').forEach(c => c.classList.remove('is-active'));
      document.querySelectorAll('#expModalOverlay .exp-field').forEach(f => f.classList.remove('is-readonly'));
      const m = document.querySelector('#expModalOverlay .exp-modal');
      if (m) {
        m.setAttribute('data-card-open', 'false');
        m.setAttribute('data-date-open', 'false');
      }
      const lastCard = _getLastUsedCard() || '';
      const cardHidden = document.getElementById('expModalCard');
      if (cardHidden) cardHidden.value = lastCard;
      const cardLabel = document.getElementById('expModalCardLabel');
      if (cardLabel) {
        // raw 값('삼성1337') 대신 카드 팝오버 옵션의 풀네임 표시 (작업지시서 §7 — 내부코드 금지)
        const opt = lastCard && document.querySelector(`#expCardPopover .exp-card-option[data-card="${lastCard.replace(/"/g, '\\"')}"]`);
        cardLabel.textContent = opt ? opt.textContent.trim() : (lastCard || '선택 안 함');
      }
      const dtText = document.getElementById('expModalDtText');
      if (dtText) dtText.textContent = '—';
      const dBtn = document.getElementById('expModalDeleteBtn');
      if (dBtn) dBtn.style.display = 'none';
      const title = document.getElementById('expModalTitle');
      if (title) title.textContent = '지출 입력';
    }

    function openExpenseModal(mode = 'new', txId = null) {
      _resetExpModal();
      _expModalMode = mode;
      _expModalEditId = txId;
      const _modalEl = document.querySelector('#expModalOverlay .exp-modal');
      if (_modalEl) _modalEl.setAttribute('data-mode', 'new');   // 기본 new — edit tx 확정 후 전환 (half-state 방지)

      if (mode === 'edit' && txId) {
        const tx = FIXTURE.expense.txns.find(t => t.id === txId);
        if (!tx) return;   // tx 없으면 new 상태 유지
        if (_modalEl) _modalEl.setAttribute('data-mode', 'edit');   // 붙여넣기 CTA 신규만 (작업지시서 §7)
        document.getElementById('expModalTitle').textContent = '거래 수정';
        document.getElementById('expModalDeleteBtn').style.display = '';

        document.getElementById('expModalAmount').value = (tx.amount || 0).toLocaleString();
        const year = FIXTURE.expense.year || 2026;
        const [mm, dd] = tx.date.split('-');
        const time = tx.time || '12:00';
        const dt = new Date(`${year}-${mm}-${dd}T${time}`);
        _setExpModalDt(dt);
        document.getElementById('expModalMerchant').value = tx.brand || tx.memo || '';
        if (tx.card) pickExpCard(tx.card);
        document.getElementById('expModalMemo').value = tx.memo || '';
        document.getElementById('expModalUrl').value = tx.merchant_url || '';

        if (tx.category) {
          _expModalSelectedCat = tx.category;
          const cell = document.querySelector(`#expModalCatGrid .exp-cat-cell[data-cat="${tx.category}"]`);
          if (cell) cell.classList.add('is-active');
          _ensureCatVisible(tx.category);
        }

        // card 는 수정 모달에서도 변경 가능 (잘못 입력된 카드 정정 등). amount/datetime/merchant/category 만 readonly.
        ['amount', 'datetime', 'merchant', 'category'].forEach(name => {
          const f = document.querySelector(`#expModalOverlay .exp-field[data-field="${name}"]`);
          if (f) f.classList.add('is-readonly');
        });
        _expModalDirty = false;
      } else {
        _setExpModalDt(new Date());
        _expModalDirty = false;
      }

      const overlay = document.getElementById('expModalOverlay');
      overlay.classList.add('is-open');
      overlay.setAttribute('aria-hidden', 'false');

      setTimeout(() => {
        if (mode === 'new') {
          const amt = document.getElementById('expModalAmount');
          if (amt) amt.focus();
        }
      }, 100);
    }

    function _doCloseExpenseModal() {
      const overlay = document.getElementById('expModalOverlay');
      overlay.classList.remove('is-open');
      overlay.setAttribute('aria-hidden', 'true');
      setTimeout(() => _resetExpModal(), 220);
    }

    function closeExpenseModal() {
      if (_expModalDirty) {
        _expModalPendingClose = true;
        showExpConfirm('입력 중인 내용을 버립니다.<br>계속하시겠습니까?');
      } else {
        _doCloseExpenseModal();
      }
    }

    function saveExpenseFromModal() {
      const amount = parseInt(document.getElementById('expModalAmount').value.replace(/[^\d]/g, ''), 10) || 0;
      const datetime = document.getElementById('expModalDatetime').value;
      const merchant = document.getElementById('expModalMerchant').value.trim();
      const card = document.getElementById('expModalCard').value;
      const memo = document.getElementById('expModalMemo').value.trim();
      const url = document.getElementById('expModalUrl').value.trim();
      const category = _expModalSelectedCat;

      if (!amount) { alert('금액을 입력해주세요.'); document.getElementById('expModalAmount').focus(); return; }
      if (!datetime) { alert('일시를 선택해주세요.'); return; }
      if (!merchant) { alert('지출처를 입력해주세요.'); document.getElementById('expModalMerchant').focus(); return; }
      if (!category) { alert('카테고리를 선택해주세요.'); return; }

      const [datePart, timePart] = datetime.split('T');
      const [yy, mm, dd] = datePart.split('-');
      const date = `${mm}-${dd}`;

      if (_expModalMode === 'edit' && _expModalEditId) {
        const tx = FIXTURE.expense.txns.find(t => t.id === _expModalEditId);
        if (tx) {
          tx.category = category;
          tx.memo = memo;
          tx.merchant_url = url;
        }
      } else {
        const newTx = {
          id: 'tx-m-' + Date.now().toString(36),
          date: date,
          time: timePart,
          category: category,
          memo: memo || merchant,
          amount: amount,
          brand: merchant,
          card: card || undefined,
          merchant_url: url || undefined,
          source: 'manual'
        };
        FIXTURE.expense.txns.push(newTx);
      }

      _expModalDirty = false;
      _doCloseExpenseModal();
      if (typeof renderExpense === 'function') renderExpense();
    }

    function deleteExpenseFromModal() {
      if (!_expModalEditId) return;
      showExpConfirm('이 거래를 삭제합니다.<br>되돌릴 수 없습니다.', () => {
        const idx = FIXTURE.expense.txns.findIndex(t => t.id === _expModalEditId);
        if (idx >= 0) FIXTURE.expense.txns.splice(idx, 1);
        _expModalDirty = false;
        hideExpConfirm();
        _doCloseExpenseModal();
        if (typeof renderExpense === 'function') renderExpense();
      });
    }

    function showExpConfirm(msg, onOk) {
      document.getElementById('expConfirmMsg').innerHTML = msg;
      _expConfirmCallback = onOk || null;
      const ov = document.getElementById('expConfirmOverlay');
      ov.classList.add('is-open');
      ov.setAttribute('aria-hidden', 'false');
    }

    function hideExpConfirm() {
      const ov = document.getElementById('expConfirmOverlay');
      ov.classList.remove('is-open');
      ov.setAttribute('aria-hidden', 'true');
      _expConfirmCallback = null;
      _expModalPendingClose = false;
    }

    function confirmExpDiscard() {
      if (_expConfirmCallback) {
        _expConfirmCallback();
        return;
      }
      if (_expModalPendingClose) {
        _expModalPendingClose = false;
        _expModalDirty = false;
        hideExpConfirm();
        _doCloseExpenseModal();
      } else {
        hideExpConfirm();
      }
    }

    function _attachExpModalDirty() {
      const modal = document.querySelector('#expModalOverlay .exp-modal');
      if (!modal) return;
      modal.addEventListener('input', (e) => {
        if (e.target.matches('input, select')) _expModalDirty = true;
      });
      modal.addEventListener('change', (e) => {
        if (e.target.matches('input, select')) _expModalDirty = true;
      });
    }

    function _attachExpModalBackdrop() {
      const overlay = document.getElementById('expModalOverlay');
      if (!overlay) return;
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeExpenseModal();
      });
    }

    function _attachExpModalEsc() {
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        const confirmOpen = document.getElementById('expConfirmOverlay').classList.contains('is-open');
        const modalOpen = document.getElementById('expModalOverlay').classList.contains('is-open');
        if (confirmOpen) {
          hideExpConfirm();
          return;
        }
        if (modalOpen) closeExpenseModal();
      });
    }

    window.openExpenseModal = openExpenseModal;
    window.closeExpenseModal = closeExpenseModal;
    window.saveExpenseFromModal = saveExpenseFromModal;
    window.deleteExpenseFromModal = deleteExpenseFromModal;
    window.selectExpModalCat = selectExpModalCat;
    window.toggleExpModalCatGrid = toggleExpModalCatGrid;
    window.openExpDatePopover = openExpDatePopover;
    window.shiftExpDateMonth = shiftExpDateMonth;
    window.pickExpDate = pickExpDate;
    window.setExpDatePopoverToday = setExpDatePopoverToday;
    window.openExpCardPopover = openExpCardPopover;
    window.pickExpCard = pickExpCard;
    window.pasteExpenseSMS = pasteExpenseSMS;
    window.hideExpConfirm = hideExpConfirm;
    window.confirmExpDiscard = confirmExpDiscard;

    // ═══ Spotlight (⌘K) 검색 ═══
    let _spotlightActive = -1;
    let _spotlightItems = [];

    function _spotlightIcon(kind) {
      const icons = {
        doc: '<path d="M3 2h7l3 3v9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/><path d="M10 2v3h3M5 8h6M5 11h4"/>',
        expense: '<rect x="2" y="4" width="12" height="9" rx="1.5"/><path d="M2 7h12M5 10h2"/>',
        action: '<circle cx="8" cy="8" r="6"/><path d="M8 5v3l2 1.5"/>',
      };
      return `<svg class="spotlight-item__ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">${icons[kind] || icons.action}</svg>`;
    }

    function _highlight(text, q) {
      if (!q) return text;
      const i = text.toLowerCase().indexOf(q.toLowerCase());
      if (i < 0) return text;
      return text.slice(0, i) + '<mark>' + text.slice(i, i + q.length) + '</mark>' + text.slice(i + q.length);
    }

    function _spotlightCollectDocs() {
      const groups = ['navi', 'fiction', 'blog', 'memo'];
      const out = [];
      groups.forEach(g => {
        const cat = FIXTURE[g];
        if (!cat || !cat.docs) return;
        cat.docs.forEach(d => {
          out.push({
            kind: 'doc',
            categoryKey: g,
            categoryLabel: cat.label,
            id: d.id,
            title: d.title,
            body: (d.body || []).map(b => b.text || '').join(' '),
          });
        });
      });
      return out;
    }

    function _spotlightCollectTxns() {
      const txns = (FIXTURE.expense && FIXTURE.expense.txns) || [];
      return txns.map(t => ({
        kind: 'expense',
        id: t.id,
        title: t.brand || t.memo || '거래',
        category: t.category,
        date: t.date,
        amount: t.amount,
      }));
    }

    function _spotlightActions() {
      return [
        { kind: 'action', id: 'act-new-expense', title: '지출 입력', meta: '새 거래 추가', run: () => { closeSpotlight(); setTimeout(() => openExpenseModal('new'), 80); } },
        { kind: 'action', id: 'act-go-expense', title: '가계부 열기', meta: '월간 통계 + 거래 피드', run: () => { closeSpotlight(); _spotlightGoCategory('expense'); } },
        { kind: 'action', id: 'act-go-navi', title: '오늘의 네비', meta: '오늘 항해 글', run: () => { closeSpotlight(); _spotlightGoCategory('navi'); } },
      ];
    }

    function _spotlightGoCategory(key) {
      const items = [...document.querySelectorAll('.sb__item[data-category]')];
      const target = items.find(i => i.getAttribute('data-category') === key);
      if (target) target.click();
    }

    function _spotlightOpenItem(item) {
      if (item.kind === 'action' && typeof item.run === 'function') {
        item.run();
        return;
      }
      if (item.kind === 'doc') {
        closeSpotlight();
        setTimeout(() => _spotlightGoCategory(item.categoryKey), 80);
        return;
      }
      if (item.kind === 'expense') {
        closeSpotlight();
        setTimeout(() => openExpenseModal('edit', item.id), 80);
      }
    }

    function _spotlightRender(q) {
      const body = document.getElementById('spotlightBody');
      if (!body) return;
      _spotlightItems = [];
      const ql = q.trim().toLowerCase();
      const matchesQ = (s) => !ql || (s || '').toLowerCase().includes(ql);

      const collectDocs = (window._spotlightCollectDocs || _spotlightCollectDocs);
      const collectTxns = (window._spotlightCollectTxns || _spotlightCollectTxns);
      const docs = collectDocs().filter(d => matchesQ(d.title) || matchesQ(d.body));
      const txns = collectTxns().filter(t => matchesQ(t.title) || matchesQ(t.category) || matchesQ(t.date));
      const actions = _spotlightActions().filter(a => !ql || matchesQ(a.title) || matchesQ(a.meta));

      if (!ql) {
        // 빈 입력 — 빠른 액션 + 최근 글 3건
        const recentDocs = collectDocs().slice(0, 3);
        _spotlightItems = [...actions, ...recentDocs];
      } else {
        _spotlightItems = [...actions, ...docs, ...txns];
      }

      if (_spotlightItems.length === 0) {
        body.innerHTML = `<div class="spotlight-empty">"${q}" 와 일치하는 결과가 없습니다<div class="spotlight-empty__sub">글 제목·본문, 거래 메모·카테고리, 명령어로 검색하세요</div></div>`;
        _spotlightActive = -1;
        return;
      }

      let html = '';
      const groupedActions = _spotlightItems.filter(i => i.kind === 'action');
      const groupedDocs = _spotlightItems.filter(i => i.kind === 'doc');
      const groupedTxns = _spotlightItems.filter(i => i.kind === 'expense');
      let idx = 0;
      const renderItem = (item) => {
        const i = idx++;
        const titleHtml = _highlight(item.title, ql);
        let metaHtml = '';
        let amountHtml = '';
        if (item.kind === 'doc') {
          // 본문 발췌 + 키워드 highlight (사용자 요청 2026-05-13).
          let excerpt = '';
          if (ql && item.body) {
            const txt = String(item.body).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
            const pos = txt.toLowerCase().indexOf(ql);
            if (pos >= 0) {
              const start = Math.max(0, pos - 30);
              const end = Math.min(txt.length, pos + ql.length + 50);
              const raw = (start > 0 ? '…' : '') + txt.slice(start, end) + (end < txt.length ? '…' : '');
              excerpt = `<div class="spotlight-item__excerpt">${_highlight(raw, ql)}</div>`;
            }
          }
          metaHtml = `<div class="spotlight-item__meta">${item.categoryLabel}</div>${excerpt}`;
        }
        else if (item.kind === 'expense') {
          const [m, d] = (item.date || '').split('-');
          metaHtml = `<div class="spotlight-item__meta">${item.category} · ${m}월 ${parseInt(d,10)}일</div>`;
          amountHtml = `<span class="spotlight-item__amount">${formatAmount(item.amount)}</span>`;
        } else if (item.kind === 'action') metaHtml = `<div class="spotlight-item__meta">${item.meta}</div>`;
        return `
          <div class="spotlight-item" data-idx="${i}" onclick="_spotlightClick(${i})">
            ${_spotlightIcon(item.kind)}
            <div class="spotlight-item__main">
              <div class="spotlight-item__title">${titleHtml}</div>
              ${metaHtml}
            </div>
            ${amountHtml}
          </div>
        `;
      };
      if (groupedActions.length) {
        html += `<div class="spotlight-group"><div class="spotlight-group__label">${ql ? '명령어' : '빠른 액션'}</div>${groupedActions.map(renderItem).join('')}</div>`;
      }
      if (groupedDocs.length) {
        html += `<div class="spotlight-group"><div class="spotlight-group__label">${ql ? '글' : '최근 글'}</div>${groupedDocs.map(renderItem).join('')}</div>`;
      }
      if (groupedTxns.length) {
        html += `<div class="spotlight-group"><div class="spotlight-group__label">거래</div>${groupedTxns.map(renderItem).join('')}</div>`;
      }
      body.innerHTML = html;

      _spotlightActive = 0;
      _spotlightSyncActive();
    }

    function _spotlightSyncActive() {
      const cells = document.querySelectorAll('#spotlightBody .spotlight-item');
      cells.forEach((c, i) => c.classList.toggle('is-active', i === _spotlightActive));
      const active = cells[_spotlightActive];
      if (active) active.scrollIntoView({ block: 'nearest' });
    }

    function _spotlightClick(idx) {
      _spotlightActive = idx;
      const item = _spotlightItems[idx];
      if (item) (window._spotlightOpenItem || _spotlightOpenItem)(item);
    }

    function openSpotlight() {
      const overlay = document.getElementById('spotlightOverlay');
      const input = document.getElementById('spotlightInput');
      if (!overlay) return;
      overlay.classList.add('is-open');
      overlay.setAttribute('aria-hidden', 'false');
      if (input) {
        input.value = '';
        setTimeout(() => input.focus(), 30);
      }
      _spotlightRender('');
    }
    function closeSpotlight() {
      const overlay = document.getElementById('spotlightOverlay');
      if (!overlay) return;
      overlay.classList.remove('is-open');
      overlay.setAttribute('aria-hidden', 'true');
    }

    function _initSpotlight() {
      const overlay = document.getElementById('spotlightOverlay');
      const input = document.getElementById('spotlightInput');
      if (!overlay || !input) return;
      input.addEventListener('input', (e) => _spotlightRender(e.target.value));
      overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSpotlight(); });
      document.addEventListener('keydown', (e) => {
        // ⌘K / Ctrl+K → 토글
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          if (overlay.classList.contains('is-open')) closeSpotlight();
          else openSpotlight();
          return;
        }
        if (!overlay.classList.contains('is-open')) return;
        if (e.key === 'Escape') { e.preventDefault(); closeSpotlight(); return; }
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (_spotlightItems.length === 0) return;
          _spotlightActive = (_spotlightActive + 1) % _spotlightItems.length;
          _spotlightSyncActive();
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (_spotlightItems.length === 0) return;
          _spotlightActive = (_spotlightActive - 1 + _spotlightItems.length) % _spotlightItems.length;
          _spotlightSyncActive();
        } else if (e.key === 'Enter') {
          e.preventDefault();
          const item = _spotlightItems[_spotlightActive];
          if (item) (window._spotlightOpenItem || _spotlightOpenItem)(item);
        }
      });
    }

    window.openSpotlight = openSpotlight;
    window.closeSpotlight = closeSpotlight;
    window._spotlightClick = _spotlightClick;
    window._spotlightCollectDocs = _spotlightCollectDocs;
    window._spotlightCollectTxns = _spotlightCollectTxns;
    window._spotlightOpenItem = _spotlightOpenItem;
    window._spotlightGoCategory = _spotlightGoCategory;

    // Init — navi 카테고리 진입
    setCategory('navi');

    // Init — 가계부 모달 (모달 DOM 은 이 script 다음에 위치 → parse 완료 후 init)
    function _initExpModal() {
      buildExpModalCatGrid();
      _attachExpModalDirty();
      _attachExpModalBackdrop();
      _attachExpModalEsc();
      document.querySelectorAll('#expCardPopover .exp-card-option').forEach(o => {
        o.addEventListener('click', () => pickExpCard(o.getAttribute('data-card') || ''));
      });
      const hour = document.getElementById('expDateHour');
      const min = document.getElementById('expDateMin');
      if (hour) hour.addEventListener('input', _onExpDateTimeChange);
      if (min) min.addEventListener('input', _onExpDateTimeChange);
      document.addEventListener('click', (e) => {
        const m = document.querySelector('#expModalOverlay .exp-modal');
        if (!m) return;
        if (m.getAttribute('data-card-open') === 'true') {
          if (!e.target.closest('#expCardPopover') && !e.target.closest('#expModalCardTrigger')) closeExpCardPopover();
        }
        if (m.getAttribute('data-date-open') === 'true') {
          if (!e.target.closest('#expDatePopover') && !e.target.closest('#expModalDtTrigger')) closeExpDatePopover();
        }
      });
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => { _initExpModal(); _initSpotlight(); });
    } else {
      _initExpModal();
      _initSpotlight();
    }
  })();
</script>

<script>
  // 반응형 — 모바일(768↓) drawer + 태블릿(769–1024) 사이드바 collapse 자동 동기화. DESIGN.md §4.
  (function(){
    const MOBILE_MAX = 768;
    const TABLET_MAX = 1024;
    const isMobile = () => window.matchMedia('(max-width: ' + MOBILE_MAX + 'px)').matches;
    const isTablet = () => window.matchMedia('(min-width: ' + (MOBILE_MAX + 1) + 'px) and (max-width: ' + TABLET_MAX + 'px)').matches;
    // 마커 클래스로 JS-자동 collapse 와 사용자 수동 collapse (#sidebarToggle 클릭) 분리.
    // 태블릿 → 데스크톱 드래그 시 자동 collapse 만 풀고 수동 상태는 보존.
    const syncTabletCollapse = () => {
      const app = document.querySelector('.app');
      if (!app) return;
      if (isTablet()) {
        // 이미 사용자가 데스크톱에서 수동 collapse 했으면 마커 안 붙임 (보존 위해)
        if (!app.classList.contains('is-sidebar-collapsed')) {
          app.classList.add('is-sidebar-collapsed', 'is-sidebar-collapsed--auto');
        }
      } else if (app.classList.contains('is-sidebar-collapsed--auto')) {
        app.classList.remove('is-sidebar-collapsed', 'is-sidebar-collapsed--auto');
      }
    };
    syncTabletCollapse();
    window.addEventListener('resize', syncTabletCollapse);
    const setOpen = (open) => {
      if (open) document.body.dataset.drawerOpen = 'true';
      else delete document.body.dataset.drawerOpen;
    };
    // 모바일 진입 시 default = drawer 열림 (사용자 요청 2026-05-14, 2026-05-13 결정 반전).
    // 데스크톱·태블릿은 사이드바가 레이아웃 일부라 별도 처리 불필요.
    if (isMobile()) setOpen(true);
    // 햄버거(#mainHamburger) 클릭 또는 좌측 edge swipe 로 사용자 능동 열기.
    // 햄버거 → 열기
    document.getElementById('mainHamburger')?.addEventListener('click', () => setOpen(true));
    // backdrop 클릭 → 닫기
    document.getElementById('drawerBackdrop')?.addEventListener('click', () => setOpen(false));
    // Esc → 닫기
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && document.body.dataset.drawerOpen) setOpen(false); });
    // 사이드바 항목 클릭 → 닫기 (모바일 한정).
    // 카테고리 탭은 기본적으로 drawer 유지 (recents 목록에서 글 선택해 진입).
    // 단 가계부는 RECENTS 가 진입점이 아니라 메인 캘린더/타임라인이 진입점이므로
    // 카테고리 클릭 자체로 close (recents 의 거래 내역은 미리보기 성격).
    // 실제 글 선택(.sb__item--recent) + "전체 보기"(.sb__more) 도 close.
    document.addEventListener('click', (e) => {
      if (!isMobile()) return;
      const item = e.target.closest('.sb__item--recent, .sb__more, .sb__item[data-category="expense"]');
      if (item) setOpen(false);
    });
    // viewport 폭 변경 시 — 데스크톱으로 넘어가면 drawer 상태 해제
    window.addEventListener('resize', () => { if (!isMobile()) setOpen(false); });

    // ─── Swipe gesture (모바일) — keep gesture.js 패턴 차용
    //  * 본문 좌측 edge(0~24px) → 우 swipe = drawer open 1:1 추적
    //  * drawer/backdrop → 좌 swipe = drawer close 1:1 추적
    //  * 결정 임계 6px, dy>dx*1.2 면 수직 스크롤 양보, 임계 통과(40% or vel>0.5+20%) 시 snap, 미달 시 spring back
    (function(){
      const sidebar = document.querySelector('.sidebar');
      const backdrop = document.getElementById('drawerBackdrop');
      if (!sidebar) return;

      const DECIDE_PX = 6;
      const ANGLE = 1.2;
      const SNAP_RATIO = 0.4;
      const VEL_RATIO = 0.2;
      const VEL_TH = 0.5;
      const CURVE = 'cubic-bezier(.25,.46,.45,.94)';

      let sx = 0, sy = 0, sxOrig = 0, t0 = 0, decided = false, swiping = false;
      let startOpen = false, panelW = 0, baseProgress = 0;
      let moveBound = false; // drawer 드래그용 non-passive touchmove 등록 여부 (제스처 중에만 true)
      // 진행 중 snap 의 정리 타이머 핸들 — 새 제스처(re-grab)가 가로채면 취소 (mid-snap 점프 방지).
      let snapRaf = 0, snapCleanT = 0, snapTransT = 0;

      const setTrack = (progress) => {
        const p = Math.max(0, Math.min(1, progress));
        sidebar.style.transition = 'none';
        sidebar.style.transform = 'translate3d(' + (-panelW * (1 - p)) + 'px,0,0)';
        // main 은 이동하지 않음 — 사이드바만 본문 위로 슬라이드 (아이폰 PWA 피드백 1)
        if (backdrop) {
          backdrop.style.transition = 'none';
          backdrop.style.opacity = String(p);
          backdrop.style.pointerEvents = p > 0.05 ? 'auto' : 'none';
        }
      };

      const snapTo = (open, velocity) => {
        const dur = velocity > VEL_TH ? 0.22 : 0.32;
        const T = 'transform ' + dur + 's ' + CURVE;
        sidebar.style.transition = T;
        if (backdrop) backdrop.style.transition = 'opacity ' + dur + 's ' + CURVE;
        setOpen(open);
        const clean = () => {
          sidebar.style.transform = '';
          if (backdrop) { backdrop.style.opacity = ''; backdrop.style.pointerEvents = ''; }
        };
        snapRaf = requestAnimationFrame(clean);
        snapCleanT = setTimeout(clean, 32); // raf 누락 환경 fallback
        snapTransT = setTimeout(() => {
          sidebar.style.transition = '';
          if (backdrop) backdrop.style.transition = '';
        }, dur * 1000 + 60);
      };

      // 본문 스크롤 fast-path 보존 (2026-06-02): drawer 드래그용 touchmove(passive:false)를
      // 상시 등록하면 iOS 컴포지터 스크롤이 꺼져 본문 스크롤이 메인스레드에 묶여 느려진다(소연 보고).
      // → edge-swipe / drawer-open 제스처 시작 시에만 동적 등록하고 제스처 종료 시 제거.
      //   평소 본문 영역 터치는 touchstart 의 edge 체크에서 막혀 리스너가 붙지 않음 → fast-path 유지.
      const onDrawerMove = (e) => {
        if (!isMobile() || e.touches.length !== 1 || !panelW) return;
        const dx = e.touches[0].clientX - sx;
        const dy = e.touches[0].clientY - sy;
        if (!decided) {
          if (Math.abs(dx) < DECIDE_PX && Math.abs(dy) < DECIDE_PX) return;
          decided = true;
          // 비드로어(세로/역방향) 판정 시 즉시 unbind — non-passive touchmove 를 떼어 본문 세로
          // 스크롤 fast-path 를 되돌림 (open-from-anywhere 의 스크롤 회귀 방지 defense-in-depth).
          if (Math.abs(dy) > Math.abs(dx) * ANGLE) { panelW = 0; unbindDrawerMove(); return; }
          const dir = dx > 0 ? 'right' : 'left';
          // closed → 우 swipe(open), open → 좌 swipe(close) 만 유효
          if ((!startOpen && dir !== 'right') || (startOpen && dir !== 'left')) { panelW = 0; unbindDrawerMove(); return; }
          swiping = true;
          // 진행 중 snap 가로채기(re-grab): 정리 타이머 취소 + 현재 렌더 위치를 base 로 잡아 첫
          // setTrack 이 0/1 로 튀지 않게 (mid-snap 점프 결함 수정). 정상 단발 제스처면 렌더 위치가
          // 곧 startOpen?1:0 이라 base=startOpen?1:0 → 기존 공식과 수학적으로 동일 (무회귀).
          if (snapRaf) { cancelAnimationFrame(snapRaf); snapRaf = 0; }
          if (snapCleanT) { clearTimeout(snapCleanT); snapCleanT = 0; }
          if (snapTransT) { clearTimeout(snapTransT); snapTransT = 0; }
          const tf = getComputedStyle(sidebar).transform;
          const m41 = (tf && tf !== 'none') ? new DOMMatrixReadOnly(tf).m41 : (startOpen ? 0 : -panelW);
          baseProgress = Math.max(0, Math.min(1, 1 + m41 / panelW));
          // 결정점부터 시각추적 — sx 를 현재 손가락 위치로 재기준. 안 하면 데드존(첫 프레임 dx,
          // 빠른 플릭은 수십 px) 만큼 사이드바가 팝인돼 "점프"로 보임. (snap 판정은 sxOrig 기준.)
          sx = e.touches[0].clientX; sy = e.touches[0].clientY;
        }
        if (!swiping) return;
        if (e.cancelable) e.preventDefault();
        const dxTrack = e.touches[0].clientX - sx; // re-baseline 반영 (결정 직후 0 = 휴지)
        const progress = baseProgress + dxTrack / panelW; // 현재 렌더 위치에서 1:1 이어받기 (open=close 대칭)
        setTrack(progress);
      };
      const bindDrawerMove = () => {
        if (moveBound) return;
        document.addEventListener('touchmove', onDrawerMove, { capture: true, passive: false });
        moveBound = true;
      };
      const unbindDrawerMove = () => {
        if (!moveBound) return;
        document.removeEventListener('touchmove', onDrawerMove, { capture: true });
        moveBound = false;
      };

      document.addEventListener('touchstart', (e) => {
        if (!isMobile() || e.touches.length !== 1) return;
        const t = e.target;
        if (!t) return;
        if (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT') return;
        if (t.closest && t.closest('button')) return;
        if (t.closest && t.closest('[contenteditable]:not([contenteditable="false"])')) return;
        startOpen = !!document.body.dataset.drawerOpen;
        const x = e.touches[0].clientX;
        // open-from-anywhere — 본문 어디서나 우스와이프로 열기 (지오 요구 2026-06-13). 엣지 한정
        // 게이트 제거. 세로/방향 게이트(onDrawerMove) + #mainView touch-action:pan-y 가
        // 오작동·세로스크롤 회귀를 막는다. 닫기와 동일하게 어디서든 손가락 1:1 추적.
        sx = x; sxOrig = x; sy = e.touches[0].clientY; t0 = Date.now();
        decided = false; swiping = false;
        panelW = sidebar.getBoundingClientRect().width || (window.innerWidth * 0.85);
        bindDrawerMove(); // 드래그 후보 확정 — 이 제스처 동안만 non-passive touchmove 활성
      }, { capture: true, passive: true });

      document.addEventListener('touchend', (e) => {
        unbindDrawerMove();
        if (!swiping || !panelW) { swiping = false; decided = false; panelW = 0; return; }
        // snap 판정은 원래 touchstart 기준(sxOrig)으로 — 시각추적용 sx 는 결정점으로 재기준돼
        // 있어, 그걸로 재면 데드존 거리가 빠져 짧고 빠른 플릭이 spring-back 되던 회귀(리뷰 blocker).
        const dx = e.changedTouches[0].clientX - sxOrig;
        const elapsed = Date.now() - t0;
        const velocity = elapsed > 0 ? Math.abs(dx) / elapsed : 0;
        const pct = Math.abs(dx) / panelW;
        const passed = pct > SNAP_RATIO || (velocity > VEL_TH && pct > VEL_RATIO);
        const targetOpen = startOpen ? !passed : passed;
        snapTo(targetOpen, velocity);
        swiping = false; decided = false; panelW = 0;
      }, { capture: true, passive: true });

      document.addEventListener('touchcancel', () => {
        unbindDrawerMove();
        if (swiping) snapTo(startOpen, 0);
        swiping = false; decided = false; panelW = 0;
      }, { capture: true, passive: true });
    })();
  })();
</script>

</body>
</html>
