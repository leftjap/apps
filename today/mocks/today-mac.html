    /* 카드사 SMS 파싱 — 금액/일시/지출처/카드사 추출 (best-effort) */
    async function pasteExpenseSMS() {
      let raw = '';
      try {
        if (navigator.clipboard && navigator.clipboard.readText) {
          raw = await navigator.clipboard.readText();
        }
      } catch (_) {}
      if (!raw) {
        raw = window.prompt('카드사 문자를 붙여넣으세요', '') || '';
      }
      if (!raw.trim()) return;
      const parsed = _parseExpenseSMS(raw);
      if (parsed.amount != null) {
        const a = document.getElementById('expModalAmount');
        if (a) a.value = parsed.amount.toLocaleString();
      }
      if (parsed.date) _setExpModalDt(parsed.date);
      if (parsed.merchant) {
        const m = document.getElementById('expModalMerchant');
        if (m) m.value = parsed.merchant;
      }
      if (parsed.card) {
        const opt = Array.from(document.querySelectorAll('#expCardPopover .exp-card-option')).find(o => o.textContent.includes(parsed.card));
        if (opt) pickExpCard(opt.getAttribute('data-card') || opt.textContent.trim());
      }
      _expModalDirty = true;
    }
    function _parseExpenseSMS(s) {
      const out = { amount: null, date: null, merchant: '', card: '' };
      const amt = s.match(/([\d,]{2,})\s*원/);
      if (amt) {
        const n = parseInt(amt[1].replace(/,/g, ''), 10);
        if (!isNaN(n)) out.amount = n;
      }
      const dt = s.match(/(\d{1,2})\/(\d{1,2})[^\d]+(\d{1,2}):(\d{2})/);
      const now = new Date();
      if (dt) {
        const d = new Date(now.getFullYear(), parseInt(dt[1],10)-1, parseInt(dt[2],10), parseInt(dt[3],10), parseInt(dt[4],10));
        if (d > now) d.setFullYear(d.getFullYear() - 1);
        out.date = d;
      } else {
        const tm = s.match(/(\d{1,2}):(\d{2})/);
        if (tm) {
          const d = new Date(now);
          d.setHours(parseInt(tm[1],10), parseInt(tm[2],10), 0, 0);
          out.date = d;
        }
      }
      const cardKw = s.match(/(KB국민|국민|삼성|현대|신한|롯데|하나|우리|BC|NH농협|농협)/);
      if (cardKw) out.card = cardKw[1];
      const tail = s.split(/[\r\n]+/).map(x=>x.trim()).filter(Boolean);
      const lastLine = tail[tail.length-1] || '';
      const tokens = lastLine.split(/\s+/);
      const last = tokens[tokens.length-1] || '';
      if (last && !/원$|일시불|할부|승인|취소|\d{1,2}:\d{2}|\d{1,2}\/\d{1,2}/.test(last)) {
        out.merchant = last;
      } else if (tokens.length >= 2) {
        const second = tokens[tokens.length-2];
        if (second && !/원$|승인|일시불|할부/.test(second)) out.merchant = second;
      }
      return out;
    }

    function _resetExpModal() {
      _expModalMode = 'new';
      _expModalEditId = null;
      _expModalDirty = false;
      _expModalSelectedCat = null;
      ['expModalAmount','expModalDatetime','expModalMerchant','expModalCard','expModalMemo','expModalUrl'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
      });
      document.querySelectorAll('#expModalCatGrid .exp-cat-cell').forEach(c => c.classList.remove('is-active'));
      document.querySelectorAll('#expModalOverlay .exp-field').forEach(f => f.classList.remove('is-readonly'));
      const m = document.querySelector('#expModalOverlay .exp-modal');
      if (m) {
        m.setAttribute('data-card-open', 'false');
        m.setAttribute('data-date-open', 'false');
      }
      const cardLabel = document.getElementById('expModalCardLabel');
      if (cardLabel) cardLabel.textContent = _getLastUsedCard() || '선택 안 함';
      const cardHidden = document.getElementById('expModalCard');
      if (cardHidden) cardHidden.value = _getLastUsedCard() || '';
      const dtText = document.getElementById('expModalDtText');
      if (dtText) dtText.textContent = '—';
      const dBtn = document.getElementById('expModalDeleteBtn');
      if (dBtn) dBtn.style.display = 'none';
      const title = document.getElementById('expModalTitle');
      if (title) title.textContent = '지출 입력';
    }

    function openExpenseModal(mode = 'new', txId = null) {
      _resetExpModal();
      _expModalMode = mode;
      _expModalEditId = txId;

      if (mode === 'edit' && txId) {
        const tx = FIXTURE.expense.txns.find(t => t.id === txId);
        if (!tx) return;
        document.getElementById('expModalTitle').textContent = '지출 수정';
        document.getElementById('expModalDeleteBtn').style.display = '';

        document.getElementById('expModalAmount').value = (tx.amount || 0).toLocaleString();
        const year = FIXTURE.expense.year || 2026;
        const [mm, dd] = tx.date.split('-');
        const time = tx.time || '12:00';
        const dt = new Date(`${year}-${mm}-${dd}T${time}`);
        _setExpModalDt(dt);
        document.getElementById('expModalMerchant').value = tx.brand || tx.memo || '';
        if (tx.card) pickExpCard(tx.card);
        document.getElementById('expModalMemo').value = tx.memo || '';
        document.getElementById('expModalUrl').value = tx.merchant_url || '';

        if (tx.category) {
          _expModalSelectedCat = tx.category;
          const cell = document.querySelector(`#expModalCatGrid .exp-cat-cell[data-cat="${tx.category}"]`);
          if (cell) cell.classList.add('is-active');
          _ensureCatVisible(tx.category);
        }

        ['amount', 'datetime', 'merchant', 'card', 'category'].forEach(name => {
          const f = document.querySelector(`#expModalOverlay .exp-field[data-field="${name}"]`);
          if (f) f.classList.add('is-readonly');
        });
        _expModalDirty = false;
      } else {
        _setExpModalDt(new Date());
        _expModalDirty = false;
      }

      const overlay = document.getElementById('expModalOverlay');
      overlay.classList.add('is-open');
      overlay.setAttribute('aria-hidden', 'false');

      setTimeout(() => {
        if (mode === 'new') {
          const amt = document.getElementById('expModalAmount');
          if (amt) amt.focus();
        }
      }, 100);
    }

    function _doCloseExpenseModal() {
      const overlay = document.getElementById('expModalOverlay');
      overlay.classList.remove('is-open');
      overlay.setAttribute('aria-hidden', 'true');
      setTimeout(() => _resetExpModal(), 220);
    }

    function closeExpenseModal() {
      if (_expModalDirty) {
        _expModalPendingClose = true;
        showExpConfirm('입력 중인 내용을 버립니다.<br>계속하시겠습니까?');
      } else {
        _doCloseExpenseModal();
      }
    }

    function saveExpenseFromModal() {
      const amount = parseInt(document.getElementById('expModalAmount').value.replace(/[^\d]/g, ''), 10) || 0;
      const datetime = document.getElementById('expModalDatetime').value;
      const merchant = document.getElementById('expModalMerchant').value.trim();
      const card = document.getElementById('expModalCard').value;
      const memo = document.getElementById('expModalMemo').value.trim();
      const url = document.getElementById('expModalUrl').value.trim();
      const category = _expModalSelectedCat;

      if (!amount) { alert('금액을 입력해주세요.'); document.getElementById('expModalAmount').focus(); return; }
      if (!datetime) { alert('일시를 선택해주세요.'); return; }
      if (!merchant) { alert('지출처를 입력해주세요.'); document.getElementById('expModalMerchant').focus(); return; }
      if (!category) { alert('카테고리를 선택해주세요.'); return; }

      const [datePart, timePart] = datetime.split('T');
      const [yy, mm, dd] = datePart.split('-');
      const date = `${mm}-${dd}`;

      if (_expModalMode === 'edit' && _expModalEditId) {
        const tx = FIXTURE.expense.txns.find(t => t.id === _expModalEditId);
        if (tx) {
          tx.category = category;
          tx.memo = memo;
          tx.merchant_url = url;
        }
      } else {
        const newTx = {
          id: 'tx-m-' + Date.now().toString(36),
          date: date,
          time: timePart,
          category: category,
          memo: memo || merchant,
          amount: amount,
          brand: merchant,
          card: card || undefined,
          merchant_url: url || undefined,
          source: 'manual'
        };
        FIXTURE.expense.txns.push(newTx);
      }

      _expModalDirty = false;
      _doCloseExpenseModal();
      if (typeof renderExpense === 'function') renderExpense();
    }

    function deleteExpenseFromModal() {
      if (!_expModalEditId) return;
      showExpConfirm('이 거래를 삭제합니다.<br>되돌릴 수 없습니다.', () => {
        const idx = FIXTURE.expense.txns.findIndex(t => t.id === _expModalEditId);
        if (idx >= 0) FIXTURE.expense.txns.splice(idx, 1);
        _expModalDirty = false;
        hideExpConfirm();
        _doCloseExpenseModal();
        if (typeof renderExpense === 'function') renderExpense();
      });
    }

    function showExpConfirm(msg, onOk) {
      document.getElementById('expConfirmMsg').innerHTML = msg;
      _expConfirmCallback = onOk || null;
      const ov = document.getElementById('expConfirmOverlay');
      ov.classList.add('is-open');
      ov.setAttribute('aria-hidden', 'false');
    }

    function hideExpConfirm() {
      const ov = document.getElementById('expConfirmOverlay');
      ov.classList.remove('is-open');
      ov.setAttribute('aria-hidden', 'true');
      _expConfirmCallback = null;
      _expModalPendingClose = false;
    }

    function confirmExpDiscard() {
      if (_expConfirmCallback) {
        _expConfirmCallback();
        return;
      }
      if (_expModalPendingClose) {
        _expModalPendingClose = false;
        _expModalDirty = false;
        hideExpConfirm();
        _doCloseExpenseModal();
      } else {
        hideExpConfirm();
      }
    }

    function _attachExpModalDirty() {
      const modal = document.querySelector('#expModalOverlay .exp-modal');
      if (!modal) return;
      modal.addEventListener('input', (e) => {
        if (e.target.matches('input, select')) _expModalDirty = true;
      });
      modal.addEventListener('change', (e) => {
        if (e.target.matches('input, select')) _expModalDirty = true;
      });
    }

    function _attachExpModalBackdrop() {
      const overlay = document.getElementById('expModalOverlay');
      if (!overlay) return;
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeExpenseModal();
      });
    }

    function _attachExpModalEsc() {
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        const confirmOpen = document.getElementById('expConfirmOverlay').classList.contains('is-open');
        const modalOpen = document.getElementById('expModalOverlay').classList.contains('is-open');
        if (confirmOpen) {
          hideExpConfirm();
          return;
        }
        if (modalOpen) closeExpenseModal();
      });
    }

    window.openExpenseModal = openExpenseModal;
    window.closeExpenseModal = closeExpenseModal;
    window.saveExpenseFromModal = saveExpenseFromModal;
    window.deleteExpenseFromModal = deleteExpenseFromModal;
    window.selectExpModalCat = selectExpModalCat;
    window.toggleExpModalCatGrid = toggleExpModalCatGrid;
    window.openExpDatePopover = openExpDatePopover;
    window.shiftExpDateMonth = shiftExpDateMonth;
    window.pickExpDate = pickExpDate;
    window.setExpDatePopoverToday = setExpDatePopoverToday;
    window.openExpCardPopover = openExpCardPopover;
    window.pickExpCard = pickExpCard;
    window.pasteExpenseSMS = pasteExpenseSMS;
    window.hideExpConfirm = hideExpConfirm;
    window.confirmExpDiscard = confirmExpDiscard;

    // ═══ Spotlight (⌘K) 검색 ═══
    let _spotlightActive = -1;
    let _spotlightItems = [];

    function _spotlightIcon(kind) {
      const icons = {
        doc: '<path d="M3 2h7l3 3v9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/><path d="M10 2v3h3M5 8h6M5 11h4"/>',
        expense: '<rect x="2" y="4" width="12" height="9" rx="1.5"/><path d="M2 7h12M5 10h2"/>',
        action: '<circle cx="8" cy="8" r="6"/><path d="M8 5v3l2 1.5"/>',
      };
      return `<svg class="spotlight-item__ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">${icons[kind] || icons.action}</svg>`;
    }

    function _highlight(text, q) {
      if (!q) return text;
      const i = text.toLowerCase().indexOf(q.toLowerCase());
      if (i < 0) return text;
      return text.slice(0, i) + '<mark>' + text.slice(i, i + q.length) + '</mark>' + text.slice(i + q.length);
    }

    function _spotlightCollectDocs() {
      const groups = ['navi', 'fiction', 'blog', 'memo'];
      const out = [];
      groups.forEach(g => {
        const cat = FIXTURE[g];
        if (!cat || !cat.docs) return;
        cat.docs.forEach(d => {
          out.push({
            kind: 'doc',
            categoryKey: g,
            categoryLabel: cat.label,
            id: d.id,
            title: d.title,
            body: (d.body || []).map(b => b.text || '').join(' '),
          });
        });
      });
      return out;
    }

    function _spotlightCollectTxns() {
      const txns = (FIXTURE.expense && FIXTURE.expense.txns) || [];
      return txns.map(t => ({
        kind: 'expense',
        id: t.id,
        title: t.brand || t.memo || '거래',
        category: t.category,
        date: t.date,
        amount: t.amount,
      }));
    }

    function _spotlightActions() {
      return [
        { kind: 'action', id: 'act-new-expense', title: '지출 입력', meta: '새 거래 추가', run: () => { closeSpotlight(); setTimeout(() => openExpenseModal('new'), 80); } },
        { kind: 'action', id: 'act-go-expense', title: '가계부 열기', meta: '월간 통계 + 거래 피드', run: () => { closeSpotlight(); _spotlightGoCategory('expense'); } },
        { kind: 'action', id: 'act-go-navi', title: '오늘의 네비', meta: '오늘 항해 글', run: () => { closeSpotlight(); _spotlightGoCategory('navi'); } },
      ];
    }

    function _spotlightGoCategory(key) {
      const items = [...document.querySelectorAll('.sb__item[data-category]')];
      const target = items.find(i => i.getAttribute('data-category') === key);
      if (target) target.click();
    }

    function _spotlightOpenItem(item) {
      if (item.kind === 'action' && typeof item.run === 'function') {
        item.run();
        return;
      }
      if (item.kind === 'doc') {
        closeSpotlight();
        setTimeout(() => _spotlightGoCategory(item.categoryKey), 80);
        return;
      }
      if (item.kind === 'expense') {
        closeSpotlight();
        setTimeout(() => openExpenseModal('edit', item.id), 80);
      }
    }

    function _spotlightRender(q) {
      const body = document.getElementById('spotlightBody');
      if (!body) return;
      _spotlightItems = [];
      const ql = q.trim().toLowerCase();
      const matchesQ = (s) => !ql || (s || '').toLowerCase().includes(ql);

      const collectDocs = (window._spotlightCollectDocs || _spotlightCollectDocs);
      const collectTxns = (window._spotlightCollectTxns || _spotlightCollectTxns);
      const docs = collectDocs().filter(d => matchesQ(d.title) || matchesQ(d.body));
      const txns = collectTxns().filter(t => matchesQ(t.title) || matchesQ(t.category) || matchesQ(t.date));
      const actions = _spotlightActions().filter(a => !ql || matchesQ(a.title) || matchesQ(a.meta));

      if (!ql) {
        // 빈 입력 — 빠른 액션 + 최근 글 3건
        const recentDocs = collectDocs().slice(0, 3);
        _spotlightItems = [...actions, ...recentDocs];
      } else {
        _spotlightItems = [...actions, ...docs, ...txns];
      }

      if (_spotlightItems.length === 0) {
        body.innerHTML = `<div class="spotlight-empty">"${q}" 와 일치하는 결과가 없습니다<div class="spotlight-empty__sub">글 제목·본문, 거래 메모·카테고리, 명령어로 검색하세요</div></div>`;
        _spotlightActive = -1;
        return;
      }

      let html = '';
      const groupedActions = _spotlightItems.filter(i => i.kind === 'action');
      const groupedDocs = _spotlightItems.filter(i => i.kind === 'doc');
      const groupedTxns = _spotlightItems.filter(i => i.kind === 'expense');
      let idx = 0;
      const renderItem = (item) => {
        const i = idx++;
        const titleHtml = _highlight(item.title, ql);
        let metaHtml = '';
        let amountHtml = '';
        if (item.kind === 'doc') metaHtml = `<div class="spotlight-item__meta">${item.categoryLabel}</div>`;
        else if (item.kind === 'expense') {
          const [m, d] = (item.date || '').split('-');
          metaHtml = `<div class="spotlight-item__meta">${item.category} · ${m}월 ${parseInt(d,10)}일</div>`;
          amountHtml = `<span class="spotlight-item__amount">${formatAmount(item.amount)}</span>`;
        } else if (item.kind === 'action') metaHtml = `<div class="spotlight-item__meta">${item.meta}</div>`;
        return `
          <div class="spotlight-item" data-idx="${i}" onclick="_spotlightClick(${i})">
            ${_spotlightIcon(item.kind)}
            <div class="spotlight-item__main">
              <div class="spotlight-item__title">${titleHtml}</div>
              ${metaHtml}
            </div>
            ${amountHtml}
          </div>
        `;
      };
      if (groupedActions.length) {
        html += `<div class="spotlight-group"><div class="spotlight-group__label">${ql ? '명령어' : '빠른 액션'}</div>${groupedActions.map(renderItem).join('')}</div>`;
      }
      if (groupedDocs.length) {
        html += `<div class="spotlight-group"><div class="spotlight-group__label">${ql ? '글' : '최근 글'}</div>${groupedDocs.map(renderItem).join('')}</div>`;
      }
      if (groupedTxns.length) {
        html += `<div class="spotlight-group"><div class="spotlight-group__label">거래</div>${groupedTxns.map(renderItem).join('')}</div>`;
      }
      body.innerHTML = html;

      _spotlightActive = 0;
      _spotlightSyncActive();
    }

    function _spotlightSyncActive() {
      const cells = document.querySelectorAll('#spotlightBody .spotlight-item');
      cells.forEach((c, i) => c.classList.toggle('is-active', i === _spotlightActive));
      const active = cells[_spotlightActive];
      if (active) active.scrollIntoView({ block: 'nearest' });
    }

    function _spotlightClick(idx) {
      _spotlightActive = idx;
      const item = _spotlightItems[idx];
      if (item) (window._spotlightOpenItem || _spotlightOpenItem)(item);
    }

    function openSpotlight() {
      const overlay = document.getElementById('spotlightOverlay');
      const input = document.getElementById('spotlightInput');
      if (!overlay) return;
      overlay.classList.add('is-open');
      overlay.setAttribute('aria-hidden', 'false');
      if (input) {
        input.value = '';
        setTimeout(() => input.focus(), 30);
      }
      _spotlightRender('');
    }
    function closeSpotlight() {
      const overlay = document.getElementById('spotlightOverlay');
      if (!overlay) return;
      overlay.classList.remove('is-open');
      overlay.setAttribute('aria-hidden', 'true');
    }

    function _initSpotlight() {
      const overlay = document.getElementById('spotlightOverlay');
      const input = document.getElementById('spotlightInput');
      if (!overlay || !input) return;
      input.addEventListener('input', (e) => _spotlightRender(e.target.value));
      overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSpotlight(); });
      document.addEventListener('keydown', (e) => {
        // ⌘K / Ctrl+K → 토글
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          if (overlay.classList.contains('is-open')) closeSpotlight();
          else openSpotlight();
          return;
        }
        if (!overlay.classList.contains('is-open')) return;
        if (e.key === 'Escape') { e.preventDefault(); closeSpotlight(); return; }
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (_spotlightItems.length === 0) return;
          _spotlightActive = (_spotlightActive + 1) % _spotlightItems.length;
          _spotlightSyncActive();
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (_spotlightItems.length === 0) return;
          _spotlightActive = (_spotlightActive - 1 + _spotlightItems.length) % _spotlightItems.length;
          _spotlightSyncActive();
        } else if (e.key === 'Enter') {
          e.preventDefault();
          const item = _spotlightItems[_spotlightActive];
          if (item) (window._spotlightOpenItem || _spotlightOpenItem)(item);
        }
      });
    }

    window.openSpotlight = openSpotlight;
    window.closeSpotlight = closeSpotlight;
    window._spotlightClick = _spotlightClick;
    window._spotlightCollectDocs = _spotlightCollectDocs;
    window._spotlightCollectTxns = _spotlightCollectTxns;
    window._spotlightOpenItem = _spotlightOpenItem;
    window._spotlightGoCategory = _spotlightGoCategory;

    // Init — navi 카테고리 진입
    setCategory('navi');

    // Init — 가계부 모달 (모달 DOM 은 이 script 다음에 위치 → parse 완료 후 init)
    function _initExpModal() {
      buildExpModalCatGrid();
      _attachExpModalDirty();
      _attachExpModalBackdrop();
      _attachExpModalEsc();
      document.querySelectorAll('#expCardPopover .exp-card-option').forEach(o => {
        o.addEventListener('click', () => pickExpCard(o.getAttribute('data-card') || ''));
      });
      const hour = document.getElementById('expDateHour');
      const min = document.getElementById('expDateMin');
      if (hour) hour.addEventListener('input', _onExpDateTimeChange);
      if (min) min.addEventListener('input', _onExpDateTimeChange);
      document.addEventListener('click', (e) => {
        const m = document.querySelector('#expModalOverlay .exp-modal');
        if (!m) return;
        if (m.getAttribute('data-card-open') === 'true') {
          if (!e.target.closest('#expCardPopover') && !e.target.closest('#expModalCardTrigger')) closeExpCardPopover();
        }
        if (m.getAttribute('data-date-open') === 'true') {
          if (!e.target.closest('#expDatePopover') && !e.target.closest('#expModalDtTrigger')) closeExpDatePopover();
        }
      });
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => { _initExpModal(); _initSpotlight(); });
    } else {
      _initExpModal();
      _initSpotlight();
    }
  })();
</script>

<div id="expDayPopoverOverlay" class="exp-day-popover-overlay" aria-hidden="true"></div>

<div class="drawer-backdrop" id="drawerBackdrop" aria-hidden="true"></div>

<button class="t-fab" id="tFab" type="button" data-action="new-doc" aria-label="새로 만들기" title="새로 만들기">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round">
    <path d="M12 5v14M5 12h14"/>
  </svg>
</button>

<script>
  // 반응형 — 모바일(768↓) drawer + 태블릿(769–1024) 사이드바 collapse 자동 동기화. DESIGN.md §4.
  (function(){
    const MOBILE_MAX = 768;
    const TABLET_MAX = 1024;
    const isMobile = () => window.matchMedia('(max-width: ' + MOBILE_MAX + 'px)').matches;
    const isTablet = () => window.matchMedia('(min-width: ' + (MOBILE_MAX + 1) + 'px) and (max-width: ' + TABLET_MAX + 'px)').matches;
    // 마커 클래스로 JS-자동 collapse 와 사용자 수동 collapse (#sidebarToggle 클릭) 분리.
    // 태블릿 → 데스크톱 드래그 시 자동 collapse 만 풀고 수동 상태는 보존.
    const syncTabletCollapse = () => {
      const app = document.querySelector('.app');
      if (!app) return;
      if (isTablet()) {
        // 이미 사용자가 데스크톱에서 수동 collapse 했으면 마커 안 붙임 (보존 위해)
        if (!app.classList.contains('is-sidebar-collapsed')) {
          app.classList.add('is-sidebar-collapsed', 'is-sidebar-collapsed--auto');
        }
      } else if (app.classList.contains('is-sidebar-collapsed--auto')) {
        app.classList.remove('is-sidebar-collapsed', 'is-sidebar-collapsed--auto');
      }
    };
    syncTabletCollapse();
    window.addEventListener('resize', syncTabletCollapse);
    const setOpen = (open) => {
      if (open) document.body.dataset.drawerOpen = 'true';
      else delete document.body.dataset.drawerOpen;
    };
    // 진입 시 모바일이면 열림 기본
    if (isMobile()) setOpen(true);
    // 햄버거 → 열기
    document.getElementById('mainHamburger')?.addEventListener('click', () => setOpen(true));
    // backdrop 클릭 → 닫기
    document.getElementById('drawerBackdrop')?.addEventListener('click', () => setOpen(false));
    // Esc → 닫기
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && document.body.dataset.drawerOpen) setOpen(false); });
    // 사이드바 항목 클릭 → 닫기 (모바일 한정).
    // 카테고리 탭은 기본적으로 drawer 유지 (recents 목록에서 글 선택해 진입).
    // 단 가계부는 RECENTS 가 진입점이 아니라 메인 캘린더/타임라인이 진입점이므로
    // 카테고리 클릭 자체로 close (recents 의 거래 내역은 미리보기 성격).
    // 실제 글 선택(.sb__item--recent) + "전체 보기"(.sb__recents-more) 도 close.
    document.addEventListener('click', (e) => {
      if (!isMobile()) return;
      const item = e.target.closest('.sb__item--recent, .sb__recents-more, .sb__item[data-category="expense"]');
      if (item) setOpen(false);
    });
    // viewport 폭 변경 시 — 데스크톱으로 넘어가면 drawer 상태 해제
    window.addEventListener('resize', () => { if (!isMobile()) setOpen(false); });

    // ─── Swipe gesture (모바일) — keep gesture.js 패턴 차용
    //  * 본문 좌측 edge(0~24px) → 우 swipe = drawer open 1:1 추적
    //  * drawer/backdrop → 좌 swipe = drawer close 1:1 추적
    //  * 결정 임계 6px, dy>dx*1.2 면 수직 스크롤 양보, 임계 통과(40% or vel>0.5+20%) 시 snap, 미달 시 spring back
    (function(){
      const sidebar = document.querySelector('.sidebar');
      const main = document.querySelector('.main');
      const backdrop = document.getElementById('drawerBackdrop');
      if (!sidebar || !main) return;

      const EDGE_PX = 24;
      const DECIDE_PX = 6;
      const ANGLE = 1.2;
      const SNAP_RATIO = 0.4;
      const VEL_RATIO = 0.2;
      const VEL_TH = 0.5;
      const CURVE = 'cubic-bezier(.25,.46,.45,.94)';

      let sx = 0, sy = 0, t0 = 0, decided = false, swiping = false;
      let startOpen = false, panelW = 0, mainShift = 0;

      const setTrack = (progress) => {
        const p = Math.max(0, Math.min(1, progress));
        sidebar.style.transition = 'none';
        sidebar.style.transform = 'translate3d(' + (-panelW * (1 - p)) + 'px,0,0)';
        main.style.transition = 'none';
        main.style.transform = 'translate3d(' + (mainShift * p) + 'px,0,0)';
        if (backdrop) {
          backdrop.style.transition = 'none';
          backdrop.style.opacity = String(p);
          backdrop.style.pointerEvents = p > 0.05 ? 'auto' : 'none';
        }
      };

      const snapTo = (open, velocity) => {
        const dur = velocity > VEL_TH ? 0.22 : 0.32;
        const T = 'transform ' + dur + 's ' + CURVE;
        sidebar.style.transition = T;
        main.style.transition = T;
        if (backdrop) backdrop.style.transition = 'opacity ' + dur + 's ' + CURVE;
        setOpen(open);
        const clean = () => {
          sidebar.style.transform = '';
          main.style.transform = '';
          if (backdrop) { backdrop.style.opacity = ''; backdrop.style.pointerEvents = ''; }
        };
        requestAnimationFrame(clean);
        setTimeout(clean, 32); // raf 누락 환경 fallback
        setTimeout(() => {
          sidebar.style.transition = '';
          main.style.transition = '';
          if (backdrop) backdrop.style.transition = '';
        }, dur * 1000 + 60);
      };

      document.addEventListener('touchstart', (e) => {
        if (!isMobile() || e.touches.length !== 1) return;
        const t = e.target;
        if (!t) return;
        if (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT') return;
        if (t.closest && t.closest('button')) return;
        if (t.closest && t.closest('[contenteditable]:not([contenteditable="false"])')) return;
        startOpen = !!document.body.dataset.drawerOpen;
        const x = e.touches[0].clientX;
        // edge swipe 만 — closed 일 때 좌측 edge 안에서만 시작
        if (!startOpen && x > EDGE_PX) return;
        sx = x; sy = e.touches[0].clientY; t0 = Date.now();
        decided = false; swiping = false;
        panelW = sidebar.getBoundingClientRect().width || (window.innerWidth * 0.85);
        mainShift = window.innerWidth - 72;
      }, { capture: true, passive: true });

      document.addEventListener('touchmove', (e) => {
        if (!isMobile() || e.touches.length !== 1 || !panelW) return;
        const dx = e.touches[0].clientX - sx;
        const dy = e.touches[0].clientY - sy;
        if (!decided) {
          if (Math.abs(dx) < DECIDE_PX && Math.abs(dy) < DECIDE_PX) return;
          decided = true;
          if (Math.abs(dy) > Math.abs(dx) * ANGLE) { panelW = 0; return; }
          const dir = dx > 0 ? 'right' : 'left';
          // closed → 우 swipe(open), open → 좌 swipe(close) 만 유효
          if ((!startOpen && dir !== 'right') || (startOpen && dir !== 'left')) { panelW = 0; return; }
          swiping = true;
        }
        if (!swiping) return;
        if (e.cancelable) e.preventDefault();
        const progress = startOpen ? 1 + dx / panelW : dx / panelW;
        setTrack(progress);
      }, { capture: true, passive: false });

      document.addEventListener('touchend', (e) => {
        if (!swiping || !panelW) { swiping = false; decided = false; panelW = 0; return; }
        const dx = e.changedTouches[0].clientX - sx;
        const elapsed = Date.now() - t0;
        const velocity = elapsed > 0 ? Math.abs(dx) / elapsed : 0;
        const pct = Math.abs(dx) / panelW;
        const passed = pct > SNAP_RATIO || (velocity > VEL_TH && pct > VEL_RATIO);
        const targetOpen = startOpen ? !passed : passed;
        snapTo(targetOpen, velocity);
        swiping = false; decided = false; panelW = 0;
      }, { capture: true, passive: true });

      document.addEventListener('touchcancel', () => {
        if (swiping) snapTo(startOpen, 0);
        swiping = false; decided = false; panelW = 0;
      }, { capture: true, passive: true });
    })();
  })();
</script>
