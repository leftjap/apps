<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Today — 오늘의 글쓰기</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
<style>
  /* ===========================================================
     Today — 개인 글쓰기 대시보드
     시안 D · 사이드바 #fff / shell #fdfdfd · 차이 2/255
     Accent — Crail #d97757
     =========================================================== */

  :root {
    --font-sans: "Pretendard", "Inter", system-ui, -apple-system, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;

    --tone-255: rgb(255, 255, 255);
    --tone-253: rgb(253, 253, 253);
    --tone-243: rgb(243, 243, 243);

    --shell:    var(--tone-253);
    --sidebar:  var(--tone-255);
    --hover-bg: var(--tone-243);

    --sunken:    oklch(97.6% 0.006 60);
    --line:      oklch(92.0% 0.006 60);
    --line-soft: oklch(94.5% 0.006 60);

    --ink-1: oklch(22% 0.008 60);
    --ink-2: oklch(38% 0.008 60);
    --ink-3: oklch(56% 0.008 60);
    --ink-4: oklch(72% 0.006 60);

    --black: #000;
    --crail-soft: oklch(85% 0.05 50);
    --crail-base: #d97757;
    --crail-deep: oklch(48% 0.14 50);
    --cloudy-soft: oklch(88% 0.04 240);
    --cloudy-base: oklch(65% 0.08 240);
    --cloudy-deep: oklch(42% 0.12 240);

    --warning: #c98a3f;
    --danger:  #c5544a;

    --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
    --sp-5: 24px; --sp-6: 32px; --sp-7: 48px; --sp-8: 64px;

    --r-sm: 8px;
    --r-md: 12px;
    --r-lg: 18px;
    --r-xl: 24px;

    --shadow-float:
      0 1px 0 rgba(20, 18, 14, 0.02),
      0 6px 14px -8px rgba(20, 18, 14, 0.08),
      0 24px 48px -24px rgba(20, 18, 14, 0.18);

    --shadow-pop:
      0 1px 0 rgba(20, 18, 14, 0.03),
      0 8px 16px -10px rgba(20, 18, 14, 0.18),
      0 24px 48px -24px rgba(20, 18, 14, 0.24);

    --shadow-inset-soft:
      0 4px 12px -8px rgba(20, 18, 14, 0.08);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    /* iOS: body 자체 스크롤 차단 → rubber-band 바운스 + 툴바 토글 점프 제거.
       스크롤은 #mainView 가 전담. '화면 딱 고정' 요구 (2026-05-31). */
    overflow: hidden;
    overscroll-behavior: none;
    font-family: var(--font-sans);
    color: var(--ink-1);
    background: var(--shell);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: "ss01", "tnum";   /* 숫자 tabular — 금액·날짜 자릿수 정렬 (작업지시서 §1) */
    word-break: keep-all;                     /* 한글 글자단위 줄바꿈 방지 — 어절 단위로만 끊김 */
    overflow-wrap: break-word;                /* 긴 영문/URL 등 끊을 수 없는 토큰만 강제 줄바꿈 */
  }

  /* ============ App shell ============ */
  .app {
    /* 100dvh — iOS dynamic toolbar 접힘/펼침에도 정확 viewport (100vh 는 툴바 영역 포함해 점프 유발) */
    height: 100dvh;
    display: flex;
    background: var(--shell);
  }

  /* ============ Sidebar ============ */
  .sidebar {
    width: 252px;
    margin: 16px 0 16px 16px;
    background: var(--sidebar);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-float);
    /* 상단 행 수직 중심 y=47 — margin 16 + border 1 + pad 14 + 행 32/2 (작업지시서 §3.7) */
    padding: 14px 12px 12px;
    display: flex;
    flex-direction: column;
    font-size: 15px;
    flex-shrink: 0;
    transition: width .2s ease, padding .2s ease;
  }

  /* 사이드바 접힘 토글 — chevron rotate */
  .sidebar-toggle-ico { transition: transform .2s ease; }
  .app.is-sidebar-collapsed .sidebar-toggle-ico { transform: rotate(180deg); }

  /* 사이드바 접힘 상태 — 60px 아이콘 레일 */
  .app.is-sidebar-collapsed .sidebar {
    width: 60px;
    padding: 14px 8px 12px;
  }
  .app.is-sidebar-collapsed .sb__top {
    flex-direction: column;
    align-items: center;
    gap: 6px;
    height: auto;
    padding: 4px 0 14px 0;
    margin-bottom: 4px;
  }
  .app.is-sidebar-collapsed .sb__brand,
  .app.is-sidebar-collapsed .sb__icon-btn:not(#sidebarToggle) { display: none; }
  .app.is-sidebar-collapsed #sidebarToggle {
    width: 36px;
    height: 36px;
    border-radius: 7px;
  }
  .app.is-sidebar-collapsed .sb__item {
    font-size: 0;
    justify-content: center;
    padding: 0;
    width: 36px;
    height: 36px;
    margin: 0 auto 2px;
    border-radius: 7px;
    gap: 0;
  }
  .app.is-sidebar-collapsed .sb__item .meta,
  .app.is-sidebar-collapsed .sb__item .recent-share { display: none; }
  .app.is-sidebar-collapsed .sb__group:has(.sb__item--recent) { display: none; }
  .app.is-sidebar-collapsed .sb__footer { justify-content: center; }
  .app.is-sidebar-collapsed .sb__user-info { display: none; }
  .app.is-sidebar-collapsed .sb__settings-wrap { width: 36px; }
  .app.is-sidebar-collapsed .sb__user {
    padding: 0;
    width: 36px;
    height: 36px;
    min-width: 36px;
    margin: 0 auto;
    justify-content: center;
    border-radius: 7px;
  }
  .app.is-sidebar-collapsed .sb__avatar {
    width: 24px;
    height: 24px;
    font-size: 11px;
  }
  .app.is-sidebar-collapsed .sb__menu {
    left: 100%;
    bottom: 0;
    margin-left: 6px;
  }

  /* — Brand row + icon buttons — 높이 32 고정 (수직 중심 y=47, 작업지시서 §3.7) */
  .sb__top {
    display: flex; align-items: center;
    gap: 4px;
    height: 32px;
    padding: 0 6px;
    margin-bottom: 16px;
  }
  .sb__brand {
    display: flex; align-items: center; gap: 10px;
    flex: 1; min-width: 0;
  }
  .sb__logo {
    width: 22px; height: 22px;
    border-radius: 6px;
    background: var(--crail-base);
    display: grid; place-items: center;
    color: #fff;
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 11px;
    flex-shrink: 0;
    letter-spacing: -0.02em;
  }
  .sb__name {
    font-weight: 600;
    letter-spacing: -0.01em;
    font-size: 18px;
  }
  .sb__icon-btn {
    width: 28px; height: 28px;
    border-radius: 7px;
    border: 0;
    background: transparent;
    /* alert-dot (absolute) 가 있어도 svg 가 정중앙에 오도록 single cell 강제 */
    display: grid; place-items: center;
    grid-template: 1fr / 1fr;
    cursor: pointer;
    color: var(--ink-1);
    flex-shrink: 0;
    position: relative;
  }
  .sb__icon-btn:hover { background: var(--hover-bg); }
  .sb__icon-btn .ico { width: 18px; height: 18px; opacity: 0.75; }

  /* 새 알림 인디케이터 */
  .sb__icon-btn--has-alert .ico { opacity: 1; }
  .sb__icon-btn--has-alert .alert-dot {
    position: absolute;
    top: 4px; right: 4px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--crail-base);
    border: 1.5px solid var(--sidebar);
    animation: dotPulse 2.6s ease-in-out infinite;   /* 안 읽은 알림 펄스 (작업지시서 §3) */
  }
  @keyframes dotPulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: .45; } }
  /* 모션 최소화 선호 시 모든 애니/트랜지션 비활성 (작업지시서 §1·§9) */
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

  /* — Nav groups — */
  .sb__group { margin-bottom: 2px; }
  /* 가계부(유틸리티) 그룹 — 글쓰기 카테고리와 line-soft 구분선으로 위계 분리 (작업지시서 §3) */
  /* 시안 06 — 메모↔가계부 사이 구분선 없음. 구분선은 가계부↔최근 섹션 사이 (.sb__group--recents) */
  .sb__group--util { margin-top: 8px; }

  /* recents 영역만 자체 스크롤 (mouse wheel/trackpad). 스크롤바 시각 0 — 사이드바 룩 일정. */
  .sb__top, .sb__footer { flex-shrink: 0; }
  .sidebar > .sb__group:not(.sb__group--recents) { flex-shrink: 0; }
  .sb__group--recents {
    flex: 1;
    min-height: 0;
    margin-top: 12px;
    margin-bottom: 0;
    overflow-y: auto;
    scrollbar-width: none;
    padding-top: 12px;
    border-top: 1px solid var(--line-soft);   /* 시안 06 — 가계부와 최근 섹션 사이 구분선 */
  }
  .sb__group--recents::-webkit-scrollbar { display: none; }
  /* 최근 섹션 라벨 — 활성 카테고리명 + 우측 건수 (작업지시서 §3.4) */
  .sb__label {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--ink-4);
    padding: 4px 10px 8px;
    white-space: nowrap;
  }
  .sb__label-count {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--ink-4);
  }

  /* 카테고리 행 38px — 활성 = hover-bg + 아이콘만 오렌지 (작업지시서 §3.2) */
  .sb__item {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 38px;
    padding: 0 10px;
    border-radius: 10px;
    font-size: 13.5px;
    font-weight: 500;
    line-height: 1.3;
    color: var(--ink-2);
    cursor: default;
    white-space: nowrap;
  }
  .sb__item .ico {
    width: 17px; height: 17px;
    flex-shrink: 0;
    opacity: 0.85;
    color: var(--ink-3);
  }
  .sb__item:hover { background: var(--hover-bg); }
  .sb__item--active {
    background: var(--hover-bg);
    color: var(--ink-1);
    font-weight: 600;
  }
  .sb__item--active .ico { opacity: 1; color: var(--crail-base); }
  .sb__item[data-category] { cursor: pointer; }
  /* recents 롱프레스 — iOS callout/텍스트 선택/preview 차단해 커스텀 timer (entries.js) 살림 */
  /* 행 높이 38px 은 카테고리 행 한정 — 리센츠 2줄 행은 auto */
  .sb__item--recent {
    height: auto;
    cursor: pointer;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  /* — 가계부 행 우측 당월 총액 — 모노 10.5px (작업지시서 §3.3) -- */
  .sb__item .meta {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 500;
    color: var(--ink-4);
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  .sb__item--active .meta { color: var(--crail-deep); }

  /* Recents — 모두 동일하게 회색 ink-3, 우측에 공유 대상 표시 */
  .sb__item--recent {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 8px;
    color: var(--ink-3);
    font-size: 15px;
  }
  .sb__item--recent:hover { color: var(--ink-1); }
  /* ── 리센츠 — 글 문서 (2줄: 제목 + 차분한 메타) · 작업지시서 §3 ── */
  .sb__item--recent.is-doc { display: block; padding: 9px 8px; }
  .sb__item--recent.is-doc .rc-main { display: flex; align-items: center; gap: 8px; }
  .sb__item--recent.is-doc .rc-title {
    flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 14px; color: var(--ink-2);
  }
  .sb__item--recent.is-doc:hover .rc-title { color: var(--ink-1); }
  /* 안 읽은 댓글 — 숫자/말풍선 대신 작은 크레일 펄스 점 하나 */
  .sb__item--recent.is-doc .rc-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--crail-base); flex-shrink: 0;
    animation: dotPulse 2.6s ease-in-out infinite;
  }
  .sb__item--recent.is-doc .rc-sub {
    margin-top: 3px; font-size: 11px; color: var(--ink-4);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3;
  }
  /* 공유자(소연) — 우측 정렬로 분리 (rc-main 오른쪽, crail-deep). 사용자 요청 */
  /* 공유자 — 텍스트 대신 15px 원형 아바타 (작업지시서 §3.4) */
  .sb__item--recent.is-doc .rc-main .sh {
    margin-left: auto;
    width: 15px; height: 15px;
    border-radius: 50%;
    background: var(--crail-soft);
    color: var(--crail-deep);
    font-size: 8.5px; font-weight: 700;
    display: inline-grid; place-items: center;
    flex-shrink: 0;
    line-height: 1;
  }
  /* 댓글 N → 말풍선 아이콘 + 숫자 (작업지시서 §3.4) */
  .sb__item--recent.is-doc .rc-sub .cm { color: var(--ink-4); display: inline-flex; align-items: center; gap: 3px; }
  .sb__item--recent.is-doc .rc-sub .cm svg { width: 10px; height: 10px; flex-shrink: 0; }
  .sb__item--recent.is-doc .rc-sub .cm.unread { color: var(--crail-base); }
  /* 가계부 리센츠 — 1줄 (내역 + 금액). 금액은 .meta(Pretendard+tnum) — mono 금지 (작업지시서 §1) */
  .sb__item--recent.is-exp { display: flex; align-items: center; gap: 8px; color: var(--ink-2); }
  .sb__item--recent.is-exp .rc-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 1년 전 글 라벨 — '소연'과 동일 사이즈 (11px) */
  .sb__item--recent .recent-share--year {
    margin-left: auto;
    color: var(--ink-4);
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 400;
    letter-spacing: -0.01em;
    flex-shrink: 0;
  }

  /* "전체 보기" — 보더 고스트 버튼 H34, R10, 1px line-soft (작업지시서 §3.5) */
  .sb__more {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    width: 100%; height: 34px; margin-top: 8px;
    flex-shrink: 0; white-space: nowrap;
    background: transparent; border: 1px solid var(--line-soft); cursor: pointer; font-family: inherit;
    padding: 0; border-radius: 10px; color: var(--ink-2); font-size: 12.5px; font-weight: 500;
    transition: background .14s ease, color .14s ease;
  }
  .sb__more:hover { background: var(--hover-bg); color: var(--ink-1); }

  /* — Footer (좌하단 사용자 카드 + popover) — */
  .sb__footer {
    padding: 8px 0 0;
    border-top: 1px solid var(--line-soft);
    margin-top: 6px;
    display: flex;
    justify-content: stretch;
  }
  .sb__settings-wrap { position: relative; width: 100%; }
  /* 빌드 식별자 — 지오가 폰에서 "보는 빌드" 를 읽어 옛 캐시/최신 판별 (값은 app.js 가 주입).
     ID/메타 성격 → mono 11 + ink-4 토큰. 사이드바 collapse 시 숨김. */
  .sb__build {
    font-family: var(--font-mono);
    font-size: 11px; font-weight: 500; line-height: 1.4; letter-spacing: 0.02em;
    color: var(--ink-4); text-align: center;
    padding: var(--sp-1) var(--sp-2) 0;
    user-select: text; -webkit-user-select: text;
  }
  .app.is-sidebar-collapsed .sb__build { display: none; }

  /* 사용자 카드 — Claude 웹 스타일 (아바타 + 이름 + 플랜) */
  .sb__user {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 8px 6px 6px;
    border-radius: 8px;
    cursor: pointer;
    user-select: none;
    background: transparent;
    border: 0;
    width: 100%;
    text-align: left;
    font-family: inherit;
    color: var(--ink-1);
  }
  .sb__user:hover { background: var(--hover-bg); }
  .sb__user.is-open { background: var(--hover-bg); }
  .sb__avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--crail-base);
    color: #fff;
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 14px;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    letter-spacing: -0.02em;
    position: relative;
    overflow: hidden;
  }
  .sb__avatar-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: inherit;
  }
  .sb__user-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    line-height: 1.2;
    overflow: hidden;
  }
  .sb__user-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-1);
    letter-spacing: -0.01em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* 푸터 ⋮ 제거 (작업지시서 §3.6) — 아바타+이름 클릭이 계정 메뉴 진입점 */
  /* 설정 popover 메뉴 */
  .sb__menu {
    position: absolute;
    bottom: calc(100% + 6px);
    left: 0;
    min-width: 180px;
    background: var(--tone-255);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow-pop);
    padding: 6px;
    display: none;
    z-index: 20;
  }
  .sb__menu.is-open { display: block; }
  .sb__menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 9px;
    border-radius: 6px;
    font-size: 14px;
    color: var(--ink-1);
    cursor: pointer;
    line-height: 1.3;
    user-select: none;
  }
  .sb__menu-item:hover { background: var(--hover-bg); }
  .sb__menu-item .ico { width: 13px; height: 13px; opacity: 0.7; flex-shrink: 0; }
  .sb__menu-item .shortcut {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-4);
    letter-spacing: 0.02em;
  }
  .sb__menu-divider {
    height: 1px;
    background: var(--line-soft);
    margin: 4px 4px;
  }
  /* ============ Main ============ */
  .main {
    flex: 1;
    /* 상단 정렬: 탑바 수직 중심 y=47 = pad 16 + 62/2 (작업지시서 §3.7) */
    padding: 16px 32px 24px;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .main__top {
    display: flex; align-items: center; justify-content: space-between;
    height: 62px;
    flex-shrink: 0;
    border-bottom: 1px solid var(--line);
    font-size: 15px;
    gap: 12px;
    min-width: 0;
    flex-wrap: nowrap;
  }
  .crumb {
    display: inline-flex;
    align-items: baseline;
    gap: 8px;
    font-size: 15px;
    color: var(--ink-3);
    white-space: nowrap;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 1;
  }
  .crumb__cat {
    font-family: var(--font-sans);
    font-weight: 500;
    color: var(--ink-2);
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  .crumb__sep {
    color: var(--ink-4);
    font-weight: 300;
    white-space: nowrap;
  }
  .crumb__date {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.02em;
    color: var(--ink-3);
    white-space: nowrap;
  }
  .top-actions { flex-shrink: 0; }
  .share .label,
  .share .target { white-space: nowrap; }
  /* 좁은 화면 — 공유 라벨 숨겨 우측 액션 영역 좁힘 (사용자 시각 손상 방지) */
  @media (max-width: 720px) {
    .share .label { display: none; }
  }
  @media (max-width: 540px) {
    /* 모바일 헤더 단순화 (사용자 요청 2026-05-12):
       햄버거 + "오늘의 네비" + 날짜(월일만). #NN / 제거. 요일 부분 숨김. */
    .crumb__num, .crumb__sep { display: none !important; }
    .crumb__date { display: inline; }
    .crumb__date-day { display: none; }
  }
  /* 글 카운트 — 네비/단편 한정. body.is-navi/.is-fiction 일 때만 표시 */
  .crumb__num {
    display: none;
    font-family: var(--font-mono);
    font-feature-settings: 'tnum' 1;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.02em;
    margin-left: 2px;
    align-items: baseline;
  }
  body.is-navi .crumb__num,
  body.is-fiction .crumb__num { display: inline-flex; }
  .crumb__num-hash { color: var(--ink-3); }
  .crumb__num-val  { color: var(--ink-2); }
  .crumb__num.is-empty { display: none !important; }
  .top-actions {
    display: flex; align-items: center; gap: 14px;
  }

  /* Share 상태 필 — [아바타] 소연과 공유 중 · / 점선 "소연에게 공유" / 읽기 전용 (작업지시서 §4.3) */
  .share {
    display: inline-flex; align-items: center; gap: 7px;
    height: 36px; padding: 0 13px 0 9px;
    border-radius: 999px;
    cursor: pointer;
    user-select: none;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-1);
    white-space: nowrap;
    background: oklch(85% 0.05 50 / .35);
    border: 1px solid var(--crail-base);
  }
  .share__avatar {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--crail-soft);
    color: var(--crail-deep);
    font-size: 10px; font-weight: 700;
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .share__dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--crail-base);
    flex-shrink: 0;
  }
  .share__off-label, .share__ro-label { display: none; }
  /* 미공유 — 점선 보더 고스트 */
  .share--off {
    background: transparent;
    border: 1px dashed var(--line);
    color: var(--ink-3);
    font-weight: 500;
    padding: 0 13px;
  }
  .share--off .share__avatar, .share--off .share__on-label, .share--off .share__dot { display: none; }
  .share--off .share__off-label { display: inline; }
  /* 읽기 전용 — sunken 필, 토글 아님 */
  .share--readonly {
    background: var(--sunken);
    border: 1px solid transparent;
    color: var(--ink-2);
    font-weight: 500;
    cursor: default;
    pointer-events: none;
  }
  .share--readonly .share__on-label, .share--readonly .share__dot { display: none; }
  .share--readonly .share__ro-label { display: inline; }
  /* 읽기 전용 글 — 서식(Aa) 숨김 (작업지시서 §4.3) */
  body[data-doc-readonly="1"] .edit-trigger { display: none; }

  /* 고스트 아이콘 버튼 — 36×36, R10 (작업지시서 §2) */
  .icon-btn {
    width: 36px; height: 36px;
    padding: 0;
    border-radius: 10px;
    border: 0;
    background: transparent;
    display: grid; place-items: center;
    cursor: pointer;
    color: var(--ink-2);
  }
  .icon-btn:hover { background: var(--hover-bg); }
  .icon-btn .ico { width: 18px; height: 18px; opacity: 0.7; }

  /* 액션 그룹 구분선 — [상태/보조] · [구분선] · [고스트들] · [Primary] (작업지시서 §2) */
  .ta-sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; flex-shrink: 0; }

  /* 새 글 — Primary 버튼: H36, R10, ink-1 솔리드 + 흰 텍스트. 화면당 1개 (작업지시서 §2) */
  .new-doc-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 36px; padding: 0 15px 0 12px;
    border: 0;
    border-radius: 10px;
    background: var(--ink-1);
    color: #fff;
    font-family: inherit; font-size: 13.5px; font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
    white-space: nowrap;
    box-shadow: 0 1px 2px rgba(20,18,14,.18);
    transition: opacity .15s ease;
  }
  .new-doc-btn:hover { opacity: .88; }
  .new-doc-btn .ico { width: 16px; height: 16px; }

  /* 가계부 — 거래 추가 버튼 (별 컴포넌트, 그대로 유지) */
  .icon-btn--accent {
    border: 1px solid var(--crail-base);
    color: var(--crail-base);
  }
  .icon-btn--accent .ico { opacity: 1; }
  .icon-btn--accent:hover {
    background: rgba(217, 119, 87, 0.08);
  }

  /* main view container — empty-state 세로 중앙 정렬 위해 flex column */
  #mainView {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    /* 가로 스크롤 차단 — 세로 스와이프가 비스듬할 때 본문이 좌우로 밀리는 iOS 대각선
       스크롤 드리프트 제거. 세로만 스크롤. (overflow-y:auto 단독이면 spec 상 overflow-x 가
       visible→auto 로 강제 계산돼 가로 스크롤이 살아남던 버그. 긴 토큰은 .doc__body 가 줄바꿈.) */
    overflow-x: hidden;
    overflow-y: auto;
    /* 세로 pan 은 컴포지터 fast-path, 가로 pan 은 JS(드로어 스와이프)로 위임 — 본문 어디서나
       우스와이프로 드로어를 열 때도 본문 세로 스크롤이 메인스레드에 묶이지 않게 (소연 보고 회귀 방지).
       가로 스크롤러 없음(overflow-x:hidden) → pan-y 가 자손 가로 스크롤을 막을 일 없음. */
    touch-action: pan-y;
    /* 내부 스크롤이 body 로 전파(chain) 안 되게 — 끝까지 스크롤해도 화면 안 흔들림 */
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;  /* iOS 관성 스크롤 */
    /* 스크롤은 유지하되 시각적 스크롤바 숨김 (사용자 요청 2026-05-13) */
    scrollbar-width: none;          /* Firefox */
    -ms-overflow-style: none;       /* IE / 옛 Edge */
  }
  #mainView::-webkit-scrollbar { display: none; }  /* WebKit (Chrome/Safari) */

  /* ============ Doc ============ */
  .doc {
    flex: 1;
    padding: 32px 4px 0;
    /* Wave 11.7.2 — overflow: hidden 제거. 자식 (이미지·긴 본문) 이 article 영역 초과 시 잘리던 회귀 fix.
       #mainView (overflow-y: auto) 가 스크롤 처리 — article 자체는 자연 height. */
    max-width: 600px;   /* 본문 칼럼 600px 중앙 (작업지시서 §4.1) */
    margin: 0 auto;
    width: 100%;
  }
  .doc__h1 {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.015em;
    margin: 0 0 10px;
    line-height: 1.25;
    outline: none;
  }
  .doc__h1[contenteditable]:empty::before {
    content: attr(data-empty-title);
    color: var(--ink-4);
  }
  .doc__h1[contenteditable]:empty:not([data-empty-title])::before {
    content: "제목 없음";
    color: var(--ink-4);
  }
  .doc__meta {
    font-family: var(--font-sans);
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink-3);
    margin-bottom: 26px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line-soft);
    letter-spacing: -0.01em;
  }
  .doc__meta .who { color: var(--crail-deep); font-weight: 600; }   /* 작성자명만 crail-deep (작업지시서 §4.1) */
  .doc__meta .save {
    color: var(--ink-3);
  }
  .doc__meta .sep {
    margin: 0 7px;
    color: var(--ink-4);
    font-size: 10px;
  }
  .doc__p {
    font-size: 15.5px;
    line-height: 1.85;
    margin: 0 0 14px;
    color: var(--ink-1);
    text-wrap: pretty;
  }
  .doc__quote,
  .doc__body blockquote {
    border-left: 2px solid var(--crail-base);
    padding: 4px 0 4px 16px;
    margin: 18px 0;
    font-size: 15.5px;
    line-height: 1.85;
    color: var(--ink-2);
    position: relative;
  }
  /* execCommand('formatBlock', 'blockquote') 결과에 인용 부호 시각 표기 (Keep editor 포팅) */
  .doc__body blockquote::before {
    content: '\201C';
    font-family: var(--font-serif, 'Noto Serif KR', serif);
    font-size: 33px;
    line-height: 1;
    color: var(--crail-base);
    position: absolute;
    left: -2px;
    top: -8px;
    opacity: 0.35;
    pointer-events: none;
  }
  .doc__body blockquote {
    padding-left: 24px;
  }

  /* 빈 카테고리 empty state — 메인 doc 영역 중앙 정렬 */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 60px 20px;
    text-align: center;
    max-width: 720px;
    margin: 0 auto;
    width: 100%;
  }
  .empty-state__heading {
    font-size: 21px;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--ink-3);
    margin: 0;
    line-height: 1.4;
  }
  .empty-state__cta {
    border: 1px solid var(--crail-base);
    background: transparent;
    color: var(--crail-base);
    padding: 8px 18px;
    border-radius: 8px;
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: -0.01em;
    transition: background .15s ease;
  }
  .empty-state__cta:hover {
    background: rgba(217, 119, 87, 0.08);
  }

  /* ============ Doc list (전체 보기 — spec §5.0.2) ============ */
  .doc-list {
    flex: 1;
    max-width: 720px;
    margin: 0 auto;
    width: 100%;
    padding: 28px 4px 24px;
    display: flex;
    flex-direction: column;
  }
  .doc-list__stats {
    display: flex;
    gap: 24px;
    padding: 0 0 22px;
    flex-wrap: wrap;
    justify-content: space-between;
  }
  .doc-list__stat-lab {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-4);
  }
  .doc-list__stat-val {
    margin-top: 8px;
    color: var(--ink-1);
    font-size: 27px;
    font-weight: 500;
    letter-spacing: -0.4px;
    white-space: nowrap;
  }
  .doc-list__stat-suf {
    font-size: 14px;
    color: var(--ink-3);
    font-weight: 400;
    margin-left: 3px;
  }
  .doc-list__chips {
    display: flex;
    gap: 6px;
    padding: 0 0 18px;
    flex-wrap: wrap;
  }
  .doc-list__chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12px;
    color: var(--ink-3);
    border: 1px solid transparent;
    cursor: pointer;
    background: transparent;
    font-family: inherit;
  }
  .doc-list__chip:hover { background: var(--hover-bg); }
  .doc-list__chip.is-active {
    color: var(--ink-1);
    background: var(--hover-bg);
    border-color: var(--line);
  }
  .doc-list__chip-dot { width: 6px; height: 6px; border-radius: 3px; }
  .doc-list__chip-count {
    color: var(--ink-4);
    font-size: 11px;
    font-family: var(--font-mono);
  }
  .doc-list__head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 10px 12px 8px;
    margin-bottom: 4px;
    border-bottom: 1px solid var(--line);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-4);
  }
  .doc-list__head-no { width: 56px; }
  .doc-list__head-title { flex: 1; min-width: 0; }
  .doc-list__head-meta { width: 200px; text-align: right; }

  .doc-list__row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: background .1s;
  }
  .doc-list__row:hover { background: var(--hover-bg); }
  .doc-list__no {
    width: 56px;
    flex-shrink: 0;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-4);
    letter-spacing: 0.02em;
    padding-top: 1px;
  }
  .doc-list__main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .doc-list__line1 {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .doc-list__title {
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-1);
    letter-spacing: -0.01em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .doc-list__share {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--crail-base);
    flex-shrink: 0;
  }
  .doc-list__excerpt {
    font-size: 12px;
    color: var(--ink-3);
    line-height: 1.55;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .doc-list__meta {
    width: 200px;
    flex-shrink: 0;
    text-align: right;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: 0.02em;
    padding-top: 2px;
  }
  .doc-list__meta .sep { color: var(--ink-4); }

  /* ============ 가계부 거래 뷰 ============ */
  .expense-view {
    max-width: 860px;
    margin: 0 auto;
    width: 100%;
    padding: 4px 8px 0;
  }
  /* 기존 통계 페이지 — 720px 칼럼 유지 (통계 버튼으로 진입, 작업지시서 §5.2) */
  .expense-view .exp-tab-panel--stats { max-width: 720px; margin: 0 auto; }
  .expense-view .doc__h1 { margin-bottom: 10px; }
  .expense-list {
    margin-top: 18px;
    border-top: 1px solid var(--line-soft);
  }
  .expense-row {
    display: grid;
    grid-template-columns: 64px 88px 1fr auto;
    gap: 14px;
    align-items: center;
    padding: 14px 4px;
    font-size: 14px;
    color: var(--ink-1);
    line-height: 1.4;
  }
  .expense-row__date {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: 0.02em;
  }
  .expense-row__cat {
    font-size: 14px;
    color: var(--ink-2);
  }
  .expense-row__memo {
    color: var(--ink-1);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .expense-row__amount {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-1);
    letter-spacing: -0.01em;
    text-align: right;
    white-space: nowrap;
  }
  .expense-row__amount .amt-num { color: var(--ink-1); }
  .expense-row__amount .amt-unit {
    color: var(--ink-3);
    font-weight: 400;
    margin-left: 2px;
  }

  /* ===== 가계부 — keep 정보 구조 + 시안 D 톤 ===== */

  /* 큰 헤드라인 — "5월에는 N만원 썼어요" */
  .exp-headline {
    padding: 24px 2px 20px;
  }
  .exp-headline-title {
    font-size: 27px;
    font-weight: 600;
    color: var(--ink-1);
    line-height: 1.32;
    letter-spacing: -0.7px;
  }
  .exp-headline-title strong {
    color: var(--crail-base);
    font-weight: 600;
  }
  .exp-headline-sub {
    font-size: 14px;
    color: var(--ink-3);
    margin-top: 6px;
    line-height: 1.5;
  }
  /* 오렌지는 헤드라인 강조 1곳만 — 서브 수치는 잉크 (작업지시서 §1 색 사용 원칙) */
  .exp-headline-sub strong {
    color: var(--ink-2);
    font-weight: 500;
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    letter-spacing: -0.01em;
  }


  /* 카테고리 분포 — typography-driven 수평 막대 리스트 (시안 D §6 정합, 색 박스 X) */
  .exp-cat-list {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
  }
  .exp-cat-row {
    display: grid;
    grid-template-columns: 88px 1fr 76px;
    gap: 16px;
    align-items: center;
    padding: 10px 2px;
  }
  .exp-cat-row__name {
    font-size: 14px;
    color: var(--ink-2);
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  .exp-cat-row__bar {
    height: 9px;
    background: var(--sunken);
    border-radius: 999px;
    overflow: hidden;
  }
  .exp-cat-row__fill {
    height: 100%;
    min-width: 9px;   /* 작은 값도 점으로 사라지지 않게 (작업지시서 §6) */
    background: oklch(72% 0.02 60);
    border-radius: 999px;
    transition: width .2s ease;
  }
  .exp-cat-row__fill.is-first { background: var(--crail-base); }
  .exp-cat-row__amt {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 14px;
    color: var(--ink-1);
    text-align: right;
    letter-spacing: -0.01em;
    font-weight: 500;
  }
  .exp-cat-row__pct {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 11px;
    color: var(--ink-3);
    text-align: right;
    letter-spacing: -0.01em;
  }
  .exp-cat-row.is-first .exp-cat-row__name { color: var(--ink-1); font-weight: 500; }
  .exp-cat-row.is-first .exp-cat-row__amt { color: var(--crail-base); font-weight: 600; }

  /* 헤드라인 행 — 좌 타이틀/서브, 우 월 네비 (시안 03) */
  .exp-headline {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }
  .exp-headline-main { min-width: 0; }
  .exp-headline .exp-month-nav { margin-top: 6px; flex-shrink: 0; }
  .exp-month-nav {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .exp-month-nav-btn {
    width: 28px; height: 28px;
    border: 0;
    background: transparent;
    border-radius: 7px;
    display: grid; place-items: center;
    cursor: pointer;
    color: var(--ink-3);
  }
  .exp-month-nav-btn:hover { background: var(--hover-bg); color: var(--ink-1); }
  .exp-month-nav-btn.is-disabled { opacity: .35; cursor: default; }
  .exp-month-nav-btn .ico { width: 14px; height: 14px; }
  .exp-month-nav-label {
    font-size: 14.5px;
    font-weight: 600;
    color: var(--ink-1);
    letter-spacing: -0.01em;
    min-width: 86px;
    text-align: center;
    white-space: nowrap;
  }

  /* 월간 캘린더 — 7열 + 주합 열 (작업지시서 §5.1). minmax(0,1fr) — 금액 nowrap 이 열을 밀어내지 않게 */
  .exp-month-cal { padding: 0 0 8px; }
  .exp-month-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 7px;
  }
  .exp-month-dow-row {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 7px;
    grid-column: 1 / -1;
    margin-bottom: 2px;
  }
  /* 요일 헤더 — 모노 10.5px, 일·토만 옅은 오렌지 톤 (§5.1) */
  .exp-month-dow {
    text-align: center;
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--ink-4);
    font-weight: 500;
    letter-spacing: 0.06em;
    padding: 6px 0 8px;
    white-space: nowrap;
  }
  .exp-month-dow.we { color: oklch(70% 0.06 50); }
  /* 캘린더 타일 — 지출 있는 날 = 라운드 타일 R13 / 없는 날 = 날짜 숫자만 (§5.1) */
  .exp-month-day {
    min-height: 66px;
    padding: 9px 11px;
    border-radius: 13px;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    background: transparent;
    transition: filter .12s ease;
    position: relative;
  }
  .exp-month-day.empty, .exp-month-day.is-zero { cursor: default; }
  .exp-month-day:hover:not(.empty):not(.is-zero) { filter: brightness(.97); }
  /* 농도 5단계 (tokens.css .c3.s1~.s5) */
  .exp-month-day.s1 { background: oklch(96.5% 0.02 50); }
  .exp-month-day.s2 { background: oklch(93.5% 0.038 50); }
  .exp-month-day.s3 { background: oklch(88.5% 0.062 50); }
  .exp-month-day.s4 { background: oklch(79% 0.095 50); }
  .exp-month-day.s5 { background: var(--crail-base); }
  /* 날짜 — 구석 11px 모노 (§5.1) */
  .exp-month-day-num {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-4);
    line-height: 1;
    white-space: nowrap;
  }
  .exp-month-day.s2 .exp-month-day-num, .exp-month-day.s3 .exp-month-day-num { color: oklch(58% 0.07 50); }
  .exp-month-day.s4 .exp-month-day-num { color: oklch(40% 0.09 50); }
  .exp-month-day.s5 .exp-month-day-num { color: rgba(255,255,255,.75); }
  /* 금액 — 만원 축약 15.5px/600 주인공, 타일 하단 정렬 (§5.1). calm 변형 — 옅은 단계 잉크 텍스트 (§5.1 v6) */
  .exp-month-day-amount {
    font-family: var(--font-mono);
    font-size: 15.5px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin-top: auto;
    white-space: nowrap;
    line-height: 1;
  }
  .calm .exp-month-day.s1 .exp-month-day-amount,
  .calm .exp-month-day.s2 .exp-month-day-amount { color: var(--ink-1); }
  .calm .exp-month-day.s1 .exp-month-day-num,
  .calm .exp-month-day.s2 .exp-month-day-num { color: var(--ink-4); }
  .calm .exp-month-day.s3 .exp-month-day-amount { color: oklch(26% 0.05 50); }
  .calm .exp-month-day.s3 .exp-month-day-num { color: oklch(46% 0.05 50); }
  .calm .exp-month-day.s4 .exp-month-day-amount { color: oklch(24% 0.06 50); }
  .exp-month-day.s5 .exp-month-day-amount { color: #fff; }
  /* 오늘 — 이중 링 (tokens .c3.tdy) */
  .exp-month-day.today { box-shadow: 0 0 0 2px var(--shell), 0 0 0 4px var(--crail-deep); }

  /* 간이 통계 2열 — 카테고리(회색 막대) / 브랜드 TOP 5 (작업지시서 §5.2) */
  .exp-mini-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 36px;
    margin-top: 30px;
    padding-bottom: 40px;
  }
  .exp-mini-head {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-2);
    letter-spacing: -0.01em;
    padding-bottom: 4px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .exp-mini-month {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    color: var(--ink-4);
    letter-spacing: 0.06em;
  }
  .exp-mini-cat-list { margin-top: 8px; }
  .exp-mini-cat-list .exp-cat-row { grid-template-columns: 64px 1fr auto; gap: 12px; padding: 8px 0; }
  .exp-mini-cat-list .exp-cat-row__name { font-size: 12.5px; }
  .exp-mini-cat-list .exp-cat-row__bar { height: 7px; }
  .exp-mini-cat-list .exp-cat-row__amt { font-family: var(--font-mono); font-size: 12px; font-weight: 500; }
  .exp-cat-rest {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 8px 0 0;
    font-size: 11.5px;
    color: var(--ink-4);
  }
  .exp-cat-rest__amt { font-family: var(--font-mono); font-size: 11px; }
  .exp-brand-rows { margin-top: 8px; display: flex; flex-direction: column; }
  .exp-brand-row {
    display: grid;
    grid-template-columns: 20px 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 8px 0;
    cursor: pointer;
    border-radius: 8px;
  }
  .exp-brand-row:hover { background: var(--hover-bg); }
  .exp-brand-row__num {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-4);
    text-align: center;
  }
  .exp-brand-row__body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .exp-brand-row__name {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-1);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .exp-brand-row__meta { font-size: 10.5px; color: var(--ink-4); white-space: nowrap; }
  .exp-brand-row__amt {
    font-family: var(--font-mono);
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink-1);
    white-space: nowrap;
  }

  /* 모바일 전용 월 헤더 (시안 05) — 데스크톱 숨김 */
  .exp-mhead { display: none; }
  /* 레일 시트 핸들 — 모바일 전용 */
  .exp-rail-handle { display: none; }

  /* 우측 레일 — 월 요약 카드 + 월 타임라인 카드 (작업지시서 §5.3) */
  .exp-rail {
    width: 300px;
    flex: none;
    display: none;
    flex-direction: column;
    gap: 16px;
    min-height: 0;
    margin: 18px 0 4px;
  }
  body.is-expense:not(.is-exp-stats) .exp-rail { display: flex; }
  .exp-rail-card {
    background: var(--sidebar);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-float);
    padding: 18px 18px 16px;
  }
  .exp-rail-month {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.09em;
    color: var(--ink-4);
    text-transform: uppercase;
  }
  .exp-rail-total {
    margin-top: 8px;
    font-family: var(--font-mono);
    font-size: 26px;
    font-weight: 600;
    color: var(--ink-1);
    letter-spacing: -0.02em;
    line-height: 1;
    white-space: nowrap;
  }
  .exp-rail-total .unit { font-size: 14px; color: var(--ink-3); font-weight: 500; }
  .exp-rail-stats { margin-top: 16px; display: flex; flex-direction: column; }
  .exp-rail-stat {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 7px 0;
    font-size: 12px;
    color: var(--ink-3);
    white-space: nowrap;
  }
  .exp-rail-stat b {
    font-family: var(--font-mono);
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink-1);
  }
  .exp-rail-tlwrap {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    padding-bottom: 0;
  }
  .exp-rail-tl-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--ink-1);
    letter-spacing: -0.01em;
    padding: 0 2px 8px;
    flex-shrink: 0;
  }
  .exp-rail-tl-count {
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 500;
    color: var(--ink-4);
  }
  /* 아이콘·∧·크레일 카운트 배지는 모바일 얇은 탭 전용 — 데스크톱 우측 레일은 라벨 + detail */
  .exp-rail-tl-ico, .exp-rail-tl-chev, .exp-rail-tl-count { display: none; }
  .exp-rail-tl-detail {
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 500;
    color: var(--ink-4);
  }
  .exp-rail .exp-tl-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: none;
    padding-bottom: 28px;
  }
  .exp-rail .exp-tl-list::-webkit-scrollbar { display: none; }
  /* 하단 페이드 (§5.3) */
  .exp-rail-tlwrap::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 36px;
    background: linear-gradient(to bottom, rgba(255,255,255,0), var(--sidebar));
    pointer-events: none;
    border-radius: 0 0 var(--r-lg) var(--r-lg);
  }

  /* 모바일: 셀 축소 + 주합 열 숨김 (시안 05 — 7열) */
  @media (max-width: 600px) {
    .exp-month-day { min-height: 54px; padding: 6px 6px; border-radius: 11px; min-width: 0; overflow: hidden; }
    .exp-month-grid, .exp-month-dow-row { gap: 4px; grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .exp-month-day-num { font-size: 10px; }
    .exp-month-day-amount { font-size: 11.5px; letter-spacing: -0.03em; }
    .exp-mini-stats { grid-template-columns: 1fr; gap: 28px; }
  }

  /* 선택일 상세 — keep 카드 시각 흡수 (박스화 + slide-in 애니메이션) */
  .exp-day-detail {
    margin-top: 18px;
    padding: 16px 18px;
    background: var(--sidebar);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-pop);
    animation: expDaySlideIn .2s ease;
  }
  @keyframes expDaySlideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .exp-day-detail__head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
  }
  .exp-day-detail__date {
    font-size: 16px;
    font-weight: 500;
    color: var(--ink-1);
    letter-spacing: -0.01em;
  }
  .exp-day-detail__sum {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 14px;
    color: var(--ink-3);
    letter-spacing: -0.01em;
  }
  .exp-day-detail__empty {
    font-size: 14px;
    color: var(--ink-4);
    padding: 12px 4px;
  }

  /* — Day popover (캘린더 셀 클릭 — 중앙 모달 + backdrop overlay) — */
  .exp-day-popover-overlay {
    position: fixed;
    inset: 0;
    z-index: 49;
    background: rgba(20, 18, 14, 0.34);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease;
  }
  .exp-day-popover-overlay.is-open {
    opacity: 1;
    pointer-events: auto;
  }
  .exp-day-detail.is-popover {
    position: fixed;
    z-index: 50;
    top: 50%;
    left: 50%;
    margin: 0;
    width: min(440px, calc(100vw - 64px));
    max-height: calc(100vh - 80px);
    overflow-y: auto;
    border: 0;
    border-radius: var(--r-lg);
    padding: 22px 24px;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -48%);
    transition: opacity .18s ease, transform .18s ease;
    animation: none;
  }
  .exp-day-detail.is-popover.is-open {
    opacity: 1;
    transform: translate(-50%, -50%);
    pointer-events: auto;
  }
  .exp-day-detail.is-popover .exp-day-detail__head {
    margin-bottom: 6px;
  }
  .exp-day-detail.is-popover .exp-day-detail__date {
    font-size: 17px;
    font-weight: 600;
    color: var(--ink-1);
    letter-spacing: -0.01em;
  }
  /* ── 일자 상세 모달 — 제목 "5월 11일 월요일" + 합계(잉크색) 인라인 (작업지시서 §5.1, 시안 04) ── */
  .exp-day-detail__title { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
  .exp-day-detail .exp-day-detail__date .dow { color: var(--ink-2); font-weight: 700; margin-left: 6px; }
  .exp-day-detail__sum {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-2);
    white-space: nowrap;
  }
  .exp-day-detail__sum b { color: var(--ink-1); font-weight: 500; font-size: 13px; }
  .exp-day-detail__close {
    width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent;
    color: var(--ink-3); cursor: pointer; display: grid; place-items: center; flex-shrink: 0;
    transition: background .12s, color .12s;
  }
  .exp-day-detail__close:hover { background: var(--hover-bg); color: var(--ink-1); }
  .exp-day-detail__close .ico { width: 18px; height: 18px; }
  /* 거래 행 — 지출처 / 메타(카테고리 · 카드명) / 금액 (시안 04) */
  .exp-day-row { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; padding: 13px 4px; cursor: pointer; transition: background .12s; }
  .exp-day-row + .exp-day-row { border-top: 1px solid var(--line-soft); }
  .exp-day-row:hover { background: var(--hover-bg); border-radius: 10px; }
  .exp-day-row__body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .exp-day-row__merchant { font-size: 14.5px; font-weight: 600; color: var(--ink-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .exp-day-row__merchant .exp-row__recurring { margin-left: 4px; color: var(--ink-4); }
  .exp-day-row__meta { font-size: 11px; color: var(--ink-4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .exp-day-row__amt { font-family: var(--font-mono); font-size: 14px; font-weight: 500; color: var(--ink-1); text-align: right; white-space: nowrap; letter-spacing: -0.01em; }
  .exp-day-row__amt .amt-num { color: var(--ink-1); }
  .exp-day-row__amt .amt-unit { color: var(--ink-3); font-size: 12px; margin-left: 2px; }
  /* 모달 풋터 — 우하단 [닫기 Secondary] [이 날에 거래 추가 Primary] (작업지시서 §5.1) */
  .exp-day-detail__actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding-top: 18px;
  }
  .exp-day-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 36px; padding: 0 14px;
    border-radius: 10px;
    font-family: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background .14s, opacity .14s;
  }
  .exp-day-btn--ghost {
    background: var(--sidebar);
    color: var(--ink-1);
    border: 1px solid var(--line);
  }
  .exp-day-btn--ghost:hover { background: var(--hover-bg); }
  .exp-day-btn--pri {
    background: var(--ink-1);
    color: #fff;
    border: 0;
    box-shadow: 0 1px 2px rgba(20,18,14,.18);
  }
  .exp-day-btn--pri:hover { opacity: .88; }
  .exp-day-btn .ico { width: 15px; height: 15px; }

  /* popover 거래 row — 2줄 (금액 + 매출처/카드 메타) */
  .exp-popover-row {
    display: grid;
    grid-template-columns: 56px 1fr auto auto;
    gap: 14px;
    align-items: baseline;
    padding: 12px 0;
  }
  .exp-popover-row__cat {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 10.5px;
    color: var(--ink-3);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .exp-popover-row__merchant {
    font-size: 14px;
    color: var(--ink-1);
    font-weight: 400;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .exp-popover-row__card {
    font-size: 11px;
    color: var(--ink-4);
  }
  .exp-popover-row__amount {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 14px;
    font-weight: 400;
    color: var(--ink-1);
    letter-spacing: -0.01em;
    text-align: right;
  }
  .exp-popover-row__amount .amt-num { color: var(--ink-1); }
  .exp-popover-row__amount .amt-unit {
    color: var(--ink-3);
    margin-left: 2px;
  }
  .exp-popover-row .exp-row__recurring {
    margin-left: 4px;
  }

  /* popover 풋터 — 건수 + 합계 */
  .exp-day-detail__foot {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-top: 14px;
    margin-top: 6px;
  }
  .exp-day-detail__foot-count {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 12px;
    color: var(--ink-3);
    letter-spacing: -0.01em;
  }
  .exp-day-detail__foot-sum {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 14px;
    font-weight: 400;
    color: var(--ink-1);
    letter-spacing: -0.01em;
  }
  .exp-row__recurring {
    display: inline-block;
    width: 11px;
    height: 11px;
    margin-left: 6px;
    color: var(--ink-3);
    opacity: 0.6;
    vertical-align: -1px;
  }

  /* 브랜드 랭킹 */
  .exp-rank-section { margin-top: 38px; }
  .exp-rank-1 {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    background: var(--sidebar);
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-top: 14px;
  }
  .exp-rank-1__num {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 14px;
    color: var(--ink-3);
    font-weight: 500;
    width: 18px;
    text-align: center;
    letter-spacing: -0.01em;
  }
  .exp-rank-1__avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--crail-base);
    color: #fff;
    display: grid; place-items: center;
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: -0.02em;
    flex-shrink: 0;
  }
  .exp-rank-1__info {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    gap: 3px;
  }
  .exp-rank-1__name {
    font-size: 17px;
    font-weight: 600;
    color: var(--ink-1);
    letter-spacing: -0.01em;
  }
  .exp-rank-1__meta {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: -0.01em;
  }
  .exp-rank-1__amt {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 19px;
    font-weight: 600;
    color: var(--ink-1);
    letter-spacing: -0.02em;
  }

  /* 2~7위 그리드 */
  .exp-rank-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-top: 14px;
  }
  .exp-rank-card {
    display: grid;
    grid-template-columns: 18px 32px 1fr;
    gap: 12px;
    align-items: center;
    padding: 12px 14px;
    background: var(--sidebar);
    border: 1px solid var(--line);
    border-radius: 10px;
    transition: background .15s ease, border-color .15s ease;
    cursor: pointer;
  }
  .exp-rank-card:hover {
    background: var(--hover-bg);
    border-color: var(--line-soft);
  }
  .exp-rank-card__num {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 12px;
    color: var(--ink-3);
    font-weight: 500;
    text-align: center;
    letter-spacing: -0.01em;
  }
  .exp-rank-card__chip {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--hover-bg);
    color: var(--ink-2);
    display: grid; place-items: center;
    font-family: var(--font-sans);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: -0.03em;
    flex-shrink: 0;
    /* 4글자+ 카테고리('해외체류' 등)가 원 밖으로 삐지던 문제 — 원 안에서 줄바꿈 수용 + clip */
    overflow: hidden;
    padding: 1px;
    line-height: 1.05;
    text-align: center;
    word-break: break-all;
  }
  .exp-rank-card__main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .exp-rank-card__name {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-1);
    letter-spacing: -0.01em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .exp-rank-card__amt {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-2);
    letter-spacing: -0.01em;
    flex-shrink: 0;
  }

  /* ── 통계 섹션 재구조화 — 시안(헤드라인→카테고리→추이→최다지출처) · 작업지시서 §6 ── */
  .exp-stats-sec { margin-top: 42px; }
  .exp-stats-sec__label { font-size: 13px; font-weight: 600; color: var(--ink-1); padding: 0 2px 18px; }
  .exp-stats-sec__label strong { font-weight: 600; color: var(--ink-2); font-feature-settings: 'tnum' 1; }
  /* 최다 지출처 — 2~7위 행 (그리드 카드 대신) */
  .exp-rank-rows { margin-top: 4px; }
  .exp-rank-row { display: grid; grid-template-columns: 14px 1fr auto; gap: 14px; align-items: center; padding: 12px 8px; border-radius: 9px; cursor: pointer; transition: background .12s ease; }
  .exp-rank-row:hover { background: var(--hover-bg); }
  .exp-rank-row__num { font-family: var(--font-sans); font-feature-settings: 'tnum' 1; font-size: 13px; color: var(--ink-4); text-align: center; }
  .exp-rank-row__body { min-width: 0; display: flex; align-items: baseline; gap: 9px; }
  .exp-rank-row__name { font-size: 14px; color: var(--ink-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .exp-rank-row__cat { font-size: 12px; color: var(--ink-4); white-space: nowrap; flex-shrink: 0; }
  .exp-rank-row__amt { font-family: var(--font-sans); font-feature-settings: 'tnum' 1; font-size: 14px; color: var(--ink-2); text-align: right; white-space: nowrap; letter-spacing: -0.01em; }
  /* 월별 추이 평균선 */
  .exp-bar-chart-section .exp-bar-chart { position: relative; }
  .exp-bar-chart__avg { position: absolute; left: 2px; right: 2px; border-top: 1px dashed var(--ink-4); z-index: 2; pointer-events: none; }
  .exp-bar-chart__avg span { position: absolute; right: 0; top: -8px; font-size: 10px; color: var(--ink-4); background: var(--shell); padding: 0 4px; font-feature-settings: 'tnum' 1; }

  @media (max-width: 600px) {
    .exp-rank-grid { grid-template-columns: 1fr; }
  }

  /* 누적 섹션 */
  .exp-cumulative {
    margin-top: 0;
  }

  /* 통계 큰 section (월간 컨텐츠 ↔ 연간 컨텐츠) 사이 분리 hairline */
  .exp-stats-section + .exp-stats-section {
    margin-top: 38px;
    padding-top: 28px;
    border-top: 1px solid var(--line-soft);
  }
  .exp-cumulative-rank {
    margin-top: 24px;
  }
  .exp-cumulative-rank__row {
    display: grid;
    grid-template-columns: 22px 36px 1fr auto;
    gap: 14px;
    align-items: center;
    padding: 11px 4px;
  }
  .exp-cumulative-rank__row:last-child { border-bottom: 0; }
  .exp-cumulative-rank__num {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 12px;
    color: var(--ink-3);
    text-align: center;
    letter-spacing: -0.01em;
  }
  .exp-cumulative-rank__chip {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--hover-bg);
    color: var(--ink-2);
    display: grid; place-items: center;
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: -0.02em;
  }
  .exp-cumulative-rank__row:first-child .exp-cumulative-rank__chip {
    background: var(--crail-base);
    color: #fff;
  }
  .exp-cumulative-rank__name {
    font-size: 14px;
    color: var(--ink-1);
    letter-spacing: -0.01em;
    font-weight: 500;
  }
  .exp-cumulative-rank__amt {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-1);
    letter-spacing: -0.01em;
  }

  /* 인라인 입력 행 — + 버튼 클릭 시 목록 최상단 추가 */
  .expense-row--input {
    background: rgba(217, 119, 87, 0.04);
    border-left: 2px solid var(--crail-base);
    padding-left: 10px;
  }
  .expense-row--input input {
    border: 0;
    background: transparent;
    font-family: inherit;
    font-size: inherit;
    color: inherit;
    outline: 0;
    width: 100%;
    padding: 2px 0;
    letter-spacing: inherit;
  }
  .expense-row--input input::placeholder { color: var(--ink-4); }
  .expense-row--input .expense-row__date input {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-3);
  }
  .expense-row--input .expense-row__amount input {
    font-family: var(--font-mono);
    font-size: 14px;
    text-align: right;
  }

  /* ============ Bottom toolbar (입력창 — 댓글) ============ */
  /* ============ 본문 + 대화 패널 2칼럼 (작업지시서 §4) ============ */
  .main__body {
    flex: 1;
    display: flex;
    gap: 28px;
    min-height: 0;
  }
  body.is-admin .main__body { display: none; }

  /* 대화 패널 — 348px 고정, 흰 카드 R18 + float 그림자, 메인과 분리되어 떠 있음 (§4.1) */
  .convo {
    width: 348px;
    flex: none;
    display: none;
    flex-direction: column;
    min-height: 0;
    margin: 18px 0 4px;
    background: var(--sidebar);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-float);
    padding: 20px 18px 14px;
  }
  body[data-convo="1"] .convo { display: flex; }
  body.is-expense .convo, body.is-admin .convo { display: none; }

  /* 드래그 핸들 — 모바일 바텀 시트 전용 (데스크톱 숨김) */
  .convo__handle { display: none; }

  /* 헤더 — "대화" + 건수. 구분선 없음, 여백으로만 구획 (§4.2) */
  .convo__head {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--ink-1);
    letter-spacing: -0.01em;
    padding: 0 4px 14px;
    flex-shrink: 0;
  }
  .convo__count {
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-weight: 500;
    color: var(--ink-4);
    margin-left: 3px;
  }
  /* 아이콘·∧ 는 모바일 얇은 탭 전용 — 데스크톱 우측 카드 헤더에선 숨김 */
  .convo__head-ico, .convo__head-chev { display: none; }
  .convo__list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 2px 4px 14px;
    scrollbar-width: none;
  }
  .convo__list::-webkit-scrollbar { display: none; }

  /* 날짜 구분 — 가운데 정렬 모노 10px 텍스트만, 선 없음 (§4.2) */
  .cv-day {
    text-align: center;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    color: var(--ink-4);
    padding: 6px 0 2px;
    flex-shrink: 0;
  }

  /* 사람 댓글 — 배경 없음, 아바타 24px + 이름/시각 + 본문 13.5px (§4.2) */
  .cv-msg {
    display: flex;
    gap: 9px;
    align-items: flex-start;
  }
  .cv-msg__avatar {
    width: 24px; height: 24px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 10.5px;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .cv-msg__avatar--me { background: var(--sunken); color: var(--ink-2); border: 1px solid var(--line); }
  .cv-msg__avatar--partner { background: var(--crail-soft); color: var(--crail-deep); }
  /* 클로드 아바타 — crail 원형 + 흰 8방향 스파크 (별 4꼭지 금지, §4.2) */
  .cv-msg__avatar--ai { background: var(--crail-base); color: #fff; }
  .cv-msg__avatar--ai svg { width: 11px; height: 11px; }
  .cv-msg__main { flex: 1; min-width: 0; }
  .cv-msg__head {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 3px;
  }
  .cv-msg__name {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-1);
    white-space: nowrap;
  }
  .cv-msg__time {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-4);
    white-space: nowrap;
  }
  .cv-msg__body {
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--ink-1);
    white-space: pre-wrap;
    word-break: break-word;
    text-wrap: pretty;
  }
  .cv-msg__del {
    background: transparent; border: 0; padding: 0;
    font-size: 10.5px;
    color: var(--ink-4);
    cursor: pointer;
    opacity: 0;
    transition: opacity .12s ease;
    flex-shrink: 0;
  }
  .cv-msg:hover .cv-msg__del, .cv-msg:focus-within .cv-msg__del { opacity: 1; }
  .cv-msg__del:hover { color: var(--danger); }

  /* 클로드 자동 댓글 — sunken 카드 R12 + "자동" 태그 + 2줄 클램프 (§4.2) */
  .cv-msg--ai .cv-msg__card {
    background: var(--sunken);
    border-radius: 12px;
    padding: 10px 12px 9px;
  }
  .ai-tag {
    display: inline-flex; align-items: center;
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 0.06em;
    color: var(--ink-4);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 1.5px 7px;
    white-space: nowrap;
  }
  .cv-msg__body.is-clamped {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .cv-msg__more {
    background: transparent; border: 0; padding: 4px 0 0;
    display: inline-flex; align-items: center; gap: 3px;
    font-family: var(--font-sans);
    font-size: 11.5px;
    font-weight: 500;
    color: var(--ink-3);
    cursor: pointer;
  }
  .cv-msg__more:hover { color: var(--ink-1); }
  .cv-msg__more[hidden] { display: none; }

  .convo__empty {
    padding: 26px 4px;
    text-align: center;
    font-size: 12.5px;
    color: var(--ink-4);
  }

  /* 컴포저 — 하단 고정 H44, 우측 32px 잉크 원형 전송 (§4.2) */
  .convo__composer { flex-shrink: 0; padding-top: 6px; }
  .composer {
    background: var(--sidebar);
    border: 1px solid var(--line);
    border-radius: 13px;
    height: 44px;
    padding: 0 6px 0 14px;
    display: flex; align-items: center; gap: 10px;
    box-shadow: var(--shadow-inset-soft);
    transition: border-color .16s, box-shadow .16s;
  }
  .composer:focus-within { border-color: var(--crail-base); box-shadow: 0 0 0 3px rgba(217,119,87,.16); }
  .composer input {
    flex: 1;
    min-width: 0;
    border: 0; outline: 0; background: transparent;
    font-family: var(--font-sans);
    font-size: 16px;
    color: var(--ink-1);
    padding: 7px 0;
  }
  .composer input::placeholder { color: var(--ink-4); }
  .composer__send {
    width: 32px; height: 32px; border-radius: 50%; border: 0; flex-shrink: 0; cursor: pointer;
    display: grid; place-items: center; background: var(--ink-1); color: #fff;
    transition: transform .18s, opacity .18s;
  }
  .composer__send .ico { width: 15px; height: 15px; opacity: 1; }
  .composer__send:hover { transform: scale(1.06); }
  .composer__send:active { transform: scale(.94); }
  .composer input:disabled ~ .composer__send { opacity: .4; pointer-events: none; }

  /* ============ Edit toolbar (상단 편집 도구 뎠라운 리본) ============ */
  .edit-trigger {
    width: 36px; height: 36px;
    border-radius: 10px;
    border: 0;
    background: transparent;
    display: grid; place-items: center;
    cursor: pointer;
    color: var(--ink-1);
    transition: background .15s ease, color .15s ease;
  }
  .edit-trigger:hover { background: var(--hover-bg); }
  .edit-trigger.is-open {
    background: var(--crail-base);
    color: #fff;
  }
  .edit-trigger .ico { width: 18px; height: 18px; opacity: 0.9; }
  .edit-trigger.is-open .ico { opacity: 1; }
  .edit-trigger__label {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0;
    line-height: 1;
    opacity: 0.85;
  }
  .edit-trigger.is-open .edit-trigger__label { opacity: 1; }

  .edit-toolbar {
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transform: translateY(-4px);
    transition: max-height .25s ease, opacity .2s ease, transform .25s ease, padding .25s ease, border-color .25s ease;
    border-bottom: 1px solid transparent;
  }
  .edit-toolbar.is-open {
    max-height: 64px;
    opacity: 1;
    transform: translateY(0);
    padding: 10px 0;
    border-bottom-color: var(--line-soft);
    /* H 드롭다운이 toolbar 박스 밖으로 펼쳐질 수 있도록 */
    overflow: visible;
  }
  .edit-toolbar__inner {
    max-width: 720px;
    margin: 0 auto;
    display: flex; align-items: center;
    gap: 4px;
    flex-wrap: wrap;
  }
  .et-btn {
    height: 30px;
    min-width: 30px;
    padding: 0 8px;
    border: 0;
    background: transparent;
    border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    cursor: pointer;
    color: var(--ink-1);
    font-family: var(--font-sans);
    font-size: 15px;
    font-weight: 500;
  }
  .et-btn:hover { background: var(--hover-bg); }
  .et-btn .ico { width: 16px; height: 16px; opacity: 0.85; }
  .et-btn--bold { font-weight: 700; }
  .et-btn--italic { font-style: italic; font-weight: 500; }
  .et-btn--underline { text-decoration: underline; }
  .et-divider {
    width: 1px;
    height: 18px;
    background: var(--line);
    margin: 0 4px;
  }

  /* ============ Keep editor 포팅 — 플로팅 버블 / Aa 팝업 ============ */
  /* 본문 단일 폰트·사이즈 강제 — 외부 paste 또는 historical h1/h2/h3 가 들어와도
     본문 디폴트로 시각화. plaintext paste handler (entries.js) 와 이중 안전망. */
  .doc__body {
    font-size: 15.5px;   /* 본문 15.5px / 1.85 (작업지시서 §4.1) */
    line-height: 1.85;
    color: var(--ink-1);
    text-wrap: pretty;
    -webkit-text-size-adjust: 100%;
    /* 긴 URL·끊김 없는 문자열이 가로로 삐져나가지 않게 줄바꿈 — #mainView 가로 스크롤
       (좌우 흔들림) 의 원인 차단. overflow-x:hidden 과 짝 (클리핑 대신 줄바꿈으로 해소). */
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  .doc__body,
  .doc__body * {
    font-family: var(--font-sans) !important;
  }
  .doc__body,
  .doc__body h1,
  .doc__body h2,
  .doc__body h3,
  .doc__body h4,
  .doc__body h5,
  .doc__body h6,
  .doc__body p,
  .doc__body div,
  .doc__body li,
  .doc__body blockquote,
  .doc__body span {
    font-size: 15.5px !important;
    line-height: 1.85 !important;
    font-weight: inherit !important;
    color: var(--ink-1);
  }
  .doc__body strong,
  .doc__body b {
    font-weight: 700 !important;
  }
  .doc__body h1,
  .doc__body h2,
  .doc__body h3,
  .doc__body h4,
  .doc__body h5,
  .doc__body h6 {
    margin: 0 0 14px;
  }
  /* 인라인 강조 (b/i/u/s) 와 인용/리스트는 사용자 의도라 보존 */

  /* 플로팅 인라인 버블 — 본문 텍스트 선택 시 */
  #floatingToolbar {
    position: fixed;
    z-index: 999;
    background: #1c1c1e;
    border-radius: 10px;
    padding: 4px;
    display: none;
    align-items: center;
    gap: 1px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25), 0 1px 4px rgba(0, 0, 0, 0.15);
    animation: popIn 0.12s ease;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.92); }
    to   { opacity: 1; transform: scale(1); }
  }
  #floatingToolbar.show { display: flex; }
  #floatingToolbar::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 10px;
    background: #1c1c1e;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
  }
  .ft-btn {
    width: 30px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    color: rgba(255, 255, 255, 0.75);
    font-size: 14px;
    font-weight: 700;
    font-family: 'Pretendard', sans-serif;
    transition: 0.1s;
    flex-shrink: 0;
  }
  .ft-btn:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }
  .ft-btn.highlight-btn {
    font-size: 14px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.8);
    letter-spacing: -0.5px;
  }
  .ft-btn.highlight-btn .hl-inner {
    background: rgba(251, 191, 36, 0.5);
    border-radius: 3px;
    padding: 1px 4px;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    line-height: 1.3;
    letter-spacing: 0;
  }
  .ft-btn.highlight-btn:hover .hl-inner { background: rgba(251, 191, 36, 0.8); }

  /* Aa 팝업 (모바일/태블릿) */
  .lp-popup-overlay {
    position: fixed;
    inset: 0;
    z-index: 9900;
    background: rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity 0.35s cubic-bezier(0.2, 0.6, 0.3, 1);
    pointer-events: none;
  }
  .lp-popup-overlay.open { opacity: 1; pointer-events: auto; }
  .lp-popup-card {
    position: fixed;
    z-index: 10000;
    background: var(--panel, #fff);

    max-width: 320px;
    width: calc(100vw - 48px);
  }
  .lp-popup-card.open {

    opacity: 1;
    pointer-events: auto;
  }
  .lp-popup-menu { padding: 6px 0; }
  .lp-popup-menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 18px;
    font-size: 16px;
    color: var(--text);
    cursor: pointer;
    transition: background 0.1s;
    user-select: none;
  }
  .lp-popup-menu-item:hover { background: rgba(0, 0, 0, 0.03); }

  .aa-h-icon {

    font-weight: 600;
    color: var(--text-dim);
