<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Today — 오늘의 글쓰기</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
<style>
  /* ===========================================================
     Today — 개인 글쓰기 대시보드
     시안 D · 사이드바 #fff / shell #fdfdfd · 차이 2/255
     Accent — Crail #d97757
     =========================================================== */

  :root {
    --font-sans: "Pretendard", "Inter", system-ui, -apple-system, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;

    --tone-255: rgb(255, 255, 255);
    --tone-253: rgb(253, 253, 253);
    --tone-243: rgb(243, 243, 243);

    --shell:    var(--tone-253);
    --sidebar:  var(--tone-255);
    --hover-bg: var(--tone-243);

    --sunken:    oklch(97.6% 0.006 60);
    --line:      oklch(92.0% 0.006 60);
    --line-soft: oklch(94.5% 0.006 60);

    --ink-1: oklch(22% 0.008 60);
    --ink-2: oklch(38% 0.008 60);
    --ink-3: oklch(56% 0.008 60);
    --ink-4: oklch(72% 0.006 60);

    --black: #000;
    --crail-soft: oklch(85% 0.05 50);
    --crail-base: #d97757;
    --crail-deep: oklch(48% 0.14 50);
    --cloudy-soft: oklch(88% 0.04 240);
    --cloudy-base: oklch(65% 0.08 240);
    --cloudy-deep: oklch(42% 0.12 240);

    --warning: #c98a3f;
    --danger:  #c5544a;

    --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
    --sp-5: 24px; --sp-6: 32px; --sp-7: 48px; --sp-8: 64px;

    --r-sm: 8px;
    --r-md: 12px;
    --r-lg: 18px;
    --r-xl: 24px;

    --shadow-float:
      0 1px 0 rgba(20, 18, 14, 0.02),
      0 6px 14px -8px rgba(20, 18, 14, 0.08),
      0 24px 48px -24px rgba(20, 18, 14, 0.18);

    --shadow-pop:
      0 1px 0 rgba(20, 18, 14, 0.03),
      0 8px 16px -10px rgba(20, 18, 14, 0.18),
      0 24px 48px -24px rgba(20, 18, 14, 0.24);

    --shadow-inset-soft:
      0 4px 12px -8px rgba(20, 18, 14, 0.08);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: var(--font-sans);
    color: var(--ink-1);
    background: var(--shell);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* ============ App shell ============ */
  .app {
    height: 100vh;
    display: flex;
    background: var(--shell);
  }

  /* ============ Sidebar ============ */
  .sidebar {
    width: 252px;
    margin: 16px 0 16px 16px;
    background: var(--sidebar);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-float);
    padding: 14px 12px 12px;
    display: flex;
    flex-direction: column;
    font-size: 14px;
    flex-shrink: 0;
    transition: width .2s ease, padding .2s ease;
  }

  /* 사이드바 접힘 토글 — chevron rotate */
  .sidebar-toggle-ico { transition: transform .2s ease; }
  .app.is-sidebar-collapsed .sidebar-toggle-ico { transform: rotate(180deg); }

  /* 사이드바 접힘 상태 — 60px 아이콘 레일 */
  .app.is-sidebar-collapsed .sidebar {
    width: 60px;
    padding: 14px 8px 12px;
  }
  .app.is-sidebar-collapsed .sb__top {
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 4px 0 14px 0;
    margin-bottom: 4px;
  }
  .app.is-sidebar-collapsed .sb__brand,
  .app.is-sidebar-collapsed .sb__icon-btn:not(#sidebarToggle) { display: none; }
  .app.is-sidebar-collapsed #sidebarToggle {
    width: 36px;
    height: 36px;
    border-radius: 7px;
  }
  .app.is-sidebar-collapsed .sb__item {
    font-size: 0;
    justify-content: center;
    padding: 0;
    width: 36px;
    height: 36px;
    margin: 0 auto 2px;
    border-radius: 7px;
    gap: 0;
  }
  .app.is-sidebar-collapsed .sb__item .meta,
  .app.is-sidebar-collapsed .sb__item .recent-share { display: none; }
  .app.is-sidebar-collapsed .sb__group:has(.sb__item--recent) { display: none; }
  .app.is-sidebar-collapsed .sb__footer { justify-content: center; }
  .app.is-sidebar-collapsed .sb__user-info { display: none; }
  .app.is-sidebar-collapsed .sb__settings-wrap { width: 36px; }
  .app.is-sidebar-collapsed .sb__user {
    padding: 0;
    width: 36px;
    height: 36px;
    min-width: 36px;
    margin: 0 auto;
    justify-content: center;
    border-radius: 7px;
  }
  .app.is-sidebar-collapsed .sb__avatar {
    width: 24px;
    height: 24px;
    font-size: 11px;
  }
  .app.is-sidebar-collapsed .sb__menu {
    left: 100%;
    bottom: 0;
    margin-left: 6px;
  }

  /* — Brand row + icon buttons — */
  .sb__top {
    display: flex; align-items: center;
    gap: 4px;
    padding: 4px 6px 14px 6px;
    margin-bottom: 4px;
  }
  .sb__brand {
    display: flex; align-items: center; gap: 10px;
    flex: 1; min-width: 0;
  }
  .sb__logo {
    width: 22px; height: 22px;
    border-radius: 6px;
    background: var(--crail-base);
    display: grid; place-items: center;
    color: #fff;
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 11px;
    flex-shrink: 0;
    letter-spacing: -0.02em;
  }
  .sb__name {
    font-weight: 600;
    letter-spacing: -0.01em;
    font-size: 18px;
  }
  .sb__icon-btn {
    width: 28px; height: 28px;
    border-radius: 7px;
    border: 0;
    background: transparent;
    /* alert-dot (absolute) 가 있어도 svg 가 정중앙에 오도록 single cell 강제 */
    display: grid; place-items: center;
    grid-template: 1fr / 1fr;
    cursor: pointer;
    color: var(--ink-1);
    flex-shrink: 0;
    position: relative;
  }
  .sb__icon-btn:hover { background: var(--hover-bg); }
  .sb__icon-btn .ico { width: 18px; height: 18px; opacity: 0.75; }

  /* 새 알림 인디케이터 */
  .sb__icon-btn--has-alert .ico { opacity: 1; }
  .sb__icon-btn--has-alert .alert-dot {
    position: absolute;
    top: 4px; right: 4px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--crail-base);
    border: 1.5px solid var(--sidebar);
  }

  /* — Nav groups — */
  .sb__group { margin-bottom: 24px; }

  /* recents 영역만 자체 스크롤 (mouse wheel/trackpad). 스크롤바 시각 0 — 사이드바 룩 일정. */
  .sb__top, .sb__footer { flex-shrink: 0; }
  .sidebar > .sb__group:not(.sb__group--recents) { flex-shrink: 0; }
  .sb__group--recents {
    flex: 1;
    min-height: 0;
    margin-bottom: 0;
    overflow-y: auto;
    scrollbar-width: none;
    padding-top: 16px;
  }
  .sb__group--recents::-webkit-scrollbar { display: none; }
  .sb__label {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-3);
    padding: 4px 8px 8px;
  }

  .sb__item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 8px;
    border-radius: 8px;
    line-height: 1.3;
    color: var(--ink-1);
    cursor: default;
  }
  .sb__item .ico {
    width: 18px; height: 18px;
    flex-shrink: 0;
    opacity: 0.75;
  }
  .sb__item:hover { background: var(--hover-bg); }
  .sb__item--active {
    background: var(--hover-bg);
    font-weight: 500;
  }
  .sb__item--active .ico { opacity: 1; color: var(--crail-base); }
  .sb__item[data-category] { cursor: pointer; }
  /* recents 롱프레스 — iOS callout/텍스트 선택/preview 차단해 커스텀 timer (entries.js) 살림 */
  .sb__item--recent {
    cursor: pointer;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  /* — 가계부 월누적 — */
  .sb__item .meta {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: -0.01em;
  }

  /* Recents — 모두 동일하게 회색 ink-3, 우측에 공유 대상 표시 */
  .sb__item--recent {
    padding: 12px 8px;
    color: var(--ink-3);
    font-size: 14px;
  }
  .sb__item--recent:hover { color: var(--ink-1); }
  .sb__item--recent .recent-share {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--crail-base);
    flex-shrink: 0;
  }
  /* 1년 전 글 라벨 — '소연'과 동일 사이즈 (11px) */
  .sb__item--recent .recent-share--year {
    color: var(--ink-4);
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 400;
    letter-spacing: -0.01em;
  }

  /* — Footer (좌하단 사용자 카드 + popover) — */
  .sb__footer {
    padding: 8px 0 0;
    border-top: 1px solid var(--line-soft);
    margin-top: 6px;
    display: flex;
    justify-content: stretch;
  }
  .sb__settings-wrap { position: relative; width: 100%; }

  /* 사용자 카드 — Claude 웹 스타일 (아바타 + 이름 + 플랜) */
  .sb__user {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 8px 6px 6px;
    border-radius: 8px;
    cursor: pointer;
    user-select: none;
    background: transparent;
    border: 0;
    width: 100%;
    text-align: left;
    font-family: inherit;
    color: var(--ink-1);
  }
  .sb__user:hover { background: var(--hover-bg); }
  .sb__user.is-open { background: var(--hover-bg); }
  .sb__avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--crail-base);
    color: #fff;
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 13px;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    letter-spacing: -0.02em;
    position: relative;
    overflow: hidden;
  }
  .sb__avatar-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: inherit;
  }
  .sb__user-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    line-height: 1.2;
    overflow: hidden;
  }
  .sb__user-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-1);
    letter-spacing: -0.01em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* 설정 popover 메뉴 */
  .sb__menu {
    position: absolute;
    bottom: calc(100% + 6px);
    left: 0;
    min-width: 180px;
    background: var(--tone-255);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow-pop);
    padding: 6px;
    display: none;
    z-index: 20;
  }
  .sb__menu.is-open { display: block; }
  .sb__menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 9px;
    border-radius: 6px;
    font-size: 13px;
    color: var(--ink-1);
    cursor: pointer;
    line-height: 1.3;
    user-select: none;
  }
  .sb__menu-item:hover { background: var(--hover-bg); }
  .sb__menu-item .ico { width: 13px; height: 13px; opacity: 0.7; flex-shrink: 0; }
  .sb__menu-item .shortcut {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-4);
    letter-spacing: 0.02em;
  }
  .sb__menu-divider {
    height: 1px;
    background: var(--line-soft);
    margin: 4px 4px;
  }
  /* ============ Main ============ */
  .main {
    flex: 1;
    padding: 22px 32px 24px;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .main__top {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
    gap: 12px;
    min-width: 0;
    flex-wrap: nowrap;
  }
  .crumb {
    display: inline-flex;
    align-items: baseline;
    gap: 8px;
    font-size: 14px;
    color: var(--ink-3);
    white-space: nowrap;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 1;
  }
  .crumb__cat {
    font-family: var(--font-sans);
    font-weight: 500;
    color: var(--ink-2);
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  .crumb__sep {
    color: var(--ink-4);
    font-weight: 300;
    white-space: nowrap;
  }
  .crumb__date {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.02em;
    color: var(--ink-3);
    white-space: nowrap;
  }
  .top-actions { flex-shrink: 0; }
  .share .label,
  .share .target { white-space: nowrap; }
  /* 좁은 화면 — 공유 라벨 숨겨 우측 액션 영역 좁힘 (사용자 시각 손상 방지) */
  @media (max-width: 720px) {
    .share .label { display: none; }
  }
  @media (max-width: 540px) {
    .crumb__date { display: none; }
  }
  /* 글 카운트 — 네비/단편 한정. body.is-navi/.is-fiction 일 때만 표시 */
  .crumb__num {
    display: none;
    font-family: var(--font-mono);
    font-feature-settings: 'tnum' 1;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.02em;
    margin-left: 2px;
    align-items: baseline;
  }
  body.is-navi .crumb__num,
  body.is-fiction .crumb__num { display: inline-flex; }
  .crumb__num-hash { color: var(--ink-3); }
  .crumb__num-val  { color: var(--ink-2); }
  .crumb__num.is-empty { display: none !important; }
  .top-actions {
    display: flex; align-items: center; gap: 14px;
  }

  /* Share toggle — minimal: label + switch only */
  .share {
    display: flex; align-items: center; gap: 9px;
    cursor: pointer;
    user-select: none;
    font-size: 14px;
    color: var(--ink-2);
  }
  .share .label { font-weight: 500; }
  .share .target { color: var(--ink-3); }
  .share .switch {
    width: 26px; height: 14px;
    border-radius: 999px;
    background: var(--crail-base);
    position: relative;
    flex-shrink: 0;
  }
  .share .switch::after {
    content: "";
    position: absolute;
    top: 2px; right: 2px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #fff;
  }
  .share--off .switch { background: oklch(86% 0.006 60); }
  .share--off .switch::after { right: auto; left: 2px; }

  .icon-btn {
    width: 28px; height: 28px;
    border-radius: 8px;
    border: 0;
    background: transparent;
    display: grid; place-items: center;
    cursor: pointer;
    color: var(--ink-1);
  }
  .icon-btn:hover { background: var(--hover-bg); }
  .icon-btn .ico { width: 18px; height: 18px; opacity: 0.7; }

  /* 새 글 버튼 — crail 보더 사각 라운드, .icon-btn 비의존 독립 컴포넌트 */
  .new-doc-btn {
    width: 28px; height: 28px;
    border: 1px solid var(--crail-base);
    border-radius: 8px;
    background: transparent;
    color: var(--crail-base);
    display: grid; place-items: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background .15s ease;
  }
  .new-doc-btn:hover { background: rgba(217, 119, 87, 0.08); }
  .new-doc-btn .ico { width: 16px; height: 16px; }

  /* 가계부 — 거래 추가 버튼 (별 컴포넌트, 그대로 유지) */
  .icon-btn--accent {
    border: 1px solid var(--crail-base);
    color: var(--crail-base);
  }
  .icon-btn--accent .ico { opacity: 1; }
  .icon-btn--accent:hover {
    background: rgba(217, 119, 87, 0.08);
  }

  /* main view container — empty-state 세로 중앙 정렬 위해 flex column */
  #mainView {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow-y: auto;
  }

  /* ============ Doc ============ */
  .doc {
    flex: 1;
    padding: 32px 4px 0;
    /* Wave 11.7.2 — overflow: hidden 제거. 자식 (이미지·긴 본문) 이 article 영역 초과 시 잘리던 회귀 fix.
       #mainView (overflow-y: auto) 가 스크롤 처리 — article 자체는 자연 height. */
    max-width: 720px;
    margin: 0 auto;
    width: 100%;
  }
  .doc__h1 {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 10px;
    line-height: 1.3;
    outline: none;
  }
  .doc__h1[contenteditable]:empty::before {
    content: attr(data-empty-title);
    color: var(--ink-4);
  }
  .doc__h1[contenteditable]:empty:not([data-empty-title])::before {
    content: "제목 없음";
    color: var(--ink-4);
  }
  .doc__meta {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-3);
    margin-bottom: 26px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line-soft);
    letter-spacing: -0.01em;
  }
  .doc__meta .save {
    color: var(--ink-3);
  }
  .doc__meta .sep {
    margin: 0 8px;
    color: var(--ink-4);
  }
  .doc__p {
    font-size: 15px;
    line-height: 1.85;
    margin: 0 0 14px;
    color: var(--ink-1);
    text-wrap: pretty;
  }
  .doc__quote,
  .doc__body blockquote {
    border-left: 2px solid var(--crail-base);
    padding: 4px 0 4px 16px;
    margin: 18px 0;
    font-size: 15px;
    line-height: 1.85;
    color: var(--ink-2);
    position: relative;
  }
  /* execCommand('formatBlock', 'blockquote') 결과에 인용 부호 시각 표기 (Keep editor 포팅) */
  .doc__body blockquote::before {
    content: '\201C';
    font-family: var(--font-serif, 'Noto Serif KR', serif);
    font-size: 32px;
    line-height: 1;
    color: var(--crail-base);
    position: absolute;
    left: -2px;
    top: -8px;
    opacity: 0.35;
    pointer-events: none;
  }
  .doc__body blockquote {
    padding-left: 24px;
  }

  /* 빈 카테고리 empty state — 메인 doc 영역 중앙 정렬 */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 60px 20px;
    text-align: center;
    max-width: 720px;
    margin: 0 auto;
    width: 100%;
  }
  .empty-state__heading {
    font-size: 20px;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--ink-3);
    margin: 0;
    line-height: 1.4;
  }
  .empty-state__cta {
    border: 1px solid var(--crail-base);
    background: transparent;
    color: var(--crail-base);
    padding: 8px 18px;
    border-radius: 8px;
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: -0.01em;
    transition: background .15s ease;
  }
  .empty-state__cta:hover {
    background: rgba(217, 119, 87, 0.08);
  }

  /* ============ Doc list (전체 보기 — spec §5.0.2) ============ */
  .doc-list {
    flex: 1;
    max-width: 720px;
    margin: 0 auto;
    width: 100%;
    padding: 28px 4px 24px;
    display: flex;
    flex-direction: column;
  }
  .doc-list__stats {
    display: flex;
    gap: 24px;
    padding: 0 0 22px;
    flex-wrap: wrap;
    justify-content: space-between;
  }
  .doc-list__stat-lab {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-4);
  }
  .doc-list__stat-val {
    margin-top: 8px;
    color: var(--ink-1);
    font-size: 26px;
    font-weight: 500;
    letter-spacing: -0.4px;
    white-space: nowrap;
  }
  .doc-list__stat-suf {
    font-size: 13px;
    color: var(--ink-3);
    font-weight: 400;
    margin-left: 3px;
  }
  .doc-list__chips {
    display: flex;
    gap: 6px;
    padding: 0 0 18px;
    flex-wrap: wrap;
  }
  .doc-list__chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12px;
    color: var(--ink-3);
    border: 1px solid transparent;
    cursor: pointer;
    background: transparent;
    font-family: inherit;
  }
  .doc-list__chip:hover { background: var(--hover-bg); }
  .doc-list__chip.is-active {
    color: var(--ink-1);
    background: var(--hover-bg);
    border-color: var(--line);
  }
  .doc-list__chip-dot { width: 6px; height: 6px; border-radius: 3px; }
  .doc-list__chip-count {
    color: var(--ink-4);
    font-size: 11px;
    font-family: var(--font-mono);
  }
  .doc-list__head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 10px 12px 8px;
    margin-bottom: 4px;
    border-bottom: 1px solid var(--line);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-4);
  }
  .doc-list__head-no { width: 56px; }
  .doc-list__head-title { flex: 1; min-width: 0; }
  .doc-list__head-meta { width: 200px; text-align: right; }

  .doc-list__row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: background .1s;
  }
  .doc-list__row:hover { background: var(--hover-bg); }
  .doc-list__no {
    width: 56px;
    flex-shrink: 0;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-4);
    letter-spacing: 0.02em;
    padding-top: 1px;
  }
  .doc-list__main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .doc-list__line1 {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .doc-list__title {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-1);
    letter-spacing: -0.01em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .doc-list__share {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--crail-base);
    flex-shrink: 0;
  }
  .doc-list__excerpt {
    font-size: 12px;
    color: var(--ink-3);
    line-height: 1.55;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .doc-list__meta {
    width: 200px;
    flex-shrink: 0;
    text-align: right;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: 0.02em;
    padding-top: 2px;
  }
  .doc-list__meta .sep { color: var(--ink-4); }

  /* ============ 가계부 거래 뷰 ============ */
  .expense-view {
    max-width: 720px;
    margin: 0 auto;
    width: 100%;
    padding: 32px 4px 0;
  }
  .expense-view .doc__h1 { margin-bottom: 10px; }
  .expense-list {
    margin-top: 18px;
    border-top: 1px solid var(--line-soft);
  }
  .expense-row {
    display: grid;
    grid-template-columns: 64px 88px 1fr auto;
    gap: 14px;
    align-items: center;
    padding: 14px 4px;
    font-size: 13px;
    color: var(--ink-1);
    line-height: 1.4;
  }
  .expense-row__date {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: 0.02em;
  }
  .expense-row__cat {
    font-size: 13px;
    color: var(--ink-2);
  }
  .expense-row__memo {
    color: var(--ink-1);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .expense-row__amount {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-1);
    letter-spacing: -0.01em;
    text-align: right;
    white-space: nowrap;
  }
  .expense-row__amount .amt-num { color: var(--ink-1); }
  .expense-row__amount .amt-unit {
    color: var(--ink-3);
    font-weight: 400;
    margin-left: 2px;
  }

  /* ===== 가계부 — keep 정보 구조 + 시안 D 톤 ===== */

  /* 큰 헤드라인 — "4월에는 N만원 쓰고 있어요" */
  .exp-headline {
    padding: 24px 0 18px;
  }
  .exp-headline-title {
    font-size: 20px;
    font-weight: 600;
    color: var(--ink-1);
    line-height: 1.4;
    letter-spacing: -0.01em;
  }
  .exp-headline-title strong {
    color: var(--crail-base);
    font-weight: 600;
  }
  .exp-headline-sub {
    font-size: 13px;
    color: var(--ink-3);
    margin-top: 6px;
    line-height: 1.5;
  }
  .exp-headline-sub strong {
    color: var(--crail-base);
    font-weight: 500;
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    letter-spacing: -0.01em;
  }


  /* 카테고리 분포 — typography-driven 수평 막대 리스트 (시안 D §6 정합, 색 박스 X) */
  .exp-cat-list {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
  }
  .exp-cat-row {
    display: grid;
    grid-template-columns: 92px 1fr 76px 40px;
    gap: 16px;
    align-items: center;
    padding: 11px 0;
    border-bottom: 1px solid var(--line-soft);
  }
  .exp-cat-row:last-child { border-bottom: 0; }
  .exp-cat-row__name {
    font-size: 13px;
    color: var(--ink-2);
    letter-spacing: -0.01em;
  }
  .exp-cat-row__bar {
    height: 3px;
    background: var(--hover-bg);
    border-radius: 999px;
    overflow: hidden;
  }
  .exp-cat-row__fill {
    height: 100%;
    background: var(--ink-3);
    border-radius: 999px;
    transition: width .3s ease;
  }
  .exp-cat-row__fill.is-first { background: var(--crail-base); }
  .exp-cat-row__amt {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 13px;
    color: var(--ink-1);
    text-align: right;
    letter-spacing: -0.01em;
    font-weight: 500;
  }
  .exp-cat-row__pct {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 11px;
    color: var(--ink-3);
    text-align: right;
    letter-spacing: -0.01em;
  }
  .exp-cat-row.is-first .exp-cat-row__name { color: var(--ink-1); font-weight: 500; }
  .exp-cat-row.is-first .exp-cat-row__amt { color: var(--crail-base); font-weight: 600; }

  /* 월 네비 */
  .exp-month-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 16px 0 6px;
  }
  .exp-month-nav-btn {
    width: 28px; height: 28px;
    border: 0;
    background: transparent;
    border-radius: 7px;
    display: grid; place-items: center;
    cursor: pointer;
    color: var(--ink-3);
  }
  .exp-month-nav-btn:hover { background: var(--hover-bg); color: var(--ink-1); }
  .exp-month-nav-btn .ico { width: 14px; height: 14px; }
  .exp-month-nav-label {
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-1);
    letter-spacing: -0.01em;
    min-width: 80px;
    text-align: center;
  }

  /* 월간 캘린더 */
  .exp-month-cal { padding: 4px 0 8px; }
  .exp-month-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
  }
  .exp-month-dow-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-column: 1 / -1;
    border-bottom: 1px solid var(--line-soft);
    margin-bottom: 4px;
  }
  .exp-month-dow {
    text-align: center;
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 11px;
    color: var(--ink-3);
    font-weight: 500;
    letter-spacing: 0.04em;
    padding: 6px 0 8px;
  }
  .exp-month-day {
    text-align: center;
    border-radius: 12px;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    position: relative;
    aspect-ratio: 1.7;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: transparent;
  }
  .exp-month-day.empty { cursor: default; }
  .exp-month-day:hover:not(.empty):not(.today) {
    background: var(--hover-bg);
  }
  .exp-month-day.today {
    background: var(--tone-255);
    border-radius: 14px;
    box-shadow:
      2px 6px 10px rgba(20, 18, 14, 0.08),
      4px 12px 28px rgba(20, 18, 14, 0.10),
      6px 20px 40px rgba(20, 18, 14, 0.06);
    transform: translate(-1px, -3px);
    z-index: 2;
  }
  .exp-month-day.is-selected:not(.today) {
    background: var(--tone-255);
    box-shadow:
      0 2px 8px rgba(20, 18, 14, 0.06),
      0 4px 16px rgba(20, 18, 14, 0.04);
    z-index: 1;
  }
  .exp-month-day-num {
    font-size: 15px;
    color: var(--ink-2);
    font-weight: 400;
    line-height: 1;
  }
  .exp-month-day.today .exp-month-day-num {
    font-weight: 600;
    color: var(--ink-1);
    font-size: 16px;
  }
  .exp-month-day-amount {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 11px;
    color: var(--ink-4);
    margin-top: 2px;
    line-height: 1;
    letter-spacing: -0.01em;
  }
  .exp-month-day-amount.high { color: var(--crail-base); }

  /* 모바일: 셀 폭이 좁아 가로 압축이 부담 — 정사각형으로 복귀 */
  @media (max-width: 600px) {
    .exp-month-day { aspect-ratio: 1; }
    .exp-month-grid { gap: 6px; }
  }

  /* 선택일 상세 — keep 카드 시각 흡수 (박스화 + slide-in 애니메이션) */
  .exp-day-detail {
    margin-top: 18px;
    padding: 16px 18px;
    background: var(--sidebar);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-pop);
    animation: expDaySlideIn .2s ease;
  }
  @keyframes expDaySlideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .exp-day-detail__head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
  }
  .exp-day-detail__date {
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-1);
    letter-spacing: -0.01em;
  }
  .exp-day-detail__sum {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 13px;
    color: var(--ink-3);
    letter-spacing: -0.01em;
  }
  .exp-day-detail__empty {
    font-size: 13px;
    color: var(--ink-4);
    padding: 12px 4px;
  }

  /* — Day popover (캘린더 셀 클릭 — 중앙 모달 + backdrop overlay) — */
  .exp-day-popover-overlay {
    position: fixed;
    inset: 0;
    z-index: 49;
    background: rgba(20, 18, 14, 0.34);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease;
  }
  .exp-day-popover-overlay.is-open {
    opacity: 1;
    pointer-events: auto;
  }
  .exp-day-detail.is-popover {
    position: fixed;
    z-index: 50;
    top: 50%;
    left: 50%;
    margin: 0;
    width: min(440px, calc(100vw - 64px));
    max-height: calc(100vh - 80px);
    overflow-y: auto;
    border: 0;
    border-radius: var(--r-lg);
    padding: 22px 24px;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -48%);
    transition: opacity .18s ease, transform .18s ease;
    animation: none;
  }
  .exp-day-detail.is-popover.is-open {
    opacity: 1;
    transform: translate(-50%, -50%);
    pointer-events: auto;
  }
  .exp-day-detail.is-popover .exp-day-detail__head {
    margin-bottom: 6px;
  }
  .exp-day-detail.is-popover .exp-day-detail__date {
    font-size: 16px;
    font-weight: 600;
    color: var(--ink-1);
    letter-spacing: -0.01em;
  }

  /* popover 거래 row — 2줄 (금액 + 매출처/카드 메타) */
  .exp-popover-row {
    display: grid;
    grid-template-columns: 56px 1fr auto auto;
    gap: 14px;
    align-items: baseline;
    padding: 12px 0;
  }
  .exp-popover-row__cat {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 10.5px;
    color: var(--ink-3);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .exp-popover-row__merchant {
    font-size: 13px;
    color: var(--ink-1);
    font-weight: 400;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .exp-popover-row__card {
    font-size: 11px;
    color: var(--ink-4);
  }
  .exp-popover-row__amount {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 13px;
    font-weight: 400;
    color: var(--ink-1);
    letter-spacing: -0.01em;
    text-align: right;
  }
  .exp-popover-row__amount .amt-num { color: var(--ink-1); }
  .exp-popover-row__amount .amt-unit {
    color: var(--ink-3);
    margin-left: 2px;
  }
  .exp-popover-row .exp-row__recurring {
    margin-left: 4px;
  }

  /* popover 풋터 — 건수 + 합계 */
  .exp-day-detail__foot {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-top: 14px;
    margin-top: 6px;
  }
  .exp-day-detail__foot-count {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 12px;
    color: var(--ink-3);
    letter-spacing: -0.01em;
  }
  .exp-day-detail__foot-sum {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 13px;
    font-weight: 400;
    color: var(--ink-1);
    letter-spacing: -0.01em;
  }
  .exp-row__recurring {
    display: inline-block;
    width: 11px;
    height: 11px;
    margin-left: 6px;
    color: var(--ink-3);
    opacity: 0.6;
    vertical-align: -1px;
  }

  /* 브랜드 랭킹 */
  .exp-rank-section { margin-top: 38px; }
  .exp-rank-1 {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    background: var(--sidebar);
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-top: 14px;
  }
  .exp-rank-1__num {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 13px;
    color: var(--ink-3);
    font-weight: 500;
    width: 18px;
    text-align: center;
    letter-spacing: -0.01em;
  }
  .exp-rank-1__avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--crail-base);
    color: #fff;
    display: grid; place-items: center;
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: -0.02em;
    flex-shrink: 0;
  }
  .exp-rank-1__info {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    gap: 3px;
  }
  .exp-rank-1__name {
    font-size: 16px;
    font-weight: 600;
    color: var(--ink-1);
    letter-spacing: -0.01em;
  }
  .exp-rank-1__meta {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: -0.01em;
  }
  .exp-rank-1__amt {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 18px;
    font-weight: 600;
    color: var(--ink-1);
    letter-spacing: -0.02em;
  }

  /* 2~7위 그리드 */
  .exp-rank-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-top: 14px;
  }
  .exp-rank-card {
    display: grid;
    grid-template-columns: 18px 32px 1fr;
    gap: 12px;
    align-items: center;
    padding: 12px 14px;
    background: var(--sidebar);
    border: 1px solid var(--line);
    border-radius: 10px;
    transition: background .15s ease, border-color .15s ease;
    cursor: pointer;
  }
  .exp-rank-card:hover {
    background: var(--hover-bg);
    border-color: var(--line-soft);
  }
  .exp-rank-card__num {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 12px;
    color: var(--ink-3);
    font-weight: 500;
    text-align: center;
    letter-spacing: -0.01em;
  }
  .exp-rank-card__chip {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--hover-bg);
    color: var(--ink-2);
    display: grid; place-items: center;
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: -0.02em;
    flex-shrink: 0;
  }
  .exp-rank-card__main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .exp-rank-card__name {
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-1);
    letter-spacing: -0.01em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .exp-rank-card__amt {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-2);
    letter-spacing: -0.01em;
    flex-shrink: 0;
  }

  @media (max-width: 600px) {
    .exp-rank-grid { grid-template-columns: 1fr; }
  }

  /* 누적 섹션 */
  .exp-cumulative {
    margin-top: 0;
  }

  /* 통계 큰 section (월간 컨텐츠 ↔ 연간 컨텐츠) 사이 분리 hairline */
  .exp-stats-section + .exp-stats-section {
    margin-top: 38px;
    padding-top: 28px;
    border-top: 1px solid var(--line-soft);
  }
  .exp-cumulative-rank {
    margin-top: 24px;
  }
  .exp-cumulative-rank__row {
    display: grid;
    grid-template-columns: 22px 36px 1fr auto;
    gap: 14px;
    align-items: center;
    padding: 11px 4px;
  }
  .exp-cumulative-rank__row:last-child { border-bottom: 0; }
  .exp-cumulative-rank__num {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 12px;
    color: var(--ink-3);
    text-align: center;
    letter-spacing: -0.01em;
  }
  .exp-cumulative-rank__chip {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--hover-bg);
    color: var(--ink-2);
    display: grid; place-items: center;
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: -0.02em;
  }
  .exp-cumulative-rank__row:first-child .exp-cumulative-rank__chip {
    background: var(--crail-base);
    color: #fff;
  }
  .exp-cumulative-rank__name {
    font-size: 13px;
    color: var(--ink-1);
    letter-spacing: -0.01em;
    font-weight: 500;
  }
  .exp-cumulative-rank__amt {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-1);
    letter-spacing: -0.01em;
  }

  /* 인라인 입력 행 — + 버튼 클릭 시 목록 최상단 추가 */
  .expense-row--input {
    background: rgba(217, 119, 87, 0.04);
    border-left: 2px solid var(--crail-base);
    padding-left: 10px;
  }
  .expense-row--input input {
    border: 0;
    background: transparent;
    font-family: inherit;
    font-size: inherit;
    color: inherit;
    outline: 0;
    width: 100%;
    padding: 2px 0;
    letter-spacing: inherit;
  }
  .expense-row--input input::placeholder { color: var(--ink-4); }
  .expense-row--input .expense-row__date input {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-3);
  }
  .expense-row--input .expense-row__amount input {
    font-family: var(--font-mono);
    font-size: 13px;
    text-align: right;
  }

  /* ============ Bottom toolbar (입력창 — 댓글) ============ */
  .bottombar {
    margin: 16px auto 0;
    max-width: 720px;
    width: 100%;
  }

  .composer {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 16px;
    display: flex; align-items: center; gap: 8px;
    box-shadow: 0 4px 12px -8px rgba(20, 18, 14, 0.08);
  }
  .composer .ico { width: 18px; height: 18px; opacity: 0.55; flex-shrink: 0; }
  .composer__return { opacity: 0.4 !important; color: var(--ink-3); margin-left: 4px; }
  .composer input {
    flex: 1;
    border: 0; outline: 0; background: transparent;
    font-family: var(--font-sans);
    font-size: 14px;
    color: var(--ink-1);
    padding: 4px 0;
  }
  .composer input::placeholder { color: var(--ink-4); }

  /* ============ Edit toolbar (상단 편집 도구 뎠라운 리본) ============ */
  .edit-trigger {
    width: 28px; height: 28px;
    border-radius: 8px;
    border: 0;
    background: transparent;
    display: grid; place-items: center;
    cursor: pointer;
    color: var(--ink-1);
    transition: background .15s ease, color .15s ease;
  }
  .edit-trigger:hover { background: var(--hover-bg); }
  .edit-trigger.is-open {
    background: var(--crail-base);
    color: #fff;
  }
  .edit-trigger .ico { width: 18px; height: 18px; opacity: 0.9; }
  .edit-trigger.is-open .ico { opacity: 1; }
  .edit-trigger__label {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0;
    line-height: 1;
    opacity: 0.85;
  }
  .edit-trigger.is-open .edit-trigger__label { opacity: 1; }

  .edit-toolbar {
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transform: translateY(-4px);
    transition: max-height .25s ease, opacity .2s ease, transform .25s ease, padding .25s ease, border-color .25s ease;
    border-bottom: 1px solid transparent;
  }
  .edit-toolbar.is-open {
    max-height: 64px;
    opacity: 1;
    transform: translateY(0);
    padding: 10px 0;
    border-bottom-color: var(--line-soft);
    /* H 드롭다운이 toolbar 박스 밖으로 펼쳐질 수 있도록 */
    overflow: visible;
  }
  .edit-toolbar__inner {
    max-width: 720px;
    margin: 0 auto;
    display: flex; align-items: center;
    gap: 4px;
    flex-wrap: wrap;
  }
  .et-btn {
    height: 30px;
    min-width: 30px;
    padding: 0 8px;
    border: 0;
    background: transparent;
    border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    cursor: pointer;
    color: var(--ink-1);
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 500;
  }
  .et-btn:hover { background: var(--hover-bg); }
  .et-btn .ico { width: 16px; height: 16px; opacity: 0.85; }
  .et-btn--bold { font-weight: 700; }
  .et-btn--italic { font-style: italic; font-weight: 500; }
  .et-btn--underline { text-decoration: underline; }
  .et-divider {
    width: 1px;
    height: 18px;
    background: var(--line);
    margin: 0 4px;
  }

  /* ============ Keep editor 포팅 — 플로팅 버블 / Aa 팝업 ============ */
  /* 본문 단일 폰트·사이즈 강제 — 외부 paste 또는 historical h1/h2/h3 가 들어와도
     본문 디폴트로 시각화. plaintext paste handler (entries.js) 와 이중 안전망. */
  .doc__body {
    font-size: 15px;
    line-height: 1.85;
    color: var(--ink-1);
  }
  .doc__body,
  .doc__body * {
    font-family: var(--font-sans) !important;
  }
  .doc__body h1,
  .doc__body h2,
  .doc__body h3,
  .doc__body h4,
  .doc__body h5,
  .doc__body h6,
  .doc__body p,
  .doc__body div,
  .doc__body li,
  .doc__body blockquote {
    font-size: 15px !important;
    line-height: 1.85 !important;
    font-weight: inherit !important;
    color: var(--ink-1);
  }
  .doc__body h1,
  .doc__body h2,
  .doc__body h3,
  .doc__body h4,
  .doc__body h5,
  .doc__body h6 {
    margin: 0 0 14px;
  }
  /* 인라인 강조 (b/i/u/s) 와 인용/리스트는 사용자 의도라 보존 */

  /* 플로팅 인라인 버블 — 본문 텍스트 선택 시 */
  #floatingToolbar {
    position: fixed;
    z-index: 999;
    background: #1c1c1e;
    border-radius: 10px;
    padding: 4px;
    display: none;
    align-items: center;
    gap: 1px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25), 0 1px 4px rgba(0, 0, 0, 0.15);
    animation: popIn 0.12s ease;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.92); }
    to   { opacity: 1; transform: scale(1); }
  }
  #floatingToolbar.show { display: flex; }
  #floatingToolbar::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 10px;
    background: #1c1c1e;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
  }
  .ft-btn {
    width: 30px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    color: rgba(255, 255, 255, 0.75);
    font-size: 13px;
    font-weight: 700;
    font-family: 'Pretendard', sans-serif;
    transition: 0.1s;
    flex-shrink: 0;
  }
  .ft-btn:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }
  .ft-btn.highlight-btn {
    font-size: 13px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.8);
    letter-spacing: -0.5px;
  }
  .ft-btn.highlight-btn .hl-inner {
    background: rgba(251, 191, 36, 0.5);
    border-radius: 3px;
    padding: 1px 4px;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    line-height: 1.3;
    letter-spacing: 0;
  }
  .ft-btn.highlight-btn:hover .hl-inner { background: rgba(251, 191, 36, 0.8); }

  /* Aa 팝업 (모바일/태블릿) */
  .lp-popup-overlay {
    position: fixed;
    inset: 0;
    z-index: 9900;
    background: rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity 0.35s cubic-bezier(0.2, 0.6, 0.3, 1);
    pointer-events: none;
  }
  .lp-popup-overlay.open { opacity: 1; pointer-events: auto; }
  .lp-popup-card {
    position: fixed;
    z-index: 10000;
    background: var(--panel, #fff);
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25), 0 4px 12px rgba(0, 0, 0, 0.1);
    overflow: hidden;
    transform: scale(0.92) translateY(6px);
    opacity: 0;
    transition: transform 0.28s cubic-bezier(0.2, 0.7, 0.2, 1.04), opacity 0.22s cubic-bezier(0.2, 0.6, 0.3, 1);
    pointer-events: none;
    max-width: 320px;
    width: calc(100vw - 48px);
  }
  .lp-popup-card.open {
    transform: scale(1) translateY(0);
    opacity: 1;
    pointer-events: auto;
  }
  .lp-popup-menu { padding: 6px 0; }
  .lp-popup-menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 18px;
    font-size: 15px;
    color: var(--text);
    cursor: pointer;
    transition: background 0.1s;
    user-select: none;
  }
  .lp-popup-menu-item:hover { background: rgba(0, 0, 0, 0.03); }
  .lp-popup-menu-item:active { background: rgba(0, 0, 0, 0.06); }
  .lp-popup-menu-item span { flex: 1; text-align: left; }
  .lp-popup-menu-item svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
    opacity: 0.45;
  }
  .lp-popup-sep { height: 1px; background: var(--line); margin: 6px 0; }
  .aa-h-icon {
    font-family: var(--font-serif, 'Noto Serif KR', serif);
    font-size: 16px;
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: -0.5px;
    line-height: 1;
    flex-shrink: 0;
    opacity: 0.45;
    margin-left: auto;
  }
  .aa-h-icon sub {
    font-size: 10px;
    font-weight: 500;
    vertical-align: baseline;
    position: relative;
    top: 1px;
  }

  /* ============ 가계부 — 월별 추이 막대 차트 (typography-driven) ============ */
  .exp-bar-chart-section {
    margin-top: 38px;
  }
  .exp-bar-chart {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 12px;
    align-items: end;
    margin-top: 18px;
    min-height: 110px;
  }
  .exp-bar {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .exp-bar__col {
    width: 100%;
    height: 80px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .exp-bar__fill {
    width: 100%;
    max-width: 36px;
    background: var(--ink-3);
    opacity: 0.18;
    border-radius: 3px;
    transition: opacity .15s ease, background .15s ease;
  }
  .exp-bar.is-current .exp-bar__fill {
    background: var(--crail-base);
    opacity: 1;
  }
  .exp-bar__amount {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-3);
    margin-top: 6px;
    letter-spacing: -0.01em;
  }
  .exp-bar.is-current .exp-bar__amount {
    color: var(--crail-base);
    font-weight: 500;
  }
  .exp-bar__label {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-4);
    letter-spacing: 0.02em;
  }
  .exp-bar.is-current .exp-bar__label {
    color: var(--ink-3);
    font-weight: 500;
  }

  /* ============ 카테고리 가로 막대 (트리맵 → 막대 차트 교체) ============ */
  .exp-treemap-section { margin-top: 24px; }

  .exp-cat-list { display: flex; flex-direction: column; }
  .exp-cat-row {
    display: grid;
    grid-template-columns: 88px 1fr 64px;
    gap: 16px;
    align-items: center;
    padding: 10px 4px;
    cursor: pointer;
    border-radius: 6px;
    transition: background .12s ease;
  }
  .exp-cat-row:hover { background: var(--hover-bg); }
  .exp-cat-row__label {
    font-family: var(--font-sans);
    font-size: 13px; font-weight: 500;
    color: var(--ink-2);
    letter-spacing: -0.01em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .exp-cat-row.is-top .exp-cat-row__label { color: var(--ink-1); font-weight: 600; }
  .exp-cat-row__track { width: 100%; height: 6px; background: transparent; position: relative; }
  .exp-cat-row__fill {
    height: 100%;
    background: var(--ink-3);
    opacity: 0.18;
    border-radius: 3px;
    transition: opacity .15s ease, background .15s ease;
  }
  .exp-cat-row.is-top .exp-cat-row__fill { background: var(--crail-base); opacity: 1; }
  .exp-cat-row__amt {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 13px; font-weight: 500;
    color: var(--ink-2);
    letter-spacing: -0.01em;
    text-align: right;
  }
  .exp-cat-row.is-top .exp-cat-row__amt { color: var(--ink-1); font-weight: 600; }

  .exp-cat-more {
    margin-top: 8px;
    padding: 10px 4px;
    background: transparent;
    border: 0;
    width: 100%;
    text-align: left;
    font-family: var(--font-sans);
    font-size: 12px; font-weight: 500;
    color: var(--ink-3);
    letter-spacing: -0.01em;
    cursor: pointer;
    border-radius: 6px;
    transition: background .12s ease, color .12s ease;
  }
  .exp-cat-more:hover { background: var(--hover-bg); color: var(--ink-2); }

  @media (max-width: 600px) {
    .exp-cat-row { grid-template-columns: 72px 1fr 56px; gap: 12px; }
  }

  /* ============ 연간 가맹점 버블 (keep _packCircles — accent-crail rank tier) ============ */
  .exp-yearly-bubble-section {
    margin-top: 28px;
  }
  .exp-yearly-bubble-wrap {
    position: relative;
    width: 100%;
    margin: 0 auto;
    overflow: hidden;
  }
  .exp-yearly-bubble {
    position: absolute;
    border-radius: 50%;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease;
    /* 사용자 피드백 #9: 정적 배경·선·그림자 제거 (hover 시각만 유지) */
  }
  .exp-yearly-bubble:hover {
    transform: scale(1.08);
    box-shadow: 0 4px 16px rgba(20,18,14,0.16);
    z-index: 2;
  }
  .exp-yearly-bubble:active {
    transform: scale(0.96);
  }
  .exp-yearly-bubble__inner {
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .exp-yearly-bubble__name {
    color: #fff;
    font-weight: 400;
    font-family: var(--font-sans);
    letter-spacing: -0.02em;
    text-align: center;
    line-height: 1.1;
  }
  .exp-yearly-bubble--tier-1 .exp-yearly-bubble__inner,
  .exp-yearly-bubble--tier-2 .exp-yearly-bubble__inner,
  .exp-yearly-bubble--tier-3 .exp-yearly-bubble__inner,
  .exp-yearly-bubble--tier-4 .exp-yearly-bubble__inner,
  .exp-yearly-bubble--tier-5 .exp-yearly-bubble__inner {
    background: transparent;
    border: 1px solid var(--line);
  }
  .exp-yearly-bubble__name { color: var(--ink-2); }

  /* ============ 가맹점 모달 (keep openExpenseFloatingPopup — composer 톤) ============ */
  .exp-fp-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    z-index: 9800;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  .exp-fp-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }
  .exp-fp-card {
    position: fixed;
    background: var(--sidebar);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-pop);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    max-width: 420px;
    width: calc(100vw - 48px);
    max-height: 70vh;
    transform: scale(0.96) translateY(6px);
    opacity: 0;
    transition: transform .22s cubic-bezier(.2,.7,.2,1.04), opacity .18s ease;
    z-index: 9801;
  }
  .exp-fp-overlay.open .exp-fp-card {
    transform: scale(1) translateY(0);
    opacity: 1;
  }
  .exp-fp-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--line-soft);
    flex-shrink: 0;
  }
  .exp-fp-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--ink-1);
    letter-spacing: -0.01em;
  }
  .exp-fp-close {
    width: 28px;
    height: 28px;
    border: 0;
    background: var(--hover-bg);
    border-radius: 50%;
    cursor: pointer;
    display: grid;
    place-items: center;
    color: var(--ink-3);
    transition: background .12s ease, color .12s ease;
    flex-shrink: 0;
  }
  .exp-fp-close:hover {
    background: var(--line);
    color: var(--ink-1);
  }
  .exp-fp-body {
    overflow-y: auto;
    padding: 4px 0;
    flex: 1;
    min-height: 0;
  }
  .exp-fp-body .expense-row {
    padding: 12px 16px;
    border-bottom: 1px solid var(--line-soft);
  }
  .exp-fp-body .expense-row:last-child {
    border-bottom: 0;
  }
  .exp-fp-empty {
    padding: 32px 16px;
    text-align: center;
    font-size: 13px;
    color: var(--ink-4);
  }
  .exp-fp-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    /* Wave 11.6.9 — 합계 위 구분선 제거 (사용자 요구: 모달 컴팩트) */
    flex-shrink: 0;
    background: var(--shell);
  }
  .exp-fp-footer-label {
    font-size: 13px;
    color: var(--ink-3);
    letter-spacing: -0.01em;
  }
  .exp-fp-footer-amount {
    font-size: 15px;
    font-weight: 600;
    color: var(--ink-1);
    font-family: var(--font-mono);
    letter-spacing: -0.01em;
  }

  /* ============ 계정 모달 (.acc-modal-*) — 프로필/통계/휴지통/로그아웃 공통 ============ */
  .acc-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    z-index: 9810;
    opacity: 0;
    transition: opacity .15s ease;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .acc-modal-overlay.open { opacity: 1; }
  .acc-modal-card {
    background: var(--sidebar);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-pop);
    width: 100%;
    max-width: 420px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    transform: translateY(8px);
    transition: transform .15s ease;
  }
  .acc-modal-overlay.open .acc-modal-card { transform: translateY(0); }
  .acc-modal-card.is-wide { max-width: 480px; }

  .acc-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 18px 18px 8px;
  }
  .acc-modal-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--ink-1);
    letter-spacing: -0.01em;
  }
  .acc-modal-close {
    background: transparent;
    border: 0;
    padding: 4px;
    border-radius: 6px;
    color: var(--ink-3);
    cursor: pointer;
    transition: background .12s ease, color .12s ease;
    display: grid;
    place-items: center;
  }
  .acc-modal-close:hover { background: var(--hover-bg); color: var(--ink-1); }
  .acc-modal-body {
    padding: 18px;
    overflow-y: auto;
    flex: 1;
  }
  .acc-modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 16px 18px 18px;
  }

  /* 공통 버튼 */
  .acc-btn {
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-2);
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: -0.01em;
    cursor: pointer;
    transition: background .12s ease, color .12s ease, border-color .12s ease;
  }
  .acc-btn:hover { background: var(--hover-bg); color: var(--ink-1); }
  .acc-btn--primary {
    background: var(--ink-1);
    color: var(--tone-255);
    border-color: var(--ink-1);
  }
  .acc-btn--primary:hover { background: var(--ink-2); border-color: var(--ink-2); color: var(--tone-255); }
  .acc-btn--danger { color: var(--crail-base); }
  .acc-btn--danger:hover {
    background: var(--hover-bg);
    color: var(--crail-base);
    border-color: var(--crail-base);
  }

  /* 프로필 폼 */
  .acc-profile-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
  }
  .acc-profile-avatar {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--crail-base);
    color: #fff;
    display: grid; place-items: center;
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }
  .acc-profile-avatar-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: inherit;
  }
  .acc-profile-upload {
    font-size: 12px;
    color: var(--ink-3);
    letter-spacing: -0.01em;
    line-height: 1.5;
  }
  .acc-profile-upload-link {
    color: var(--ink-1);
    text-decoration: underline;
    cursor: pointer;
  }
  .acc-field-label {
    display: block;
    font-size: 12px;
    color: var(--ink-3);
    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }
  .acc-field-input {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--tone-255);
    font-family: var(--font-sans);
    font-size: 13px;
    color: var(--ink-1);
    letter-spacing: -0.01em;
    transition: border-color .12s ease;
  }
  .acc-field-input:focus {
    outline: none;
    border-color: var(--ink-3);
  }

  /* 휴지통 리스트 */
  .acc-trash-empty {
    padding: 24px 12px;
    text-align: center;
    font-size: 13px;
    color: var(--ink-3);
    letter-spacing: -0.01em;
  }
  .acc-trash-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: center;
    padding: 10px 4px;
    border-bottom: 1px solid var(--line-soft);
  }
  .acc-trash-row:last-child { border-bottom: 0; }
  .acc-trash-row__main {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .acc-trash-row__title {
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-1);
    letter-spacing: -0.01em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .acc-trash-row__meta {
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: -0.01em;
  }
  .acc-trash-row__action {
    background: transparent;
    border: 0;
    color: var(--ink-3);
    font-size: 12px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    transition: background .12s ease, color .12s ease;
  }
  .acc-trash-row__action:hover { background: var(--hover-bg); color: var(--ink-1); }

  /* 로그아웃 confirm */
  .acc-confirm-text {
    font-size: 13px;
    color: var(--ink-2);
    letter-spacing: -0.01em;
    line-height: 1.6;
  }

  /* 에디터 ⋯ 메뉴 */
  .doc-more-wrap { position: relative; }
  .doc-more-btn {
    display: grid;
    place-items: center;
    width: 28px; height: 28px;
    background: transparent;
    border: 0;
    border-radius: 6px;
    color: var(--ink-3);
    cursor: pointer;
    transition: background .12s ease, color .12s ease;
  }
  .doc-more-btn:hover { background: var(--hover-bg); color: var(--ink-1); }
  .doc-more-btn .ico { width: 16px; height: 16px; opacity: 0.85; }
  .doc-more-menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    min-width: 160px;
    background: var(--tone-255);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow-pop);
    padding: 8px;
    display: none;
    z-index: 30;
  }
  .doc-more-menu.is-open { display: block; }
  .doc-more-menu__item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 14px;
    color: var(--ink-1);
    cursor: pointer;
    line-height: 1.3;
    user-select: none;
  }
  .doc-more-menu__item:hover { background: var(--hover-bg); }
  .doc-more-menu__item .ico { width: 16px; height: 16px; opacity: 0.7; flex-shrink: 0; }
  .doc-more-menu__item--danger { color: var(--crail-base); }
  .doc-more-menu__item--danger:hover { background: var(--hover-bg); }
  /* 파트너 공유 글 — ⋯ 메뉴 (현재 항목: 글 삭제 단일) 통째 hide */
  .doc-more-wrap[data-read-only="1"] { display: none; }

  /* ============ "더 보기" 버튼 ============ */
  .exp-cat-more-btn {
    margin: 14px auto 0;
    display: block;
    padding: 8px 18px;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
    color: var(--ink-2);
    font-size: 13px;
    font-weight: 500;
    font-family: var(--font-sans);
    letter-spacing: -0.01em;
    transition: background .12s ease, color .12s ease;
  }
  .exp-cat-more-btn:hover {
    background: var(--hover-bg);
    color: var(--ink-1);
  }

  /* 가맹점 클릭 가능 표시 */
  .exp-rank-1, .exp-cumulative-rank__row {
    cursor: pointer;
    transition: background .12s ease;
  }
  .exp-cumulative-rank__row {
    border-radius: 6px;
  }
  .exp-cumulative-rank__row:hover {
    background: var(--hover-bg);
  }
  .exp-rank-1:hover {
    background: var(--hover-bg);
  }

  /* ============ 라우트별 영역 hide (사용자 피드백 #1, #5) ============ */
  /* 댓글창 (composer) — 가계부 view 한정 hide */
  body.is-expense .bottombar { display: none; }
  /* Wave 11.6.10 — 가계부 view 에서 edit-toolbar 자체도 hide (이전 카테고리에서 켜놨던 toolbar 잔존 차단) */
  body.is-expense .edit-toolbar { display: none; }

  /* "소연에게 공유" 토글 — navi 카테고리 한정 (가계부·단편·블로그·메모 모두 hide) */
  body:not(.is-navi) .share { display: none; }
  /* Aa (편집 툴바 trigger) — 가계부만 hide (모든 글쓰기 카테고리에서 표시, Wave 11.6.7) */
  body.is-expense .edit-trigger { display: none; }

  /* 사이드바 가계부 리센츠 — 금액 색 ink-3 (사용자 피드백 #2: 중요값 아님) */
  .sb__item--recent .recent-share--amount {
    color: var(--ink-3);
  }

  /* Phase D — 거래 row highlight (사이드바 리센츠 클릭 → 일자 점프 + 1.5s fade) */
  /* Wave 11.6.9 — SPA timeline 의 .exp-tl-row 도 적용 (회귀 fix) */
  .expense-row.is-highlighted,
  .exp-tl-row.is-highlighted {
    animation: expRowHighlight 1.5s ease;
  }
  @keyframes expRowHighlight {
    0%   { background: rgba(217, 119, 87, 0.30); }
    60%  { background: rgba(217, 119, 87, 0.18); }
    100% { background: rgba(217, 119, 87, 0); }
  }

  /* 거래 없는 일자 클릭 비활성 (사용자 피드백 #7) */
  .exp-month-day.is-zero {
    cursor: default;
    pointer-events: none;
  }
  .exp-month-day.is-zero:hover {
    background: transparent;
    transform: none;
    box-shadow: none;
  }

  /* 다음 달 버튼 disabled (사용자 피드백 #6 — 미래 월 차단) */
  .exp-month-nav-btn:disabled,
  .exp-month-nav-btn.is-disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }
  .exp-month-nav-btn:disabled:hover,
  .exp-month-nav-btn.is-disabled:hover {
    background: transparent;
    color: var(--ink-3);
  }

  /* ============ Phase C — 옵션 L: 탭 구조 [피드][통계] + 검색 + FAB ============ */
  /* 상단 sticky toolbar */
  .exp-toolbar {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--shell);
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 0 12px;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--line-soft);
  }

  /* segmented [피드][통계] */
  .exp-tabs {
    display: inline-flex;
    background: var(--hover-bg);
    border-radius: 8px;
    padding: 2px;
    flex-shrink: 0;
  }
  .exp-tab {
    padding: 6px 14px;
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-3);
    letter-spacing: -0.01em;
    border: 0;
    background: transparent;
    border-radius: 6px;
    cursor: pointer;
    transition: background .12s ease, color .12s ease;
  }
  .exp-tab:hover { color: var(--ink-1); }
  .exp-tab.is-active {
    background: var(--sidebar);
    color: var(--ink-1);
    box-shadow: 0 1px 2px rgba(20,18,14,0.06);
  }

  /* 검색 input bar */
  .exp-search-bar {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    background: var(--hover-bg);
    border: 1px solid transparent;
    border-radius: 8px;
    transition: border-color .15s ease, background .15s ease;
  }
  .exp-search-bar:focus-within {
    background: var(--sidebar);
    border-color: var(--crail-base);
  }
  .exp-search-bar > .ico {
    width: 14px;
    height: 14px;
    color: var(--ink-3);
    flex-shrink: 0;
  }
  .exp-search-bar input {
    flex: 1;
    border: 0;
    outline: 0;
    background: transparent;
    font-family: var(--font-sans);
    font-size: 13px;
    color: var(--ink-1);
    letter-spacing: -0.01em;
    padding: 1px 0;
    min-width: 0;
  }
  .exp-search-bar input::placeholder { color: var(--ink-4); }
  .exp-search-clear {
    display: none;
    width: 18px;
    height: 18px;
    border: 0;
    background: transparent;
    cursor: pointer;
    color: var(--ink-3);
    padding: 0;
    flex-shrink: 0;
  }
  .exp-search-clear:hover { color: var(--ink-1); }
  .exp-search-clear svg { width: 12px; height: 12px; }
  .exp-search-bar.has-value .exp-search-clear { display: grid; place-items: center; }

  /* 탭 panel */
  .exp-tab-panel { display: none; }
  .exp-tab-panel.is-active { display: block; }

  /* 통계 sub-segmented [월간][연간] */
  .exp-stats-tabs {
    display: inline-flex;
    background: var(--hover-bg);
    border-radius: 7px;
    padding: 2px;
    margin: 18px 0 6px;
  }
  .exp-stats-tab {
    padding: 5px 12px;
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-3);
    letter-spacing: -0.01em;
    border: 0;
    background: transparent;
    border-radius: 5px;
    cursor: pointer;
    transition: background .12s ease, color .12s ease;
  }
  .exp-stats-tab:hover { color: var(--ink-1); }
  .exp-stats-tab.is-active {
    background: var(--sidebar);
    color: var(--ink-1);
    box-shadow: 0 1px 2px rgba(20,18,14,0.06);
  }
  .exp-stats-panel { display: none; }
  .exp-stats-panel.is-active { display: block; }

  /* 검색 결과 panel */
  .exp-tab-panel--search { padding-top: 14px; }
  .exp-search-result-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 6px 4px 12px;
    border-bottom: 1px solid var(--line-soft);
    margin-bottom: 6px;
  }
  .exp-search-result-count {
    font-size: 13px;
    color: var(--ink-3);
    font-family: var(--font-mono);
    letter-spacing: -0.01em;
  }
  .exp-search-result-sum {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-1);
    font-family: var(--font-mono);
    letter-spacing: -0.01em;
  }
  .exp-search-empty {
    padding: 32px 16px;
    text-align: center;
    font-size: 13px;
    color: var(--ink-4);
  }
  .exp-tab-panel--search mark {
    background: rgba(217, 119, 87, 0.18);
    color: var(--ink-1);
    padding: 0 2px;
    border-radius: 2px;
  }

  /* keep 흡수 — 일자 그룹 헤더 (피드 timeline 용, 검색 결과 등) */
  .exp-tl-date-group {
    margin-top: 24px;
  }
  .exp-tl-date-group:first-child { margin-top: 8px; }
  .exp-tl-date-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 13px;
    font-weight: 400;
    color: var(--ink-2);
    letter-spacing: -0.01em;
    padding: 8px 4px;
    border-bottom: 1px solid var(--line-soft);
    margin-bottom: 2px;
  }
  .exp-tl-date-header__sum {
    font-family: var(--font-sans);
    font-size: 12px;
    color: var(--ink-3);
    font-weight: 400;
    font-feature-settings: 'tnum' 1;
  }
  .exp-tl-date-group .expense-row {
    border-bottom: 0;
  }
  .exp-tl-date-group .expense-row:last-child {
    border-bottom: 0;
  }

  /* === 새 timeline row — 날짜 그룹 헤더 없음, 각 row가 좌측 날짜 컬럼 가짐 === */
  .exp-tl-row {
    display: grid;
    grid-template-columns: 56px 1fr auto;
    gap: 18px;
    align-items: center;
    padding: 15px 8px;
    border-radius: 8px;
    cursor: pointer;
    transition: background .12s;
    font-size: 13px;
  }
  .exp-tl-row:hover { background: var(--hover-bg); }
  .exp-tl-row.is-cont { padding-top: 5px; }

  /* 날짜 컬럼 — 두 줄 (요일 위, 일자 아래), 모두 가운데 정렬 */
  .exp-tl-row__date {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    line-height: 1.2;
  }
  .exp-tl-row__date.is-cont {
    /* 같은 날 연속 row의 빈 자리 — grid 칸은 유지 */
  }
  .exp-tl-row__date-dow {
    font-size: 11px;
    color: var(--ink-3);
    font-weight: 400;
    text-align: center;
    line-height: 1.2;
  }
  .exp-tl-row__date-d {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 14px;
    font-weight: 400;
    color: var(--ink-2);
    letter-spacing: -0.01em;
    text-align: center;
    line-height: 1.2;
  }

  /* 본문 — 카테고리·카드(상단 회색) / 상호명(하단 본문 톤) */
  .exp-tl-row__body {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }
  .exp-tl-row__head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    min-width: 0;
  }
  .exp-tl-row__cat {
    font-size: 12px;
    color: var(--ink-3);
    flex-shrink: 0;
  }
  .exp-tl-row__card {
    font-size: 12px;
    color: var(--ink-4);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .exp-tl-row__card .exp-row__recurring { margin-left: 4px; }
  .exp-tl-row__merchant {
    font-size: 14px;
    color: var(--ink-1);
    font-weight: 400;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* 금액 — sans + tnum, 숫자/단위 분리 톤 */
  .exp-tl-row__amount {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 13px;
    font-weight: 300;
    color: var(--ink-1);
    letter-spacing: -0.01em;
    text-align: right;
    white-space: nowrap;
  }
  .exp-tl-row__amount .amt-num { color: var(--ink-1); }
  .exp-tl-row__amount .amt-unit {
    color: var(--ink-3);
    font-weight: 400;
    margin-left: 2px;
  }
  .exp-tl-row__amount.is-high .amt-num,
  .exp-tl-row__amount.is-high .amt-unit { color: var(--crail-base); }

  /* ============ Responsive — DESIGN.md §4 ============
     1025↑  데스크톱   244-252 expanded (기본)
     769–1024 태블릿   60px collapse (기존 .is-sidebar-collapsed 자동 적용)
     ↓768  모바일     사이드바 drawer (좌상/좌하 r-lg, 마진 X) + 본문 풀폭 overlay */

  /* drawer backdrop — 모바일 한정 노출 */
  .drawer-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(20, 18, 14, 0.32);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
    z-index: 40;
  }

  /* 햄버거 — 본문 좌상단 (모바일 한정 노출). 데스크톱은 사이드바 안의 #sidebarToggle 사용 */
  .main__hamburger {
    display: none;
    width: 36px; height: 36px;
    border: 0; padding: 0;
    background: transparent;
    border-radius: 7px;
    color: var(--ink-2);
    cursor: pointer;
    place-items: center;
    flex-shrink: 0;
  }
  .main__hamburger:hover { background: var(--hover-bg); color: var(--ink-1); }
  .main__hamburger svg { width: 18px; height: 18px; }

  /* 태블릿 collapse 는 .app.is-sidebar-collapsed 풀 룰셋 (위 §App shell) 을 JS 가 viewport 동기화로 강제 적용 */

  @media (max-width: 768px) {
    /* 모바일 drawer — keep 패턴: width calc(100% - 72px), max 340. 본문 우측 72px 비침 (≈20%) */
    .sidebar {
      position: fixed;
      left: 0; top: 0;
      height: 100vh;
      width: calc(100% - 72px);
      max-width: 340px;
      margin: 0;
      border-radius: 0 var(--r-lg) var(--r-lg) 0;
      transform: translateX(-100%);
      transition: transform .22s ease;
      z-index: 50;
      padding: calc(14px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
    }
    body[data-drawer-open] .sidebar { transform: translateX(0); }
    body[data-drawer-open] .drawer-backdrop { opacity: 1; pointer-events: auto; }

    /* 본문 풀폭 — drawer 활성 시 keep 패턴 (style.css L1617):
       translateX(calc(100% - 72px)) 로 main 을 우측으로 밀어 main 의 좌측면이 우측 끝에 비침.
       opacity .5 + pointer-events none 으로 dim. */
    .main {
      padding: 16px 16px 20px;
      min-width: 0;
      transition: opacity .22s ease, transform .22s ease;
    }
    body[data-drawer-open] .main {
      opacity: .5;
      pointer-events: none;
      transform: translateX(calc(100% - 72px));
    }
    .main__top {
      gap: 8px;
      flex-wrap: nowrap;
      overflow: hidden;
    }
    .main__hamburger { display: inline-grid; }

    /* 본문 가독성 — 모바일에선 max-width 자동, 좌우 padding 최소 */
    .doc { max-width: 100%; }

    /* 폰트 — iOS HIG body 17pt 기준, 모바일 가독성 보강.
       데스크톱 값(.doc__p 15px, .doc__meta 11px, .sb__item 14px 등)이 모바일에 그대로 적용되어 작았음. */
    .doc__h1 { font-size: 26px; }
    .doc__p, .doc__body { font-size: 17px; line-height: 1.7; }
    .doc__body blockquote { font-size: 17px; }
    .doc__meta { font-size: 12px; }
    .sb__item { font-size: 16px; }
    .sb__item--recent { font-size: 15px; }
    .sb__user-name { font-size: 14px; }

    /* doc-list — 모바일 단일 칼럼 카드 스택 (RECENTS "전체 보기" 진입 후) */
    .doc-list {
      padding: 16px 0 24px;
      max-width: 100%;
    }
    .doc-list__stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px 12px;
      padding: 0 0 20px;
    }
    .doc-list__stat-val { font-size: 22px; }
    .doc-list__chips { gap: 8px; padding: 0 0 16px; }
    .doc-list__head { display: none; }
    .doc-list__no { display: none; }
    .doc-list__row {
      flex-direction: column;
      align-items: stretch;
      gap: 4px;
      padding: 12px;
      min-height: 56px;
    }
    .doc-list__main { gap: 4px; }
    .doc-list__title { font-size: 16px; }
    .doc-list__excerpt {
      font-size: 14px;
      white-space: normal;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .doc-list__meta {
      width: auto;
      text-align: left;
      font-size: 12px;
      padding-top: 2px;
    }

    /* 데스크톱 collapse 토글은 모바일에선 무의미 — 숨김 */
    #sidebarToggle { display: none; }

    /* drawer 활성 시 body scroll lock */
    body[data-drawer-open] { overflow: hidden; }
  }

  /* FAB — 우하단 새 글/거래 입력 (터치 디바이스 한정, 모든 라우트 노출).
     라우트별 액션 분기는 newDoc() 안에서 activeCat 으로 처리. */
  .t-fab {
    position: fixed;
    right: 16px;
    bottom: calc(16px + env(safe-area-inset-bottom));
    width: 56px;
    height: 56px;
    padding: 0;
    border-radius: 50%;
    background: var(--crail-base);
    color: var(--tone-255);
    border: 0;
    cursor: pointer;
    box-shadow: var(--shadow-float);
    display: none;
    place-items: center;
    z-index: 100;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .t-fab svg {
    width: 24px;
    height: 24px;
    stroke-width: 2;
  }
  .t-fab:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-pop);
  }
  .t-fab:active {
    transform: translateY(0);
    box-shadow: var(--shadow-inset-soft);
  }
  /* 터치 디바이스 (모바일 + 아이패드) 한정 노출. 데스크톱은 상단 + 버튼 유지. */
  @media (hover: none) and (pointer: coarse) {
    .t-fab { display: grid; }
  }

  /* — main__top action wrapper 토글 (글쓰기/가계부) — */
  .top-actions__navi { display: flex; align-items: center; gap: 14px; }
  .top-actions__expense { display: flex; align-items: center; gap: 10px; }
  body.is-expense .top-actions__navi { display: none; }
  body:not(.is-expense) .top-actions__expense { display: none; }

  /* — 가계부 mini tabs (피드/통계, main__top 우상단) — */
  .exp-mini-tabs {
    display: inline-flex;
    background: var(--hover-bg);
    border-radius: 8px;
    padding: 2px;
  }
  .exp-mini-tab {
    height: 24px;
    padding: 0 10px;
    border: 0;
    background: transparent;
    border-radius: 6px;
    cursor: pointer;
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-3);
    transition: background .15s ease, color .15s ease;
  }
  .exp-mini-tab:hover { color: var(--ink-1); }
  .exp-mini-tab.is-active {
    background: var(--tone-255);
    color: var(--ink-1);
    box-shadow: 0 1px 2px rgba(20, 18, 14, 0.06);
  }

  /* — 가계부 검색 모달 (popover 동일 토큰) — */
  .exp-search-overlay {
    position: fixed; inset: 0; z-index: 49;
    background: rgba(20, 18, 14, 0.34);
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease;
  }
  .exp-search-overlay.is-open { opacity: 1; pointer-events: auto; }
  .exp-search-modal {
    position: fixed; z-index: 50;
    top: 16%; left: 50%;
    width: min(560px, calc(100vw - 64px));
    max-height: 64vh;
    display: flex;
    flex-direction: column;
    background: var(--sidebar);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-pop);
    opacity: 0; pointer-events: none;
    transform: translate(-50%, -8px);
    transition: opacity .18s ease, transform .18s ease;
    overflow: hidden;
  }
  .exp-search-modal.is-open {
    opacity: 1;
    transform: translate(-50%, 0);
    pointer-events: auto;
  }
  .exp-search-modal__head {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px;
  }
  .exp-search-modal__head .ico { width: 16px; height: 16px; color: var(--ink-3); flex-shrink: 0; }
  .exp-search-modal__head input {
    flex: 1; border: 0; outline: 0; background: transparent;
    font-family: var(--font-sans); font-size: 14px;
    color: var(--ink-1);
  }
  .exp-search-modal__head input::placeholder { color: var(--ink-4); }
  .exp-search-modal__body {
    overflow-y: auto;
    padding: 4px 18px 18px;
  }
  .exp-search-modal__empty {
    padding: 32px 4px;
    text-align: center;
    font-size: 13px;
    color: var(--ink-4);
  }
  .exp-search-modal__count {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-3);
    padding: 4px 0 8px;
    letter-spacing: -0.01em;
  }

  /* ═══ Spotlight (⌘K) 검색 모달 ═══ */
  .spotlight-overlay {
    position: fixed; inset: 0;
    background: rgba(20, 18, 14, 0.32);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 1100;
    display: flex; justify-content: center;
    padding-top: 14vh;
    opacity: 0; pointer-events: none;
    transition: opacity .14s ease;
  }
  .spotlight-overlay.is-open { opacity: 1; pointer-events: auto; }
  .spotlight {
    width: min(520px, calc(100vw - 48px));
    max-height: 64vh;
    background: var(--sidebar);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-pop);
    display: flex; flex-direction: column;
    overflow: hidden;
    transform: translateY(-6px) scale(0.985);
    transition: transform .18s cubic-bezier(.2,.8,.2,1);
  }
  .spotlight-overlay.is-open .spotlight { transform: translateY(0) scale(1); }
  .spotlight__head {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line-soft);
  }
  .spotlight__ico {
    width: 16px; height: 16px;
    color: var(--ink-3);
    flex-shrink: 0;
  }
  .spotlight__head input {
    flex: 1;
    border: 0; outline: 0;
    background: transparent;
    padding: 0;
    font-family: var(--font-sans);
    font-size: 16px;
    font-weight: 400;
    color: var(--ink-1);
    letter-spacing: -0.01em;
  }
  .spotlight__head input::placeholder { color: var(--ink-4); }
  .spotlight__esc {
    flex-shrink: 0;
    height: 22px;
    padding: 0 7px;
    border: 1px solid var(--line);
    background: var(--sunken);
    border-radius: 6px;
    color: var(--ink-3);
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 500;
    line-height: 22px;
    cursor: pointer;
    transition: background .12s, color .12s;
  }
  .spotlight__esc:hover { background: var(--hover-bg); color: var(--ink-1); }
  .spotlight__body {
    flex: 1;
    overflow-y: auto;
    padding: 6px 6px 8px;
    min-height: 80px;
  }
  .spotlight-group {
    padding: 6px 0 4px;
  }
  .spotlight-group__label {
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-4);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 4px 12px 6px;
  }
  .spotlight-item {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: background .1s;
  }
  .spotlight-item:hover,
  .spotlight-item.is-active {
    background: var(--hover-bg);
  }
  .spotlight-item__ico {
    width: 14px; height: 14px;
    color: var(--ink-3);
    flex-shrink: 0;
  }
  .spotlight-item.is-active .spotlight-item__ico { color: var(--crail-base); }
  .spotlight-item__main {
    flex: 1;
    min-width: 0;
    display: flex; flex-direction: column;
    gap: 2px;
  }
  .spotlight-item__title {
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-1);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .spotlight-item__meta {
    font-size: 11px;
    color: var(--ink-4);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .spotlight-item__amount {
    font-family: var(--font-sans);
    font-feature-settings: 'tnum' 1;
    font-size: 12px;
    color: var(--ink-2);
    flex-shrink: 0;
  }
  .spotlight-item__amount .amt-unit { color: var(--ink-4); margin-left: 2px; }
  .spotlight-item mark {
    background: oklch(85% 0.05 50 / 0.5);
    color: var(--ink-1);
    border-radius: 2px;
    padding: 0 1px;
  }
  .spotlight-empty {
    padding: 36px 16px;
    text-align: center;
    color: var(--ink-3);
    font-size: 13px;
  }
  .spotlight-empty__sub {
    margin-top: 6px;
    font-size: 11px;
    color: var(--ink-4);
  }
  .spotlight__foot {
    display: flex; gap: 14px;
    padding: 8px 16px;
    border-top: 1px solid var(--line-soft);
    background: var(--sunken);
  }
  .spotlight__hint {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px;
    color: var(--ink-4);
  }
  .spotlight__hint kbd,
  .spotlight__esc {
    font-family: var(--font-sans);
  }
  .spotlight__hint kbd {
    height: 18px;
    min-width: 18px;
    padding: 0 4px;
    background: var(--sidebar);
    border: 1px solid var(--line);
    border-radius: 4px;
    font-size: 10px;
    color: var(--ink-3);
    line-height: 18px;
    text-align: center;
  }

  /* ═══ Phase D — 가계부 거래 입력/수정 모달 (Wave 11.1.5+) ═══ */
  .exp-modal-overlay {
    position: fixed; inset: 0;
    background: rgba(20, 18, 14, 0.42);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    z-index: 1000;
