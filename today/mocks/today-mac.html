    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease;
  }
  .exp-modal-overlay.is-open { opacity: 1; pointer-events: auto; }
  .exp-modal {
    width: min(480px, calc(100vw - 48px));
    max-height: calc(100vh - 64px);
    background: var(--sidebar);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-pop);
    display: flex; flex-direction: column;
    overflow: hidden;
    transform: translateY(8px) scale(0.98);
    transition: transform .22s cubic-bezier(.2,.8,.2,1);
  }
  .exp-modal-overlay.is-open .exp-modal {
    transform: translateY(0) scale(1);
  }
  .exp-modal { position: relative; }
  .exp-modal__head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 22px 6px;
    gap: 12px;
  }
  .exp-modal__title {
    font-size: 16px; font-weight: 600;
    color: var(--ink-1);
    letter-spacing: -0.01em;
  }
  .exp-modal__head-actions {
    display: flex; gap: 4px; align-items: center;
  }
  .exp-modal__icon-btn {
    width: 28px; height: 28px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 0; background: transparent; cursor: pointer;
    border-radius: 8px;
    color: var(--ink-3);
    transition: background .12s, color .12s;
  }
  .exp-modal__icon-btn:hover {
    background: var(--hover-bg);
    color: var(--ink-1);
  }
  .exp-modal__icon-btn--danger:hover {
    color: var(--danger);
    background: oklch(70% 0.13 25 / 0.08);
  }
  .exp-modal__icon-btn .ico { width: 16px; height: 16px; }

  .exp-modal__body {
    padding: 4px 22px 16px;
    overflow-y: auto;
    flex: 1;
    display: flex; flex-direction: column;
    gap: 0;
  }
  .exp-field { display: flex; flex-direction: column; }
  .exp-field__inline-label {
    flex-shrink: 0;
    font-size: 13px; font-weight: 500;
    color: var(--ink-3);
    font-family: var(--font-sans);
  }

  /* paste CTA — 본문 최상단 prominent 버튼 */
  .exp-paste-cta {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%;
    height: 36px;
    margin: 8px 0 4px;
    padding: 0 14px;
    border: 1px solid var(--line);
    background: var(--sunken);
    border-radius: var(--r-md);
    color: var(--ink-2);
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }
  .exp-paste-cta:hover {
    background: var(--hover-bg);
    color: var(--ink-1);
    border-color: var(--ink-4);
  }
  .exp-paste-cta .ico { width: 13px; height: 13px; }

  /* 금액 — 큰 숫자 + 우측 "원" + 1px underline (유일한 시각 분기점) */
  .exp-field--amount {
    flex-direction: row;
    align-items: baseline;
    gap: 6px;
    padding: 10px 2px 8px;
    margin-bottom: 4px;
    border-bottom: 1px solid var(--line);
  }
  .exp-field--amount input {
    flex: 1;
    border: 0; outline: 0;
    background: transparent;
    box-shadow: none;
    padding: 0;
    font-family: var(--font-sans);
    font-size: 17px;
    font-weight: 300;
    color: var(--ink-1);
    letter-spacing: -0.02em;
    font-feature-settings: 'tnum' 1;
  }
  .exp-field--amount input::placeholder {
    color: var(--ink-4);
    font-weight: 300;
  }
  .exp-field--amount__suffix {
    font-size: 14px;
    color: var(--ink-3);
    font-family: var(--font-sans);
  }

  /* row (지출처/카테고리/지출일시/신용카드/메모/URL) — 라벨 좌 + 입력 우, 구분선 없이 padding 만 */
  .exp-field--row {
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 11px 2px;
  }
  .exp-field--row input[type="text"],
  .exp-field--row input[type="url"] {
    flex: 1;
    border: 0; outline: 0;
    background: transparent;
    box-shadow: none;
    padding: 0;
    font-family: var(--font-sans);
    font-size: 14px;
    color: var(--ink-1);
    text-align: right;
  }
  .exp-field--row input::placeholder {
    color: var(--ink-4);
    text-align: right;
  }

  /* 라벨 없는 row (지출처/메모/URL) — 금액 필드와 일관된 구분선 + 좌측 정렬 */
  .exp-field--row[data-field="merchant"] {
    padding: 10px 2px;
    border-bottom: 1px solid var(--line);
  }
  .exp-field--row[data-field="memo"],
  .exp-field--row[data-field="url"] {
    padding: 14px 2px;
    border-bottom: 1px solid var(--line);
  }
  .exp-field--row[data-field="merchant"] input,
  .exp-field--row[data-field="memo"] input,
  .exp-field--row[data-field="url"] input {
    text-align: left;
  }
  .exp-field--row[data-field="memo"] input::placeholder,
  .exp-field--row[data-field="url"] input::placeholder {
    text-align: left;
    color: var(--ink-3);
  }

  /* 지출처 — 금액 필드와 동일 톤 */
  .exp-field--row[data-field="merchant"] input {
    font-size: 17px;
    font-weight: 300;
    color: var(--ink-1);
    letter-spacing: -0.02em;
  }
  .exp-field--row[data-field="merchant"] input::placeholder {
    text-align: left;
    color: var(--ink-4);
    font-weight: 300;
  }

  /* 카테고리 — 라벨 위 + 그리드 항상 노출 */
  .exp-field--cat {
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    padding: 14px 2px 8px;
  }
  .exp-cat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    width: 100%;
  }
  .exp-cat-cell {
    display: inline-flex; align-items: center; justify-content: center;
    height: 34px;
    padding: 0 10px;
    background: var(--sidebar);
    border: 1px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
    font-family: var(--font-sans);
    font-size: 13px;
    color: var(--ink-2);
    font-weight: 500;
    transition: all .12s;
  }
  .exp-cat-cell:hover {
    background: var(--hover-bg);
    color: var(--ink-1);
    border-color: var(--ink-4);
  }
  .exp-cat-cell.is-active {
    /* Wave 11.6.10 — 더 옅은 그레이 (구분만 되는 수준) + 볼드 제거. surface-2 → hover-bg, ink-4 보더 → line, font-weight 600 → 500 (default 유지). */
    background: var(--hover-bg, oklch(97.6% 0.006 60));
    border-color: var(--line, oklch(92% 0.006 60));
    color: var(--ink-1);
    /* font-weight 600 제거 → default 500 */
  }

  /* 카테고리 "더 보기" 토글 — 그리드 아래 우측 텍스트 링크 */
  .exp-cat-toggle {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    align-self: flex-end;
    margin-top: 8px;
    border: 0;
    background: transparent;
    padding: 4px 2px;
    cursor: pointer;
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-3);
    transition: color .12s;
  }
  .exp-cat-toggle:hover { color: var(--ink-1); }
  .exp-cat-toggle .ico {
    width: 10px; height: 10px;
    transition: transform .15s;
  }
  .exp-cat-toggle[aria-expanded="true"] .ico { transform: rotate(180deg); }

  /* collapsed 상태 — 자주 쓰는 4개만 노출 */
  .exp-cat-grid[data-expanded="false"] .exp-cat-cell:not(.exp-cat-cell--rank-top) {
    display: none;
  }

  /* 지출일시 trigger — 점선 underline */
  .exp-dt-trigger {
    display: inline-flex; align-items: center;
    border: 0; background: transparent; cursor: pointer;
    padding: 2px 0;
    font-family: var(--font-sans);
    font-size: 14px;
    color: var(--ink-2);
    border-bottom: 1px dashed var(--ink-4);
    transition: color .12s, border-color .12s;
  }
  .exp-dt-trigger:hover {
    color: var(--ink-1);
    border-bottom-color: var(--ink-2);
  }

  /* 신용카드 trigger — iOS HIG disclosure 스타일 (라벨 좌 + 값 plain text + chevron) */
  .exp-card-trigger {
    display: inline-flex; align-items: center; gap: 4px;
    border: 0;
    background: transparent;
    padding: 0;
    color: var(--ink-1);
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 400;
    cursor: pointer;
    max-width: 220px;
    overflow: hidden;
    transition: color .12s;
  }
  .exp-card-trigger:hover { color: var(--crail-base); }
  .exp-card-trigger > span:first-child {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .exp-card-trigger .ico {
    width: 11px; height: 11px; flex-shrink: 0;
    color: var(--ink-3);
    transition: transform .15s;
  }
  .exp-modal[data-card-open="true"] .exp-card-trigger .ico { transform: rotate(180deg); }

  /* 신용카드 popover */
  .exp-card-popover {
    position: absolute;
    right: 22px;
    z-index: 10;
    min-width: 220px;
    padding: 4px;
    background: var(--sidebar);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-pop);
    display: none;
    flex-direction: column;
  }
  .exp-modal[data-card-open="true"] .exp-card-popover { display: flex; }
  .exp-card-option {
    display: flex; align-items: center;
    height: 32px;
    padding: 0 10px;
    background: transparent;
    border: 0;
    border-radius: var(--r-sm);
    color: var(--ink-2);
    font-family: var(--font-sans);
    font-size: 13px;
    cursor: pointer;
    text-align: left;
    transition: background .12s;
  }
  .exp-card-option:hover { background: var(--hover-bg); color: var(--ink-1); }
  .exp-card-option.is-active {
    background: var(--hover-bg);
    color: var(--ink-1);
    font-weight: 600;
  }

  /* 지출일시 popover — 캘린더 + 시간 stepper */
  .exp-date-popover {
    position: absolute;
    right: 22px;
    z-index: 10;
    width: 280px;
    padding: 12px;
    background: var(--sidebar);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-pop);
    display: none;
    font-family: var(--font-sans);
  }
  .exp-modal[data-date-open="true"] .exp-date-popover { display: block; }
  .exp-date-popover__head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  .exp-date-popover__title {
    font-size: 13px; font-weight: 600;
    color: var(--ink-1);
  }
  .exp-date-nav {
    width: 24px; height: 24px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 0; background: transparent; cursor: pointer;
    border-radius: 6px;
    color: var(--ink-3);
    transition: background .12s, color .12s;
  }
  .exp-date-nav:hover { background: var(--hover-bg); color: var(--ink-1); }
  .exp-date-nav svg { width: 12px; height: 12px; }
  .exp-date-popover__weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    margin-bottom: 4px;
  }
  .exp-date-popover__weekdays span {
    text-align: center;
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-4);
    padding: 4px 0;
  }
  .exp-date-popover__grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }
  .exp-date-cell {
    height: 30px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent;
    border: 0;
    border-radius: 6px;
    color: var(--ink-1);
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 400;
    cursor: pointer;
    transition: all .12s;
  }
  .exp-date-cell:hover { background: var(--hover-bg); }
  .exp-date-cell.is-other { color: var(--ink-4); }
  .exp-date-cell.is-today {
    color: var(--crail-base);
    font-weight: 600;
  }
  .exp-date-cell.is-selected {
    background: var(--ink-1);
    color: var(--tone-255);
    font-weight: 600;
  }
  .exp-date-cell.is-selected:hover { background: var(--ink-1); }
  .exp-date-popover__time {
    display: flex; align-items: center; gap: 4px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--line-soft);
  }
  .exp-date-popover__time input[type="number"] {
    width: 38px;
    text-align: center;
    border: 1px solid var(--line);
    background: var(--sidebar);
    border-radius: var(--r-sm);
    padding: 5px 0;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ink-1);
    -moz-appearance: textfield;
  }
  .exp-date-popover__time input[type="number"]::-webkit-outer-spin-button,
  .exp-date-popover__time input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none; margin: 0;
  }
  .exp-date-popover__time input:focus {
    outline: 0;
    border-color: var(--crail-base);
    box-shadow: 0 0 0 2px oklch(67% 0.12 50 / 0.16);
  }
  .exp-date-popover__colon { color: var(--ink-3); font-weight: 500; }
  .exp-date-popover__today {
    margin-left: auto;
    height: 26px;
    padding: 0 10px;
    border: 1px solid var(--line);
    background: var(--sidebar);
    border-radius: 999px;
    font-family: var(--font-sans);
    font-size: 12px;
    color: var(--ink-2);
    cursor: pointer;
    transition: all .12s;
  }
  .exp-date-popover__today:hover { background: var(--hover-bg); color: var(--ink-1); }
  .exp-field.is-readonly input,
  .exp-field.is-readonly .exp-dt-trigger,
  .exp-field.is-readonly .exp-card-trigger {
    pointer-events: none;
    color: var(--ink-2);
  }
  .exp-field.is-readonly .exp-cat-cell { pointer-events: none; }
  .exp-modal__foot {
    display: flex; gap: 8px; justify-content: flex-end;
    padding: 12px 20px 16px;
    background: var(--shell);
  }
  .exp-modal__btn {
    padding: 8px 16px;
    border-radius: 10px;
    border: 0;
    font-size: 13px; font-weight: 500;
    cursor: pointer;
    font-family: var(--font-sans);
    transition: all .12s;
  }
  .exp-modal__btn--ghost {
    background: transparent;
    color: var(--ink-2);
  }
  .exp-modal__btn--ghost:hover { background: var(--hover-bg); }
  .exp-modal__btn--primary {
    background: var(--ink-1);
    color: var(--tone-255);
  }
  .exp-modal__btn--primary:hover {
    background: var(--black);
    box-shadow: var(--shadow-float);
  }
  .exp-confirm-overlay {
    position: fixed; inset: 0;
    background: rgba(20, 18, 14, 0.5);
    z-index: 1100;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .14s;
  }
  .exp-confirm-overlay.is-open { opacity: 1; pointer-events: auto; }
  .exp-confirm {
    width: min(320px, calc(100vw - 64px));
    background: var(--sidebar);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-pop);
    padding: 18px 20px 14px;
    text-align: center;
  }
  .exp-confirm__msg {
    font-size: 14px;
    color: var(--ink-1);
    line-height: 1.5;
    padding: 4px 0 14px;
  }
  .exp-confirm__actions {
    display: flex; gap: 6px; justify-content: center;
  }
  .exp-confirm__btn {
    flex: 1;
    padding: 8px 0;
    border-radius: 8px;
    border: 0;
    font-size: 13px; font-weight: 500;
    cursor: pointer;
    font-family: var(--font-sans);
    transition: background .12s;
  }
  .exp-confirm__btn--ghost {
    background: var(--hover-bg);
    color: var(--ink-2);
  }
  .exp-confirm__btn--ghost:hover { background: var(--line-soft); }
  .exp-confirm__btn--danger {
    background: rgba(193, 74, 58, 0.1);
    color: #c14a3a;
  }
  .exp-confirm__btn--danger:hover { background: rgba(193, 74, 58, 0.16); }
  .expense-row[data-tx-id], .exp-popover-row[data-tx-id] {
    cursor: pointer;
  }

</style>
</head>
<body>

<!-- ─── Aa 팝업 (모바일/태블릿) — Keep editor 포팅 ─── -->

  (function(){

    const tb = document.getElementById('editToolbar');
    if (!trig || !tb) return;
    trig.addEventListener('click', () => {
      const open = tb.classList.toggle('is-open');
      trig.classList.toggle('is-open', open);
      trig.setAttribute('aria-pressed', open ? 'true' : 'false');
      tb.setAttribute('aria-hidden', open ? 'false' : 'true');
    });
  })();

  // 사용자 카드 popover — 좌하단 카드 클릭시 위로 메뉴 펼침 / 바깥 클릭·ESC 닫힘
  (function(){
    const btn = document.getElementById('userCardBtn');
    const menu = document.getElementById('settingsMenu');
    if (!btn || !menu) return;
    const setOpen = (open) => {
      menu.classList.toggle('is-open', open);
      btn.classList.toggle('is-open', open);
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      menu.setAttribute('aria-hidden', open ? 'false' : 'true');
    };
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      setOpen(!menu.classList.contains('is-open'));
    });
    document.addEventListener('click', (e) => {
      if (!menu.contains(e.target) && e.target !== btn && !btn.contains(e.target)) {
        setOpen(false);
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && menu.classList.contains('is-open')) setOpen(false);
    });
    // 메뉴 항목 클릭 → 액션 디스패치
    menu.querySelectorAll('.sb__menu-item[data-action]').forEach(item => {
      item.addEventListener('click', (e) => {
        e.stopPropagation();
        const action = item.dataset.action;
        setOpen(false);
        if (typeof window.openAccModal === 'function') window.openAccModal(action);
      });
    });
  })();

    const PROFILE = { name: '지오', email: 'gio@example.com', initial: 'G' };

      { title: '여름의 잔상', meta: '단편 · 4월 18일 삭제' },
      { title: '서울 1995', meta: '블로그 · 4월 11일 삭제' },
      { title: '오후 3시의 메모', meta: '메모 · 4월 3일 삭제' }
    ];

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function profileBody() {
      return `
        <div class="acc-profile-row">
          <span class="acc-profile-avatar"><img class="acc-profile-avatar-img" alt="" hidden>${escapeHtml(PROFILE.initial)}</span>
          <div class="acc-profile-upload">
            아바타 이미지<br>
            <span class="acc-profile-upload-link" role="button" tabindex="0">이미지 업로드</span>
          </div>
        </div>
        <div style="margin-bottom:14px;">
          <label class="acc-field-label" for="accProfileName">표시 이름</label>
          <input class="acc-field-input" id="accProfileName" type="text" value="${escapeHtml(PROFILE.name)}">
        </div>
        <div>
          <label class="acc-field-label">이메일</label>
          <div style="font-size:13px;color:var(--ink-2);letter-spacing:-0.01em;">${escapeHtml(PROFILE.email)}</div>
        </div>
      `;
    }

    function trashBody() {
      if (!TRASH.length) {
        return `<div class="acc-trash-empty">휴지통이 비어 있습니다</div>`;
      }
      return TRASH.map((t, i) => `
        <div class="acc-trash-row">
          <div class="acc-trash-row__main">
            <span class="acc-trash-row__title">${escapeHtml(t.title)}</span>
            <span class="acc-trash-row__meta">${escapeHtml(t.meta)}</span>
          </div>
          <button class="acc-trash-row__action" data-trash-idx="${i}">복구</button>
        </div>
      `).join('');
    }

    function logoutBody() {
      return `<p class="acc-confirm-text">로그아웃하면 로컬에 캐시된 글은 유지되지만 동기화는 중단됩니다.<br>다시 로그인할 때까지 알림도 받지 못합니다.</p>`;
    }

    function buildHtml(action) {

      };
      return map[action] || null;
    }

    function close() {
      const overlay = document.getElementById('accModalOverlay');
      if (!overlay) return;
      overlay.classList.remove('open');
      setTimeout(() => overlay.remove(), 150);
    }

    function open(action) {
      close();
      const cfg = buildHtml(action);
      if (!cfg) return;
      const overlay = document.createElement('div');
      overlay.id = 'accModalOverlay';
      overlay.className = 'acc-modal-overlay';
      overlay.innerHTML = `
        <div class="acc-modal-card${cfg.wide ? ' is-wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="accModalTitle">
          <div class="acc-modal-header">
            <span class="acc-modal-title" id="accModalTitle">${cfg.title}</span>
            <button class="acc-modal-close" aria-label="닫기" data-acc-close>
              <svg width="14" height="14" viewBox="0 0 16 16">
                <line x1="2" y1="2" x2="14" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="14" y1="2" x2="2" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <div class="acc-modal-body">${cfg.body}</div>
          <div class="acc-modal-footer">${cfg.footer}</div>
        </div>
      `;
      document.body.appendChild(overlay);
      requestAnimationFrame(() => overlay.classList.add('open'));

      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) close();
        const t = e.target.closest('[data-acc-close]');
        if (t) close();
      });

      const saveBtn = overlay.querySelector('[data-acc-save]');
      if (saveBtn) saveBtn.addEventListener('click', () => {

            PROFILE.name = newName;
            const sbName = document.querySelector('.sb__user-name');
            if (sbName) sbName.textContent = newName;
          }
        }
        close();
      });

      const logoutBtn = overlay.querySelector('[data-acc-confirm-logout]');
      if (logoutBtn) logoutBtn.addEventListener('click', () => {
        close();
        alert('로그아웃 — 구현 예정 (Wave 11.4 Auth)');
      });

        const recover = e.target.closest('[data-trash-idx]');

          recover.disabled = true;
          recover.style.color = 'var(--ink-3)';

      });

      const onKey = (e) => {
        if (e.key === 'Escape') {
          close();
          document.removeEventListener('keydown', onKey);
        }
      };
      document.addEventListener('keydown', onKey);
    }

    window.closeAccModal = close;

    // ═══ keep 흡수 — squarified treemap (renderCategoryTreemap + _squarify + _worstAspect) ═══
    function _worstAspectTreemap(row, rowTotal, totalArea, shortSide) {
      if (shortSide <= 0 || rowTotal <= 0 || totalArea <= 0) return Infinity;
      const rowFrac = rowTotal / totalArea;
      const rowLen = shortSide;
      const rowThickness = rowLen * rowFrac;
      let worst = 0;
      row.forEach(val => {
        const frac = val / rowTotal;
        const cellW = rowThickness;
        const cellH = rowLen * frac;
        if (cellW <= 0 || cellH <= 0) return;
        const aspect = Math.max(cellW / cellH, cellH / cellW);
        if (aspect > worst) worst = aspect;
      });
      return worst;
    }

    function _squarifyTreemap(values, x, y, w, h) {
      const total = values.reduce((s, v) => s + v, 0);
      if (total <= 0 || values.length === 0) return [];
      if (values.length === 1) return [{ x, y, w, h }];

      const rects = [];
      let remaining = values.slice();
      let remainingTotal = total;
      let cx = x, cy = y, cw = w, ch = h;

      while (remaining.length > 0) {
        const isHorizontal = cw >= ch;
        const shortSide = isHorizontal ? ch : cw;
        let row = [remaining[0]];
        let rowTotal = remaining[0];
        let bestAspect = _worstAspectTreemap(row, rowTotal, remainingTotal, shortSide);

        for (let i = 1; i < remaining.length; i++) {
          const testRow = row.concat([remaining[i]]);
          const testTotal = rowTotal + remaining[i];
          const testAspect = _worstAspectTreemap(testRow, testTotal, remainingTotal, shortSide);
          if (testAspect <= bestAspect) {
            row = testRow;
            rowTotal = testTotal;
            bestAspect = testAspect;
          } else break;
        }

        const rowFraction = rowTotal / remainingTotal;
        const rowSize = isHorizontal ? cw * rowFraction : ch * rowFraction;
        let offset = 0;
        row.forEach(val => {
          const frac = val / rowTotal;
          const cellSize = shortSide * frac;
          if (isHorizontal) rects.push({ x: cx, y: cy + offset, w: rowSize, h: cellSize });
          else rects.push({ x: cx + offset, y: cy, w: cellSize, h: rowSize });
          offset += cellSize;
        });

        remaining = remaining.slice(row.length);
        remainingTotal -= rowTotal;
        if (isHorizontal) { cx += rowSize; cw -= rowSize; }
        else { cy += rowSize; ch -= rowSize; }
      }
      return rects;
    }

    // ═══ keep 흡수 — _packCircles + renderYearlyBubbles ═══
    function _packCirclesBubble(items, containerW, containerH) {
      if (!items || items.length === 0) return [];

      const maxAmount = items[0].amount;
      const minR = 14;
      const maxR = Math.min(containerW * 0.32, containerH * 0.40);
      const cx = containerW / 2;
      const cy = containerH / 2;

      const circles = items.map((item, i) => {
        const ratio = Math.sqrt(item.amount / maxAmount);
        const r = Math.max(minR, ratio * maxR);
        return { x: cx, y: cy, r, item, index: i };
      });
      const maxR_actual = circles[0].r;

      // 첫 원 중앙
      circles[0].x = cx;
      circles[0].y = cy;

      // 나머지 — golden angle 시작점
      for (let i = 1; i < circles.length; i++) {
        const angle = i * 2.4;
        const dist = circles[0].r + circles[i].r + 4;
        circles[i].x = cx + Math.cos(angle) * dist * 0.5;
        circles[i].y = cy + Math.sin(angle) * dist * 0.5;
      }

      // Force simulation
      for (let iter = 0; iter < 200; iter++) {
        for (let i = 0; i < circles.length; i++) {
          for (let j = i + 1; j < circles.length; j++) {
            const dx = circles[j].x - circles[i].x;
            const dy = circles[j].y - circles[i].y;
            const dist = Math.sqrt(dx * dx + dy * dy) || 1;
            const minDist = circles[i].r + circles[j].r + 3;
            if (dist < minDist) {
              const overlap = (minDist - dist) / 2;
              const nx = dx / dist;
              const ny = dy / dist;
              const totalR = circles[i].r + circles[j].r;
              const ratioI = circles[j].r / totalR;
              const ratioJ = circles[i].r / totalR;
              circles[i].x -= nx * overlap * ratioI;
              circles[i].y -= ny * overlap * ratioI;
              circles[j].x += nx * overlap * ratioJ;
              circles[j].y += ny * overlap * ratioJ;
            }
          }
        }
        for (let i = 0; i < circles.length; i++) {
          const strength = 0.02 + 0.08 * (circles[i].r / maxR_actual);
          circles[i].x += (cx - circles[i].x) * strength;
          circles[i].y += (cy - circles[i].y) * strength;
        }
        for (let i = 0; i < circles.length; i++) {
          const c = circles[i];
          if (c.x - c.r < 0) c.x = c.r;
          if (c.x + c.r > containerW) c.x = containerW - c.r;
          if (c.y - c.r < 0) c.y = c.r;
          if (c.y + c.r > containerH) c.y = containerH - c.r;
        }
      }
      return circles;
    }

    function renderYearlyBubbles(merchants) {
      if (!merchants || merchants.length === 0) return '';
      const items = merchants.slice(0, 20).map(m => ({
        type: 'brand',
        merchant: m.name,
        amount: m.amount,
        rank: m.rank
      }));
      const containerW = Math.min(680, window.innerWidth - 360);
      const containerH = window.innerWidth <= 768 ? 200 : 280;
      const circles = _packCirclesBubble(items, containerW, containerH);

      // tier 결정 — rank 기준 (1=tier-1, 2-3=tier-2, 4-5=tier-3, 6-8=tier-4, 9+=tier-5)
      const tierFor = (rank) => {
        if (rank === 1) return 1;
        if (rank <= 3) return 2;
        if (rank <= 5) return 3;
        if (rank <= 8) return 4;
        return 5;
      };

      let html = `<div class="exp-yearly-bubble-wrap" style="width:${containerW}px;height:${containerH}px;">`;
      circles.forEach(c => {
        const size = Math.round(c.r * 2);
        const left = Math.round(c.x - c.r);
        const top = Math.round(c.y - c.r);
        const innerSize = Math.max(0, size - 6);
        const fontSize = Math.max(10, Math.round(innerSize * 0.20));
        const item = c.item;
        const initial = item.merchant.length <= 3 ? item.merchant : item.merchant.slice(0, 2);
        const tier = tierFor(item.rank);

        html += `<div class="exp-yearly-bubble exp-yearly-bubble--tier-${tier}" data-merchant="${item.merchant}" onclick="openMerchantDetail('${item.merchant.replace(/'/g, "\\'")}', event)" `;
        html += `style="left:${left}px;top:${top}px;width:${size}px;height:${size}px;">`;
        html += `<div class="exp-yearly-bubble__inner" style="width:${innerSize}px;height:${innerSize}px;">`;
        html += `<span class="exp-yearly-bubble__name" style="font-size:${fontSize}px;">${initial}</span>`;
        html += `</div></div>`;
      });
      html += '</div>';
      return html;
    }

    // ═══ keep 흡수 — openExpenseFloatingPopup + closeExpenseFloatingPopup + openMerchantDetail + loadMoreYearlyRank ═══

    function openExpenseFloatingPopup(title, contentHtml, anchorX, anchorY) {
      closeExpenseFloatingPopup();

      const overlay = document.createElement('div');
      overlay.id = 'expFloatingPopupOverlay';
      overlay.className = 'exp-fp-overlay';

      const popup = document.createElement('div');
      popup.className = 'exp-fp-card';

      const header = `<div class="exp-fp-header">
        <span class="exp-fp-title">${title}</span>
        <button class="exp-fp-close" onclick="closeExpenseFloatingPopup()" aria-label="닫기">
          <svg width="14" height="14" viewBox="0 0 16 16">
            <line x1="2" y1="2" x2="14" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="14" y1="2" x2="2" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>`;
      const body = `<div class="exp-fp-body">${contentHtml}</div>`;

      popup.innerHTML = header + body;
      overlay.appendChild(popup);

      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeExpenseFloatingPopup();
      });
      document.body.appendChild(overlay);

      // 위치 계산 (sync)
      const popupRect = popup.getBoundingClientRect();
      const popupW = popupRect.width || 380;
      const popupH = popupRect.height || 400;
      const winW = window.innerWidth;
      const winH = window.innerHeight;

      let left = (anchorX || winW / 2) - popupW / 2;
      let top = (anchorY || winH / 2 - 100) + 12;
      if (left < 16) left = 16;
      if (left + popupW > winW - 16) left = winW - popupW - 16;
      if (top + popupH > winH - 16) top = (anchorY || winH / 2) - popupH - 12;
      if (top < 16) top = 16;

      popup.style.left = left + 'px';
      popup.style.top = top + 'px';

      // 다음 tick 에 open class 추가 (CSS transition trigger)
      requestAnimationFrame(() => overlay.classList.add('open'));

      const escHandler = (e) => {
        if (e.key === 'Escape') {
          closeExpenseFloatingPopup();
          document.removeEventListener('keydown', escHandler);
        }
      };
      document.addEventListener('keydown', escHandler);
    }

    function closeExpenseFloatingPopup() {
      const overlay = document.getElementById('expFloatingPopupOverlay');
      if (!overlay) return;
      overlay.classList.remove('open');
      setTimeout(() => {
        if (overlay.parentNode) overlay.remove();
      }, 250);
    }

      const total = expenses.reduce((s, e) => s + e.amount, 0);

      let contentHtml = '';
      if (expenses.length === 0) {
        contentHtml = '<div class="exp-fp-empty">내역이 없습니다</div>';
      } else {
        expenses.forEach(t => {
          const repeatSvg = t.recurring
            ? '<svg class="exp-row__recurring" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6L2 8l2 2"/><path d="M2 8h11V5"/><path d="M12 12l2-2-2-2"/><path d="M14 10H3v3"/></svg>'
            : '';
          contentHtml += `

            <span class="exp-fp-footer-amount">${total.toLocaleString('ko-KR')}원</span>
          </div>
        `;
      }

      const cx = ev && ev.clientX ? ev.clientX : window.innerWidth / 2;
      const cy = ev && ev.clientY ? ev.clientY : window.innerHeight / 2 - 100;
      openExpenseFloatingPopup(title, contentHtml, cx, cy);

    function _highlight(text, q) {
      if (!q) return text;

    }

    function onExpSearchInput(ev) {
      const q = (ev.target.value || '').trim();
      _expSearchQuery = q;
      const view = document.querySelector('.expense-view');
      const searchBar = document.querySelector('.exp-search-bar');
      if (!view || !searchBar) return;

      if (q.length === 0) {
        searchBar.classList.remove('has-value');
        view.classList.remove('is-searching');
        // 디폴트 active 탭 복귀
        document.querySelectorAll('.exp-tab-panel').forEach(p => {
          p.classList.toggle('is-active', p.classList.contains('exp-tab-panel--' + _activeExpTab));
        });
        return;
      }

      searchBar.classList.add('has-value');
      view.classList.add('is-searching');

      // 매칭 (memo / category / brand)
      const data = FIXTURE.expense;
      const ql = q.toLowerCase();
      const matches = data.txns.filter(t => {
        return (t.memo || '').toLowerCase().includes(ql) ||
               (t.category || '').toLowerCase().includes(ql) ||
               (t.brand || '').toLowerCase().includes(ql);
      }).sort((a, b) => b.date.localeCompare(a.date));
      const total = matches.reduce((s, t) => s + t.amount, 0);

      const repeatSvg = '<svg class="exp-row__recurring" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6L2 8l2 2"/><path d="M2 8h11V5"/><path d="M12 12l2-2-2-2"/><path d="M14 10H3v3"/></svg>';

      const resultPanel = document.querySelector('.exp-tab-panel--search');
      if (!resultPanel) return;

      if (matches.length === 0) {
        resultPanel.innerHTML = `<div class="exp-search-empty">"${q}" 와 일치하는 거래가 없습니다</div>`;
      } else {
        resultPanel.innerHTML = `
          <div class="exp-search-result-header">
            <span class="exp-search-result-count">${matches.length}건</span>
            <span class="exp-search-result-sum">${formatAmount(total)}</span>
          </div>
          ${matches.map(t => `
            <div class="expense-row" data-tx-id="${t.id}" onclick="jumpToExpenseTx('${t.id}')">
              <span class="expense-row__date">${t.date}</span>
              <span class="expense-row__cat">${_highlight(t.category, q)}</span>
              <span class="expense-row__memo">${_highlight(t.memo, q)}${t.recurring ? repeatSvg : ''}</span>
              <span class="expense-row__amount">${formatAmount(t.amount)}</span>
            </div>
          `).join('')}
        `;
      }

      // search panel 만 active
      document.querySelectorAll('.exp-tab-panel').forEach(p => {
        p.classList.toggle('is-active', p === resultPanel);
      });
    }

    function clearExpSearch() {
      const input = document.getElementById('expSearchInput');
      if (input) input.value = '';
      _expSearchQuery = '';
      const searchBar = document.querySelector('.exp-search-bar');
      const view = document.querySelector('.expense-view');
      if (searchBar) searchBar.classList.remove('has-value');
      if (view) view.classList.remove('is-searching');
      // 디폴트 탭 복귀
      document.querySelectorAll('.exp-tab-panel').forEach(p => {
        p.classList.toggle('is-active', p.classList.contains('exp-tab-panel--' + _activeExpTab));
      });
      if (input) input.focus();
    }

    function openNewExpenseForm() {
      openExpenseModal('new');
    }

    // ═══ Phase D — 사이드바 리센츠 클릭 → 가계부 view 활성화 + 일자 점프 + highlight ═══
    function jumpToExpenseTx(txId) {
      const tx = FIXTURE.expense.txns.find(t => t.id === txId);
      // Wave 11.6.8b — 캘린더 highlight 제거. 사용자 의도: 피드 (timeline) 의 해당 row 만 highlight.
      // _selectedDate set 안 함 → 캘린더 일자 selection X. activeCat 이 expense 가 아닐 때만 view 전환.
      if (activeCat !== 'expense') {
        setCategory('expense');
      }
      // Wave 11.6.9 — SPA timeline 은 .exp-tl-row 클래스 사용 (expenses.js:281). selector 일반화 — 회귀 fix.
      // setCategory 호출 후 SPA 가 timeline 을 다시 그릴 때까지 약간의 시차 → 2 frame 대기.
      requestAnimationFrame(() => requestAnimationFrame(() => {
        const row = document.querySelector(`.exp-tl-row[data-tx-id="${txId}"], .expense-row[data-tx-id="${txId}"]`);
        if (!row) return;
        row.scrollIntoView({block: 'center', behavior: 'smooth'});
        row.classList.add('is-highlighted');
        setTimeout(() => row.classList.remove('is-highlighted'), 1500);
      }));
    }

    function renderExpense() {
      const data = FIXTURE.expense;
      const view = document.getElementById('mainView');
      const mm = String(data.month).padStart(2, '0');
      const todayStr = `${mm}-${String(data.today).padStart(2, '0')}`;
      if (!_selectedDate) _selectedDate = todayStr;

      // 일별 합계 (캘린더용)
      const dailyTotals = {};
      data.txns.forEach(t => {
        dailyTotals[t.date] = (dailyTotals[t.date] || 0) + t.amount;
      });
      const dailyAvg = data.monthTotal / data.today;
      const highThreshold = dailyAvg * 1.6;

      // 월간 캘린더
      const firstDow = new Date(data.year, data.month - 1, 1).getDay();
      const daysInMonth = new Date(data.year, data.month, 0).getDate();
      const cells = [];
      for (let i = 0; i < firstDow; i++) cells.push(null);
      for (let d = 1; d <= daysInMonth; d++) cells.push(d);
      while (cells.length % 7 !== 0) cells.push(null);

      // 사용자 피드백 #6: 미래 월 차단 — 다음 달 disabled flag
      const sysYM = new Date().toISOString().slice(0, 7);
      const currentYM = `${data.year}-${String(data.month).padStart(2, '0')}`;
      const nextDisabled = currentYM >= sysYM;

      const calCells = cells.map(d => {
        if (d === null) return '<div class="exp-month-day empty"></div>';
        const ds = `${mm}-${String(d).padStart(2, '0')}`;
        const total = dailyTotals[ds] || 0;
        const isToday = d === data.today;
        const isSelected = ds === _selectedDate && !isToday;
        const cls = ['exp-month-day'];
        if (isToday) cls.push('today');
        if (isSelected) cls.push('is-selected');
        // 사용자 피드백 #7: 거래 없는 일자 클릭 비활성
        if (total === 0 && !isToday) cls.push('is-zero');
        const amtCls = total >= highThreshold && total > 0 ? 'high' : '';
        const amtTxt = total > 0 ? total.toLocaleString('ko-KR') : '';
        return `
          <div class="${cls.join(' ')}" data-date="${ds}">
            <div class="exp-month-day-num">${d}</div>
            <div class="exp-month-day-amount ${amtCls}">${amtTxt}</div>
          </div>
        `;
      }).join('');

      // 선택일 상세
      const dayTxns = data.txns.filter(t => t.date === _selectedDate);
      const daySum = dayTxns.reduce((s, t) => s + t.amount, 0);
      const repeatSvg = '<svg class="exp-row__recurring" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6L2 8l2 2"/><path d="M2 8h11V5"/><path d="M12 12l2-2-2-2"/><path d="M14 10H3v3"/></svg>';
      const dayRows = dayTxns.length
        ? dayTxns.map(t => `
            <div class="expense-row" data-tx-id="${t.id}">
              <span class="expense-row__date">${t.date}</span>
              <span class="expense-row__cat">${t.category}</span>
              <span class="expense-row__memo">${t.memo}${t.recurring ? repeatSvg : ''}</span>
              <span class="expense-row__amount">${formatAmount(t.amount)}</span>
            </div>
          `).join('')
        : '<div class="exp-day-detail__empty">이 날의 거래가 없습니다.</div>';

      // 옵션 L 피드 탭 — 월 전체 거래 timeline
      // 새 구조: 날짜 그룹 헤더 없음, 각 row가 좌측 날짜 컬럼을 가짐.
      // 같은 날 두 번째 거래부터는 좌측 컬럼 비움(.is-cont).
      const txByDate = {};
      data.txns.forEach(t => {
        if (!txByDate[t.date]) txByDate[t.date] = [];
        txByDate[t.date].push(t);
      });
      const sortedDates = Object.keys(txByDate).sort((a, b) => b.localeCompare(a));
      const timelineHtml = sortedDates.map(dateStr => {
        const [tm, td] = dateStr.split('-').map(Number);
        const dn = ['일','월','화','수','목','금','토'][new Date(data.year, tm - 1, td).getDay()];
        return txByDate[dateStr].map((t, i) => {
          const merchant = t.brand || t.memo;
          const card = t.card || '삼성카드 & MILEAGE PLATINUM';
          const isCont = i > 0;
          const dateCell = isCont
            ? '<div class="exp-tl-row__date is-cont" aria-hidden="true"></div>'
            : `<div class="exp-tl-row__date">
                 <span class="exp-tl-row__date-dow">${dn}</span>
                 <span class="exp-tl-row__date-d">${td}일</span>
               </div>`;
          const isHigh = t.amount >= highThreshold;
          return `
            <div class="exp-tl-row${isCont ? ' is-cont' : ''}" data-tx-id="${t.id}" onclick="openExpenseModal('edit', '${t.id}')">
              ${dateCell}
              <div class="exp-tl-row__body">
                <div class="exp-tl-row__head">
                  <span class="exp-tl-row__cat">${t.category}</span>
                  <span class="exp-tl-row__card">${card}${t.recurring ? repeatSvg : ''}</span>
                </div>
                <div class="exp-tl-row__merchant">${merchant}</div>
              </div>
              <div class="exp-tl-row__amount${isHigh ? ' is-high' : ''}">${formatAmount(t.amount)}</div>
            </div>
          `;
        }).join('');
      }).join('');

      const [sm, sd] = _selectedDate.split('-').map(Number);
      const dowName = ['일','월','화','수','목','금','토'][new Date(data.year, sm - 1, sd).getDay()];

      // 이번 달 헤드라인 (이만원 단위)
      const headlineMan = Math.round(data.monthTotal / 10000);

      // 브랜드 랭킹 — 1위 + 2~7
      const tb = data.topBrand;
      const brandsHtml = data.brands.map(b => `
        <div class="exp-rank-card" onclick="openMerchantDetail('${b.name}', event)">
          <span class="exp-rank-card__num">${b.rank}</span>
          <span class="exp-rank-card__chip">${b.cat}</span>
          <div class="exp-rank-card__main">
            <span class="exp-rank-card__name">${b.name}</span>
            <span class="exp-rank-card__amt">${formatManwon(b.amount)}</span>
          </div>
        </div>
      `).join('');

      // 누적 브랜드 랭킹 — 처음부터 전체 표시 (버블 섹션 제거 후 단일 시각화로 통합)
      const cumBrandsHtml = data.cumulativeBrands.map(b => `
        <div class="exp-cumulative-rank__row" onclick="openMerchantDetail('${b.name}', event)">
          <span class="exp-cumulative-rank__num">${b.rank}</span>
          <span class="exp-cumulative-rank__chip">${b.name.slice(0, 1)}</span>
          <span class="exp-cumulative-rank__name">${b.name}</span>
          <span class="exp-cumulative-rank__amt">${formatManwon(b.amount)}</span>
        </div>
      `).join('');
      const moreBtnHtml = '';

      // 월별 추이 막대 차트 (typography-driven)
      const trendMax = Math.max(...data.monthlyTrend.map(t => t.total));
      const trendBarsHtml = data.monthlyTrend.map(t => {
        const heightPct = Math.max(8, Math.round((t.total / trendMax) * 100));
        return `
          <div class="exp-bar ${t.current ? 'is-current' : ''}">
            <div class="exp-bar__col">
              <div class="exp-bar__fill" style="height:${heightPct}%"></div>
            </div>
            <div class="exp-bar__amount">${Math.round(t.total / 10000)}만</div>
            <div class="exp-bar__label">${t.monthNum}월</div>
          </div>
        `;
      }).join('');

      view.innerHTML = `
        <article class="expense-view">
          <!-- 피드 탭 panel (디폴트) -->
          <div class="exp-tab-panel exp-tab-panel--feed ${_activeExpTab==='feed'?'is-active':''}">
            <!-- 1. 이번 달 헤드라인 -->
            <div class="exp-headline">
            <div class="exp-headline-title">${data.month}월에는 <strong>${headlineMan}만원</strong> 쓰고 있어요</div>
            <div class="exp-headline-sub">하루 평균 <strong>${data.dailyAvg.toLocaleString('ko-KR')}원</strong> 쓰고 있어요</div>
          </div>

          <!-- 2. 월 네비 + 캘린더 + 선택일 상세 -->
          <div class="exp-month-nav">
            <button class="exp-month-nav-btn" type="button" aria-label="이전 달">
              <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4l-4 4 4 4"/></svg>
            </button>
            <span class="exp-month-nav-label">${data.year}년 ${data.month}월</span>
            <button class="exp-month-nav-btn ${nextDisabled ? 'is-disabled' : ''}" type="button" aria-label="다음 달" ${nextDisabled ? 'disabled' : ''}>
              <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l4 4-4 4"/></svg>
            </button>
          </div>

          <div class="exp-month-cal">
            <div class="exp-month-grid">
              <div class="exp-month-dow-row">
                <div class="exp-month-dow">일</div>
                <div class="exp-month-dow">월</div>
                <div class="exp-month-dow">화</div>
                <div class="exp-month-dow">수</div>
                <div class="exp-month-dow">목</div>
                <div class="exp-month-dow">금</div>
                <div class="exp-month-dow">토</div>
              </div>
              ${calCells}
            </div>
          </div>

          <!-- 월 전체 거래 timeline (피드 탭 안 — 캘린더 아래 scroll) -->
          <div class="exp-tl-list">
            ${timelineHtml}
          </div>
          </div>
          <!-- /피드 panel -->

          <!-- 통계 탭 panel — 단일 (월간 + 연간 통합) -->
          <div class="exp-tab-panel exp-tab-panel--stats ${_activeExpTab==='stats'?'is-active':''}">
            <!-- 가맹점 hero + 월별 추이 -->
            <div class="exp-stats-section">
              <div class="exp-rank-section">
                <div class="exp-headline-title">${data.month}월에는 <strong>${tb.name}</strong>에 많이 쓰고 있어요</div>
                <div class="exp-rank-1" onclick="openMerchantDetail('${tb.name}', event)">
                  <span class="exp-rank-1__num">1</span>
                  <span class="exp-rank-1__avatar">${tb.initial}</span>
                  <div class="exp-rank-1__info">
                    <span class="exp-rank-1__name">${tb.name}</span>
                    <span class="exp-rank-1__meta">${tb.count}건 · ${tb.share}%</span>

                  <span class="exp-rank-1__amt">${formatManwon(tb.amount)}</span>

                <div class="exp-rank-grid">${brandsHtml}</div>
              </div>

              <div class="exp-bar-chart-section">
                <div class="exp-headline-title">월별 추이</div>
                <div class="exp-headline-sub">최근 6개월 지출</div>

            <!-- 누적 + 트리맵 + 버블 + 랭킹 -->
            <div class="exp-stats-section">
              <div class="exp-cumulative">
                <div class="exp-headline-title">2026년 ${data.month}월 ${data.today}일까지 총 <strong>${Math.round(data.cumulativeTotal / 10000)}만원</strong> 쓰고 있어요</div>
                <div class="exp-headline-sub">최근 ${data.cumulativeMonthCount}개월 누적</div>

                <div class="exp-treemap-section">
                  <div class="exp-headline-sub" style="margin-top:8px;margin-bottom:8px;">어디에 가장 많이 쓰고 있나요</div>
                  ${renderTreemap(data.cumulativeCategories)}
                </div>

                <div class="exp-cumulative-rank">
                  <div class="exp-headline-sub" style="margin-top:32px;margin-bottom:8px;">누적 브랜드 TOP 10</div>
                  ${cumBrandsHtml}
                  ${moreBtnHtml}
                </div>
              </div>
            </div>
          </div>
          <!-- /통계 panel -->

        </article>
      `;
    }

    function addExpenseInputRow() {
      const list = document.getElementById('expenseList');
      if (!list) return;
      const existing = list.querySelector('.expense-row--input');
      if (existing) {
        existing.querySelector('.expense-row__cat input')?.focus();
        return;
      }
      const today = new Date();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      const inputRow = document.createElement('div');
      inputRow.className = 'expense-row expense-row--input';
      inputRow.innerHTML = `
        <span class="expense-row__date"><input type="text" value="${mm}-${dd}" maxlength="5" /></span>
        <span class="expense-row__cat"><input type="text" placeholder="카테고리" /></span>
        <span class="expense-row__memo"><input type="text" placeholder="메모" /></span>
        <span class="expense-row__amount"><input type="text" placeholder="금액 (원)" inputmode="numeric" /></span>
      `;
      list.prepend(inputRow);
      inputRow.querySelector('.expense-row__cat input')?.focus();
      inputRow.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const date = inputRow.querySelector('.expense-row__date input').value.trim();
          const cat = inputRow.querySelector('.expense-row__cat input').value.trim();
          const memo = inputRow.querySelector('.expense-row__memo input').value.trim();
          const amountStr = inputRow.querySelector('.expense-row__amount input').value;
          const amount = parseInt(amountStr.replace(/[^\d]/g, ''), 10) || 0;
          if (!cat || !memo || !amount) return;
          FIXTURE.expense.txns.unshift({
            id: 'tx-' + Date.now(),
            date: date || (mm + '-' + dd),
            category: cat,
            memo: memo,
            amount: amount
          });
          FIXTURE.expense.monthTotal += amount;
          FIXTURE.expense.budgetUsed += amount;
          renderExpense();
        } else if (e.key === 'Escape') {
          e.preventDefault();
          inputRow.remove();
        }
      });
    }

    function setCategory(key) {
      if (!FIXTURE[key]) return;
      activeCat = key;
      document.querySelectorAll('.sb__item[data-category]').forEach(el => {
        el.classList.toggle('sb__item--active', el.dataset.category === key);
      });
      // body class 갱신 (라우트별 영역 hide/show 위해)
      ['navi', 'fiction', 'blog', 'memo', 'expense'].forEach(k => {
        document.body.classList.toggle('is-' + k, k === key);
      });
      // Wave 11.6.10 — 카테고리 전환 시 edit-toolbar 자동 close (이전 카테고리에서 켜놨던 잔존 차단)
      const __tb = document.getElementById('editToolbar');
      const __trig = document.getElementById('editTrigger');
      if (__tb) { __tb.classList.remove('is-open'); __tb.setAttribute('aria-hidden', 'true'); }
      if (__trig) { __trig.classList.remove('is-open'); __trig.setAttribute('aria-pressed', 'false'); }
      document.getElementById('crumbCat').textContent = FIXTURE[key].label;
      renderRecents(key);
      if (key === 'expense') {
        const m = String(FIXTURE.expense.month).padStart(2, '0');
        const d = String(FIXTURE.expense.today).padStart(2, '0');
        _selectedDate = `${m}-${d}`;
        renderExpense();
      } else if ((FIXTURE[key].docs || []).length === 0) {
        renderEmpty(FIXTURE[key].label);
      } else {
        renderDoc(FIXTURE[key].docs[0]);
      }
    }

    function newDoc() {
      if (activeCat === 'expense') {
        openNewExpenseForm();
        return;
      }
      const data = FIXTURE[activeCat];
      const isCounted = activeCat === 'navi' || activeCat === 'fiction';
      const newNumber = isCounted ? ((data.totalCount || 0) + 1) : null;
      const placeholder = isCounted ? `#${newNumber} 제목 없음` : '제목 없음';
      const view = document.getElementById('mainView');
      view.innerHTML = `
        <article class="doc">
          <h1 class="doc__h1" contenteditable spellcheck="false" data-empty-title="${placeholder}"></h1>
          <div class="doc__meta">새 글<span class="sep">·</span>0단어<span class="sep">·</span><span class="save">자동 저장 대기</span></div>
          <div class="doc__body" contenteditable spellcheck="false"></div>
        </article>
      `;
      _updateCrumbNum(newNumber);
      setTimeout(() => {
        const h1 = view.querySelector('.doc__h1');
        if (h1) h1.focus();
      }, 0);
    }

    // 사이드바 카테고리 클릭
    document.querySelectorAll('.sb__item[data-category]').forEach(el => {
      el.addEventListener('click', () => setCategory(el.dataset.category));
    });

    // 우상단 + 새 글
    const newBtn = document.getElementById('newDocBtn');
    if (newBtn) newBtn.addEventListener('click', newDoc);
    // 터치 디바이스 우하단 FAB 는 [data-action="new-doc"] delegation 으로 처리 (script 뒤 DOM)

    // 위임 — empty CTA / Recents / 가계부 캘린더 일자
    document.addEventListener('click', (e) => {
      const cta = e.target.closest('[data-action="new-doc"]');
      if (cta) { newDoc(); return; }
      const recent = e.target.closest('.sb__item--recent[data-doc-id]');
      if (recent) {
        const id = recent.dataset.docId;
        const doc = (FIXTURE[activeCat]?.docs || []).find(d => d.id === id);
        if (doc) renderDoc(doc);
        return;
      }

    // ═══ 가계부 캘린더 셀 클릭 → popover (Mac, 셀 우측 fallback 좌측) ═══

    // ═══ 가계부 검색 모달 ═══

    let _expSearchBound = false;

    function renderExpSearchResults(q) {

    // ═══ Phase D — 가계부 거래 입력/수정 모달 (Wave 11.1.5+) ═══
    // 카테고리 마스터 — Keep GAS 포팅 자산 (expense-classifier.js, 16 categories) 우선,
    // SPA 모듈 미로드 fallback 으로 inline 11개 유지.
    const EXP_CATEGORIES_FALLBACK = [
      { key: '외식',     label: '외식' },
      { key: '배달',     label: '배달' },
      { key: '온라인쇼핑', label: '온라인쇼핑' },
      { key: '편의점',   label: '편의점' },
      { key: '고양이',   label: '고양이' },
      { key: '건강',     label: '건강' },
      { key: '문화',     label: '문화' },
      { key: '패션',     label: '패션' },
      { key: '구독',     label: '구독' },
      { key: '교통',     label: '교통' },
      { key: '기타',     label: '기타' }
    ];
    function _getExpenseCategoryMaster() {
      const cls = (typeof window !== 'undefined' && window.todayClassifier) || null;
      if (cls && Array.isArray(cls.EXPENSE_CATEGORIES) && cls.EXPENSE_CATEGORIES.length > 0) {
        // 한글 name 을 key 로 사용 (fixture txns 의 한글 category 와 호환).
        // 영문 id 마이그레이션은 더미/fixture 정리 wave (1번) 에서 일괄 진행.
        return cls.EXPENSE_CATEGORIES.map((c) => ({ key: c.name, label: c.name, id: c.id }));
      }
      return EXP_CATEGORIES_FALLBACK;
    }
    // 호환 유지 — 기존 코드는 EXP_CATEGORIES 를 직접 참조. getter property 로 매 접근 시 master 호출.
    const EXP_CATEGORIES = new Proxy([], {
      get(_target, prop) {
        const arr = _getExpenseCategoryMaster();
        return prop === 'length' ? arr.length : arr[prop];
      },
    });
    const EXP_CAT_TOP_N = 4;
    let _expModalMode = 'new';
    let _expModalEditId = null;
    let _expModalDirty = false;
    let _expModalSelectedCat = null;
    let _expModalPendingClose = false;
    let _expConfirmCallback = null;

    // 카테고리를 빈도 기반으로 정렬 — 거래 저장소의 카테고리별 사용 횟수 내림차순
    // 실제 구현 시: 사용자별 거래 저장소에서 최근 3개월 집계 권장 (오래된 패턴 흐려지도록)
    function _getSortedCategories() {
      try {
        const txns = (FIXTURE && FIXTURE.expense && FIXTURE.expense.txns) || [];
        const counts = {};
        txns.forEach(t => {
          if (t.category) counts[t.category] = (counts[t.category] || 0) + 1;
        });
        return [...EXP_CATEGORIES].sort((a, b) => {
          const ca = counts[a.key] || 0;
          const cb = counts[b.key] || 0;
          return cb - ca;
        });
      } catch (e) {
        return EXP_CATEGORIES;
      }
    }

    function buildExpModalCatGrid() {
      const grid = document.getElementById('expModalCatGrid');
      if (!grid) return;
      const sorted = _getSortedCategories();
      grid.innerHTML = sorted.map((c, i) => {
        const rankClass = i < EXP_CAT_TOP_N ? ' exp-cat-cell--rank-top' : '';
        return `<button type="button" class="exp-cat-cell${rankClass}" data-cat="${c.key}" onclick="selectExpModalCat('${c.key}', this)">${c.label}</button>`;
      }).join('');
      grid.setAttribute('data-expanded', 'false');
      let toggle = document.getElementById('expModalCatToggle');
      if (!toggle) {
        toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.id = 'expModalCatToggle';
        toggle.className = 'exp-cat-toggle';
        toggle.setAttribute('aria-expanded', 'false');
        toggle.setAttribute('aria-controls', 'expModalCatGrid');
        toggle.onclick = toggleExpModalCatGrid;
        toggle.innerHTML = `<span class="exp-cat-toggle__label">더 보기</span><svg class="ico" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5l3 3 3-3"/></svg>`;
        grid.parentNode.appendChild(toggle);
      } else {
        toggle.setAttribute('aria-expanded', 'false');
        const labelSpan = toggle.querySelector('.exp-cat-toggle__label');
        if (labelSpan) labelSpan.textContent = '더 보기';
      }
    }

    function toggleExpModalCatGrid() {
      const grid = document.getElementById('expModalCatGrid');

      if (!grid || !toggle) return;
      const expanded = grid.getAttribute('data-expanded') === 'true';
      grid.setAttribute('data-expanded', expanded ? 'false' : 'true');
      toggle.setAttribute('aria-expanded', expanded ? 'false' : 'true');
      const labelSpan = toggle.querySelector('.exp-cat-toggle__label');
      if (labelSpan) labelSpan.textContent = expanded ? '더 보기' : '접기';
    }

    function _ensureCatVisible(catKey) {
      const grid = document.getElementById('expModalCatGrid');
      const toggle = document.getElementById('expModalCatToggle');
      if (!grid) return;
      const cell = grid.querySelector(`.exp-cat-cell[data-cat="${catKey}"]`);
      if (!cell) return;
      if (!cell.classList.contains('exp-cat-cell--rank-top')) {
        grid.setAttribute('data-expanded', 'true');
        if (toggle) {
          toggle.setAttribute('aria-expanded', 'true');
          const labelSpan = toggle.querySelector('.exp-cat-toggle__label');
          if (labelSpan) labelSpan.textContent = '접기';
        }
      }

    function selectExpModalCat(key, btn) {
      _expModalSelectedCat = key;
      _expModalDirty = true;
      document.querySelectorAll('#expModalCatGrid .exp-cat-cell').forEach(c => c.classList.remove('is-active'));
      if (btn) btn.classList.add('is-active');

    // 마지막으로 사용한 카드 — 거래 저장소에서 카드 정보가 있는 가장 최근 거래의 카드
    // fixture 사용 중에는 FIXTURE.expense.txns 기반. 실제 구현 시 사용자별 거래 저장소로 전환.
    function _getLastUsedCard() {
      try {
        const txns = (FIXTURE && FIXTURE.expense && FIXTURE.expense.txns) || [];
        const sorted = txns.filter(t => t.card).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
        return sorted.length ? sorted[0].card : '';
      } catch (e) {
        return '';
      }
    }

    function _formatExpDt(d) {
      if (!d || isNaN(d.getTime())) return '—';
      const pad = n => String(n).padStart(2, '0');
      return `${d.getMonth()+1}월 ${d.getDate()}일 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    function _setExpModalDt(d) {
      const pad = n => String(n).padStart(2, '0');
      const value = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
      const input = document.getElementById('expModalDatetime');
      const text = document.getElementById('expModalDtText');
      if (input) input.value = value;
      if (text) text.textContent = _formatExpDt(d);
    }

    /* 커스텀 날짜 popover (월 캘린더 + 시간 stepper) */
    let _expDatePopMonth = null;
    function _isSameDay(a, b) {
      return a && b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
    }
    function _getExpModalDateValue() {
      const v = document.getElementById('expModalDatetime')?.value;
      if (!v) return null;
      const d = new Date(v);
      return isNaN(d.getTime()) ? null : d;
    }
    function _renderExpDatePopover() {
      if (!_expDatePopMonth) _expDatePopMonth = new Date();
      const ym = _expDatePopMonth;
      const title = document.getElementById('expDatePopoverTitle');
      if (title) title.textContent = `${ym.getFullYear()}년 ${ym.getMonth()+1}월`;
      const grid = document.getElementById('expDatePopoverGrid');
      if (!grid) return;
      const year = ym.getFullYear(), month = ym.getMonth();
      const first = new Date(year, month, 1);
      const startDay = first.getDay();
      const daysInMonth = new Date(year, month+1, 0).getDate();
      const prevMonthDays = new Date(year, month, 0).getDate();
      const today = new Date();
      const selected = _getExpModalDateValue();
      const cells = [];
      for (let i = startDay - 1; i >= 0; i--) {
        const d = new Date(year, month-1, prevMonthDays - i);
        cells.push({ d, other: true });
      }
      for (let day = 1; day <= daysInMonth; day++) {
        cells.push({ d: new Date(year, month, day), other: false });
      }
      const need = 42 - cells.length;
      for (let day = 1; day <= need; day++) {
        cells.push({ d: new Date(year, month+1, day), other: true });
      }
      grid.innerHTML = cells.map(c => {
        const cls = ['exp-date-cell'];
        if (c.other) cls.push('is-other');
        if (_isSameDay(c.d, today)) cls.push('is-today');
        if (selected && _isSameDay(c.d, selected)) cls.push('is-selected');
        const iso = `${c.d.getFullYear()}-${String(c.d.getMonth()+1).padStart(2,'0')}-${String(c.d.getDate()).padStart(2,'0')}`;
        return `<button type="button" class="${cls.join(' ')}" data-date="${iso}" onclick="pickExpDate('${iso}')">${c.d.getDate()}</button>`;
      }).join('');
    }
    function openExpDatePopover() {
      const m = document.querySelector('#expModalOverlay .exp-modal');
      if (!m) return;
      const cur = _getExpModalDateValue() || new Date();
      _expDatePopMonth = new Date(cur.getFullYear(), cur.getMonth(), 1);
      const hour = document.getElementById('expDateHour');
      const min = document.getElementById('expDateMin');
      if (hour) hour.value = String(cur.getHours()).padStart(2, '0');
      if (min) min.value = String(cur.getMinutes()).padStart(2, '0');
      _renderExpDatePopover();
      _positionExpDatePopover();
      m.setAttribute('data-date-open', 'true');
    }
    function closeExpDatePopover() {
      const m = document.querySelector('#expModalOverlay .exp-modal');
      if (m) m.setAttribute('data-date-open', 'false');
    }
    function _positionExpDatePopover() {
      const trigger = document.getElementById('expModalDtTrigger');
      const pop = document.getElementById('expDatePopover');
      if (!trigger || !pop) return;
      const modal = document.querySelector('#expModalOverlay .exp-modal');
      const tRect = trigger.getBoundingClientRect();
      const mRect = modal.getBoundingClientRect();
      pop.style.top = `${tRect.bottom - mRect.top + 6}px`;
    }
    function shiftExpDateMonth(delta) {
      if (!_expDatePopMonth) _expDatePopMonth = new Date();
      _expDatePopMonth = new Date(_expDatePopMonth.getFullYear(), _expDatePopMonth.getMonth()+delta, 1);
      _renderExpDatePopover();
    }
    function pickExpDate(iso) {
      const [y, mo, da] = iso.split('-').map(Number);
      const hour = parseInt(document.getElementById('expDateHour')?.value || '0', 10) || 0;
      const min = parseInt(document.getElementById('expDateMin')?.value || '0', 10) || 0;
      const d = new Date(y, mo-1, da, Math.min(23, Math.max(0, hour)), Math.min(59, Math.max(0, min)));
      _setExpModalDt(d);
      _expModalDirty = true;
      _renderExpDatePopover();
      closeExpDatePopover();
    }
    function setExpDatePopoverToday() {
      const now = new Date();
      _expDatePopMonth = new Date(now.getFullYear(), now.getMonth(), 1);
      _setExpModalDt(now);
      _expModalDirty = true;
      const hour = document.getElementById('expDateHour');
      const min = document.getElementById('expDateMin');
      if (hour) hour.value = String(now.getHours()).padStart(2, '0');
      if (min) min.value = String(now.getMinutes()).padStart(2, '0');
      _renderExpDatePopover();
    }
    function _onExpDateTimeChange() {
      const cur = _getExpModalDateValue() || new Date();
      const hour = parseInt(document.getElementById('expDateHour')?.value || '0', 10) || 0;
      const min = parseInt(document.getElementById('expDateMin')?.value || '0', 10) || 0;
      const d = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate(), Math.min(23, Math.max(0, hour)), Math.min(59, Math.max(0, min)));
      _setExpModalDt(d);
      _expModalDirty = true;
    }

      const m = document.querySelector('#expModalOverlay .exp-modal');

    }
    function _positionExpCardPopover() {
      const trigger = document.getElementById('expModalCardTrigger');
      const pop = document.getElementById('expCardPopover');
      if (!trigger || !pop) return;
      const modal = document.querySelector('#expModalOverlay .exp-modal');
