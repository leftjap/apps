<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <!-- 라이트 페이퍼 — 상태바 검은 글자(default) + 웜화이트 (2026-06-10 아이폰 상하단 부정합 수정. 구: 다크 #0c0a08 + black-translucent 흰 글자) -->
    <meta name="theme-color" content="#fdfdfd" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="짐" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS 홈화면 아이콘 -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/apple-touch-icon-120.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon.png" />
    <script type="module" src="/src/main.js"></script>
    <title>Gym</title>
    <style>
      /* PWA full-screen override — mocks/*.html 의 시안 액자 (phone wrapper 360x740 / body padding 24 / 베이지 배경) 를
         실 디바이스 viewport 풀스크린으로 덮어쓰기. app.js 의 injectHeadAssets 가 mocks <style> 을 inject 한 뒤에
         이 inline 이 적용되도록 index.html 의 <style> 은 head 마지막에 위치. !important 로 보장. */
      html, body {
        margin: 0 !important; padding: 0 !important;
        height: 100dvh !important;
        background: #fdfdfd !important; /* 라이트 — safe-area 빈틈에 다크 띠 방지 (구 #0c0a08) */
        overflow: hidden !important;
        overscroll-behavior: none !important;
        -webkit-overflow-scrolling: auto;
        position: fixed; inset: 0;
      }
      .phone {
        width: 100vw !important;
        height: 100dvh !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        overflow: hidden !important;
        overscroll-behavior: none !important;
        background: #fdfdfd !important; /* mock 별 .phone 무배경 대비 — 위아래 inset 영역 라이트 보장 */
      }
      .phone-notch, .phone-home, .phone-clock, .phone-batt { display: none !important; }
      .phone-content {
        /* inset 그대로는 과체감 (사용자 피드백 2026-06-10) — 12px 감산, 0 미만 방지 */
        padding-top: max(calc(env(safe-area-inset-top, 0px) - 12px), 0px) !important;
        /* 하단 — 각 화면 최하단 블록이 자체 padding ≥22px 보유 (홈 CTA·세션 footer 등).
           가드는 inset 초과분(−22px)만 보충 → 화면 자체 패딩 + 가드 = inset(34px) 정확히.
           구 −12px 는 자체 패딩과 이중 스택되어 하단 과여백 (사용자 피드백 2026-06-11). */
        padding-bottom: max(calc(env(safe-area-inset-bottom, 0px) - 22px), 0px) !important;
      }
      /* 하단 고정 바텀시트 — 홈 인디케이터 겹침 방지 (전 시트 padding-bottom 24px 공통 → +inset) */
      #keypadSheet, #weightKeypadSheet, #dayDetailSheet, #actionSheet, #sessionAddexSheet, #addexSheet {
        padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)) !important;
      }
      /* iOS long-press callout(복사하기/찾아보기/번역/웹 검색) + text selection 전역 차단.
         자체 구현 long-press 메뉴(active-card / set-row / footer-exercise / session-end / .ex-row / 캘린더)
         와 동시 발화 방지. mocks/session.html 의 cardSwipeArea inline user-select:none 만으로는
         -webkit-touch-callout 미차단. 입력 요소만 예외. */
      html {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      input, textarea, [contenteditable="true"] {
        -webkit-user-select: text;
        user-select: text;
      }
    </style>
  </head>
  <body></body>
</html>
