<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fdfdfd">
<title>Gym · 통계 (Light Paper)</title>
<style>
/* Light Paper 재디자인 — 토큰은 전역 src/styles/paper.css (--shell/--card/--ink-*/--crail-* 등).
   폰트도 paper.css 가 Pretendard(--font-sans) + Space Grotesk(--font-mono) import. */
* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
body { margin: 0; min-height: 100vh; background: var(--hover-bg); display: flex; align-items: center; justify-content: center; padding: 24px; font-family: var(--font-sans); color: var(--ink-1); }
/* .num — JS 생성 마크업이 class="num" 사용. 시안 .mono 와 동일하게 Space Grotesk tabular 로 매핑. */
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; letter-spacing: -0.01em; }
.kr { font-family: var(--font-sans); }
.phone { width: 360px; height: 740px; border-radius: 38px; position: relative; overflow: hidden; box-shadow: 0 1px 0 rgba(20,18,14,.04), 0 30px 60px -20px rgba(20,18,14,.16), 0 0 0 1px rgba(20,18,14,.05); font-family: var(--font-sans); color: var(--ink-1); }
.phone-notch { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 102px; height: 30px; border-radius: 20px; background: #0c0a08; z-index: 50; }
.phone-clock { position: absolute; top: 16px; left: 24px; z-index: 49; font-family: var(--font-mono); font-weight: 600; font-size:16px; letter-spacing: -0.01em; color: var(--ink-1); }
.phone-batt { position: absolute; top: 16px; right: 24px; z-index: 49; display: flex; gap: 5px; align-items: center; color: var(--ink-1); }
.phone-batt-cell { width: 16px; height: 10px; border-radius: 2px; border: 1.2px solid currentColor; position: relative; }
.phone-batt-cell::after { content: ""; position: absolute; inset: 1.5px; background: currentColor; border-radius: 1px; display: block; }
.phone-content { position: absolute; inset: 0; padding-top: 54px; padding-bottom: 24px; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.phone-home { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 120px; height: 4px; border-radius: 100px; z-index: 60; background: rgba(20,18,14,.22); }
.tab-pane { display: none; }
[data-tab="cal"] .pane-cal { display: block; }
[data-tab="exercise"] .pane-exercise { display: block; }
[data-tab="body"] .pane-body { display: block; }
.tab-item { position: relative; padding: 8px 0 12px; cursor: pointer; }
.tab-bar { position: absolute; bottom: -1px; left: 0; right: 0; height: 2px; background: var(--crail-base); border-radius: 1px; display: none; }
[data-tab="cal"] .tab-cal .tab-bar,
[data-tab="exercise"] .tab-exercise .tab-bar,
[data-tab="body"] .tab-body .tab-bar { display: block; }
[data-tab="cal"] .tab-cal .tab-label,
[data-tab="exercise"] .tab-exercise .tab-label,
[data-tab="body"] .tab-body .tab-label { font-weight: 600; color: var(--ink-1); }
.tab-label { font-size:15px; font-weight: 500; color: var(--ink-4); }
/* 종목 빈도 row — 모바일 친화 list 디자인 (treemap 폐기) */
.ex-freq-row { display: flex; flex-direction: column; gap: 6px; padding: 10px 4px; border-bottom: 1px solid var(--line-soft); }
.ex-freq-row:last-child { border-bottom: 0; }
.ex-freq-head { display: flex; align-items: center; gap: 10px; }
.ex-freq-dot { width: 8px; height: 8px; border-radius: 4px; flex: 0 0 8px; }
.ex-freq-name { flex: 1; font-size: 15px; color: var(--ink-1); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ex-freq-count { font-size: 13px; color: var(--ink-3); font-weight: 500; display: inline-flex; align-items: baseline; gap: 3px; }
.ex-freq-count > .kr { font-size: 11px; color: var(--ink-4); }
.ex-freq-bar { height: 6px; background: var(--sunken); border-radius: 3px; overflow: hidden; }
.ex-freq-fill { display: block; height: 100%; border-radius: 3px; }
/* 부위 도넛 — work-order 비율 링 (실루엣 폐기 후 교체). conic-gradient 는 stats.js applyBodyPartsToDom 가 주입. */
.donut-wrap { display: flex; justify-content: center; padding: 22px 0 6px; }
.donut { width: 168px; height: 168px; border-radius: 50%; position: relative;
  background: conic-gradient(var(--crail-base) 0 32%, #c2bbac 32% 58%, #d0cabd 58% 76%, #ddd8cd 76% 90%, #e9e5dc 90% 100%); }
.donut::after { content: ""; position: absolute; inset: 26px; border-radius: 50%; background: var(--shell); box-shadow: inset 0 1px 3px rgba(20,18,14,0.06); }
.donut .ctr { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.donut .ctr .n { font-size: 30px; font-weight: 600; color: var(--ink-1); letter-spacing: -0.03em; }
.donut .ctr .k { font-size: 11px; font-weight: 500; color: var(--ink-4); margin-top: 1px; }
/* 부위 범례 */
.lrow { display: flex; align-items: center; gap: 12px; padding: 11px 0; }
.lrow + .lrow { border-top: 1px solid var(--line-soft); }
.lrow .dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.lrow .nm { flex: 1; font-size: 15px; font-weight: 500; color: var(--ink-1); white-space: nowrap; }
.lrow .ct { font-size: 13px; font-weight: 500; color: var(--ink-3); white-space: nowrap; }
.lrow .pc { font-size: 13px; font-weight: 600; color: var(--ink-1); min-width: 38px; text-align: right; }
</style>
</head>
<body>
<div class="phone" style="background:var(--shell);" data-tab="cal">
  <div class="phone-notch"></div>
  <div class="phone-content">
    <!-- StatsHeader -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:0 24px;">
      <div class="kr" style="font-size:24px;font-weight:700;color:var(--ink-1);letter-spacing:-0.02em;">통계</div>
      <div style="display:flex;gap:4px;font-size:14px;" class="kr"><span class="js-nav-home" style="cursor:pointer;padding:8px 12px;border-radius:var(--r-sm);color:var(--ink-3);">홈</span><span class="js-nav-manage" style="cursor:pointer;padding:8px 12px;border-radius:var(--r-sm);color:var(--ink-3);">관리</span></div>
    </div>
    <div style="margin-top:20px;padding:0 24px;display:flex;gap:24px;border-bottom:1px solid var(--line);">
      <div class="tab-item tab-cal" data-go="cal"><span class="kr tab-label">캘린더</span><div class="tab-bar"></div></div>
      <div class="tab-item tab-exercise" data-go="exercise"><span class="kr tab-label">종목</span><div class="tab-bar"></div></div>
      <div class="tab-item tab-body" data-go="body"><span class="kr tab-label">부위</span><div class="tab-bar"></div></div>
    </div>

    <!-- Pane: 캘린더 -->
    <div class="tab-pane pane-cal">
      <div style="padding:18px 24px 0;display:flex;align-items:center;justify-content:space-between;">
        <span id="calPrev" aria-label="이전 달" style="width:32px;height:32px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--ink-3);cursor:pointer;">
          <svg width="8" height="14" viewBox="0 0 8 14" fill="none"><path d="M7 1L1 7l6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <div id="monthLabel" class="num" style="font-size:15px;color:var(--ink-1);font-weight:600;letter-spacing:0.02em;">2026 · 5월</div>
        <span id="calNext" aria-label="다음 달" style="width:32px;height:32px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--ink-3);cursor:pointer;">
          <svg width="8" height="14" viewBox="0 0 8 14" fill="none"><path d="M1 1l6 6-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </div>
      <div style="padding:14px 18px 0;">
        <div class="kr" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;color:var(--ink-4);font-size:11px;font-weight:500;">
          <div style="text-align:center;padding-bottom:6px;">월</div>
          <div style="text-align:center;padding-bottom:6px;">화</div>
          <div style="text-align:center;padding-bottom:6px;">수</div>
          <div style="text-align:center;padding-bottom:6px;">목</div>
          <div style="text-align:center;padding-bottom:6px;">금</div>
          <div style="text-align:center;padding-bottom:6px;">토</div>
          <div style="text-align:center;padding-bottom:6px;">일</div>
        </div>
        <div id="calGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;"></div>
      </div>
      <!-- 캘린더 하단 추이 그래프 — 최근 8주 막대 + 선 overlay. 헤더 = 이번 주 + 지난 주 대비 delta. -->
      <div style="margin:24px 22px 28px;padding:18px 20px 22px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-float);">
        <div style="display:flex;align-items:baseline;justify-content:space-between;">
          <div>
            <div class="kr" style="font-size:12px;color:var(--ink-3);letter-spacing:0.02em;">이번 주 볼륨</div>
            <div style="margin-top:5px;display:flex;align-items:baseline;gap:8px;">
              <span class="num" style="font-size:26px;font-weight:600;color:var(--ink-1);letter-spacing:-0.02em;"><span data-bind="cal-week-current">0</span><span class="kr" style="font-size:13px;color:var(--ink-4);margin-left:1px;">kg</span></span>
              <span class="kr" data-bind="cal-week-delta" style="font-size:13px;color:var(--crail-deep);font-weight:600;">+0%</span>
            </div>
          </div>
          <div class="kr" style="font-size:12px;color:var(--ink-4);">지난 주 <span data-bind="cal-week-previous">0</span>kg</div>
        </div>
        <!-- 8주 주간 볼륨 비교 막대 + 선 overlay. 신규 — 기존 #trend-svg 폐기. -->
        <div data-bind="weekly-trend" style="margin-top:16px;">
          <svg id="weekly-trend-chart" viewBox="0 0 320 160" style="width:100%;height:150px;display:block;"></svg>
          <div data-bind="weekly-trend-xaxis" style="display:flex;justify-content:space-between;margin-top:8px;padding:0 2px;font-family:var(--font-mono);font-size:10px;color:var(--ink-4);"></div>
        </div>
      </div>
    </div>

    <!-- Pane: 종목 — 사용자가 자주 한 운동 종목 빈도순 list -->
    <div class="tab-pane pane-exercise">
      <div style="padding:22px 24px 0;">
        <div class="kr" style="font-size:12px;color:var(--ink-3);letter-spacing:0.02em;">자주 한 운동 · 최근 60일</div>
        <div style="margin-top:6px;display:flex;align-items:baseline;gap:7px;">
          <span class="num" data-bind="exercise-total" style="font-size:34px;font-weight:600;color:var(--ink-1);letter-spacing:-0.03em;">0</span>
          <span class="kr" style="font-size:14px;color:var(--ink-4);">종목</span>
        </div>
        <!-- 종목 빈도 list — 모바일 친화 row layout (가로 막대 + setCount). -->
        <div data-bind="exercise-treemap" style="margin-top:18px;display:flex;flex-direction:column;gap:6px;max-height:calc(100dvh - 240px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:24px;">
          <div data-bind="exercise-empty" style="display:none;text-align:center;padding:48px 0;color:var(--ink-4);font-size:14px;width:100%;" class="kr">아직 운동 기록이 없습니다</div>
        </div>
      </div>
    </div>

    <!-- Pane: 부위 -->
    <div class="tab-pane pane-body">
      <div style="padding:22px 24px 0;">
        <div class="kr" style="font-size:12px;color:var(--ink-3);letter-spacing:0.02em;">최근 60일 부위 분포</div>
        <!-- work-order 도넛 — 인체 실루엣 폐기 후 교체. body-silhouette 훅 유지 (applyBodyPartsToDom 가
             이 .donut 의 conic-gradient background 를 부위 비율 + 랭크 색으로 주입). 중앙 = 총 운동 횟수. -->
        <div class="donut-wrap" style="margin-top:8px;">
          <div class="donut" data-bind="body-silhouette">
            <div class="ctr"><span class="num n" data-bind="body-total">0</span><span class="k kr">회 운동</span></div>
          </div>
        </div>
        <!-- 비율 막대 (얇은 stacked) — applyBodyPartsToDom 가 부위별 width%+색 주입. -->
        <div data-bind="body-stack" style="margin:14px 4px 0;display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunken);"></div>
        <div data-bind="body-list" style="margin-top:14px;"></div>
      </div>
    </div>
    <div class="compare-section" style="display:none;" aria-hidden="true">
      <div class="cs-group">
        <div class="cs-bar-row"><span class="cs-bar-volume"></span><span class="cs-bar-delta"></span><div class="cs-bar-fill"></div></div>
        <div class="cs-bar-row"><span class="cs-bar-volume"></span><span class="cs-bar-delta"></span><div class="cs-bar-fill"></div></div>
      </div>
      <div class="cs-group">
        <div class="cs-bar-row"><span class="cs-bar-volume"></span><span class="cs-bar-delta"></span><div class="cs-bar-fill"></div></div>
        <div class="cs-bar-row"><span class="cs-bar-volume"></span><span class="cs-bar-delta"></span><div class="cs-bar-fill"></div></div>
      </div>
    </div>
    <!-- §9-1 — 날짜 탭 → 운동 요약 바텀시트 (src/features/day-detail-sheet.js) -->
    <!-- 라이트 페이퍼 재스타일 (사용자 피드백 2026-06-10 — 구 다크 #15120e 잔존 수정. keypadSheet 시트 언어 답습) -->
    <div id="dayDetailBackdrop" data-open="false" style="position:fixed;inset:0;z-index:90;background:oklch(22% 0.008 60 / 0.42);opacity:0;pointer-events:none;transition:opacity 200ms ease;"></div>
    <div id="dayDetailSheet" data-open="false" data-step="summary" data-iso="" style="position:fixed;left:0;right:0;bottom:0;z-index:91;background:var(--card);border-top-left-radius:var(--r-xl);border-top-right-radius:var(--r-xl);padding:12px 20px 24px;box-shadow:0 -20px 50px -18px rgba(20,18,14,0.4);transform:translateY(100%);transition:transform 200ms ease;touch-action:none;">
      <div style="width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px;"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <div id="dayDetailDate" class="kr" style="font-size:16px;color:var(--ink-1);font-weight:600;">—</div>
        <div id="dayDetailTag" class="kr" style="font-size:13px;color:var(--ink-3);font-weight:500;"></div>
      </div>
      <div id="dayDetailMeta" class="kr" style="display:none;gap:14px;margin-bottom:10px;font-size:13px;color:var(--ink-3);flex-wrap:wrap;align-items:baseline;"></div>
      <div id="dayDetailExList" style="display:none;flex-direction:column;max-height:240px;overflow-y:auto;"></div>
      <div id="dayDetailEmpty" class="kr" style="display:none;font-size:14px;color:var(--ink-4);text-align:center;padding:24px 0;">기록 없음</div>
      <div id="dayDetailConfirm" style="display:none;flex-direction:column;gap:8px;">
        <div class="kr" style="font-size:15px;color:var(--ink-2);text-align:center;margin:8px 0 12px;">이 날짜의 기록을 삭제하시겠습니까?</div>
        <button class="kr" type="button" data-day-detail-action="delete-confirm" style="width:100%;height:48px;border-radius:var(--r-md);border:0;background:var(--danger);color:#fff;font-size:16px;font-weight:600;cursor:pointer;">삭제</button>
        <button class="kr" type="button" data-day-detail-action="cancel" style="width:100%;height:48px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);color:var(--ink-3);font-size:16px;font-weight:500;cursor:pointer;">취소</button>
      </div>
    </div>
  </div>
  <div class="phone-home"></div>
</div>

<script>
  // 탭 토글
  const phone = document.querySelector('.phone');
  document.querySelectorAll('.tab-item').forEach(el => {
    el.addEventListener('click', () => { if (phone) phone.dataset.tab = el.dataset.go; });
  });

  // 캘린더 그리드 렌더 (5월 1일이 금요일이라고 가정 — 4 cell empty).
  // 라이브 앱에서는 stats.js 의 applyWorkedToCalendar(볼륨 히트맵) + applyTodayToCalendar(크레일 링)가
  // 곧바로 덮어쓴다. 여기 fixture 는 다크 플래시 방지 + standalone mock 미리보기용 라이트 기본값.
  const cal = document.getElementById('calGrid');
  const vol = { 1:3200, 4:8600, 6:13500, 8:5400, 11:9200, 13:4100, 15:10800, 18:14200, 22:6100, 25:9900, 27:4800 };
  const maxVol = 14200;
  const today = 6;
  let html = '';
  for (let i = 0; i < 4; i++) html += '<div></div>';
  for (let d = 1; d <= 31; d++) {
    const v = vol[d] || 0;
    const isToday = d === today;
    const a = v ? 0.14 + 0.82 * (v / maxVol) : 0;
    const bg = v ? 'background:rgba(193,99,63,' + a.toFixed(2) + ');' : '';
    const c = v ? (a > 0.52 ? '#fff' : 'var(--crail-deep)') : 'var(--ink-4)';
    const fw = v ? (a > 0.4 ? 600 : 500) : 500;
    const ring = isToday ? 'box-shadow:inset 0 0 0 1.5px var(--crail-deep);' : '';
    const cls = 'cal-cell' + (isToday ? ' today' : '');
    html += '<div class="' + cls + '" data-day="' + d + '" style="aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;' + bg + ring + '">';
    html += '<span class="num" style="font-size:13px;font-weight:' + fw + ';color:' + c + ';">' + d + '</span>';
    html += '</div>';
  }
  if (cal) cal.innerHTML = html;
  // 8주 추이 차트(#weekly-trend-chart)는 stats.js renderWeeklyTrendChart 가 라이브 데이터로 렌더.
</script>
</body>
</html>
