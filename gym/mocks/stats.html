<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0a08">
<title>Gym · 통계 (v2 · StatsA/B/C)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf9f5; --bg-warm: #f3efe6; --bg-deep: #ece7db;
  --surface: #ffffff; --surface-2: #f7f4ec;
  --ink: #1a1714; --ink-strong: #0c0a08;
  --ink-2: #5a544a; --ink-muted: #8d8678; --ink-faint: #c4beb1;
  --line: #e6e1d4; --line-soft: #efeae0;
  --accent: #d97757; --accent-soft: #ecb59f; --accent-deep: #b85a3e; --accent-tint: #fbe9df;
  --sage: #788c5d; --sage-soft: #c0c9aa; --night: #1f1c18;
  --r-xl: 22px; --r-lg: 16px; --r-md: 12px; --r-sm: 8px;
  --shadow-card: 0 1px 2px rgba(28,22,16,.04), 0 8px 24px -8px rgba(28,22,16,.08);
  --shadow-lift: 0 32px 64px -12px rgba(217,119,87,.22), 0 12px 28px -10px rgba(28,22,16,.18);
  --font-display: "Poppins", "SF Pro Display", -apple-system, system-ui, sans-serif;
  --font-body: "Noto Sans KR", -apple-system, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", monospace;
}
* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
body { margin: 0; min-height: 100vh; background: var(--bg-deep); display: flex; align-items: center; justify-content: center; padding: 24px; font-family: var(--font-body); color: var(--ink); }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.kr { font-family: var(--font-body); }
.phone { width: 360px; height: 740px; border-radius: 38px; position: relative; overflow: hidden; box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 30px 60px -20px rgba(28,22,16,.18), 0 0 0 1px rgba(28,22,16,.06); font-family: var(--font-body); color: var(--ink); }
.phone-notch { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 102px; height: 30px; border-radius: 20px; background: #0c0a08; z-index: 50; }
.phone-clock { position: absolute; top: 16px; left: 24px; z-index: 49; font-family: var(--font-display); font-weight: 600; font-size:16px; letter-spacing: -0.01em; color: var(--ink-strong); }
.phone-batt { position: absolute; top: 16px; right: 24px; z-index: 49; display: flex; gap: 5px; align-items: center; color: var(--ink-strong); }
.phone-batt-cell { width: 16px; height: 10px; border-radius: 2px; border: 1.2px solid currentColor; position: relative; }
.phone-batt-cell::after { content: ""; position: absolute; inset: 1.5px; background: currentColor; border-radius: 1px; display: block; }
.phone-content { position: absolute; inset: 0; padding-top: 54px; padding-bottom: 24px; }
.phone-home { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 120px; height: 4px; border-radius: 100px; z-index: 60; background: rgba(0,0,0,.22); }
.phone.dark { color: #f3efe6; }
.phone.dark .phone-clock, .phone.dark .phone-batt { color: #f3efe6; }
.phone.dark .phone-home { background: rgba(255,255,255,.32); }
.tab-pane { display: none; }
[data-tab="cal"] .pane-cal { display: block; }
[data-tab="exercise"] .pane-exercise { display: block; }
[data-tab="body"] .pane-body { display: block; }
.tab-item { position: relative; padding: 8px 0 12px; cursor: pointer; }
.tab-bar { position: absolute; bottom: -1px; left: 0; right: 0; height: 2px; background: var(--accent); display: none; }
[data-tab="cal"] .tab-cal .tab-bar,
[data-tab="exercise"] .tab-exercise .tab-bar,
[data-tab="body"] .tab-body .tab-bar { display: block; }
[data-tab="cal"] .tab-cal .tab-label,
[data-tab="exercise"] .tab-exercise .tab-label,
[data-tab="body"] .tab-body .tab-label { font-weight: 600; color: #fff; }
.tab-label { font-size:15px; font-weight: 400; color: rgba(255,255,255,0.45); }
</style>
</head>
<body>
<div class="phone dark" style="background:#0c0a08;" data-tab="cal">
  <div class="phone-notch"></div>
  <div class="phone-content">
    <!-- StatsHeader -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:0 24px;">
      <div class="kr" style="font-size:24px;font-weight:600;color:#fff;">통계</div>
      <div style="display:flex;gap:18px;font-size:14px;color:rgba(255,255,255,0.5);" class="kr"><span class="js-nav-home" style="cursor:pointer;">홈</span><span class="js-nav-manage" style="cursor:pointer;">관리</span></div>
    </div>
    <div style="margin-top:22px;padding:0 24px;display:flex;gap:22px;border-bottom:1px solid rgba(255,255,255,0.06);">
      <div class="tab-item tab-cal" data-go="cal"><span class="kr tab-label">캘린더</span><div class="tab-bar"></div></div>
      <div class="tab-item tab-exercise" data-go="exercise"><span class="kr tab-label">종목</span><div class="tab-bar"></div></div>
      <div class="tab-item tab-body" data-go="body"><span class="kr tab-label">부위</span><div class="tab-bar"></div></div>
    </div>

    <!-- Pane: 캘린더 -->
    <div class="tab-pane pane-cal">
      <div style="padding:20px 24px 0;display:flex;align-items:center;justify-content:space-between;">
        <span style="color:rgba(255,255,255,0.5);font-size:20px;">‹</span>
        <div id="monthLabel" class="num" style="font-size:16px;color:#fff;font-weight:500;letter-spacing:0.04em;">2026 · 5월</div>
        <span style="color:rgba(255,255,255,0.5);font-size:20px;">›</span>
      </div>
      <div style="padding:16px 18px 0;">
        <div class="kr" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;color:rgba(255,255,255,0.4);font-size:13px;">
          <div style="text-align:center;padding-bottom:8px;">월</div>
          <div style="text-align:center;padding-bottom:8px;">화</div>
          <div style="text-align:center;padding-bottom:8px;">수</div>
          <div style="text-align:center;padding-bottom:8px;">목</div>
          <div style="text-align:center;padding-bottom:8px;">금</div>
          <div style="text-align:center;padding-bottom:8px;">토</div>
          <div style="text-align:center;padding-bottom:8px;">일</div>
        </div>
        <div id="calGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;"></div>
      </div>
      <!-- 캘린더 하단 추이 그래프 — 최근 8주 막대 + 선 overlay. 헤더 = 이번 주 + 지난 주 대비 delta. -->
      <div style="margin:20px 20px 0;padding:16px 18px;border-radius:16px;background:#15120e;border:1px solid rgba(255,255,255,0.05);">
        <div style="display:flex;align-items:baseline;justify-content:space-between;">
          <div>
            <div class="kr" style="font-size:13px;color:rgba(255,255,255,0.45);letter-spacing:0.06em;">이번 주</div>
            <div style="margin-top:4px;display:flex;align-items:baseline;gap:8px;">
              <span class="num" style="font-size:24px;font-weight:300;color:#fff;"><span data-bind="cal-week-current">0</span><span class="kr" style="font-size:14px;color:rgba(255,255,255,0.5);margin-left:3px;">kg</span></span>
              <span class="kr" data-bind="cal-week-delta" style="font-size:13px;color:var(--accent);font-weight:600;">+0%</span>
            </div>
          </div>
          <div class="kr" style="font-size:13px;color:rgba(255,255,255,0.4);">지난 주 <span data-bind="cal-week-previous">0</span>kg</div>
        </div>
        <!-- 8주 주간 볼륨 비교 막대 + 선 overlay. 신규 — 기존 #trend-svg 폐기. -->
        <div data-bind="weekly-trend" style="margin-top:18px;">
          <svg id="weekly-trend-chart" viewBox="0 0 320 160" style="width:100%;height:150px;display:block;"></svg>
          <div data-bind="weekly-trend-xaxis" style="display:flex;justify-content:space-between;margin-top:10px;padding:0 4px;font-size:11px;color:rgba(255,255,255,0.4);"></div>
        </div>
      </div>
    </div>

    <!-- Pane: 종목 — 사용자가 자주 한 운동 종목 빈도순 list -->
    <div class="tab-pane pane-exercise">
      <div style="padding:26px 24px 0;">
        <div class="kr" style="font-size:13px;color:rgba(255,255,255,0.45);letter-spacing:0.06em;">자주 한 운동</div>
        <div style="margin-top:6px;display:flex;align-items:baseline;gap:8px;">
          <span class="num" data-bind="exercise-total" style="font-size:32px;font-weight:200;color:#fff;letter-spacing:-0.03em;">0</span>
          <span class="kr" style="font-size:15px;color:rgba(255,255,255,0.55);">종목</span>
        </div>
        <!-- 종목 treemap — 박스 면적 ∝ 빈도, 색 = 부위. 가장 큰 박스 = 가장 자주 한 운동. -->
        <div data-bind="exercise-treemap" style="margin-top:22px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;">
          <div data-bind="exercise-empty" style="display:none;text-align:center;padding:48px 0;color:rgba(255,255,255,0.4);font-size:14px;width:100%;" class="kr">아직 운동 기록이 없습니다</div>
        </div>
      </div>
    </div>

    <!-- Pane: 부위 -->
    <div class="tab-pane pane-body">
      <div style="padding:26px 24px 0;">
        <div class="kr" style="font-size:13px;color:rgba(255,255,255,0.45);letter-spacing:0.06em;">이번 달 부위 분포</div>
        <div style="margin-top:6px;display:flex;align-items:baseline;gap:8px;">
          <span class="num" data-bind="body-total" style="font-size:44px;font-weight:200;color:#fff;letter-spacing:-0.03em;">14</span>
          <span class="kr" style="font-size:15px;color:rgba(255,255,255,0.55);">회 운동</span>
        </div>
        <!-- 부위 silhouette — SVG path 인체 outline (이미지 의존 0). 빨강 alpha = 운동 종목 → 자극 근육 가중 score. -->
        <div data-bind="body-silhouette" style="margin-top:22px;display:flex;justify-content:center;gap:18px;align-items:flex-start;">
          <svg viewBox="0 0 600 1118" style="width:128px;height:240px;" aria-label="전면">

            <ellipse cx="300" cy="80" rx="55" ry="65" fill="#d4a59a"/>

            <g clip-path="url(#bodyClipFront)">
              <path data-muscle="deltoid_front" d="M 125 200 L 225 200 L 235 280 L 135 290 Z" fill="rgba(217,119,87,0)"/>

              <path data-muscle="forearm" d="M 25 460 L 145 460 L 110 660 L 0 660 Z" fill="rgba(217,119,87,0)"/>

            </g>
          </svg>
          <svg viewBox="0 0 600 1118" style="width:128px;height:240px;" aria-label="후면">
            <defs><clipPath id="bodyClipBack"><path d="M 245 145 Q 245 175 240 195 Q 200 200 165 215 Q 130 240 125 295 L 75 480 L 25 660 L 65 685 L 150 540 L 175 320 Q 200 325 220 365 L 230 590 L 220 875 L 230 1090 L 275 1100 L 295 875 L 300 655 L 305 875 L 325 1100 L 370 1090 L 380 875 L 370 590 L 380 365 Q 400 325 425 320 L 450 540 L 535 685 L 575 660 L 525 480 L 475 295 Q 470 240 435 215 Q 400 200 360 195 Q 355 175 355 145 Z"/></clipPath></defs>
            <ellipse cx="300" cy="80" rx="55" ry="65" fill="#d4a59a"/>

            <g clip-path="url(#bodyClipBack)">

              <path data-muscle="lats" d="M 305 350 L 425 340 L 405 530 L 305 540 Z" fill="rgba(217,119,87,0)"/>
              <path data-muscle="lower_back" d="M 245 460 L 385 460 L 385 600 L 245 600 Z" fill="rgba(217,119,87,0)"/>
              <path data-muscle="glutes" d="M 225 600 L 300 600 L 305 730 L 220 730 Z" fill="rgba(217,119,87,0)"/>
              <path data-muscle="glutes" d="M 300 600 L 375 600 L 380 730 L 295 730 Z" fill="rgba(217,119,87,0)"/>
              <path data-muscle="hamstrings" d="M 220 730 L 300 730 L 295 940 L 215 940 Z" fill="rgba(217,119,87,0)"/>
              <path data-muscle="hamstrings" d="M 300 730 L 380 730 L 385 940 L 305 940 Z" fill="rgba(217,119,87,0)"/>
              <path data-muscle="calves" d="M 215 940 L 295 940 L 295 1090 L 220 1090 Z" fill="rgba(217,119,87,0)"/>
              <path data-muscle="calves" d="M 305 940 L 385 940 L 380 1090 L 305 1090 Z" fill="rgba(217,119,87,0)"/>
            </g>
          </svg>
        </div>
        <div data-bind="body-list" style="margin-top:22px;">
          <div style="display:flex;align-items:center;padding:11px 0;">
            <span style="width:8px;height:8px;border-radius:4px;background:#d97757;margin-right:12px;"></span>
            <span class="kr" style="font-size:16px;color:#fff;font-weight:500;flex:1;">가슴</span>
            <div style="flex:2;height:4px;border-radius:2px;background:rgba(255,255,255,0.06);margin-right:14px;overflow:hidden;"><div style="width:32%;height:100%;background:#d97757;"></div></div>
            <span class="num" style="font-size:14px;color:rgba(255,255,255,0.7);min-width:32px;text-align:right;">32<span class="kr" style="font-size:13px;color:rgba(255,255,255,0.4);margin-left:2px;">회</span></span>
            <span class="num" style="font-size:13px;color:rgba(255,255,255,0.4);min-width:36px;text-align:right;">32%</span>
          </div>
          <div style="display:flex;align-items:center;padding:11px 0;border-top:1px solid rgba(255,255,255,0.04);">
            <span style="width:8px;height:8px;border-radius:4px;background:#788c5d;margin-right:12px;"></span>
            <span class="kr" style="font-size:16px;color:#fff;font-weight:500;flex:1;">등</span>
            <div style="flex:2;height:4px;border-radius:2px;background:rgba(255,255,255,0.06);margin-right:14px;overflow:hidden;"><div style="width:26%;height:100%;background:#788c5d;"></div></div>
            <span class="num" style="font-size:14px;color:rgba(255,255,255,0.7);min-width:32px;text-align:right;">26<span class="kr" style="font-size:13px;color:rgba(255,255,255,0.4);margin-left:2px;">회</span></span>
            <span class="num" style="font-size:13px;color:rgba(255,255,255,0.4);min-width:36px;text-align:right;">26%</span>
          </div>
          <div style="display:flex;align-items:center;padding:11px 0;border-top:1px solid rgba(255,255,255,0.04);">
            <span style="width:8px;height:8px;border-radius:4px;background:#b85a3e;margin-right:12px;"></span>
            <span class="kr" style="font-size:16px;color:#fff;font-weight:500;flex:1;">하체</span>
            <div style="flex:2;height:4px;border-radius:2px;background:rgba(255,255,255,0.06);margin-right:14px;overflow:hidden;"><div style="width:18%;height:100%;background:#b85a3e;"></div></div>
            <span class="num" style="font-size:14px;color:rgba(255,255,255,0.7);min-width:32px;text-align:right;">18<span class="kr" style="font-size:13px;color:rgba(255,255,255,0.4);margin-left:2px;">회</span></span>
            <span class="num" style="font-size:13px;color:rgba(255,255,255,0.4);min-width:36px;text-align:right;">18%</span>
          </div>
          <div style="display:flex;align-items:center;padding:11px 0;border-top:1px solid rgba(255,255,255,0.04);">
            <span style="width:8px;height:8px;border-radius:4px;background:#c9a96e;margin-right:12px;"></span>
            <span class="kr" style="font-size:16px;color:#fff;font-weight:500;flex:1;">어깨</span>
            <div style="flex:2;height:4px;border-radius:2px;background:rgba(255,255,255,0.06);margin-right:14px;overflow:hidden;"><div style="width:14%;height:100%;background:#c9a96e;"></div></div>
            <span class="num" style="font-size:14px;color:rgba(255,255,255,0.7);min-width:32px;text-align:right;">14<span class="kr" style="font-size:13px;color:rgba(255,255,255,0.4);margin-left:2px;">회</span></span>
            <span class="num" style="font-size:13px;color:rgba(255,255,255,0.4);min-width:36px;text-align:right;">14%</span>
          </div>
          <div style="display:flex;align-items:center;padding:11px 0;border-top:1px solid rgba(255,255,255,0.04);">
            <span style="width:8px;height:8px;border-radius:4px;background:#6b8a9c;margin-right:12px;"></span>
            <span class="kr" style="font-size:16px;color:#fff;font-weight:500;flex:1;">팔</span>
            <div style="flex:2;height:4px;border-radius:2px;background:rgba(255,255,255,0.06);margin-right:14px;overflow:hidden;"><div style="width:10%;height:100%;background:#6b8a9c;"></div></div>
            <span class="num" style="font-size:14px;color:rgba(255,255,255,0.7);min-width:32px;text-align:right;">10<span class="kr" style="font-size:13px;color:rgba(255,255,255,0.4);margin-left:2px;">회</span></span>
            <span class="num" style="font-size:13px;color:rgba(255,255,255,0.4);min-width:36px;text-align:right;">10%</span>
          </div>
        </div>
      </div>
      <div style="position:absolute;left:20px;right:20px;bottom:28px;padding:14px 18px;border-radius:14px;background:rgba(217,119,87,0.10);border:1px solid rgba(217,119,87,0.25);display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div class="kr" style="font-size:14px;color:var(--accent);font-weight:600;">팔이 부족해요</div>
          <div class="kr" style="margin-top:2px;font-size:13px;color:rgba(255,255,255,0.55);">이번 주 팔 1회 · 권장 2회</div>
        </div>
        <span class="kr" style="font-size:14px;color:var(--accent);">→</span>
      </div>
    </div>
    <div class="compare-section" style="display:none;" aria-hidden="true">
      <div class="cs-group">
        <div class="cs-bar-row"><span class="cs-bar-volume"></span><span class="cs-bar-delta"></span><div class="cs-bar-fill"></div></div>
        <div class="cs-bar-row"><span class="cs-bar-volume"></span><span class="cs-bar-delta"></span><div class="cs-bar-fill"></div></div>
      </div>
      <div class="cs-group">
        <div class="cs-bar-row"><span class="cs-bar-volume"></span><span class="cs-bar-delta"></span><div class="cs-bar-fill"></div></div>
        <div class="cs-bar-row"><span class="cs-bar-volume"></span><span class="cs-bar-delta"></span><div class="cs-bar-fill"></div></div>
      </div>
    </div>
    <!-- §9-1 — 날짜 탭 → 운동 요약 바텀시트 (src/features/day-detail-sheet.js) -->
    <div id="dayDetailBackdrop" data-open="false" style="position:absolute;inset:0;z-index:90;background:rgba(0,0,0,0.5);opacity:0;pointer-events:none;transition:opacity 200ms ease;"></div>
    <div id="dayDetailSheet" data-open="false" data-step="summary" data-iso="" style="position:absolute;left:0;right:0;bottom:0;z-index:91;background:#15120e;border-top-left-radius:22px;border-top-right-radius:22px;padding:18px 18px 24px;box-shadow:0 -16px 40px -10px rgba(0,0,0,0.45);transform:translateY(100%);transition:transform 200ms ease;touch-action:none;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <div id="dayDetailDate" class="kr" style="font-size:16px;color:rgba(255,255,255,0.9);font-weight:500;">—</div>
        <div id="dayDetailTag" class="kr" style="font-size:13px;color:rgba(255,255,255,0.5);"></div>
      </div>
      <div id="dayDetailMeta" class="kr" style="display:none;gap:14px;margin-bottom:12px;font-size:14px;color:rgba(255,255,255,0.7);flex-wrap:wrap;"></div>
      <div id="dayDetailExList" style="display:none;flex-direction:column;max-height:240px;overflow-y:auto;"></div>
      <div id="dayDetailEmpty" class="kr" style="display:none;font-size:14px;color:rgba(255,255,255,0.4);text-align:center;padding:24px 0;">기록 없음</div>
      <div id="dayDetailConfirm" style="display:none;flex-direction:column;gap:8px;">
        <div class="kr" style="font-size:15px;color:rgba(255,255,255,0.85);text-align:center;margin:8px 0 12px;">이 날짜의 기록을 삭제하시겠습니까?</div>
        <button class="kr" type="button" data-day-detail-action="delete-confirm" style="width:100%;height:44px;border-radius:10px;border:0;background:var(--accent);color:#fff;font-size:16px;font-weight:600;cursor:pointer;">삭제</button>
        <button class="kr" type="button" data-day-detail-action="cancel" style="width:100%;height:44px;border-radius:10px;border:0;background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.7);font-size:16px;cursor:pointer;">취소</button>
      </div>
    </div>
  </div>
  <div class="phone-home"></div>
</div>

<script>
  // 탭 토글
  const phone = document.querySelector('.phone');
  document.querySelectorAll('.tab-item').forEach(el => {
    el.addEventListener('click', () => phone.dataset.tab = el.dataset.go);
  });

  // 캘린더 그리드 렌더 (5월 1일이 금요일이라고 가정 — 4 cell empty)
  const cal = document.getElementById('calGrid');
  const worked = { 1:1, 4:2, 6:3, 8:1, 11:2, 13:1, 15:2, 18:3, 22:1, 25:2, 27:1 };
  const today = 6;
  let html = '';
  for (let i = 0; i < 4; i++) html += '<div></div>';
  for (let d = 1; d <= 31; d++) {
    const intensity = worked[d] || 0;
    const isToday = d === today;
    const w = 11 + intensity * 1.5;
    const c = intensity ? '#fff' : 'rgba(255,255,255,0.3)';
    const fw = intensity ? 600 : 300;
    const cls = 'cal-cell' + (isToday ? ' today' : '');
    html += '<div class="' + cls + '" data-day="' + d + '" style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;">';
    html += '<span class="num" style="font-size:' + w + 'px;font-weight:' + fw + ';color:' + c + ';">' + d + '</span>';
    if (isToday) html += '<div style="position:absolute;bottom:6px;width:12px;height:2px;background:var(--accent);border-radius:1px;"></div>';
    html += '</div>';
  }
  cal.innerHTML = html;

  // 추이 라인 차트 SVG
  const svg = document.getElementById('trend-svg');
  const data = [55,62,58,71,68,75,82,86];
  const max = Math.max(...data), min = Math.min(...data);
  const W = 280, H = 110;
  const pts = data.map((v,i) => [(i/(data.length-1))*W, H - ((v-min)/(max-min))*H]);
  const path = pts.map((p,i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  let svgInner = '<defs><linearGradient id="grad2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(217,119,87,0.32)"/><stop offset="100%" stop-color="rgba(217,119,87,0)"/></linearGradient></defs>';
  svgInner += '<path d="' + path + ' L' + W + ' ' + H + ' L0 ' + H + ' Z" fill="url(#grad2)"/>';
  svgInner += '<path d="' + path + '" stroke="var(--accent)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
  pts.forEach((p, i) => {
    const last = i === pts.length - 1;
    svgInner += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + (last ? 5 : 2.5) + '" fill="' + (last ? 'var(--accent)' : 'rgba(255,255,255,0.5)') + '"' + (last ? ' stroke="#0c0a08" stroke-width="3"' : '') + '/>';
  });
  const labels = ['8주전','6주전','4주전','2주전','이번'];
  svgInner += '<g fill="rgba(255,255,255,0.35)" font-size="9">';
  labels.forEach((l, i) => {
    svgInner += '<text x="' + ((i/4)*W) + '" y="' + (H+18) + '" text-anchor="middle" class="kr">' + l + '</text>';
  });
  svgInner += '</g>';
  svg.innerHTML = svgInner;
</script>
</body>
</html>
