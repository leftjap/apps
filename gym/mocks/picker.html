<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>Gym · 운동 선택</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  /* TOKENS — White & Claude Orange */
  :root {
    --bg: #ffffff;
    --surface: #fbfaf8;
    --bg-warm: #f4f3f1;
    --text: #1a1a18;
    --text-strong: #0a0a08;
    --text-muted: #7a7872;
    --text-faint: #bdbab3;
    --accent: #d97757;
    --accent-soft: #f1c4ad;
    --accent-deep: #c96442;
    --accent-hover: #c96442;
    --accent-rgb: 217, 119, 87;
    --done: #d97757;
    --done-soft: rgba(217,119,87,0.16);
    --sage: #d97757;
    --blue: #6a9bcc;
    --amber: #c4973b;
    --danger: #c94432;
    --border: rgba(26,26,24,0.08);
    --border-strong: rgba(26,26,24,0.14);
    --border-light: rgba(26,26,24,0.05);

    --font-display: 'Poppins', system-ui, sans-serif;
    --font-body: 'Noto Sans KR', system-ui, sans-serif;
    --fs-xs: 11px; --fs-sm: 13px; --fs-base: 15px; --fs-md: 16px; --fs-lg: 20px; --fs-xl: 28px;

    --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px;
    --s-5: 20px; --s-6: 24px; --s-8: 32px; --s-10: 40px;
    --s-12: 48px; --s-16: 64px;
    --r-sm: 6px; --r-md: 10px; --r-lg: 16px; --r-xl: 20px; --r-pill: 999px;

    --shadow-xs: 0 1px 2px rgba(0,0,0,0.03);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.03), 0 8px 24px rgba(0,0,0,0.04);
    --shadow-lg: 0 6px 14px rgba(0,0,0,0.04), 0 30px 60px rgba(0,0,0,0.06);

    --ease: cubic-bezier(0.4, 0, 0.2, 1);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: var(--font-body);
    color: var(--text);
    background: var(--bg);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
    background-size: 256px 256px;
    background-blend-mode: multiply;
    font-variant-numeric: tabular-nums;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* PHONE FRAME 375×812 */
  .phone {
    max-width: 375px;
    height: 100dvh;
    max-height: 812px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    background: var(--bg);
  }
  @media (min-width: 376px) {
    body { padding: var(--s-8) 0; }
    .phone {
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
      border-radius: var(--r-lg);
    }
  }
  .safe-top { height: var(--safe-top); min-height: 20px; flex-shrink: 0; }

  /* 배경 — 세션 화면 skeleton (희미하게) */
  .bg-skeleton {
    flex: 1;
    padding: var(--s-4) var(--s-5);
    opacity: 0.35;
    pointer-events: none;
  }
  .sk-row {
    height: 12px;
    background: var(--border);
    border-radius: var(--r-sm);
    margin-bottom: var(--s-3);
  }
  .sk-row.w-40 { width: 40%; }
  .sk-row.w-60 { width: 60%; }
  .sk-card {
    height: 180px;
    background: var(--surface);
    border: 1px solid var(--border-light);
    border-radius: var(--r-lg);
    margin-bottom: var(--s-4);
    margin-top: var(--s-6);
  }

  /* 바텀시트 backdrop */
  .backdrop {
    position: absolute;
    inset: 0;
    background: rgba(20,20,19,0.38);
    z-index: 40;
  }

  /* ============ PICKER SHEET ============ */
  .sheet {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 82%;
    background: var(--surface);
    border-radius: var(--r-lg) var(--r-lg) 0 0;
    box-shadow: var(--shadow-lg);
    z-index: 50;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sheet-handle {
    width: 36px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: var(--s-3) auto var(--s-2);
    flex-shrink: 0;
  }

  /* 헤더 — 타이틀 */
  .picker-head {
    padding: var(--s-3) var(--s-5) var(--s-3);
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }
  .picker-title {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 600;
    color: var(--text-strong);
    letter-spacing: -0.01em;
  }

  /* 부위 탭 (chip 가로 스크롤) — 우측 fade mask 로 "더 있음" 힌트 (session.html `.addex-chips` 패턴 재사용) */
  .parts {
    flex-shrink: 0;
    display: flex;
    gap: var(--s-1);
    padding: 0 var(--s-5) var(--s-3);
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-mask-image: linear-gradient(to right, black calc(100% - 24px), transparent 100%);
            mask-image: linear-gradient(to right, black calc(100% - 24px), transparent 100%);
  }
  .parts::-webkit-scrollbar { display: none; }
  /* 스크롤 끝 도달 시 fade 제거 (더 이상 가려질 내용 없음) */
  .parts.is-scroll-end {
    -webkit-mask-image: none;
            mask-image: none;
  }
  .part-chip {
    flex-shrink: 0;
    background: none;
    border: none;
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 500;
    color: var(--text-muted);
    padding: 8px 14px;
    border-radius: var(--r-pill);
    cursor: pointer;
    transition: color 150ms var(--ease), background 150ms var(--ease);
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
  .part-chip:active { background: var(--bg-warm); }
  .part-chip.is-active {
    color: var(--text-strong);
    font-weight: 600;
    background: var(--bg-warm);
  }

  /* 종목 리스트 */
  .list {
    flex: 1;
    overflow-y: auto;
    padding: 0 var(--s-5) calc(var(--s-6) + var(--safe-bottom));
    -webkit-overflow-scrolling: touch;
  }
  .ex-row {
    display: grid;
    grid-template-columns: 22px 1fr auto;
    gap: var(--s-3);
    align-items: center;
    padding: var(--s-4) 0;
    background: none;
    border: none;
    border-bottom: 1px solid var(--border-light);
    width: 100%;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    transition: background 120ms var(--ease);
  }
  .ex-row:active { background: var(--bg-warm); }
  .ex-row:last-child { border-bottom: none; }
  .ex-check {
    width: 20px; height: 20px;
    flex-shrink: 0;
    visibility: hidden;
  }
  .ex-name {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 500;
    color: var(--text-strong);
    letter-spacing: -0.005em;
    min-width: 0;
  }
  .ex-meta {
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 400;
    color: var(--text-faint);
    letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums;
    text-align: right;
    white-space: nowrap;
  }

  /* reveal */
  .rv { opacity: 0; transform: translateY(8px); animation: rvUp 0.4s var(--ease-out) forwards; }
  @keyframes rvUp { to { opacity: 1; transform: translateY(0); } }

  /* Toast */
  .toast {
    position: absolute;
    left: 50%;
    bottom: calc(var(--s-12) + var(--safe-bottom));
    transform: translate(-50%, 20px);
    background: rgba(20,20,19,0.9);
    color: #fff;
    padding: var(--s-3) var(--s-5);
    border-radius: var(--r-pill);
    font-family: var(--font-body);
    font-size: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 200ms var(--ease), transform 200ms var(--ease);
    z-index: 80;
    box-shadow: var(--shadow-lg);
    white-space: nowrap;
  }
  .toast.is-show { opacity: 1; transform: translate(-50%, 0); }

</style>
</head>
<body>

<div class="phone" id="app">
  <div class="safe-top"></div>

  <!-- 배경 skeleton (세션 실루엣) -->
  <div class="bg-skeleton">
    <div class="sk-row w-40"></div>
    <div class="sk-row w-60"></div>
    <div class="sk-card"></div>
    <div class="sk-row w-60"></div>
    <div class="sk-row w-40"></div>
  </div>

  <!-- 바텀시트 backdrop -->
  <div class="backdrop"></div>

  <!-- Picker sheet -->
  <div class="sheet rv" id="sheet">
    <div class="sheet-handle"></div>

    <div class="picker-head">
      <div class="picker-title">운동 선택</div>
    </div>

    <nav class="parts" id="parts"></nav>

    <div class="list" id="list"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const PARTS = [
  { id: 'chest',    name: '가슴' },
  { id: 'back',     name: '등' },
  { id: 'shoulder', name: '어깨' },
  { id: 'legs',     name: '하체' },
  { id: 'arms',     name: '팔' },
  { id: 'core',     name: '코어' },
  { id: 'cardio',   name: '유산소' }
];

const EXERCISES = [
  // chest
  { id: 'bench_press',         name: '벤치프레스',          part: 'chest', w: 60, r: 10 },
  { id: 'incline_bench',       name: '인클라인 벤치프레스',  part: 'chest', w: 50, r: 10 },
  { id: 'dumbbell_press',      name: '덤벨 프레스',         part: 'chest', w: 22, r: 10 },
  { id: 'dumbbell_fly',        name: '덤벨 플라이',         part: 'chest', w: 14, r: 12 },
  { id: 'cable_crossover',     name: '케이블 크로스오버',    part: 'chest', w: 15, r: 12 },
  { id: 'chest_press_machine', name: '체스트 프레스',       part: 'chest', w: 40, r: 10 },
  { id: 'pushup',              name: '푸쉬업',              part: 'chest', w: null, r: 20 },
  // back
  { id: 'barbell_row',  name: '바벨 로우',    part: 'back', w: 50, r: 10 },
  { id: 'dumbbell_row', name: '덤벨 로우',    part: 'back', w: 20, r: 10 },
  { id: 'seated_row',   name: '시티드 로우',  part: 'back', w: 45, r: 10 },
  { id: 'cable_row',    name: '케이블 로우',  part: 'back', w: 45, r: 10 },
  { id: 'lat_pulldown', name: '랫 풀다운',    part: 'back', w: 50, r: 10 },
  { id: 'pullup',       name: '풀업',         part: 'back', w: null, r: 8 },
  { id: 'chinup',       name: '친업',         part: 'back', w: null, r: 8 },
  // shoulder
  { id: 'shoulder_press', name: '숄더 프레스',       part: 'shoulder', w: 30, r: 10 },
  { id: 'military_press', name: '밀리터리 프레스',    part: 'shoulder', w: 35, r: 8 },
  { id: 'lateral_raise',  name: '덤벨 레터럴 레이즈', part: 'shoulder', w: 8,  r: 12 },
  { id: 'front_raise',    name: '프론트 레이즈',      part: 'shoulder', w: 8,  r: 12 },
  { id: 'face_pull',      name: '페이스 풀',         part: 'shoulder', w: 20, r: 12 },
  { id: 'rear_delt_fly',  name: '리어 델트 플라이',   part: 'shoulder', w: 6,  r: 12 },
  // legs
  { id: 'squat',          name: '스쿼트',       part: 'legs', w: 60,  r: 10 },
  { id: 'deadlift',       name: '데드리프트',   part: 'legs', w: 80,  r: 5 },
  { id: 'lunge',          name: '런지',         part: 'legs', w: 20,  r: 10 },
  { id: 'leg_press',      name: '레그 프레스',   part: 'legs', w: 100, r: 10 },
  { id: 'hip_thrust',     name: '힙 쓰러스트',   part: 'legs', w: 50,  r: 10 },
  { id: 'good_morning',   name: '굿모닝',       part: 'legs', w: 40,  r: 10 },
  { id: 'leg_curl',       name: '레그 컬',      part: 'legs', w: 30,  r: 12 },
  { id: 'leg_extension',  name: '레그 익스텐션', part: 'legs', w: 35,  r: 12 },
  // arms
  { id: 'bicep_curl',        name: '바이셉 컬',        part: 'arms', w: 10, r: 10 },
  { id: 'hammer_curl',       name: '해머 컬',          part: 'arms', w: 10, r: 10 },
  { id: 'cable_curl',        name: '케이블 컬',        part: 'arms', w: 20, r: 12 },
  { id: 'tricep_extension',  name: '트라이셉 익스텐션', part: 'arms', w: 12, r: 10 },
  { id: 'cable_pushdown',    name: '케이블 푸시다운',   part: 'arms', w: 25, r: 12 },
  { id: 'dips',              name: '딥스',             part: 'arms', w: null, r: 10 },
  { id: 'wrist_curl',        name: '손목 컬',          part: 'arms', w: 5, r: 15 },
  // core
  { id: 'situp',       name: '싯업',       part: 'core', w: null, r: 15 },
  { id: 'leg_raise',   name: '레그 레이즈', part: 'core', w: null, r: 15 },
  { id: 'plank',       name: '플랭크',     part: 'core', d: 2 },
  // cardio
  { id: 'treadmill',   name: '트레드밀',   part: 'cardio', d: 30 },
  { id: 'cycle',       name: '사이클',     part: 'cardio', d: 30 },
  { id: 'elliptical',  name: '엘립티컬',   part: 'cardio', d: 30 },
];

const state = {
  activePart: 'chest',
};

function renderParts() {
  const el = document.getElementById('parts');
  el.innerHTML = PARTS.map(p => `
    <button class="part-chip${p.id === state.activePart ? ' is-active' : ''}" data-part="${p.id}">${p.name}</button>
  `).join('');
}

function renderList() {
  const el = document.getElementById('list');
  const items = EXERCISES.filter(e => e.part === state.activePart);
  el.innerHTML = items.map(ex => {
    let meta = '';
    if (ex.d != null) meta = `${ex.d}분`;
    else if (ex.w == null) meta = `맨몸 · ${ex.r}회`;
    else meta = `${ex.w}kg × ${ex.r}회`;
    return `
      <button class="ex-row" data-id="${ex.id}">
        <span class="ex-check"></span>
        <span class="ex-name">${ex.name}</span>
        <span class="ex-meta">${meta}</span>
      </button>
    `;
  }).join('');
}

// interactions
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('is-show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('is-show'), 1600);
}

document.getElementById('parts').addEventListener('click', (e) => {
  const b = e.target.closest('[data-part]');
  if (!b) return;
  state.activePart = b.dataset.part;
  renderParts();
  renderList();
});

document.getElementById('list').addEventListener('click', (e) => {
  const row = e.target.closest('[data-id]');
  if (!row) return;
  const ex = EXERCISES.find(x => x.id === row.dataset.id);
  toast(`${ex.name} 추가됨`);
  try { sessionStorage.setItem('addedExercise', ex.name); } catch(_) {}
  setTimeout(() => { window.location.href = 'session.html'; }, 500);
});

// 배경 dim / handle 탭 → session 복귀 (취소)
document.querySelector('.backdrop').addEventListener('click', () => {
  window.location.href = 'session.html';
});
document.querySelector('.sheet-handle').addEventListener('click', () => {
  window.location.href = 'session.html';
});

/* 가로 스크롤 fade 힌트 토글 — session.html addex-chips 패턴 재사용.
   스크롤 끝까지 가면 우측 fade mask 제거 (더 이상 가려질 내용 없음). */
(function setupPartsScrollHint() {
  const parts = document.getElementById('parts');
  const updateScrollEnd = () => {
    const maxScroll = parts.scrollWidth - parts.clientWidth;
    const atEnd = maxScroll <= 1 || parts.scrollLeft >= maxScroll - 1;
    parts.classList.toggle('is-scroll-end', atEnd);
  };
  parts.addEventListener('scroll', updateScrollEnd, { passive: true });
  window.addEventListener('resize', updateScrollEnd);
  requestAnimationFrame(updateScrollEnd);
})();

// init
renderParts();
renderList();
</script>

</body>
</html>
