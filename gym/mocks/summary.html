<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0a08">
<title>Gym · 운동 완료 (v2 · CompleteB)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf9f5; --bg-warm: #f3efe6; --bg-deep: #ece7db;
  --surface: #ffffff; --surface-2: #f7f4ec;
  --ink: #1a1714; --ink-strong: #0c0a08;
  --ink-2: #5a544a; --ink-muted: #8d8678; --ink-faint: #c4beb1;
  --line: #e6e1d4; --line-soft: #efeae0;
  --accent: #d97757; --accent-soft: #ecb59f; --accent-deep: #b85a3e; --accent-tint: #fbe9df;
  --sage: #788c5d; --sage-soft: #c0c9aa; --night: #1f1c18;
  --r-xl: 22px; --r-lg: 16px; --r-md: 12px; --r-sm: 8px;
  --shadow-card: 0 1px 2px rgba(28,22,16,.04), 0 8px 24px -8px rgba(28,22,16,.08);
  --shadow-lift: 0 32px 64px -12px rgba(217,119,87,.22), 0 12px 28px -10px rgba(28,22,16,.18);
  --font-display: "Poppins", "SF Pro Display", -apple-system, system-ui, sans-serif;
  --font-body: "Noto Sans KR", -apple-system, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", monospace;
}
* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
body { margin: 0; min-height: 100vh; background: var(--bg-deep); display: flex; align-items: center; justify-content: center; padding: 24px; font-family: var(--font-body); color: var(--ink); }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.kr { font-family: var(--font-body); }
.phone { width: 360px; height: 740px; border-radius: 38px; position: relative; overflow: hidden; box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 30px 60px -20px rgba(28,22,16,.18), 0 0 0 1px rgba(28,22,16,.06); font-family: var(--font-body); color: var(--ink); }
.phone-notch { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 102px; height: 30px; border-radius: 20px; background: #0c0a08; z-index: 50; }
.phone-clock { position: absolute; top: 16px; left: 24px; z-index: 49; font-family: var(--font-display); font-weight: 600; font-size:16px; letter-spacing: -0.01em; color: var(--ink-strong); }
.phone-batt { position: absolute; top: 16px; right: 24px; z-index: 49; display: flex; gap: 5px; align-items: center; color: var(--ink-strong); }
.phone-batt-cell { width: 16px; height: 10px; border-radius: 2px; border: 1.2px solid currentColor; position: relative; }
.phone-batt-cell::after { content: ""; position: absolute; inset: 1.5px; background: currentColor; border-radius: 1px; display: block; }
.phone-content { position: absolute; inset: 0; padding-top: 54px; padding-bottom: 24px; }
.phone-home { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 120px; height: 4px; border-radius: 100px; z-index: 60; background: rgba(0,0,0,.22); }
.phone.dark { color: #f3efe6; }
.phone.dark .phone-clock, .phone.dark .phone-batt { color: #f3efe6; }
.phone.dark .phone-home { background: rgba(255,255,255,.32); }
.receipt { width: 280px; background: #15120e; padding: 26px 24px 18px; box-shadow: 0 30px 60px -10px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.06); clip-path: polygon(0 0, 100% 0, 100% 100%, 95% 98%, 90% 100%, 85% 98%, 80% 100%, 75% 98%, 70% 100%, 65% 98%, 60% 100%, 55% 98%, 50% 100%, 45% 98%, 40% 100%, 35% 98%, 30% 100%, 25% 98%, 20% 100%, 15% 98%, 10% 100%, 5% 98%, 0 100%); }
</style>
</head>
<body>
<div class="phone dark" style="background:rgba(8,6,4,0.78);">
  <div class="phone-notch"></div>
  <div class="phone-content">
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
      <div class="receipt">
        <!-- 영수증 헤더 -->
        <div style="text-align:center;padding-bottom:16px;border-bottom:1px dashed rgba(255,255,255,0.15);">
          <div class="num" style="font-size:24px;font-weight:600;letter-spacing:0.08em;color:#fff;">GYM</div>
          <div id="summaryReceiptNo" class="kr" style="margin-top:6px;font-size:13px;color:rgba(255,255,255,0.45);letter-spacing:0.18em;">SESSION RECEIPT · #0142</div>
          <div id="summaryDate" class="num" style="margin-top:6px;font-size:13px;color:rgba(255,255,255,0.45);">2026-05-06 · WED · 18:42→19:34</div>
        </div>
        <!-- 운동 행 -->
        <div id="summaryExList" style="padding:14px 0;border-bottom:1px dashed rgba(255,255,255,0.15);">
          <div class="kr" style="display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;">
            <span style="font-size:14px;color:#fff;display:flex;align-items:center;gap:6px;">벤치프레스<span style="font-size:13px;color:var(--accent);padding:1px 5px;border:1px solid var(--accent);border-radius:3px;font-weight:600;">PR</span></span>
            <span class="num" style="font-size:13px;color:rgba(255,255,255,0.5);">5×</span>
            <span class="num" style="font-size:14px;color:rgba(255,255,255,0.7);font-weight:500;">600kg</span>
          </div>
        </div>
        <!-- TOTAL -->
        <div style="padding:14px 0;display:flex;justify-content:space-between;align-items:baseline;">
          <span class="kr" style="font-size:13px;color:rgba(255,255,255,0.55);letter-spacing:0.1em;">TOTAL</span>
          <div class="num" style="font-size:36px;font-weight:300;color:#fff;letter-spacing:-0.02em;"><span id="summaryTotal">888</span><span style="font-size:16px;color:rgba(255,255,255,0.5);margin-left:4px;">kg</span></div>
        </div>
        <!-- 메타 -->
        <div class="num" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-bottom:14px;border-bottom:1px dashed rgba(255,255,255,0.15);">
          <div id="summaryDuration" style="font-size:13px;color:rgba(255,255,255,0.5);">52분</div>
          <div id="summaryPR" style="font-size:13px;color:var(--accent);font-weight:600;text-align:center;">1 PR ★</div>
          <div id="summaryKcal" style="font-size:13px;color:rgba(255,255,255,0.5);text-align:right;">286 kcal</div>
        </div>
        <div class="kr" style="text-align:center;padding:16px 0 12px;font-size:13px;color:rgba(255,255,255,0.5);letter-spacing:0.06em;">오늘도 한 줄, 기록 완료</div>
        <button id="summaryHomeBtn" type="button" class="kr" style="width:100%;height:38px;border-radius:0;border:1px solid #fff;background:transparent;color:#fff;font-size:14px;font-weight:500;letter-spacing:0.06em;cursor:pointer;">홈으로</button>
      </div>
    </div>
  </div>
  <div class="phone-home"></div>
</div>
<script>
(function () {
  const btn = document.getElementById('summaryHomeBtn');
  if (!btn) return;
  btn.addEventListener('click', () => { window.location.hash = '#/home'; });
})();
</script>
</body>
</html>
