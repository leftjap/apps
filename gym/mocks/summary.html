<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fdfdfd">
<title>Gym · 운동 완료 (영수증 · Light Paper)</title>
<style>
* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
body { margin: 0; min-height: 100vh; background: #f1ede4; display: flex; align-items: center; justify-content: center; padding: 24px; font-family: var(--font-sans); color: var(--ink-1); }
.phone { width: 360px; height: 740px; border-radius: 38px; position: relative; overflow: hidden; background: var(--shell); box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 30px 60px -20px rgba(20,18,14,.18), 0 0 0 1px rgba(20,18,14,.06); font-family: var(--font-sans); color: var(--ink-1); }
.phone-notch { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 102px; height: 30px; border-radius: 20px; background: var(--ink-1); z-index: 50; }
.phone-clock { position: absolute; top: 16px; left: 24px; z-index: 49; font-family: var(--font-mono); font-weight: 600; font-size:16px; letter-spacing: -0.01em; color: var(--ink-1); }
.phone-batt { position: absolute; top: 16px; right: 24px; z-index: 49; display: flex; gap: 5px; align-items: center; color: var(--ink-1); }
.phone-batt-cell { width: 16px; height: 10px; border-radius: 2px; border: 1.2px solid currentColor; position: relative; }
.phone-batt-cell::after { content: ""; position: absolute; inset: 1.5px; background: currentColor; border-radius: 1px; display: block; }
.phone-content { position: absolute; inset: 0; padding-top: 54px; padding-bottom: 24px; }
.phone-home { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 120px; height: 4px; border-radius: 100px; z-index: 60; background: rgba(20,18,14,.22); }

/* 종이 영수증 — 흰 종이(#fffdf8), 점선 분리, 모노 타이포. 하단 톱니(찢긴 종이). */
.receipt { width: 286px; background: #fffdf8; color: var(--ink-1); padding: 26px 26px 30px;
  box-shadow: 0 1px 0 rgba(20,18,14,0.03), 0 18px 40px -16px rgba(20,18,14,0.22), 0 2px 8px -4px rgba(20,18,14,0.1);
  clip-path: polygon(0 0, 100% 0, 100% 99%, 95.8% 100%, 91.6% 99%, 87.5% 100%, 83.3% 99%, 79.1% 100%, 75% 99%, 70.8% 100%, 66.6% 99%, 62.5% 100%, 58.3% 99%, 54.1% 100%, 50% 99%, 45.8% 100%, 41.6% 99%, 37.5% 100%, 33.3% 99%, 29.1% 100%, 25% 99%, 20.8% 100%, 16.6% 99%, 12.5% 100%, 8.3% 99%, 4.1% 100%, 0 99%); }
</style>
</head>
<body>
<div class="phone">
  <div class="phone-notch"></div>
  <div class="phone-clock">9:41</div>
  <div class="phone-batt"><span class="phone-batt-cell"></span></div>
  <div class="phone-content">
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
      <div class="receipt">
        <!-- 영수증 헤더 -->
        <div style="text-align:center;padding-bottom:16px;border-bottom:1.5px dashed var(--line);">
          <div class="mono" style="font-size:22px;font-weight:600;letter-spacing:0.16em;color:var(--ink-1);">GYM</div>
          <div id="summaryReceiptNo" class="mono" style="margin-top:7px;font-size:11px;font-weight:500;color:var(--ink-3);letter-spacing:0.18em;">SESSION · #0142</div>
          <div id="summaryDate" class="mono" style="margin-top:5px;font-size:11px;color:var(--ink-4);letter-spacing:0.02em;">2026-05-06 WED · 18:42→19:34</div>
        </div>
        <!-- 운동 행 (3열: 이름 | 세트수 | 볼륨) -->
        <div id="summaryExList" style="padding:6px 0 12px;border-bottom:1.5px dashed var(--line);">
          <div style="display:grid;grid-template-columns:1fr auto auto;align-items:baseline;column-gap:12px;padding:7px 0;">
            <span style="font-size:13px;font-weight:500;color:var(--crail-deep);display:flex;align-items:center;gap:6px;white-space:nowrap;">벤치프레스<span style="color:var(--crail-deep);font-size:11px;">★</span></span>
            <span class="mono" style="font-size:12px;color:var(--ink-4);white-space:nowrap;">5세트</span>
            <span class="mono" style="font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap;min-width:56px;text-align:right;">600kg</span>
          </div>
        </div>
        <!-- TOTAL -->
        <div style="padding:14px 0;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1.5px dashed var(--line);">
          <span class="mono" style="font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:0.12em;">TOTAL</span>
          <div class="mono" style="font-size:38px;font-weight:500;color:var(--ink-1);letter-spacing:-0.03em;"><span id="summaryTotal">888</span><span style="font-size:15px;font-weight:500;color:var(--ink-4);margin-left:3px;">kg</span></div>
        </div>
        <!-- 메타 3열: 소요 / 신기록 / 세트 -->
        <div style="display:grid;grid-template-columns:repeat(3,1fr);padding:13px 0;border-bottom:1.5px dashed var(--line);">
          <div style="text-align:left;">
            <div id="summaryDuration" class="mono" style="font-size:14px;font-weight:600;color:var(--ink-1);">52분</div>
            <div style="margin-top:3px;font-size:10px;font-weight:500;color:var(--ink-4);letter-spacing:0.04em;">소요</div>
          </div>
          <div style="text-align:center;">
            <div id="summaryPR" class="mono" style="font-size:14px;font-weight:600;color:var(--crail-deep);">1</div>
            <div style="margin-top:3px;font-size:10px;font-weight:500;color:var(--ink-4);letter-spacing:0.04em;">신기록</div>
          </div>
          <div style="text-align:right;">
            <div id="summaryKcal" class="mono" style="font-size:14px;font-weight:600;color:var(--ink-1);">12</div>
            <div style="margin-top:3px;font-size:10px;font-weight:500;color:var(--ink-4);letter-spacing:0.04em;">세트</div>
          </div>
        </div>
        <!-- 하단 스탬프 — 연속 주 칩 -->
        <div style="text-align:center;padding:18px 0 16px;">
          <div style="display:inline-flex;align-items:center;gap:7px;padding:7px 16px;border:1.5px solid var(--crail-base);border-radius:999px;">
            <span id="summaryStampStar" style="color:var(--crail-deep);font-size:11px;">★</span><span id="summaryStamp" class="mono" style="font-size:12px;font-weight:600;color:var(--ink-1);letter-spacing:0.04em;white-space:nowrap;">3주 연속 달성</span>
          </div>
        </div>
        <button id="summaryHomeBtn" type="button" style="width:100%;height:46px;border-radius:var(--r-md);border:0;background:var(--ink-1);color:#fbf8f2;font-family:var(--font-sans);font-size:15px;font-weight:600;cursor:pointer;">홈으로</button>
      </div>
    </div>
  </div>
  <div class="phone-home"></div>
</div>
<script>
(function () {
  const btn = document.getElementById('summaryHomeBtn');
  if (!btn) return;
  btn.addEventListener('click', () => { window.location.hash = '#/home'; });
})();
</script>
</body>
</html>
