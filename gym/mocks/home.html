<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0a08">
<title>Gym · 홈 (v2 · HomeA/HomeC)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf9f5; --bg-warm: #f3efe6; --bg-deep: #ece7db;
  --surface: #ffffff; --surface-2: #f7f4ec;
  --ink: #1a1714; --ink-strong: #0c0a08;
  --ink-2: #5a544a; --ink-muted: #8d8678; --ink-faint: #c4beb1;
  --line: #e6e1d4; --line-soft: #efeae0;
  --accent: #d97757; --accent-soft: #ecb59f; --accent-deep: #b85a3e; --accent-tint: #fbe9df;
  --sage: #788c5d; --sage-soft: #c0c9aa; --night: #1f1c18;
  --r-xl: 22px; --r-lg: 16px; --r-md: 12px; --r-sm: 8px;
  --shadow-card: 0 1px 2px rgba(28,22,16,.04), 0 8px 24px -8px rgba(28,22,16,.08);
  --shadow-lift: 0 32px 64px -12px rgba(217,119,87,.22), 0 12px 28px -10px rgba(28,22,16,.18);
  --font-display: "Space Grotesk", ui-monospace, monospace;
  --font-body: "Pretendard", "Inter", system-ui, sans-serif;
  --font-mono: "Space Grotesk", ui-monospace, monospace;
}
* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
body { margin: 0; min-height: 100vh; background: var(--bg-deep); display: flex; align-items: center; justify-content: center; padding: 24px; font-family: var(--font-body); color: var(--ink); }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.kr { font-family: var(--font-body); }
.phone { width: 360px; height: 740px; border-radius: 38px; position: relative; overflow: hidden; box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 30px 60px -20px rgba(28,22,16,.18), 0 0 0 1px rgba(28,22,16,.06); font-family: var(--font-body); color: var(--ink); }
.phone-notch { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 102px; height: 30px; border-radius: 20px; background: #0c0a08; z-index: 50; }
.phone-clock { position: absolute; top: 16px; left: 24px; z-index: 49; font-family: var(--font-display); font-weight: 600; font-size:16px; letter-spacing: -0.01em; color: var(--ink-strong); }
.phone-batt { position: absolute; top: 16px; right: 24px; z-index: 49; display: flex; gap: 5px; align-items: center; color: var(--ink-strong); }
.phone-batt-cell { width: 16px; height: 10px; border-radius: 2px; border: 1.2px solid currentColor; position: relative; }
.phone-batt-cell::after { content: ""; position: absolute; inset: 1.5px; background: currentColor; border-radius: 1px; display: block; }
.phone-content { position: absolute; inset: 0; padding-top: 54px; padding-bottom: 24px; }
.phone-home { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 120px; height: 4px; border-radius: 100px; z-index: 60; background: rgba(0,0,0,.22); }
.phone.dark { color: #f3efe6; }
.phone.dark .phone-clock, .phone.dark .phone-batt { color: #f3efe6; }
.phone.dark .phone-home { background: rgba(255,255,255,.32); }
[data-state="active"] .home-a { display: none; }
[data-state="idle"] .home-c { display: none; }
/* 주간 스트립 — home.js renderWeekCalendarToDom (cal-day + cal-label/num/part). P5 라이트: 오늘=crail 원, 운동한 날 앞글자=crail. */
.cal-day { display: flex; flex-direction: column; align-items: center; gap: 5px; background: transparent; border: 0; padding: 4px 0; cursor: pointer; font-family: inherit; }
.cal-label { font-size: 12px; font-weight: 500; color: var(--ink-4); }
.cal-day.today .cal-label { color: var(--crail-deep); font-weight: 600; }
.cal-num { font-family: var(--font-mono); font-size: 16px; font-weight: 500; color: var(--ink-4); letter-spacing: -0.02em; }
.cal-day.worked .cal-num { color: var(--ink-2); }
.cal-day.today .cal-num { width: 28px; height: 28px; border-radius: 50%; background: var(--crail-base); color: #fff; display: flex; align-items: center; justify-content: center; }
.cal-part { font-size: 10px; font-weight: 600; color: transparent; line-height: 1; min-height: 11px; }
.cal-day.worked .cal-part { color: var(--crail-deep); }
/* P5 이번 주 4세그먼트 (applyStreakToDom 렌더) */
#homeWeekSeg i { height: 8px; border-radius: 4px; background: var(--line); }
#homeWeekSeg i.fill { background: var(--crail-base); }
/* P6 이어하기 박스 (home-c · applyToDom) — 박스 전체 버튼, 브리딩. */
#cardResume { width: 100%; background: var(--card); border: 1.5px solid var(--crail-base); border-radius: var(--r-xl); box-shadow: var(--shadow-pop); padding: 24px 24px 22px; cursor: pointer; animation: breath 2.8s ease-in-out infinite; }
#cardResume:active { transform: scale(0.992); }
@keyframes breath { 0%, 100% { box-shadow: 0 18px 40px -22px rgba(20,18,14,0.28), 0 0 0 0 rgba(193,99,63,0); } 50% { box-shadow: 0 18px 40px -22px rgba(20,18,14,0.28), 0 0 0 5px rgba(193,99,63,0.10); } }
#cardResumeSeg { display: flex; gap: 6px; }
#cardResumeSeg .seg { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 7px; }
#cardResumeSeg .seg .bar { width: 100%; height: 8px; border-radius: 4px; box-shadow: inset 0 0 0 1.5px var(--line); }
#cardResumeSeg .seg.done .bar { background: var(--ink-2); box-shadow: none; }
#cardResumeSeg .seg.now .bar { background: var(--crail-base); box-shadow: none; height: 10px; animation: segGlow 1.8s ease-in-out infinite; }
#cardResumeSeg .seg .n { font-family: var(--font-mono); font-size: 10px; font-weight: 500; color: var(--ink-4); white-space: nowrap; }
#cardResumeSeg .seg.now .n { color: var(--crail-deep); font-weight: 700; }
.home-live { animation: pulse 1.6s ease-in-out infinite; }
@keyframes segGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(193,99,63,0); } 50% { box-shadow: 0 0 0 4px rgba(193,99,63,0.18); } }
@media (prefers-reduced-motion: reduce) { #cardResume, #cardResumeSeg .seg.now .bar, .home-live { animation: none; } }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
</style>
</head>
<body data-state="idle">
<!-- HomeA — idle -->
<div class="phone home-a" style="background:var(--shell);color:var(--ink-1);">
  <div class="phone-notch"></div>
  <div class="phone-content">
    <div style="height:100%;display:flex;flex-direction:column;color:var(--ink-1);padding:8px 0;">
      <!-- 헤더 -->
      <div style="flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px;">
        <div style="font-size:24px;font-weight:700;letter-spacing:-0.02em;color:var(--ink-1);">Gym</div>
        <div style="display:flex;gap:4px;" class="kr"><span class="js-home-stats" style="padding:8px 12px;border-radius:var(--r-sm);font-size:14px;font-weight:500;color:var(--ink-3);cursor:pointer;">통계</span><span class="js-home-manage" style="padding:8px 12px;border-radius:var(--r-sm);font-size:14px;font-weight:500;color:var(--ink-3);cursor:pointer;">관리</span></div>
      </div>
      <!-- 주간 스트립 (renderWeekCalendarToDom 채움) -->
      <div id="weekCal" class="js-week-cal" style="flex-shrink:0;margin-top:22px;padding:0 18px;display:grid;grid-template-columns:repeat(7,1fr);"></div>
      <!-- 오늘 체중 카드 (탭 → weightKeypadSheet 입력 모달) -->
      <div data-bind="weight-input-trigger" style="flex-shrink:0;margin:18px 26px 0;display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-inset-soft);cursor:pointer;">
        <div style="display:flex;flex-direction:column;gap:3px;min-width:0;">
          <span class="kr" style="font-size:14px;font-weight:600;color:var(--ink-1);white-space:nowrap;">오늘 체중</span>
          <span id="homeWeightRef" class="kr" style="font-size:12px;font-weight:500;color:var(--ink-4);white-space:nowrap;">직전 —kg</span>
        </div>
        <span style="display:inline-flex;align-items:baseline;gap:5px;padding:8px 16px;border-radius:var(--r-sm);background:var(--crail-tint);box-shadow:inset 0 0 0 1px var(--crail-base);">
          <span class="kr" style="font-size:13px;font-weight:600;color:var(--crail-deep);white-space:nowrap;">기록하기</span>
        </span>
      </div>
      <!-- 히어로: 이번 주 운동 (상단 앵커, 위→아래) -->
      <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-start;padding:36px 26px 0;">
        <div class="kr" style="font-size:13px;font-weight:500;color:var(--ink-3);letter-spacing:0.01em;">이번 주 운동</div>
        <div style="margin-top:12px;display:flex;align-items:baseline;gap:12px;">
          <span id="homeWeekNum" class="mono" style="font-size:104px;font-weight:500;line-height:0.82;color:var(--ink-1);letter-spacing:-0.05em;">0</span>
          <span id="homeWeekGoal" class="mono" style="font-size:24px;font-weight:400;color:var(--ink-4);white-space:nowrap;">/ 4회</span>
        </div>
        <div id="homeWeekSeg" style="margin-top:26px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;"></div>
        <div id="homeStreakWrap" style="margin-top:18px;display:none;align-self:flex-start;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;background:var(--crail-soft);border:1px solid var(--crail-base);white-space:nowrap;">
          <span id="homeStreak" class="mono" style="font-size:13px;font-weight:600;color:var(--ink-1);">0</span>
          <span class="kr" style="font-size:12px;font-weight:500;color:var(--crail-deep);">주 연속</span>
        </div>
      </div>
      <!-- CTA — 워밍 잉크 -->
      <div style="flex-shrink:0;padding:4px 26px 26px;">
        <button id="ctaBtn" type="button" class="kr" style="width:100%;height:52px;border-radius:var(--r-md);border:0;background:var(--ink-1);color:#fbf8f2;font-size:15px;font-weight:600;letter-spacing:0.01em;cursor:pointer;box-shadow:0 8px 20px -12px rgba(20,18,14,0.5);">운동 시작</button>
      </div>
    </div>
    <!-- §9-1 — 날짜 탭 → 운동 요약 바텀시트 (src/features/day-detail-sheet.js) -->
    <div id="dayDetailBackdrop" data-open="false" style="position:absolute;inset:0;z-index:90;background:oklch(22% 0.008 60 / 0.42);opacity:0;pointer-events:none;transition:opacity 200ms ease;"></div>
    <div id="dayDetailSheet" data-open="false" data-step="summary" data-iso="" style="position:absolute;left:0;right:0;bottom:0;z-index:91;background:var(--card);border-top-left-radius:var(--r-xl);border-top-right-radius:var(--r-xl);padding:18px 18px 24px;box-shadow:0 -20px 50px -18px rgba(20,18,14,0.4);transform:translateY(100%);transition:transform 200ms ease;touch-action:none;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <div id="dayDetailDate" class="kr" style="font-size:16px;color:var(--ink-1);font-weight:600;">—</div>
        <div id="dayDetailTag" class="kr" style="font-size:13px;color:var(--ink-3);"></div>
      </div>
      <div id="dayDetailMeta" class="kr" style="display:none;gap:14px;margin-bottom:12px;font-size:14px;color:var(--ink-2);flex-wrap:wrap;"></div>
      <div id="dayDetailExList" style="display:none;flex-direction:column;max-height:240px;overflow-y:auto;"></div>
      <div id="dayDetailEmpty" class="kr" style="display:none;font-size:14px;color:var(--ink-4);text-align:center;padding:24px 0;">기록 없음</div>
      <div id="dayDetailConfirm" style="display:none;flex-direction:column;gap:8px;">
        <div class="kr" style="font-size:15px;color:var(--ink-1);text-align:center;margin:8px 0 12px;">이 날짜의 기록을 삭제하시겠습니까?</div>
        <button class="kr" type="button" data-day-detail-action="delete-confirm" style="width:100%;height:48px;border-radius:var(--r-md);border:0;background:var(--danger);color:#fff;font-size:16px;font-weight:600;cursor:pointer;">삭제</button>
        <button class="kr" type="button" data-day-detail-action="cancel" style="width:100%;height:48px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);color:var(--ink-3);font-size:16px;font-weight:600;cursor:pointer;">취소</button>
      </div>
    </div>
    <!-- P5/P13 — 오늘 체중 입력 키패드 (weight-keypad-sheet.js · home/admin 공유) -->
    <div id="weightKeypadBackdrop" data-open="false" style="position:absolute;inset:0;z-index:79;background:oklch(22% 0.008 60 / 0.42);opacity:0;pointer-events:none;transition:opacity 200ms ease;"></div>
    <div id="weightKeypadSheet" data-open="false" data-buf="" style="position:absolute;left:0;right:0;bottom:0;z-index:80;background:var(--card);border-top-left-radius:var(--r-xl);border-top-right-radius:var(--r-xl);padding:12px 20px 24px;box-shadow:0 -20px 50px -18px rgba(20,18,14,0.4);transform:translateY(100%);transition:transform 200ms ease;touch-action:none;">
      <div style="width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px;"></div>
      <div style="display:flex;align-items:baseline;justify-content:center;gap:8px;">
        <div id="weightKeypadValue" class="mono" style="font-size:52px;font-weight:500;color:var(--ink-1);letter-spacing:-0.03em;line-height:1;text-align:right;">0</div>
        <div class="mono" style="font-size:17px;font-weight:500;color:var(--ink-4);">kg</div>
      </div>
      <div data-bind="wk-ref" class="kr wk-ref" style="margin-top:8px;text-align:center;font-size:12px;font-weight:500;color:var(--ink-4);">직전 <b>—</b></div>
      <div id="weightKeypadGrid" style="margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;"></div>
      <button id="weightKeypadDone" type="button" class="kr" style="margin-top:12px;width:100%;height:52px;border-radius:var(--r-md);background:var(--ink-1);color:#fbf8f2;font-size:16px;font-weight:600;border:0;cursor:pointer;box-shadow:0 8px 20px -12px rgba(20,18,14,0.5);">저장</button>
    </div>
  </div>
  <div class="phone-home"></div>
</div>

<!-- HomeC — active -->
<div class="phone home-c" style="background:var(--shell);color:var(--ink-1);">
  <div class="phone-notch"></div>
  <div class="phone-content">
    <div style="height:100%;display:flex;flex-direction:column;color:var(--ink-1);padding:8px 0;">
      <!-- 헤더 -->
      <div style="flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px;">
        <div style="font-size:24px;font-weight:700;letter-spacing:-0.02em;color:var(--ink-1);">Gym</div>
        <div style="display:flex;gap:4px;" class="kr"><span class="js-home-stats" style="padding:8px 12px;border-radius:var(--r-sm);font-size:14px;font-weight:500;color:var(--ink-3);cursor:pointer;">통계</span><span class="js-home-manage" style="padding:8px 12px;border-radius:var(--r-sm);font-size:14px;font-weight:500;color:var(--ink-3);cursor:pointer;">관리</span></div>
      </div>
      <!-- 주간 스트립 (renderWeekCalendarToDom 채움) -->
      <div class="js-week-cal" style="flex-shrink:0;margin:22px 18px 0;display:grid;grid-template-columns:repeat(7,1fr);"></div>
      <!-- 이어하기 박스 (박스 전체가 버튼 + 브리딩) -->
      <div style="flex:1;display:flex;align-items:center;padding:0 22px;">
        <div id="cardResume" role="button" tabindex="0">
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <span style="display:inline-flex;align-items:center;gap:7px;white-space:nowrap;">
              <span class="home-live" style="width:7px;height:7px;border-radius:50%;background:var(--crail-base);"></span>
              <span id="cardLabel" class="kr" style="font-size:12px;font-weight:600;color:var(--crail-deep);letter-spacing:0.06em;white-space:nowrap;">운동 중</span>
            </span>
            <span style="display:inline-flex;align-items:baseline;gap:4px;">
              <span id="cardTime" class="mono" style="font-size:18px;font-weight:500;color:var(--ink-1);letter-spacing:-0.02em;">18:42</span>
              <span id="cardUnit" class="kr" style="font-size:11px;font-weight:500;color:var(--ink-4);white-space:nowrap;">경과</span>
            </span>
          </div>
          <div id="cardExName" class="kr" style="margin-top:18px;font-size:30px;font-weight:700;color:var(--ink-1);letter-spacing:-0.02em;white-space:nowrap;">벤치프레스</div>
          <div id="cardSubLine" class="kr" style="margin-top:5px;font-size:13px;font-weight:500;color:var(--ink-4);white-space:nowrap;">가슴 · 3종목 중 2번째</div>
          <div id="cardResumeSeg" style="margin-top:20px;"></div>
          <div style="margin-top:22px;padding-top:16px;border-top:1px solid var(--line-soft);display:flex;align-items:baseline;justify-content:space-between;">
            <span id="cardSetProg" class="mono" style="font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap;">SET 3 / 5</span>
            <span class="mono" style="font-size:13px;font-weight:500;color:var(--ink-4);white-space:nowrap;">누적 <b id="cardVol" style="color:var(--crail-deep);font-weight:600;">0</b>kg</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="phone-home"></div>
</div>

<script>
  // HomeA (idle) ↔ HomeC (active) — ?state=active 토글
  const state = new URLSearchParams(location.search).get('state') === 'active' ? 'active' : 'idle';
  document.body.dataset.state = state;
</script>
</body>
</html>
