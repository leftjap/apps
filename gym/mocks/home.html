<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0a08">
<title>Gym · 홈 (v2 · HomeA/HomeC)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf9f5; --bg-warm: #f3efe6; --bg-deep: #ece7db;
  --surface: #ffffff; --surface-2: #f7f4ec;
  --ink: #1a1714; --ink-strong: #0c0a08;
  --ink-2: #5a544a; --ink-muted: #8d8678; --ink-faint: #c4beb1;
  --line: #e6e1d4; --line-soft: #efeae0;
  --accent: #d97757; --accent-soft: #ecb59f; --accent-deep: #b85a3e; --accent-tint: #fbe9df;
  --sage: #788c5d; --sage-soft: #c0c9aa; --night: #1f1c18;
  --r-xl: 22px; --r-lg: 16px; --r-md: 12px; --r-sm: 8px;
  --shadow-card: 0 1px 2px rgba(28,22,16,.04), 0 8px 24px -8px rgba(28,22,16,.08);
  --shadow-lift: 0 32px 64px -12px rgba(217,119,87,.22), 0 12px 28px -10px rgba(28,22,16,.18);
  --font-display: "Poppins", "SF Pro Display", -apple-system, system-ui, sans-serif;
  --font-body: "Noto Sans KR", -apple-system, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", monospace;
}
* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
body { margin: 0; min-height: 100vh; background: var(--bg-deep); display: flex; align-items: center; justify-content: center; padding: 24px; font-family: var(--font-body); color: var(--ink); }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.kr { font-family: var(--font-body); }
.phone { width: 360px; height: 740px; border-radius: 38px; position: relative; overflow: hidden; box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 30px 60px -20px rgba(28,22,16,.18), 0 0 0 1px rgba(28,22,16,.06); font-family: var(--font-body); color: var(--ink); }
.phone-notch { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 102px; height: 30px; border-radius: 20px; background: #0c0a08; z-index: 50; }
.phone-clock { position: absolute; top: 16px; left: 24px; z-index: 49; font-family: var(--font-display); font-weight: 600; font-size:16px; letter-spacing: -0.01em; color: var(--ink-strong); }
.phone-batt { position: absolute; top: 16px; right: 24px; z-index: 49; display: flex; gap: 5px; align-items: center; color: var(--ink-strong); }
.phone-batt-cell { width: 16px; height: 10px; border-radius: 2px; border: 1.2px solid currentColor; position: relative; }
.phone-batt-cell::after { content: ""; position: absolute; inset: 1.5px; background: currentColor; border-radius: 1px; display: block; }
.phone-content { position: absolute; inset: 0; padding-top: 54px; padding-bottom: 24px; }
.phone-home { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 120px; height: 4px; border-radius: 100px; z-index: 60; background: rgba(0,0,0,.22); }
.phone.dark { color: #f3efe6; }
.phone.dark .phone-clock, .phone.dark .phone-batt { color: #f3efe6; }
.phone.dark .phone-home { background: rgba(255,255,255,.32); }
[data-state="active"] .home-a { display: none; }
[data-state="idle"] .home-c { display: none; }
/* 주간 캘린더 — home.js renderWeekCalendarToDom 마크업 (cal-day button + cal-label/num/part span) 정합. */
.cal-day { display: flex; flex-direction: column; align-items: center; gap: 4px; background: transparent; border: 0; padding: 0; cursor: pointer; font-family: inherit; }
.cal-label { font-size:13px; color: rgba(243, 239, 230, 0.4); font-weight: 400; }
.cal-day.today .cal-label { color: #fff; font-weight: 600; }
.cal-num { font-family: var(--font-display); font-size:17px; font-weight: 300; color: rgba(243, 239, 230, 0.3); letter-spacing: -0.02em; }
.cal-day.today .cal-num, .cal-day.worked .cal-num { font-size:20px; font-weight: 500; color: #fff; }
.cal-part { font-size:13px; color: rgba(243, 239, 230, 0.5); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
</style>
</head>
<body data-state="idle">
<!-- HomeA — idle -->
<div class="phone dark home-a" style="background:#0f0d0a;">
  <div class="phone-notch"></div>
  <div class="phone-content">
    <div style="height:100%;display:flex;flex-direction:column;color:#f3efe6;padding:8px 0;">
      <!-- HomeHeader -->
      <div style="display:flex;align-items:center;justify-content:space-between;padding:0 24px;">
        <div class="num" style="font-size:24px;font-weight:600;letter-spacing:-0.02em;color:#fff;">Gym</div>
        <div style="display:flex;gap:18px;font-size:14px;color:rgba(255,255,255,0.5);" class="kr"><span class="js-home-stats" style="cursor:pointer;">통계</span><span class="js-home-manage" style="cursor:pointer;">관리</span></div>
      </div>
      <!-- 주간 캘린더 -->
      <div id="weekCal" style="margin-top:26px;padding:0 18px;display:grid;grid-template-columns:repeat(7,1fr);">
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
          <div class="kr" style="font-size:13px;color:rgba(243,239,230,0.4);font-weight:400;">월</div>
          <div class="num" style="font-size:20px;font-weight:500;color:#fff;">4</div>
          <div class="kr" style="font-size:13px;color:rgba(243,239,230,0.5);">가슴</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
          <div class="kr" style="font-size:13px;color:rgba(243,239,230,0.4);font-weight:400;">화</div>
          <div class="num" style="font-size:17px;font-weight:300;color:rgba(243,239,230,0.3);">5</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
          <div class="kr" style="font-size:13px;color:#fff;font-weight:600;">수</div>
          <div class="num" style="font-size:20px;font-weight:500;color:#fff;">6</div>
          <div class="kr" style="font-size:13px;color:rgba(243,239,230,0.5);">등</div>
          <div style="width:10px;height:2px;border-radius:1px;background:var(--accent);margin-top:2px;"></div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
          <div class="kr" style="font-size:13px;color:rgba(243,239,230,0.4);font-weight:400;">목</div>
          <div class="num" style="font-size:17px;font-weight:300;color:rgba(243,239,230,0.3);">7</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
          <div class="kr" style="font-size:13px;color:rgba(243,239,230,0.4);font-weight:400;">금</div>
          <div class="num" style="font-size:17px;font-weight:300;color:rgba(243,239,230,0.3);">8</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
          <div class="kr" style="font-size:13px;color:rgba(243,239,230,0.4);font-weight:400;">토</div>
          <div class="num" style="font-size:17px;font-weight:300;color:rgba(243,239,230,0.3);">9</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
          <div class="kr" style="font-size:13px;color:rgba(243,239,230,0.4);font-weight:400;">일</div>
          <div class="num" style="font-size:17px;font-weight:300;color:rgba(243,239,230,0.3);">10</div>
        </div>
      </div>
      <!-- 가운데 마지막 운동 정보 -->
      <div style="flex:1;padding:44px 24px 0;position:relative;">
        <div style="position:absolute;top:30px;left:0;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle, rgba(217,119,87,0.22) 0%, rgba(217,119,87,0) 60%);"></div>
        <div style="position:relative;">
          <div id="sLabel" class="kr" style="font-size:13px;color:rgba(243,239,230,0.45);letter-spacing:0.06em;margin-bottom:12px;">마지막 운동</div>
          <div style="display:flex;align-items:baseline;gap:8px;">
            <div id="sNum" class="num" style="font-size:88px;font-weight:200;line-height:0.85;letter-spacing:-0.05em;color:#fff;">1</div>
            <div id="sUnit" class="kr" style="font-size:20px;color:rgba(243,239,230,0.6);">일 전</div>
          </div>
          <div style="margin-top:24px;display:flex;gap:32px;">
            <div>
              <div class="kr" style="font-size:13px;color:rgba(243,239,230,0.4);letter-spacing:0.06em;">마지막 부위</div>
              <div id="sPart" class="kr" style="margin-top:6px;font-size:18px;color:#fff;font-weight:500;">가슴</div>
            </div>
            <div style="width:1px;background:rgba(243,239,230,0.1);"></div>
            <div>
              <div class="kr" style="font-size:13px;color:rgba(243,239,230,0.4);letter-spacing:0.06em;">이번 주</div>
              <div style="margin-top:4px;display:flex;align-items:baseline;gap:3px;">
                <span id="sSub" class="num" style="font-size:24px;font-weight:500;color:#fff;">1</span>
                <span id="sSubUnit" class="kr" style="font-size:13px;color:rgba(243,239,230,0.5);">/4회</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- 하단 운동 시작 버튼 -->
      <div style="padding:0 24px 8px;">
        <div class="kr" style="font-size:13px;color:rgba(243,239,230,0.4);margin-bottom:12px;text-align:center;">한 세트만 더.</div>
        <button id="ctaBtn" type="button" style="width:100%;height:56px;border-radius:28px;border:0;background:var(--accent);color:#fff;font-family:var(--font-body);font-size:17px;font-weight:500;box-shadow:0 14px 30px -8px rgba(217,119,87,.55);cursor:pointer;">운동 시작</button>
      </div>
    </div>
    <!-- §9-1 — 날짜 탭 → 운동 요약 바텀시트 (src/features/day-detail-sheet.js) -->
    <div id="dayDetailBackdrop" data-open="false" style="position:absolute;inset:0;z-index:90;background:rgba(0,0,0,0.5);opacity:0;pointer-events:none;transition:opacity 200ms ease;"></div>
    <div id="dayDetailSheet" data-open="false" data-step="summary" data-iso="" style="position:absolute;left:0;right:0;bottom:0;z-index:91;background:#15120e;border-top-left-radius:22px;border-top-right-radius:22px;padding:18px 18px 24px;box-shadow:0 -16px 40px -10px rgba(0,0,0,0.45);transform:translateY(100%);transition:transform 200ms ease;touch-action:none;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <div id="dayDetailDate" class="kr" style="font-size:16px;color:rgba(255,255,255,0.9);font-weight:500;">—</div>
        <div id="dayDetailTag" class="kr" style="font-size:13px;color:rgba(255,255,255,0.5);"></div>
      </div>
      <div id="dayDetailMeta" class="kr" style="display:none;gap:14px;margin-bottom:12px;font-size:14px;color:rgba(255,255,255,0.7);flex-wrap:wrap;"></div>
      <div id="dayDetailExList" style="display:none;flex-direction:column;max-height:240px;overflow-y:auto;"></div>
      <div id="dayDetailEmpty" class="kr" style="display:none;font-size:14px;color:rgba(255,255,255,0.4);text-align:center;padding:24px 0;">기록 없음</div>
      <div id="dayDetailConfirm" style="display:none;flex-direction:column;gap:8px;">
        <div class="kr" style="font-size:15px;color:rgba(255,255,255,0.85);text-align:center;margin:8px 0 12px;">이 날짜의 기록을 삭제하시겠습니까?</div>
        <button class="kr" type="button" data-day-detail-action="delete-confirm" style="width:100%;height:44px;border-radius:10px;border:0;background:var(--accent);color:#fff;font-size:16px;font-weight:600;cursor:pointer;">삭제</button>
        <button class="kr" type="button" data-day-detail-action="cancel" style="width:100%;height:44px;border-radius:10px;border:0;background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.7);font-size:16px;cursor:pointer;">취소</button>
      </div>
    </div>
  </div>
  <div class="phone-home"></div>
</div>

<!-- HomeC — active -->
<div class="phone dark home-c" style="background:#0c0a08;">
  <div class="phone-notch"></div>
  <div class="phone-content">
    <div style="height:100%;display:flex;flex-direction:column;color:#f3efe6;padding:8px 0;">
      <!-- HomeHeader -->
      <div style="display:flex;align-items:center;justify-content:space-between;padding:0 24px;">
        <div class="num" style="font-size:24px;font-weight:600;letter-spacing:-0.02em;color:#fff;">Gym</div>
        <div style="display:flex;gap:18px;font-size:14px;color:rgba(255,255,255,0.5);" class="kr"><span class="js-home-stats" style="cursor:pointer;">통계</span><span class="js-home-manage" style="cursor:pointer;">관리</span></div>
      </div>
      <!-- 진행 중 카드 -->
      <div style="margin:26px 20px 0;padding:22px;border-radius:22px;background:linear-gradient(155deg, #1a1612 0%, #1a1612 60%, #2a1d16 100%);position:relative;overflow:hidden;border:1px solid rgba(217,119,87,0.18);">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
          <span style="width:6px;height:6px;border-radius:3px;background:var(--accent);box-shadow:0 0 12px var(--accent);"></span>
          <span id="cardLabel" class="kr" style="font-size:13px;color:var(--accent);font-weight:600;letter-spacing:0.14em;">진행 중</span>
        </div>
        <div style="display:flex;align-items:baseline;gap:6px;">
          <div id="cardTime" class="num" style="font-size:56px;font-weight:200;line-height:0.9;color:#fff;letter-spacing:-0.04em;">18:42</div>
          <div id="cardUnit" class="kr" style="font-size:15px;color:rgba(243,239,230,0.5);">경과</div>
        </div>
        <div style="margin-top:18px;display:flex;gap:24px;align-items:baseline;">
          <div><div class="kr" style="font-size:13px;color:rgba(243,239,230,0.4);letter-spacing:0.06em;">부위</div><div id="cardPart" class="kr" style="margin-top:4px;font-size:16px;color:#fff;font-weight:500;">가슴</div></div>
          <div><div class="kr" style="font-size:13px;color:rgba(243,239,230,0.4);letter-spacing:0.06em;">종목</div><div id="cardEx" class="kr" style="margin-top:4px;font-size:16px;color:#fff;font-weight:500;">1 / 2</div></div>
          <div><div class="kr" style="font-size:13px;color:rgba(243,239,230,0.4);letter-spacing:0.06em;">볼륨</div><div id="cardVol" class="num" style="margin-top:4px;font-size:16px;color:#fff;font-weight:500;">600<span class="kr" style="font-size:13px;color:rgba(243,239,230,0.5);margin-left:2px;">kg</span></div></div>
        </div>
        <div style="margin-top:18px;height:3px;border-radius:2px;background:rgba(255,255,255,0.08);overflow:hidden;">
          <div id="cardProgress" style="width:55%;height:100%;background:var(--accent);"></div>
        </div>
        <button id="cardCta" type="button" style="margin-top:18px;width:100%;height:46px;border-radius:14px;border:0;background:var(--accent);color:#fff;font-family:var(--font-body);font-size:16px;font-weight:500;display:flex;align-items:center;justify-content:space-between;padding:0 18px;cursor:pointer;">
          <span>이어가기</span><span style="font-size:18px;">→</span>
        </button>
      </div>
      <!-- 하단 다음 운동 미리보기 (mid-session 이어가기 컨텍스트 — home.js hydrate) -->
      <div id="nextBlocksSection" style="margin-top:auto;padding:0 24px 12px;">
        <div class="kr" style="font-size:13px;color:rgba(243,239,230,0.35);letter-spacing:0.08em;margin-bottom:8px;">다음</div>
        <div id="nextBlocksList" style="display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid rgba(243,239,230,0.08);">
          <div data-next-block style="display:flex;justify-content:space-between;align-items:baseline;">
            <div class="kr" style="font-size:15px;color:#fff;font-weight:500;">인클라인 벤치</div>
            <div class="num" style="font-size:14px;color:rgba(243,239,230,0.55);">45×10 · 5세트</div>
          </div>
          <div data-next-block style="display:flex;justify-content:space-between;align-items:baseline;">
            <div class="kr" style="font-size:15px;color:#fff;font-weight:500;">디클라인 벤치</div>
            <div class="num" style="font-size:14px;color:rgba(243,239,230,0.55);">50×10 · 5세트</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="phone-home"></div>
</div>

<script>
  // HomeA (idle) ↔ HomeC (active) — ?state=active 토글
  const state = new URLSearchParams(location.search).get('state') === 'active' ? 'active' : 'idle';
  document.body.dataset.state = state;
</script>
</body>
</html>
