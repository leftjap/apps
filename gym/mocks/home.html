<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0a08">
<title>Gym · 홈 (v2 · HomeA/HomeC)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 구현 레퍼런스 - 홈.html 정합 (0px). 토큰은 paper.css 와 동일 — 누락분만 로컬 보강. */
:root {
  --bg: #faf9f5; --bg-warm: #f3efe6; --bg-deep: #ece7db;
  --surface: #ffffff; --surface-2: #f7f4ec;
  --ink: #1a1714; --ink-strong: #0c0a08;
  --r-xl: 24px; --r-lg: 18px; --r-md: 12px; --r-sm: 8px;
  --font-display: "Space Grotesk", ui-monospace, monospace;
  --font-body: "Pretendard", "Inter", system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
body { margin: 0; min-height: 100vh; background: var(--bg-deep); display: flex; align-items: center; justify-content: center; padding: 24px; font-family: var(--font-sans); color: var(--ink-1); }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.kr { font-family: var(--font-sans); }
.phone { width: 360px; height: 740px; border-radius: 44px; position: relative; overflow: hidden; background: var(--shell); color: var(--ink-1); font-family: var(--font-sans); box-shadow: 0 0 0 1px oklch(88% 0.006 60), 0 2px 2px rgba(20,18,14,.04), 0 44px 80px -28px rgba(20,18,14,.32); }
.phone-notch { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 100px; height: 28px; border-radius: 16px; background: #111; z-index: 50; }
.phone-content { position: absolute; inset: 0; padding-top: 52px; }
.phone-home { position: absolute; bottom: 9px; left: 50%; transform: translateX(-50%); width: 124px; height: 5px; border-radius: 100px; z-index: 60; background: rgba(0,0,0,.18); }
[data-state="active"] .home-a { display: none; }
[data-state="idle"] .home-c { display: none; }

/* ===== 헤더 ===== */
.hdr { flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:0 24px; }
.hdr .logo { font-size:23px; font-weight:700; letter-spacing:-0.03em; color:var(--ink-1); }
.hdr .nav { display:flex; gap:2px; }
.hdr .nav span { padding:8px 12px; border-radius:var(--r-sm); font-size:14px; font-weight:500; color:var(--ink-3); white-space:nowrap; cursor:pointer; }

/* ===== 2주 캘린더 (.js-week-cal 유지) — 시안 20a §5: 근력 crail 채움 + 유산소 teal 링 ===== */
.wk { flex-shrink:0; display:flex; flex-direction:column; gap:8px; padding:8px 18px 0; }
.wk-row { display:grid; grid-template-columns:repeat(7,1fr); }
.cal-hd { text-align:center; font-size:11px; font-weight:600; color:var(--ink-4); letter-spacing:0.04em; }
.cal-hd.today { color:var(--crail-deep); }
.cal-day { display:flex; align-items:center; justify-content:center; background:transparent; border:0; font-family:inherit; cursor:pointer; }
.cal-num { font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:14px; font-weight:500; color:var(--ink-4);
  width:28px; height:28px; display:flex; align-items:center; justify-content:center; border-radius:50%; }
.wk-row.dim .cal-num { width:24px; height:24px; font-size:12.5px; }
/* 상태 조합 — 근력 채움 / 유산소 링은 서로 독립 (유산소만 = 배경 없이 링) */
.cal-num.lift { background:var(--crail-tint); color:var(--crail-deep); font-weight:600; }
.cal-num.cardio { box-shadow:inset 0 0 0 1.5px #2f807a; font-weight:600; }
.cal-num.cardio:not(.lift) { color:var(--ink-2); }
.cal-num.today.lift { background:var(--crail-base); color:#fff; }
.cal-num.today:not(.lift):not(.cardio) { box-shadow:inset 0 0 0 1.5px var(--ink-4); color:var(--ink-1); }
.cal-legend { display:flex; align-items:center; gap:6px; padding:0 12px; margin-top:2px; }
.cal-legend i { width:10px; height:10px; border-radius:50%; display:inline-block; }
.cal-legend .lg-lift { background:var(--crail-tint); box-shadow:inset 0 0 0 1.5px var(--crail-deep); }
.cal-legend .lg-cardio { box-shadow:inset 0 0 0 1.5px #2f807a; margin-left:5px; }
.cal-legend span { font-size:10.5px; font-weight:500; color:var(--ink-4); }

/* ===== 직전 운동 ===== */
.last-row { flex-shrink:0; margin:11px 24px 0; display:flex; align-items:center; gap:10px; }
.last-row .ic { width:30px; height:30px; border-radius:9px; background:var(--sunken); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.last-row .lb { font-size:12px; font-weight:600; color:var(--ink-4); letter-spacing:0.02em; white-space:nowrap; }
.last-row .pt { font-size:15px; font-weight:700; color:var(--ink-1); white-space:nowrap; }
.last-row .tm { font-size:12.5px; font-weight:500; color:var(--ink-4); margin-left:auto; white-space:nowrap; }

/* ===== 부위 밸런스 — 시안 20a §7: 축 11px/세트·트랙 88 고정, 유산소 행 없음 ===== */
.bal { flex-shrink:0; display:flex; flex-direction:column; padding:9px 24px 0; }
.bal-head { display:flex; align-items:baseline; gap:7px; }
.bal-title { font-size:13.5px; font-weight:700; color:var(--ink-1); letter-spacing:-0.01em; white-space:nowrap; }
.bal-hl-num { font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:31px; font-weight:700; color:var(--ink-1); letter-spacing:-0.035em; line-height:1; margin-left:auto; }
.bal-hl-unit { font-size:11.5px; font-weight:500; color:var(--ink-4); }
.bal-chip { display:inline-flex; padding:4px 10px; border-radius:999px; font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:12px; font-weight:700; white-space:nowrap; }
.bal-chip.up { background:#e7efee; color:#215d5b; }
.bal-chip.down { background:oklch(95% 0.035 80); color:#a06d2c; }
.bal-legend { display:flex; align-items:center; gap:6px; margin-top:7px; font-size:11px; font-weight:500; color:var(--ink-4); }
.bal-legend i { width:9px; height:9px; border-radius:2.5px; display:inline-block; }
.bal-legend .lg-ghost { background:#cddedc; }
.bal-legend .lg-ink { background:#2f807a; margin-left:6px; }
.bal-chart { margin-top:8px; }
.bal-groups { display:flex; align-items:flex-end; }
.bal-grp { flex:1; display:flex; flex-direction:column; align-items:center; }
/* 값은 잉크 막대 중심으로 — 페어 폭 33 중 잉크가 오른쪽 17 이라 +8 이동 (§7) */
.bal-grp-val { font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:14.5px; font-weight:700; color:var(--ink-1); line-height:1; margin-left:16px; margin-bottom:6px; }
.bal-bars { height:88px; display:flex; align-items:flex-end; gap:3px; }
.bal-bar-ghost { width:13px; border-radius:4px 4px 0 0; background:#cddedc; }
.bal-bar-ink { width:17px; border-radius:4.5px 4.5px 0 0; background:#2f807a; box-shadow:inset 0 1px 0 rgba(255,255,255,0.20); }
/* 기준선 = 부위 이름의 상단 보더. 별도 전폭 룰 금지 (§13) */
.bal-labels { display:flex; border-top:1.5px solid oklch(88% 0.008 60); padding-top:7px; }
.bal-labels span { flex:1; text-align:center; font-size:12.5px; font-weight:600; color:var(--ink-2); line-height:1; }

/* ===== 유산소 카드 — 시안 20a §8 (밸런스에서 분리된 독립 카드) ===== */
.cardio-card { flex-shrink:0; margin:12px 24px 0; padding:11px 18px 10px; border-radius:var(--r-lg); background:var(--card); box-shadow:var(--shadow-float); }
.cc-head { display:flex; align-items:baseline; }
.cc-head .t { font-size:13.5px; font-weight:600; color:var(--ink-1); }
.cc-head .w { font-size:11.5px; font-weight:500; color:var(--ink-4); margin-left:7px; }
.cc-head .r { margin-left:auto; display:flex; align-items:baseline; gap:3px; }
.cc-min { font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:26px; font-weight:700; color:var(--ink-1); letter-spacing:-0.03em; line-height:1; }
.cc-days { font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:16px; font-weight:700; color:var(--ink-2); line-height:1; }
.cc-u { font-size:12px; font-weight:500; color:var(--ink-4); }
.cc-sep { width:1px; height:12px; background:var(--line); margin:0 7px; }
.cc-days-row { display:flex; justify-content:space-between; margin-top:9px; }
.cc-cell { display:flex; flex-direction:column; align-items:center; gap:5px; }
.cc-dot { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:13px; font-weight:600; }
.cc-dot.ran { background:#2f807a; color:#fff; }
.cc-dot.empty { box-shadow:inset 0 0 0 1.5px oklch(88% 0.006 60); color:var(--ink-3); }
.cc-dot.today { box-shadow:0 0 0 1.5px #fff, 0 0 0 2.5px #215d5b; font-weight:700; }
.cc-lb { font-size:10.5px; font-weight:500; color:var(--ink-4); line-height:1; }
.cc-cell.today .cc-lb { font-weight:700; color:#215d5b; }
.cc-foot { display:flex; align-items:baseline; margin-top:9px; padding-top:7px; border-top:1px solid var(--line-soft); }
.cc-foot .p { font-size:11.5px; font-weight:500; color:var(--ink-3); }
.cc-chip { margin-left:auto; display:inline-flex; align-items:baseline; gap:3px; padding:3px 9px; border-radius:999px; }
.cc-chip.warn { background:oklch(95% 0.035 80); color:#a06d2c; }
.cc-chip.pine { background:#e7efee; color:#215d5b; }
.cc-chip .v { font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:11.5px; font-weight:700; }
.cc-chip .l { font-size:10.5px; font-weight:600; }

/* ===== 체중 — 시안 20a §9 (30일 sma7 스파크라인) ===== */
.wt { flex-shrink:0; margin:12px 24px 0; padding:13px 18px; border-radius:var(--r-lg); background:var(--card); box-shadow:var(--shadow-float); cursor:pointer; }
.wt-head { display:flex; align-items:center; justify-content:space-between; }
.wt-head .a { font-size:13.5px; font-weight:600; color:var(--ink-1); }
.wt-head .w { font-size:11.5px; font-weight:500; color:var(--ink-4); margin-left:7px; }
.wt .chip { display:inline-flex; align-items:center; padding:8px 15px; border-radius:999px; background:var(--crail-tint); box-shadow:inset 0 0 0 1px var(--crail-soft); font-size:12.5px; font-weight:600; color:var(--crail-deep); white-space:nowrap; }
.wt-body { display:flex; align-items:flex-end; justify-content:space-between; margin-top:9px; }
.wt-kg { font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:28px; font-weight:700; color:var(--ink-1); letter-spacing:-0.03em; line-height:1; }
.wt-u { font-size:12px; font-weight:500; color:var(--ink-4); }
/* 증감은 ▲▼ 대신 −/+, 색 없이 ink-3 고정 (감소가 목표라 색을 입히지 않는다) */
.wt-dl { font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:12px; font-weight:500; color:var(--ink-3); margin-left:5px; }
.wt-goal { font-size:11px; font-weight:500; color:var(--ink-4); }

/* ===== CTA (#ctaBtn 유지) ===== */
.cta { flex-shrink:0; padding:12px 24px 22px; }
.cta button { width:100%; height:56px; border-radius:var(--r-lg); border:0; background:#215d5b; color:#fbfdfc; font-size:16px; font-weight:600; letter-spacing:-0.01em; cursor:pointer; box-shadow:0 10px 22px -12px rgba(33,93,91,0.7); font-family:inherit; }

/* P6 이어하기 박스 (home-c · applyToDom) — 박스 전체 버튼, 브리딩. */
#cardResume { width: 100%; background: var(--card); border: 1.5px solid var(--crail-base); border-radius: var(--r-xl); box-shadow: var(--shadow-pop); padding: 24px 24px 22px; cursor: pointer; animation: breath 2.8s ease-in-out infinite; }
#cardResume:active { transform: scale(0.992); }
@keyframes breath { 0%, 100% { box-shadow: 0 18px 40px -22px rgba(20,18,14,0.28), 0 0 0 0 rgba(193,99,63,0); } 50% { box-shadow: 0 18px 40px -22px rgba(20,18,14,0.28), 0 0 0 5px rgba(193,99,63,0.10); } }
#cardResumeSeg { display: flex; gap: 6px; }
#cardResumeSeg .seg { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 7px; }
#cardResumeSeg .seg .bar { width: 100%; height: 8px; border-radius: 4px; box-shadow: inset 0 0 0 1.5px var(--line); }
#cardResumeSeg .seg.done .bar { background: var(--ink-2); box-shadow: none; }
#cardResumeSeg .seg.now .bar { background: var(--crail-base); box-shadow: none; height: 10px; animation: segGlow 1.8s ease-in-out infinite; }
#cardResumeSeg .seg .n { font-family: var(--font-mono); font-size: 10px; font-weight: 500; color: var(--ink-4); white-space: nowrap; }
#cardResumeSeg .seg.now .n { color: var(--crail-deep); font-weight: 700; }
.home-live { animation: pulse 1.6s ease-in-out infinite; }
@keyframes segGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(193,99,63,0); } 50% { box-shadow: 0 0 0 4px rgba(193,99,63,0.18); } }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
/* 부위 밸런스 진입/상시 모션 (작업지시서 §4.2 · §6) — 데모 루프를 앱 1회 재생용으로 이식 */
@keyframes gGrow { 0% { transform: scaleY(0.12); } 82% { transform: scaleY(1.08); } 100% { transform: scaleY(1); } }        /* 이번주 막대 웨이브 성장(오버슈트 8%) */
@keyframes gPopIn { 0% { opacity: 0; transform: scale(0.5) translateY(5px); } 70% { opacity: 1; transform: scale(1.14) translateY(0); } 100% { opacity: 1; transform: scale(1) translateY(0); } }   /* 칩 순차 팝인 */
@keyframes gCoreAlert { 0%,100% { box-shadow: 0 0 0 0 rgba(217,119,87,0); transform: scaleY(1); } 50% { box-shadow: 0 0 14px 3px rgba(217,119,87,0.5); transform: scaleY(1.12); } }   /* 최소부위 상시 경고 펄스 */
@keyframes gChipGlow { 0%,100% { box-shadow: inset 0 0 0 1px oklch(85% 0.05 50), 0 0 0 0 rgba(217,119,87,0); } 50% { box-shadow: inset 0 0 0 1px oklch(85% 0.05 50), 0 0 0 6px rgba(217,119,87,0.16); } }   /* 최소부위 칩 글로우 링 */
@media (prefers-reduced-motion: reduce) { #cardResume, #cardResumeSeg .seg.now .bar, .home-live, .bal-bar-ink, .bal-grp.focus .bal-bar-ink, .bal-chip, .bal-chip.up, .bal-chip.focus, .bal-chip .dot, .bal-hl-num { animation: none !important; } }
/* 바텀시트 그림자 — 열렸을 때만. */
#dayDetailSheet[data-open="true"], #weightKeypadSheet[data-open="true"] { box-shadow: 0 -20px 50px -18px rgba(20,18,14,0.4); }
</style>
</head>
<body data-state="idle">
<!-- HomeA — idle (구현 레퍼런스 - 홈.html 정합) -->
<div class="phone home-a" style="background:var(--shell);color:var(--ink-1);">
  <div class="phone-notch"></div>
  <div class="phone-content">
    <div style="height:100%;display:flex;flex-direction:column;padding:8px 0 0;">
      <!-- 헤더 -->
      <div class="hdr">
        <div class="logo">Gym</div>
        <div class="nav kr"><span class="js-home-stats">통계</span><span class="js-home-manage">관리</span></div>
      </div>
      <!-- 주간 캘린더 (renderWeekCalendarToDom 채움) -->
      <div id="weekCal" class="wk js-week-cal"></div>
      <!-- 직전 운동 (applyLastWorkoutToDom 채움) -->
      <div id="homeLastWorkout" class="last-row">
        <span class="ic"><svg width="17" height="17" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 8v4M6.5 6.2v7.6M13.5 6.2v7.6M16 8v4M6.5 10h7" stroke="var(--ink-3)" stroke-width="1.6" stroke-linecap="round"/></svg></span>
        <span class="lb kr">직전 운동</span>
        <span id="homeLastParts" class="pt kr">—</span>
        <span id="homeLastMeta" class="tm kr"></span>
      </div>
      <!-- 부위 밸런스 (주역 · applyBalanceToDom 채움). 주간 페어 컬럼 (작업지시서 §4). -->
      <div id="homeBalance" class="bal">
        <div class="bal-head">
          <span class="bal-title kr">부위 밸런스</span>
          <span id="homeBalTotal" class="bal-hl-num mono">0</span>
          <span class="bal-hl-unit kr">세트</span>
          <span id="homeBalDelta" class="bal-chip up mono">+0</span>
        </div>
        <div class="bal-legend kr"><i class="lg-ghost"></i>지난주<i class="lg-ink"></i>이번 주</div>
        <div class="bal-chart">
          <div id="homeBalRows" class="bal-groups"></div>
          <div id="homeBalLabels" class="bal-labels"></div>
        </div>
      </div>

      <div style="flex:1;min-height:0;"></div>

      <!-- 유산소 독립 카드 (§8) -->
      <div id="homeCardioCard" class="cardio-card">
        <div class="cc-head">
          <span class="t kr">유산소</span><span class="w kr">이번 주</span>
          <span class="r">
            <span id="homeCardioMin" class="cc-min mono">0</span><span class="cc-u kr">분</span>
            <span class="cc-sep"></span>
            <span id="homeCardioDays" class="cc-days mono">0</span><span class="cc-u kr">일</span>
          </span>
        </div>
        <div id="homeCardioDots" class="cc-days-row"></div>
        <div class="cc-foot">
          <span id="homeCardioPrev" class="p kr">지난주 0분 · 0일</span>
          <span id="homeCardioChip" class="cc-chip warn" style="display:none;"><span class="v mono"></span><span class="l kr"></span></span>
        </div>
      </div>

      <!-- 체중 카드 (§9) -->
      <div class="wt" data-bind="weight-input-trigger">
        <div class="wt-head">
          <span style="display:flex;align-items:baseline;"><span class="a kr">오늘 체중</span><span class="w kr">최근 30일</span></span>
          <span class="chip kr">기록하기</span>
        </div>
        <div class="wt-body">
          <div style="display:flex;flex-direction:column;gap:4px;">
            <span style="display:flex;align-items:baseline;gap:3px;">
              <span id="homeWeightKg" class="wt-kg mono">—</span><span class="wt-u kr">kg</span>
              <span id="homeWeightDelta" class="wt-dl mono"></span>
            </span>
            <span id="homeWeightGoal" class="wt-goal kr">목표 —</span>
          </div>
          <svg id="homeWeightSpark" width="132" height="38" viewBox="0 0 132 38" fill="none" style="display:block;overflow:visible;"></svg>
        </div>
      </div>

      <div class="cta"><button id="ctaBtn" class="kr">운동 시작</button></div>
    </div>
    <!-- §9-1 — 날짜 탭 → 운동 요약 바텀시트 (src/features/day-detail-sheet.js) -->
    <div id="dayDetailBackdrop" data-open="false" style="position:absolute;inset:0;z-index:90;background:oklch(22% 0.008 60 / 0.42);opacity:0;pointer-events:none;transition:opacity 200ms ease;"></div>
    <div id="dayDetailSheet" data-open="false" data-step="summary" data-iso="" style="position:absolute;left:0;right:0;bottom:0;z-index:91;background:var(--card);border-top-left-radius:var(--r-xl);border-top-right-radius:var(--r-xl);padding:18px 18px 24px;transform:translateY(100%);transition:transform 200ms ease;touch-action:none;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <div id="dayDetailDate" class="kr" style="font-size:16px;color:var(--ink-1);font-weight:600;">—</div>
        <div id="dayDetailTag" class="kr" style="font-size:13px;color:var(--ink-3);"></div>
      </div>
      <div id="dayDetailMeta" class="kr" style="display:none;gap:14px;margin-bottom:12px;font-size:14px;color:var(--ink-2);flex-wrap:wrap;"></div>
      <div id="dayDetailExList" style="display:none;flex-direction:column;max-height:240px;overflow-y:auto;"></div>
      <div id="dayDetailEmpty" class="kr" style="display:none;font-size:14px;color:var(--ink-4);text-align:center;padding:24px 0;">기록 없음</div>
      <div id="dayDetailConfirm" style="display:none;flex-direction:column;gap:8px;">
        <div class="kr" style="font-size:15px;color:var(--ink-1);text-align:center;margin:8px 0 12px;">이 날짜의 기록을 삭제하시겠습니까?</div>
        <button class="kr" type="button" data-day-detail-action="delete-confirm" style="width:100%;height:48px;border-radius:var(--r-md);border:0;background:var(--danger);color:#fff;font-size:16px;font-weight:600;cursor:pointer;">삭제</button>
        <button class="kr" type="button" data-day-detail-action="cancel" style="width:100%;height:48px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);color:var(--ink-3);font-size:16px;font-weight:600;cursor:pointer;">취소</button>
      </div>
    </div>
    <!-- P5/P13 — 오늘 체중 입력 키패드 (weight-keypad-sheet.js · home/admin 공유) -->
    <div id="weightKeypadBackdrop" data-open="false" style="position:absolute;inset:0;z-index:79;background:oklch(22% 0.008 60 / 0.42);opacity:0;pointer-events:none;transition:opacity 200ms ease;"></div>
    <div id="weightKeypadSheet" data-open="false" data-buf="" style="position:absolute;left:0;right:0;bottom:0;z-index:80;background:var(--card);border-top-left-radius:var(--r-xl);border-top-right-radius:var(--r-xl);padding:12px 20px 24px;transform:translateY(100%);transition:transform 200ms ease;touch-action:none;">
      <div style="width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px;"></div>
      <div style="display:flex;align-items:baseline;justify-content:center;gap:8px;">
        <div id="weightKeypadValue" class="mono" style="font-size:52px;font-weight:500;color:var(--ink-1);letter-spacing:-0.03em;line-height:1;text-align:right;">0</div>
        <div class="mono" style="font-size:17px;font-weight:500;color:var(--ink-4);">kg</div>
      </div>
      <div data-bind="wk-ref" class="kr wk-ref" style="margin-top:8px;text-align:center;font-size:12px;font-weight:500;color:var(--ink-4);">직전 <b>—</b></div>
      <div id="weightKeypadGrid" style="margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;"></div>
      <button id="weightKeypadDone" type="button" class="kr" style="margin-top:12px;width:100%;height:52px;border-radius:var(--r-md);background:var(--ink-1);color:#fbf8f2;font-size:16px;font-weight:600;border:0;cursor:pointer;box-shadow:0 8px 20px -12px rgba(20,18,14,0.5);">저장</button>
    </div>
  </div>
  <div class="phone-home"></div>
</div>

<!-- HomeC — active (이어하기 카드) -->
<div class="phone home-c" style="background:var(--shell);color:var(--ink-1);">
  <div class="phone-notch"></div>
  <div class="phone-content">
    <div style="height:100%;display:flex;flex-direction:column;color:var(--ink-1);padding:8px 0 0;">
      <div class="hdr">
        <div class="logo">Gym</div>
        <div class="nav kr"><span class="js-home-stats">통계</span><span class="js-home-manage">관리</span></div>
      </div>
      <div class="wk js-week-cal"></div>
      <!-- 이어하기 박스 (박스 전체가 버튼 + 브리딩) -->
      <div style="flex:1;display:flex;align-items:center;padding:0 22px;">
        <div id="cardResume" role="button" tabindex="0">
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <span style="display:inline-flex;align-items:center;gap:7px;white-space:nowrap;">
              <span class="home-live" style="width:7px;height:7px;border-radius:50%;background:var(--crail-base);"></span>
              <span id="cardLabel" class="kr" style="font-size:12px;font-weight:600;color:var(--crail-deep);letter-spacing:0.06em;white-space:nowrap;">운동 중</span>
            </span>
            <span style="display:inline-flex;align-items:baseline;gap:4px;">
              <span id="cardTime" class="mono" style="font-size:18px;font-weight:500;color:var(--ink-1);letter-spacing:-0.02em;">18:42</span>
              <span id="cardUnit" class="kr" style="font-size:11px;font-weight:500;color:var(--ink-4);white-space:nowrap;">경과</span>
            </span>
          </div>
          <div id="cardExName" class="kr" style="margin-top:18px;font-size:30px;font-weight:700;color:var(--ink-1);letter-spacing:-0.02em;white-space:nowrap;">벤치프레스</div>
          <div id="cardSubLine" class="kr" style="margin-top:5px;font-size:13px;font-weight:500;color:var(--ink-4);white-space:nowrap;">가슴 · 3종목 중 2번째</div>
          <div id="cardResumeSeg" style="margin-top:20px;"></div>
          <div style="margin-top:22px;padding-top:16px;border-top:1px solid var(--line-soft);display:flex;align-items:baseline;justify-content:space-between;">
            <span id="cardSetProg" class="mono" style="font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap;">SET 3 / 5</span>
            <span class="mono" style="font-size:13px;font-weight:500;color:var(--ink-4);white-space:nowrap;">누적 <b id="cardVol" style="color:var(--crail-deep);font-weight:600;">0</b>kg</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="phone-home"></div>
</div>

<script>
  // HomeA (idle) ↔ HomeC (active) — ?state=active 토글
  const state = new URLSearchParams(location.search).get('state') === 'active' ? 'active' : 'idle';
  document.body.dataset.state = state;
</script>
