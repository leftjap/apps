<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>Gym · 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* White & Claude Orange */
    --bg: #ffffff; --surface: #fbfaf8; --bg-warm: #f4f3f1;
    --text: #1a1a18; --text-strong: #0a0a08; --text-muted: #7a7872; --text-faint: #bdbab3;
    --accent: #d97757; --accent-soft: #f1c4ad; --accent-deep: #c96442; --accent-hover: #c96442; --accent-rgb: 217, 119, 87;
    --done: #d97757; --done-soft: rgba(217,119,87,0.16);
    --sage: #d97757; --blue: #6a9bcc; --amber: #c4973b; --danger: #c94432;
    --border: rgba(26,26,24,0.08); --border-strong: rgba(26,26,24,0.14); --border-light: rgba(26,26,24,0.05);
    --font-display: 'Poppins', system-ui, sans-serif;
    --font-body: 'Noto Sans KR', system-ui, sans-serif;
    --fs-xs: 11px; --fs-sm: 13px; --fs-base: 15px; --fs-md: 16px; --fs-lg: 20px; --fs-xl: 28px;
    --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px;
    --s-6: 24px; --s-8: 32px; --s-10: 40px; --s-12: 48px; --s-16: 64px;
    --r-sm: 6px; --r-md: 10px; --r-lg: 16px; --r-xl: 20px; --r-pill: 999px;
    --shadow-xs: 0 1px 2px rgba(0,0,0,0.03);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.03), 0 8px 24px rgba(0,0,0,0.04);
    --shadow-lg: 0 6px 14px rgba(0,0,0,0.04), 0 30px 60px rgba(0,0,0,0.06);
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font-body); color: var(--text); background: var(--bg);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
    background-size: 256px 256px; background-blend-mode: multiply; font-variant-numeric: tabular-nums; line-height: 1.65; -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .phone {
    max-width: 375px; height: 100dvh; max-height: 812px; margin: 0 auto;
    display: flex; flex-direction: column; position: relative;
    overflow: hidden; background: var(--bg);
  }
  @media (min-width: 376px) {
    body { padding: var(--s-8) 0; }
    .phone { border: 1px solid var(--border-light); box-shadow: var(--shadow-sm); border-radius: var(--r-lg); }
  }
  .safe-top { height: var(--safe-top); min-height: 20px; flex-shrink: 0; }

  /* HEADER */
  .hdr {
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--s-4) var(--s-5) var(--s-2);
    flex-shrink: 0;
  }
  .hdr-title {
    font-family: var(--font-display);
    font-size: 20px; font-weight: 600;
    color: var(--text-strong);
    letter-spacing: -0.01em;
  }
  .hdr-nav { display: flex; gap: var(--s-4); }
  .hdr-link {
    font-family: var(--font-display);
    font-size: var(--fs-md); font-weight: 500;
    color: var(--text-muted);
    background: none; border: none; cursor: pointer;
    padding: var(--s-1) var(--s-2);
    border-radius: var(--r-sm);
    transition: background 150ms var(--ease), color 150ms var(--ease);
  }
  .hdr-link:active { background: var(--bg-warm); color: var(--text-strong); }

  /* ============ SECTION TABS (운동 / 체중 / 프로필) ============ */
  .section-tabs {
    display: flex;
    gap: var(--s-5);
    padding: var(--s-3) var(--s-5) var(--s-2);
    border-bottom: 1px solid var(--border-light);
    flex-shrink: 0;
  }
  .sec-tab {
    background: none; border: none; padding: var(--s-2) 0 var(--s-3);
    font-family: var(--font-display);
    font-size: 14px; font-weight: 500;
    color: var(--text-muted);
    cursor: pointer;
    position: relative;
    letter-spacing: 0.01em;
    transition: color 150ms var(--ease);
  }
  .sec-tab.is-active {
    color: var(--text-strong);
    font-weight: 600;
  }
  .sec-tab.is-active::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
    border-radius: 1px;
  }

  .screen {
    flex: 1;
    overflow-y: auto;
    padding: 0;
    padding-bottom: calc(var(--s-6) + var(--safe-bottom));
    min-height: 0;
  }
  .page { display: none; }
  .page.is-active { display: block; }

  /* ============ [운동] 부위 탭 chip ============ */
  .parts {
    display: flex;
    gap: var(--s-1);
    padding: var(--s-4) var(--s-5) var(--s-3);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .parts::-webkit-scrollbar { display: none; }
  .part-chip {
    flex-shrink: 0;
    background: none; border: none;
    font-family: var(--font-display);
    font-size: 14px; font-weight: 500;
    color: var(--text-muted);
    padding: 6px 12px;
    border-radius: var(--r-pill);
    cursor: pointer;
    white-space: nowrap;
    transition: color 150ms var(--ease), background 150ms var(--ease);
  }
  .part-chip.is-active { color: var(--text-strong); font-weight: 600; background: var(--bg-warm); }
  .part-chip:active { background: var(--bg-warm); }

  /* 종목 리스트 */
  .ex-list {
    padding: 0 var(--s-5);
  }
  .ex-row {
    display: grid;
    grid-template-columns: 16px 1fr auto auto;
    gap: var(--s-3);
    align-items: center;
    /* Wave 11.6.1: 행 높이 확대 (s-3 → s-4). 사용자 "너무 빡빡" 피드백 */
    padding: var(--s-4) 0;
    border-bottom: 1px solid var(--border-light);
    /* 꾹누르기 transform 대응 */
    transition: transform 180ms var(--ease);
  }
  .ex-row:last-child { border-bottom: none; }
  .ex-row.is-armed { transform: scale(0.98); transition: transform 120ms var(--ease); }
  .ex-row.is-dragging {
    background: var(--surface);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    border-radius: 8px;
    z-index: 100;
    position: relative;
    transition: none;
    pointer-events: none;
    touch-action: none;
  }
  .ex-grip {
    color: var(--text-faint);
    display: inline-flex; align-items: center;
    cursor: grab;
    user-select: none;
  }
  .ex-grip svg { width: 14px; height: 14px; }
  .ex-name {
    font-family: var(--font-display);
    font-size: 15px; font-weight: 500;
    color: var(--text-strong);
    letter-spacing: -0.005em;
  }
  .ex-row.is-hidden .ex-name { color: var(--text-faint); font-weight: 400; text-decoration: line-through; }
  .ex-row.is-custom .ex-name::after {
    content: '커스텀';
    display: inline-block;
    margin-left: var(--s-2);
    font-family: var(--font-display);
    font-size: 10px; font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.04em;
    vertical-align: middle;
  }
  .ex-meta {
    font-family: var(--font-display);
    font-size: 11px; font-weight: 400;
    color: var(--text-faint);
    letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .ex-toggle {
    width: 36px; height: 20px;
    border: none;
    background: var(--border);
    border-radius: var(--r-pill);
    position: relative;
    cursor: pointer;
    transition: background 150ms var(--ease);
  }
  .ex-toggle::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    background: #fff;
    border-radius: 50%;
    transition: left 180ms var(--ease);
    box-shadow: 0 1px 2px rgba(20,20,19,0.1);
  }
  .ex-toggle.is-on {
    background: var(--accent);
  }
  .ex-toggle.is-on::after { left: 18px; }

  .add-custom {
    margin: var(--s-5) var(--s-5) 0;
    padding: var(--s-3);
    width: calc(100% - var(--s-5) * 2);
    background: none;
    border: 1px dashed var(--border);
    border-radius: var(--r-md);
    font-family: var(--font-display);
    font-size: 13px; font-weight: 500;
    color: var(--text-muted);
    cursor: pointer;
    letter-spacing: 0.01em;
    transition: border-color 150ms var(--ease), color 150ms var(--ease), background 150ms var(--ease);
  }
  .add-custom:active {
    border-color: rgba(var(--accent-rgb), 0.4);
    color: var(--accent);
    background: rgba(var(--accent-rgb), 0.04);
  }

  /* ============ [체중] ============ */
  .weight-hero {
    padding: var(--s-6) var(--s-5) var(--s-4);
  }
  .wh-label {
    font-family: var(--font-display);
    font-size: 12px; font-weight: 400;
    color: var(--text-faint);
    margin-bottom: var(--s-2);
  }
  .wh-display {
    display: flex; align-items: baseline;
    position: relative;
  }
  .wh-num {
    font-family: var(--font-display);
    font-size: 56px; font-weight: 600;
    color: var(--text-strong);
    line-height: 1; letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    position: relative;
  }
  .wh-num::after {
    content: '';
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(var(--accent-rgb), 0.18) 0%, transparent 70%);
    border-radius: 50%;
    z-index: -1;
    pointer-events: none;
  }
  .wh-unit {
    font-family: var(--font-display);
    font-size: 16px; font-weight: 400;
    color: var(--text-muted);
    margin-left: var(--s-2);
    letter-spacing: 0.01em;
  }
  .wh-meta {
    margin-top: var(--s-2);
    font-family: var(--font-body);
    font-size: 12px;
    color: var(--text-muted);
  }
  .wh-meta strong {
    font-family: var(--font-display);
    font-weight: 600;
    color: var(--sage);
    letter-spacing: 0.01em;
  }

  /* 체중 chart (간단 line) */
  .chart {
    padding: var(--s-2) var(--s-5) var(--s-3);
  }
  .chart-box {
    background: var(--surface);
    border: 1px solid var(--border-light);
    border-radius: var(--r-lg);
    padding: var(--s-4);
    position: relative;
  }
  .chart-title {
    font-family: var(--font-display);
    font-size: 11px; font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: var(--s-3);
  }
  .chart-svg {
    width: 100%;
    height: 120px;
    display: block;
  }
  .chart-goal   { stroke: var(--text-faint); }
  .chart-weight { stroke: var(--accent); }
  .chart-avg    { stroke: var(--text-muted); }
  .chart-legend {
    display: flex; justify-content: space-between;
    margin-top: var(--s-2);
    font-family: var(--font-display);
    font-size: 10px;
    color: var(--text-faint);
  }
  .chart-legend strong {
    display: block;
    font-size: 12px; font-weight: 500;
    color: var(--text);
    margin-bottom: 2px;
    font-variant-numeric: tabular-nums;
  }

  /* 체중 입력 row */
  .weight-row {
    padding: var(--s-3) var(--s-5);
    border-bottom: 1px solid var(--border-light);
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: baseline;
    gap: var(--s-3);
  }
  .weight-row:last-of-type { border-bottom: none; }
  .wr-date {
    font-family: var(--font-display);
    font-size: 13px; font-weight: 400;
    color: var(--text-muted);
    letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums;
  }
  .wr-val {
    font-family: var(--font-display);
    font-size: 15px; font-weight: 500;
    color: var(--text-strong);
    font-variant-numeric: tabular-nums;
  }
  .wr-val.pr {
    color: var(--accent);
    font-weight: 600;
  }
  .wr-val .pr-mark {
    margin-left: 6px;
    font-size: 10px;
    letter-spacing: 0.06em;
  }

  .weight-add {
    margin: var(--s-5) var(--s-5) 0;
    width: calc(100% - var(--s-5) * 2);
    padding: var(--s-3);
    background: transparent;
    color: var(--accent);
    border: 1px solid rgba(var(--accent-rgb), 0.2);
    border-radius: var(--r-sm);
    font-family: var(--font-display);
    font-size: 14px; font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: border-color 150ms var(--ease), background 150ms var(--ease), transform 100ms var(--ease);
  }
  .weight-add:active {
    border-color: rgba(var(--accent-rgb), 0.4);
    background: rgba(var(--accent-rgb), 0.06);
    transform: scale(0.98);
  }

  /* Wave 11.7.2b — inline 입력 폼 (키패드 모달은 별 wave 예정) */
  .weight-entry-form {
    margin: var(--s-3) var(--s-5) 0;
    display: flex;
    gap: var(--s-2);
    align-items: center;
    padding: var(--s-3);
    background: var(--surface);
    border: 1px solid var(--border-light);
    border-radius: var(--r-sm);
  }
  .weight-entry-form[hidden] { display: none; }
  .weight-entry-form input {
    flex: 1;
    min-width: 0;
    padding: var(--s-2) var(--s-3);
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 500;
    border: none;
    background: transparent;
    color: var(--text-strong);
    text-align: center;
    -moz-appearance: textfield;
  }
  .weight-entry-form input::-webkit-outer-spin-button,
  .weight-entry-form input::-webkit-inner-spin-button {
    -webkit-appearance: none; margin: 0;
  }
  .weight-entry-form button {
    padding: var(--s-2) var(--s-3);
    background: transparent;
    color: var(--accent);
    border: 1px solid rgba(var(--accent-rgb), 0.2);
    border-radius: var(--r-xs);
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .weight-entry-form button.is-cancel { color: var(--text-faint); border-color: var(--border-light); }
  .weight-empty {
    padding: var(--s-5);
    color: var(--text-faint);
    font-size: 13px;
    text-align: center;
    font-weight: 400;
  }

  /* Wave 11.7.5c — 부위 선택 시트 (long-press → "부위 변경" → 6 chip) */
  .part-picker-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--s-2);
    padding: 0 var(--s-4) var(--s-4);
  }
  .part-picker-chip {
    padding: var(--s-3) var(--s-2);
    background: var(--bg-warm);
    color: var(--text-strong);
    border: 1px solid transparent;
    border-radius: var(--r-md);
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 100ms var(--ease), border-color 100ms var(--ease);
  }
  .part-picker-chip:active { transform: scale(0.97); }
  .part-picker-chip.is-current { border-color: var(--accent); color: var(--accent); }

  /* Wave 11.7.5a — 커스텀 숫자 키패드 (spec §10-2). bottom sheet 슬라이드 업.
     transform: translateY(100%)→0. 6-3-2 키패드 패턴 (간략화: 0~9·.·← + 확인). */
  .keypad-backdrop {
    position: fixed; inset: 0;
    background: rgba(20, 20, 19, 0);
    pointer-events: none;
    transition: background 220ms var(--ease);
    z-index: 30;
  }
  .keypad-backdrop.is-open { background: rgba(20, 20, 19, 0.35); pointer-events: auto; }
  .keypad-sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--surface);
    border-radius: var(--r-lg) var(--r-lg) 0 0;
    box-shadow: 0 -4px 24px rgba(20,20,19,0.12);
    transform: translateY(100%);
    transition: transform 280ms cubic-bezier(0.32, 0.72, 0, 1);
    padding: var(--s-5) var(--s-4) calc(var(--s-5) + env(safe-area-inset-bottom));
    z-index: 31;
  }
  .keypad-sheet.is-open { transform: translateY(0); }
  .keypad-display {
    text-align: center;
    font-family: var(--font-display);
    font-size: 48px;
    font-weight: 500;
    color: var(--text-strong);
    letter-spacing: -0.02em;
    line-height: 1;
    margin-bottom: var(--s-4);
    font-variant-numeric: tabular-nums;
  }
  .keypad-display .kp-unit {
    font-size: 18px; font-weight: 400; color: var(--text-faint); margin-left: 4px;
  }
  .keypad-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--s-2);
  }
  .kp-key {
    padding: var(--s-3) 0;
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 500;
    background: var(--bg-warm);
    color: var(--text-strong);
    border: none;
    border-radius: var(--r-md);
    cursor: pointer;
    transition: background 100ms var(--ease), transform 80ms var(--ease);
    font-variant-numeric: tabular-nums;
  }
  .kp-key:active { background: var(--border-light); transform: scale(0.97); }
  .kp-key.is-action { color: var(--accent); font-size: 18px; }
  .kp-key.is-confirm { background: var(--accent); color: white; grid-column: span 3; margin-top: var(--s-3); padding: var(--s-4) 0; font-size: 17px; font-weight: 600; }
  .kp-key.is-confirm:disabled { background: var(--border-light); color: var(--text-faint); cursor: not-allowed; }
  .kp-key.is-cancel { color: var(--text-faint); }

  /* PR 팝 — accent 텍스트 짧은 페이드 (spec §6-11 동일 방식) */
  .weight-pr-pop {
    position: fixed;
    top: 30%;
    left: 50%;
    transform: translateX(-50%) translateY(0);
    color: var(--accent);
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 24px;
    letter-spacing: 0.08em;
    z-index: 10;
    opacity: 0;
    pointer-events: none;
  }
  .weight-pr-pop.is-pop {
    animation: weight-pr-pop 1100ms var(--ease-out) both;
  }
  @keyframes weight-pr-pop {
    0%   { opacity: 0; transform: translateX(-50%) translateY(8px); }
    20%  { opacity: 1; transform: translateX(-50%) translateY(0); }
    80%  { opacity: 1; transform: translateX(-50%) translateY(-4px); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-12px); }
  }

  /* ============ [프로필] ============ */
  .profile {
    padding: var(--s-5);
  }
  .field {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: var(--s-3);
    align-items: baseline;
    padding: var(--s-4) 0;
    border-bottom: 1px solid var(--border-light);
    cursor: pointer;
    background: none;
    border-top: none; border-left: none; border-right: none;
    width: 100%;
    text-align: left;
    font-family: inherit;
  }
  .field:last-of-type { border-bottom: none; }
  .field:active { background: var(--bg-warm); }
  .f-label {
    font-family: var(--font-body);
    font-size: 14px; color: var(--text);
  }
  .f-val {
    font-family: var(--font-display);
    font-size: 14px; font-weight: 500;
    color: var(--text-strong);
    letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums;
  }
  .f-val .hint {
    color: var(--text-faint);
    font-weight: 400;
    margin-left: var(--s-2);
  }

  /* 동기화 상태 — Typography-driven (ui §1 / §6)
     컬러 도트 대신 sync-title 의 semantic color (sage=정상) 로 상태 표현 */
  .sync {
    margin: var(--s-5) var(--s-5) 0;
    padding: var(--s-4);
    background: var(--surface);
    border: 1px solid var(--border-light);
    border-radius: var(--r-lg);
    display: flex; flex-direction: column;
    gap: var(--s-1);

    font-family: var(--font-display);
    font-size: 13px; font-weight: 600;
    color: var(--sage);
    letter-spacing: 0.01em;
  }
  .sync-time {
    font-family: var(--font-body);
    font-size: 11px;
    color: var(--text-muted);
  }

  .logout {
    margin: var(--s-6) var(--s-5);
    width: calc(100% - var(--s-5) * 2);
    padding: var(--s-3);
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    font-family: var(--font-display);
    font-size: 13px; font-weight: 500;
    color: var(--text-muted);

    letter-spacing: 0.01em;

  .logout:active { color: var(--danger); border-color: var(--danger); }

  .sheet-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(20,20,19,0.38);
    opacity: 0;
    pointer-events: none;
    transition: opacity 200ms var(--ease);

  .add-sheet {

    left: 0; right: 0; bottom: 0;

    overflow: hidden;
  }
  .add-sheet.is-open { transform: translateY(0); }

  /* 종목 삭제 시트 (Wave 11.6.1) — stats.html del-sheet-* 패턴 재사용 */
  .del-sheet {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    transform: translateY(100%);
    background: var(--surface);
    border-radius: var(--r-lg) var(--r-lg) 0 0;
    box-shadow: var(--shadow-lg);

    padding: var(--s-4) var(--s-5) calc(var(--s-5) + var(--safe-bottom));
    z-index: 60;
  }
  .del-sheet.is-open { transform: translateY(0); }
  .del-sheet-handle {
    width: 36px; height: 4px; background: var(--border);
    border-radius: 2px; margin: 0 auto var(--s-4);
  }
  .del-sheet-title {
    font-family: var(--font-display);
    font-size: 12px; font-weight: 500;
    color: var(--text-muted);

    margin-bottom: var(--s-3);
    text-align: left;

  .del-sheet-action {

  }
  .as-title {

  }
  .as-input:focus {

  .as-chips {
    display: flex;

  }
  .as-chip {
    flex-shrink: 0;
    background: var(--bg-warm);
    border: none;
    font-family: var(--font-display);
    font-size: 13px; font-weight: 500;
    color: var(--text-muted);
    padding: 8px 14px;
    border-radius: var(--r-pill);

  .as-row2 {

  .as-actions {

  .as-btn {

  /* toast */
  .toast {

/* ============ Wave 11.6.1 — 종목 꾹누르기 → 삭제 시트 (spec §10-1) ============
   spec "꾹누르기+드래그로 순서 변경" 중 순서 변경은 Wave 11.7 이관.
   현재는 꾹누르기 = 삭제. 기본/커스텀 운동 모두 삭제 가능 (mocks 수준). */
let pendingDeleteExId = null;
const delExBackdrop = document.getElementById('delExBackdrop');
const delExSheet = document.getElementById('delExSheet');

function openDelExSheet(exId) {
  const ex = ADMIN_EXERCISES.find(x => x.id === exId);
  if (!ex) return;
  pendingDeleteExId = exId;
  document.getElementById('delExTitle').textContent = `"${ex.name}"`;
  delExBackdrop.classList.add('is-open');
  delExSheet.classList.add('is-open');
}
function closeDelExSheet() {
  pendingDeleteExId = null;
  delExBackdrop.classList.remove('is-open');
  delExSheet.classList.remove('is-open');
}
delExBackdrop.addEventListener('click', closeDelExSheet);
delExSheet.addEventListener('click', async (e) => {
  const act = e.target.closest('[data-del-ex]');
  if (!act) return;
  const type = act.dataset.delEx;
  if (type === 'change-part' && pendingDeleteExId) {
    // Wave 11.7.5c — 부위 선택 시트로 전환 (pendingDeleteExId 보존)
    const exId = pendingDeleteExId;
    closeDelExSheet();
    openPartPicker(exId);
    return;
  }
  if (type === 'confirm' && pendingDeleteExId) {
    const exId = pendingDeleteExId;
    // Wave 11.7.5c — SPA 환경: 커스텀 운동만 deleteCustomExercise. 빌트인은 hidden 토글로 안내.
    if (window.gymQueries && window.gymExercisesAdmin) {
      try {
        const customs = await window.gymQueries.listCustomExercises();
        const isCustom = customs.some((c) => c.id === exId);
        if (isCustom) {
          await window.gymQueries.deleteCustomExercise(exId);
          await window.gymExercisesAdmin.renderExercisesTab();
          toast('삭제됨');
        } else {
          toast('빌트인 운동은 숨기기로 사용 (토글)');
        }
      } catch (err) { console.error('[gym] delete', err); toast('삭제 실패'); }
      closeDelExSheet();
      return;
    }
    // mocks 허브 fallback
    const idx = ADMIN_EXERCISES.findIndex(x => x.id === exId);
    if (idx >= 0) {
      const name = ADMIN_EXERCISES[idx].name;
      ADMIN_EXERCISES.splice(idx, 1);
      closeDelExSheet();
      renderExList();
      toast(`"${name}" 삭제됨`);
      return;
    }
  }
  closeDelExSheet();
});

/* 꾹누르기 분기:
   pending(타이머) → 8px 이상 이동 = 스크롤 의도, cancel
   armed(500ms 경과, 햅틱 + scale) → 정지 후 up = 시트 / 이동 = 드래그 정렬
   toggle 버튼은 제외 (short tap 으로 on/off 유지). */
window.gymAdminDragging = false;
(function bindExLongPress() {
  const container = document.getElementById('adminExList');
  const ARM_MS = 500;
  const SCROLL_CANCEL_PX = 8;
  const DRAG_START_PX = 6;

  let phase = 'idle'; // idle | pending | armed | dragging
  let timer = null;
  let currentEl = null;
  let startX = 0, startY = 0;
  let armedX = 0, armedY = 0;
  let suppressNextClick = false;

  const reset = () => {
    if (timer) { clearTimeout(timer); timer = null; }
    if (currentEl) {
      currentEl.classList.remove('is-armed', 'is-dragging');
      currentEl.style.transform = '';
    }
    phase = 'idle';
    currentEl = null;
    window.gymAdminDragging = false;
  };

  const enterArmed = () => {
    if (phase !== 'pending' || !currentEl) return;
    phase = 'armed';
    armedX = startX; armedY = startY;
    currentEl.classList.add('is-armed');
    if (navigator.vibrate) navigator.vibrate(12);
  };

  const enterDragging = () => {
    if (phase !== 'armed' || !currentEl) return;
    phase = 'dragging';
    window.gymAdminDragging = true;
    currentEl.classList.remove('is-armed');
    currentEl.classList.add('is-dragging');
    currentEl.style.transform = '';
  };

  const handleDragMove = (clientY) => {
    if (phase !== 'dragging' || !currentEl) return;
    const rows = [...container.querySelectorAll('.ex-row[data-id]')].filter((r) => r !== currentEl);
    if (!rows.length) return;
    let target = null;
    for (const row of rows) {
      const rect = row.getBoundingClientRect();
      if (clientY >= rect.top && clientY <= rect.bottom) { target = row; break; }
    }
    if (!target) {
      const firstRect = rows[0].getBoundingClientRect();
      const lastRect = rows[rows.length - 1].getBoundingClientRect();
      if (clientY < firstRect.top) {
        if (currentEl !== container.firstElementChild) container.insertBefore(currentEl, rows[0]);
      } else if (clientY > lastRect.bottom) {
        if (currentEl !== container.lastElementChild) container.appendChild(currentEl);
      }
      return;
    }
    const rect = target.getBoundingClientRect();
    const before = clientY < rect.top + rect.height / 2;
    if (before) {
      if (target.previousElementSibling !== currentEl) container.insertBefore(currentEl, target);
    } else {
      if (target.nextElementSibling !== currentEl) container.insertBefore(currentEl, target.nextElementSibling);
    }
  };

  const commitDragOrder = async () => {
    const ids = [...container.querySelectorAll('.ex-row[data-id]')].map((el) => el.dataset.id);
    if (window.gymQueries && window.gymExercisesAdmin) {
      try {
        const part = window.gymExercisesAdmin.getActivePart();
        await window.gymQueries.setExerciseOrderForPart(part, ids);
        await window.gymExercisesAdmin.renderExercisesTab();
        toast('순서 변경됨');
      } catch (err) {
        console.error('[gym] reorder', err);
        toast('순서 저장 실패');
        try { await window.gymExercisesAdmin.renderExercisesTab(); } catch (_) {}
      }
      return;
    }
    const activePart = (typeof state !== 'undefined' && state && state.activePart) ? state.activePart : 'chest';
    const samePart = ADMIN_EXERCISES.filter((x) => x.part === activePart);
    const others = ADMIN_EXERCISES.filter((x) => x.part !== activePart);
    const reordered = ids.map((id) => samePart.find((x) => x.id === id)).filter(Boolean);
    ADMIN_EXERCISES.length = 0;
    ADMIN_EXERCISES.push(...others, ...reordered);
    renderExList();
    toast('순서 변경됨');
  };

  container.addEventListener('pointerdown', (e) => {
    if (e.target.closest('[data-toggle]')) return;
    const el = e.target.closest('[data-id]');
    if (!el) return;
    reset();
    currentEl = el;
    phase = 'pending';
    startX = e.clientX; startY = e.clientY;
    try { container.setPointerCapture(e.pointerId); } catch (_) {}
    timer = setTimeout(enterArmed, ARM_MS);
  });

  container.addEventListener('pointermove', (e) => {
    if (phase === 'pending') {
      if (Math.abs(e.clientX - startX) > SCROLL_CANCEL_PX || Math.abs(e.clientY - startY) > SCROLL_CANCEL_PX) {
        reset();
      }
      return;
    }
    if (phase === 'armed') {
      const dx = e.clientX - armedX;
      const dy = e.clientY - armedY;
      if (Math.hypot(dx, dy) > DRAG_START_PX) {
        enterDragging();
        handleDragMove(e.clientY);
        e.preventDefault();
      }
      return;
    }
    if (phase === 'dragging') {
      handleDragMove(e.clientY);
      e.preventDefault();
    }
  }, { passive: false });

  container.addEventListener('pointerup', async () => {
    if (phase === 'armed') {
      const id = currentEl && currentEl.dataset.id;
      suppressNextClick = true;
      reset();
      if (id) openDelExSheet(id);
      return;
    }
    if (phase === 'dragging') {
      const el = currentEl;
      suppressNextClick = true;
      if (el) { el.classList.remove('is-dragging'); el.style.transform = ''; }
      phase = 'idle';
      window.gymAdminDragging = false;
      currentEl = null;
      if (timer) { clearTimeout(timer); timer = null; }
      await commitDragOrder();
      return;
    }
    reset();
  });
  container.addEventListener('pointercancel', () => reset());

  container.addEventListener('click', (e) => {
    if (suppressNextClick) {
      e.stopPropagation();
      e.preventDefault();
      suppressNextClick = false;
    }
  }, true);
})();

/* ============ 커스텀 운동 추가 바텀시트 (§10-1) ============ */
const EQUIPMENT = [
  { id: 'barbell',    name: '바벨' },
  { id: 'dumbbell',   name: '덤벨' },
  { id: 'machine',    name: '머신' },

  { id: 'bodyweight', name: '맨몸' },
  { id: 'cardio',     name: '유산소' },
];

const addState = {
  name: '',
  part: 'chest',
  equipment: 'barbell',
  weight: '',
  reps: ''
};

function renderAsChips() {
  document.getElementById('asParts').innerHTML = PARTS.map(p => `
    <button type="button" class="as-chip${p.id === addState.part ? ' is-on' : ''}" data-as-part="${p.id}">${p.name}</button>

    <button type="button" class="as-chip${e.id === addState.equipment ? ' is-on' : ''}" data-as-eq="${e.id}">${e.name}</button>
  `).join('');
}

function updateAsSaveState() {
  const nameOk = addState.name.trim().length > 0;
  const repsOk = !!addState.reps && +addState.reps > 0;
  document.getElementById('asSave').disabled = !(nameOk && repsOk);
}

function openAddSheet() {
  // 현재 activePart 기본 선택
  addState.part = state.activePart === 'cardio' ? 'cardio' : state.activePart;
  addState.equipment = state.activePart === 'cardio' ? 'cardio' : 'barbell';
  addState.name = '';
  addState.weight = '';
  addState.reps = '';
  document.getElementById('asName').value = '';
  document.getElementById('asWeight').value = '';
  document.getElementById('asReps').value = '';
  renderAsChips();
  updateAsSaveState();
  document.getElementById('addBackdrop').classList.add('is-open');
  document.getElementById('addSheet').classList.add('is-open');
  setTimeout(() => document.getElementById('asName').focus(), 280);
}

function closeAddSheet() {
  document.getElementById('addBackdrop').classList.remove('is-open');
  document.getElementById('addSheet').classList.remove('is-open');
}

document.getElementById('addCustom').addEventListener('click', openAddSheet);
document.getElementById('addBackdrop').addEventListener('click', closeAddSheet);

document.getElementById('asParts').addEventListener('click', (e) => {
  const c = e.target.closest('[data-as-part]');
  if (!c) return;
  addState.part = c.dataset.asPart;
  // 유산소 부위 선택 시 장비도 자동 cardio
  if (addState.part === 'cardio') addState.equipment = 'cardio';
  else if (addState.equipment === 'cardio') addState.equipment = 'barbell';
  renderAsChips();
});
document.getElementById('asEquipment').addEventListener('click', (e) => {
  const c = e.target.closest('[data-as-eq]');
  if (!c) return;
  addState.equipment = c.dataset.asEq;
  renderAsChips();
});
document.getElementById('asName').addEventListener('input', (e) => {
  addState.name = e.target.value;
  updateAsSaveState();
});
document.getElementById('asWeight').addEventListener('input', (e) => {
  addState.weight = e.target.value;
});
document.getElementById('asReps').addEventListener('input', (e) => {
  addState.reps = e.target.value;
  updateAsSaveState();
});
document.querySelectorAll('[data-add-act]').forEach(b => {
  b.addEventListener('click', () => { if (b.dataset.addAct === 'cancel') closeAddSheet(); });
});
document.getElementById('asSave').addEventListener('click', async () => {
  if (document.getElementById('asSave').disabled) return;
  const isBodyweight = addState.equipment === 'bodyweight';
  const isCardio = addState.equipment === 'cardio';
  const name = addState.name.trim();
  const reps = +addState.reps;
  const weight = (isBodyweight || isCardio) ? 0 : (addState.weight ? +addState.weight : 0);

  // Wave 11.7.4b — SPA 환경: createCustomExercise 로 영속화 (queries.js).
  if (window.gymExercisesAdmin) {
    try {
      await window.gymExercisesAdmin.createCustomExerciseFromForm({
        name,
        part: addState.part === 'core' ? 'arms' : addState.part, // mocks 의 'core' 잔존 입력 보호
        equipment: addState.equipment,
        defaultSets: 3,
        defaultReps: reps,
        defaultWeight: weight,
      });
      closeAddSheet();
      toast(`${name} 추가됨`);
    } catch (e) {
      console.error('[gym] createCustomExercise', e);
      toast('추가 실패 — 콘솔 확인');
    }
    return;
  }

  // mocks 허브 fallback — 기존 in-memory ADMIN_EXERCISES push
  const newEx = {
    id: 'custom_' + Date.now(),
    name,
    part: addState.part,
    equipment: addState.equipment,
    w: (isBodyweight || isCardio) ? null : weight,
    r: reps,
    on: true,
    custom: true,
  };
  if (isCardio) { newEx.d = reps; delete newEx.r; delete newEx.w; }
  ADMIN_EXERCISES.push(newEx);
  state.activePart = addState.part;
  renderParts();
  renderExList();
  closeAddSheet();
  toast(`${name} 추가됨`);
});
document.querySelectorAll('[data-nav]').forEach(b => {
  b.addEventListener('click', () => {
    window.location.href = b.dataset.nav === 'home' ? 'home.html' : 'stats.html';
  });
});
document.querySelectorAll('[data-field]').forEach(b => {
  b.addEventListener('click', async () => {
    // Wave 11.7.6 — SPA 환경: editProfileField 호출 (prompt 입력)
    if (window.gymProfile) {
      const fieldKey = b.dataset.field;
      const r = await window.gymProfile.editProfileField(fieldKey);
      if (r.ok) toast(`${b.querySelector('.f-label').textContent} 변경됨`);
      else if (r.reason === 'invalid_input') toast('입력값 범위 확인');
      // cancelled / no-db 는 silent
      return;
    }
    // mocks 허브 fallback
    toast(`${b.querySelector('.f-label').textContent} 수정`);
  });
});
document.querySelectorAll('[data-act]').forEach(b => {
  b.addEventListener('click', () => {
    if (b.dataset.act === 'weight-add') {
      // Wave 11.7.5a — 커스텀 숫자 키패드 (spec §10-2). SPA 환경에선 saveWeightInput 으로 영속화.
      openKeypadSheet({
        unit: 'kg',
        initial: '',
        onConfirm: async (val) => {
          if (window.gymWeights) {
            const r = await window.gymWeights.saveWeightInput(val);
            if (r?.ok) toast(r.isPR ? '체중 신기록 PR' : '저장되었습니다');
            else toast('숫자를 다시 확인해 주세요');
          } else {
            toast(`체중 ${val} kg`);
          }
        },
      });
    }
    else if (b.dataset.act === 'weight-cancel') {
      if (window.gymWeights) window.gymWeights.toggleWeightInputForm(false);
    }
    else if (b.dataset.act === 'logout') {
      // Wave 11.7 — SPA 환경: 실 signOut → onAuthStateChange 가 #/login 으로 라우팅
      if (window.gymAuth) {
        window.gymAuth.signOut().catch(e => console.error('[gym] signOut 실패', e));
        return;
      }
      // mocks 허브(iframe) 환경 fallback: 기존 prototype redirect
      setTimeout(() => { window.location.href = 'login.html'; }, 200);
    }
  });
});

// Wave 11.7.2b — 체중 입력 form submit (Enter 또는 저장 버튼)
const weightForm = document.querySelector('[data-bind="weight-entry-form"]');
if (weightForm) {
  weightForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!window.gymWeights) return;
    const input = weightForm.querySelector('[data-bind="weight-entry-input"]');
    const result = await window.gymWeights.saveWeightInput(input?.value);
    if (!result?.ok) {
      toast('숫자를 다시 확인해 주세요');
      return;
    }
    window.gymWeights.toggleWeightInputForm(false);
    toast(result.isPR ? '체중 신기록 PR' : '저장되었습니다');
  });
}

// Wave 11.7 — SPA 환경 사용자 프로필 hydrate (mocks 허브에선 window.gymAuth 부재 → 기존 텍스트 유지)
(async function hydrateProfile() {
  if (!window.gymAuth) return;
  try {
    const user = await window.gymAuth.getCurrentUser();
    if (!user) return;
    const meta = user.user_metadata || {};
    const name = meta.full_name || meta.name || (user.email ? user.email.split('@')[0] : '사용자');
    const email = user.email || '';
    const el = document.getElementById('syncTimeProfile');
    if (el) el.textContent = `방금 · ${name} · ${email}`;
  } catch (e) {
    console.error('[gym] hydrateProfile 실패', e);
  }
})();

/* Wave 11.7.5a — 커스텀 숫자 키패드 (spec §10-2).
   bottom sheet 슬라이드 업 + 0~9·소수점·← + 확인. 소수점 1자리 강제. */
const _keypad = (() => {
  const backdrop = document.querySelector('[data-bind="keypad-backdrop"]');
  const sheet = document.querySelector('[data-bind="keypad-sheet"]');
  const valEl = document.querySelector('[data-bind="keypad-value"]');
  const unitEl = document.querySelector('[data-bind="keypad-unit"]');
  const confirmBtn = document.querySelector('[data-bind="keypad-confirm"]');
  let buf = '';
  let onConfirm = null;
  if (!backdrop || !sheet) return { open: () => {}, close: () => {} };

  function display() {
    valEl.textContent = buf || '0';
    if (confirmBtn) confirmBtn.disabled = !buf || Number(buf) <= 0;
  }
  function append(ch) {
    if (ch === '.') {
      if (buf.includes('.')) return;
      if (!buf) buf = '0';
      buf += '.';
    } else if (ch === 'back') {
      buf = buf.slice(0, -1);
    } else {
      // 소수점 1자리 제한
      if (buf.includes('.') && buf.split('.')[1].length >= 1) return;
      // 정수부 4자리 제한 (체중 0~9999)
      const intPart = buf.includes('.') ? buf.split('.')[0] : buf;
      if (!buf.includes('.') && intPart.length >= 4) return;
      if (buf === '0' && ch !== '.') buf = ''; // leading 0 정리
      buf += ch;
    }
    display();
  }
  function open({ unit = 'kg', initial = '', onConfirm: cb } = {}) {
    buf = String(initial || '');
    onConfirm = cb;
    if (unitEl) unitEl.textContent = unit;
    display();
    backdrop.classList.add('is-open');
    sheet.classList.add('is-open');
    backdrop.setAttribute('aria-hidden', 'false');
    sheet.setAttribute('aria-hidden', 'false');
  }
  function close() {
    backdrop.classList.remove('is-open');
    sheet.classList.remove('is-open');
    backdrop.setAttribute('aria-hidden', 'true');
    sheet.setAttribute('aria-hidden', 'true');
    onConfirm = null;
    buf = '';
  }
  // 키 위임 등록 (1회)
  sheet.addEventListener('click', (e) => {
    const k = e.target.closest('[data-key]');
    if (!k) return;
    const v = k.dataset.key;
    if (v === 'confirm') {
      const cb = onConfirm;
      const final = buf;
      close();
      if (cb && final) cb(final);
      return;
    }
    append(v);
  });
  backdrop.addEventListener('click', () => close());
  return { open, close };
})();
function openKeypadSheet(opts) { _keypad.open(opts); }

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('is-show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('is-show'), 1500);
}

renderParts();
renderExList();

// Wave 11.7.2b — admin 진입 시 SPA 환경 (window.gymWeights + window.gymQueries) 면 즉시 hydrate.
//   mocks 허브(iframe) 환경에선 window.gymQueries 미초기화 → renderWeightTab 가 no-op 으로 fixture 보존.
if (window.gymWeights) {
  window.gymWeights.renderWeightTab().catch(e => console.error('[gym] renderWeightTab init', e));
}

// Wave 11.7.4b — SPA 환경: 운동 탭 hydrate + 위임 hook 등록 (1회).
//   mocks 허브에선 graceful no-op (db 미초기화 → renderExercisesTab skip).
if (window.gymExercisesAdmin) {
  window.gymExercisesAdmin.hookExerciseTabClicks();
  window.gymExercisesAdmin.renderExercisesTab().catch(e => console.error('[gym] renderExercisesTab init', e));
}

// Wave 11.7.6 — SPA 환경: 프로필 탭은 진입 시점 hydrate (sec-tab 클릭 핸들러 안). 첫 mount 시점에도 1회.
if (window.gymProfile) {
  window.gymProfile.renderProfileTab().catch(e => console.error('[gym] renderProfileTab init', e));
}
