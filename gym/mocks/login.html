<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0c0a08">
<title>Gym · 로그인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Dark v2 — Warm dark base + Claude Orange (gym only) */
    --bg: #0c0a08; --surface: #15120e; --bg-warm: #1a1612; --bg-elevated: #1d1914;
    --text: #f3efe6; --text-strong: #ffffff; --text-muted: rgba(243,239,230,0.6); --text-faint: rgba(243,239,230,0.4);
    --accent: #d97757; --accent-soft: rgba(217,119,87,0.18); --accent-deep: #c96442; --accent-hover: #e58a6c; --accent-rgb: 217, 119, 87;
    --done: #d97757; --done-soft: rgba(217,119,87,0.18);
    --sage: #d97757; --blue: #6a9bcc; --amber: #c4973b; --danger: #c94432;
    --border: rgba(255,255,255,0.08); --border-strong: rgba(255,255,255,0.18); --border-light: rgba(255,255,255,0.04);
    --font-display: 'Poppins', system-ui, sans-serif;
    --font-body: 'Noto Sans KR', system-ui, sans-serif;
    --fs-xs: 11px; --fs-sm: 13px; --fs-base: 15px; --fs-md: 16px; --fs-lg: 20px; --fs-xl: 28px;
    --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px;
    --s-6: 24px; --s-8: 32px; --s-10: 40px; --s-12: 48px; --s-16: 64px;
    --r-sm: 6px; --r-md: 10px; --r-lg: 16px; --r-xl: 20px; --r-pill: 999px;
    --shadow-xs: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.4);
    --shadow-lg: 0 6px 14px rgba(0,0,0,0.3), 0 30px 60px rgba(0,0,0,0.6);
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font-body); color: var(--text); background: var(--bg);
    font-variant-numeric: tabular-nums; line-height: 1.5; -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* PHONE FRAME — login 은 살짝 더 짙은 #0f0d0a (v2 LoginA 기준) */
  .phone {
    max-width: 375px; height: 100dvh; max-height: 812px; margin: 0 auto;
    display: flex; flex-direction: column; position: relative;
    overflow: hidden; background: #0f0d0a;
    color: var(--text);
  }
  @media (min-width: 376px) {
    body { padding: var(--s-8) 0; }
    .phone { border: 1px solid var(--border-light); box-shadow: var(--shadow-lg); border-radius: var(--r-lg); }
  }
  .safe-top { height: var(--safe-top); min-height: 20px; flex-shrink: 0; }

  /* ============ SCREEN ============ */
  .screen {
    flex: 1;
    display: flex; flex-direction: column;
    padding: 0 28px;
    padding-bottom: calc(12px + var(--safe-bottom));
    position: relative;
  }

  /* 좌상단 EST·2026 corner mark */
  .corner {
    position: absolute;
    top: 18px; left: 28px;
    display: flex; align-items: center; gap: 8px;
    z-index: 2;
  }
  .corner-line {
    width: 14px; height: 1.5px;
    background: var(--accent);
  }
  .corner-mark {
    font-family: var(--font-display);
    font-size: 10px; font-weight: 500;
    color: rgba(243,239,230,0.55);
    letter-spacing: 0.18em;
  }

  /* HERO — 중앙 정렬 */
  .hero {
    flex: 1;
    display: flex; flex-direction: column;
    justify-content: center;
    gap: 36px;
  }
  .brand {
    font-family: var(--font-display);
    font-size: 96px; font-weight: 200;
    line-height: 0.85;
    color: #fff;
    letter-spacing: -0.06em;
  }
  .headline-block {
    display: flex; flex-direction: column;
    gap: 16px;
  }
  .headline {
    font-family: var(--font-body);
    font-size: 30px; font-weight: 300;
    color: #fff; line-height: 1.25;
    letter-spacing: -0.025em;
  }
  .headline-sub {
    font-family: var(--font-body);
    font-size: 13px; font-weight: 400;
    color: rgba(243,239,230,0.45);
    letter-spacing: -0.005em;
  }

  /* FOOT — Google CTA + 안내 */
  .foot {
    padding-bottom: 12px;
    display: flex; flex-direction: column; gap: 16px;
  }

  .error-banner {
    display: none;
    padding: var(--s-3) var(--s-4);
    background: rgba(217,119,87,0.10);
    border: 1px solid rgba(217,119,87,0.28);
    border-radius: var(--r-md);
    font-family: var(--font-body);
    font-size: 12px;
    color: var(--accent-hover);
    text-align: center;
    letter-spacing: -0.01em;
    line-height: 1.5;
  }
  .app[data-state="error"] .error-banner { display: block; }

  /* Google 버튼 — v2 LoginA: 흰 배경, height 56, radius 16, 좌측 로고+라벨, 우측 → */
  .btn-google {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    height: 56px;
    padding: 0 24px;
    background: #fff;
    border: 0;
    border-radius: 16px;
    font-family: var(--font-body);
    font-size: 15px; font-weight: 500;
    color: #0f0d0a;
    cursor: pointer;
    transition: transform 100ms var(--ease), background 150ms var(--ease);
  }
  .btn-google:active { transform: scale(0.98); background: #f3efe6; }
  .btn-google[disabled] { cursor: wait; opacity: 0.7; }
  .btn-google .g-left {
    display: flex; align-items: center; gap: 12px;
  }
  .btn-google .g-logo { width: 16px; height: 16px; flex-shrink: 0; }
  .btn-google .g-arrow { font-size: 16px; color: rgba(15,13,10,0.4); }

  /* Loading 스피너 */
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(15,13,10,0.15);
    border-top-color: #0f0d0a;
    border-radius: 50%;
    display: none;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .app[data-state="loading"] .btn-google .g-logo { display: none; }
  .app[data-state="loading"] .btn-google .spinner { display: block; }

  /* 허용 안내 */
  .permission-note {
    font-family: var(--font-body);
    font-size: 11px; font-weight: 400;
    color: rgba(243,239,230,0.35);
    text-align: center;
    letter-spacing: 0.01em;
    line-height: 1.5;
  }

  /* reveal */
  .rv { opacity: 0; transform: translateY(12px); animation: rvUp 0.6s var(--ease-out) forwards; }
  .rv-1 { animation-delay: 100ms; }
  .rv-2 { animation-delay: 200ms; }
  .rv-3 { animation-delay: 300ms; }
  .rv-4 { animation-delay: 400ms; }
  @keyframes rvUp { to { opacity: 1; transform: translateY(0); } }

  /* Toast */
  .toast {
    position: absolute;
    left: 50%; bottom: calc(var(--s-12) + var(--safe-bottom));
    transform: translate(-50%, 20px);
    background: rgba(243,239,230,0.95); color: #0f0d0a;
    padding: var(--s-3) var(--s-5); border-radius: var(--r-pill);
    font-family: var(--font-body); font-size: 12px;
    opacity: 0; pointer-events: none;
    transition: opacity 200ms var(--ease), transform 200ms var(--ease);
    z-index: 80; box-shadow: var(--shadow-lg);
    white-space: nowrap;
  }
  .toast.is-show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<!-- Google logo symbol -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none;" aria-hidden="true">
  <symbol id="g-logo" viewBox="0 0 16 16">
    <path d="M15.5 8.18c0-.6-.05-1.18-.15-1.73H8v3.27h4.2a3.6 3.6 0 0 1-1.56 2.36v1.96h2.52c1.47-1.36 2.34-3.36 2.34-5.86z" fill="#4285f4"/>
    <path d="M8 16c2.1 0 3.87-.7 5.16-1.9l-2.52-1.95c-.7.47-1.59.75-2.64.75-2.03 0-3.74-1.37-4.36-3.21H1.04v2.02A8 8 0 0 0 8 16z" fill="#34a853"/>
    <path d="M3.64 9.69A4.78 4.78 0 0 1 3.4 8c0-.59.1-1.16.24-1.69V4.29H1.04A8 8 0 0 0 0 8c0 1.29.31 2.5.86 3.58l2.78-1.89z" fill="#fbbc04"/>
    <path d="M8 3.18c1.14 0 2.16.39 2.97 1.16l2.23-2.23A8 8 0 0 0 8 0 8 8 0 0 0 1.04 4.29l2.6 2.02C4.26 4.55 5.97 3.18 8 3.18z" fill="#ea4335"/>
  </symbol>
</svg>

<div class="phone app" id="app" data-state="default">
  <div class="safe-top"></div>

  <main class="screen">

    <!-- 좌상단 corner mark -->
    <div class="corner rv rv-1">
      <div class="corner-line"></div>
      <span class="corner-mark">EST · 2026</span>
    </div>

    <!-- Hero: Gym 타이포 + 헤드라인 -->
    <section class="hero">
      <h1 class="brand rv rv-2">Gym</h1>
      <div class="headline-block rv rv-3">
        <p class="headline">오늘<br>한 세트만 더.</p>
        <p class="headline-sub">기록으로 이어지는 운동</p>
      </div>
    </section>

    <!-- Foot: 에러 배너 + Google CTA + 안내 -->
    <section class="foot">
      <div class="error-banner rv rv-4" id="errorBanner">
        허용되지 않은 계정입니다<br>
        <span style="color:rgba(243,239,230,0.55); font-size:11px">leftjap@gmail.com · soyoun312@gmail.com</span>
      </div>

      <button class="btn-google rv rv-4" id="btnGoogle" type="button">
        <span class="g-left">
          <svg class="g-logo" viewBox="0 0 16 16"><use href="#g-logo"/></svg>
          <span class="spinner"></span>
          <span class="btn-label" id="btnLabel">Google로 계속하기</span>
        </span>
        <span class="g-arrow">→</span>
      </button>

      <p class="permission-note rv rv-4">
        허용된 계정만 접근할 수 있어요
      </p>
    </section>

  </main>

  <div class="toast" id="toast"></div>
</div>

<script>
const STATES = {
  default: { label: 'Google로 계속하기', disabled: false },
  loading: { label: '인증 중…',          disabled: true },
  error:   { label: 'Google로 다시 시도', disabled: false }
};

function applyState(name) {
  const s = STATES[name];
  if (!s) return;
  document.getElementById('app').dataset.state = name;
  document.getElementById('btnLabel').textContent = s.label;
  const btn = document.getElementById('btnGoogle');
  btn.toggleAttribute('disabled', s.disabled);
  // reveal re-trigger
  document.querySelectorAll('.rv').forEach(el => {
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = '';
  });
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('is-show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('is-show'), 1500);
}

// Wave 11.7 — AUTH_ERROR_KEY 마커 1회 소비 (allowlist 위반 등 에러 표시)
function consumeAuthErrorMarker() {
  try {
    const key = (window.gymAuth && window.gymAuth.AUTH_ERROR_KEY) || 'gymAuthError';
    const v = localStorage.getItem(key);
    if (v === 'not_allowed') {
      localStorage.removeItem(key);
      return true;
    }
  } catch (e) { /* localStorage 차단 환경 무시 */ }
  return false;
}

document.getElementById('btnGoogle').addEventListener('click', async () => {
  const state = document.getElementById('app').dataset.state;
  if (state === 'loading') return;
  // SPA + Supabase 정상 설정: 실 OAuth (브라우저 redirect)
  if (window.gymAuth && window.gymAuth.isSupabaseConfigured) {
    applyState('loading');
    const { error } = await window.gymAuth.signInWithGoogle();
    if (error) applyState('error');
    return; // 성공 시 페이지가 redirect 로 이탈
  }
  // SPA 인데 env 미설정: 즉시 error (e2e B 케이스 검증 대상)
  if (window.gymAuth && !window.gymAuth.isSupabaseConfigured) {
    applyState('error');
    return;
  }
  // mocks 허브(iframe) 환경: 기존 prototype 흐름 유지
  applyState('loading');
  setTimeout(() => { window.location.href = 'home.html'; }, 700);
});

// 초기 상태: AUTH_ERROR_KEY 마커 있으면 error, 없으면 default
applyState(consumeAuthErrorMarker() ? 'error' : 'default');
</script>

</body>
</html>
