<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0d0a">
<title>Gym · 로그인 (v2 · LoginA)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf9f5; --bg-warm: #f3efe6; --bg-deep: #ece7db;
  --surface: #ffffff; --surface-2: #f7f4ec;
  --ink: #1a1714; --ink-strong: #0c0a08;
  --ink-2: #5a544a; --ink-muted: #8d8678; --ink-faint: #c4beb1;
  --line: #e6e1d4; --line-soft: #efeae0;
  --accent: #d97757; --accent-soft: #ecb59f; --accent-deep: #b85a3e; --accent-tint: #fbe9df;
  --sage: #788c5d; --sage-soft: #c0c9aa; --night: #1f1c18;
  --r-xl: 22px; --r-lg: 16px; --r-md: 12px; --r-sm: 8px;
  --shadow-card: 0 1px 2px rgba(28,22,16,.04), 0 8px 24px -8px rgba(28,22,16,.08);
  --shadow-lift: 0 32px 64px -12px rgba(217,119,87,.22), 0 12px 28px -10px rgba(28,22,16,.18);
  --font-display: "Poppins", "SF Pro Display", -apple-system, system-ui, sans-serif;
  --font-body: "Noto Sans KR", -apple-system, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", monospace;
}
* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
body { margin: 0; min-height: 100vh; background: var(--bg-deep); display: flex; align-items: center; justify-content: center; padding: 24px; font-family: var(--font-body); color: var(--ink); }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.kr { font-family: var(--font-body); }
.phone { width: 360px; height: 740px; border-radius: 38px; position: relative; overflow: hidden; box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 30px 60px -20px rgba(28,22,16,.18), 0 0 0 1px rgba(28,22,16,.06); font-family: var(--font-body); color: var(--ink); }
.phone-notch { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 102px; height: 30px; border-radius: 20px; background: #0c0a08; z-index: 50; }
.phone-clock { position: absolute; top: 16px; left: 24px; z-index: 49; font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: -0.01em; color: var(--ink-strong); }
.phone-batt { position: absolute; top: 16px; right: 24px; z-index: 49; display: flex; gap: 5px; align-items: center; color: var(--ink-strong); }
.phone-batt-cell { width: 16px; height: 10px; border-radius: 2px; border: 1.2px solid currentColor; position: relative; }
.phone-batt-cell::after { content: ""; position: absolute; inset: 1.5px; background: currentColor; border-radius: 1px; display: block; }
.phone-content { position: absolute; inset: 0; padding-top: 54px; padding-bottom: 24px; }
.phone-home { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 120px; height: 4px; border-radius: 100px; z-index: 60; background: rgba(0,0,0,.22); }
.phone.dark { color: #f3efe6; }
.phone.dark .phone-clock, .phone.dark .phone-batt { color: #f3efe6; }
.phone.dark .phone-home { background: rgba(255,255,255,.32); }
</style>
</head>
<body>
<div class="phone" style="background:#0f0d0a;">
  <div class="phone-notch"></div>
  <div class="phone-clock num">9:41</div>
  <div class="phone-batt"><div class="phone-batt-cell"></div></div>
  <div class="phone-content">
    <div style="height:100%;display:flex;flex-direction:column;padding:0 28px;color:#f3efe6;position:relative;">
      <div style="position:absolute;top:18px;left:28px;display:flex;align-items:center;gap:8px;">
        <div style="width:14px;height:1.5px;background:var(--accent);"></div>
        <span class="num" style="font-size:10px;color:rgba(243,239,230,0.55);letter-spacing:0.18em;font-weight:500;">EST · 2026</span>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:36px;">
        <div class="num" style="font-size:96px;font-weight:200;line-height:0.85;color:#fff;letter-spacing:-0.06em;">Gym</div>
        <div>
          <div class="kr" style="font-size:30px;font-weight:300;color:#fff;line-height:1.25;letter-spacing:-0.025em;">오늘<br>한 세트만 더.</div>
          <div class="kr" style="margin-top:16px;font-size:13px;color:rgba(243,239,230,0.45);letter-spacing:-0.005em;">기록으로 이어지는 운동</div>
        </div>
      </div>
      <div style="padding-bottom:12px;">
        <button id="googleSignInBtn" type="button" style="width:100%;height:56px;border-radius:16px;border:0;background:#fff;color:#0f0d0a;font-family:var(--font-body);font-size:15px;font-weight:500;display:flex;align-items:center;justify-content:space-between;padding:0 24px;cursor:pointer;">
          <span style="display:flex;align-items:center;gap:12px;">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M15.5 8.18c0-.6-.05-1.18-.15-1.73H8v3.27h4.2a3.6 3.6 0 0 1-1.56 2.36v1.96h2.52c1.47-1.36 2.34-3.36 2.34-5.86z" fill="#4285f4"/>
              <path d="M8 16c2.1 0 3.87-.7 5.16-1.9l-2.52-1.95c-.7.47-1.59.75-2.64.75-2.03 0-3.74-1.37-4.36-3.21H1.04v2.02A8 8 0 0 0 8 16z" fill="#34a853"/>
              <path d="M3.64 9.69A4.78 4.78 0 0 1 3.4 8c0-.59.1-1.16.24-1.69V4.29H1.04A8 8 0 0 0 0 8c0 1.29.31 2.5.86 3.58l2.78-1.89z" fill="#fbbc04"/>
              <path d="M8 3.18c1.14 0 2.16.39 2.97 1.16l2.23-2.23A8 8 0 0 0 8 0 8 8 0 0 0 1.04 4.29l2.6 2.02C4.26 4.55 5.97 3.18 8 3.18z" fill="#ea4335"/>
            </svg>
            Google로 계속하기
          </span>
          <span style="font-size:16px;color:rgba(15,13,10,0.4);">→</span>
        </button>
        <div id="loginError" class="kr" role="alert" style="margin-top:12px;text-align:center;font-size:11px;color:#e88a78;display:none;"></div>
        <div class="kr" style="margin-top:16px;text-align:center;font-size:11px;color:rgba(243,239,230,0.35);">허용된 계정만 접근할 수 있어요</div>
      </div>
    </div>
  </div>
  <div class="phone-home"></div>
</div>
<script>
(function () {
  const btn = document.getElementById('googleSignInBtn');
  const errEl = document.getElementById('loginError');
  if (!btn) return;
  const showErr = (msg) => { if (errEl) { errEl.textContent = msg; errEl.style.display = ''; } };
  try {
    const key = (window.gymAuth && window.gymAuth.AUTH_ERROR_KEY) || 'gymAuthError';
    const stored = localStorage.getItem(key);
    if (stored === 'not_allowed') { showErr('허용되지 않은 계정입니다.'); localStorage.removeItem(key); }
  } catch {}
  btn.addEventListener('click', async () => {
    if (!window.gymAuth || !window.gymAuth.isSupabaseConfigured) {
      showErr('Supabase 미구성 — 환경 변수 확인'); return;
    }
    btn.disabled = true;
    try { await window.gymAuth.signInWithGoogle(); }
    catch (e) { showErr('로그인 실패. 다시 시도해주세요.'); btn.disabled = false; }
  });
})();
</script>
</body>
</html>
