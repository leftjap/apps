<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#241f1a">
<title>Gym · 로그인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 구현 레퍼런스 - 로그인.html 정합 (0px). 다크 스플래시 — 진입 브랜드 모먼트.
   .phone 배경은 index.html 이 라이트(#fdfdfd)로 !important 강제하므로, 다크 그라데이션은
   .phone-content(inset:0 — 전체 phone 영역 + safe-area 패딩 박스까지 덮음)에 적용해 흰 띠 방지.
   토큰: --font-sans/--font-mono/--crail-base/--ink-1/--ink-3 은 paper.css 전역. 다크 톤만 로컬. */
:root {
  --night: oklch(20% 0.012 60);
  --on-dark: oklch(96% 0.006 60); --on-dark-2: oklch(96% 0.006 60 / 0.5); --on-dark-3: oklch(96% 0.006 60 / 0.34);
}
* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.kr { font-family: var(--font-sans); }
body { margin: 0; min-height: 100vh; background: #ece7db; display: flex; align-items: center; justify-content: center; padding: 24px; font-family: var(--font-sans); color: var(--ink-1); }
.phone { width: 360px; height: 740px; border-radius: 38px; position: relative; overflow: hidden; background: var(--night); color: var(--on-dark); font-family: var(--font-sans); box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 30px 60px -20px rgba(28,22,16,.18), 0 0 0 1px rgba(28,22,16,.06); }
.phone-notch { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 100px; height: 28px; border-radius: 16px; background: #000; z-index: 50; }
.phone-content { position: absolute; inset: 0; padding-top: 50px; color: var(--on-dark);
  background:
    radial-gradient(600px 360px at 22% 8%, oklch(30% 0.03 50 / 0.7), transparent 60%),
    radial-gradient(520px 420px at 105% 100%, oklch(32% 0.05 50 / 0.55), transparent 55%),
    var(--night); }
.phone-home { position: absolute; bottom: 9px; left: 50%; transform: translateX(-50%); width: 124px; height: 5px; border-radius: 100px; z-index: 60; background: rgba(255,255,255,.32); }
</style>
</head>
<body>
<div class="phone">
  <div class="phone-notch"></div>
  <div class="phone-content">
    <div style="height:100%;display:flex;flex-direction:column;padding:0 28px;position:relative;">
      <!-- eyebrow -->
      <div style="position:absolute;top:18px;left:28px;display:flex;align-items:center;gap:8px;">
        <div style="width:14px;height:1.5px;background:var(--crail-base);"></div>
        <span class="mono" style="font-size:12px;color:var(--on-dark-2);letter-spacing:0.2em;font-weight:600;">EST · 2026</span>
      </div>
      <!-- 히어로 -->
      <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:34px;">
        <div class="mono" style="font-size:88px;font-weight:500;line-height:0.82;color:#fff;letter-spacing:-0.05em;">Gym</div>
        <div>
          <div class="kr" style="font-size:29px;font-weight:600;color:#fff;line-height:1.28;letter-spacing:-0.03em;">오늘<br>한 세트만 더.</div>
          <div class="kr" style="margin-top:14px;font-size:15px;color:var(--on-dark-3);">기록으로 이어지는 운동</div>
        </div>
      </div>
      <!-- CTA -->
      <div style="padding-bottom:12px;">
        <button id="googleSignInBtn" type="button" class="kr" style="width:100%;height:56px;border-radius:16px;border:0;background:#fff;color:var(--ink-1);font-family:var(--font-sans);font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:space-between;padding:0 22px;cursor:pointer;box-shadow:0 12px 28px -12px rgba(0,0,0,0.5);">
          <span style="display:flex;align-items:center;gap:12px;">
            <svg width="17" height="17" viewBox="0 0 16 16" aria-hidden="true"><path d="M15.5 8.18c0-.6-.05-1.18-.15-1.73H8v3.27h4.2a3.6 3.6 0 0 1-1.56 2.36v1.96h2.52c1.47-1.36 2.34-3.36 2.34-5.86z" fill="#4285f4"/><path d="M8 16c2.1 0 3.87-.7 5.16-1.9l-2.52-1.95c-.7.47-1.59.75-2.64.75-2.03 0-3.74-1.37-4.36-3.21H1.04v2.02A8 8 0 0 0 8 16z" fill="#34a853"/><path d="M3.64 9.69A4.78 4.78 0 0 1 3.4 8c0-.59.1-1.16.24-1.69V4.29H1.04A8 8 0 0 0 0 8c0 1.29.31 2.5.86 3.58l2.78-1.89z" fill="#fbbc04"/><path d="M8 3.18c1.14 0 2.16.39 2.97 1.16l2.23-2.23A8 8 0 0 0 8 0 8 8 0 0 0 1.04 4.29l2.6 2.02C4.26 4.55 5.97 3.18 8 3.18z" fill="#ea4335"/></svg>
            Google로 계속하기
          </span>
          <span style="font-size:18px;color:var(--ink-3);">→</span>
        </button>
        <div id="loginError" class="kr" role="alert" style="margin-top:12px;text-align:center;font-size:13px;color:var(--crail-soft);display:none;"></div>
        <div class="kr" style="margin-top:16px;text-align:center;font-size:13px;color:var(--on-dark-3);">허용된 계정만 접근할 수 있어요</div>
      </div>
    </div>
  </div>
  <div class="phone-home"></div>
</div>
<script>
(function () {
  const btn = document.getElementById('googleSignInBtn');
  const errEl = document.getElementById('loginError');
  if (!btn) return;
  const showErr = (msg) => { if (errEl) { errEl.textContent = msg; errEl.style.display = ''; } };
  try {
    const key = (window.gymAuth && window.gymAuth.AUTH_ERROR_KEY) || 'gymAuthError';
    const stored = localStorage.getItem(key);
    if (stored === 'not_allowed') { showErr('허용되지 않은 계정입니다.'); localStorage.removeItem(key); }
  } catch {}
  btn.addEventListener('click', async () => {
    if (!window.gymAuth || !window.gymAuth.isSupabaseConfigured) {
      showErr('Supabase 미구성 — 환경 변수 확인'); return;
    }
    btn.disabled = true;
    try { await window.gymAuth.signInWithGoogle(); }
    catch (e) { showErr('로그인 실패. 다시 시도해주세요.'); btn.disabled = false; }
  });
})();
</script>
</body>
</html>
