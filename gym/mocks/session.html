<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0a08">
<title>Gym · 세션 (v2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 구현 레퍼런스 - 세션.html 정합 (0px). 토큰은 paper.css 와 동일. */
:root { --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:22px;
  --font-display:"Space Grotesk",ui-monospace,monospace; }
* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
body { margin: 0; min-height: 100vh; background: oklch(93.5% 0.007 60); display: flex; align-items: center; justify-content: center; padding: 24px; font-family: var(--font-sans); color: var(--ink-1); }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.kr { font-family: var(--font-sans); }
.phone { width: 360px; height: 760px; border-radius: 40px; position: relative; overflow: hidden; background: var(--shell); color: var(--ink-1); font-family: var(--font-sans); box-shadow: 0 0 0 1px oklch(88% 0.006 60), 0 2px 2px rgba(20,18,14,.04), 0 44px 80px -28px rgba(20,18,14,.32); }
.phone-notch { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 100px; height: 28px; border-radius: 16px; background: #111; z-index: 50; }
.phone-content { position: absolute; inset: 0; padding-top: 50px; }
.phone-home { position: absolute; bottom: 9px; left: 50%; transform: translateX(-50%); width: 124px; height: 5px; border-radius: 100px; z-index: 60; background: rgba(0,0,0,.18); }
[data-state="empty"] .session-active { display: none; }
[data-state="active"] .session-empty { display: none; }

@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes shimmer { 0% { transform: translateX(-120%); } 60%,100% { transform: translateX(360%); } }
@keyframes barPulse { 0%,100% { box-shadow: 0 0 0 0 oklch(67% 0.12 50 / 0); } 50% { box-shadow: 0 0 0 4px oklch(67% 0.12 50 / 0.16); } }
.sess-live { animation: pulse 1.8s ease-in-out infinite; }
.vbar-shimmer { animation: shimmer 2.8s ease-in-out infinite; }
@keyframes edgePulse { 0%,100% { box-shadow: 0 0 0 3px var(--crail-base), 0 0 11px 3px rgba(217,119,87,0.6); transform: translate(-50%,-50%) scale(1); } 50% { box-shadow: 0 0 0 3px var(--crail-base), 0 0 24px 9px rgba(217,119,87,0.9); transform: translate(-50%,-50%) scale(1.16); } }
#volEdge { animation: edgePulse 1.35s ease-in-out infinite; }
@keyframes overGlow { 0%,100% { box-shadow: inset 0 1px 0 rgba(255,255,255,0.32), 0 0 0 0 rgba(217,119,87,0), 0 2px 5px -1px rgba(217,119,87,0.45); } 50% { box-shadow: inset 0 1px 0 rgba(255,255,255,0.42), 0 0 13px 1px rgba(217,119,87,0.55), 0 2px 9px -1px rgba(217,119,87,0.6); } }
#cardProgressBar.is-over { animation: overGlow 1.5s ease-in-out infinite; }
#cardProgressBar.is-over .vbar-shimmer { animation-duration: 1.5s; }
#volGoal.broken { background: var(--crail-deep); box-shadow: 0 0 7px rgba(217,119,87,0.6); }
#cardSessVolPrev.struck { text-decoration: line-through; opacity: 0.55; }
@keyframes ringPulse { 0% { opacity: 0.5; transform: scale(1); } 70%,100% { opacity: 0; transform: scale(1.34); } }
#cardVolRingPulse.is-record { animation: ringPulse 1.6s ease-out infinite; }
@media (prefers-reduced-motion: reduce) { *{ animation: none !important; } }

/* ===== 툴바 ===== */
.sess-toolbar { flex-shrink:0; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:0 16px; height:48px; }
.sess-toolbar .home-btn { width:40px; height:40px; margin-left:-6px; border-radius:var(--r-sm); border:0; background:transparent; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-3); }
.sess-toolbar .timer { justify-self:center; display:flex; align-items:center; gap:8px; }
.sess-toolbar .end { justify-self:end; font-size:14px; font-weight:600; color:var(--ink-3); padding:9px 4px 9px 14px; cursor:pointer; white-space:nowrap; }

/* ===== 우상단 세션 볼륨 ===== */
.sv { flex-shrink:0; display:flex; align-items:center; gap:11px; }
.sv-text { text-align:right; }
.sv-text .lbl { font-size:10.5px; font-weight:600; color:var(--ink-4); letter-spacing:0.02em; white-space:nowrap; }
.sv-text .val { margin-top:2px; font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:20px; font-weight:700; color:var(--ink-1); letter-spacing:-0.02em; white-space:nowrap; line-height:1; }
.sv-text .val .u { font-size:11px; font-weight:500; color:var(--ink-4); margin-left:1px; }
.sv-text #cardSessVolPrev { margin-top:4px; font-family:var(--font-mono); font-size:11px; font-weight:500; color:var(--ink-4); white-space:nowrap; }
.sv-text #cardRecordTag { margin-top:3px; font-size:10.5px; font-weight:700; color:var(--crail-deep); white-space:nowrap; opacity:0; display:flex; align-items:center; justify-content:flex-end; gap:3px; }
.sv .ring-wrap { position:relative; width:56px; height:56px; flex-shrink:0; }
.sv .ring-wrap svg { width:56px; height:56px; display:block; }
.sv .ring-center { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:14px; font-weight:700; color:var(--crail-deep); letter-spacing:-0.02em; }

/* ===== 직전 세션 세트바 ===== */
#cardSetDots .seg { flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; min-width:0; cursor:pointer; position:relative; }
#cardSetDots .seg .seg-bar { width:100%; height:9px; border-radius:5px; background:var(--sunken); box-shadow:inset 0 0 0 1.5px var(--line); transition:background .22s, height .22s; transform-origin:bottom center; }
#cardSetDots .seg.done .seg-bar { background:var(--ink-2); box-shadow:none; }
#cardSetDots .seg.now .seg-bar { background:var(--crail-base); box-shadow:none; height:11px; animation:barPulse 1.8s ease-in-out infinite; }
#cardSetDots .seg .seg-n { display:flex; flex-direction:column; align-items:center; line-height:1.05; gap:2px; }
#cardSetDots .seg .seg-n .w { font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:12.5px; font-weight:600; color:var(--ink-3); letter-spacing:-0.02em; }
#cardSetDots .seg .seg-n .r { font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:10px; font-weight:500; color:var(--ink-4); }
#cardSetDots .seg.done .seg-n .w { color:var(--ink-2); }
#cardSetDots .seg.now .seg-n .w { color:var(--crail-deep); font-weight:700; }
#cardSetDots .seg.now .seg-n .r { color:var(--crail-deep); }
/* 확정 플래시 (playSegConfirmFlash WAAPI) */
#cardSetDots .seg .seg-flash { position:absolute; left:0; right:0; top:0; height:2px; border-radius:2px; transform:scaleX(0); transform-origin:left center; opacity:0; background:var(--ink-1); pointer-events:none; }
/* 꾹누른 세트 — crail 선택 링 */
#cardSetDots .seg.held::before { content:""; position:absolute; top:-7px; left:-5px; right:-5px; bottom:-7px; border-radius:10px; box-shadow:0 0 0 2px var(--crail-base); background:var(--crail-tint); z-index:-1; }

/* ===== 히어로 무게×횟수 (옵션 B) ===== */
.hero-weight { font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:122px; font-weight:600; line-height:0.8; color:var(--ink-1); letter-spacing:-0.055em; }
.hero-wunit { font-family:var(--font-sans); font-size:15px; font-weight:600; color:var(--ink-4); letter-spacing:0.02em; margin-top:6px; }
.hero-reps-x { font-family:var(--font-mono); font-size:24px; font-weight:300; color:var(--ink-4); }
.hero-reps { font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:50px; font-weight:400; color:var(--ink-2); letter-spacing:-0.02em; line-height:1; }
.hero-reps-u { font-family:var(--font-sans); font-size:16px; font-weight:500; color:var(--ink-3); }

/* ===== 푸터 운동 전환 ===== */
#sessionFooter { flex-shrink:0; position:relative; padding:14px 0 22px; box-shadow:inset 0 1px 0 var(--line-soft); }
.fp-center-mark { position:absolute; top:0; left:50%; transform:translateX(-50%); width:26px; height:2px; border-radius:0 0 2px 2px; background:var(--crail-base); }
.fp-row { display:flex; align-items:center; padding:14px 14px 0; }
.fp-side { flex:1 1 0; min-width:0; display:flex; align-items:center; gap:10px; overflow:hidden; }
.fp-side.fp-left { justify-content:flex-end; padding-right:12px; -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 30px); mask-image:linear-gradient(90deg,transparent 0,#000 30px); }
.fp-side.fp-right { justify-content:flex-start; padding-left:12px; }
.fp-done { flex-shrink:0; display:inline-flex; align-items:center; gap:5px; font-size:13px; font-weight:500; color:var(--ink-4); white-space:nowrap; cursor:pointer; border:0; background:transparent; font-family:var(--font-sans); padding:0; }
.fp-done svg { color:var(--sage); flex-shrink:0; }
.fp-todo { flex-shrink:0; display:inline-flex; align-items:center; gap:6px; height:38px; padding:0 16px; border-radius:999px; font-size:14px; font-weight:500; color:var(--ink-3); background:var(--card); border:1px solid var(--line); white-space:nowrap; cursor:pointer; font-family:var(--font-sans); }
.fp-now { flex-shrink:0; display:inline-flex; align-items:center; height:46px; padding:0 22px; border-radius:999px; font-size:16px; font-weight:700; letter-spacing:-0.01em; color:#fbf8f2; background:var(--ink-1); white-space:nowrap; cursor:pointer; border:0; font-family:var(--font-sans); box-shadow:0 12px 24px -12px rgba(20,18,14,.6); }
.fp-add { position:absolute; right:14px; bottom:22px; height:46px; z-index:4; width:46px; border-radius:23px; border:1px solid var(--line); background:var(--card); box-shadow:0 0 0 9px var(--shell), var(--shadow-inset-soft); color:var(--ink-3); padding:0; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.fp-fade { position:absolute; bottom:22px; height:46px; width:34px; z-index:2; pointer-events:none; }
.fp-fade.l { left:0; background:linear-gradient(90deg, var(--shell), transparent); }
.fp-fade.r { right:46px; background:linear-gradient(270deg, var(--shell), transparent); }
#sessionFooterPills[data-reorder="1"] .fp-side { overflow:visible; -webkit-mask-image:none; mask-image:none; }

/* ===== 통일 바텀시트 ===== */
.addex-sheet { position:absolute; left:0; right:0; bottom:0; height:66%; background:var(--card); display:flex; flex-direction:column; border-top-left-radius:var(--r-xl); border-top-right-radius:var(--r-xl); padding:14px 0 22px; }
.sheet-handle { flex-shrink:0; width:38px; height:4px; border-radius:2px; background:var(--line); margin:0 auto; }
.addex-chips { flex-shrink:0; display:flex; gap:8px; padding:0 18px; overflow-x:auto; }
.addex-chip { flex-shrink:0; padding:8px 15px; border-radius:999px; font-size:14px; font-weight:500; color:var(--ink-3); border:1px solid var(--line); background:var(--card); cursor:pointer; white-space:nowrap; font-family:var(--font-sans); }
.addex-chip.is-active { background:var(--crail-soft); color:var(--ink-1); font-weight:600; border-color:var(--crail-base); }
.addex-list { flex:1; min-height:0; padding:4px 12px 12px; overflow-y:auto; }
.addex-item { display:flex; align-items:center; justify-content:space-between; width:100%; padding:14px 12px; border-radius:var(--r-md); background:transparent; border:0; cursor:pointer; font-family:inherit; text-align:left; }
.addex-item:active { background:var(--hover-bg); }
.addex-item + .addex-item { box-shadow:inset 0 1px 0 var(--line-soft); }
.addex-item .ex-main { display:flex; align-items:baseline; gap:8px; flex:1; justify-content:space-between; margin-right:12px; min-width:0; }
.addex-item .ex-name { font-size:16px; color:var(--ink-1); font-weight:500; white-space:nowrap; font-family:var(--font-sans); }
.addex-item .ex-meta { font-family:var(--font-mono); font-size:13px; color:var(--ink-4); flex-shrink:0; white-space:nowrap; }
.addex-item .ex-toggle { flex-shrink:0; width:36px; height:22px; background:var(--line); border-radius:11px; position:relative; transition:background .2s; }
.addex-item .ex-toggle::after { content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:9px; background:var(--card); box-shadow:0 1px 2px rgba(20,18,14,.15); transition:transform .16s; }
.addex-item.is-added .ex-toggle { background:var(--crail-base); }
.addex-item.is-added .ex-toggle::after { transform:translateX(14px); }
.addex-empty { padding:24px 14px; text-align:center; font-size:14px; color:var(--ink-4); }

/* 스크롤바 숨김 (터치 PWA) */
#cardSetDots::-webkit-scrollbar, #sessionFooterPills .fp-side::-webkit-scrollbar, #addexChips::-webkit-scrollbar, #sessionAddexChips::-webkit-scrollbar, #addexList::-webkit-scrollbar, #sessionAddexList::-webkit-scrollbar { display:none; width:0; height:0; }
#cardSetDots, #sessionFooterPills .fp-side, #addexChips, #sessionAddexChips, #addexList, #sessionAddexList { scrollbar-width:none; -ms-overflow-style:none; }

/* ===== 키패드 바텀시트 (앱 전용) ===== */
#keypadModeSeg { display:flex; gap:6px; padding:4px; background:var(--sunken); border-radius:var(--r-md); margin:0 auto 14px; width:200px; }
#keypadModeSeg button { flex:1; height:36px; border-radius:var(--r-sm); border:0; background:transparent; cursor:pointer; font-family:var(--font-sans); font-size:14px; font-weight:600; color:var(--ink-3); }
#keypadModeSeg button.on { background:var(--card); color:var(--ink-1); box-shadow:var(--shadow-inset-soft); }
#keypadCaret { width:2px; height:40px; background:var(--crail-base); border-radius:1px; animation:kpcaret 1.1s step-end infinite; align-self:center; }
@keyframes kpcaret { 50% { opacity:0; } }
#keypadRef { margin-top:8px; text-align:center; font-size:12px; font-weight:500; color:var(--ink-4); min-height:15px; }
#keypadRef b { font-family:var(--font-mono); color:var(--crail-deep); font-weight:600; }
#keypadQuick { margin-top:14px; display:flex; gap:8px; justify-content:center; }
#keypadQuick button { padding:7px 13px; border-radius:999px; border:1px solid var(--line); background:var(--card); font-family:var(--font-mono); font-size:13px; font-weight:600; color:var(--ink-2); cursor:pointer; }
#keypadGrid .keypad-key { height:50px; border-radius:var(--r-md); border:0; background:var(--sunken); cursor:pointer; font-family:var(--font-mono); font-size:23px; font-weight:500; color:var(--ink-1); display:flex; align-items:center; justify-content:center; }
#keypadGrid .keypad-key.fn { background:transparent; color:var(--ink-3); font-size:20px; }
/* ===== 액션 시트 (앱 전용) ===== */
#actionItems .action-item { width:100%; height:50px; border-radius:var(--r-md); border:0; background:var(--sunken); cursor:pointer; font-family:var(--font-sans); font-size:16px; font-weight:500; color:var(--ink-1); display:flex; align-items:center; justify-content:center; gap:8px; }
#actionItems .action-item.danger { color:var(--danger); font-weight:600; }
#actionItems .action-confirm { width:100%; height:50px; border-radius:var(--r-md); border:0; background:var(--danger); color:#fff; cursor:pointer; font-family:var(--font-sans); font-size:16px; font-weight:600; display:flex; align-items:center; justify-content:center; }
/* 바텀시트 그림자 — 열렸을 때만 */
#keypadSheet[data-open="true"], #actionSheet[data-open="true"] { box-shadow:0 -20px 50px -18px rgba(20,18,14,0.4); }
#sessionAddexSheet[data-open="true"] { box-shadow:0 -16px 40px -10px rgba(20,18,14,0.18); }
@media (prefers-reduced-motion: reduce) { #keypadCaret { animation:none; } }
</style>
</head>
<body data-state="empty">
<!-- ② 시작 전 (빈 시트) — 구현 레퍼런스 - 세션.html 정합 -->
<div class="phone session-empty" style="background:var(--shell);color:var(--ink-1);">
  <div class="phone-notch"></div>
  <div class="phone-content" style="display:flex;flex-direction:column;">
    <div class="sess-toolbar">
      <button type="button" class="js-session-home home-btn" aria-label="홈"><svg width="19" height="19" viewBox="0 0 20 20" fill="none"><path d="M3 9l7-6 7 6v8a1 1 0 01-1 1h-3v-5h-6v5H4a1 1 0 01-1-1V9z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button>
      <span class="mono" style="justify-self:center;font-size:18px;font-weight:500;color:var(--ink-4);">00:00</span>
      <div class="end kr">종료</div>
    </div>
    <div style="flex-shrink:0;text-align:center;padding:32px 32px 0;">
      <div class="mono" style="font-size:11px;font-weight:600;color:var(--crail-deep);letter-spacing:0.2em;">NEW SESSION</div>
      <div class="kr" style="margin-top:18px;font-size:26px;font-weight:700;color:var(--ink-1);line-height:1.32;letter-spacing:-0.03em;">오늘은 어디부터<br>시작할까요?</div>
    </div>
    <div id="addexSheet" class="addex-sheet" style="box-shadow:0 -16px 40px -18px rgba(20,18,14,0.18);">
      <div class="sheet-handle" style="margin-bottom:16px;"></div>
      <div id="addexChips" class="addex-chips"></div>
      <div id="addexList" class="addex-list" style="margin-top:12px;"></div>
    </div>
  </div>
  <div class="phone-home"></div>
</div>

<!-- ① 진행 중 — 구현 레퍼런스 - 세션.html 정합 -->
<div class="phone session-active" style="background:var(--shell);color:var(--ink-1);">
  <div class="phone-notch"></div>
  <div class="phone-content" style="display:flex;flex-direction:column;">
    <!-- 툴바 -->
    <div class="sess-toolbar">
      <button type="button" class="js-session-home home-btn" aria-label="홈"><svg width="19" height="19" viewBox="0 0 20 20" fill="none"><path d="M3 9l7-6 7 6v8a1 1 0 01-1 1h-3v-5h-6v5H4a1 1 0 01-1-1V9z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button>
      <span class="timer"><span class="sess-live" style="width:6px;height:6px;border-radius:50%;background:var(--crail-base);"></span><span id="sessionTime" class="mono" style="font-size:18px;font-weight:500;color:var(--ink-2);">18:42</span></span>
      <div id="sessionEndBtn" data-longpress="session-end" class="end kr">종료</div>
    </div>
    <!-- 타이틀 + 세션 볼륨 게이지 -->
    <div style="flex-shrink:0;padding:10px 24px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:18px;">
      <div style="min-width:0;">
        <div id="cardExName" class="kr" style="font-size:25px;font-weight:700;color:var(--ink-1);letter-spacing:-0.02em;white-space:nowrap;">벤치프레스</div>
        <div id="cardExPart" class="kr" style="margin-top:4px;font-size:12.5px;font-weight:500;color:var(--ink-4);white-space:nowrap;">가슴</div>
      </div>
      <div class="sv">
        <div class="sv-text">
          <div class="lbl kr">세션 볼륨</div>
          <div class="val mono"><span id="cardSetProgress">1,380</span><span class="u">kg</span></div>
          <div id="cardSessVolPrev">직전 2,940kg</div>
          <div id="cardRecordTag" class="mono"><span class="arw" style="font-size:8px;">▲</span> 신기록</div>
        </div>
        <div class="ring-wrap">
          <svg viewBox="0 0 40 40" aria-hidden="true">
            <circle cx="20" cy="20" r="16" fill="none" stroke-width="5" style="stroke:var(--line);"></circle>
            <circle id="cardVolRingPulse" cx="20" cy="20" r="16" fill="none" stroke-width="5" style="stroke:var(--crail-base);opacity:0;transform-box:fill-box;transform-origin:center;"></circle>
            <circle id="cardVolRingFill" cx="20" cy="20" r="16" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="100.53" stroke-dashoffset="53" style="stroke:var(--crail-base);transform:rotate(-90deg);transform-box:fill-box;transform-origin:center;transition:stroke-dashoffset 620ms cubic-bezier(.2,.7,.2,1);"></circle>
          </svg>
          <div id="cardVolRingPct" class="ring-center">47%</div>
        </div>
      </div>
    </div>
    <!-- 직전 세션 세트바 -->
    <div style="flex-shrink:0;padding:16px 24px 0;">
      <div class="kr" style="font-size:11px;font-weight:600;color:var(--ink-4);letter-spacing:0.04em;margin-bottom:10px;">직전 세션 기록</div>
      <div id="cardSetDots" class="mono" style="display:flex;gap:7px;align-items:flex-end;"></div>
    </div>
    <!-- PR 팝 (transient) -->
    <div id="cardPrPop" class="mono" style="position:absolute;top:218px;left:0;right:0;text-align:center;font-weight:600;color:var(--crail-deep);font-size:22px;letter-spacing:0.04em;opacity:0;transform:translateY(0);transition:opacity 220ms ease, transform 700ms ease;pointer-events:none;z-index:5;">PR</div>
    <!-- 히어로 -->
    <div id="cardSwipeArea" data-longpress="active-card" data-card-kind="weight" style="flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 26px;touch-action:pan-y;user-select:none;-webkit-user-select:none;">
      <div id="completeReveal" style="position:absolute;right:22px;top:50%;transform:translateY(-50%) translateX(14px) scale(0.9);display:flex;align-items:center;gap:7px;padding:7px 14px 7px 11px;border-radius:999px;background:var(--crail-soft);border:1px solid var(--crail-base);color:var(--crail-deep);font-size:13px;font-weight:600;opacity:0;pointer-events:none;z-index:4;white-space:nowrap;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>완료</div>
      <div id="hapticRing" aria-hidden="true" style="position:absolute;left:50%;top:50%;width:118px;height:118px;border-radius:50%;border:2px solid var(--crail-base);opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(0.4);z-index:6;"></div>
      <div id="cardHeroVals" style="position:relative;width:100%;display:flex;flex-direction:column;align-items:center;will-change:transform;">
        <div id="cardWeightZone" style="width:100%;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;">
          <div id="cardWeight" class="hero-weight">65</div>
          <div id="cardWeightUnit" class="hero-wunit kr">kg</div>
        </div>
        <div id="cardRepsZone" style="width:100%;margin-top:18px;display:flex;align-items:baseline;justify-content:center;gap:9px;cursor:pointer;padding:6px 0;">
          <span class="hero-reps-x">×</span>
          <span id="cardReps" class="hero-reps">10</span>
          <span id="cardRepsUnit" class="hero-reps-u kr">회</span>
        </div>
        <div id="cardDoneLabel" class="kr" style="display:none;margin-top:18px;text-align:center;font-size:13px;font-weight:600;letter-spacing:0.14em;color:var(--sage);">5세트 완료</div>
        <div id="cardPaceZone" class="mono" style="display:none;margin-top:10px;text-align:center;font-size:15px;color:var(--crail-deep);letter-spacing:0.04em;"></div>
        <div id="cardPrChip" style="position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:18px;display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--crail-soft);border:1px solid var(--crail-base);opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap;"><span style="color:var(--crail-deep);font-size:9px;line-height:1;">▲</span><span id="cardPrChipVal" class="mono" style="font-size:13px;font-weight:600;color:var(--ink-1);">+5kg</span></div>
      </div>
    </div>
    <!-- 이 종목 볼륨 -->
    <div style="flex-shrink:0;padding:0 26px;">
      <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px;">
        <span class="kr" style="font-size:11px;font-weight:600;color:var(--ink-4);letter-spacing:0.02em;white-space:nowrap;">이 종목 볼륨</span>
        <span class="mono" style="font-size:13px;font-weight:500;color:var(--ink-3);white-space:nowrap;"><span id="cardProgressVol">600 / 720kg</span><span id="cardProgressPct" style="display:none;"></span></span>
      </div>
      <div class="vol-track" style="height:11px;border-radius:6px;background:var(--sunken);position:relative;box-shadow:var(--shadow-inset-soft);margin-bottom:22px;">
        <div id="cardProgressBar" style="position:absolute;left:0;top:0;height:100%;width:83%;background:var(--crail-base);border-radius:6px;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,0.32),0 2px 5px -1px oklch(67% 0.12 50 / .45);transition:width 620ms cubic-bezier(.2,.7,.2,1);"><span class="vbar-shimmer" style="position:absolute;top:0;bottom:0;left:0;width:42%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.55),transparent);"></span></div>
        <span id="volEdge" style="position:absolute;left:83%;top:50%;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);background:#fff;box-shadow:0 0 0 3px var(--crail-base),0 0 12px 3px oklch(67% 0.12 50 / .6);transition:left 620ms cubic-bezier(.2,.7,.2,1);z-index:3;"></span>
        <div id="volGoal" style="position:absolute;top:-3px;right:0;height:17px;width:2px;border-radius:1px;background:var(--ink-4);z-index:2;"></div>
        <div id="volBurst" style="position:absolute;top:50%;right:0;width:12px;height:12px;border-radius:50%;transform:translate(50%,-50%) scale(0.4);border:2px solid var(--crail-base);opacity:0;pointer-events:none;z-index:1;"></div>
        <div id="volMarkCap" class="mono" style="position:absolute;top:15px;right:0;font-size:9px;font-weight:600;letter-spacing:0.03em;color:var(--ink-4);white-space:nowrap;">직전 기록</div>
        <div id="volBreak" class="kr" style="position:absolute;right:0;top:14px;display:flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--crail-deep);white-space:nowrap;opacity:0;pointer-events:none;"><span>직전 기록 돌파</span> <b id="volBreakAmt" class="mono">+0kg</b></div>
      </div>
    </div>
    <!-- 푸터 운동 전환 -->
    <div id="sessionFooter">
      <div class="fp-center-mark"></div>
      <div id="sessionFooterPills" class="kr fp-row"></div>
      <div class="fp-fade l"></div>
      <div class="fp-fade r"></div>
      <button id="sessionAddexBtn" type="button" class="fp-add" aria-label="운동 추가"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
    </div>
    <!-- 키패드 바텀시트 (앱 전용) -->
    <div id="keypadBackdrop" data-open="false" style="position:absolute;inset:0;z-index:79;background:oklch(22% 0.008 60 / 0.42);opacity:0;pointer-events:none;transition:opacity 200ms ease;"></div>
    <div id="keypadSheet" data-open="false" data-mode="weight" data-buf="" style="position:absolute;left:0;right:0;bottom:0;z-index:80;background:var(--card);border-top-left-radius:var(--r-xl);border-top-right-radius:var(--r-xl);padding:12px 20px 24px;transform:translateY(100%);transition:transform 200ms ease;touch-action:none;">
      <div style="width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px;"></div>
      <div id="keypadModeSeg"><button type="button" data-kpmode="weight" class="on">무게</button><button type="button" data-kpmode="reps">횟수</button></div>
      <div style="display:flex;align-items:baseline;justify-content:center;gap:8px;">
        <div id="keypadValue" class="mono" style="font-size:52px;font-weight:500;color:var(--ink-1);letter-spacing:-0.03em;line-height:1;text-align:right;">0</div>
        <span id="keypadCaret"></span>
        <div id="keypadUnit" class="mono" style="font-size:17px;font-weight:500;color:var(--ink-4);">kg</div>
      </div>
      <div id="keypadRef" class="kr"></div>
      <div id="keypadQuick"><button type="button" data-kpdelta="-2.5">−2.5</button><button type="button" data-kpdelta="2.5">+2.5</button><button type="button" data-kpdelta="5">+5</button></div>
      <div id="keypadGrid" style="margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
        <button class="keypad-key" data-key="1" type="button">1</button><button class="keypad-key" data-key="2" type="button">2</button><button class="keypad-key" data-key="3" type="button">3</button>
        <button class="keypad-key" data-key="4" type="button">4</button><button class="keypad-key" data-key="5" type="button">5</button><button class="keypad-key" data-key="6" type="button">6</button>
        <button class="keypad-key" data-key="7" type="button">7</button><button class="keypad-key" data-key="8" type="button">8</button><button class="keypad-key" data-key="9" type="button">9</button>
        <button class="keypad-key fn" data-key="." type="button">.</button><button class="keypad-key" data-key="0" type="button">0</button><button class="keypad-key fn" data-key="del" type="button" aria-label="지우기">⌫</button>
      </div>
      <button id="keypadDone" type="button" class="kr" style="margin-top:12px;width:100%;height:52px;border-radius:var(--r-md);background:var(--ink-1);color:#fbf8f2;font-size:16px;font-weight:600;border:0;cursor:pointer;box-shadow:0 8px 20px -12px rgba(20,18,14,0.5);">완료</button>
    </div>
    <!-- 액션 시트 (앱 전용) -->
    <div id="actionBackdrop" data-open="false" style="position:absolute;inset:0;z-index:90;background:oklch(22% 0.008 60 / 0.42);opacity:0;pointer-events:none;transition:opacity 200ms ease;"></div>
    <div id="actionSheet" data-open="false" data-kind="" style="position:absolute;left:0;right:0;bottom:0;z-index:91;background:var(--card);border-top-left-radius:var(--r-xl);border-top-right-radius:var(--r-xl);padding:12px 16px 24px;transform:translateY(100%);transition:transform 200ms ease;touch-action:none;">
      <div style="width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px;"></div>
      <div id="actionTitle" class="kr" style="font-size:14px;color:var(--ink-3);text-align:center;margin-bottom:14px;font-weight:600;white-space:nowrap;">메뉴</div>
      <div id="actionItems" style="display:flex;flex-direction:column;gap:6px;"></div>
      <button id="actionCancel" type="button" class="kr" style="margin-top:14px;width:100%;height:48px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--line);color:var(--ink-3);font-size:15px;font-weight:600;cursor:pointer;">취소</button>
    </div>
    <!-- 운동 추가 바텀시트 (모달, 앱 전용) — ③ 추가 시트와 동일 .addex-sheet -->
    <div id="sessionAddexBackdrop" data-open="false" style="position:absolute;inset:0;z-index:69;background:oklch(22% 0.008 60 / 0.32);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity 200ms ease;"></div>
    <div id="sessionAddexSheet" class="addex-sheet" data-open="false" style="z-index:70;transform:translateY(100%);transition:transform 200ms ease;">
      <div class="sheet-handle" style="margin-bottom:16px;"></div>
      <div id="sessionAddexChips" class="addex-chips"></div>
      <div id="sessionAddexList" class="addex-list" style="margin-top:12px;"></div>
    </div>
  </div>
  <div class="phone-home"></div>
</div>
</body>
</html>
