<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0a08">
<title>Gym · 세션 (v2 · SessionEmpty + SessionC)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf9f5; --bg-warm: #f3efe6; --bg-deep: #ece7db;
  --surface: #ffffff; --surface-2: #f7f4ec;
  --ink: #1a1714; --ink-strong: #0c0a08;
  --ink-2: #5a544a; --ink-muted: #8d8678; --ink-faint: #c4beb1;
  --line: #e6e1d4; --line-soft: #efeae0;
  --accent: #d97757; --accent-soft: #ecb59f; --accent-deep: #b85a3e; --accent-tint: #fbe9df;
  --sage: #788c5d; --sage-soft: #c0c9aa; --night: #1f1c18;
  --r-xl: 22px; --r-lg: 16px; --r-md: 12px; --r-sm: 8px;
  --shadow-card: 0 1px 2px rgba(28,22,16,.04), 0 8px 24px -8px rgba(28,22,16,.08);
  --shadow-lift: 0 32px 64px -12px rgba(217,119,87,.22), 0 12px 28px -10px rgba(28,22,16,.18);
  --font-display: "Poppins", "SF Pro Display", -apple-system, system-ui, sans-serif;
  --font-body: "Noto Sans KR", -apple-system, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", monospace;
}
* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
body { margin: 0; min-height: 100vh; background: var(--bg-deep); display: flex; align-items: center; justify-content: center; padding: 24px; font-family: var(--font-body); color: var(--ink); }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.kr { font-family: var(--font-body); }
.phone { width: 360px; height: 740px; border-radius: 38px; position: relative; overflow: hidden; box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 30px 60px -20px rgba(28,22,16,.18), 0 0 0 1px rgba(28,22,16,.06); font-family: var(--font-body); color: var(--ink); }
.phone-notch { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 102px; height: 30px; border-radius: 20px; background: #0c0a08; z-index: 50; }
.phone-clock { position: absolute; top: 16px; left: 24px; z-index: 49; font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: -0.01em; color: var(--ink-strong); }
.phone-batt { position: absolute; top: 16px; right: 24px; z-index: 49; display: flex; gap: 5px; align-items: center; color: var(--ink-strong); }
.phone-batt-cell { width: 16px; height: 10px; border-radius: 2px; border: 1.2px solid currentColor; position: relative; }
.phone-batt-cell::after { content: ""; position: absolute; inset: 1.5px; background: currentColor; border-radius: 1px; display: block; }
.phone-content { position: absolute; inset: 0; padding-top: 54px; padding-bottom: 24px; }
.phone-home { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 120px; height: 4px; border-radius: 100px; z-index: 60; background: rgba(0,0,0,.22); }
.phone.dark { color: #f3efe6; }
.phone.dark .phone-clock, .phone.dark .phone-batt { color: #f3efe6; }
.phone.dark .phone-home { background: rgba(255,255,255,.32); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

/* SessionEmpty / SessionActive 가시성 토글 (home.html HomeA/HomeC 패턴 답습) */
[data-state="empty"] .session-active { display: none; }
[data-state="active"] .session-empty { display: none; }
/* §6-2 — 운동 추가 시트 chip / item (session.js renderChips/List 출력 마크업 정합, 시안 inline 다크 톤 답습) */
.addex-chip { flex-shrink: 0; padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 400; font-family: var(--font-body); background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.08); cursor: pointer; }
.addex-chip.is-active { background: var(--accent); color: #fff; font-weight: 600; border: 0; }
.addex-item { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 13px 14px; border-radius: 12px; background: transparent; border: 0; cursor: pointer; font-family: inherit; color: #fff; text-align: left; }
.addex-item .ex-main { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.addex-item .ex-name { font-size: 14px; color: #fff; font-weight: 500; font-family: var(--font-body); }
.addex-item .ex-meta { font-size: 11px; color: rgba(255,255,255,0.45); font-family: var(--font-display); }
.addex-item .ex-toggle { flex-shrink: 0; width: 36px; height: 22px; background: rgba(255,255,255,0.12); border-radius: 11px; position: relative; transition: background 200ms ease; }
.addex-item .ex-toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 9px; background: #fff; transition: transform 160ms ease; }
.addex-item.is-added .ex-toggle { background: var(--accent); }
.addex-item.is-added .ex-toggle::after { transform: translateX(14px); }
.addex-empty { padding: 24px 14px; text-align: center; font-size: 12px; color: rgba(255,255,255,0.4); }
</style>
</head>
<body data-state="empty">
<!-- SessionEmpty — active 세션 부재 -->
<div class="phone dark session-empty" style="background:#0c0a08;">
  <div class="phone-notch"></div>
  <div class="phone-content">
    <!-- SessionHeader (running=false, time=00:00) -->
    <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 22px;height:44px;">
      <div style="display:flex;align-items:center;">
        <button type="button" class="js-session-home" style="width:36px;height:36px;border-radius:10px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 9l7-6 7 6v8a1 1 0 01-1 1h-3v-5h-6v5H4a1 1 0 01-1-1V9z" stroke="rgba(255,255,255,0.6)" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div style="display:flex;align-items:center;gap:8px;justify-content:center;">
        <span class="num" style="font-size:28px;font-weight:300;letter-spacing:-0.02em;color:#fff;">00:00</span>
      </div>
      <div style="text-align:right;font-size:12px;color:rgba(255,255,255,0.6);" class="kr">종료</div>
    </div>
    <!-- 빈 메시지 -->
    <div style="position:absolute;top:130px;left:0;right:0;text-align:center;padding:0 32px;">
      <div class="kr" style="font-size:11px;color:rgba(243,239,230,0.4);letter-spacing:0.16em;font-weight:600;">NEW SESSION</div>
      <div class="kr" style="margin-top:18px;font-size:24px;color:#fff;font-weight:300;line-height:1.4;letter-spacing:-0.02em;">오늘은 어디부터<br>시작할까요?</div>
      <div class="kr" style="margin-top:14px;font-size:12px;color:rgba(243,239,230,0.45);">아래에서 종목을 추가하세요</div>
    </div>
    <!-- 하단 시트 -->
    <div id="addexSheet" style="position:absolute;left:0;right:0;bottom:0;background:#15120e;border-top-left-radius:22px;border-top-right-radius:22px;padding:12px 0 24px;box-shadow:0 -16px 40px -10px rgba(0,0,0,0.35);">
      <div style="width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,0.18);margin:0 auto 14px;"></div>
      <div id="addexChips" style="display:flex;gap:8px;padding:0 16px;overflow-x:auto;justify-content:center;">
        <div class="kr" data-part="chest" style="flex-shrink:0;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;background:var(--accent);color:#fff;border:0;cursor:pointer;">가슴</div>
        <div class="kr" data-part="back" style="flex-shrink:0;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:400;background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.08);cursor:pointer;">등</div>
        <div class="kr" data-part="shoulder" style="flex-shrink:0;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:400;background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.08);cursor:pointer;">어깨</div>
        <div class="kr" data-part="legs" style="flex-shrink:0;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:400;background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.08);cursor:pointer;">하체</div>
        <div class="kr" data-part="arms" style="flex-shrink:0;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:400;background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.08);cursor:pointer;">팔</div>
        <div class="kr" data-part="cardio" style="flex-shrink:0;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:400;background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.08);cursor:pointer;">유산소</div>
      </div>
      <div id="addexList" style="margin-top:14px;padding:0 8px;">
        <div class="addex-item" data-ex="bench_press" style="display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-radius:12px;cursor:pointer;">
          <div class="kr" style="font-size:14px;color:#fff;font-weight:500;">벤치프레스</div>
          <div class="num" style="font-size:11px;color:rgba(255,255,255,0.45);">60kg × 10회</div>
        </div>
        <div class="addex-item" data-ex="incline_bench" style="display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-radius:12px;cursor:pointer;">
          <div class="kr" style="font-size:14px;color:#fff;font-weight:500;">인클라인 벤치</div>
          <div class="num" style="font-size:11px;color:rgba(255,255,255,0.45);">45kg × 10회</div>
        </div>
        <div class="addex-item" data-ex="decline_bench" style="display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-radius:12px;cursor:pointer;">
          <div class="kr" style="font-size:14px;color:#fff;font-weight:500;">디클라인 벤치</div>
          <div class="num" style="font-size:11px;color:rgba(255,255,255,0.45);">50kg × 10회</div>
        </div>
        <div class="addex-item" data-ex="dumbbell_fly" style="display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-radius:12px;cursor:pointer;">
          <div class="kr" style="font-size:14px;color:#fff;font-weight:500;">덤벨 플라이</div>
          <div class="num" style="font-size:11px;color:rgba(255,255,255,0.45);">18kg × 12회</div>
        </div>
        <div class="addex-item" data-ex="cable_crossover" style="display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-radius:12px;cursor:pointer;">
          <div class="kr" style="font-size:14px;color:#fff;font-weight:500;">케이블 크로스오버</div>
          <div class="num" style="font-size:11px;color:rgba(255,255,255,0.45);">20kg × 12회</div>
        </div>
      </div>
    </div>
  </div>
  <div class="phone-home"></div>
</div>
<!-- SessionC — active 세션 진행 중 (SET 03/05 진행 카드) -->
<div class="phone dark session-active" style="background:#0c0a08;">
  <div class="phone-notch"></div>
  <div class="phone-content">
    <!-- SessionHeader (running=true, time=18:42) -->
    <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 22px;height:44px;">
      <div style="display:flex;align-items:center;">
        <button type="button" class="js-session-home" style="width:36px;height:36px;border-radius:10px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 9l7-6 7 6v8a1 1 0 01-1 1h-3v-5h-6v5H4a1 1 0 01-1-1V9z" stroke="rgba(255,255,255,0.6)" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div style="display:flex;align-items:center;gap:8px;justify-content:center;">
        <span style="width:6px;height:6px;border-radius:3px;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:pulse 1.6s ease-in-out infinite;"></span>
        <span id="sessionTime" class="num" style="font-size:28px;font-weight:300;letter-spacing:-0.02em;color:#fff;">18:42</span>
      </div>
      <div id="sessionEndBtn" data-longpress="session-end" style="text-align:right;font-size:12px;color:rgba(255,255,255,0.6);cursor:pointer;" class="kr">종료</div>
    </div>
    <!-- 운동명 + 세트 -->
    <div style="padding:16px 24px 0;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;">
        <div id="cardExName" class="kr" style="font-size:14px;color:#fff;font-weight:500;">벤치프레스</div>
        <div id="cardSetProgress" class="num" style="font-size:11px;color:rgba(255,255,255,0.45);letter-spacing:0.1em;">SET 03 / 05</div>
      </div>
    </div>
    <!-- §6-11 — PR 팝 (accent 텍스트 1초 페이드아웃, DOM 한 번 + opacity/transform 토글) -->
    <!-- top:170px — 운동명 row (114~138px) 아래, 메인 카드 시작 부근. translateY(-12px) 적용 시 ~158px. -->
    <div id="cardPrPop" class="num" style="position:absolute;top:170px;left:0;right:0;text-align:center;font-weight:500;color:var(--accent);font-size:22px;letter-spacing:0.06em;opacity:0;transform:translateY(0);transition:opacity 220ms ease, transform 700ms ease;pointer-events:none;z-index:5;">PR</div>
    <!-- 메인 영역 (spec §6-3-1 — 좌/우 스와이프 hit area, touch-action: pan-y / §6-9 — 진행 중 운동 카드 hold) -->
    <div id="cardSwipeArea" data-longpress="active-card" style="position:absolute;top:150px;left:0;right:0;padding:0 24px;touch-action:pan-y;user-select:none;-webkit-user-select:none;">
      <div style="display:flex;align-items:center;justify-content:center;gap:12px;">
        <span style="font-size:14px;color:rgba(255,255,255,0.3);">←</span>
        <div id="cardPrevSet" class="num" style="font-size:16px;color:rgba(255,255,255,0.35);letter-spacing:0.04em;">55kg × 9</div>
      </div>
      <div id="cardWeightZone" style="margin-top:14px;text-align:center;cursor:pointer;">
        <div id="cardWeight" class="num" style="font-size:132px;font-weight:200;line-height:1;color:#fff;letter-spacing:-0.05em;">60</div>
        <div class="kr" style="margin-top:-2px;font-size:13px;color:rgba(255,255,255,0.5);">킬로그램</div>
      </div>
      <div id="cardRepsZone" style="margin-top:22px;display:flex;justify-content:center;align-items:center;gap:16px;cursor:pointer;">
        <div style="flex:1;height:1px;background:rgba(255,255,255,0.1);"></div>
        <div style="display:flex;align-items:baseline;gap:4px;">
          <span id="cardReps" class="num" style="font-size:48px;font-weight:300;color:#fff;">10</span>
          <span class="kr" style="font-size:12px;color:rgba(255,255,255,0.45);">회</span>
        </div>
        <div style="flex:1;height:1px;background:rgba(255,255,255,0.1);"></div>
      </div>
      <div id="cardSetDots" class="num" style="margin-top:26px;display:flex;justify-content:center;gap:22px;">
        <div data-set-idx="0" style="text-align:center;color:rgba(255,255,255,0.55);font-weight:400;">
          <div style="font-size:10px;letter-spacing:0.06em;">S1</div>
          <div style="font-size:13px;margin-top:4px;">60·12</div>
        </div>
        <div data-set-idx="1" style="text-align:center;color:rgba(255,255,255,0.55);font-weight:400;">
          <div style="font-size:10px;letter-spacing:0.06em;">S2</div>
          <div style="font-size:13px;margin-top:4px;">60·11</div>
        </div>
        <div data-set-idx="2" style="text-align:center;color:var(--accent);font-weight:600;">
          <div style="font-size:10px;letter-spacing:0.06em;">S3</div>
          <div style="font-size:13px;margin-top:4px;">60·10</div>
        </div>
        <div data-set-idx="3" style="text-align:center;color:rgba(255,255,255,0.25);font-weight:400;">
          <div style="font-size:10px;letter-spacing:0.06em;">S4</div>
          <div style="font-size:13px;margin-top:4px;">—</div>
        </div>
        <div data-set-idx="4" style="text-align:center;color:rgba(255,255,255,0.25);font-weight:400;">
          <div style="font-size:10px;letter-spacing:0.06em;">S5</div>
          <div style="font-size:13px;margin-top:4px;">—</div>
        </div>
      </div>
      <div style="margin-top:14px;height:2px;background:rgba(255,255,255,0.08);position:relative;">
        <div id="cardProgressBar" style="width:20%;height:100%;background:var(--accent);"></div>
      </div>
      <div class="num" style="margin-top:8px;display:flex;justify-content:space-between;">
        <span id="cardProgressVol" style="font-size:10px;color:var(--accent);">600 / 3,000kg</span>
        <span id="cardProgressPct" style="font-size:10px;color:rgba(255,255,255,0.4);">20%</span>
      </div>
    </div>
    <!-- SessionFooter — pill 들은 (f-5-1) renderFooterPills 가 동적 렌더 (active session blocks 기반) -->
    <div id="sessionFooter" style="position:absolute;bottom:24px;left:0;right:0;padding:12px 16px 4px;display:flex;align-items:center;gap:14px;overflow:hidden;border-top:1px solid rgba(255,255,255,0.06);justify-content:center;">
      <div id="sessionFooterPills" class="kr" style="display:flex;gap:18px;align-items:center;flex:1;overflow-x:auto;scroll-behavior:smooth;padding-inline:50%;"></div>
      <button id="sessionAddexBtn" type="button" style="width:36px;height:36px;border-radius:18px;border:1.4px solid rgba(217,119,87,0.45);background:transparent;color:var(--accent);font-size:18px;font-weight:300;line-height:1;padding:0;flex-shrink:0;cursor:pointer;">+</button>
    </div>
    <!-- §6-3-2 / §6-10 — 키패드 바텀시트 (DOM 한 번 생성, transform 토글) -->
    <div id="keypadBackdrop" data-open="false" style="position:absolute;inset:0;z-index:79;background:rgba(0,0,0,0.45);opacity:0;pointer-events:none;transition:opacity 200ms ease;"></div>
    <div id="keypadSheet" data-open="false" data-mode="weight" data-buf="" style="position:absolute;left:0;right:0;bottom:0;z-index:80;background:#15120e;border-top-left-radius:22px;border-top-right-radius:22px;padding:14px 16px 24px;box-shadow:0 -16px 40px -10px rgba(0,0,0,0.45);transform:translateY(100%);transition:transform 200ms ease;touch-action:none;">
      <div style="width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,0.18);margin:0 auto 14px;"></div>
      <div style="display:flex;align-items:baseline;justify-content:center;gap:6px;margin-bottom:14px;">
        <div id="keypadValue" class="num" style="font-size:36px;font-weight:300;color:#fff;letter-spacing:-0.02em;min-width:80px;text-align:right;">0</div>
        <div id="keypadUnit" class="kr" style="font-size:13px;color:rgba(255,255,255,0.5);">kg</div>
      </div>
      <div id="keypadGrid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
        <button class="keypad-key kr" data-key="1" type="button" style="height:48px;border-radius:10px;background:rgba(255,255,255,0.06);border:0;color:#fff;font-family:var(--font-display);font-size:20px;font-weight:300;cursor:pointer;">1</button>
        <button class="keypad-key kr" data-key="2" type="button" style="height:48px;border-radius:10px;background:rgba(255,255,255,0.06);border:0;color:#fff;font-family:var(--font-display);font-size:20px;font-weight:300;cursor:pointer;">2</button>
        <button class="keypad-key kr" data-key="3" type="button" style="height:48px;border-radius:10px;background:rgba(255,255,255,0.06);border:0;color:#fff;font-family:var(--font-display);font-size:20px;font-weight:300;cursor:pointer;">3</button>
        <button class="keypad-key kr" data-key="4" type="button" style="height:48px;border-radius:10px;background:rgba(255,255,255,0.06);border:0;color:#fff;font-family:var(--font-display);font-size:20px;font-weight:300;cursor:pointer;">4</button>
        <button class="keypad-key kr" data-key="5" type="button" style="height:48px;border-radius:10px;background:rgba(255,255,255,0.06);border:0;color:#fff;font-family:var(--font-display);font-size:20px;font-weight:300;cursor:pointer;">5</button>
        <button class="keypad-key kr" data-key="6" type="button" style="height:48px;border-radius:10px;background:rgba(255,255,255,0.06);border:0;color:#fff;font-family:var(--font-display);font-size:20px;font-weight:300;cursor:pointer;">6</button>
        <button class="keypad-key kr" data-key="7" type="button" style="height:48px;border-radius:10px;background:rgba(255,255,255,0.06);border:0;color:#fff;font-family:var(--font-display);font-size:20px;font-weight:300;cursor:pointer;">7</button>
        <button class="keypad-key kr" data-key="8" type="button" style="height:48px;border-radius:10px;background:rgba(255,255,255,0.06);border:0;color:#fff;font-family:var(--font-display);font-size:20px;font-weight:300;cursor:pointer;">8</button>
        <button class="keypad-key kr" data-key="9" type="button" style="height:48px;border-radius:10px;background:rgba(255,255,255,0.06);border:0;color:#fff;font-family:var(--font-display);font-size:20px;font-weight:300;cursor:pointer;">9</button>
        <button class="keypad-key kr" data-key="." type="button" style="height:48px;border-radius:10px;background:rgba(255,255,255,0.06);border:0;color:#fff;font-family:var(--font-display);font-size:20px;font-weight:300;cursor:pointer;">.</button>
        <button class="keypad-key kr" data-key="0" type="button" style="height:48px;border-radius:10px;background:rgba(255,255,255,0.06);border:0;color:#fff;font-family:var(--font-display);font-size:20px;font-weight:300;cursor:pointer;">0</button>
        <button class="keypad-key kr" data-key="del" type="button" style="height:48px;border-radius:10px;background:rgba(255,255,255,0.06);border:0;color:rgba(255,255,255,0.7);font-size:18px;cursor:pointer;">⌫</button>
      </div>
      <button id="keypadDone" type="button" class="kr" style="margin-top:12px;width:100%;height:44px;border-radius:12px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;border:0;cursor:pointer;">완료</button>
    </div>
    <!-- §6-9 / §6-10 — 액션 시트 (꾹누르기 메뉴, DOM 한 번 + transform 토글) -->
    <div id="actionBackdrop" data-open="false" style="position:absolute;inset:0;z-index:90;background:rgba(0,0,0,0.5);opacity:0;pointer-events:none;transition:opacity 200ms ease;"></div>
    <div id="actionSheet" data-open="false" data-kind="" style="position:absolute;left:0;right:0;bottom:0;z-index:91;background:#15120e;border-top-left-radius:22px;border-top-right-radius:22px;padding:14px 16px 24px;box-shadow:0 -16px 40px -10px rgba(0,0,0,0.45);transform:translateY(100%);transition:transform 200ms ease;touch-action:none;">
      <div style="width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,0.18);margin:0 auto 14px;"></div>
      <div id="actionTitle" class="kr" style="font-size:13px;color:rgba(255,255,255,0.55);text-align:center;margin-bottom:14px;font-weight:500;">메뉴</div>
      <div id="actionItems" style="display:flex;flex-direction:column;gap:6px;"></div>
      <button id="actionCancel" type="button" class="kr" style="margin-top:14px;width:100%;height:44px;border-radius:12px;background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.85);font-size:14px;font-weight:500;border:0;cursor:pointer;">취소</button>
    </div>
    <!-- §6-2 / §6-10 — 운동 추가 바텀시트 (DOM 한 번 + transform 토글, active 분기 전용). 시트가 active 카드 위에 슬라이드업. -->
    <div id="sessionAddexBackdrop" data-open="false" style="position:absolute;inset:0;z-index:69;background:rgba(0,0,0,0.45);opacity:0;pointer-events:none;transition:opacity 200ms ease;"></div>
    <div id="sessionAddexSheet" data-open="false" style="position:absolute;left:0;right:0;bottom:0;z-index:70;background:#15120e;border-top-left-radius:22px;border-top-right-radius:22px;padding:12px 0 24px;box-shadow:0 -16px 40px -10px rgba(0,0,0,0.35);transform:translateY(100%);transition:transform 200ms ease;">
      <div style="width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,0.18);margin:0 auto 14px;"></div>
      <div id="sessionAddexChips" style="display:flex;gap:8px;padding:0 16px;overflow-x:auto;justify-content:center;"></div>
      <div id="sessionAddexList" style="margin-top:14px;padding:0 8px;height:280px;overflow-y:auto;"></div>
    </div>
  </div>
  <div class="phone-home"></div>
</div>
</body>
