<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0a08">
<title>Gym · 세션 (v2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 구현 레퍼런스 - 세션.html 정합 (0px). 토큰은 paper.css 와 동일. */
:root { --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:22px;
  --font-display:"Space Grotesk",ui-monospace,monospace; }
* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
body { margin: 0; min-height: 100vh; background: oklch(93.5% 0.007 60); display: flex; align-items: center; justify-content: center; padding: 24px; font-family: var(--font-sans); color: var(--ink-1); }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.kr { font-family: var(--font-sans); }
.phone { width: 360px; height: 760px; border-radius: 40px; position: relative; overflow: hidden; background: var(--shell); color: var(--ink-1); font-family: var(--font-sans); box-shadow: 0 0 0 1px oklch(88% 0.006 60), 0 2px 2px rgba(20,18,14,.04), 0 44px 80px -28px rgba(20,18,14,.32); }
.phone-notch { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 100px; height: 28px; border-radius: 16px; background: #111; z-index: 50; }
.phone-content { position: absolute; inset: 0; padding-top: 50px; }
.phone-home { position: absolute; bottom: 9px; left: 50%; transform: translateX(-50%); width: 124px; height: 5px; border-radius: 100px; z-index: 60; background: rgba(0,0,0,.18); }
[data-state="empty"] .session-active { display: none; }
[data-state="active"] .session-empty { display: none; }

@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
/* 시안 gBarPulse (짐앱_작업지시서 167행) — 6px / 0.22. 네이티브 PrevRecordBars.segGlowIf 와 동일. */
@keyframes barPulse { 0%,100% { box-shadow: 0 0 0 0 oklch(67% 0.12 50 / 0); } 50% { box-shadow: 0 0 0 6px oklch(67% 0.12 50 / 0.22); } }
.sess-live { animation: pulse 1.8s ease-in-out infinite; }
#cardSessTotalWrap.struck { text-decoration: line-through; opacity: 0.55; }
@keyframes ringPulse { 0% { opacity: 0.5; transform: scale(1); } 70%,100% { opacity: 0; transform: scale(1.34); } }
#cardVolRingPulse.is-record { animation: ringPulse 1.6s ease-out infinite; }
/* 중앙 종목 세그먼트 링 · 돌파 모션 (작업지시서 §5 · §6 — 시안 #7b 이식) */
@keyframes gRingDraw { from { stroke-dashoffset: 100.53; } to { stroke-dashoffset: 0; } }   /* r=16 풀링 완성 스윕 */
@keyframes gTipPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.55); } }    /* 에메랄드 팁 도트 */
@keyframes gPop2 { from { opacity: 0; transform: scale(0.55) translateY(4px); } to { opacity: 1; transform: scale(1) translateY(0); } }   /* ▲칩 플로팅 팝 */
#exVolTip.on { animation: gTipPulse 1.2s ease-in-out infinite; }                             /* 초과 유지 중 팁 루프 */
/* 좌스와이프 방향 큐 (스트릭·셰브런·엣지, pointer-events:none — §5.3) */
@keyframes gSwipeHint { 0% { opacity: 0; transform: translateX(52px); } 18% { opacity: 1; } 52% { opacity: 0.6; transform: translateX(-52px); } 100% { opacity: 0; transform: translateX(-108px); } }
@media (prefers-reduced-motion: reduce) { *{ animation: none !important; } }

/* ===== 툴바 ===== */
.sess-toolbar { flex-shrink:0; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:0 16px; height:48px; }
.sess-toolbar .home-btn { width:40px; height:40px; margin-left:-6px; border-radius:var(--r-sm); border:0; background:transparent; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-3); }
.sess-toolbar .timer { justify-self:center; display:flex; align-items:center; gap:8px; }
.sess-toolbar .end { justify-self:end; font-size:14px; font-weight:600; color:var(--ink-3); padding:9px 4px 9px 14px; cursor:pointer; white-space:nowrap; }

/* ===== 우상단 세션 볼륨 (블루=세션 스코프 · 링 확대 + 텍스트 좌측 이동 — 실기기 가독성, 사용자 2026-07-07) ===== */
.sv { flex-shrink:0; display:flex; align-items:center; gap:14px; }
.sv-text { text-align:right; }
.sv-text .lbl { font-size:10px; font-weight:600; color:var(--ink-4); letter-spacing:0.04em; white-space:nowrap; }
.sv-text .val { margin-top:3px; font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:13px; font-weight:600; color:var(--ink-2); letter-spacing:-0.01em; white-space:nowrap; line-height:1; }
.sv-text .val .u { font-weight:500; color:var(--ink-4); }
.sv-text #cardSessTotalWrap.struck { text-decoration:line-through; opacity:0.55; }
.sv-text #cardRecordTag { margin-top:3px; font-size:10.5px; font-weight:700; color:var(--cloudy-deep); white-space:nowrap; opacity:0; display:flex; align-items:center; justify-content:flex-end; gap:3px; }
.sv .ring-wrap { position:relative; width:50px; height:50px; flex-shrink:0; }
.sv .ring-wrap svg { width:50px; height:50px; display:block; }
.sv .ring-center { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:13px; font-weight:700; color:var(--cloudy-deep); letter-spacing:-0.02em; }

/* ===== 중앙 종목 세그먼트 링 (주황=종목 스코프 · 볼륨 32px 승격, 작업지시서 §5.1) ===== */
.exvol { display:flex; align-items:center; justify-content:center; gap:18px; margin-bottom:15px; }
.exvol .exring { position:relative; width:68px; height:68px; flex-shrink:0; display:block; }
.exvol .exring > svg { width:68px; height:68px; display:block; overflow:visible; }
/* 시안 #6b 676행 미돌파 15/10 · 693행 돌파 13.5/9.5 (3자리 대비 축소) */
.exvol .exring-pct { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:15px; font-weight:700; color:var(--crail-deep); letter-spacing:-0.02em; }
.exvol .exring-pct .u { font-size:10px; font-weight:600; margin-left:1px; }
.exvol .exring-pct.over { font-size:13.5px; }
.exvol .exring-pct.over .u { font-size:9.5px; }
.exvol .exnums { display:inline-flex; align-items:baseline; gap:8px; position:relative; }
.exvol .exnums .cur { font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:32px; font-weight:700; color:var(--ink-1); letter-spacing:-0.035em; line-height:1; }
.exvol .exnums .cur.over { color:var(--crail-deep); }
.exvol .exnums .tot { font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:13.5px; font-weight:500; color:var(--ink-4); white-space:nowrap; }
.exvol .exnums .tot.struck { text-decoration:line-through; opacity:0.55; }
.exvol .exnums .tot .u { font-size:10.5px; }
.exvol .exchip { position:absolute; left:0; bottom:calc(100% + 9px); pointer-events:none; opacity:0; }
.exvol .exchip-inner { display:inline-flex; align-items:center; gap:2px; padding:6px 11px; border-radius:999px; background:var(--record-tint); box-shadow:inset 0 0 0 1px oklch(78% 0.10 152), 0 6px 14px -6px oklch(62% 0.18 152 / 0.45); font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:12.5px; font-weight:700; color:var(--record-deep); white-space:nowrap; }

/* ===== 직전 세션 세트바 ===== */
#cardSetDots .seg { flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; min-width:0; cursor:pointer; position:relative; }
#cardSetDots .seg .seg-bar { width:100%; height:9px; border-radius:5px; background:var(--sunken); box-shadow:inset 0 0 0 1.5px var(--line); transition:background .22s, height .22s; transform-origin:bottom center; }
#cardSetDots .seg.done .seg-bar { background:var(--ink-2); box-shadow:none; }
#cardSetDots .seg.now .seg-bar { background:var(--crail-base); box-shadow:none; height:11px; animation:barPulse 1.8s ease-in-out infinite; }
#cardSetDots .seg .seg-n { display:flex; flex-direction:column; align-items:center; line-height:1.05; gap:2px; }
#cardSetDots .seg .seg-n .w { font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:12.5px; font-weight:600; color:var(--ink-3); letter-spacing:-0.02em; }
#cardSetDots .seg .seg-n .r { font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:10px; font-weight:500; color:var(--ink-4); }
#cardSetDots .seg.done .seg-n .w { color:var(--ink-2); }
#cardSetDots .seg.now .seg-n .w { color:var(--crail-deep); font-weight:700; }
#cardSetDots .seg.now .seg-n .r { color:var(--crail-deep); }
/* 확정 플래시 (playSegConfirmFlash WAAPI) */
#cardSetDots .seg .seg-flash { position:absolute; left:0; right:0; top:0; height:2px; border-radius:2px; transform:scaleX(0); transform-origin:left center; opacity:0; background:var(--ink-1); pointer-events:none; }
/* 꾹누른 세트 — crail 선택 링 */
#cardSetDots .seg.held::before { content:""; position:absolute; top:-7px; left:-5px; right:-5px; bottom:-7px; border-radius:10px; box-shadow:0 0 0 2px var(--crail-base); background:var(--crail-tint); z-index:-1; }

/* ===== 히어로 무게×횟수 (옵션 B) ===== */
.hero-weight { font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:122px; font-weight:600; line-height:0.8; color:var(--ink-1); letter-spacing:-0.055em; }
.hero-wunit { font-family:var(--font-sans); font-size:15px; font-weight:600; color:var(--ink-4); letter-spacing:0.02em; margin-top:6px; }
.hero-reps-x { font-family:var(--font-mono); font-size:24px; font-weight:300; color:var(--ink-4); }
.hero-reps { font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:50px; font-weight:400; color:var(--ink-2); letter-spacing:-0.02em; line-height:1; }
.hero-reps-u { font-family:var(--font-sans); font-size:16px; font-weight:500; color:var(--ink-3); }

/* ===== 푸터 운동 전환 (종이톤 슬라이드 레일) ===== */
#sessionFooter {
  flex-shrink:0;
  display:flex; align-items:center; gap:8px;
  padding:16px 12px 6px;   /* 하단 22 → 6: 트랙이 늘어난 만큼 컨테이너 축소(총 높이 유지) */
  box-shadow:inset 0 1px 0 var(--line-soft);
}

/* 레일 — JS 가 칩을 채움 */
.fp-rail {
  flex:1; min-width:0;
  display:flex; align-items:center; gap:10px;
  overflow-x:auto;
  /* 하단 30: 현재 카드 드롭섀도를 트랙 안에서 완결시켜 overflow-y 절단선 제거 (레일 그림자픽스 작업지시서) */
  padding:12px 4px 30px;
  /* 우측만 페이드 — 완료 종목이 왼쪽에 잘리지 않고 다 보이게 (작업지시서 §3) */
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 22px),transparent);
          mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 22px),transparent);
}
.fp-rail::-webkit-scrollbar { display:none; width:0; height:0; }
.fp-rail { scrollbar-width:none; -ms-overflow-style:none; }

/* 칩 공통 (작업지시서 §4 — 깊이 3단: 완료=눌림 / 현재=떠오름 / 예정=평면) */
.fp-chip {
  flex-shrink:0;
  border:0; cursor:pointer;
  font-family:var(--font-sans);
  display:inline-flex; align-items:center;
  white-space:nowrap;            /* 이름 안 잘림 */
  background:transparent;
}

/* 완료(done) — 눌려 들어간 회색 칩 + 무채색 체크 (초록 미사용, §4.2) */
.fp-chip.is-done {
  gap:7px; height:40px; padding:0 16px; border-radius:14px;
  background:oklch(96.3% 0.003 60);
  box-shadow:inset 0 0 0 1px oklch(93.5% 0.005 60);
}
.fp-chip.is-done .fp-chip__mk { display:inline-flex; align-items:center; justify-content:center; width:12px; height:12px; }
.fp-chip.is-done .fp-chip__name { font-size:14.5px; font-weight:500; color:oklch(58% 0.006 60); }
.fp-check path { stroke:oklch(70% 0.006 60); }   /* 무채색 체크 */

/* 예정(upcoming)/보류(hold) — 평면 아웃라인 칩 (§4.3) */
.fp-chip.is-upcoming, .fp-chip.is-hold {
  height:40px; padding:0 15px; border-radius:12px;
  background:transparent;
  box-shadow:inset 0 0 0 1.5px oklch(91% 0.006 60);
}
.fp-chip.is-upcoming .fp-chip__name, .fp-chip.is-hold .fp-chip__name {
  font-size:14.5px; font-weight:600; color:oklch(60% 0.008 60);
}

/* 현재(current) — 떠오른 흰 카드 + crail 테두리 링 + 브리드 (§4.1 · §5) */
.fp-chip.is-current {
  position:relative;
  gap:11px; height:50px; padding:0 20px; border-radius:16px;
  background:linear-gradient(180deg,#fffdfa,#f6f3ec);
  /* transform 아닌 translate — 롱프레스(scale 0.98)·reorder 드래그가 쓰는 인라인 transform 과
     별개 속성이라 합성됨. transform 으로 두면 인라인이 리프트를 통째로 덮어씀. */
  translate:0 -2px;
  box-shadow:0 0 0 1.7px var(--crail-base),
             0 6px 16px -9px rgba(20,18,14,0.34),
             0 14px 26px -14px rgba(20,18,14,0.26);
}
.fp-chip.is-current .fp-chip__name {
  font-size:18px; font-weight:800; color:var(--ink-1); letter-spacing:-0.02em;
}
/* 터치다운 눌림 — 손가락이 닿는 순간 0.96 (iOS 표준 버튼 감각, 네이티브 2026-07-24).
   translate 와 별개 속성인 scale 을 쓴다 — 현재 칩의 translate:0 -2px 리프트를 덮지 않게. */
.fp-chip { transition:scale 120ms ease-out; }
.fp-chip.is-pressed { scale:0.96; }

/* 두 박자 이동의 착지 연출 — 탭 자리에서 dwell(0.22s) 머문 뒤 정렬로 미끄러지고,
   travel(0.58s) 시점에 스쿼시 + crail 확산 링이 동시에 터진다 (네이티브 RailLanding 정합).
   햅틱은 웹에 없어 제외. */
.fp-chip.is-current.is-landing { animation:railLandPop 0.99s cubic-bezier(.2,.8,.3,1) both; }
@keyframes railLandPop {
  0%, 58.6% { scale:1; }
  67.7%     { scale:0.94; }
  83.8%     { scale:1.07; }
  100%      { scale:1; }
}
.fp-chip.is-current.is-landing::after {
  content:""; position:absolute; inset:0; border-radius:16px;
  border:2.5px solid var(--crail-base); pointer-events:none;
  animation:railLandRing 0.55s ease-out 0.58s both;
}
@keyframes railLandRing {
  0%   { opacity:0.9; transform:scale(1); }
  100% { opacity:0;   transform:scale(1.18); }
}
@media (prefers-reduced-motion: reduce) {
  .fp-chip { transition:none; }
  .fp-chip.is-current.is-landing { animation:none; }
  .fp-chip.is-current.is-landing::after { animation:none; content:none; }
}

/* 재생 중 이퀄라이저 — 라이브 점/세트 표기 대체. 막대 3개(짧·긴·중) 스태거 스케일 */
.fp-chip.is-current .fp-chip__eq {
  display:inline-flex; align-items:flex-end; gap:2.5px; height:15px;
}
.fp-chip.is-current .fp-chip__eq i {
  width:3.2px; border-radius:2px; background:var(--crail-base);
  transform-origin:bottom; animation:fpEq 1.15s ease-in-out infinite;
}
.fp-chip.is-current .fp-chip__eq i:nth-child(1) { height:8px;  animation-delay:0s; }
.fp-chip.is-current .fp-chip__eq i:nth-child(2) { height:15px; animation-delay:-0.45s; }
.fp-chip.is-current .fp-chip__eq i:nth-child(3) { height:11px; animation-delay:-0.85s; }

/* + 추가 버튼 — 레일 밖, 원형 · 44px 탭 타깃 (§4.4) */
.fp-add {
  flex-shrink:0;
  width:44px; height:44px;
  margin-bottom:18px;   /* 레일 하단 패딩(30px) 비대칭 보정 → 칩 중앙과 수직 정렬 */
  border-radius:50%;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--ink-3);
  padding:0; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}

/* 현재 카드 전용 — 이퀄라이저 막대만 움직임 (카드는 정지) */
@keyframes fpEq { 0%,100% { transform:scaleY(0.4); } 50% { transform:scaleY(1); } }
@media (prefers-reduced-motion:reduce){
  .fp-chip.is-current .fp-chip__eq i { animation:none; transform:scaleY(1); }
}

/* reorder 모드 — 마스크/오버플로 해제 (드래그 칩이 레일 밖으로 들리도록) */
#sessionFooterPills[data-reorder="1"] {
  overflow:visible;
  -webkit-mask-image:none; mask-image:none;
}

/* ===== 통일 바텀시트 ===== */
.addex-sheet { position:absolute; left:0; right:0; bottom:0; height:66%; background:var(--card); display:flex; flex-direction:column; border-top-left-radius:var(--r-xl); border-top-right-radius:var(--r-xl); padding:14px 0 22px; }
.sheet-handle { flex-shrink:0; width:38px; height:4px; border-radius:2px; background:var(--line); margin:0 auto; }
.addex-chips { flex-shrink:0; display:flex; gap:8px; padding:0 18px; overflow-x:auto; }
.addex-chip { flex-shrink:0; padding:8px 15px; border-radius:999px; font-size:14px; font-weight:500; color:var(--ink-3); border:1px solid var(--line); background:var(--card); cursor:pointer; white-space:nowrap; font-family:var(--font-sans); }
.addex-chip.is-active { background:var(--crail-soft); color:var(--ink-1); font-weight:600; border-color:var(--crail-base); }
.addex-list { flex:1; min-height:0; padding:4px 12px 12px; overflow-y:auto; }
.addex-item { display:flex; align-items:center; justify-content:space-between; width:100%; padding:14px 12px; border-radius:var(--r-md); background:transparent; border:0; cursor:pointer; font-family:inherit; text-align:left; }
.addex-item:active { background:var(--hover-bg); }
.addex-item + .addex-item { box-shadow:inset 0 1px 0 var(--line-soft); }
.addex-item .ex-main { display:flex; align-items:baseline; gap:8px; flex:1; justify-content:space-between; margin-right:12px; min-width:0; }
.addex-item .ex-name { font-size:16px; color:var(--ink-1); font-weight:500; white-space:nowrap; font-family:var(--font-sans); }
.addex-item .ex-meta { font-family:var(--font-mono); font-size:13px; color:var(--ink-4); flex-shrink:0; white-space:nowrap; }
.addex-item .ex-toggle { flex-shrink:0; width:36px; height:22px; background:var(--line); border-radius:11px; position:relative; transition:background .2s; }
.addex-item .ex-toggle::after { content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:9px; background:var(--card); box-shadow:0 1px 2px rgba(20,18,14,.15); transition:transform .16s; }
.addex-item.is-added .ex-toggle { background:var(--crail-base); }
.addex-item.is-added .ex-toggle::after { transform:translateX(14px); }
.addex-empty { padding:24px 14px; text-align:center; font-size:14px; color:var(--ink-4); }

/* 스크롤바 숨김 (터치 PWA) */

#keypadGrid .keypad-key { height:50px; border-radius:var(--r-md); border:0; background:var(--sunken); cursor:pointer; font-family:var(--font-mono); font-size:23px; font-weight:500; color:var(--ink-1); display:flex; align-items:center; justify-content:center; }
#keypadGrid .keypad-key.fn { background:transparent; color:var(--ink-3); font-size:20px; }

#actionItems .action-item { width:100%; height:50px; border-radius:var(--r-md); border:0; background:var(--sunken); cursor:pointer; font-family:var(--font-sans); font-size:16px; font-weight:500; color:var(--ink-1); display:flex; align-items:center; justify-content:center; gap:8px; }
#actionItems .action-item.danger { color:var(--danger); font-weight:600; }
#actionItems .action-confirm { width:100%; height:50px; border-radius:var(--r-md); border:0; background:var(--danger); color:#fff; cursor:pointer; font-family:var(--font-sans); font-size:16px; font-weight:600; display:flex; align-items:center; justify-content:center; }
/* 바텀시트 그림자 — 열렸을 때만 */
