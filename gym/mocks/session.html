/* Wave 11.6D — 운동명 → 부위 약어 매핑 (tag 추론용) */
function partOfExercise(name) {
  if (/벤치|인클라인|덤벨플라이|체스트|플라이/.test(name)) return '가';
  if (/스쿼트|런지|레그|힙/.test(name)) return '하';
  if (/데드|바벨로우|랫풀|풀업|시티드로우/.test(name)) return '등';
  if (/숄더|밀리터리|오버헤드|사이드레터럴/.test(name)) return '어';
  if (/컬|curl|킥백|익스텐션/i.test(name)) return '팔';
  if (/트레드밀|사이클|로잉|엘립티컬|러닝|스텝퍼/.test(name)) return '유';
  return '기타';
}

/** state + exerciseStates → Dexie sessions row 구성 (spec §4, §12).
    완료 세트 없으면 null 반환 (빈 세션 저장 방지) */
function buildSessionFromState() {
  const now = Date.now();
  const startTime = state.sessionStartedAt || now;
  const durationMin = Math.max(1, Math.round((now - startTime) / 60_000));
  const dateISO = new Date(startTime).toISOString().slice(0, 10);

  /* 모든 운동 병합: exerciseStates + 현재 운동 snapshot */
  const allStates = { ...(state.exerciseStates || {}) };
  allStates[state.exerciseName] = { sets: state.sets };

  /* footer nav 순서대로 수집 (사용자 실 운동 순서 유지) */
  const navNames = Array.from(document.querySelectorAll('.nav-item[data-name]'))
    .map(el => el.dataset.name);
  const exercises = [];
  navNames.forEach(name => {
    const snap = allStates[name];
    if (!snap || !Array.isArray(snap.sets)) return;
    const completedSets = snap.sets
      .filter(s => s.done)
      .map(s => ({
        weight: s.weight ?? null,
        reps: s.reps ?? null,
        done: true,
      }));
    if (completedSets.length === 0) return;
    exercises.push({
      exerciseId: name,
      exerciseName: name,
      equipment: 'unknown',  // Wave 11.7 관리 화면 바인딩 시 실 equipment 매핑
      sets: completedSets,
    });
  });

  if (exercises.length === 0) return null;

  const totalVolume = exercises
    .flatMap(e => e.sets)
    .reduce((sum, s) => sum + (s.weight || 0) * (s.reps || 0), 0);
  const tagSet = [...new Set(exercises.map(e => partOfExercise(e.exerciseName)))];
  const tag = tagSet.length > 1 ? tagSet.join('·') : tagSet[0];

  return {
    id: `sess-${dateISO.replaceAll('-', '')}-${Date.now().toString().slice(-4)}`,
    date: dateISO,
    startTime,
    endTime: now,
    blocks: [{ type: 'single', exercises }],
    tags: [tag],
    totalVolume,
    totalCalories: Math.round(durationMin * 5.5),
    durationMin,
    status: 'completed',
  };
}

document.getElementById('endConfirm').addEventListener('click', async () => {
  hideSheet(endSheet);
  if (timerInterval) clearInterval(timerInterval);
  if (window.__gymTimerInterval) { clearInterval(window.__gymTimerInterval); window.__gymTimerInterval = null; }
  state.sessionEnded = true;
  const t = document.getElementById('sessionTime');
  t.classList.remove('is-running');

  /* Wave 11.9.5 — SPA finalizeActiveSession 우선 (spec §12 정합 형식 보존).
     Wave 11.9.1 의 active row (id=session_<ts>, blocks=[{type:'single',exerciseId:'영문',sets}])
     를 status='completed' + endTime + 합계 마킹. 미노출 환경 (mocks 허브 iframe) 은
     기존 Wave 11.6D fallback (buildSessionFromState 새 row 생성). */
  if (window.gymSession?.finalizeActiveSession) {
    try {
      const r = await window.gymSession.finalizeActiveSession();
      if (r?.ok && r.session?.id) {
        try { sessionStorage.setItem('gymLastSessionId', r.session.id); } catch (_) {}
      } else if (window.gymQueries) {
        // active 없음 또는 finalize 실패 — fallback 시도
        const session = buildSessionFromState();
        if (session) {
          await window.gymQueries.upsertSession(session);
          try { sessionStorage.setItem('gymLastSessionId', session.id); } catch (_) {}
        }
      }
    } catch (err) {
      console.warn('[session] finalize failed', err);
    }
  } else if (window.gymQueries) {
    try {
      const session = buildSessionFromState();
      if (session) {
        await window.gymQueries.upsertSession(session);
        try { sessionStorage.setItem('gymLastSessionId', session.id); } catch (_) {}
      }
    } catch (err) {
      console.warn('[session] upsert failed', err);
    }
  }

  // 프로토타입: 종료 → 요약 화면
  setTimeout(() => { window.location.href = 'summary.html'; }, 400);
});

/* ============ TIMER ============ */
let timerInterval = null;
/* Wave C (2026-05-05) — SPA hashchange 시 app.js 가 script 를 재실행 → 이전 IIFE
   의 setInterval 핸들 참조를 잃음. 새 setInterval 시작 전 window 글로벌에 보관된
   이전 핸들을 clear 해서 multi-interval race 로 인한 비단조 표시 방지. */
function startSessionIfNeeded() {
  if (state.sessionStartedAt || state.sessionEnded) return;
  state.sessionStartedAt = Date.now();
  const t = document.getElementById('sessionTime');
  t.classList.remove('is-idle');
  t.classList.add('is-running');
  if (window.__gymTimerInterval) clearInterval(window.__gymTimerInterval);
  timerInterval = setInterval(updateTimer, 1000);
  window.__gymTimerInterval = timerInterval;
  updateTimer();
}
function updateTimer() {
  if (!state.sessionStartedAt) return;
  const elapsed = Math.floor((Date.now() - state.sessionStartedAt) / 1000);
  const h = Math.floor(elapsed / 3600);
  /* h > 0 구간에서도 m 은 "시간 내 분" (0~59) 이어야. 전체 분으로 계산하면 "3:214:44" 처럼 분이 60 을 초과 */
  const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
  const s = String(elapsed % 60).padStart(2, '0');
  document.getElementById('sessionTimeText').textContent = h > 0 ? `${h}:${m}:${s}` : `${m}:${s}`;
}

/* ============ NAV (footer) — §6-8 "다른 운동 탭 = 이동, 완료 아님" ============ */
function snapshotCurrentExercise() {
  /* 시간 기반(유산소·플랭크)은 cardioStates 에 이미 저장됨 — skip */
  const curDef = EX_DEFAULTS[state.exerciseName] || {};
  if (EX_BY_PART['유산소'].includes(state.exerciseName) || curDef.isTime) return;
  state.exerciseStates[state.exerciseName] = {
    sets: state.sets.map(s => ({ ...s })),
    currentIdx: state.currentIdx,
    prevExerciseVolume: state.prevExerciseVolume,
    prevBestE1rm: state.prevBestE1rm,
    readonly: state.readonly,
  };
}

/* nav-item is-hold 상태의 메타 레이블 계산 (§6-4 유산소·플랭크 = 분, 일반 = 세트 N/M) */
function formatNavHold(navItem) {
  const name = navItem.dataset.name;
  const def = EX_DEFAULTS[name] || {};
  const isTimeBased = EX_BY_PART['유산소'].includes(name) || def.isTime;
  if (isTimeBased) {
    const snap = state.cardioStates?.[name];
    /* 프리셋 상태(사용자 입력 전) 은 메타 비움 — 입력 커밋 후에만 표기 */
    if (snap && !snap.isPreset && snap.time) return `${fmtCardio(snap.time)}분`;
    return '';
  }
  /* 일반 운동 — 현재 운동인지 기억된 snapshot 인지 구분 */
  if (name === state.exerciseName) {
    const doneCount = state.sets.filter(s => s.done).length;
    return `${doneCount}/${state.sets.length}`;
  }
  const snap = state.exerciseStates[name];
  if (snap?.sets?.length) {
    const doneCount = snap.sets.filter(s => s.done).length;
    return `${doneCount}/${snap.sets.length}`;
  }
  return '';
}

function applyNavHoldLabel(navItem) {
  const label = formatNavHold(navItem);
  if (label) navItem.dataset.hold = label;
  else delete navItem.dataset.hold;
}
function loadExercise(name, opts = {}) {
  /* 유산소 분기 (§6-4) — 별도 뷰 */
  /* 시간 기반 운동(유산소 부위 + 플랭크 등 isTime flag) 은 cardio 카드 재활용.
     플랭크는 거리 필드 숨김 옵션으로 분기. */
  const def = EX_DEFAULTS[name] || {};
  if (EX_BY_PART['유산소'].includes(name)) {
    return loadCardio(name, opts);
  }
  if (def.isTime) {
    return loadCardio(name, { ...opts, hideDistance: true });
  }
  /* 유산소 뷰가 열려있었다면 닫고 일반 카드 복원 */
  cardViewportEl.hidden = false;
  if (typeof cardioViewportEl !== 'undefined') cardioViewportEl.hidden = true;
  const snap = state.exerciseStates[name];
  const readonly = opts.readonly != null
    ? opts.readonly
    : (snap ? !!snap.readonly : false);
  if (snap) {
    state.sets = snap.sets.map(s => ({ ...s }));
    state.currentIdx = snap.currentIdx;
    state.prevExerciseVolume = snap.prevExerciseVolume;
    state.prevBestE1rm = snap.prevBestE1rm;
  } else {
    /* snap 없음 — EX_DEFAULTS 기반 세트 생성. 맨몸(w:null)은 weight=null 유지. */
    const defs = EX_DEFAULTS[name] || {};
    const defaultSets = 5;
    const defaultReps = defs.r ?? 10;
    const defaultWeight = defs.w ?? null;
    const preDone = !!opts.readonly;
    state.sets = Array.from({ length: defaultSets }, () => ({
      weight: defaultWeight,
      reps: defaultReps,
      done: preDone,
      preset: !preDone,
      pr: false,
    }));
    state.currentIdx = 0;
    state.prevExerciseVolume = defaultWeight != null ? defaultSets * defaultReps * defaultWeight : 0;
    state.prevBestE1rm = defaultWeight != null ? defaultWeight * (1 + defaultReps / 30) : 0;
  }
  state.exerciseName = name;
  state.readonly = readonly;
  document.getElementById('exerciseName').childNodes[0].nodeValue = name;
  document.getElementById('readonlyBadge').hidden = !readonly;
  renderCards();
  updateProgress();
}
/* nav-item 클릭 로직 — 신규 동적 추가 item 에도 동일 바인딩 위해 공통 함수. */
function bindNavItem(item) {
  item.addEventListener('click', () => {
    /* Wave 11.18 — 첫 nav-item 클릭으로 빈 세션 모드 해제 (placeholder → 메인 카드). */
    const appEl = document.getElementById('sessionApp');
    if (appEl?.dataset.emptySession) delete appEl.dataset.emptySession;
    if (item.classList.contains('is-current')) return;
    const isDone = item.classList.contains('is-done');
    /* 이전 current → is-hold + data-hold (§6-8) */
    const oldCurrent = document.querySelector('.nav-item.is-current');
    if (oldCurrent && !state.readonly) {
      /* readonly 모드에서 이동할 때는 이전 current 가 readonly 운동이므로 snapshot 만 하고
         is-current 를 유지 — nav 표시는 원래 current 그대로, 카드만 전환되는 구조.
         대신 mocks 단순화 위해 readonly 에서 이동 시 은 snapshot 만 저장하고 is-current 유지 */
      snapshotCurrentExercise();
      oldCurrent.classList.remove('is-current');
      oldCurrent.classList.add('is-hold');
      applyNavHoldLabel(oldCurrent);
    } else if (oldCurrent && state.readonly) {
      /* readonly 에서 다른 nav 로 이동 — snapshot 만, oldCurrent 의 nav 클래스는 바꾸지 않음 */
      snapshotCurrentExercise();
    }
    if (isDone) {
      /* done 탭 — 카드만 readonly 로 펼침. nav 상태는 그대로 (is-done 유지, is-current 로 바꾸지 않음) */
      loadExercise(item.dataset.name, { readonly: true });
      /* Wave 11.6.1: 탭한 item 이 중앙으로 오도록 스크롤 (done 탭은 is-current 변경 없음 → 수동 scroll) */
      scrollNavTo(item);
      return;
    }
    /* 일반 이동 — 새 current */
    item.classList.remove('is-pending', 'is-hold');
    delete item.dataset.hold;
    item.classList.add('is-current');
    loadExercise(item.dataset.name, { readonly: false });
    startSessionIfNeeded();
    /* Wave 11.6.1: is-current 전환 후 중앙으로 스크롤 */
    scrollNavToCurrent();
  });
}
document.querySelectorAll('.nav-item').forEach(bindNavItem);

/* ============ CARDIO · SHARED VIEWPORT 참조 (§6-4) ============
   card-viewport 와 배타 토글. loadExercise 가 종목 타입 보고 적절한 뷰로 swap. */
const cardViewportEl = document.getElementById('cardViewport');
const cardioViewportEl = document.getElementById('cardioViewport');

/* ============ CARDIO (§6-4) ============
   유산소 = 시간·거리·페이스. state.cardio 에 현재 종목 상태. 키패드 재사용(소수점 허용). */
state.cardioStates = state.cardioStates || {};
const cardioTimeBtn = document.getElementById('cardioTimeBtn');
const cardioDistBtn = document.getElementById('cardioDistBtn');
const cardioPaceEl = document.getElementById('cardioPace');
const cardioDoneBtn = document.getElementById('cardioDoneBtn');

function loadCardio(name, opts = {}) {
  const readonly = !!opts.readonly;
  const hideDistance = !!opts.hideDistance;
  cardViewportEl.hidden = true;
  cardioViewportEl.hidden = false;
  /* 플랭크(시간 단독) — 거리 행·페이스 숨김. 유산소(트레드밀 등) 는 전부 표시. */
  const cardioBody = cardioViewportEl.querySelector('.cardio-card');
  if (cardioBody) {
    cardioBody.classList.toggle('is-time-only', hideDistance);
  }
  state.exerciseName = name;
  state.readonly = readonly;
  document.getElementById('exerciseName').childNodes[0].nodeValue = name;
  document.getElementById('readonlyBadge').hidden = !readonly;
  /* 이전 세션 값이 없으면 EX_DEFAULTS (프리셋) 사용 — 일반 카드 §6-3-3 프리셋 패턴 대응.
     프리셋은 cardioStates 에 즉시 저장하되 isPreset 플래그 유지 → formatNavHold 가 메타 제외, 완료 버튼 disabled. */
  if (!state.cardioStates[name]) {
    const defaults = EX_DEFAULTS[name] || {};
    state.cardioStates[name] = {
      time: defaults.d || 0,
      distance: defaults.km || 0,
      done: false,
      isPreset: true,
    };
  }
  const snap = state.cardioStates[name];
  cardioTimeBtn.textContent = fmtCardio(snap.time);
  cardioDistBtn.textContent = fmtCardio(snap.distance);
  /* 프리셋 상태일 때 흐리게 표기 — 사용자가 이전값임을 인지 (일반 카드 프리셋과 동일 시각 언어) */
  cardioTimeBtn.classList.toggle('is-preset', !!snap.isPreset);
  cardioDistBtn.classList.toggle('is-preset', !!snap.isPreset);
  updateCardioPace();
  cardioDoneBtn.textContent = snap.done ? '완료됨' : '완료';
  cardioDoneBtn.disabled = readonly || !!snap.isPreset;
  /* volumeLabel 재활용 — 값 입력 후 "N분", 프리셋 상태는 부위명 placeholder */
  const def = EX_DEFAULTS[name] || {};
  const partLabel = def.isTime ? '코어' : '유산소';
  document.getElementById('volumeLabel').textContent = (!snap.isPreset && snap.time > 0) ? `${fmtCardio(snap.time)}분` : partLabel;
}

function fmtCardio(v) {
  if (!v) return '0';
  return Number.isInteger(v) ? String(v) : v.toFixed(1);
}

function updateCardioPace() {
  const t = parseFloat(cardioTimeBtn.textContent) || 0;
  const d = parseFloat(cardioDistBtn.textContent) || 0;
  if (t > 0 && d > 0) {
    const paceMinPerKm = t / d;
    let m = Math.floor(paceMinPerKm);
    let s = Math.round((paceMinPerKm - m) * 60);
    if (s === 60) { m += 1; s = 0; }
    cardioPaceEl.textContent = `${m}:${String(s).padStart(2, '0')} min/km`;
  } else {
    cardioPaceEl.innerHTML = '&nbsp;';
  }
}

/* 유산소 값 탭 → 기존 keypadSheet 재활용. keypadField = 'time'/'distance' 로 분기. */
function openCardioKeypad(field) {
  startSessionIfNeeded();
  keypadField = field;
  const name = state.exerciseName;
  const saved = state.cardioStates[name];
  const defaults = EX_DEFAULTS[name] || {};
  /* saved 없으면 defaults 값이 프리셋. 첫 숫자 입력 시 keypadDirty 패턴으로 덮어쓰기. */
  const snap = saved || { time: defaults.d || 0, distance: defaults.km || 0, done: false, isPreset: true };
  state.cardioStates[name] = snap;
  keypadBuffer = String(snap[field] || 0);
  keypadDirty = false; // 프리셋/저장값 모두 첫 입력 시 덮어쓰기 (Wave 11.3 isDirty 패턴)
  document.getElementById('keypadValue').textContent = keypadBuffer;
  document.getElementById('keypadUnit').textContent = field === 'time' ? '분' : 'km';
  /* 소수점 버튼 활성화 — distance 만 */
  document.getElementById('keypadDot').classList.toggle('is-on', field === 'distance');
  showSheet(keypadSheet);
}

cardioTimeBtn.addEventListener('click', () => openCardioKeypad('time'));
cardioDistBtn.addEventListener('click', () => openCardioKeypad('distance'));
cardioDoneBtn.addEventListener('click', () => {
  const snap = state.cardioStates[state.exerciseName] || { time: 0, distance: 0 };
  if (!snap.time) { toast('시간을 입력해 주세요'); return; }
  snap.done = true;
  state.cardioStates[state.exerciseName] = snap;
  const nav = Array.from(document.querySelectorAll('.nav-item')).find(el => el.dataset.name === state.exerciseName);
  if (nav) {
    nav.classList.remove('is-current', 'is-pending', 'is-hold');
    nav.classList.add('is-done');
  }
  /* 다음 운동 승계 */
  const next = document.querySelector('.nav-item.is-hold, .nav-item.is-pending');
  if (next) {
    next.classList.remove('is-pending', 'is-hold');
    delete next.dataset.hold;
    next.classList.add('is-current');
    loadExercise(next.dataset.name, { readonly: false });
  }
  toast(`${snap.time}분 완료`);
  haptic('medium');
});

/* ============ NAV PRESS-AND-DRAG (§6-9 이동) ============
   사용자 피드백 (2026-04-22): "꾹누르기 후 이동은 메뉴 경유 없이 바로 드래그".
   → 500ms 홀드 완료 = 이동 모드 진입(wiggle), 이어지는 pointermove = 드래그, pointerup = drop.
   홀드 중 너무 일찍 움직이거나 뗌 = 일반 탭. 완료/삭제 메뉴 로직은 다른 진입점용으로 유지. */
const navActionSheet = document.getElementById('navActionSheet');
const confirmSheet = document.getElementById('confirmSheet');

function attachNavPressAndDrag(item) {
  let pressTimer = null;
  let sx = 0, sy = 0;
  let primed = false;   // 500ms 홀드 완료 후 true
  let dragging = false;
  let moveHandler = null;
  let upHandler = null;

  item.addEventListener('pointerdown', (e) => {
    /* 이미 다른 item 이 이동 모드 중이거나 본 item 이 이미 그 대상이면 무시 */
    if (navMoveState && navMoveState.item !== item) return;
    if (navMoveState && navMoveState.item === item) return; /* 메뉴→이동 경로 (onMovePointerDown) 가 담당 */
    sx = e.clientX; sy = e.clientY;
    primed = false; dragging = false;
    pressTimer = setTimeout(() => {
      pressTimer = null;
      primed = true;
      haptic('medium');
      /* 스펙 §6-9: 500ms 홀드 → scale 0.98 시각 피드백. 이동 모드 진입은 실제 드래그 시점으로 지연 */
      item.classList.add('is-pressed');
    }, 500);

    moveHandler = (ev) => {
      /* T-B5: 다른 item 이 이동 모드 중이면 이 item 의 press-and-drag 경로 무시 (중첩 방지) */
      if (navMoveState && navMoveState.item !== item) return;
      const dx = ev.clientX - sx;
      const dy = ev.clientY - sy;
      if (!primed) {
        /* 500ms 전 움직임 → 홀드 취소 (일반 스크롤·탭으로 처리) */
        if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
          if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
        }
        return;
      }
      /* primed 상태 — 움직임 감지 시 드래그 전환 → 이동 모드 진입 */
      if (!dragging && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) {
        dragging = true;
        item.classList.remove('is-pressed');
        enterNavMoveModePrimed(item);
        item.classList.add('is-drag-active');
      }
      if (dragging) {
        /* 인접 item 중심 통과 시 swap (기존 onMovePointerMove 로직 재사용) */
        item.style.transform = `translate3d(${ev.clientX - sx}px,0,0) scale(1.02)`;
        performNavSwap(ev.clientX, item, (deltaSx) => { sx += deltaSx; });
        /* swap 후 transform 재계산 */
        item.style.transform = `translate3d(${ev.clientX - sx}px,0,0) scale(1.02)`;
      }
    };
    upHandler = () => {
      window.removeEventListener('pointermove', moveHandler);
      if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
      if (!primed) {
        /* 일반 탭 — click 이벤트는 별도 핸들러 (bindNavItem) 가 처리 */
        return;
      }
      if (dragging) {
        /* drop 애니메이션 — 현재 순서 확정, transform 원복 */
        item.style.transition = 'transform 220ms var(--ease)';
        item.classList.remove('is-drag-active');
        item.style.transform = '';
        setTimeout(() => exitNavMoveMode(), 240);
      } else {
        /* 스펙 §6-9: 홀드 완료 + 움직임 없이 뗌 → 컨텍스트 메뉴 (완료/삭제/…) */
        item.classList.remove('is-pressed');
        openNavMenu(item);
      }
      primed = false; dragging = false;
    };
    window.addEventListener('pointermove', moveHandler);
    window.addEventListener('pointerup', upHandler, { once: true });
    window.addEventListener('pointercancel', upHandler, { once: true });
  });
}

/* 이동 모드 시각만 켜기 (pointer down 상태에서 호출) */
function enterNavMoveModePrimed(item) {
  if (navMoveState) return;
  navMoveState = { item, dragStartX: 0, dragging: true, pointerId: null };
  item.classList.add('is-moving');
  navTrackEl.classList.add('move-mode');
}

/* 드래그 중 인접 item 과 swap — press-and-drag / 메뉴→이동 경로 공용 */
function performNavSwap(clientX, item, onSxAdjust) {
  const items = Array.from(navTrackEl.children);
  const idx = items.indexOf(item);
  const prev = items[idx - 1];
  const next = items[idx + 1];
  if (prev) {
    const pr = prev.getBoundingClientRect();
    if (clientX < pr.left + pr.width / 2) {
      const before = item.getBoundingClientRect().left;
      navTrackEl.insertBefore(item, prev);
      const after = item.getBoundingClientRect().left;
      onSxAdjust(after - before);
      haptic('light');
      return;
    }
  }
  if (next) {
    const nr = next.getBoundingClientRect();
    if (clientX > nr.left + nr.width / 2) {
      const before = item.getBoundingClientRect().left;
      navTrackEl.insertBefore(next, item);
      const after = item.getBoundingClientRect().left;
      onSxAdjust(after - before);
      haptic('light');
    }
  }
}

/* 중복 바인딩 방지 플래그 버전 */
function attachNavLongPressOnce(item) {
  if (item.dataset.lpBound === '1') return;
  item.dataset.lpBound = '1';
  attachNavPressAndDrag(item);
}
/* 초기 nav-item 5개 바인딩 */
document.querySelectorAll('.nav-item').forEach(attachNavLongPressOnce);

function navMenuSpec(item) {
  const name = item.dataset.name;
  const isCurrent = item.classList.contains('is-current');
  const isHold    = item.classList.contains('is-hold');
  const isDone    = item.classList.contains('is-done');
  /* "이동" 은 nav-item 꾹누르기+드래그로 이동 (§6-9) — 메뉴 항목에서 제거됨. */
  if (isDone) {
    return {
      title: name,
      actions: [
        { act: 'edit-done', label: '수정 (편집 모드)' },
        { act: 'delete',    label: '삭제', destructive: true },
      ],
    };
  }
  if (isCurrent || isHold) {
    /* 완료 세트 0개 = 기록 없음 → 삭제만 노출 (완료 카드 제거) */
    const setsSrc = name === state.exerciseName
      ? state.sets
      : (state.exerciseStates[name]?.sets || []);
    const hasDoneSet = setsSrc.some(s => s.done);
    const actions = [];
    if (hasDoneSet) actions.push({ act: 'complete', label: '완료', success: true });
    actions.push({ act: 'delete', label: '삭제', destructive: true });
    return { title: name, actions };
  }
  /* is-pending */
  return {
    title: name,
    actions: [
      { act: 'delete', label: '삭제', destructive: true },
    ],
  };
}

function openNavMenu(item) {
  /* 이동 모드 중엔 long-press 타이머가 다시 발동해도 메뉴 열지 않음 */
  if (navMoveState) return;
  const spec = navMenuSpec(item);
  document.getElementById('navMenuTitle').textContent = spec.title;
  const list = document.getElementById('navMenuList');
  list.innerHTML = '';
  spec.actions.forEach(a => {
    const b = document.createElement('button');
    b.className = 'menu-item'
      + (a.destructive ? ' danger'  : '')
      + (a.success     ? ' success' : '');
    b.dataset.act = a.act;
    b.textContent = a.label;
    b.addEventListener('click', () => {
      hideSheet(navActionSheet);
      /* 시트 닫힘 애니메이션 대기 후 액션 수행 */
      setTimeout(() => handleNavAction(a.act, item), 240);
    });
    list.appendChild(b);
  });
  haptic('medium');
  showSheet(navActionSheet);
}

function openConfirm(title, msg, onOk, okLabel = '확인') {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmMsg').textContent = msg;
  const okBtn = document.getElementById('confirmOk');
  okBtn.textContent = okLabel;
  /* 기존 리스너 제거 — cloneNode 로 깨끗이 */
  const fresh = okBtn.cloneNode(true);
  okBtn.parentNode.replaceChild(fresh, okBtn);
  fresh.addEventListener('click', () => {
    hideSheet(confirmSheet);
    setTimeout(onOk, 240);
  });
  showSheet(confirmSheet);
}
document.getElementById('confirmCancel').addEventListener('click', () => hideSheet(confirmSheet));

function handleNavAction(act, item) {
  if (act === 'complete') {
    openConfirm(
      `${item.dataset.name} 완료`,
      '이 운동을 완료 처리합니다. 남은 세트도 완료로 기록됩니다.',
      () => performComplete(item),
      '완료'
    );
    return;
  }
  if (act === 'delete') {
    openConfirm(
      '이 운동을 삭제할까요?',
      '기록과 설정이 함께 삭제됩니다.',
      () => performDelete(item),
      '삭제'
    );
    return;
  }
  if (act === 'edit-done') {
    performEditDone(item);
    return;
  }
  /* 'move' 액션은 메뉴에서 제거됨 — nav-item 꾹누르기+드래그로 직접 수행 */
}

/* ============ NAV MOVE MODE (§6-9) ============
   이동 선택 → 해당 item scale 1.02 + wiggle + shadow. 사용자가 item 을 다시 pointerdown 해
   드래그 시작 → pointermove 로 위치 따라 transform + 주변 item 과 자동 swap (insertBefore).
   pointerup → 원 위치 복귀 transform + 이동 모드 종료. 외부 탭 / ESC 도 종료. */
const navTrackEl = document.getElementById('navTrack');
let navMoveState = null;

function enterNavMoveMode(item) {
  if (navMoveState) return;
  navMoveState = { item, dragStartX: 0, dragging: false, pointerId: null };
  item.classList.add('is-moving');
  navTrackEl.classList.add('move-mode');
  haptic('medium');
  toast('드래그해서 순서 이동 · 바깥 탭으로 완료');
  item.addEventListener('pointerdown', onMovePointerDown);
  /* 외부 탭 감지 (한 프레임 후 등록해 현재 이벤트 루프와 충돌 방지) */
  setTimeout(() => {
    document.addEventListener('pointerdown', onMoveOutsideTap, true);
  }, 0);
}

function exitNavMoveMode() {
  if (!navMoveState) return;
  const { item } = navMoveState;
  item.classList.remove('is-moving', 'is-drag-active');
  item.style.transform = '';
  item.style.transition = '';
  item.removeEventListener('pointerdown', onMovePointerDown);
  navTrackEl.classList.remove('move-mode');
  document.removeEventListener('pointerdown', onMoveOutsideTap, true);
  window.removeEventListener('pointermove', onMovePointerMove);
  window.removeEventListener('pointerup', onMovePointerUp);
  navMoveState = null;
}

function onMoveOutsideTap(e) {
  if (!navMoveState) return;
  /* 이동 중인 item 또는 그 자식이면 통과 */
  if (navMoveState.item.contains(e.target)) return;
  exitNavMoveMode();
}

function onMovePointerDown(e) {
  if (!navMoveState) return;
  e.preventDefault();
  e.stopPropagation();
  navMoveState.dragStartX = e.clientX;
  navMoveState.pointerId = e.pointerId;
  navMoveState.dragging = true;
  navMoveState.item.classList.add('is-drag-active');
  window.addEventListener('pointermove', onMovePointerMove);
  window.addEventListener('pointerup', onMovePointerUp, { once: true });
}

function onMovePointerMove(e) {
  if (!navMoveState || !navMoveState.dragging) return;
  const item = navMoveState.item;
  item.style.transform = `translate3d(${e.clientX - navMoveState.dragStartX}px,0,0) scale(1.02)`;
  performNavSwap(e.clientX, item, (delta) => { navMoveState.dragStartX += delta; });
  item.style.transform = `translate3d(${e.clientX - navMoveState.dragStartX}px,0,0) scale(1.02)`;
}

function onMovePointerUp() {
  if (!navMoveState) return;
  window.removeEventListener('pointermove', onMovePointerMove);
  /* 드롭 애니메이션 — 원래 위치 (transform none) 로 부드럽게 */
  const item = navMoveState.item;
  item.style.transition = 'transform 220ms var(--ease)';
  item.classList.remove('is-drag-active');
  item.style.transform = '';
  navMoveState.dragging = false;
  setTimeout(() => {
    /* 드롭 후 이동 모드 자동 종료 (사용자 체감: "한 번 드래그 = 한 번 reorder") */
    exitNavMoveMode();
  }, 240);
}

function performComplete(item) {
  /* is-current 이거나 is-hold → 해당 운동의 모든 세트를 done 처리 + nav 를 is-done 으로.
     snapshot 에도 반영. 현재 표시 중이었으면 loadExercise 로 readonly 전환도 가능하지만,
     §6-8 "다른 운동 탭 = 이동, 완료 아님" 반대 방향이므로 완료 후 nav 만 is-done 으로 두고
     카드는 다음 is-pending 또는 남은 is-hold 로 자동 전환. */
  const name = item.dataset.name;
  const snap = state.exerciseStates[name];
  if (name === state.exerciseName) {
    /* 현재 active 운동 — sets 를 전부 done 으로 */
    state.sets.forEach(s => { s.done = true; });
    snapshotCurrentExercise();
    /* 다음 이동 대상 — 첫 번째 is-pending 또는 is-hold */
    const next = document.querySelector('.nav-item.is-pending, .nav-item.is-hold');
    item.classList.remove('is-current', 'is-hold');
    item.classList.add('is-done');
    delete item.dataset.hold;
    if (next) {
      next.classList.remove('is-pending', 'is-hold');
      delete next.dataset.hold;
      next.classList.add('is-current');
      loadExercise(next.dataset.name, { readonly: false });
    } else {
      /* 다른 운동 없음 — 그냥 done 표시된 현재 카드 읽기 전용 */
      loadExercise(name, { readonly: true });
    }
  } else if (snap) {
    /* 다른 nav (보류) — snapshot 데이터 전체 done */
    snap.sets.forEach(s => { s.done = true; });
    item.classList.remove('is-hold', 'is-current', 'is-pending');
    item.classList.add('is-done');
    delete item.dataset.hold;
  } else {
    /* snapshot 없으면 기본값으로 done 처리 (is-pending 이었던 경우는 애초에 완료 메뉴 없음 — 방어적) */
    item.classList.remove('is-current', 'is-hold', 'is-pending');
    item.classList.add('is-done');
  }
  toast(`${name} 완료`);
  haptic('medium');
}

function performDelete(item) {
  const name = item.dataset.name;
  const wasCurrent = item.classList.contains('is-current');
  /* snapshot 제거 */
  if (state.exerciseStates[name]) delete state.exerciseStates[name];
  item.remove();
  if (wasCurrent) {
    /* 다음 운동으로 자동 이동 — 우선순위: 첫 번째 is-hold > is-pending > is-done(readonly) */
    const nextHold    = document.querySelector('.nav-item.is-hold');
    const nextPending = document.querySelector('.nav-item.is-pending');
    const nextDone    = document.querySelector('.nav-item.is-done');
    const next = nextHold || nextPending || nextDone;
    if (next) {
      if (next.classList.contains('is-done')) {
        loadExercise(next.dataset.name, { readonly: true });
      } else {
        next.classList.remove('is-pending', 'is-hold');
        delete next.dataset.hold;
        next.classList.add('is-current');
        loadExercise(next.dataset.name, { readonly: false });
      }
    }
  }
  toast(`${name} 삭제됨`);
  haptic('medium');
}

function performEditDone(item) {
  /* is-done → is-current 로 승격 + readonly off. 이전 current 는 is-hold 로. */
  const name = item.dataset.name;
  const oldCurrent = document.querySelector('.nav-item.is-current');
  if (oldCurrent && oldCurrent !== item) {
    snapshotCurrentExercise();
    oldCurrent.classList.remove('is-current');
    oldCurrent.classList.add('is-hold');
    applyNavHoldLabel(oldCurrent);
  }
  item.classList.remove('is-done');
  item.classList.add('is-current');
  loadExercise(name, { readonly: false });
  toast(`${name} 편집 모드`);
}

/* 동적 추가 경로의 long-press 바인딩은 원 함수를 직접 수정 (아래 참조) */

/* ============ ADD-EX SHEET (§6-2) ============
   부위 chip 7개 · 부위별 종목 리스트.
   §6-10 준수: DOM 1회 렌더 후 hidden/class 토글만. 재마운트 없음. */
const BODY_PARTS = ['가슴', '등', '어깨', '하체', '팔', '코어', '유산소'];
const EX_BY_PART = {
  '가슴':   ['벤치프레스', '인클라인 벤치', '덤벨플라이', '딥스'],
  '등':     ['데드리프트', '풀업', '바벨로우', '랫풀다운'],
  '어깨':   ['오버헤드프레스', '사이드레터럴', '페이스풀'],
  '하체':   ['스쿼트', '레그프레스', '레그컬', '카프레이즈'],
  '팔':     ['바벨컬', '덤벨컬', '트라이셉스 익스텐션'],
  '코어':   ['싯업', '레그 레이즈', '플랭크'],
  '유산소': ['트레드밀', '사이클']
};
/* 운동별 이전 세션 기본값 (프로토타입) — 실 앱에선 마지막 기록에서 로드.
   w: 중량(kg), r: 횟수, d: 시간(분). w: null 은 맨몸.
   isTime: true 는 시간 단독 운동 (플랭크 등) — cardio 카드 재활용 + 거리 필드 숨김. */
const EX_DEFAULTS = {
  '벤치프레스':        { w: 60, r: 10 },
  '인클라인 벤치':     { w: 50, r: 10 },
  '덤벨플라이':        { w: 14, r: 12 },
  '딥스':              { w: null, r: 10 },
  '데드리프트':        { w: 100, r: 8 },
  '풀업':              { w: null, r: 8 },
  '바벨로우':          { w: 60, r: 10 },
  '랫풀다운':          { w: 50, r: 12 },
  '오버헤드프레스':    { w: 40, r: 10 },
  '사이드레터럴':      { w: 8, r: 15 },
  '페이스풀':          { w: 20, r: 12 },
  '스쿼트':            { w: 80, r: 10 },
  '레그프레스':        { w: 120, r: 12 },
  '레그컬':            { w: 40, r: 15 },
  '카프레이즈':        { w: 60, r: 15 },
  '바벨컬':            { w: 30, r: 10 },
  '덤벨컬':            { w: 12, r: 12 },
  '트라이셉스 익스텐션': { w: 12, r: 10 },
  '싯업':              { w: null, r: 15 },
  '레그 레이즈':       { w: null, r: 15 },
  '플랭크':            { d: 2, isTime: true },
  '트레드밀':          { d: 30, km: 3.2 },
  '사이클':            { d: 30, km: 10 },
};
function exMetaString(name) {
  const d = EX_DEFAULTS[name];
  if (!d) return '';
  if (d.d != null) return `${d.d}분`;
  if (d.w == null) return `맨몸 · ${d.r}회`;
  return `${d.w}kg × ${d.r}회`;
}

const addExSheet = document.getElementById('addExSheet');
const addexChipsEl = document.getElementById('addexChips');
const addexListEl = document.getElementById('addexList');

/* 세션 내 상태: 현재 선택된 부위 */
const addExState = {
  activePart: '가슴',
};

/* 초기 1회 렌더 — chip 7개 + 부위별 그룹 7개 모두 DOM 에 생성 */
(function initAddExSheet() {
  /* chip — chips 컨테이너에 append */
  BODY_PARTS.forEach(part => {
    const btn = document.createElement('button');
    btn.className = 'addex-chip';
    btn.dataset.part = part;
    btn.textContent = part;
    btn.addEventListener('click', () => setActivePart(part));
    addexChipsEl.appendChild(btn);
  });

  /* 가로 스크롤 fade 힌트 토글 — 스크롤 끝까지 가면 mask 제거 */
  const updateScrollEnd = () => {
    const maxScroll = addexChipsEl.scrollWidth - addexChipsEl.clientWidth;
    const atEnd = maxScroll <= 1 || addexChipsEl.scrollLeft >= maxScroll - 1;
    addexChipsEl.classList.toggle('is-scroll-end', atEnd);
  };
  addexChipsEl.addEventListener('scroll', updateScrollEnd, { passive: true });
  /* 초기 상태 + 리사이즈 대응 */
  window.addEventListener('resize', updateScrollEnd);
  requestAnimationFrame(updateScrollEnd);

  /* 부위별 종목 그룹 (전부 pre-render, hidden 토글만) */
  BODY_PARTS.forEach(part => {
    const group = document.createElement('div');
    group.className = 'addex-group';
    group.dataset.part = part;
    EX_BY_PART[part].forEach(ex => {
      const item = document.createElement('button');
      item.className = 'addex-item';
      item.dataset.ex = ex;
      item.innerHTML = `
        <span class="ex-main">
          <span class="ex-name">${ex}</span>
          <span class="ex-meta">${exMetaString(ex)}</span>
        </span>
        <span class="ex-toggle" aria-hidden="true"></span>
      `;
      item.addEventListener('click', () => onAddExItemTap(ex, item));
      group.appendChild(item);
    });
    addexListEl.appendChild(group);
  });
})();

function setActivePart(part) {
  addExState.activePart = part;
  /* chip active 클래스 토글 */
  let activeBtn = null;
  addexChipsEl.querySelectorAll('.addex-chip').forEach(c => {
    const isActive = c.dataset.part === part;
    c.classList.toggle('is-active', isActive);
    if (isActive) activeBtn = c;
  });
  /* active chip 이 가로 스크롤 영역 밖이면 chips 컨테이너만 내부 스크롤.
     scrollIntoView 는 ancestor 전부 스크롤해서 sheet transform 전환을 끊어버리므로 사용 금지. */
  if (activeBtn) {
    const cRect = addexChipsEl.getBoundingClientRect();
    const bRect = activeBtn.getBoundingClientRect();
    const bLeftIn = bRect.left - cRect.left + addexChipsEl.scrollLeft;
    const target = bLeftIn - (cRect.width - bRect.width) / 2;
    addexChipsEl.scrollTo({ left: Math.max(0, target), behavior: 'smooth' });
  }
  /* 그룹 hidden 토글 */
  addexListEl.querySelectorAll('.addex-group').forEach(g => {
    g.hidden = g.dataset.part !== part;
  });
}

function isExerciseInSession(name) {
  return Array.from(document.querySelectorAll('.nav-item'))
    .some(el => el.dataset.name === name);
}

function onAddExItemTap(ex, itemEl) {
  if (itemEl.classList.contains('is-added')) {
    /* 제거 요청 — 진행/완료 기록 있으면 2단계 확인, 없으면 즉시 */
    if (hasExerciseProgress(ex)) {
      openConfirm(
        `${ex} 제거`,
        '이미 기록된 세트가 있습니다. 제거하면 함께 삭제됩니다.',
        () => removeExerciseFromSession(ex, itemEl),
        '제거'
      );
    } else {
      removeExerciseFromSession(ex, itemEl);
    }
    return;
  }
  /* 추가 — addExerciseToSession 내부에서 유산소·중복 체크 */
  const added = addExerciseToSession(ex);
  if (added) {
    itemEl.classList.add('is-added');
    /* 시트 닫지 않음 — 다중 추가 자유 (사용자 피드백 2026-04-22) */
  }
}

/* 해당 운동에 세트 기록이 있는지 — 제거 confirm 판정용 */
function hasExerciseProgress(name) {
  if (name === state.exerciseName) {
    return state.sets.some(s => s.done);
  }
  const snap = state.exerciseStates[name];
  return !!(snap && snap.sets && snap.sets.some(s => s.done));
}

/* 토글 경로의 제거 — nav-item + snapshot 정리 + is-added 해제 */
function removeExerciseFromSession(name, itemEl) {
  const navItem = Array.from(document.querySelectorAll('.nav-item'))
    .find(el => el.dataset.name === name);
  if (navItem) {
    const wasCurrent = navItem.classList.contains('is-current');
    if (state.exerciseStates[name]) delete state.exerciseStates[name];
    navItem.remove();
    if (wasCurrent) {
      /* 다음 운동 승계 — performDelete 와 동일 규칙 */
      const next = document.querySelector('.nav-item.is-hold')
                || document.querySelector('.nav-item.is-pending')
                || document.querySelector('.nav-item.is-done');
      if (next) {
        if (next.classList.contains('is-done')) {
          loadExercise(next.dataset.name, { readonly: true });
        } else {
          next.classList.remove('is-pending', 'is-hold');
          delete next.dataset.hold;
          next.classList.add('is-current');
          loadExercise(next.dataset.name, { readonly: false });
        }
      }
    }
  }
  if (itemEl) itemEl.classList.remove('is-added');
  toast(`${name} 제거됨`);
  haptic('medium');
}

/* 종목을 세션 nav 에 추가. 성공 시 true, 스킵 시 false.
   Wave 11.18 — SPA hijack 시 IIFE 로 wrap 되므로 외부(session.js) 호출 위해 window 노출. */
window.addExerciseToSession = addExerciseToSession;
window.removeExerciseFromSession = removeExerciseFromSession;
function addExerciseToSession(name) {
  /* 중복 방지 */
  const exists = Array.from(document.querySelectorAll('.nav-item'))
    .some(el => el.dataset.name === name);
  if (exists) {
    toast(`이미 추가됨: ${name}`);
    return false;
  }
  /* 유산소 종목은 별도 카드(§6-4) — 기본 중량/세트 없이 nav 에만 is-pending 으로 추가 */
  /* nav 에 is-pending 으로 추가 — "+" 앞에 삽입.
     단 빈 세션 상태 (navTrack 비어있음) 에서 첫 추가는 즉시 is-current 승격 +
     placeholder 해제 + 카드 로드 + 세션 시작 (spec §6-1 "첫 운동 = startTime"). */
  const navTrack = document.getElementById('navTrack');
  const isFirstAdd = navTrack.children.length === 0;
  const item = document.createElement('button');
  item.className = isFirstAdd ? 'nav-item is-current' : 'nav-item is-pending';
  item.dataset.name = name;
  item.textContent = name;
  navTrack.appendChild(item);
  bindNavItem(item);
  if (typeof attachNavLongPressOnce === 'function') attachNavLongPressOnce(item);
  if (isFirstAdd) {
    const appEl = document.getElementById('sessionApp');
    if (appEl?.dataset.emptySession) delete appEl.dataset.emptySession;
    loadExercise(name, { readonly: false });
    startSessionIfNeeded();
  }
  /* Wave D — 첫·둘째 모두 새 item 을 nav 가운데 정렬 (이전: 둘째+ 는 우측 끝 스크롤로 잘림). */
  scrollNavTo(item);
  toast(`추가됨: ${name}`);
  return true;
}

/* 세션에 이미 있는 종목 반영 — 시트 열릴 때마다 재계산.
   SPA 모드: addex-item data-ex=영문ID + data-name=한국어, nav-item data-name=한국어 → data-name 으로 매칭.
   mocks-only 모드: addex-item data-ex=한국어 (data-name 없음) → fallback. */
function syncAddExAddedUI() {
  addexListEl.querySelectorAll('.addex-item').forEach(item => {
    const matchKey = item.dataset.name || item.dataset.ex;
    item.classList.toggle('is-added', isExerciseInSession(matchKey));
  });
}

function openAddExSheet() {
  resetAddExState();
  syncAddExAddedUI();
  showSheet(addExSheet);
}

function resetAddExState() {
  addExState.activePart = '가슴';
  setActivePart('가슴');
}

// 프로토타입: 내장 바텀시트 사용 (§6-2). 독립 picker.html 은 레퍼런스로 별도 유지
document.getElementById('navAdd').addEventListener('click', openAddExSheet);

/* ============ TOAST / HAPTIC ============ */
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1600);
}
function haptic(strength) {
  if (navigator.vibrate) navigator.vibrate(strength === 'medium' ? 12 : 6);
}

/* ============ NAV CURRENT AUTO-SCROLL ============
   scrollIntoView 는 ancestor 전부 스크롤 (§6-10 sheet transform 깨짐) → track 수평만 조작.
   실기 iOS Safari 는 scrollTo smooth 지원, preview iframe 은 smooth 작동 안 함 → fallback 병행.
   Wave 11.6.1: 중앙 기준을 footer-nav 전체 (nav-add 포함) 로 계산 → nav-add 좌측 shift 보정. */
function scrollNavTo(item) {
  if (!item) return;
  const track = document.getElementById('navTrack');
  if (!track) return;
  const footer = track.parentElement; // .footer-nav (nav-add 포함 영역)
  const footerRect = footer.getBoundingClientRect();
  const trackRect = track.getBoundingClientRect();
  const itRect = item.getBoundingClientRect();
  /* getBoundingClientRect 기반 계산 — offsetLeft 는 position:static track 에서 ancestor 기준이라 부정확.
     item 의 현재 track 내부 offset = (itRect - trackRect) + 현재 scrollLeft (scroll 반영) */
  const itemCenterInTrack = (itRect.left - trackRect.left + track.scrollLeft) + itRect.width / 2;
  const centerInTrack = (footerRect.left + footerRect.width / 2) - trackRect.left;
  const desired = itemCenterInTrack - centerInTrack;
  const max = track.scrollWidth - track.clientWidth;
  const clamped = Math.max(0, Math.min(max, desired));
  const before = track.scrollLeft;
  try { track.scrollTo({ left: clamped, behavior: 'smooth' }); } catch (_) {}
  /* 200ms 후에도 이동 없으면 instant 할당 (preview fallback) */
  setTimeout(() => {
    if (Math.abs(track.scrollLeft - before) < 1 && Math.abs(track.scrollLeft - clamped) > 1) {
      track.scrollLeft = clamped;
    }
  }, 200);
}

function scrollNavToCurrent() {
  scrollNavTo(document.querySelector('.nav-item.is-current'));
}

/* ============ INIT ============ */
/* SPA·일반 진입 시 정적 demo state 무효화. 디자이너 검토는 #design hash 로 demo 보존. */
const _designMode = location.hash === '#design';
if (!_designMode) {
  state.exerciseName = '';
  state.sets = [];
  state.currentIdx = 0;
  state.exerciseStates = {};
}
if (_designMode) {
  /* nav 정적 마크업 (스쿼트=done, 데드=hold ·3/5) 과 일치하도록 pre-seed */
  state.exerciseStates['데드리프트'] = {
    sets: [
      { weight: 100, reps: 8, done: true,  preset: false, pr: false },
      { weight: 100, reps: 8, done: true,  preset: false, pr: false },
      { weight: 100, reps: 8, done: true,  preset: false, pr: false },
      { weight: 100, reps: 8, done: false, preset: true,  pr: false },
      { weight: 100, reps: 8, done: false, preset: true,  pr: false },
    ],
    currentIdx: 3,
    prevExerciseVolume: 3200,
    prevBestE1rm: 140,
  };
}
renderCards();
updateProgress();
scrollNavToCurrent();

/* Wave 11.9.1 — SPA hijack (window.gymSession 노출 시 admin/profile 패턴 답습) */
if (window.gymSession) {
  window.gymSession.mountSessionView().catch(e => console.error('[gym] mountSessionView init', e));
}

/* Wave 11.18 — active session blocks 로 nav-item hydrate.
   blocks 가 비어있으면 부위 선택 시트 자동 open (사용자 요구 박제 — spec §6-1 보강 예정).
   mocks 단독 (window.gymQueries 미노출) 환경은 빈 nav 로 시작 + 시트 자동 open. */
(async () => {
  let blocks = [];
  if (window.gymQueries?.getActiveSession) {
    try {
      const session = await window.gymQueries.getActiveSession();
      blocks = (session?.blocks || []).filter(b => b && b.type === 'single' && b.exerciseId);
      if (blocks.length) {
        const customs = window.gymQueries.listCustomExercises
          ? await window.gymQueries.listCustomExercises()
          : [];
        for (const block of blocks) {
          const builtin = window.gymExercises?.getBuiltinExercise?.(block.exerciseId);
          const c = customs.find(x => x.id === block.exerciseId);
          const name = builtin?.name || c?.name;
          if (name) addExerciseToSession(name);
        }
      }
    } catch (e) {
      console.error('[mocks/session] hydrateNav', e);
    }
  }
  if (!blocks.length) {
    /* Wave 11.18 — 빈 세션: 메인 영역 hide + placeholder 노출 + 부위 시트 자동 open. */
    const appEl = document.getElementById('sessionApp');
    if (appEl) appEl.dataset.emptySession = '1';
    if (typeof openAddExSheet === 'function') openAddExSheet();
  }
})();

/* Wave 11.16 — §8 30초 timer + visibilitychange auto-save (좌 스와이프/키패드 hook 외 변경 backstop) */
function dumpStateToSPA() {
  if (!window.gymSession?.dumpActiveSessionFromState) return;
  if (state.sessionEnded) return; // 종료 후엔 dump 의도 없음
  window.gymSession.dumpActiveSessionFromState({
    exerciseName: state.exerciseName,
    sets: state.sets,
    exerciseStates: state.exerciseStates,
  }).catch(e => console.error('[gym] dumpActiveSessionFromState', e));
}
/* Wave C — 동일하게 autoSave interval 도 mount 누적 방지. */
if (window.__gymAutoSaveInterval) clearInterval(window.__gymAutoSaveInterval);
window.__gymAutoSaveInterval = setInterval(dumpStateToSPA, 30_000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') dumpStateToSPA();
});
</script>
