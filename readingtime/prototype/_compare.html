<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>리딩타임 스펙↔프로토타입 기계 대조 하네스</title>
<style>
body{margin:0;font:12px/1.5 monospace;background:#111;color:#ddd;display:flex;gap:8px;padding:8px}
iframe{border:1px solid #444;width:400px;height:860px;flex:none;background:#fff}
#log{flex:1;white-space:pre-wrap;overflow:auto;height:95vh}
</style>
</head>
<body>
<iframe id="spec"></iframe>
<iframe id="proto"></iframe>
<div id="log"></div>
<script>
'use strict';

const SUBS = {
  '{{ userInitial }}': '지', '{{ streak }}': '12',
  '{{ tH }}': '00', '{{ tM }}': '26', '{{ tS }}': '14',
};
const LABELS = {
  '01': '01 로그인', '02': '02 홈', '03': '03 엎기 시작 대기', '04': '04 엎기 일시정지',
  '05': '05 탭 모드 기록 중', '06': '06 세션 완료', '07': '07 시간 직접 추가', '08': '08 책 상세',
  '09': '09 완독', '10': '10 기록 주간', '11': '11 기록 월간', '12': '12 서재',
  '13': '13 책 추가', '14': '14 홈 빈 상태',
};
/* 시트 화면: 시안 쪽 스테이징 배경(스켈레톤) ≠ 프로토 실화면(별도 검증됨) → 시트 루트만 대조 */
const SHEET_SCREENS = ['07', '09', '13'];
/* 프로토 전용 오버레이(베젤 재현 요소) 제외 */
const PROTO_EXCLUDE = '.statusbar,.notch,.grain,.home-indicator';

const specIf = document.getElementById('spec');
const protoIf = document.getElementById('proto');
const logEl = document.getElementById('log');
const log = s => { logEl.textContent += s + '\n'; };

const SPEC_DOC = (keyframes) => `<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&family=Poppins:wght@600&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#e6e2d7;font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.005em;word-break:keep-all}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
${keyframes}
#stage{width:390px;height:844px;position:relative;overflow:hidden}
</style></head><body><div id="stage"></div></body></html>`;

function el(win, sel) { return win.document.querySelector(sel); }

function injectAnimOff(win, on) {
  let s = el(win, '#__animoff');
  if (on && !s) {
    s = win.document.createElement('style');
    s.id = '__animoff';
    s.textContent = '*{animation:none!important;transition:none!important}';
    win.document.head.appendChild(s);
  } else if (!on && s) s.remove();
}

/* 텍스트·박스 인벤토리 (지오메트리 — 애니메이션 OFF 상태에서 호출) */
function collect(win, root, excludeSel) {
  const doc = win.document;
  const origin = root.getBoundingClientRect();
  const excluded = e => excludeSel && e.closest(excludeSel);
  const texts = [], boxes = [];
  const walker = doc.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = walker.nextNode())) {
    const t = n.textContent.replace(/\s+/g, ' ').trim();
    if (!t) continue;
    const e = n.parentElement;
    if (!e || excluded(e)) continue;
    const range = doc.createRange();
    range.selectNodeContents(n);
    const r = range.getBoundingClientRect();
    if (r.width === 0 && r.height === 0) continue;
    const cs = win.getComputedStyle(e);
    if (cs.display === 'none' || cs.visibility === 'hidden') continue;
    texts.push({
      t,
      x: +(r.left - origin.left).toFixed(1), y: +(r.top - origin.top).toFixed(1),
      fs: cs.fontSize, fw: cs.fontWeight, col: cs.color,
      fam: cs.fontFamily.split(',')[0].replace(/["']/g, '').trim(), ls: cs.letterSpacing,
    });
  }
  for (const e of root.querySelectorAll('*')) {
    if (excluded(e)) continue;
    const cs = win.getComputedStyle(e);
    if (cs.display === 'none' || cs.visibility === 'hidden') continue;
    const hasBg = cs.backgroundColor !== 'rgba(0, 0, 0, 0)' || cs.backgroundImage !== 'none';
    const hasBorder = parseFloat(cs.borderTopWidth) > 0 && cs.borderTopStyle !== 'none';
    const hasShadow = cs.boxShadow !== 'none';
    if (!hasBg && !hasBorder && !hasShadow) continue;
    const r = e.getBoundingClientRect();
    if (r.width < 1 || r.height < 1) continue;
    boxes.push({
      x: +(r.left - origin.left).toFixed(1), y: +(r.top - origin.top).toFixed(1),
      w: +r.width.toFixed(1), h: +r.height.toFixed(1),
      bg: cs.backgroundColor, bgi: cs.backgroundImage === 'none' ? '-' : cs.backgroundImage,
      br: cs.borderRadius, bw: cs.borderTopWidth, bc: cs.borderTopColor, bs: cs.borderTopStyle,
      sh: cs.boxShadow === 'none' ? '-' : cs.boxShadow,
    });
  }
  return { texts, boxes };
}

/* 애니메이션 선언 멀티셋 (애니메이션 ON 상태 — 선언값은 위상 무관) */
function collectAnims(win, root, excludeSel) {
  const excluded = e => excludeSel && e.closest(excludeSel);
  const out = [];
  for (const e of root.querySelectorAll('*')) {
    if (excluded(e)) continue;
    const cs = win.getComputedStyle(e);
    if (cs.animationName === 'none' || cs.display === 'none') continue;
    const names = cs.animationName.split(', ');
    const durs = cs.animationDuration.split(', ');
    const delays = cs.animationDelay.split(', ');
    const tfs = cs.animationTimingFunction.split(/, (?![^(]*\))/);
    const iters = cs.animationIterationCount.split(', ');
    names.forEach((nm, i) => out.push(`${nm}|${durs[i % durs.length]}|${delays[i % delays.length]}|${tfs[i % tfs.length]}|${iters[i % iters.length]}`));
  }
  return out.sort();
}

function diffTexts(spec, proto, tol) {
  const problems = [];
  const key = o => o.t;
  const group = arr => {
    const m = new Map();
    arr.forEach(o => { const k = key(o); if (!m.has(k)) m.set(k, []); m.get(k).push(o); });
    for (const v of m.values()) v.sort((a, b) => a.y - b.y || a.x - b.x);
    return m;
  };
  const gs = group(spec), gp = group(proto);
  for (const [k, ss] of gs) {
    const ps = gp.get(k) || [];
    if (ps.length !== ss.length) problems.push(`텍스트 개수 "${k}": 스펙 ${ss.length} vs 프로토 ${ps.length}`);
    const n = Math.min(ss.length, ps.length);
    for (let i = 0; i < n; i++) {
      const s = ss[i], p = ps[i], d = [];
      if (Math.abs(s.x - p.x) > tol || Math.abs(s.y - p.y) > tol) d.push(`위치 (${s.x},${s.y})→(${p.x},${p.y})`);
      if (s.fs !== p.fs) d.push(`fontSize ${s.fs}→${p.fs}`);
      if (s.fw !== p.fw) d.push(`fontWeight ${s.fw}→${p.fw}`);
      if (s.col !== p.col) d.push(`color ${s.col}→${p.col}`);
      if (s.fam !== p.fam) d.push(`family ${s.fam}→${p.fam}`);
      if (s.ls !== p.ls) d.push(`letterSpacing ${s.ls}→${p.ls}`);
      if (d.length) problems.push(`"${k}"[${i}]: ${d.join(' / ')}`);
    }
  }
  for (const [k, ps] of gp) if (!gs.has(k)) problems.push(`프로토 전용 텍스트 "${k}" ×${ps.length}`);
  return problems;
}

function diffBoxes(spec, proto, tol) {
  const problems = [];
  const used = new Set();
  for (const s of spec) {
    let best = -1, bestDist = 1e9;
    proto.forEach((p, i) => {
      if (used.has(i)) return;
      if (p.bg !== s.bg || p.bgi !== s.bgi) return;
      if (Math.abs(p.w - s.w) > 3 || Math.abs(p.h - s.h) > 3) return;
      const dist = Math.abs(p.x - s.x) + Math.abs(p.y - s.y);
      if (dist < bestDist) { bestDist = dist; best = i; }
    });
    if (best === -1 || bestDist > tol * 2) {
      problems.push(`스펙 박스 미매칭 (${s.x},${s.y} ${s.w}×${s.h} bg:${s.bg} bgi:${s.bgi.slice(0, 60)} br:${s.br} sh:${s.sh.slice(0, 50)})${best !== -1 ? ` — 최근접 거리 ${bestDist.toFixed(1)}` : ''}`);
      continue;
    }
    used.add(best);
    const p = proto[best], d = [];
    if (p.br !== s.br) d.push(`radius ${s.br}→${p.br}`);
    const sVisible = s.bs !== 'none' && parseFloat(s.bw) > 0;
    const pVisible = p.bs !== 'none' && parseFloat(p.bw) > 0;
    if ((sVisible || pVisible) && (p.bw !== s.bw || p.bc !== s.bc || p.bs !== s.bs)) d.push(`border ${s.bw} ${s.bs} ${s.bc} → ${p.bw} ${p.bs} ${p.bc}`);
    if (p.sh !== s.sh) d.push(`shadow ${s.sh.slice(0, 60)} → ${p.sh.slice(0, 60)}`);
    if (d.length) problems.push(`박스 (${s.x},${s.y} ${s.w}×${s.h}): ${d.join(' / ')}`);
  }
  return problems;
}

function diffAnims(spec, proto) {
  const problems = [];
  const count = arr => { const m = new Map(); arr.forEach(a => m.set(a, (m.get(a) || 0) + 1)); return m; };
  const ms = count(spec), mp = count(proto);
  for (const [k, c] of ms) { const pc = mp.get(k) || 0; if (pc < c) problems.push(`애니메이션 부족 ${k}: 스펙 ${c} vs 프로토 ${pc}`); }
  for (const [k, c] of mp) { const sc = ms.get(k) || 0; if (c > sc) problems.push(`애니메이션 초과 ${k}: 스펙 ${sc} vs 프로토 ${c}`); }
  return problems;
}

function loadFrame(iframe, src) {
  return new Promise(res => { iframe.onload = () => res(); iframe.src = src; });
}
function loadSrcdoc(iframe, html) {
  return new Promise(res => { iframe.onload = () => res(); iframe.srcdoc = html; });
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fontsReady = (win, ms = 4000) => Promise.race([win.document.fonts.ready, sleep(ms)]);
const mark = s => { window.__stage = s; };

async function buildSpec(nn) {
  const kf = await (await fetch('../design-ref/v3/mockups/frames/_keyframes.css')).text();
  const keyframes = kf.split('\n').filter(l => l.startsWith('@keyframes')).join('\n');
  let raw = await (await fetch(`../design-ref/v3/mockups/frames/${nn}.html`)).text();
  let m = raw.match(/<x-import[^>]*>([\s\S]*?)<\/x-import>/);
  if (!m) throw new Error('x-import not found');
  let content = m[1];
  for (const [k, v] of Object.entries(SUBS)) content = content.split(k).join(v);
  content = content.replace(/<sc-for[\s\S]*?<\/sc-for>/g, ''); // 11 캘린더 템플릿 — 별도 대조
  mark('spec:srcdoc');
  await loadSrcdoc(specIf, SPEC_DOC(keyframes));
  specIf.contentWindow.document.getElementById('stage').innerHTML = content;
  mark('spec:fonts');
  await fontsReady(specIf.contentWindow);
  return specIf.contentWindow;
}

const PROTO_SETUP = {
  '04': "startSession('flip'); state.session.status='paused'; state.screen='04'; render();",
  '05': "startSession('tap'); state.screen='05'; render(); stopTick();",
  '06': "startSession('flip'); state.session.status='paused'; state.screen='06'; render();",
};

async function buildProto(nn) {
  mark('proto:load');
  // HTTP 캐시 갱신 (편집 직후 stale css/js 방지)
  await fetch('./styles.css', { cache: 'reload' });
  await fetch('./app.js', { cache: 'reload' });
  await fetch('./index.html', { cache: 'reload' });
  protoIf.src = 'about:blank';
  await sleep(30);
  await loadFrame(protoIf, `./index.html#/${nn}`);
  const win = protoIf.contentWindow;
  mark('proto:fonts');
  await fontsReady(win);
  if (PROTO_SETUP[nn]) win.eval(PROTO_SETUP[nn]);
  await sleep(80);
  mark('proto:ready');
  return win;
}

function roots(nn, specWin, protoWin) {
  if (SHEET_SCREENS.includes(nn)) {
    const stage = specWin.document.getElementById('stage');
    const specSheet = [...stage.children[0].children].reverse().find(e => {
      const cs = specWin.getComputedStyle(e);
      return cs.position === 'absolute' && (cs.borderTopLeftRadius === '26px');
    });
    return { specRoot: specSheet, protoRoot: protoWin.document.querySelector('.sheet-layer .sheet'), exclude: null };
  }
  return { specRoot: specWin.document.getElementById('stage'), protoRoot: protoWin.document.getElementById('phone'), exclude: PROTO_EXCLUDE };
}

window.compareScreen = async function (nn, tol = 1.5) {
  logEl.textContent = '';
  const specWin = await buildSpec(nn);
  const protoWin = await buildProto(nn);
  const { specRoot, protoRoot, exclude } = roots(nn, specWin, protoWin);
  if (!specRoot || !protoRoot) return { screen: nn, error: 'root not found' };

  // 애니메이션 선언 대조 (ON 상태)
  const animProblems = diffAnims(
    collectAnims(specWin, specRoot, null),
    collectAnims(protoWin, protoRoot, exclude)
  );
  // 지오메트리 대조 (OFF 상태)
  injectAnimOff(specWin, true);
  injectAnimOff(protoWin, true);
  await sleep(60);
  const s = collect(specWin, specRoot, null);
  const p = collect(protoWin, protoRoot, exclude);
  const textProblems = diffTexts(s.texts, p.texts, tol);
  const boxProblems = diffBoxes(s.boxes, p.boxes, tol);

  const result = {
    screen: `${nn} ${LABELS[nn]}`,
    counts: { specTexts: s.texts.length, protoTexts: p.texts.length, specBoxes: s.boxes.length, protoBoxes: p.boxes.length },
    textProblems, boxProblems, animProblems,
    ok: !textProblems.length && !boxProblems.length && !animProblems.length,
  };
  log(JSON.stringify(result, null, 1));
  return result;
};

window.runAll = async function (list) {
  window.__all = [];
  window.__done = false;
  for (const nn of list) {
    try { window.__all.push(await window.compareScreen(nn)); }
    catch (e) { window.__all.push({ screen: nn, error: String(e && e.stack || e) }); }
  }
  window.__done = true;
};
</script>
</body>
</html>
