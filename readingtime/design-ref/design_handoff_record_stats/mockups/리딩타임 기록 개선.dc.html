<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<meta name="design_doc_mode" content="canvas">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#e6e2d7}
  a{color:#2c4a3c}a:hover{color:#1e3529}
</style>
</helmet>
<section style="padding:64px;background:#e6e2d7;font-family:'Noto Sans KR',system-ui,sans-serif">
  <div style="display:flex;gap:56px;align-items:flex-start;flex-wrap:wrap">
    <div style="display:flex;flex-direction:column;gap:14px">
      <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;color:#9a927d">지도</span>
      <dc-import name="RTRecord" map-style="paper" initial-tab="map" streak="23" hint-size="390px,844px"></dc-import>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;color:#9a927d">월</span>
      <dc-import name="RTRecord" map-style="paper" initial-tab="month" streak="23" hint-size="390px,844px"></dc-import>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;color:#9a927d">주</span>
      <dc-import name="RTRecord" map-style="paper" initial-tab="week" streak="23" hint-size="390px,844px"></dc-import>
    </div>
  </div>
</section>
</x-dc>
</body>
</html>
