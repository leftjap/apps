# 임시 진단 — 알라딘 프록시 실응답 확인 (2026-11-02, 재확인 11:33Z). 확인 후 브랜치째 삭제.
name: diag aladin proxy
on:
  push:
    branches: [diag/aladin-proxy]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for q in '%EC%98%88%EC%88%A0%EC%9B%90' '%EC%84%9C%EC%84%B1%EC%9D%B4%EB%8B%A4'; do
            for i in 1 2; do
              url="https://tcbooffrdacfatywdzcm.supabase.co/functions/v1/aladin/ItemSearch.aspx?Query=$q&QueryType=Keyword&MaxResults=3&start=1&SearchTarget=Book&output=js&Version=20131101&Cover=Big"
              echo "=== q=$q try=$i"
              curl -sS -m 25 -D - -o resp.json -w 'HTTP %{http_code} time %{time_total}s\n' -H 'Origin: https://leftjap.github.io' "$url" | grep -iE '^HTTP|^x-|^sb-|time' || true
              head -c 600 resp.json; echo
            done
          done
