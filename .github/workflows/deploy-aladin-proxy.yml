# 알라딘(→카카오) 도서검색 프록시 배포 — pick/supabase/functions/aladin 을 Supabase(tcbooffrdacfatywdzcm)에 올리고 실응답을 검증.
# 배경(2026-11-02): 알라딘 OpenAPI 종료(10-30) 대응 코드를 고쳤는데 배포가 사용자 Mac CLI 에서만 가능해 반영이 막혔다.
#   클라우드 Claude 세션은 Supabase 접근이 막혀 있다 → 배포를 CI 로 옮긴다. 필요 secret: SUPABASE_ACCESS_TOKEN (계정 토큰).
# 트리거: main 에 함수 소스·이 워크플로 변경 push / 수동 실행(Actions 탭 Run workflow).
#   태그 트리거는 뺐다 — 클라우드 세션의 git 프록시가 태그 push 를 받지 않는다(2026-11-02).
name: deploy-aladin-proxy

on:
  push:
    branches: [main]
    paths:
      - 'pick/supabase/functions/aladin/**'
      - 'pick/supabase/config.toml'
      - '.github/workflows/deploy-aladin-proxy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-aladin-proxy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: tcbooffrdacfatywdzcm
    steps:
      - uses: actions/checkout@v4

      - name: Require SUPABASE_ACCESS_TOKEN
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::repo secret SUPABASE_ACCESS_TOKEN 미설정 — https://supabase.com/dashboard/account/tokens 에서 발급해 등록"; exit 1
          fi

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Unit tests
        run: deno test --allow-env pick/supabase/functions/aladin/index_test.ts

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy aladin
        working-directory: pick
        run: supabase functions deploy aladin --project-ref "$PROJECT_REF" --use-api

      - name: Verify live proxy (카카오 경유 결과)
        run: |
          url="https://$PROJECT_REF.supabase.co/functions/v1/aladin/ItemSearch.aspx?Query=%EC%84%9C%EC%84%B1%EC%9D%B4%EB%8B%A4&QueryType=Keyword&MaxResults=3&start=1&SearchTarget=Book&output=js&Version=20131101&Cover=Big"
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -m 20 -o resp.json -w '%{http_code}' -H 'Origin: https://leftjap.github.io' "$url" || echo 000)
            echo "try $i: HTTP $code"; head -c 400 resp.json; echo
            if [ "$code" = 200 ] && jq -e '.source == "kakao" and (.item | length) > 0' resp.json >/dev/null 2>&1; then
              echo "OK: 카카오 경유 $(jq '.item | length' resp.json)건"; exit 0
            fi
            sleep 10
          done
          echo "::error::배포 후에도 카카오 결과가 아님 (KAKAO_REST_API_KEY secret 확인)"; exit 1
