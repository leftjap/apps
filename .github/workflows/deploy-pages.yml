name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            study/pnpm-lock.yaml
            gym/pnpm-lock.yaml
            today/pnpm-lock.yaml
            book/pnpm-lock.yaml
            taste/pnpm-lock.yaml
            cue/pnpm-lock.yaml

      - name: Build gym
        env:
          GH_PAGES: '1'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          cd gym
          pnpm install --frozen-lockfile
          pnpm build
          cp dist/index.html dist/404.html

      - name: Build study
        continue-on-error: true
        env:
          GH_PAGES: '1'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          cd study
          pnpm install --frozen-lockfile
          pnpm build
          cp dist/index.html dist/404.html

      - name: Build today
        continue-on-error: true
        env:
          GH_PAGES: '1'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          cd today
          pnpm install --frozen-lockfile
          pnpm build
          cp dist/index.html dist/404.html

      - name: Build book
        continue-on-error: true
        env:
          GH_PAGES: '1'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          cd book
          pnpm install --frozen-lockfile
          pnpm build
          cp dist/index.html dist/404.html

      - name: Build taste
        continue-on-error: true
        env:
          GH_PAGES: '1'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          cd taste
          pnpm install --frozen-lockfile
          pnpm build
          cp dist/index.html dist/404.html

      - name: Build cue
        continue-on-error: true
        env:
          GH_PAGES: '1'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          cd cue
          pnpm install --frozen-lockfile
          pnpm build
          cp dist/index.html dist/404.html

      - name: Combine into _site
        run: |
          mkdir -p _site
          [ -d gym/dist ] && cp -r gym/dist _site/gym || echo "::warning::gym build missing — skipping"
          [ -d study/dist ] && cp -r study/dist _site/study || echo "::warning::study build missing — skipping"
          [ -d today/dist ] && cp -r today/dist _site/today || echo "::warning::today build missing — skipping"
          [ -d book/dist ] && cp -r book/dist _site/book || echo "::warning::book build missing — skipping"
          [ -d taste/dist ] && cp -r taste/dist _site/taste || echo "::warning::taste build missing — skipping"
          [ -d cue/dist ] && cp -r cue/dist _site/cue || echo "::warning::cue build missing — skipping"
          # 루트 index — leftjap.github.io/apps/ 진입 시 4 앱 링크 표시
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="ko"><head><meta charset="utf-8"><title>Apps</title>
          <style>body{font:16px system-ui;max-width:560px;margin:80px auto;padding:0 20px}a{display:block;padding:14px;border:1px solid #ddd;border-radius:8px;margin:8px 0;text-decoration:none;color:#111}a:hover{background:#f6f6f6}</style>
          </head><body><h1>Apps</h1>
          <a href="study/">📚 Study</a>
          <a href="gym/">💪 Gym</a>
          <a href="today/">📝 Today</a>
          <a href="book/">📖 Book</a>
          <a href="taste/">🎬 Taste</a>
          <a href="cue/">⚡ cue (런처)</a>
          </body></html>
          HTML

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
