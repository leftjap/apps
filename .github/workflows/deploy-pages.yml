name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            study/pnpm-lock.yaml
            gym/pnpm-lock.yaml
            today/pnpm-lock.yaml
            book/pnpm-lock.yaml
            pick/pnpm-lock.yaml
            cue/pnpm-lock.yaml

      # 회귀 게이트 — today 테스트 실패 시 전체 배포 차단 (2026-06-10, 가계부 점검 후속).
      # env 불필요: 스위트는 supabase mock 기반 (.env.local 부재 모드로 로컬 검증 완료).
      # TZ 고정: isoToMockDate 등 날짜 표시가 사용자 로컬 시간대(KST) 전제 — UTC 러너에서 오탐 방지.
      - name: Test today (vitest)
        env:
          TZ: Asia/Seoul
        run: |
          cd today
          pnpm install --frozen-lockfile
          pnpm vitest run

      # 회귀 게이트 확장 (2026-07-04, 데이터 정확성 사고 후속) — study(세션 타이머 activeSec)·
      # cue(어학 실학습 신호 게이트·화면시간 EXCLUDED_APPS) 회귀가 테스트 없이 배포되던 공백 차단.
      - name: Test study (vitest)
        env:
          TZ: Asia/Seoul
        run: |
          cd study
          pnpm install --frozen-lockfile
          pnpm vitest run

      - name: Test cue (vitest)
        env:
          TZ: Asia/Seoul
        run: |
          cd cue
          pnpm install --frozen-lockfile
          pnpm vitest run

      - name: Build gym
        env:
          GH_PAGES: '1'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          cd gym
          pnpm install --frozen-lockfile
          pnpm build
          cp dist/index.html dist/404.html

      - name: Build study
        continue-on-error: true
        env:
          GH_PAGES: '1'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          cd study
          pnpm install --frozen-lockfile
          pnpm build
          cp dist/index.html dist/404.html

      - name: Build today
        continue-on-error: true
        env:
          GH_PAGES: '1'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          cd today
          pnpm install --frozen-lockfile
          pnpm build
          cp dist/index.html dist/404.html

      - name: Build book
        continue-on-error: true
        env:
          GH_PAGES: '1'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          cd book
          pnpm install --frozen-lockfile
          pnpm build
          cp dist/index.html dist/404.html

      - name: Build pick
        continue-on-error: true
        env:
          GH_PAGES: '1'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          cd pick
          pnpm install --frozen-lockfile
          pnpm build
          cp dist/index.html dist/404.html

      - name: Build cue
        continue-on-error: true
        env:
          GH_PAGES: '1'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          cd cue
          pnpm install --frozen-lockfile
          pnpm build
          cp dist/index.html dist/404.html

      - name: Combine into _site
        run: |
          mkdir -p _site
          [ -d gym/dist ] && cp -r gym/dist _site/gym || echo "::warning::gym build missing — skipping"
          [ -d study/dist ] && cp -r study/dist _site/study || echo "::warning::study build missing — skipping"
          [ -d today/dist ] && cp -r today/dist _site/today || echo "::warning::today build missing — skipping"
          [ -d book/dist ] && cp -r book/dist _site/book || echo "::warning::book build missing — skipping"
          [ -d pick/dist ] && cp -r pick/dist _site/pick || echo "::warning::pick build missing — skipping"
          [ -d cue/dist ] && cp -r cue/dist _site/cue || echo "::warning::cue build missing — skipping"
          # 정식 경로 이관 (2026-06-10): pick/dist → /apps/pick/ (vite base 도 /apps/pick/). 폴더도 taste→pick 리네임 완료.
          # 구 /apps/taste/ 는 redirect 스텁 + kill-SW — 구 SW 가 캐시된 옛 앱을 계속 서빙하는 것 차단.
          # (한 origin 을 6개 앱이 공유 → kill-SW 캐시 삭제는 /apps/taste/ 스코프 키만 한정)
          mkdir -p _site/taste
          cat > _site/taste/index.html <<'HTML'
          <!doctype html>
          <html lang="ko"><head><meta charset="utf-8"><title>Pick</title>
          <script>location.replace('/apps/pick/' + location.search + location.hash);</script>
          <meta http-equiv="refresh" content="0; url=/apps/pick/">
          </head><body><a href="/apps/pick/">Pick 앱으로 이동…</a></body></html>
          HTML
          cat > _site/taste/sw.js <<'JS'
          // self-destroying SW — 구 taste 스코프 SW 교체용. 스코프 캐시 정리 후 unregister + 열린 탭 재네비게이트.
          self.addEventListener('install', function () { self.skipWaiting(); });
          self.addEventListener('activate', function (e) {
            e.waitUntil((async function () {
              try {
                var keys = await caches.keys();
                await Promise.all(keys.filter(function (k) { return k.indexOf('/apps/taste/') !== -1; }).map(function (k) { return caches.delete(k); }));
              } catch (err) { /* noop */ }
              await self.registration.unregister();
              var cs = await self.clients.matchAll({ type: 'window' });
              cs.forEach(function (c) { try { c.navigate(c.url); } catch (err) { /* noop */ } });
            })());
          });
          JS
          # 루트 index — leftjap.github.io/apps/ 진입 시 4 앱 링크 표시
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="ko"><head><meta charset="utf-8"><title>Apps</title>
          <style>body{font:16px system-ui;max-width:560px;margin:80px auto;padding:0 20px}a{display:block;padding:14px;border:1px solid #ddd;border-radius:8px;margin:8px 0;text-decoration:none;color:#111}a:hover{background:#f6f6f6}</style>
          </head><body><h1>Apps</h1>
          <a href="study/">📚 Study</a>
          <a href="gym/">💪 Gym</a>
          <a href="today/">📝 Today</a>
          <a href="book/">📖 Book</a>
          <a href="pick/">🎬 Pick</a>
          <a href="cue/">⚡ cue (런처)</a>
          </body></html>
          HTML

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
