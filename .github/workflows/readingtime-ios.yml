# 리딩타임 iOS 검증 — GitHub 호스트 macOS 러너.
#   ① ReadingTimeKit 유닛 테스트 (macOS, Swift Testing)
#   ② iOS 시뮬레이터 빌드 + 책 추가 검색 XCUITest (검색 중·실패·다시 시도·0건·라이브 실렌더)
# 배경(2026-09-10): 클라우드 Claude 세션은 리눅스 컨테이너라 Xcode·시뮬레이터가 없다 → 시뮬레이터 검증을 CI 로.
# 스크린샷은 아티팩트(readingtime-ui-shots)로 회수. 로그에도 축소 PNG 를 base64 로 남긴다(세션에서 복원용).
name: readingtime-ios

on:
  push:
    branches: ['main', 'claude/**']
    paths: ['readingtime/**', '.github/workflows/readingtime-ios.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readingtime-ios-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: readingtime

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - name: Fetch fonts (repo 미커밋 리소스 — 없으면 앱이 assertionFailure)
        run: sh ReadingTimeKit/fetch-fonts.sh

      - name: Unit tests (ReadingTimeKit, macOS)
        working-directory: readingtime/ReadingTimeKit
        run: |
          set -o pipefail
          swift test 2>&1 | tee /tmp/swift-test.log | (grep -E "✘|✔ Test run|error:|failed|Executed" || true) | tail -40
          echo "---- new search tests ----"
          (grep -E "RTAddBookSheetTests|BookSearchTests" /tmp/swift-test.log || true) | (grep -E "✔|✘" || true) | tail -30

      - name: Pick simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available | grep -E "^ +iPhone" | head -1 | sed -E 's/^ +(iPhone[^(]*[^ (]) +\(.*/\1/')
          echo "simulator: [$NAME]"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: UI tests on simulator (책 추가 검색)
        env:
          TEST_RUNNER_RT_SHOT_DIR: /tmp/rt-shots
        run: |
          set -o pipefail
          xcodebuild test -project ReadingTime.xcodeproj -scheme ReadingTime \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -only-testing:ReadingTimeUITests/AddBookSearchUITests \
            -resultBundlePath /tmp/rt-ui.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            2>&1 | tee /tmp/xcodebuild.log | (grep -E "Test Case|error:|RT-LIVE-OUTCOME|\*\* TEST|Testing failed|Executed" || true) | tail -80

      - name: Screenshots → log (축소 PNG base64)
        if: always()
        run: |
          ls -la /tmp/rt-shots 2>/dev/null || echo "no screenshots"
          for f in /tmp/rt-shots/*.png; do
            [ -f "$f" ] || continue
            sips -Z 420 "$f" --out /tmp/small.png >/dev/null
            echo "RTSHOT-BEGIN $(basename "$f")"
            base64 -i /tmp/small.png
            echo "RTSHOT-END"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readingtime-ui-shots
          path: |
            /tmp/rt-shots
            /tmp/rt-ui.xcresult
            /tmp/xcodebuild.log
            /tmp/swift-test.log
          if-no-files-found: ignore
