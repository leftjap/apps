name: ingest-gap-check

# Private Web Push only. Never publish personal expense/card data in issues or logs.
on:
  schedule:
    - cron: '0 22 * * *'   # 매일 07:00 KST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingest-gap-check
  cancel-in-progress: false

defaults:
  run:
    working-directory: today

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: today/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check ingest health and send private warning
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-ingest-gap.mjs --notify
