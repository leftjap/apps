<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>홍대 일대 3D 지도</title>
  <style>
    :root { color-scheme: dark; font: 14px system-ui, sans-serif; background: #0b0d11; }
    body, main { margin: 0; width: 100%; height: 100dvh; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    button, footer, #status { position: absolute; padding: .55rem .8rem; background: #161b23eb; color: #eef2f6; }
    button { top: 1rem; border: 1px solid #858f9d; border-radius: .4rem; cursor: pointer; }
    #overview { right: 1rem; }
    #play { left: 1rem; }
    footer { bottom: 1rem; left: 1rem; font-size: 12px; border-radius: .25rem; pointer-events: none; }
    #status { top: 1rem; left: 1rem; margin: 0; }
  </style>
</head>
<body>
  <main>
    <canvas data-area="hongdae-district" aria-label="홍대 일대 3D 지도"></canvas>
    <p id="status" role="status">지도를 불러오는 중</p>
    <button id="overview" type="button" disabled>전체 보기</button>
    <button id="play" type="button" hidden>멈춤</button>
    <footer>국토지리정보원 수치지형도·정밀도로지도 · 브이월드 · 공원 외곽 © OpenStreetMap 기여자</footer>
  </main>
  <script type="module" src="/src/aerial/yanghwa-map.ts"></script>
</body>
</html>
