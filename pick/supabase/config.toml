# Supabase 프로젝트 설정 — pick (geo-apps 공유 프로젝트, 테이블 prefix pick_).
# Today 패턴: functions deploy 시 gateway 기본 verify_jwt=true 사고 방지로 함수별 명시.
#
# 적용:
#   supabase functions deploy pick-reco --project-ref tcbooffrdacfatywdzcm
# "다시 추천" 버튼은 edge fn 이 아니라 pick_reco_requests insert → 로컬 데몬(scripts/pick-reco-daemon.mjs)이 처리.

project_id = "tcbooffrdacfatywdzcm"

[functions.pick-reco]
# x-pick-reco-token 커스텀 헤더로 함수 본체 인증 → gateway JWT 불필요(로컬 데몬의 claude 가 토큰으로 호출).
verify_jwt = false

[functions.aladin]
# 공개 도서검색 프록시 — 클라이언트가 인증 헤더 없이 직접 fetch. ttbkey 는 secret(ALADIN_TTB_KEY) 주입.
verify_jwt = false
